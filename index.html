<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent开发</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" />
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --ink: #1b2430;
      --ink-2: #2c3644;
      --text: #1c232d;
      --muted: #5e6a78;
      --faint: #8b95a1;
      --border: #e2e6eb;
      --canvas: #eef1f5;
      --paper: #ffffff;
      --sidebar: #f4f6f8;
      --hover: #e8edf3;
      --accent: #1f6f64;
      --accent-soft: #e6f3f0;
      --accent-bar: #c9a15b;
      --link: #1a5fad;
      --code: #f3f5f8;
      --danger: #b42318;
      --ok: #1b7f37;
      --topbar-h: 52px;
      --sidebar-w: 272px;
      --radius: 8px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.75;
      color: var(--text);
      background: var(--canvas);
    }
    button, input { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .skip-link {
      position: absolute;
      left: 10px;
      top: -44px;
      z-index: 30;
      padding: 8px 12px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .skip-link:focus { top: 8px; color: #fff; }

    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, pre, kbd { font-family: var(--font-mono); }
    code {
      background: var(--code);
      padding: 0.12em 0.4em;
      border-radius: 4px;
      font-size: 0.86em;
      color: #16324a;
    }
    pre {
      background: #f6f8fb;
      padding: 14px 16px;
      overflow-x: auto;
      font-size: 0.84em;
      line-height: 1.6;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    pre code { background: transparent; padding: 0; font-size: 1em; color: inherit; }
    pre code.hljs { background: transparent; padding: 0; }
    .hljs { background: #f6f8fb; }
    kbd {
      padding: 0.05em 0.4em;
      font-size: 0.8em;
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 4px;
      background: var(--paper);
    }
    hr {
      border: 0;
      height: 1px;
      background: linear-gradient(90deg, var(--accent-bar), var(--border) 40%);
      margin: 32px 0;
    }
    blockquote {
      margin: 0 0 18px;
      padding: 10px 16px;
      color: var(--muted);
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      border-radius: 0 var(--radius) var(--radius) 0;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin: 0 0 18px;
      font-size: 14.5px;
      background: var(--paper);
    }
    table th, table td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
      vertical-align: top;
    }
    table th {
      background: #f0f3f7;
      font-weight: 650;
      color: var(--ink);
    }
    table tr:nth-child(2n) td { background: #fafbfc; }
    img { max-width: 100%; height: auto; border-radius: 6px; }

    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      background: var(--ink);
      color: #e8edf3;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 14px;
      z-index: 10;
      box-shadow: 0 1px 0 var(--accent-bar);
    }
    .topbar .brand {
      font-weight: 700;
      font-size: 15px;
      color: #fff;
      text-decoration: none;
      letter-spacing: 0.02em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .topbar .brand:hover { text-decoration: none; color: #fff; opacity: 0.88; }
    .topbar .crumb {
      color: #8b97a8;
      font-size: 12px;
      font-family: var(--font-mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    .topbar .crumb a { color: #c5ced8; }
    .topbar .crumb a:hover { color: #fff; }
    .topbar .crumb .sep { color: #6d7a8a; margin: 0 6px; }
    .topbar .menu-btn {
      display: inline-block;
      background: transparent;
      border: 1px solid #4a5564;
      color: #e8edf3;
      padding: 5px 11px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .topbar .menu-btn:hover { background: var(--ink-2); border-color: #6b7787; }
    body:not(.nav-open) .topbar .menu-btn {
      background: var(--accent-bar);
      border-color: var(--accent-bar);
      color: var(--ink);
    }

    .layout {
      display: flex;
      padding-top: var(--topbar-h);
      min-height: 100vh;
    }
    .sidebar-backdrop { display: none; }

    aside.sidebar {
      position: fixed;
      top: var(--topbar-h); bottom: 0; left: 0;
      width: var(--sidebar-w);
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 14px 0 40px;
      visibility: visible;
      transform: translateX(0);
      transition: transform 0.18s ease, visibility 0.18s ease;
    }
    body:not(.nav-open) aside.sidebar {
      transform: translateX(-100%);
      visibility: hidden;
    }
    aside.sidebar .search {
      padding: 0 12px 12px;
      position: sticky;
      top: 0;
      background: var(--sidebar);
      z-index: 1;
    }
    aside.sidebar .search input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      background: var(--paper);
      outline: none;
      color: var(--text);
    }
    aside.sidebar .search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    nav.tree { padding: 2px 8px 0; }
    nav.tree::before {
      content: "课程目录";
      display: block;
      padding: 2px 10px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--faint);
    }
    nav.tree .group { margin: 0 0 6px; }
    nav.tree .group-label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      color: var(--ink);
      user-select: none;
      border-radius: 6px;
    }
    nav.tree .group-label:hover { background: var(--hover); }
    nav.tree .group-label .toggle {
      display: inline-block;
      width: 12px;
      color: var(--faint);
      font-size: 10px;
      transition: transform 0.15s;
    }
    nav.tree .group.collapsed .toggle { transform: rotate(-90deg); }
    nav.tree .group.collapsed .children { display: none; }
    nav.tree .children {
      margin: 0 0 4px 12px;
      border-left: 2px solid #dbe2ea;
      padding-left: 8px;
    }
    nav.tree a.item {
      display: block;
      padding: 6px 10px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
      text-decoration: none;
      border-radius: 6px;
    }
    nav.tree a.item:hover {
      background: var(--hover);
      color: var(--text);
      text-decoration: none;
    }
    nav.tree a.item.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
      box-shadow: inset 3px 0 0 var(--accent);
    }
    nav.tree a.item.done::before {
      content: "✓ ";
      color: var(--ok);
      font-weight: 700;
    }

    main.content {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 22px 22px 72px;
      min-width: 0;
      transition: margin-left 0.18s ease;
    }
    body:not(.nav-open) main.content { margin-left: 0; }
    #markdown {
      width: 100%;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 36px 40px 48px;
      box-shadow: 0 1px 2px rgba(27, 36, 48, 0.04);
      overflow-x: auto;
    }
    #markdown:focus { outline: none; }
    #markdown.loading {
      color: var(--muted);
      min-height: 200px;
    }
    #markdown > :first-child { margin-top: 0; }
    main.content h1,
    main.content h2,
    main.content h3,
    main.content h4 {
      font-weight: 700;
      line-height: 1.3;
      color: var(--ink);
      letter-spacing: -0.02em;
    }
    main.content h1 {
      font-size: 2rem;
      margin: 0 0 18px;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--ink);
    }
    main.content h2 {
      font-size: 1.35rem;
      margin: 2em 0 0.7em;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    main.content h3 {
      font-size: 1.12rem;
      margin: 1.6em 0 0.5em;
      color: var(--ink-2);
    }
    main.content h4 {
      font-size: 1rem;
      margin: 1.4em 0 0.4em;
      color: var(--muted);
      font-weight: 650;
    }
    #markdown p { margin: 0 0 14px; }
    #markdown ul, #markdown ol { padding-left: 1.5em; margin: 0 0 14px; }
    #markdown li { margin: 0.28em 0; }
    #markdown li > ul, #markdown li > ol { margin-bottom: 0; }
    #markdown > :last-child { margin-bottom: 0; }

    .err {
      background: #fff5f5;
      border: 1px solid #f0c4c0;
      color: var(--danger);
      padding: 14px 16px;
      border-radius: var(--radius);
    }
    .err pre { background: transparent; padding: 0; margin: 8px 0 0; border: 0; }

    .topbar .source-badge {
      font-size: 12px;
      font-weight: 650;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #4a5564;
      background: transparent;
      color: #c5ced8;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .topbar .source-badge:hover { color: #fff; border-color: #8b97a8; }
    .topbar .source-badge.local {
      border-color: #3d9a5a;
      color: #8ee0a8;
    }
    .topbar .source-badge.remote {
      border-color: #4d7cb8;
      color: #9ec2ef;
    }

    .source-modal-mask[hidden] { display: none !important; }
    .source-modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(27, 36, 48, 0.5);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .source-modal {
      background: var(--paper);
      max-width: 420px;
      width: 100%;
      padding: 24px;
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(27, 36, 48, 0.18);
    }
    .source-modal h2 { margin: 0 0 8px; font-size: 18px; font-weight: 700; color: var(--ink); }
    .source-modal p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .source-modal .actions { display: flex; flex-direction: column; gap: 8px; }
    .source-modal button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--sidebar);
      cursor: pointer;
      font-size: 14px;
      color: var(--text);
    }
    .source-modal button:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .source-modal button strong { display: block; margin-bottom: 2px; color: var(--ink); }
    .source-modal button span { color: var(--muted); font-size: 12px; }

    @media (max-width: 900px) {
      .sidebar-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        top: var(--topbar-h);
        background: rgba(27, 36, 48, 0.4);
        z-index: 8;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s;
      }
      body.nav-open .sidebar-backdrop {
        opacity: 1;
        pointer-events: auto;
      }
      aside.sidebar {
        width: min(280px, 88vw);
        z-index: 9;
      }
      aside.sidebar.open {
        transform: translateX(0);
        visibility: visible;
      }
      main.content { margin-left: 0; padding: 12px 12px 48px; }
      #markdown { padding: 22px 18px 32px; }
      .topbar .crumb { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media print {
      .topbar, aside.sidebar, .sidebar-backdrop, .source-modal-mask { display: none !important; }
      .layout { padding-top: 0; background: #fff; }
      main.content { margin: 0; padding: 0; }
      #markdown { border: 0; box-shadow: none; padding: 0; }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #c5ccd4; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #a8b2bd; }
  </style>
</head>
<body class="nav-open">
  <button type="button" class="skip-link" id="skipLink">跳到正文</button>
  <div class="topbar">
    <button class="menu-btn" id="menuBtn" aria-label="切换导航" aria-expanded="false" aria-controls="sidebar">☰ 导航</button>
    <a class="brand" href="#README.md">AI Agent开发</a>
    <div class="crumb" id="crumb"></div>
    <button type="button" class="source-badge" id="sourceBadge" hidden title="点击切换数据源"></button>
  </div>

  <div class="source-modal-mask" id="sourceModal" hidden>
    <div class="source-modal" role="dialog" aria-modal="true" aria-labelledby="sourceModalTitle">
      <h2 id="sourceModalTitle">选择文档来源</h2>
      <p>检测到本机预览（localhost）。未推送的本地 MD 只有选「本地仓库」才能看到；线上静态站请继续用远程镜像。</p>
      <div class="actions">
        <button type="button" id="pickLocal">
          <strong>本地仓库</strong>
          <span>从当前站点相对路径读取（需在仓库根目录起静态服务）</span>
        </button>
        <button type="button" id="pickRemote">
          <strong>远程镜像</strong>
          <span>与线上一致：jsDelivr / GitHub raw（已推送的 master）</span>
        </button>
      </div>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="search">
        <input id="searchInput" type="search" placeholder="过滤文档…" autocomplete="off" />
      </div>
      <nav class="tree" id="navTree"></nav>
    </aside>
    <main class="content">
      <article id="markdown" class="loading">加载中…</article>
    </main>
  </div>

  <script>
    /* ════════════════════════════════════════════════════════════
       配置：导航与正文默认从远程镜像读（静态站通常只挂 index.html）。
       本机（localhost / 127.0.0.1）可改选「本地仓库」，用相对路径读未推送的 MD。
       jsDelivr 的 @master 会被 CDN 缓存约 12h，URL 加 ?t= 破不了。
       做法：先解析 master 最新 commit SHA，优先用 @sha 拉 jsDelivr；
       再试 GitHub raw；最后才退回 @master。
       仓库结构变了：先 node scripts/gen-manifest.js，再推到 master。
       ════════════════════════════════════════════════════════════ */
    const REPO = '8696/ai-agents-learning';
    const BRANCH = 'master';
    const SOURCE_KEY = 'docs-source'; // sessionStorage: 'local' | 'remote'
    let rawBase = null;
    let commitSha = null;
    let NAV = [];
    /** @type {'local' | 'remote'} */
    let contentSource = 'remote';

    function isLocalHost() {
      const h = location.hostname;
      return h === 'localhost' || h === '127.0.0.1' || h === '[::1]';
    }

    function encodeRepoPath(repoPath) {
      return repoPath.split('/').map(encodeURIComponent).join('/');
    }

    function withCacheBust(url) {
      const sep = url.includes('?') ? '&' : '?';
      return url + sep + 't=' + Date.now();
    }

    async function fetchWithTimeout(url, ms = 8000) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), ms);
      try {
        return await fetch(url, { cache: 'no-store', signal: ctrl.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    /** 解析 master 最新 commit，供 jsDelivr 用 @sha（避免 @master 边沿缓存） */
    async function resolveCommitSha() {
      if (commitSha) return commitSha;
      const endpoints = [
        `https://api.github.com/repos/${REPO}/commits/${BRANCH}`,
        `https://api.github.com/repos/${REPO}/git/ref/heads/${BRANCH}`,
      ];
      for (const url of endpoints) {
        try {
          const res = await fetchWithTimeout(withCacheBust(url), 5000);
          if (!res.ok) continue;
          const data = await res.json();
          const sha = (data && data.sha)
            || (data && data.object && data.object.sha);
          if (typeof sha === 'string' && /^[0-9a-f]{7,40}$/i.test(sha)) {
            commitSha = sha.slice(0, 40);
            return commitSha;
          }
        } catch (_) { /* 国内偶发不通，继续试 */ }
      }
      return null;
    }

    function buildMirrors() {
      const list = [];
      if (commitSha) {
        list.push(`https://cdn.jsdelivr.net/gh/${REPO}@${commitSha}/`);
      }
      list.push(
        `https://raw.githubusercontent.com/${REPO}/refs/heads/${BRANCH}/`,
        `https://cdn.jsdelivr.net/gh/${REPO}@${BRANCH}/`,
      );
      return list;
    }

    /** 本机静态服务：相对路径拉仓库文件 */
    async function fetchLocalFile(repoPath) {
      const url = withCacheBust('./' + encodeRepoPath(repoPath));
      const res = await fetchWithTimeout(url);
      if (!res.ok) {
        throw new Error(`${url} → HTTP ${res.status}`);
      }
      return await res.text();
    }

    /** 按镜像列表拉取仓库文件；某个源成功后后续请求优先用它 */
    async function fetchRemoteFile(repoPath) {
      const encoded = encodeRepoPath(repoPath);
      const mirrors = buildMirrors();
      const order = rawBase
        ? [rawBase, ...mirrors.filter((b) => b !== rawBase)]
        : mirrors;
      const errors = [];
      for (const base of order) {
        try {
          const res = await fetchWithTimeout(withCacheBust(base + encoded));
          if (!res.ok) {
            errors.push(`${base} → HTTP ${res.status}`);
            continue;
          }
          rawBase = base;
          return await res.text();
        } catch (e) {
          errors.push(`${base} → ${e && e.name === 'AbortError' ? '超时' : e}`);
        }
      }
      throw new Error(errors.join('\n'));
    }

    async function fetchRepoFile(repoPath) {
      if (contentSource === 'local') return fetchLocalFile(repoPath);
      return fetchRemoteFile(repoPath);
    }

    function updateSourceBadge() {
      const badge = document.getElementById('sourceBadge');
      if (!isLocalHost()) {
        badge.hidden = true;
        return;
      }
      badge.hidden = false;
      badge.classList.toggle('local', contentSource === 'local');
      badge.classList.toggle('remote', contentSource === 'remote');
      badge.textContent = contentSource === 'local' ? '本地仓库' : '远程镜像';
      badge.title = '点击重新选择文档来源';
    }

    /** 本机弹出数据源选择；返回 'local' | 'remote' */
    function chooseContentSource({ force = false } = {}) {
      return new Promise((resolve) => {
        if (!isLocalHost()) {
          resolve('remote');
          return;
        }
        if (!force) {
          const saved = sessionStorage.getItem(SOURCE_KEY);
          if (saved === 'local' || saved === 'remote') {
            resolve(saved);
            return;
          }
        }
        const modal = document.getElementById('sourceModal');
        modal.hidden = false;
        const finish = (src) => {
          modal.hidden = true;
          sessionStorage.setItem(SOURCE_KEY, src);
          document.getElementById('pickLocal').onclick = null;
          document.getElementById('pickRemote').onclick = null;
          resolve(src);
        };
        document.getElementById('pickLocal').onclick = () => finish('local');
        document.getElementById('pickRemote').onclick = () => finish('remote');
      });
    }

    /* ════════════════════════════════════════════════════════════
       marked + highlight.js（marked 13 无 highlight 回调，渲染后扫 DOM）
       ════════════════════════════════════════════════════════════ */
    if (window.marked && marked.setOptions) {
      marked.setOptions({ gfm: true, breaks: false });
    }

    /** 扩展名 → highlight.js language id */
    function langFromPath(path) {
      const ext = path.split('.').pop().toLowerCase();
      const map = {
        ts: 'typescript', tsx: 'typescript',
        js: 'javascript', jsx: 'javascript', mjs: 'javascript', cjs: 'javascript',
        json: 'json', md: 'markdown',
        yml: 'yaml', yaml: 'yaml',
        sh: 'bash', bash: 'bash', zsh: 'bash',
      };
      return map[ext] || '';
    }

    /** 对 article 内尚未高亮的 <pre><code> 跑一遍 hljs */
    function highlightArticle(article) {
      if (!window.hljs) return;
      article.querySelectorAll('pre code').forEach((block) => {
        if (block.classList.contains('hljs')) return;
        hljs.highlightElement(block);
      });
    }

    /* ════════════════════════════════════════════════════════════
       工具函数
       ════════════════════════════════════════════════════════════ */
    /** 把当前文件路径 + 相对路径 → 仓库相对路径 */
    function resolvePath(fromFile, relative) {
      if (/^[a-z]+:\/\//i.test(relative) || relative.startsWith('#')) return relative;
      const parts = fromFile.split('/').slice(0, -1);
      for (const seg of relative.split('/')) {
        if (seg === '' || seg === '.') continue;
        if (seg === '..') parts.pop();
        else parts.push(seg);
      }
      return parts.join('/');
    }

    /** 从 hash 读取当前路径；空则返回默认 */
    function currentPath() {
      const h = location.hash.replace(/^#/, '');
      if (!h) return 'README.md';
      try { return decodeURIComponent(h); } catch { return h; }
    }

    /** 把仓库相对路径转成 hash */
    function toHash(path) {
      return '#' + path;
    }

    /* ════════════════════════════════════════════════════════════
       渲染导航树
       ════════════════════════════════════════════════════════════ */
    function renderNav() {
      const root = document.getElementById('navTree');
      root.innerHTML = '';
      for (const node of NAV) {
        root.appendChild(buildNavNode(node));
      }
    }
    function buildNavNode(node) {
      const isGroup = Array.isArray(node.children);
      const wrap = document.createElement('div');
      wrap.className = isGroup ? 'group' : '';
      if (!isGroup) {
        // leaf
        const a = document.createElement('a');
        a.className = 'item';
        a.href = toHash(node.path);
        a.dataset.path = node.path;
        a.textContent = node.label;
        wrap.appendChild(a);
        return wrap;
      }
      // group
      const label = document.createElement('div');
      label.className = 'group-label';
      label.innerHTML = `<span class="toggle">▼</span><span>${escapeHTML(node.label)}</span>`;
      const children = document.createElement('div');
      children.className = 'children';
      for (const c of node.children) children.appendChild(buildNavNode(c));
      label.addEventListener('click', () => {
        wrap.classList.toggle('collapsed');
      });
      // 展开包含当前页的分组
      if (nodeContainsPath(node, currentPath())) wrap.classList.remove('collapsed');
      else wrap.classList.add('collapsed');
      wrap.appendChild(label);
      wrap.appendChild(children);
      return wrap;
    }
    function nodeContainsPath(node, path) {
      if (!Array.isArray(node.children)) return node.path === path;
      return node.children.some(c => nodeContainsPath(c, path));
    }
    function escapeHTML(s) {
      return s.replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[ch]);
    }

    /** 高亮当前路径，更新面包屑，滚动导航到可视区 */
    function highlightActive(path) {
      document.querySelectorAll('nav.tree a.item').forEach(a => {
        a.classList.toggle('active', a.dataset.path === path);
      });
      // 展开所有包含当前路径的分组
      document.querySelectorAll('nav.tree .group').forEach(g => {
        if (anyDescendantActive(g)) g.classList.remove('collapsed');
      });
      // 滚动当前 item 到可视区
      const active = document.querySelector('nav.tree a.item.active');
      if (active) active.scrollIntoView({ block: 'center' });
    }
    function anyDescendantActive(el) {
      return !!el.querySelector('a.item.active');
    }

    /* ════════════════════════════════════════════════════════════
       渲染面包屑
       ════════════════════════════════════════════════════════════ */
    function renderCrumb(path) {
      const crumb = document.getElementById('crumb');
      const parts = path.split('/');
      let html = '';
      let acc = '';
      parts.forEach((seg, i) => {
        acc = acc ? acc + '/' + seg : seg;
        html += `<a href="${toHash(acc)}">${escapeHTML(seg)}</a>`;
        if (i < parts.length - 1) html += '<span class="sep">/</span>';
      });
      crumb.innerHTML = html;
    }

    /* ════════════════════════════════════════════════════════════
       抓取 + 渲染内容
       ════════════════════════════════════════════════════════════ */
    async function loadAndRender(path) {
      const article = document.getElementById('markdown');
      article.className = 'loading';
      article.textContent = '加载中…';
      renderCrumb(path);
      highlightActive(path);
      window.scrollTo({ top: 0, behavior: 'instant' });

      try {
        const text = await fetchRepoFile(path);

        let html;
        if (path.endsWith('.md')) {
          html = marked.parse(text);
          // 重写内部 .md 链接为 hash 链接
          html = rewriteMdLinks(html, path);
        } else {
          const lang = langFromPath(path);
          const cls = lang ? ` class="language-${lang}"` : '';
          html = `<pre><code${cls}>${escapeHTML(text)}</code></pre>`;
        }
        article.className = '';
        article.innerHTML = html;
        highlightArticle(article);
      } catch (e) {
        const tip = contentSource === 'local'
          ? `当前是<strong>本地仓库</strong>模式。请确认已在仓库根目录起静态服务（例如
              <code>python3 -m http.server 8080</code>），并打开
              <code>http://localhost:8080/</code>；同时确认路径
              <code>${escapeHTML(path)}</code> 在本地存在。`
          : `已依次尝试 jsDelivr（按最新 commit）、GitHub raw、jsDelivr @master。
              请确认该路径已推到 <code>master</code>。`;
        article.className = '';
        article.innerHTML = `
          <div class="err">
            <strong>加载失败：</strong> ${escapeHTML(path)}
            <pre>${escapeHTML(String(e))}</pre>
            <p style="margin-top:12px">${tip}</p>
          </div>`;
      }
    }

    /** 把渲染后的 HTML 中所有 .md 链接改成 hash 链接，并把路径解析为绝对路径 */
    function rewriteMdLinks(html, fromFile) {
      return html.replace(/<a\s+([^>]*?)href="([^"]+\.md(?:[#?][^"]*)?)"([^>]*)>/gi,
        (m, pre, href, post) => {
          const [pathPart, hashPart] = href.split('#');
          const resolved = resolvePath(fromFile, pathPart);
          const newHref = toHash(resolved) + (hashPart ? '#' + hashPart : '');
          return `<a ${pre}href="${newHref}"${post}>`;
        });
    }

    /* ════════════════════════════════════════════════════════════
       全局点击拦截：md 内部链接 → 路由；外链 → 新窗口
       ════════════════════════════════════════════════════════════ */
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (!a) return;
      const href = a.getAttribute('href') || '';
      if (href.startsWith('#')) {
        // 内部跳转（包括我们改写的 .md hash 链接）
        e.preventDefault();
        location.hash = href.slice(1);
        if (isMobileNav()) setSidebarOpen(false);
      } else if (href.endsWith('.md')) {
        // 没被改写到的 .md 链接（极少），也兜底处理
        e.preventDefault();
        location.hash = resolvePath(currentPath(), href);
      }
      // http(s) / mailto 等不动
    });

    /* ════════════════════════════════════════════════════════════
       搜索过滤
       ════════════════════════════════════════════════════════════ */
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('nav.tree a.item').forEach(a => {
        const match = !q || a.textContent.toLowerCase().includes(q);
        a.parentElement.style.display = match ? '' : 'none';
      });
      // 含匹配项的分组强制展开
      document.querySelectorAll('nav.tree .group').forEach(g => {
        const hasVisible = !!g.querySelector('a.item:not([style*="display: none"])');
        g.style.display = hasVisible || !q ? '' : 'none';
        if (q && hasVisible) g.classList.remove('collapsed');
      });
    });

    /* ════════════════════════════════════════════════════════════
       导航开关：PC 可暂时收起（正文铺满）；移动端仍是遮罩抽屉
       ════════════════════════════════════════════════════════════ */
    function isMobileNav() {
      return window.matchMedia('(max-width: 900px)').matches;
    }
    function setSidebarOpen(open) {
      document.getElementById('sidebar').classList.toggle('open', open);
      document.body.classList.toggle('nav-open', open);
      const btn = document.getElementById('menuBtn');
      btn.setAttribute('aria-expanded', String(open));
      btn.setAttribute('aria-label', open ? '隐藏导航' : '显示导航');
    }
    document.getElementById('skipLink').addEventListener('click', () => {
      const article = document.getElementById('markdown');
      article.setAttribute('tabindex', '-1');
      article.focus();
    });
    document.getElementById('menuBtn').addEventListener('click', () => {
      const next = !document.getElementById('sidebar').classList.contains('open');
      setSidebarOpen(next);
    });
    document.getElementById('sidebarBackdrop').addEventListener('click', () => {
      setSidebarOpen(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setSidebarOpen(false);
    });
    window.matchMedia('(max-width: 900px)').addEventListener('change', (e) => {
      setSidebarOpen(!e.matches);
    });

    /* ════════════════════════════════════════════════════════════
       启动
       ════════════════════════════════════════════════════════════ */
    function route() {
      loadAndRender(currentPath());
    }

    async function startApp() {
      rawBase = null;
      if (contentSource === 'remote') {
        await resolveCommitSha();
      }
      try {
        NAV = JSON.parse(await fetchRepoFile('manifest.json'));
      } catch (e) {
        const tip = contentSource === 'local'
          ? `当前是<strong>本地仓库</strong>模式。请在仓库根目录起静态服务，并确认
              <code>manifest.json</code> 存在（可先跑
              <code>node scripts/gen-manifest.js</code>）。`
          : `已依次尝试 jsDelivr（按最新 commit）、GitHub raw、jsDelivr @master。
              请确认 <code>manifest.json</code> 已推到 <code>master</code>
              （可先跑 <code>node scripts/gen-manifest.js</code> 再推送）。`;
        document.getElementById('markdown').innerHTML = `
          <div class="err">
            <strong>加载 manifest.json 失败：</strong> ${escapeHTML(String(e))}
            <p style="margin-top:12px">${tip}</p>
          </div>`;
        return;
      }
      renderNav();
      if (!location.hash) location.hash = 'README.md';
      else route();
    }

    async function bootstrap() {
      setSidebarOpen(!isMobileNav());
      contentSource = await chooseContentSource();
      updateSourceBadge();
      window.addEventListener('hashchange', route);
      await startApp();
    }

    document.getElementById('sourceBadge').addEventListener('click', async () => {
      contentSource = await chooseContentSource({ force: true });
      updateSourceBadge();
      document.getElementById('markdown').className = 'loading';
      document.getElementById('markdown').textContent = '切换数据源…';
      document.getElementById('navTree').innerHTML = '';
      await startApp();
    });

    bootstrap();
  </script>
</body>
</html>
