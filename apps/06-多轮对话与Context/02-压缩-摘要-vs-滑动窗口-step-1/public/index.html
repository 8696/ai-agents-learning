<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>压缩 / 摘要 vs 滑动窗口 · step-1</title>

  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入（禁止换 CDN / 版本 / integrity） -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <!-- §5.3.4 强制：React 18.3.1 UMD CDN -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- §5.3.4 强制：Babel Standalone 锁定 7.26.4 -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- §5.3.4 强制：JSX 块内不允许 TypeScript 语法 -->
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── 粗估每条消息的 token 数（与服务端 encode 一致；学习用，不是计费）──
    function approxTokens(text) {
      let chinese = 0, other = 0;
      for (const ch of text) {
        if (/[一-鿿]/.test(ch)) chinese += 1;
        else other += 1;
      }
      return Math.ceil(chinese / 1.5 + other / 4);
    }

    function App() {
      const [health, setHealth] = useState(null);
      const [turnCount, setTurnCount] = useState(50);
      const [windowSize, setWindowSize] = useState(6);
      const [keyFactAtTurn, setKeyFactAtTurn] = useState(1);
      const [status, setStatus] = useState({ key: "idle", text: "⏸ 待连接" });
      // 错误态分两类（§5.3.2 #2）：4xx 黄底 / 5xx 红底 —— 让学习者一眼分开两种失败
      const [errorMsg, setErrorMsg] = useState("");
      const [errorKind, setErrorKind] = useState(null); // null | "4xx" | "5xx"
      // 对照结果
      const [result, setResult] = useState(null);
      const inFlightRef = useRef(false);

      // ── 页脚 /health 加载 ──
      useEffect(() => {
        fetch("/health").then(r => r.json()).then(setHealth).catch(() => setHealth(null));
      }, []);

      async function runCompare() {
        if (inFlightRef.current) return;
        if (health && !health.hasKey) {
          setErrorMsg("apps/.env 没配当前 LLM_PROVIDER 的 Key（看页脚 Key ❌）");
          setErrorKind("5xx");
          return;
        }
        setErrorMsg("");
        setErrorKind(null);
        setResult(null);
        inFlightRef.current = true;
        setStatus({ key: "loading", text: "🔄 请求中" });

        try {
          const resp = await fetch("/api/compare", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ turnCount, windowSize, keyFactAtTurn }),
          });
          const data = await resp.json();
          if (!resp.ok) {
            const kind = resp.status >= 500 ? "5xx" : "4xx";
            setErrorKind(kind);
            const detail = data.issues
              ? ` · ${data.issues.map(i => i.message || JSON.stringify(i)).join("；")}`
              : "";
            setErrorMsg(`${resp.status} · ${data.error || ""} ${data.message || ""}${detail}`.trim());
            setStatus({ key: "error", text: "❌ 错误" });
            return;
          }
          setResult(data);
          setStatus({ key: "done", text: "✅ 完成" });
        } catch (err) {
          setErrorKind("5xx");
          setErrorMsg(`网络错误：${(err && err.message) || err}`);
          setStatus({ key: "error", text: "❌ 错误" });
        } finally {
          inFlightRef.current = false;
        }
      }

      async function simulateUpstreamError() {
        if (inFlightRef.current) return;
        setErrorMsg("");
        setErrorKind(null);
        inFlightRef.current = true;
        setStatus({ key: "loading", text: "🔄 请求中" });
        try {
          const resp = await fetch("/api/compare-force-error", { method: "POST" });
          const data = await resp.json();
          setErrorKind("5xx");
          setErrorMsg(`${resp.status} · ${data.error || ""} ${data.message || ""}`.trim());
          setStatus({ key: "error", text: "❌ 错误" });
        } catch (err) {
          setErrorKind("5xx");
          setErrorMsg(`网络错误：${(err && err.message) || err}`);
          setStatus({ key: "error", text: "❌ 错误" });
        } finally {
          inFlightRef.current = false;
        }
      }

      const runDisabled = inFlightRef.current || (health && !health.hasKey);

      // 单条消息渲染（user/assistant/system 三种样式）
      function MsgItem({ m }) {
        const cls = m.role === "user"
          ? "bg-gray-50 border-gray-300"
          : m.role === "assistant"
          ? "bg-green-50 border-green-300"
          : "bg-yellow-50 border-yellow-300";
        return (
          <li className={"border rounded p-2 text-xs " + cls}>
            <div className="flex items-center justify-between text-gray-500 mb-1">
              <span><b>{m.role}</b></span>
              <span>≈ {approxTokens(m.content)} tokens</span>
            </div>
            <div className="whitespace-pre-wrap text-gray-800">{m.content}</div>
          </li>
        );
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">压缩 / 摘要 vs 滑动窗口 · step-1</h1>
            <span id="status-pill" className={
              "text-xs px-2 py-1 rounded " +
              (status.key === "loading" ? "bg-yellow-200" :
               status.key === "done"    ? "bg-green-200" :
               status.key === "error"   ? "bg-red-200" :
                                          "bg-gray-200")
            }>{status.text}</span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">本页只演示：<b>滑动窗口</b>（按条数 + system pin）—— 跑 50 轮假对话 → 真调两次模型 → 对比「裁剪前 vs 裁剪后」回答里有没有「自我介绍」里的 key fact。</p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>选参数：假对话轮数 / 滑动窗口保留条数 / key fact 放在第几轮</li>
                <li>点「跑对比」→ 服务端拼装 messages，调真模型 #1（完整 50 轮）→ beforeReply</li>
                <li>滑动窗口裁剪：system 永远 pin + 留最近 K 条非 system</li>
                <li>调真模型 #2（裁剪后）→ afterReply</li>
                <li>对照两张回答 + 一张小结：key fact 在 before 还是 after？</li>
                <li><b>错误两类 · 一眼分开</b>：Zod 入参不合法 → 4xx（黄底） · 点「演示后端 5xx」→ 5xx（红底）</li>
              </ol>
              {/* 核心教学点卡片（§5.3.11.b 强制） */}
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">滑动窗口(Sliding Window)= **扔字**——保留 system(永远 pin)+ 最近 K 条非 system,更早的全部扔掉;0 额外 LLM 调用(纯本地 slice / filter),实现极简。**丢的是字面细节**(专有名词、数字、事实原文),key fact 在窗口外就忘。生产里是「摘要失败兜底」的降级目标——成本低、不依赖模型可用。</div>
                <div className="text-xs text-gray-600">怎么观察:跑 50 轮假对话 + key fact 放在第 30 轮 + 滑动窗口 K=10。真调两次模型:① 完整 50 轮(基线)→ 模型答得出来;② 滑动窗口(只留 system + 最近 10 条)→ key fact 在窗口外 → afterReply 答错或不知道。对照卡证明滑动窗口丢字面。</div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                <label className="text-xs text-gray-600">
                  假对话轮数 (turnCount)：<span className="font-mono">{turnCount}</span>
                  <input id="ctrl-turn-count" type="range" min="2" max="80" step="1"
                    value={turnCount} onChange={e => setTurnCount(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  滑动窗口 K (windowSize)：<span className="font-mono">{windowSize}</span>
                  <input id="ctrl-window-size" type="range" min="2" max="20" step="1"
                    value={windowSize} onChange={e => setWindowSize(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  key fact 放第几轮：<span className="font-mono">{keyFactAtTurn}</span>
                  <input id="ctrl-key-fact-turn" type="range" min="1" max={Math.max(1, turnCount)} step="1"
                    value={keyFactAtTurn} onChange={e => setKeyFactAtTurn(Number(e.target.value))}
                    className="w-full" />
                </label>
              </div>
              <div className="flex gap-2 flex-wrap">
                <button
                  id="btn-run-compare"
                  className="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50"
                  onClick={runCompare}
                  disabled={runDisabled}
                >跑对比（50 轮 → 滑动窗口 → 问同一问题对照）</button>
                <button
                  id="btn-simulate-error"
                  className="border border-orange-300 text-orange-700 px-4 py-2 rounded text-sm"
                  onClick={simulateUpstreamError}
                >演示后端 5xx（5xx · 类 B）</button>
              </div>
              {errorMsg ? (
                <div
                  id="error-box"
                  className={
                    "text-xs px-3 py-2 rounded border " +
                    (errorKind === "5xx"
                      ? "border-red-300 bg-red-50 text-red-700"
                      : "border-yellow-300 bg-yellow-50 text-yellow-800")
                  }
                >
                  <div className="font-semibold">
                    {errorKind === "5xx" ? "后端错误（5xx）" : "入参校验失败（4xx）"}
                  </div>
                  <div className="mt-1">{errorMsg}</div>
                </div>
              ) : null}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!result ? (
                <div className="text-xs text-gray-400">（空 · 还没跑对照实验。先调三个旋钮，再点「跑对比」。）</div>
              ) : (
                <>
                  {/* 卡 ① 裁剪前 */}
                  <article id="card-before" className="border border-gray-300 rounded p-3 space-y-2">
                    <header className="flex items-center justify-between">
                      <div className="text-sm font-semibold text-gray-800">
                        ① 裁剪前（完整 messages）
                      </div>
                      <div className="text-xs text-gray-500">
                        messages 长度 = <span id="before-len" className="font-mono">{result.messagesBefore.length}</span>
                        {" · "}
                        估算 token ≈ <span className="font-mono">
                          {result.messagesBefore.reduce((s, m) => s + approxTokens(m.content), 0)}
                        </span>
                      </div>
                    </header>
                    <div className="text-xs text-gray-500">模型回答（beforeReply）：</div>
                    <div id="before-reply" className="bg-green-50 border border-green-300 rounded p-2 text-sm whitespace-pre-wrap text-gray-800">
                      {result.beforeReply}
                    </div>
                    <details className="text-xs">
                      <summary className="cursor-pointer text-gray-600">看完整 messages（{result.messagesBefore.length} 条）</summary>
                      <ol id="before-msgs" className="mt-2 space-y-1 max-h-64 overflow-auto">
                        {result.messagesBefore.map((m, i) => <MsgItem key={i} m={m} />)}
                      </ol>
                    </details>
                  </article>

                  {/* 卡 ② 裁剪后 */}
                  <article id="card-after" className="border border-gray-300 rounded p-3 space-y-2">
                    <header className="flex items-center justify-between">
                      <div className="text-sm font-semibold text-gray-800">
                        ② 裁剪后（滑动窗口 · 留最近 K 条 · system pin）
                      </div>
                      <div className="text-xs text-gray-500">
                        messages 长度 = <span id="after-len" className="font-mono">{result.messagesAfter.length}</span>
                        {" · "}
                        估算 token ≈ <span className="font-mono">
                          {result.messagesAfter.reduce((s, m) => s + approxTokens(m.content), 0)}
                        </span>
                      </div>
                    </header>
                    <div className="text-xs text-gray-500">模型回答（afterReply）：</div>
                    <div id="after-reply" className="bg-green-50 border border-green-300 rounded p-2 text-sm whitespace-pre-wrap text-gray-800">
                      {result.afterReply}
                    </div>
                    <details className="text-xs">
                      <summary className="cursor-pointer text-gray-600">看裁剪后的 messages（{result.messagesAfter.length} 条）</summary>
                      <ol id="after-msgs" className="mt-2 space-y-1 max-h-64 overflow-auto">
                        {result.messagesAfter.map((m, i) => <MsgItem key={i} m={m} />)}
                      </ol>
                    </details>
                  </article>

                  {/* 卡 ③ 对比小结 */}
                  <article id="card-summary" className="border border-blue-300 bg-blue-50 rounded p-3 space-y-2">
                    <header className="flex items-center justify-between">
                      <div className="text-sm font-semibold text-gray-800">
                        ③ 对比小结
                      </div>
                    </header>
                    <div className="text-xs text-gray-700 space-y-1">
                      <div>
                        <b>关键事实（key fact）</b>：<span id="key-fact" className="font-mono">{result.keyFact}</span>
                      </div>
                      <div>
                        <b>问句</b>：<span className="font-mono">{result.question}</span>
                      </div>
                      <div>
                        <b>滑动窗口丢掉的条数</b>：<span id="dropped" className="font-mono">{result.dropped}</span>
                      </div>
                      <div>
                        <b>beforeReply 含 key fact</b>：
                        <span id="key-fact-in-before" className={
                          "ml-1 px-2 py-0.5 rounded text-xs " +
                          (result.keyFactInBefore ? "bg-green-200 text-green-900" : "bg-red-200 text-red-900")
                        }>
                          {result.keyFactInBefore ? "✅ 是" : "❌ 否"}
                        </span>
                      </div>
                      <div>
                        <b>afterReply 含 key fact</b>：
                        <span id="key-fact-in-after" className={
                          "ml-1 px-2 py-0.5 rounded text-xs " +
                          (result.keyFactInAfter ? "bg-green-200 text-green-900" : "bg-red-200 text-red-900")
                        }>
                          {result.keyFactInAfter ? "✅ 是" : "❌ 否"}
                        </span>
                      </div>
                      <div className="pt-1 text-gray-600">
                        {result.keyFactInBefore && !result.keyFactInAfter
                          ? "→ 这就是「滑动窗口丢了什么」：key fact 在 before（完整）模型能记；滑动窗口裁掉后模型忘了。"
                          : !result.keyFactInBefore && !result.keyFactInAfter
                          ? "→ 两次都忘：可能 prompt 没给够信号（key fact 放在第 1 轮 + 第 50 轮的对话不够强）；把 keyFactAtTurn 调大（如 49）再试。"
                          : result.keyFactInBefore && result.keyFactInAfter
                          ? "→ 两次都记得：key fact 在窗口内。把 keyFactAtTurn 改回 1、windowSize 调小（如 2）再看「丢」。"
                          : "→ before 忘 / after 记得：罕见；如果发生，检查 key fact 是不是真的在裁剪后的 messages 里。"}
                      </div>
                    </div>
                  </article>
                </>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 50040 · 协议 A · provider {health?.provider ?? "(待连接)"} · model {health?.model ?? "(待连接)"} · Key {health?.hasKey ? "✅" : "❌"}
            </span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
