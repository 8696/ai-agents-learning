<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token 预算管理 · 第三步</title>

  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入（禁止换 CDN / 版本 / integrity） -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <!-- §5.3.4 强制：React 18.3.1 UMD CDN -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- §5.3.4 强制：Babel Standalone 锁定 7.26.4 -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- §5.3.4 强制：JSX 块内不允许 TypeScript 语法 -->
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function approxTokens(text) {
      let chinese = 0, other = 0;
      for (const ch of text) {
        if (/[一-鿿]/.test(ch)) chinese += 1;
        else other += 1;
      }
      return Math.ceil(chinese / 1.5 + other / 4);
    }

    function App() {
      const [health, setHealth] = useState(null);
      const [historyCount, setHistoryCount] = useState(50);
      const [outputBudget, setOutputBudget] = useState(800);
      const [totalBudget, setTotalBudget] = useState(2000);
      const [hardLimit, setHardLimit] = useState(1000);
      const [strategy, setStrategy] = useState("trim");
      const [summarizeFrom, setSummarizeFrom] = useState(40);
      const [keepRecent, setKeepRecent] = useState(8);
      const [status, setStatus] = useState({ key: "idle", text: "⏸ 待连接" });
      const [errorMsg, setErrorMsg] = useState("");
      const [errorKind, setErrorKind] = useState(null);
      const [result, setResult] = useState(null);
      const inFlightRef = useRef(false);

      useEffect(() => {
        fetch("/health").then(r => r.json()).then(setHealth).catch(() => setHealth(null));
      }, []);

      async function runEmergency() {
        if (inFlightRef.current) return;
        if (health && !health.hasKey) {
          setErrorMsg("apps/.env 没配当前模型提供商的密钥（看页脚 密钥 ❌）");
          setErrorKind("5xx");
          return;
        }
        setErrorMsg("");
        setErrorKind(null);
        setResult(null);
        inFlightRef.current = true;
        setStatus({ key: "loading", text: "🔄 请求中（2~3 次真发网络请求：1 软路径问答 / +1 摘要 / +1 应急问答）" });

        try {
          const resp = await fetch("/api/emergency", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ historyCount, outputBudget, totalBudget, hardLimit, summarizeFrom, keepRecent, strategy }),
          });
          const data = await resp.json();
          if (!resp.ok) {
            const kind = resp.status >= 500 ? "5xx" : "4xx";
            setErrorKind(kind);
            const detail = data.issues
              ? ` · ${data.issues.map(i => i.message || JSON.stringify(i)).join("；")}`
              : "";
            setErrorMsg(`${resp.status} · ${data.error || ""} ${data.stage ? "【" + data.stage + "】 " : ""}${data.message || ""}${detail}`.trim());
            setStatus({ key: "error", text: "❌ 错误" });
            return;
          }
          setResult(data);
          setStatus({ key: "done", text: "✅ 完成" });
        } catch (err) {
          setErrorKind("5xx");
          setErrorMsg(`网络错误：${(err && err.message) || err}`);
          setStatus({ key: "error", text: "❌ 错误" });
        } finally {
          inFlightRef.current = false;
        }
      }

      async function simulateUpstreamError() {
        if (inFlightRef.current) return;
        setErrorMsg("");
        setErrorKind(null);
        inFlightRef.current = true;
        setStatus({ key: "loading", text: "🔄 请求中" });
        try {
          const resp = await fetch("/api/emergency-force-error", { method: "POST" });
          const data = await resp.json();
          setErrorKind("5xx");
          setErrorMsg(`${resp.status} · ${data.error || ""} ${data.message || ""}`.trim());
          setStatus({ key: "error", text: "❌ 错误" });
        } catch (err) {
          setErrorKind("5xx");
          setErrorMsg(`网络错误：${(err && err.message) || err}`);
          setStatus({ key: "error", text: "❌ 错误" });
        } finally {
          inFlightRef.current = false;
        }
      }

      const runDisabled = inFlightRef.current || (health && !health.hasKey);

      function MsgItem({ m }) {
        const cls = m.role === "user"
          ? "bg-gray-50 border-gray-300"
          : m.role === "assistant"
          ? "bg-green-50 border-green-300"
          : "bg-yellow-50 border-yellow-300";
        return (
          <li className={"border rounded p-2 text-xs " + cls}>
            <div className="flex items-center justify-between text-gray-500 mb-1">
              <span><b>角色：{m.role === "user" ? "用户" : m.role === "assistant" ? "助手" : "系统"}</b></span>
              <span>≈ {approxTokens(m.content)} 个 token</span>
            </div>
            <div className="whitespace-pre-wrap text-gray-800">{m.content}</div>
          </li>
        );
      }

      function BudgetTable({ label, budget, totalLimit, compareLimit }) {
        const overSoft = budget.total > totalLimit;
        const overHard = budget.total > compareLimit;
        return (
          <div className={"border rounded p-3 " + (overHard ? "border-red-300 bg-red-50" : overSoft ? "border-orange-300 bg-orange-50" : "border-green-300 bg-green-50")}>
            <div className="text-xs text-gray-500 mb-1">{label}</div>
            <table className="text-xs w-full">
              <tbody>
                <tr><td className="text-gray-600">系统提示段（system）</td><td className="text-right font-mono">{budget.systemTokens}</td></tr>
                <tr><td className="text-gray-600">历史对话段（history）</td><td className="text-right font-mono">{budget.historyTokens}</td></tr>
                <tr><td className="text-gray-600">给模型输出的预留（output budget）</td><td className="text-right font-mono">{budget.outputBudget}</td></tr>
                <tr className="border-t"><td className="text-gray-800 font-semibold pt-1">三块合计（total）</td>
                  <td className={"text-right font-mono pt-1 " + (overHard ? "text-red-700" : overSoft ? "text-orange-700" : "text-gray-800")}>
                    {budget.total}
                  </td>
                </tr>
                <tr><td className="text-gray-500">软阈值（totalBudget）</td><td className="text-right font-mono">{totalLimit}</td></tr>
                <tr><td className="text-gray-500">硬阈值（hardLimit）</td><td className="text-right font-mono">{compareLimit}</td></tr>
              </tbody>
            </table>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">Token 预算管理（Token Budget） · 第三步（step-3） · 软阈值 + 硬阈值双层</h1>
            <span id="status-pill" className={
              "text-xs px-2 py-1 rounded " +
              (status.key === "loading" ? "bg-yellow-200" :
               status.key === "done"    ? "bg-green-200" :
               status.key === "error"   ? "bg-red-200" :
                                          "bg-gray-200")
            }>{status.text}</span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">本页只演示：<b>软阈值 + 硬阈值双层</b>——三块预算先看软阈值（totalBudget）;超软阈值走 trim / summarize;再硬阈值（hardLimit）兜底,超了直接走应急模式 = 只留 system + history 末轮 + 提示"请用一句话重述"。</p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>调旋钮：历史对话轮数 / 给模型输出的预留 / 软阈值（totalBudget） / 硬阈值（hardLimit） / 软路径策略（trim / summarize）</li>
                <li>点「跑应急」→ 服务端先算三块预算 → 比较 total vs hardLimit 判定走哪条</li>
                <li>软路径（total ≤ hardLimit）：按所选策略 trim 或 summarize → 拼消息 → 调真模型</li>
                <li>硬路径（total &gt; hardLimit）：只留 system + history 末轮 + 提示"请重述" → 调真模型</li>
                <li>看页面 4 张卡：触发说明 / 软路径 / 硬路径 / 裁前基线 —— 一眼看见"软硬双层"</li>
                <li><b>错误两类 · 一眼分开</b>：参数不合法（Zod bad_request）→ 4xx（黄底） · 点「演示后端 5xx」→ 5xx（红底）</li>
              </ol>

              {/* 核心教学点卡片（§5.3.11.b 强制） */}
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">「软阈值 + 硬阈值」双层兜底:软阈值（totalBudget / step-1~2 的 trim / summarize）能救就救,救不回来时,硬阈值（hardLimit）直接砍到 system + history 末轮 + 提示"请用一句话重述",**保证服务永远在「能发请求」状态**。</div>
                <div className="text-xs text-gray-800 mt-1">
                  <b>两条线讲清楚</b>:
                  <ul className="list-disc pl-5 mt-1 space-y-0.5">
                    <li><b>硬阈值 = 底线</b> = <code className="bg-white px-1 rounded">total &gt; hardLimit</code> 触发;不能超。**永远 fit**(应急模式只有 3 条 messages = system + 末轮 + 提示)。</li>
                    <li><b>软阈值 = 软目标</b> = <code className="bg-white px-1 rounded">total &gt; totalBudget</code> 触发;选 trim 或 summarize **去救**,**救到 fit 为止**(不会裁过头)。</li>
                  </ul>
                </div>
                <div className="text-xs text-gray-600">怎么观察:看「① 触发说明」判定走软还是硬(red = 应急 / green = 软);调 historyCount 调到 200+ 看三块合计是否超 hardLimit → 切到硬路径;调 hardLimit 调大看软路径触发条件变化。</div>
                <div className="text-xs text-gray-600">完整逻辑树:<br />
                  <code className="bg-white px-1 rounded block mt-1 whitespace-pre-wrap">total = system + history + output 预留
total ≤ totalBudget          → 不裁,直接发
total ≤ hardLimit            → 软路径:trim / summarize
total &gt; hardLimit          → 硬路径:应急模式(只留 system + 末轮 + 提示)</code>
                </div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                <label className="text-xs text-gray-600">
                  历史对话轮数（historyCount · 每轮 = 1 user + 1 assistant）：<span className="font-mono">{historyCount}</span>
                  <input id="ctrl-history-count" type="range" min="2" max="200" step="1"
                    value={historyCount} onChange={e => setHistoryCount(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  给模型输出的预留（outputBudget · token）：<span className="font-mono">{outputBudget}</span>
                  <input id="ctrl-output-budget" type="range" min="64" max="4000" step="64"
                    value={outputBudget} onChange={e => setOutputBudget(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  软阈值（totalBudget · token · 超了就 trim / summarize）：<span className="font-mono">{totalBudget}</span>
                  <input id="ctrl-total-budget" type="range" min="512" max="32000" step="128"
                    value={totalBudget} onChange={e => setTotalBudget(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  硬阈值（hardLimit · token · 超了就走应急模式）：<span className="font-mono">{hardLimit}</span>
                  <input id="ctrl-hard-limit" type="range" min="256" max="16000" step="64"
                    value={hardLimit} onChange={e => setHardLimit(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  软路径策略（strategy · trim / summarize 二选一）：<span className="font-mono">{strategy}</span>
                  <select id="ctrl-strategy" value={strategy} onChange={e => setStrategy(e.target.value)} className="w-full border rounded px-2 py-1 text-xs">
                    <option value="trim">trim（丢最旧）</option>
                    <option value="summarize">summarize（远期摘要 + 近期原文）</option>
                  </select>
                </label>
                <label className="text-xs text-gray-600">
                  远期喂摘要的条数（summarizeFrom）：<span className="font-mono">{summarizeFrom}</span>
                  <input id="ctrl-summarize-from" type="range" min="1" max={Math.max(1, historyCount - 1)} step="1"
                    value={Math.min(summarizeFrom, historyCount - 1)} onChange={e => setSummarizeFrom(Number(e.target.value))}
                    className="w-full" disabled={strategy === "trim"} />
                </label>
                <label className="text-xs text-gray-600">
                  近期留原文的条数（keepRecent）：<span className="font-mono">{keepRecent}</span>
                  <input id="ctrl-keep-recent" type="range" min="0" max="50" step="1"
                    value={keepRecent} onChange={e => setKeepRecent(Number(e.target.value))}
                    className="w-full" disabled={strategy === "trim"} />
                </label>
              </div>
              <div className="flex gap-2 flex-wrap">
                <button
                  id="btn-run-emergency"
                  className="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50"
                  onClick={runEmergency}
                  disabled={runDisabled}
                >跑应急（runEmergency）</button>
                <button
                  id="btn-simulate-error"
                  className="border border-orange-300 text-orange-700 px-4 py-2 rounded text-sm"
                  onClick={simulateUpstreamError}
                >演示后端 5xx（5xx · 第二类错误 · /api/emergency-force-error）</button>
              </div>
              {errorMsg ? (
                <div
                  id="error-box"
                  className={
                    "text-xs px-3 py-2 rounded border " +
                    (errorKind === "5xx"
                      ? "border-red-300 bg-red-50 text-red-700"
                      : "border-yellow-300 bg-yellow-50 text-yellow-800")
                  }
                >
                  <div className="font-semibold">
                    {errorKind === "5xx" ? "后端错误（5xx）" : "入参校验失败（4xx）"}
                  </div>
                  <div className="mt-1">{errorMsg}</div>
                </div>
              ) : null}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!result ? (
                <div className="text-xs text-gray-400">（还没结果。先调旋钮，再点「跑应急」。）</div>
              ) : (
                <>
                  {/* 卡 ① 触发说明 + 软硬判定 */}
                  <article id="card-trigger" className={
                    "border-2 rounded p-3 space-y-2 " +
                    (result.mode === "emergency" ? "border-red-400 bg-red-50" : "border-green-400 bg-green-50")
                  }>
                    <div className="text-sm font-semibold text-gray-800">
                      ① 触发说明 · 走哪条路径（mode）
                    </div>
                    <div className="text-xs text-gray-700">{result.触发说明}</div>
                    <div className="text-xs text-gray-600">
                      走的是：
                      <span className={
                        "ml-1 px-2 py-0.5 rounded text-xs " +
                        (result.mode === "emergency" ? "bg-red-200 text-red-900" : "bg-green-200 text-green-900")
                      }>
                        {result.mode === "emergency" ? "硬路径（emergency / 应急模式）" : "软路径（soft / trim 或 summarize）"}
                      </span>
                    </div>
                    <div className="text-xs text-gray-500">
                      模型（modelA） = <span className="font-mono">{result.config.modelA}</span>
                    </div>
                  </article>

                  {/* 卡 ② 软路径(当 mode === "soft" 时显示) */}
                  {result.soft ? (
                    <article id="card-soft" className="border border-gray-300 rounded p-3 space-y-2">
                      <header className="flex items-center justify-between">
                        <div className="text-sm font-semibold text-gray-800">
                          ② 软路径 · 策略 = {result.soft.mode}（{result.soft.mode === "trim" ? "丢最旧" : "远期摘要 + 近期原文"}）
                        </div>
                        <div className="text-xs text-gray-500">
                          模型输出 ≈ <span className="font-mono">{result.soft.replyTokens}</span> 个 token
                        </div>
                      </header>
                      <BudgetTable
                        label="软路径裁后 · 三块预算"
                        budget={result.soft.budget}
                        totalLimit={result.config.totalBudget}
                        compareLimit={result.config.hardLimit}
                      />
                      {result.soft.summary ? (
                        <div className="border border-blue-300 bg-blue-50 rounded p-2 space-y-1">
                          <div className="text-xs text-gray-500">远期摘要原文（summary）</div>
                          <div className="text-xs whitespace-pre-wrap text-gray-800">{result.soft.summary}</div>
                        </div>
                      ) : null}
                      <details className="text-xs">
                        <summary className="cursor-pointer text-gray-600">展开查看软路径拼装后发给模型的全部消息（{result.soft.messages.length} 条）</summary>
                        <ol className="mt-2 space-y-1 max-h-64 overflow-auto">
                          {result.soft.messages.map((m, i) => <MsgItem key={i} m={m} />)}
                        </ol>
                      </details>
                      <div className="border rounded p-2 space-y-1">
                        <div className="text-xs text-gray-500">模型回答（soft reply）</div>
                        <div className="bg-green-50 border border-green-300 rounded p-2 text-sm whitespace-pre-wrap text-gray-800">
                          {result.soft.reply}
                        </div>
                      </div>
                    </article>
                  ) : null}

                  {/* 卡 ③ 硬路径(应急模式) */}
                  {result.emergency ? (
                    <article id="card-emergency" className="border-2 border-red-400 bg-red-50 rounded p-3 space-y-2">
                      <header className="flex items-center justify-between">
                        <div className="text-sm font-semibold text-red-900">
                          ③ 硬路径 · 应急模式（emergency · 只留 system + 末轮 + 提示重述）
                        </div>
                        <div className="text-xs text-gray-500">
                          模型输出 ≈ <span className="font-mono">{result.emergency.replyTokens}</span> 个 token
                        </div>
                      </header>
                      <BudgetTable
                        label="硬路径应急 · 三块预算"
                        budget={result.emergency.budget}
                        totalLimit={result.config.totalBudget}
                        compareLimit={result.config.hardLimit}
                      />
                      <details open={true} className="text-xs">
                        <summary className="cursor-pointer text-gray-700 font-semibold">展开查看应急模式拼装后发给模型的全部消息（{result.emergency.messages.length} 条 · 看「只留 system + 末轮 + 提示」如何兜底）</summary>
                        <ol className="mt-2 space-y-1 max-h-64 overflow-auto">
                          {result.emergency.messages.map((m, i) => <MsgItem key={i} m={m} />)}
                        </ol>
                      </details>
                      <div className="border rounded p-2 space-y-1">
                        <div className="text-xs text-gray-500">模型回答（emergency reply）</div>
                        <div className="bg-white border border-gray-300 rounded p-2 text-sm whitespace-pre-wrap text-gray-800">
                          {result.emergency.reply}
                        </div>
                      </div>
                    </article>
                  ) : null}

                  {/* 卡 ④ 裁前三块预算(参照基线) */}
                  <article id="card-before" className="border border-gray-300 rounded p-3 space-y-2">
                    <div className="text-sm font-semibold text-gray-800">④ 裁前三块预算（参照基线 · beforeBudget）</div>
                    <BudgetTable
                      label="裁前"
                      budget={result.beforeBudget}
                      totalLimit={result.config.totalBudget}
                      compareLimit={result.config.hardLimit}
                    />
                    <div className="text-xs text-gray-600">
                      → 比对三块合计 vs 软阈值 vs 硬阈值,看 ① 触发了哪条
                    </div>
                  </article>
                </>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 50047 · 协议 A（openai Chat Completions） · 模型服务商 {health?.provider ?? "(待连接)"} · 模型 {health?.model ?? "(待连接)"} · 密钥 {health?.hasKey ? "✅" : "❌"}
            </span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
