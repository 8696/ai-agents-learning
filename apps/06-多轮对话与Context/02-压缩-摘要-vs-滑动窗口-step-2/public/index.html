<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>压缩 / 摘要 vs 滑动窗口 · step-2</title>

  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入（禁止换 CDN / 版本 / integrity） -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <!-- §5.3.4 强制：React 18.3.1 UMD CDN -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- §5.3.4 强制：Babel Standalone 锁定 7.26.4 -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- §5.3.4 强制：JSX 块内不允许 TypeScript 语法 -->
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function approxTokens(text) {
      let chinese = 0, other = 0;
      for (const ch of text) {
        if (/[一-鿿]/.test(ch)) chinese += 1;
        else other += 1;
      }
      return Math.ceil(chinese / 1.5 + other / 4);
    }

    function App() {
      const [health, setHealth] = useState(null);
      const [turnCount, setTurnCount] = useState(50);
      const [summarizeFrom, setSummarizeFrom] = useState(45);
      const [keepRecent, setKeepRecent] = useState(5);
      const [keyFactAtTurn, setKeyFactAtTurn] = useState(1);
      const [status, setStatus] = useState({ key: "idle", text: "⏸ 待连接" });
      const [errorMsg, setErrorMsg] = useState("");
      const [errorKind, setErrorKind] = useState(null);
      const [result, setResult] = useState(null);
      const inFlightRef = useRef(false);

      useEffect(() => {
        fetch("/health").then(r => r.json()).then(setHealth).catch(() => setHealth(null));
      }, []);

      // 闸门：summarizeFrom + keepRecent 不能 > turnCount
      const paramValid = summarizeFrom + keepRecent <= turnCount;

      async function runCompare() {
        if (inFlightRef.current) return;
        if (!paramValid) {
          setErrorMsg(`参数非法：summarizeFrom(${summarizeFrom}) + keepRecent(${keepRecent}) 不能超过 turnCount(${turnCount})`);
          setErrorKind("4xx");
          return;
        }
        if (health && !health.hasKey) {
          setErrorMsg("apps/.env 没配当前 LLM_PROVIDER 的 Key（看页脚 Key ❌）");
          setErrorKind("5xx");
          return;
        }
        setErrorMsg("");
        setErrorKind(null);
        setResult(null);
        inFlightRef.current = true;
        setStatus({ key: "loading", text: "🔄 请求中" });

        try {
          const resp = await fetch("/api/summarize", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ turnCount, summarizeFrom, keepRecent, keyFactAtTurn }),
          });
          const data = await resp.json();
          if (!resp.ok) {
            const kind = resp.status >= 500 ? "5xx" : "4xx";
            setErrorKind(kind);
            const detail = data.issues
              ? ` · ${data.issues.map(i => i.message || JSON.stringify(i)).join("；")}`
              : "";
            setErrorMsg(`${resp.status} · ${data.error || ""} ${data.message || ""}${detail}`.trim());
            setStatus({ key: "error", text: "❌ 错误" });
            return;
          }
          setResult(data);
          setStatus({ key: "done", text: "✅ 完成" });
        } catch (err) {
          setErrorKind("5xx");
          setErrorMsg(`网络错误：${(err && err.message) || err}`);
          setStatus({ key: "error", text: "❌ 错误" });
        } finally {
          inFlightRef.current = false;
        }
      }

      async function simulateUpstreamError() {
        if (inFlightRef.current) return;
        setErrorMsg("");
        setErrorKind(null);
        inFlightRef.current = true;
        setStatus({ key: "loading", text: "🔄 请求中" });
        try {
          const resp = await fetch("/api/summarize-force-error", { method: "POST" });
          const data = await resp.json();
          setErrorKind("5xx");
          setErrorMsg(`${resp.status} · ${data.error || ""} ${data.message || ""}`.trim());
          setStatus({ key: "error", text: "❌ 错误" });
        } catch (err) {
          setErrorKind("5xx");
          setErrorMsg(`网络错误：${(err && err.message) || err}`);
          setStatus({ key: "error", text: "❌ 错误" });
        } finally {
          inFlightRef.current = false;
        }
      }

      const runDisabled = inFlightRef.current || (health && !health.hasKey) || !paramValid;

      function MsgItem({ m }) {
        const cls = m.role === "user"
          ? "bg-gray-50 border-gray-300"
          : m.role === "assistant"
          ? "bg-green-50 border-green-300"
          : "bg-yellow-50 border-yellow-300";
        return (
          <li className={"border rounded p-2 text-xs " + cls}>
            <div className="flex items-center justify-between text-gray-500 mb-1">
              <span><b>{m.role}</b></span>
              <span>≈ {approxTokens(m.content)} tokens</span>
            </div>
            <div className="whitespace-pre-wrap text-gray-800">{m.content}</div>
          </li>
        );
      }

      function BadgeYesNo({ value, yesText = "✅ 是", noText = "❌ 否" }) {
        return (
          <span className={
            "ml-1 px-2 py-0.5 rounded text-xs " +
            (value ? "bg-green-200 text-green-900" : "bg-red-200 text-red-900")
          }>
            {value ? yesText : noText}
          </span>
        );
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">压缩 / 摘要 vs 滑动窗口 · step-2</h1>
            <span id="status-pill" className={
              "text-xs px-2 py-1 rounded " +
              (status.key === "loading" ? "bg-yellow-200" :
               status.key === "done"    ? "bg-green-200" :
               status.key === "error"   ? "bg-red-200" :
                                          "bg-gray-200")
            }>{status.text}</span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">本页只演示：<b>摘要压缩</b>（远期 N 条 → 调 LLM 浓缩成 1 条 summary + 近期 K 条留原文）—— 同样 50 轮假历史，调 3 次真模型：① 完整（基线）② 远期摘要 ③ 摘要后问答。</p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>调四个旋钮（turnCount / summarizeFrom / keepRecent / keyFactAtTurn）</li>
                <li>点「跑摘要压缩对照」→ 服务端拼 50 轮假历史 + 调真模型 #1（完整）→ beforeReply</li>
                <li>取前 N 条喂给 LLM → summary（这是「摘要压缩」真正的代价：1 次额外 LLM 调用）</li>
                <li>拼 messagesAfter = [system, summary, ...近 K 条原文, 问句]</li>
                <li>调真模型 #3（摘要后）→ summarizeReply</li>
                <li>看四张卡：① 裁剪前 ② summary 内容（看 LLM 写了啥） ③ 摘要后 ④ 对比小结</li>
                <li><b>对照 step-1</b>：滑动窗口丢字面（卡 ① vs 卡 ② 关键事实丢失）；摘要压缩留语义（卡 ① vs 卡 ③ 关键事实还在）。</li>
                <li><b>错误两类 · 一眼分开</b>：summarizeFrom + keepRecent 超 turnCount → 4xx（黄底） · 点「演示上游失败」→ 5xx（红底）</li>
              </ol>
              {/* 核心教学点卡片（§5.3.11.b 强制） */}
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">摘要压缩(Summarization)= **重写**——读远期 N 条 → 调 LLM 浓缩成 1 条 summary → summary 替代原 N 条 + 近期 K 条留原文。**字面细节仍丢,但语义保留**——「小明住上海」可能摘要成「用户住上海」留下来。代价:+1 次 LLM 调用(500ms~3s)+ summary 本身的 prompt token。生产里是「保留语义」的主力策略,但摘要失败时必须能降级到滑动窗口(step-4 演示)。</div>
                <div className="text-xs text-gray-600">怎么观察:同 50 轮假历史 + 同 key fact + 同问句,跑 3 次真模型:① 完整(基线);② 摘要压缩(summary 替代前 N 条,key fact 在 summary 里);③ 摘要后问答。看四张卡:① 完整 ② summary 内容 ③ 摘要后 ④ 对比——beforeReply 答得出、summarizeReply 也答得出(因为 summary 留了语义),对照 step-1 滑动窗口答错。</div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                <label className="text-xs text-gray-600">
                  假对话轮数 (turnCount)：<span className="font-mono">{turnCount}</span>
                  <input id="ctrl-turn-count" type="range" min="2" max="80" step="1"
                    value={turnCount} onChange={e => setTurnCount(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  待摘要条数 (summarizeFrom)：<span className="font-mono">{summarizeFrom}</span>
                  <input id="ctrl-summarize-from" type="range" min="1" max={turnCount} step="1"
                    value={summarizeFrom} onChange={e => setSummarizeFrom(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  保留近期 (keepRecent)：<span className="font-mono">{keepRecent}</span>
                  <input id="ctrl-keep-recent" type="range" min="0" max={turnCount - 1} step="1"
                    value={keepRecent} onChange={e => setKeepRecent(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  key fact 放第几轮：<span className="font-mono">{keyFactAtTurn}</span>
                  <input id="ctrl-key-fact-turn" type="range" min="1" max={turnCount} step="1"
                    value={keyFactAtTurn} onChange={e => setKeyFactAtTurn(Number(e.target.value))}
                    className="w-full" />
                </label>
              </div>
              {!paramValid ? (
                <div className="text-xs text-orange-700">
                  ⚠️ summarizeFrom + keepRecent ({summarizeFrom + keepRecent}) 不能超过 turnCount ({turnCount})
                </div>
              ) : null}
              <div className="flex gap-2 flex-wrap">
                <button
                  id="btn-run-summarize"
                  className="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50"
                  onClick={runCompare}
                  disabled={runDisabled}
                >跑摘要压缩对照（3 次真调模型）</button>
                <button
                  id="btn-simulate-error"
                  className="border border-orange-300 text-orange-700 px-4 py-2 rounded text-sm"
                  onClick={simulateUpstreamError}
                >演示上游失败（5xx · 类 B）</button>
              </div>
              {errorMsg ? (
                <div
                  id="error-box"
                  className={
                    "text-xs px-3 py-2 rounded border " +
                    (errorKind === "5xx"
                      ? "border-red-300 bg-red-50 text-red-700"
                      : "border-yellow-300 bg-yellow-50 text-yellow-800")
                  }
                >
                  <div className="font-semibold">
                    {errorKind === "5xx" ? "上游失败（5xx）" : "入参校验失败（4xx）"}
                  </div>
                  <div className="mt-1">{errorMsg}</div>
                </div>
              ) : null}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!result ? (
                <div className="text-xs text-gray-400">（空 · 还没跑摘要对照。先调四个旋钮，再点「跑摘要压缩对照」。）</div>
              ) : (
                <>
                  {/* 卡 ① 裁剪前 */}
                  <article id="card-before" className="border border-gray-300 rounded p-3 space-y-2">
                    <header className="flex items-center justify-between">
                      <div className="text-sm font-semibold text-gray-800">
                        ① 裁剪前（完整 messages · 基线）
                      </div>
                      <div className="text-xs text-gray-500">
                        messages 长度 = <span id="before-len" className="font-mono">{result.messagesBefore.length}</span>
                        {" · "}
                        估算 token ≈ <span className="font-mono">
                          {result.messagesBefore.reduce((s, m) => s + approxTokens(m.content), 0)}
                        </span>
                      </div>
                    </header>
                    <div className="text-xs text-gray-500">beforeReply：</div>
                    <div id="before-reply" className="bg-green-50 border border-green-300 rounded p-2 text-sm whitespace-pre-wrap text-gray-800">
                      {result.beforeReply}
                    </div>
                    <details className="text-xs">
                      <summary className="cursor-pointer text-gray-600">看完整 messages（{result.messagesBefore.length} 条）</summary>
                      <ol id="before-msgs" className="mt-2 space-y-1 max-h-48 overflow-auto">
                        {result.messagesBefore.map((m, i) => <MsgItem key={i} m={m} />)}
                      </ol>
                    </details>
                  </article>

                  {/* 卡 ② summary 内容 */}
                  <article id="card-summary" className="border border-purple-300 bg-purple-50 rounded p-3 space-y-2">
                    <header className="flex items-center justify-between">
                      <div className="text-sm font-semibold text-gray-800">
                        ② 摘要压缩（远期 {result.summaryMessages.length} 条 → summary）
                      </div>
                      <div className="text-xs text-gray-500">
                        summary 字数 ≈ <span id="summary-len" className="font-mono">{result.summary.length}</span>
                        {" · "}
                        估算 token ≈ <span className="font-mono">{approxTokens(result.summary)}</span>
                      </div>
                    </header>
                    <div className="text-xs text-gray-700">
                      <b>summary 内容</b>（这就是 LLM 把前 {result.summaryMessages.length} 条对话浓缩出来的 1 段文本）：
                    </div>
                    <div id="summary-content" className="bg-white border border-purple-300 rounded p-2 text-sm whitespace-pre-wrap text-gray-800 max-h-64 overflow-auto">
                      {result.summary}
                    </div>
                    <details className="text-xs">
                      <summary className="cursor-pointer text-gray-600">
                        被摘要压掉的 {result.summaryMessages.length} 条原文（看 LLM 读了啥）
                      </summary>
                      <ol id="summary-msgs" className="mt-2 space-y-1 max-h-48 overflow-auto">
                        {result.summaryMessages.map((m, i) => <MsgItem key={i} m={m} />)}
                      </ol>
                    </details>
                  </article>

                  {/* 卡 ③ 摘要后 */}
                  <article id="card-after" className="border border-gray-300 rounded p-3 space-y-2">
                    <header className="flex items-center justify-between">
                      <div className="text-sm font-semibold text-gray-800">
                        ③ 摘要后（system + summary + 近 {result.recentOriginal.length} 条原文 + 问句）
                      </div>
                      <div className="text-xs text-gray-500">
                        messages 长度 = <span id="after-len" className="font-mono">{result.messagesAfter.length}</span>
                        {" · "}
                        估算 token ≈ <span className="font-mono">
                          {result.messagesAfter.reduce((s, m) => s + approxTokens(m.content), 0)}
                        </span>
                      </div>
                    </header>
                    <div className="text-xs text-gray-500">summarizeReply：</div>
                    <div id="summarize-reply" className="bg-green-50 border border-green-300 rounded p-2 text-sm whitespace-pre-wrap text-gray-800">
                      {result.summarizeReply}
                    </div>
                    <details className="text-xs">
                      <summary className="cursor-pointer text-gray-600">看摘要后的 messages（{result.messagesAfter.length} 条）</summary>
                      <ol id="after-msgs" className="mt-2 space-y-1 max-h-48 overflow-auto">
                        {result.messagesAfter.map((m, i) => <MsgItem key={i} m={m} />)}
                      </ol>
                    </details>
                  </article>

                  {/* 卡 ④ 对比小结 */}
                  <article id="card-summary-result" className="border border-blue-300 bg-blue-50 rounded p-3 space-y-2">
                    <header className="flex items-center justify-between">
                      <div className="text-sm font-semibold text-gray-800">
                        ④ 对比小结
                      </div>
                    </header>
                    <div className="text-xs text-gray-700 space-y-1">
                      <div>
                        <b>关键事实（key fact）</b>：<span id="key-fact" className="font-mono">{result.keyFact}</span>
                      </div>
                      <div>
                        <b>beforeReply 含 key fact</b>：
                        <BadgeYesNo value={result.keyFactInBefore} />
                      </div>
                      <div>
                        <b>summary 含 key fact</b>：
                        <BadgeYesNo value={result.keyFactInSummary} />
                      </div>
                      <div>
                        <b>summarizeReply 含 key fact</b>：
                        <BadgeYesNo value={result.keyFactInSummarizeReply} />
                      </div>
                      <div className="pt-1 text-gray-600">
                        {result.keyFactInBefore && result.keyFactInSummarizeReply
                          ? "→ 这就是「摘要压缩保留了什么」：key fact 在 before 记得 → summary 里有 → 摘要后也记得。代价：1 次额外 LLM 调用 + 几百 ms。"
                          : result.keyFactInBefore && !result.keyFactInSummarizeReply
                          ? "→ 摘要后忘：可能 keepRecent 太短或 prompt 没强调保留关键事实。把 keepRecent 调大（如 20）再试。"
                          : !result.keyFactInBefore
                          ? "→ 基线就忘：换家模型或 prompt 调一下。"
                          : "→ 罕见情况；如果发生，检查 summary 文本是不是真的进了 messages。"}
                      </div>
                      <div className="pt-2 text-gray-500 text-xs">
                        <b>对照 step-1</b>：step-1 滑动窗口 K=6 时 afterReply 忘 key fact（字面丢失）；step-2 摘要压缩 summarizeReply 记得 key fact（语义保留）。<b>两种策略各丢一类信息</b>。
                      </div>
                    </div>
                  </article>
                </>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 50041 · 协议 A · provider {health?.provider ?? "(待连接)"} · model {health?.model ?? "(待连接)"} · Key {health?.hasKey ? "✅" : "❌"}
            </span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
