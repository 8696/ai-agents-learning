<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token 预算管理 · 第二步</title>

  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入（禁止换 CDN / 版本 / integrity） -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <!-- §5.3.4 强制：React 18.3.1 UMD CDN -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- §5.3.4 强制：Babel Standalone 锁定 7.26.4 -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- §5.3.4 强制：JSX 块内不允许 TypeScript 语法 -->
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── 粗估 token（前端口径；服务端 gpt-tokenizer 是权威）──
    function approxTokens(text) {
      let chinese = 0, other = 0;
      for (const ch of text) {
        if (/[一-鿿]/.test(ch)) chinese += 1;
        else other += 1;
      }
      return Math.ceil(chinese / 1.5 + other / 4);
    }

    function App() {
      const [health, setHealth] = useState(null);
      const [historyCount, setHistoryCount] = useState(50);
      const [outputBudget, setOutputBudget] = useState(800);
      const [totalBudget, setTotalBudget] = useState(2000);
      const [summarizeFrom, setSummarizeFrom] = useState(40);
      const [keepRecent, setKeepRecent] = useState(8);
      const [status, setStatus] = useState({ key: "idle", text: "⏸ 待连接" });
      const [errorMsg, setErrorMsg] = useState("");
      const [errorKind, setErrorKind] = useState(null);
      const [result, setResult] = useState(null);
      const inFlightRef = useRef(false);

      useEffect(() => {
        fetch("/health").then(r => r.json()).then(setHealth).catch(() => setHealth(null));
      }, []);

      async function runCompare() {
        if (inFlightRef.current) return;
        if (health && !health.hasKey) {
          setErrorMsg("apps/.env 没配当前模型提供商的密钥（看页脚 密钥 ❌）");
          setErrorKind("5xx");
          return;
        }
        setErrorMsg("");
        setErrorKind(null);
        setResult(null);
        inFlightRef.current = true;
        setStatus({ key: "loading", text: "🔄 请求中（共 3 次真发网络请求：1 次摘要 + 2 次问答）" });

        try {
          const resp = await fetch("/api/compare", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ historyCount, outputBudget, totalBudget, summarizeFrom, keepRecent }),
          });
          const data = await resp.json();
          if (!resp.ok) {
            const kind = resp.status >= 500 ? "5xx" : "4xx";
            setErrorKind(kind);
            const detail = data.issues
              ? ` · ${data.issues.map(i => i.message || JSON.stringify(i)).join("；")}`
              : "";
            setErrorMsg(`${resp.status} · ${data.error || ""} ${data.stage ? "【" + data.stage + "】 " : ""}${data.message || ""}${detail}`.trim());
            setStatus({ key: "error", text: "❌ 错误" });
            return;
          }
          setResult(data);
          setStatus({ key: "done", text: "✅ 完成" });
        } catch (err) {
          setErrorKind("5xx");
          setErrorMsg(`网络错误：${(err && err.message) || err}`);
          setStatus({ key: "error", text: "❌ 错误" });
        } finally {
          inFlightRef.current = false;
        }
      }

      async function simulateUpstreamError() {
        if (inFlightRef.current) return;
        setErrorMsg("");
        setErrorKind(null);
        inFlightRef.current = true;
        setStatus({ key: "loading", text: "🔄 请求中" });
        try {
          const resp = await fetch("/api/compare-force-error", { method: "POST" });
          const data = await resp.json();
          setErrorKind("5xx");
          setErrorMsg(`${resp.status} · ${data.error || ""} ${data.message || ""}`.trim());
          setStatus({ key: "error", text: "❌ 错误" });
        } catch (err) {
          setErrorKind("5xx");
          setErrorMsg(`网络错误：${(err && err.message) || err}`);
          setStatus({ key: "error", text: "❌ 错误" });
        } finally {
          inFlightRef.current = false;
        }
      }

      const runDisabled = inFlightRef.current || (health && !health.hasKey);

      function MsgItem({ m }) {
        const cls = m.role === "user"
          ? "bg-gray-50 border-gray-300"
          : m.role === "assistant"
          ? "bg-green-50 border-green-300"
          : "bg-yellow-50 border-yellow-300";
        return (
          <li className={"border rounded p-2 text-xs " + cls}>
            <div className="flex items-center justify-between text-gray-500 mb-1">
              <span><b>角色：{m.role === "user" ? "用户" : m.role === "assistant" ? "助手" : "系统"}</b></span>
              <span>≈ {approxTokens(m.content)} 个 token</span>
            </div>
            <div className="whitespace-pre-wrap text-gray-800">{m.content}</div>
          </li>
        );
      }

      function BudgetTable({ label, budget, totalLimit }) {
        const over = budget.total > totalLimit;
        return (
          <div className={"border rounded p-3 " + (over ? "border-red-300 bg-red-50" : "border-green-300 bg-green-50")}>
            <div className="text-xs text-gray-500 mb-1">{label}</div>
            <table className="text-xs w-full">
              <tbody>
                <tr><td className="text-gray-600">系统提示段（system）</td><td className="text-right font-mono">{budget.systemTokens}</td></tr>
                <tr><td className="text-gray-600">历史对话段（history）</td><td className="text-right font-mono">{budget.historyTokens}</td></tr>
                <tr><td className="text-gray-600">给模型输出的预留（output budget）</td><td className="text-right font-mono">{budget.outputBudget}</td></tr>
                <tr className="border-t"><td className="text-gray-800 font-semibold pt-1">三块合计（total）</td>
                  <td className={"text-right font-mono pt-1 " + (over ? "text-red-700" : "text-gray-800")}>
                    {budget.total}
                  </td>
                </tr>
                <tr><td className="text-gray-500">总预算上限（totalBudget）</td><td className="text-right font-mono">{totalLimit}</td></tr>
              </tbody>
            </table>
          </div>
        );
      }

      function StrategyCard({ title, accent, data, budgetLabel, summaryText }) {
        return (
          <article id={data.id} className={"border-2 rounded p-3 space-y-2 " + accent}>
            <header className="flex items-center justify-between">
              <div className="text-sm font-semibold text-gray-800">{title}</div>
              <div className="text-xs text-gray-500">
                模型输出 ≈ <span className="font-mono">{data.replyTokens}</span> 个 token（replyTokens）
              </div>
            </header>
            <BudgetTable label={budgetLabel} budget={data.budget} totalLimit={result.config.totalBudget} />
            <details className="text-xs">
              <summary className="cursor-pointer text-gray-600">展开查看拼装后发给模型的全部消息（{data.messages.length} 条 · messages 数组）</summary>
              <ol className="mt-2 space-y-1 max-h-64 overflow-auto">
                {data.messages.map((m, i) => <MsgItem key={i} m={m} />)}
              </ol>
            </details>
            {summaryText ? (
              <div className="border border-blue-300 bg-blue-50 rounded p-2 space-y-1">
                <div className="text-xs text-gray-500">远期摘要原文（summary · 喂给模型的那段）</div>
                <div className="text-xs whitespace-pre-wrap text-gray-800">{summaryText}</div>
              </div>
            ) : null}
            <div className="border rounded p-2 space-y-1">
              <div className="text-xs text-gray-500">模型回答（reply）</div>
              <div className="bg-green-50 border border-green-300 rounded p-2 text-sm whitespace-pre-wrap text-gray-800">
                {data.reply}
              </div>
              <div className="text-xs text-gray-700">
                <b>是否提到关键事实（hasKeyFact）</b>：
                <span className={
                  "ml-1 px-2 py-0.5 rounded text-xs " +
                  (data.hasKeyFact ? "bg-green-200 text-green-900" : "bg-red-200 text-red-900")
                }>
                  {data.hasKeyFact ? "✅ 是（✅）" : "❌ 否（❌）"}
                </span>
                {data.triggered ? <span className="ml-2 text-gray-500">（丢了 {data.droppedFromHistory} 条非系统消息 · dropped）</span> : null}
                {data.droppedFromRecent ? <span className="ml-2 text-gray-500">（近期又丢了 {data.droppedFromRecent} 条）</span> : null}
              </div>
            </div>
          </article>
        );
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">Token 预算管理（Token Budget） · 第二步（step-2） · 两种裁剪方法对照</h1>
            <span id="status-pill" className={
              "text-xs px-2 py-1 rounded " +
              (status.key === "loading" ? "bg-yellow-200" :
               status.key === "done"    ? "bg-green-200" :
               status.key === "error"   ? "bg-red-200" :
                                          "bg-gray-200")
            }>{status.text}</span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">本页只演示：<b>两种裁剪方法对照</b>——同样一个问题、同一个模型、同一份历史对话、同一份总预算，唯一变量是裁剪方法。方法一「直接丢最旧」（trim） vs 方法二「把远期压缩成摘要 + 近期留原文」（summarize）。</p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>调旋钮：历史对话轮数 / 给模型输出的预留 / 总预算上限 / 远期喂摘要的条数 / 近期留原文的条数</li>
                <li>第 1 轮假对话故意放了「关键事实」：我叫 Tina，住上海，最喜欢吃日料</li>
                <li>点「跑对照」→ 服务端先算三块预算，再走两条路径</li>
                <li>方法一路径：直接丢最旧直到 fit → 拼消息发给模型 → 拿到回答一</li>
                <li>方法二路径：远期 N 条 → 调一次模型做摘要 → 拼消息发给模型 → 拿到回答二</li>
                <li>系统检测两个回答里有没有「陈述」关键事实（区分肯定句 vs 反例/否认）→ 一眼对比</li>
                <li><b>错误两类 · 一眼分开</b>：参数不合法（Zod bad_request）→ 4xx（黄底） · 点「演示上游失败」→ 5xx（红底）</li>
              </ol>

              {/* 核心教学点卡片（§5.3.11.b 强制） */}
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">「丢字面 vs 留语义」的可观察对照：方法一（直接丢最旧 / trim）会丢字面、模型忘关键事实；方法二（远期摘要 + 近期原文 / summarize）用 1 次额外 LLM 调用把远期浓缩成 1 条 summary 留住语义。代价：summarize 多 1 次真发网络请求、摘要本身有损。</div>
                <div className="text-xs text-gray-600">怎么观察：看「① 两种方法结果对照小结（对比小结）」— 绿色 ✅ = 模型在回答里陈述了关键事实（我叫 Tina / 住上海 / 喜欢吃日料）；红色 ❌ = 忘了 / 用了反例句式（说"未提及"）。一次跑能看到两种策略的差异。</div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                <label className="text-xs text-gray-600">
                  历史对话轮数（historyCount）：<span className="font-mono">{historyCount}</span>
                  <input id="ctrl-history-count" type="range" min="2" max="200" step="1"
                    value={historyCount} onChange={e => setHistoryCount(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  给模型输出的预留（outputBudget · token）：<span className="font-mono">{outputBudget}</span>
                  <input id="ctrl-output-budget" type="range" min="64" max="4000" step="64"
                    value={outputBudget} onChange={e => setOutputBudget(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  总预算上限（totalBudget · token）：<span className="font-mono">{totalBudget}</span>
                  <input id="ctrl-total-budget" type="range" min="512" max="32000" step="128"
                    value={totalBudget} onChange={e => setTotalBudget(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  远期喂摘要的条数（summarizeFrom）：<span className="font-mono">{summarizeFrom}</span>
                  <input id="ctrl-summarize-from" type="range" min="1" max={Math.max(1, historyCount - 1)} step="1"
                    value={Math.min(summarizeFrom, historyCount - 1)} onChange={e => setSummarizeFrom(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  近期留原文的条数（keepRecent）：<span className="font-mono">{keepRecent}</span>
                  <input id="ctrl-keep-recent" type="range" min="0" max="50" step="1"
                    value={keepRecent} onChange={e => setKeepRecent(Number(e.target.value))}
                    className="w-full" />
                </label>
              </div>
              <div className="flex gap-2 flex-wrap">
                <button
                  id="btn-run-compare"
                  className="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50"
                  onClick={runCompare}
                  disabled={runDisabled}
                >跑对照（runCompare）</button>
                <button
                  id="btn-simulate-error"
                  className="border border-orange-300 text-orange-700 px-4 py-2 rounded text-sm"
                  onClick={simulateUpstreamError}
                >演示上游失败（5xx · 第二类错误 · /api/compare-force-error）</button>
              </div>
              {errorMsg ? (
                <div
                  id="error-box"
                  className={
                    "text-xs px-3 py-2 rounded border " +
                    (errorKind === "5xx"
                      ? "border-red-300 bg-red-50 text-red-700"
                      : "border-yellow-300 bg-yellow-50 text-yellow-800")
                  }
                >
                  <div className="font-semibold">
                    {errorKind === "5xx" ? "上游失败（5xx）" : "入参校验失败（4xx）"}
                  </div>
                  <div className="mt-1">{errorMsg}</div>
                </div>
              ) : null}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!result ? (
                <div className="text-xs text-gray-400">（还没结果。先调旋钮，再点「跑对照」。）</div>
              ) : (
                <>
                  {/* 卡 ① 双策略判定小结 */}
                  <article id="card-summary" className="border border-blue-300 bg-blue-50 rounded p-3 space-y-2">
                    <header className="flex items-center justify-between">
                      <div className="text-sm font-semibold text-gray-800">① 两种方法结果对照小结（对比小结）</div>
                    </header>
                    <div className="text-xs text-gray-700 space-y-1">
                      <div>
                        <b>关键事实</b>：<span id="key-fact" className="font-mono">{result.keyFact}</span>
                      </div>
                      <div>
                        <b>问句</b>：<span className="font-mono">{result.question}</span>
                      </div>
                      <div className="pt-1">{result.对比小结}</div>
                    </div>
                  </article>

                  {/* 卡 ② 方法一：直接丢最旧 */}
                  <StrategyCard
                    title="② 方法一：直接丢最旧的非系统消息"
                    accent="border-orange-300"
                    data={result.trim}
                    budgetLabel="方法一裁剪后 · 三块预算"
                    summaryText={null}
                  />

                  {/* 卡 ③ 方法二：远期摘要 + 近期原文 */}
                  <StrategyCard
                    title="③ 方法二：远期摘要 + 近期原文"
                    accent="border-green-300"
                    data={result.summarize}
                    budgetLabel="方法二裁剪后 · 三块预算"
                    summaryText={result.summary}
                  />

                  {/* 卡 ④ 裁前三块预算（参照基线） */}
                  <article id="card-before" className="border border-gray-300 rounded p-3 space-y-2">
                    <div className="text-sm font-semibold text-gray-800">④ 裁剪前的三块预算（参照基线 · beforeBudget）</div>
                    <BudgetTable label="裁剪前" budget={result.beforeBudget} totalLimit={result.config.totalBudget} />
                  </article>
                </>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 50046 · 协议 A · 模型服务商 {health?.provider ?? "(待连接)"} · 模型 {health?.model ?? "(待连接)"} · 密钥 {health?.hasKey ? "✅" : "❌"}
            </span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
