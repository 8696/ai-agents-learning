<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>压缩 / 摘要 vs 滑动窗口 · step-3</title>

  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <!-- §5.3.4 强制：React 18.3.1 UMD -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <!-- §5.3.4 强制：Babel Standalone 锁定 7.26.4 -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <!-- §5.3.4 强制：JSX 块内不允许 TypeScript 语法 -->
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function approxTokens(text) {
      let chinese = 0, other = 0;
      for (const ch of text) {
        if (/[一-鿿]/.test(ch)) chinese += 1;
        else other += 1;
      }
      return Math.ceil(chinese / 1.5 + other / 4);
    }

    function App() {
      const [health, setHealth] = useState(null);
      const [turnCount, setTurnCount] = useState(50);
      const [slidingWindowSize, setSlidingWindowSize] = useState(6);
      const [summarizeFrom, setSummarizeFrom] = useState(45);
      const [keepRecent, setKeepRecent] = useState(5);
      const [keyFactAtTurn, setKeyFactAtTurn] = useState(1);
      const [status, setStatus] = useState({ key: "idle", text: "⏸ 待连接" });
      const [errorMsg, setErrorMsg] = useState("");
      const [errorKind, setErrorKind] = useState(null);
      const [result, setResult] = useState(null);
      const inFlightRef = useRef(false);

      useEffect(() => {
        fetch("/health").then(r => r.json()).then(setHealth).catch(() => setHealth(null));
      }, []);

      const paramValid = summarizeFrom + keepRecent <= turnCount;

      async function runThreeWay() {
        if (inFlightRef.current) return;
        if (!paramValid) {
          setErrorMsg(`参数非法：summarizeFrom(${summarizeFrom}) + keepRecent(${keepRecent}) 不能超过 turnCount(${turnCount})`);
          setErrorKind("4xx");
          return;
        }
        if (health && !health.hasKey) {
          setErrorMsg("apps/.env 没配当前 LLM_PROVIDER 的 Key");
          setErrorKind("5xx");
          return;
        }
        setErrorMsg("");
        setErrorKind(null);
        setResult(null);
        inFlightRef.current = true;
        setStatus({ key: "loading", text: "🔄 请求中（4 次真调模型）" });

        try {
          const resp = await fetch("/api/three-way", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ turnCount, slidingWindowSize, summarizeFrom, keepRecent, keyFactAtTurn }),
          });
          const data = await resp.json();
          if (!resp.ok) {
            const kind = resp.status >= 500 ? "5xx" : "4xx";
            setErrorKind(kind);
            const detail = data.issues
              ? ` · ${data.issues.map(i => i.message || JSON.stringify(i)).join("；")}`
              : "";
            setErrorMsg(`${resp.status} · ${data.error || ""} ${data.message || ""}${detail}`.trim());
            setStatus({ key: "error", text: "❌ 错误" });
            return;
          }
          setResult(data);
          setStatus({ key: "done", text: "✅ 完成" });
        } catch (err) {
          setErrorKind("5xx");
          setErrorMsg(`网络错误：${(err && err.message) || err}`);
          setStatus({ key: "error", text: "❌ 错误" });
        } finally {
          inFlightRef.current = false;
        }
      }

      async function simulateUpstreamError() {
        if (inFlightRef.current) return;
        setErrorMsg("");
        setErrorKind(null);
        inFlightRef.current = true;
        setStatus({ key: "loading", text: "🔄 请求中" });
        try {
          const resp = await fetch("/api/three-way-force-error", { method: "POST" });
          const data = await resp.json();
          setErrorKind("5xx");
          setErrorMsg(`${resp.status} · ${data.error || ""} ${data.message || ""}`.trim());
          setStatus({ key: "error", text: "❌ 错误" });
        } catch (err) {
          setErrorKind("5xx");
          setErrorMsg(`网络错误：${(err && err.message) || err}`);
          setStatus({ key: "error", text: "❌ 错误" });
        } finally {
          inFlightRef.current = false;
        }
      }

      const runDisabled = inFlightRef.current || (health && !health.hasKey) || !paramValid;

      function MsgItem({ m }) {
        const cls = m.role === "user"
          ? "bg-gray-50 border-gray-300"
          : m.role === "assistant"
          ? "bg-green-50 border-green-300"
          : "bg-yellow-50 border-yellow-300";
        return (
          <li className={"border rounded p-2 text-xs " + cls}>
            <div className="flex items-center justify-between text-gray-500 mb-1">
              <span><b>{m.role}</b></span>
              <span>≈ {approxTokens(m.content)} tokens</span>
            </div>
            <div className="whitespace-pre-wrap text-gray-800">{m.content}</div>
          </li>
        );
      }

      function BadgeYesNo({ value }) {
        return (
          <span className={
            "ml-1 px-2 py-0.5 rounded text-xs " +
            (value ? "bg-green-200 text-green-900" : "bg-red-200 text-red-900")
          }>
            {value ? "✅ 是" : "❌ 否"}
          </span>
        );
      }

      function StageCard({ id, title, msgs, reply, hasKeyFact, accentColor }) {
        const totalTokens = msgs.reduce((s, m) => s + approxTokens(m.content), 0);
        return (
          <article id={id} className={`border ${accentColor} rounded p-3 space-y-2`}>
            <header className="flex items-center justify-between">
              <div className="text-sm font-semibold text-gray-800">{title}</div>
              <div className="text-xs text-gray-500">
                messages 长度 = <span className="font-mono">{msgs.length}</span>
                {" · "}
                估算 token ≈ <span className="font-mono">{totalTokens}</span>
              </div>
            </header>
            <div className="text-xs text-gray-500">模型回答：</div>
            <div className="bg-green-50 border border-green-300 rounded p-2 text-sm whitespace-pre-wrap text-gray-800 max-h-48 overflow-auto">
              {reply}
            </div>
            <div className="text-xs">
              含 key fact <BadgeYesNo value={hasKeyFact} />
            </div>
            <details className="text-xs">
              <summary className="cursor-pointer text-gray-600">看 messages（{msgs.length} 条）</summary>
              <ol className="mt-2 space-y-1 max-h-64 overflow-auto">
                {msgs.map((m, i) => <MsgItem key={i} m={m} />)}
              </ol>
            </details>
          </article>
        );
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">压缩 / 摘要 vs 滑动窗口 · step-3</h1>
            <span id="status-pill" className={
              "text-xs px-2 py-1 rounded " +
              (status.key === "loading" ? "bg-yellow-200" :
               status.key === "done"    ? "bg-green-200" :
               status.key === "error"   ? "bg-red-200" :
                                          "bg-gray-200")
            }>{status.text}</span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">本页只演示：<b>三方对照</b>——同一份 50 轮假历史 + 同一问句 + 同一模型，三种裁剪策略并跑：① 完整（基线） ② 滑动窗口（按条数 + system pin） ③ 摘要压缩（远期 summary + 近期原文）。</p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>调五个旋钮（turnCount / slidingWindowSize / summarizeFrom / keepRecent / keyFactAtTurn）</li>
                <li>点「跑三方对照」→ 服务端拼三份 messages + 调真模型 4 次（完整 + 滑动 + 摘要 + 摘要后）</li>
                <li>看四张策略卡 + 一张三方对比小结</li>
                <li><b>核心可观察</b>：同一问句「你还记得吗」，三种策略下模型答案里有没有 key fact</li>
                <li><b>对照 step-1 + step-2</b>：step-1 滑动窗口忘、step-2 摘要压缩记得 —— step-3 一页同时看见</li>
                <li><b>错误两类 · 一眼分开</b>：summarizeFrom + keepRecent 超 turnCount → 4xx（黄底） · 点「演示后端 5xx」→ 5xx（红底）</li>
              </ol>
              {/* 核心教学点卡片（§5.3.11.b 强制） */}
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">三方对照的标准结果:`full ✅ / sliding ❌ / summarize ✅`——同一份 50 轮假历史 + 同一问句 + 同一模型,三种裁剪策略并跑 4 次真调,一页五张卡同时看见「丢字面 vs 留语义」的可观察对照。这页是 step-1 和 step-2 的总结视图,也是「裁剪不是单一动作」的最强物理证据。</div>
                <div className="text-xs text-gray-600">怎么观察:点「跑三方对照」调真模型 4 次,看 5 张卡:① 完整(基线);② 滑动窗口——key fact 在窗口外 → 答错/不知道;③ 摘要压缩——key fact 在 summary 里 → 答对;④ summary 实际内容(看 LLM 写了什么);⑤ 三方对比小结 → 看 full ✅ / sliding ❌ / summarize ✅ 三个判定 pill——一张图证明滑动窗口扔字、摘要压缩留语义。</div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                <label className="text-xs text-gray-600">
                  假对话轮数 (turnCount)：<span className="font-mono">{turnCount}</span>
                  <input id="ctrl-turn-count" type="range" min="2" max="80" step="1"
                    value={turnCount} onChange={e => setTurnCount(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  滑动窗口 K (slidingWindowSize)：<span className="font-mono">{slidingWindowSize}</span>
                  <input id="ctrl-window-size" type="range" min="2" max={turnCount} step="1"
                    value={slidingWindowSize} onChange={e => setSlidingWindowSize(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  待摘要 (summarizeFrom)：<span className="font-mono">{summarizeFrom}</span>
                  <input id="ctrl-summarize-from" type="range" min="1" max={turnCount} step="1"
                    value={summarizeFrom} onChange={e => setSummarizeFrom(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  保留近期 (keepRecent)：<span className="font-mono">{keepRecent}</span>
                  <input id="ctrl-keep-recent" type="range" min="0" max={turnCount - 1} step="1"
                    value={keepRecent} onChange={e => setKeepRecent(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  key fact 放第几轮：<span className="font-mono">{keyFactAtTurn}</span>
                  <input id="ctrl-key-fact-turn" type="range" min="1" max={turnCount} step="1"
                    value={keyFactAtTurn} onChange={e => setKeyFactAtTurn(Number(e.target.value))}
                    className="w-full" />
                </label>
              </div>
              {!paramValid ? (
                <div className="text-xs text-orange-700">
                  ⚠️ summarizeFrom + keepRecent ({summarizeFrom + keepRecent}) 不能超过 turnCount ({turnCount})
                </div>
              ) : null}
              <div className="flex gap-2 flex-wrap">
                <button
                  id="btn-run-three-way"
                  className="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50"
                  onClick={runThreeWay}
                  disabled={runDisabled}
                >跑三方对照（4 次真调模型）</button>
                <button
                  id="btn-simulate-error"
                  className="border border-orange-300 text-orange-700 px-4 py-2 rounded text-sm"
                  onClick={simulateUpstreamError}
                >演示后端 5xx（5xx · 类 B）</button>
              </div>
              {errorMsg ? (
                <div
                  id="error-box"
                  className={
                    "text-xs px-3 py-2 rounded border " +
                    (errorKind === "5xx"
                      ? "border-red-300 bg-red-50 text-red-700"
                      : "border-yellow-300 bg-yellow-50 text-yellow-800")
                  }
                >
                  <div className="font-semibold">
                    {errorKind === "5xx" ? "后端错误（5xx）" : "入参校验失败（4xx）"}
                  </div>
                  <div className="mt-1">{errorMsg}</div>
                </div>
              ) : null}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!result ? (
                <div className="text-xs text-gray-400">（空 · 还没跑三方对照。先调五个旋钮，再点「跑三方对照」。）</div>
              ) : (
                <>
                  {/* 卡 ① 完整（基线） */}
                  <StageCard
                    id="card-full"
                    title="① 完整（基线 · 不裁剪）"
                    msgs={result.full.messages}
                    reply={result.full.reply}
                    hasKeyFact={result.full.hasKeyFact}
                    accentColor="border-gray-300"
                  />

                  {/* 卡 ② 滑动窗口 */}
                  <StageCard
                    id="card-sliding"
                    title={`② 滑动窗口（按条数 K=${slidingWindowSize} · system pin）`}
                    msgs={result.sliding.messages}
                    reply={result.sliding.reply}
                    hasKeyFact={result.sliding.hasKeyFact}
                    accentColor="border-orange-300"
                  />

                  {/* 卡 ③ 摘要压缩 */}
                  <StageCard
                    id="card-summarize"
                    title={`③ 摘要压缩（远期 ${summarizeFrom} 条 → summary + 近期 ${keepRecent} 条原文）`}
                    msgs={result.summarize.messages}
                    reply={result.summarize.reply}
                    hasKeyFact={result.summarize.hasKeyFact}
                    accentColor="border-purple-300"
                  />

                  {/* 卡 ④ summary 内容 */}
                  <article id="card-summary-content" className="border border-purple-200 bg-purple-50 rounded p-3 space-y-2">
                    <header className="flex items-center justify-between">
                      <div className="text-sm font-semibold text-gray-800">
                        ④ summary 内容（看 LLM 写了啥 · ③ 的输入）
                      </div>
                      <div className="text-xs text-gray-500">
                        字数 ≈ <span className="font-mono">{result.summary.length}</span>
                        {" · "}
                        估算 token ≈ <span className="font-mono">{approxTokens(result.summary)}</span>
                      </div>
                    </header>
                    <div className="bg-white border border-purple-300 rounded p-2 text-sm whitespace-pre-wrap text-gray-800 max-h-48 overflow-auto">
                      {result.summary}
                    </div>
                  </article>

                  {/* 卡 ⑤ 三方对比小结 */}
                  <article id="card-three-way-summary" className="border border-blue-300 bg-blue-50 rounded p-3 space-y-2">
                    <header className="flex items-center justify-between">
                      <div className="text-sm font-semibold text-gray-800">
                        ⑤ 三方对比小结
                      </div>
                    </header>
                    <div className="text-xs text-gray-700 space-y-1">
                      <div>
                        <b>关键事实（key fact）</b>：<span className="font-mono">{result.keyFact}</span>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                        <div className="border border-gray-300 bg-white rounded p-2">
                          <div className="font-semibold">① 完整</div>
                          <div>含 key fact <BadgeYesNo value={result.full.hasKeyFact} /></div>
                        </div>
                        <div className="border border-orange-300 bg-white rounded p-2">
                          <div className="font-semibold">② 滑动窗口</div>
                          <div>含 key fact <BadgeYesNo value={result.sliding.hasKeyFact} /></div>
                        </div>
                        <div className="border border-purple-300 bg-white rounded p-2">
                          <div className="font-semibold">③ 摘要压缩</div>
                          <div>含 key fact <BadgeYesNo value={result.summarize.hasKeyFact} /></div>
                        </div>
                      </div>
                      <div className="pt-2 text-gray-600">
                        {result.full.hasKeyFact && !result.sliding.hasKeyFact && result.summarize.hasKeyFact
                          ? "→ 标准结果：滑动窗口丢字面（② ❌） / 摘要压缩留语义（③ ✅）。这是本条的核心可观察对照。"
                          : result.full.hasKeyFact && result.sliding.hasKeyFact && result.summarize.hasKeyFact
                          ? "→ 三方都记得：可能 key fact 在窗口内（keyFactAtTurn 大）+ summary 里也写了。把 keyFactAtTurn 调回 1 / slidingWindowSize 调小（如 2）再看「丢」。"
                          : !result.full.hasKeyFact
                          ? "→ 基线忘：换家模型或 prompt 调一下。"
                          : "→ 异常组合；检查 summary 文本和 messages 是否对齐。"}
                      </div>
                      <div className="pt-2 text-gray-500 text-xs">
                        <b>代价对比</b>：① 完整 = 0 裁剪，但 messages 长；② 滑动窗口 = 0 额外调用，纯本地 O(K)；③ 摘要压缩 = 1 次额外 LLM 调用 ≈ 500ms~3s + summary 本身的 prompt token。
                      </div>
                      <div className="pt-1 text-gray-500 text-xs">
                        <b>控制 token 成本</b>（对照 6.2 详解）：不压 → 每次请求 token 数随对话长度线性涨；压 → 有上限。这就是摘要压缩是生产 Chat App 标配的原因。
                      </div>
                    </div>
                  </article>
                </>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 50042 · 协议 A · provider {health?.provider ?? "(待连接)"} · model {health?.model ?? "(待连接)"} · Key {health?.hasKey ? "✅" : "❌"}
            </span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
