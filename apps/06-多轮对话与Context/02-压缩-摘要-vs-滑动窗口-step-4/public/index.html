<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>压缩 / 摘要 vs 滑动窗口 · step-4</title>

  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <!-- §5.3.4 强制：React 18.3.1 UMD -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <!-- §5.3.4 强制：Babel Standalone 锁定 7.26.4 -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <!-- §5.3.4 强制：JSX 块内不允许 TypeScript 语法 -->
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function approxTokens(text) {
      let chinese = 0, other = 0;
      for (const ch of text) {
        if (/[一-鿿]/.test(ch)) chinese += 1;
        else other += 1;
      }
      return Math.ceil(chinese / 1.5 + other / 4);
    }

    function App() {
      const [health, setHealth] = useState(null);
      const [turnCount, setTurnCount] = useState(50);
      const [slidingWindowSize, setSlidingWindowSize] = useState(6);
      const [summarizeFrom, setSummarizeFrom] = useState(45);
      const [keepRecent, setKeepRecent] = useState(5);
      const [keyFactAtTurn, setKeyFactAtTurn] = useState(1);
      const [simulateSummarizeFail, setSimulateSummarizeFail] = useState(false);
      const [status, setStatus] = useState({ key: "idle", text: "⏸ 待连接" });
      const [errorMsg, setErrorMsg] = useState("");
      const [errorKind, setErrorKind] = useState(null);
      const [result, setResult] = useState(null);
      const inFlightRef = useRef(false);

      useEffect(() => {
        fetch("/health").then(r => r.json()).then(setHealth).catch(() => setHealth(null));
      }, []);

      const paramValid = summarizeFrom + keepRecent <= turnCount;

      async function runThreeWay() {
        if (inFlightRef.current) return;
        if (!paramValid) {
          setErrorMsg(`参数非法：summarizeFrom(${summarizeFrom}) + keepRecent(${keepRecent}) 不能超过 turnCount(${turnCount})`);
          setErrorKind("4xx");
          return;
        }
        if (health && !health.hasKey) {
          setErrorMsg("apps/.env 没配当前 LLM_PROVIDER 的 Key");
          setErrorKind("5xx");
          return;
        }
        setErrorMsg("");
        setErrorKind(null);
        setResult(null);
        inFlightRef.current = true;
        setStatus({ key: "loading", text: simulateSummarizeFail ? "🔄 请求中（4 次真调 + 摘要故意失败）" : "🔄 请求中（4 次真调模型）" });

        try {
          const resp = await fetch("/api/three-way-with-fallback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ turnCount, slidingWindowSize, summarizeFrom, keepRecent, keyFactAtTurn, simulateSummarizeFail }),
          });
          const data = await resp.json();
          if (!resp.ok) {
            const kind = resp.status >= 500 ? "5xx" : "4xx";
            setErrorKind(kind);
            const detail = data.issues
              ? ` · ${data.issues.map(i => i.message || JSON.stringify(i)).join("；")}`
              : "";
            setErrorMsg(`${resp.status} · ${data.error || ""} ${data.message || ""}${detail}`.trim());
            setStatus({ key: "error", text: "❌ 错误" });
            return;
          }
          setResult(data);
          setStatus({ key: "done", text: data.fallback.used ? "⚠️ 兜底降级（200）" : "✅ 完成" });
        } catch (err) {
          setErrorKind("5xx");
          setErrorMsg(`网络错误：${(err && err.message) || err}`);
          setStatus({ key: "error", text: "❌ 错误" });
        } finally {
          inFlightRef.current = false;
        }
      }

      async function simulateUpstreamError() {
        if (inFlightRef.current) return;
        setErrorMsg("");
        setErrorKind(null);
        inFlightRef.current = true;
        setStatus({ key: "loading", text: "🔄 请求中" });
        try {
          const resp = await fetch("/api/three-way-force-error", { method: "POST" });
          const data = await resp.json();
          setErrorKind("5xx");
          setErrorMsg(`${resp.status} · ${data.error || ""} ${data.message || ""}`.trim());
          setStatus({ key: "error", text: "❌ 错误" });
        } catch (err) {
          setErrorKind("5xx");
          setErrorMsg(`网络错误：${(err && err.message) || err}`);
          setStatus({ key: "error", text: "❌ 错误" });
        } finally {
          inFlightRef.current = false;
        }
      }

      const runDisabled = inFlightRef.current || (health && !health.hasKey) || !paramValid;

      function MsgItem({ m }) {
        const cls = m.role === "user"
          ? "bg-gray-50 border-gray-300"
          : m.role === "assistant"
          ? "bg-green-50 border-green-300"
          : "bg-yellow-50 border-yellow-300";
        return (
          <li className={"border rounded p-2 text-xs " + cls}>
            <div className="flex items-center justify-between text-gray-500 mb-1">
              <span><b>{m.role}</b></span>
              <span>≈ {approxTokens(m.content)} tokens</span>
            </div>
            <div className="whitespace-pre-wrap text-gray-800">{m.content}</div>
          </li>
        );
      }

      function BadgeYesNo({ value }) {
        return (
          <span className={
            "ml-1 px-2 py-0.5 rounded text-xs " +
            (value ? "bg-green-200 text-green-900" : "bg-red-200 text-red-900")
          }>
            {value ? "✅ 是" : "❌ 否"}
          </span>
        );
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">压缩 / 摘要 vs 滑动窗口 · step-4</h1>
            <span id="status-pill" className={
              "text-xs px-2 py-1 rounded " +
              (status.key === "loading" ? "bg-yellow-200" :
               status.key === "done"    ? "bg-green-200" :
               status.key === "error"   ? "bg-red-200" :
                                          "bg-gray-200")
            }>{status.text}</span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">本页只演示：<b>摘要失败兜底降级</b>——同 step-3 三方对照，加一个开关「模拟摘要失败」。摘要失败时 → 服务端不返回 502 → 自动降级到滑动窗口（用户感知不到失败），日志 warn「摘要失败，降级为滑动窗口」。</p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>默认（模拟失败 = false）：跑三方对照（同 step-3），摘要成功 → 摘要压缩版答题</li>
                <li>勾「模拟摘要失败」再点：摘要 throw → catch → fallback 标记 used=true → 用滑动窗口答题（仍是 200）</li>
                <li><b>核心可观察</b>：两种模式页面都正常显示（status 都是绿底 ✅/⚠️），但 fallback 模式答题用的是滑动窗口的消息</li>
                <li><b>对照 step-3</b>：step-3 摘要失败 → 502 → 用户看到红字 ❌；step-4 摘要失败 → 200 + fallback 标记 → 用户无感知（服务端日志可见）</li>
                <li>点「演示上游失败」→ 5xx 红字 + 页面红底（这是另一种失败通道，与兜底降级形成对照）</li>
              </ol>
              {/* 核心教学点卡片（§5.3.11.b 强制） */}
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">摘要失败**不能**让用户看到 502——catch → fallback 标记 `used: "sliding_window"` → 用滑动窗口答题(仍 200);服务端日志 warn「摘要失败,降级为滑动窗口」可见,前端体感不到失败。**生产里几乎都是「摘要为主 + 滑动窗口兜底」混合用**——本条演示兜底逻辑的物理形态。失败通道有两种:① 摘要 LLM 失败 → 内部降级到滑动窗口(用户无感);② 上游/网关 5xx → 页面红字(用户可见)。</div>
                <div className="text-xs text-gray-600">怎么观察:① 默认(模拟失败=false)→ 同 step-3 三方对照,摘要成功 → 摘要压缩版答题;② 勾「模拟摘要失败」→ 摘要 throw → catch → fallback used=true → 滑动窗口答题,**仍是 200**(status 绿底/黄底而不是红底);③ 服务端日志 warn「摘要失败,降级为滑动窗口」;④ 点「演示上游失败」→ 5xx 红字 + 页面红底——对照证明兜底降级只处理「摘要内部失败」不处理「外部 5xx」。</div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                <label className="text-xs text-gray-600">
                  假对话轮数 (turnCount)：<span className="font-mono">{turnCount}</span>
                  <input id="ctrl-turn-count" type="range" min="2" max="80" step="1"
                    value={turnCount} onChange={e => setTurnCount(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  滑动窗口 K：<span className="font-mono">{slidingWindowSize}</span>
                  <input id="ctrl-window-size" type="range" min="2" max={turnCount} step="1"
                    value={slidingWindowSize} onChange={e => setSlidingWindowSize(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  待摘要：<span className="font-mono">{summarizeFrom}</span>
                  <input id="ctrl-summarize-from" type="range" min="1" max={turnCount} step="1"
                    value={summarizeFrom} onChange={e => setSummarizeFrom(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  保留近期：<span className="font-mono">{keepRecent}</span>
                  <input id="ctrl-keep-recent" type="range" min="0" max={turnCount - 1} step="1"
                    value={keepRecent} onChange={e => setKeepRecent(Number(e.target.value))}
                    className="w-full" />
                </label>
                <label className="text-xs text-gray-600">
                  key fact 放第几轮：<span className="font-mono">{keyFactAtTurn}</span>
                  <input id="ctrl-key-fact-turn" type="range" min="1" max={turnCount} step="1"
                    value={keyFactAtTurn} onChange={e => setKeyFactAtTurn(Number(e.target.value))}
                    className="w-full" />
                </label>
              </div>
              {!paramValid ? (
                <div className="text-xs text-orange-700">
                  ⚠️ summarizeFrom + keepRecent ({summarizeFrom + keepRecent}) 不能超过 turnCount ({turnCount})
                </div>
              ) : null}
              <div className="flex items-center gap-3">
                <label className="flex items-center gap-2 text-sm cursor-pointer">
                  <input id="ctrl-simulate-fail" type="checkbox"
                    checked={simulateSummarizeFail}
                    onChange={e => setSimulateSummarizeFail(e.target.checked)}
                    className="w-4 h-4" />
                  <span className={simulateSummarizeFail ? "text-red-700 font-semibold" : "text-gray-700"}>
                    模拟摘要失败（教学注入 · 触发兜底降级）
                  </span>
                </label>
              </div>
              <div className="flex gap-2 flex-wrap">
                <button
                  id="btn-run-three-way"
                  className="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50"
                  onClick={runThreeWay}
                  disabled={runDisabled}
                >跑对照（含兜底）</button>
                <button
                  id="btn-simulate-error"
                  className="border border-orange-300 text-orange-700 px-4 py-2 rounded text-sm"
                  onClick={simulateUpstreamError}
                >演示上游失败（5xx · 类 B）</button>
              </div>
              {errorMsg ? (
                <div
                  id="error-box"
                  className={
                    "text-xs px-3 py-2 rounded border " +
                    (errorKind === "5xx"
                      ? "border-red-300 bg-red-50 text-red-700"
                      : "border-yellow-300 bg-yellow-50 text-yellow-800")
                  }
                >
                  <div className="font-semibold">
                    {errorKind === "5xx" ? "上游失败（5xx）" : "入参校验失败（4xx）"}
                  </div>
                  <div className="mt-1">{errorMsg}</div>
                </div>
              ) : null}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!result ? (
                <div className="text-xs text-gray-400">（空 · 还没跑对照。先调旋钮 + 选是否模拟失败，再点「跑对照」。）</div>
              ) : (
                <>
                  {/* 卡 ① 完整 */}
                  <article id="card-full" className="border border-gray-300 rounded p-3 space-y-2">
                    <header className="flex items-center justify-between">
                      <div className="text-sm font-semibold text-gray-800">① 完整（基线）</div>
                      <div className="text-xs text-gray-500">
                        messages 长度 = <span className="font-mono">{result.full.messages.length}</span>
                        {" · "}
                        含 key fact <BadgeYesNo value={result.full.hasKeyFact} />
                      </div>
                    </header>
                    <div className="bg-green-50 border border-green-300 rounded p-2 text-sm whitespace-pre-wrap text-gray-800 max-h-32 overflow-auto">
                      {result.full.reply}
                    </div>
                  </article>

                  {/* 卡 ② 滑动窗口 */}
                  <article id="card-sliding" className="border border-orange-300 rounded p-3 space-y-2">
                    <header className="flex items-center justify-between">
                      <div className="text-sm font-semibold text-gray-800">② 滑动窗口（K={slidingWindowSize}）</div>
                      <div className="text-xs text-gray-500">
                        messages 长度 = <span className="font-mono">{result.sliding.messages.length}</span>
                        {" · "}
                        含 key fact <BadgeYesNo value={result.sliding.hasKeyFact} />
                      </div>
                    </header>
                    <div className="bg-green-50 border border-green-300 rounded p-2 text-sm whitespace-pre-wrap text-gray-800 max-h-32 overflow-auto">
                      {result.sliding.reply}
                    </div>
                  </article>

                  {/* 卡 ③ 摘要压缩 或 兜底版 */}
                  <article id="card-summarize-or-fallback" className={
                    "border rounded p-3 space-y-2 " +
                    (result.fallback.used
                      ? "border-red-300 bg-red-50"
                      : "border-purple-300 bg-purple-50")
                  }>
                    <header className="flex items-center justify-between">
                      <div className="text-sm font-semibold text-gray-800">
                        {result.fallback.used ? "③ 摘要压缩位（兜底降级 · 滑动窗口答题）" : "③ 摘要压缩（正常）"}
                      </div>
                      <div className="text-xs text-gray-500">
                        含 key fact <BadgeYesNo value={result.summarize_or_fallback.hasKeyFact} />
                      </div>
                    </header>
                    {result.fallback.used ? (
                      <div className="text-xs text-red-700 bg-white border border-red-300 rounded p-2">
                        ⚠️ 摘要 LLM 失败 → 已自动降级到滑动窗口（页面仍 200）；用户感知不到失败。
                        <div className="mt-1 text-gray-600">原因：{result.fallback.reason}</div>
                      </div>
                    ) : null}
                    <div className="bg-green-50 border border-green-300 rounded p-2 text-sm whitespace-pre-wrap text-gray-800 max-h-32 overflow-auto">
                      {result.summarize_or_fallback.reply}
                    </div>
                  </article>

                  {/* 卡 ④ 兜底标记 */}
                  <article id="card-fallback" className={
                    "border rounded p-3 space-y-2 " +
                    (result.fallback.used ? "border-red-300 bg-red-50" : "border-green-300 bg-green-50")
                  }>
                    <header className="flex items-center justify-between">
                      <div className="text-sm font-semibold text-gray-800">④ 兜底标记</div>
                    </header>
                    <div className="text-xs space-y-1">
                      <div>
                        <b>本次走了 fallback 路径</b>：
                        <span id="fallback-used" className={
                          "ml-1 px-2 py-0.5 rounded text-xs " +
                          (result.fallback.used ? "bg-red-200 text-red-900" : "bg-green-200 text-green-900")
                        }>
                          {result.fallback.used ? "⚠️ 是（摘要失败，已降级）" : "✅ 否（摘要正常）"}
                        </span>
                      </div>
                      {result.fallback.used ? (
                        <>
                          <div>
                            <b>失败原因</b>：<span className="font-mono">{result.fallback.reason}</span>
                          </div>
                          <div>
                            <b>兜底用的 messages 长度</b>：<span className="font-mono">{result.fallback.fallbackMessages.length}</span>
                            （与 ② 滑动窗口的 messages 一致）
                          </div>
                          <div className="pt-1 text-gray-600">
                            → 服务端日志会打「摘要失败，降级为滑动窗口」（warn 级）→ 事后运维可发现。
                          </div>
                        </>
                      ) : (
                        <div className="text-gray-600">
                          → 摘要正常成功，未触发兜底路径。想看兜底行为？勾上方「模拟摘要失败」再跑一次。
                        </div>
                      )}
                    </div>
                  </article>

                  {/* 卡 ⑤ 三方对比小结 */}
                  <article id="card-summary" className="border border-blue-300 bg-blue-50 rounded p-3 space-y-2">
                    <header className="flex items-center justify-between">
                      <div className="text-sm font-semibold text-gray-800">⑤ 三方对比小结</div>
                    </header>
                    <div className="text-xs text-gray-700 space-y-1">
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                        <div className="border border-gray-300 bg-white rounded p-2">
                          <div className="font-semibold">① 完整</div>
                          <div>含 key fact <BadgeYesNo value={result.full.hasKeyFact} /></div>
                        </div>
                        <div className="border border-orange-300 bg-white rounded p-2">
                          <div className="font-semibold">② 滑动窗口</div>
                          <div>含 key fact <BadgeYesNo value={result.sliding.hasKeyFact} /></div>
                        </div>
                        <div className={"border rounded p-2 " + (result.fallback.used ? "border-red-300 bg-white" : "border-purple-300 bg-white")}>
                          <div className="font-semibold">
                            {result.fallback.used ? "③ 兜底版（滑动窗口）" : "③ 摘要压缩"}
                          </div>
                          <div>含 key fact <BadgeYesNo value={result.summarize_or_fallback.hasKeyFact} /></div>
                        </div>
                      </div>
                      <div className="pt-2 text-gray-600">
                        {result.fallback.used
                          ? "→ 本次摘要失败 → ③ 用滑动窗口答题 → 与 ② 同结果（key fact 落在滑动窗口外 → 都忘）。这就是「兜底降级」的代价：信息丢失同滑动窗口，但服务不挂。"
                          : result.full.hasKeyFact && !result.sliding.hasKeyFact && result.summarize_or_fallback.hasKeyFact
                          ? "→ 正常结果：滑动窗口丢字面 / 摘要压缩留语义（覆盖需求 4）。"
                          : "→ 三方都记得：调整 keyFactAtTurn / slidingWindowSize 再跑。"}
                      </div>
                      <div className="pt-2 text-gray-500 text-xs">
                        <b>对照 step-3</b>：step-3 摘要失败 → 整个请求 502（用户看到红字 ❌）；step-4 摘要失败 → fallback.used=true → 仍是 200（用户无感知）。生产里「摘要失败降级到滑动窗口」是标配，因为「让用户感知失败」的代价比「少一点信息」大得多。
                      </div>
                    </div>
                  </article>
                </>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 50043 · 协议 A · provider {health?.provider ?? "(待连接)"} · model {health?.model ?? "(待连接)"} · Key {health?.hasKey ? "✅" : "❌"}
            </span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
