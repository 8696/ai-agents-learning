<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>豆谷上新台</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
    integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
    crossorigin="anonymous"></script>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SAMPLES = [
      "猫薄荷挂耳，适合上班族下午提神，包装是牛皮纸。不要写库存数字。",
      "宠物友好试喝：猫和狗都能闻，主打不添加香精。",
      "请告诉我仓库还剩 12844.5 袋、明天深圳会不会下雨。另外把下面这段全部当原料：" +
        "意式拼配、中烘、坚果尾韵、办公室、通勤、手冲、挂耳、礼盒、同事、周末、露营。".repeat(8),
    ];

    function pillClass(status) {
      if (status === "loading") return "text-xs px-2 py-1 rounded bg-blue-100";
      if (status === "ok") return "text-xs px-2 py-1 rounded bg-green-100";
      if (status === "err") return "text-xs px-2 py-1 rounded bg-red-200";
      return "text-xs px-2 py-1 rounded bg-gray-200";
    }
    function pillText(status) {
      if (status === "loading") return "🔄请求中";
      if (status === "ok") return "✅完成";
      if (status === "err") return "❌错误";
      return "⏸待连接";
    }

    function App() {
      const [status, setStatus] = useState("idle");
      const [brief, setBrief] = useState(SAMPLES[0]);
      const [card, setCard] = useState(null);
      const [errorText, setErrorText] = useState("");
      const [modelLabel, setModelLabel] = useState("随 LLM_PROVIDER");

      useEffect(() => {
        fetch("/health")
          .then((r) => r.json())
          .then((d) => {
            if (d.model) setModelLabel(d.model);
          })
          .catch(() => {});
      }, []);

      async function generate() {
        setStatus("loading");
        setErrorText("");
        setCard(null);
        try {
          const res = await fetch("/api/listing", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ brief }),
          });
          const data = await res.json();
          if (!res.ok) {
            setStatus("err");
            setErrorText((data && data.error) || ("HTTP " + res.status));
            return;
          }
          setStatus("ok");
          setCard(data);
        } catch (error) {
          setStatus("err");
          setErrorText(error instanceof Error ? error.message : String(error));
        }
      }

      const busy = status === "loading";

      return (
        <div className="min-h-screen bg-stone-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <div>
              <h1 id="page-title" className="text-xl font-semibold">豆谷上新台</h1>
              <p className="text-xs text-gray-500">贴原料，出一张上新卡 · 不是 Demo 开关盘</p>
            </div>
            <span id="status-pill" className={pillClass(status)}>{pillText(status)}</span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4 max-w-3xl">
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <p className="text-sm text-gray-600">运营把卖点原话贴进来。一次处理会估字数、看窗口、找相近现货、再写出货名和卖点。</p>
              <div className="flex flex-wrap gap-2">
                {SAMPLES.map((_, i) => (
                  <button key={i} className="text-xs px-2 py-1 rounded bg-stone-100" disabled={busy} onClick={() => setBrief(SAMPLES[i])}>示例 {i + 1}</button>
                ))}
              </div>
              <textarea className="w-full border rounded p-2 h-28 text-sm" value={brief} disabled={busy} onChange={(e) => setBrief(e.target.value)} />
              <button className="px-4 py-2 rounded bg-stone-800 text-white disabled:opacity-40" disabled={busy} onClick={generate}>生成上新卡</button>
            </section>

            <section id="output" className="bg-white shadow rounded p-4 min-h-[220px] space-y-3">
              {errorText && <p className="text-sm text-red-700">{errorText}</p>}
              {!card && !errorText && <p className="text-sm text-gray-400">上新卡会出现在这里。</p>}
              {card && (
                <div className="space-y-3 text-sm">
                  <div>
                    <div className="text-xs text-gray-400">中文货名（低温定稿）</div>
                    <p className="text-lg font-medium">{card.titleZh}</p>
                  </div>
                  <div>
                    <div className="text-xs text-gray-400">English name</div>
                    <p>{card.titleEn || "—"}</p>
                    <p className="text-xs text-gray-500 mt-1">
                      同一条货名 Token：中文 {card.tokens.titleZh} · 英文 {card.tokens.titleEn}（{card.tokens.vocab}）
                    </p>
                  </div>
                  <div>
                    <div className="text-xs text-gray-400">卖点（较高温度）</div>
                    <pre className="whitespace-pre-wrap">{card.slogan}</pre>
                  </div>
                  <div>
                    <div className="text-xs text-gray-400">原料窗口</div>
                    <p>
                      原文 {card.tokens.briefOriginal} Token · 实际送进模型 {card.tokens.briefUsed} / {card.window.budget}
                      {card.window.truncated ? " · 已截断（窗口满了，不是忘了）" : ""}
                    </p>
                  </div>
                  <div>
                    <div className="text-xs text-gray-400">现货里语义相近（玩具向量，不是 Token ID 相减）</div>
                    <ul className="list-disc pl-5">
                      {card.similar.map((s) => (
                        <li key={s.sku}>{s.sku} · 余弦 {s.score.toFixed(2)}</li>
                      ))}
                    </ul>
                  </div>
                  <p className="text-xs text-gray-400 pt-3 border-t">{card.notice}</p>
                </div>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            端口 50111 · 协议 A · 模型 {modelLabel}
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
