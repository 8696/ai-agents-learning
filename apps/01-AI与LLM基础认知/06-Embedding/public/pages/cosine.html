<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>余弦正例 · Embedding</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/api-client.js"></script>
  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/vec-cards.js"></script>

  <script type="text/babel">
    /**
     * 本页教学点：方向接近 = 语义接近。零向量没有方向，除下去是 NaN，所以 400。
     */
    const { useState } = React;

    const INTRO_STEPS = [
      "点「按余弦排序」→ POST /api/rank { query }，默认查询「宠物」",
      "服务端算夹角，绿卡从高到低：猫 / 狗 应高于 石头",
      "「撞零向量」发 vsZero:true，期望 HTTP 400",
      "未知词同样 400，和零向量是两类失败",
    ];

    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo", "RankResult", "ErrorBanner"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo, RankResult, ErrorBanner } = window.DemoUI;
        const { callEndpoint, describeFailure, triggerNetworkError } = window.DemoUtils;

        function App() {
          const { env, envError } = useEnvInfo();
          const [status, setStatus] = useState("idle");
          const [busy, setBusy] = useState(false);
          const [query, setQuery] = useState("宠物");
          const [data, setData] = useState(null);
          const [error, setError] = useState(null);

          React.useEffect(function () {
            if (env.queryDefault) setQuery(env.queryDefault);
          }, [env.queryDefault]);

          async function run(body) {
            setBusy(true);
            setStatus("loading");
            setError(null);
            try {
              const r = await callEndpoint("/api/rank", body);
              if (r.status >= 400) {
                setError({ title: "请求失败", detail: describeFailure(r.status, r.data), httpStatus: r.status });
                setStatus("error");
                setData(null);
                return;
              }
              setData(r.data);
              setStatus("ok");
            } catch (e) {
              setError({ title: "网络错误（fetch 没发出去）", detail: e.message, httpStatus: null });
              setStatus("error");
              setData(null);
            } finally {
              setBusy(false);
            }
          }

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">余弦正例</h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                <PageIntro
                  summary="2 维玩具向量按夹角排序。分数越接近 1 越同向（语义近）。"
                  steps={INTRO_STEPS}
                />

                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  <label className="block text-sm">
                    query
                    <span className="block text-xs text-gray-500">点了会跟猫 / 狗 / 石头比方向。坐标是编的。</span>
                    <select
                      className="mt-1 border rounded p-2 text-sm"
                      value={query}
                      disabled={busy}
                      onChange={function (e) { setQuery(e.target.value); }}
                    >
                      {(env.words.length ? env.words : ["宠物", "猫", "狗", "石头"]).map(function (w) {
                        return <option key={w} value={w}>{w}</option>;
                      })}
                    </select>
                  </label>
                  <div className="flex flex-wrap gap-2">
                    <button
                      className="bg-blue-600 text-white px-3 py-1.5 rounded text-sm disabled:opacity-50"
                      disabled={busy}
                      onClick={function () { run({ query: query }); }}
                    >
                      按余弦排序
                    </button>
                    <button
                      className="border border-gray-300 px-3 py-1.5 rounded text-sm disabled:opacity-50"
                      disabled={busy}
                      onClick={function () { run({ query: query, vsZero: true }); }}
                    >
                      撞零向量（期望 HTTP 400）
                    </button>
                    <button
                      className="border border-gray-300 px-3 py-1.5 rounded text-sm disabled:opacity-50"
                      disabled={busy}
                      onClick={function () { run({ query: "香蕉" }); }}
                    >
                      故意发未知词（期望 HTTP 400）
                    </button>
                    <button
                      className="border border-gray-300 px-3 py-1.5 rounded text-sm disabled:opacity-50"
                      disabled={busy}
                      onClick={async function () {
                        setBusy(true);
                        setStatus("loading");
                        setError(null);
                        try {
                          await triggerNetworkError();
                        } catch (e) {
                          setError({ title: "网络错误（fetch 没发出去）", detail: e.message, httpStatus: null });
                          setStatus("error");
                          setData(null);
                        } finally {
                          setBusy(false);
                        }
                      }}
                    >
                      故意断网（期望 fetch reject）
                    </button>
                  </div>
                  {envError && <p className="text-sm text-red-700">{envError}</p>}
                </section>

                <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
                  {!data && !error && (
                    <p className="text-sm text-gray-500">还没跑过。点「按余弦排序」后会出现三张绿卡。</p>
                  )}
                  {error && <ErrorBanner title={error.title} detail={error.detail} httpStatus={error.httpStatus} />}
                  {data && data.ranked && <RankResult data={data} />}
                </section>
              </main>

              <EnvFooter env={env} />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
