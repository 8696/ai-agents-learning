<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temperature / Top-P · Demo</title>
  <!-- §5.0 / §5.3.4 强制：原样引入，禁止换 CDN / 版本 / integrity -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <!-- §5.3.4 强制：React 18.3.1 UMD CDN（普通 script，不用 module 也不用 importmap） -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone：在浏览器运行时转译 JSX（§5.3.4 强制）。
     注：必须锁定 7.x；8.x 默认 preset-react 是 automatic runtime（输出 import { jsx } from "react/jsx-runtime"），
     与本规则"完全 ESM 禁用"冲突。7.x 默认是 classic runtime（输出 React.createElement）。 -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <style>
    /* 自定义：跑完的卡片配色提示 */
    pre { white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.6; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .card-stable  { border-color: #16a34a; background: #f0fdf4; }   /* 绿：相同 */
    .card-diverge { border-color: #ca8a04; background: #fefce8; }   /* 黄：分叉 */
    .card-partial { border-color: #ea580c; background: #fff7ed; }   /* 橙：部分失败 */
    .card-failed  { border-color: #dc2626; background: #fef2f2; }   /* 红：全失败 */
    .verdict-pill { font-size: 11px; padding: 2px 8px; border-radius: 9999px; display: inline-block; font-weight: 600; }
    .pill-stable  { background: #dcfce7; color: #166534; }
    .pill-diverge { background: #fef3c7; color: #854d0e; }
    .pill-partial { background: #ffedd5; color: #9a3412; }
    .pill-failed  { background: #fee2e2; color: #991b1b; }
    .temp-low    { color: #166534; }
    .temp-mid    { color: #92400e; }
    .temp-high   { color: #991b1b; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    // ── 解构 React 全局变量（UMD CDN 加载后 window.React / window.ReactDOM 存在） ──
    const { useState, useEffect } = React;

    // ── StatusPill：渲染顶部状态徽章（四态） ──
    function StatusPill({ status, model }) {
      const map = {
        idle:    { emoji: "⏸", text: "待连接",       cls: "bg-gray-200" },
        loading: { emoji: "🔄", text: "请求中…",      cls: "bg-blue-100" },
        ok:      { emoji: "✅", text: "完成",          cls: "bg-green-100" },
        error:   { emoji: "❌", text: "错误",          cls: "bg-red-100" },
      };
      const s = map[status];
      const label = status === "idle" && model ? `待连接 · ${model}` : s.text;
      return (
        <span id="status-pill" className={`text-xs px-2 py-1 rounded ${s.cls}`}>
          {s.emoji} {label}
        </span>
      );
    }

    // ── 工具：温度 / 判定配色 ──
    function tempClass(t) {
      if (t === 0) return "temp-low";
      if (t <= 0.7) return "temp-mid";
      return "temp-high";
    }
    function pillClass(verdict) {
      if (verdict === "STABLE") return "pill-stable";
      if (verdict === "DIVERGED") return "pill-diverge";
      if (verdict === "PARTIAL") return "pill-partial";
      return "pill-failed";
    }
    function cardClass(verdict) {
      if (verdict === "STABLE") return "card-stable";
      if (verdict === "DIVERGED") return "card-diverge";
      if (verdict === "PARTIAL") return "card-partial";
      return "card-failed";
    }

    // ── 单次回复块 ──
    function RunBlock({ run, idx }) {
      if (run.error) {
        return (
          <div>
            <div className="text-xs text-red-700 mb-1">第 {idx + 1} 次失败</div>
            <pre className="bg-red-50 border border-red-200 p-2 rounded text-red-700">{run.error}</pre>
            <div className="text-[11px] text-gray-500 mt-1">耗时 {run.durationMs} ms</div>
          </div>
        );
      }
      return (
        <div>
          <div className="text-xs text-gray-500 mb-1">第 {idx + 1} 次 · {run.durationMs} ms</div>
          <pre className="bg-white border p-2 rounded">{run.text}</pre>
        </div>
      );
    }

    // ── 一张温度档卡片 ──
    function GroupCard({ group, topP }) {
      const tempColor = tempClass(group.temperature);
      const pill = pillClass(group.verdict);
      const card = cardClass(group.verdict);
      return (
        <div className={`border-2 rounded p-3 space-y-2 ${card}`}>
          <div className="flex items-center justify-between">
            <div className="text-sm font-semibold">
              <span className={tempColor}>T = {group.temperature}</span>
              <span className="text-xs text-gray-500 ml-1">top_p = {topP}</span>
            </div>
            <span className={`verdict-pill ${pill}`}>{group.verdictLabel}</span>
          </div>
          <div className="space-y-2">
            {group.runs.map((r, i) => <RunBlock key={i} run={r} idx={i} />)}
          </div>
        </div>
      );
    }

    // ── 结果汇总 ──
    function Result({ data }) {
      return (
        <div className="space-y-3">
          <div className="text-xs text-gray-500">
            {data.model} · {data.temperatures.length} 组 × {data.runsPerGroup} 次 = 共 {data.temperatures.length * data.runsPerGroup} 次调用 · 耗时 {data.durationMs} ms
          </div>
          <div className="text-xs text-gray-500">
            <b>prompt</b>：<code className="bg-gray-100 px-1 rounded">{data.prompt}</code>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
            {data.groups.map((g, i) => (
              <GroupCard key={i} group={g} topP={data.topP} />
            ))}
          </div>
        </div>
      );
    }

    // ── 主组件 App ──
    function App() {
      const [status, setStatus] = useState("idle");
      const [model, setModel] = useState("");
      const [prompt, setPrompt] = useState(
        "给一间开在海边的咖啡店起一个店名。只回店名四个字以内，不要解释。",
      );
      const [result, setResult] = useState(null);
      const [errorMsg, setErrorMsg] = useState("");

      // 启动时 ping /health
      useEffect(() => {
        fetch("/health")
          .then((r) => r.json())
          .then((d) => {
            setModel(d.model);
            setStatus("idle");
          })
          .catch(() => {
            setStatus("error");
            setErrorMsg("连不上后端 /health");
          });
      }, []);

      const send = async () => {
        const p = prompt.trim();
        if (!p) {
          setStatus("error");
          setErrorMsg("请输入 prompt");
          return;
        }
        setStatus("loading");
        setErrorMsg("");
        setResult(null);
        try {
          const r = await fetch("/api/compare", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: p }),
          });
          const data = await r.json();
          if (!r.ok) {
            setStatus("error");
            setErrorMsg(data.error || `HTTP ${r.status}`);
            return;
          }
          setResult(data);
          setStatus("ok");
        } catch (e) {
          setStatus("error");
          setErrorMsg(String(e));
        }
      };

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header
            id="page-header"
            className="border-b p-4 flex items-center justify-between bg-white"
          >
            <h1 id="page-title" className="text-xl font-semibold">
              Temperature / Top-P · Demo
            </h1>
            <StatusPill status={status} model={model} />
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section
              id="controls"
              className="bg-white shadow rounded p-4 space-y-2"
            >
              <label htmlFor="prompt-input" className="block text-sm font-medium">
                Prompt（默认"海边咖啡店起名"；可改成自己的 prompt）
              </label>
              <textarea
                id="prompt-input"
                rows={2}
                value={prompt}
                onChange={(e) => setPrompt(e.target.value)}
                className="w-full border rounded p-2 text-sm font-mono"
                placeholder="输入要发给 LLM 的 prompt…"
              />
              <div className="flex items-center gap-3">
                <button
                  id="send-btn"
                  onClick={send}
                  disabled={status === "loading"}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  {status === "loading" ? "跑 6 次中…" : "跑 6 次并对照"}
                </button>
                <span className="text-xs text-gray-500">
                  会真调 3 组 × 2 次 = 6 次当前配置的模型，Top-P 固定 1，只动温度
                </span>
              </div>
            </section>

            <section
              id="output"
              className="bg-white shadow rounded p-4 min-h-[200px]"
            >
              {errorMsg ? (
                <div className="text-red-600 text-sm">⚠️ {errorMsg}</div>
              ) : result ? (
                <Result data={result} />
              ) : (
                <div className="text-sm text-gray-500">
                  点「跑 6 次并对照」后，这里会显示 T=0 / T=0.7 / T=1.2 三组并排卡片，绿=相同 / 黄=分叉 / 红=异常。
                </div>
              )}
            </section>

            <section className="text-xs text-gray-500 space-y-1">
              <p><b>对照要点</b>：</p>
              <ul className="list-disc pl-5 space-y-1">
                <li><b>T=0</b>：几乎总是相同 → 抽取任务 / 稳定复现用</li>
                <li><b>T=0.7</b>：偶尔分叉 → 多数通用场景的折中</li>
                <li><b>T=1.2</b>：更易分叉 → 创意 / 头脑风暴才加</li>
                <li>本 Demo 固定 <code>top_p=1</code>：多数文档建议"先只调一个"</li>
              </ul>
            </section>
          </main>

          <footer
            id="page-footer"
            className="border-t p-2 text-xs text-gray-500 text-center"
          >
            端口 50107 · 协议 A · 模型随 LLM_PROVIDER
          </footer>
        </div>
      );
    }

    // ── 入口：UMD 全局 ReactDOM ──
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
