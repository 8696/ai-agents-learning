<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>切块（Chunking） · 第三步 · 怎么判断 + 文档类型选策略</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="/utils/api.js"></script>
  <script src="/utils/doc-types.js"></script>
  <script src="/utils/chunking-api.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/chunk-panels.js"></script>
  <script type="text/babel" src="/components/budget-bar.js"></script>
  <script type="text/babel" src="/components/right-panel.js"></script>
  <script type="text/babel" src="/components/quality-card.js"></script>
  <script type="text/babel" src="/components/doc-type-selector.js"></script>
  <script type="text/babel" src="/components/compare-params-panel.js"></script>
  <script type="text/babel" src="/components/control-panels.js"></script>
  <script type="text/babel" src="/components/judge-panel.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, PageIntro, EnvFooter, Panel, LeftPanel, RightPanel, BudgetBar, QualityCard, DocTypeSelector, CompareParamsPanel, ChunkingControlPanel, JudgePanel } = window.DemoUI;
    const { DOC_TYPES, ChunkingAPI } = window.DemoUtils;

    // 默认售后 Markdown（同 step-2）
    const DEFAULT_DOC = [
      "## 破损处理",
      "运输过程中造成的破损，可在签收后 48 小时内申请补发或退货。",
      "请保留完整包装与商品外观照片，作为售后凭证。",
      "客户回寄运费由我方承担。",
      "",
      "## 保修政策",
      "本公司所有电器类商品保修期为两年。",
      "该期限自签收之日起算，不含运输时间。",
      "易耗品（如灯泡、滤芯）不在保修范围内。",
      "",
      "## 偏远地区运费",
      "新疆、西藏、内蒙古偏远地区需另付运费 20 元。",
      "其余地区满 99 元包邮。",
      "港澳台暂不直邮。",
    ].join("\n");

    // 超长一节文档（演示按字数切兜底）
    const LONG_DOC = (function () {
      const title = "## 保修政策（含完整细则）";
      const sentence =
        "本节说明保修细则，包括退换货流程、保修期计算、易耗品范围、损坏责任划分、运输破损赔付标准、发票补开规则、跨平台账号绑定、地区差异说明、海外邮寄限制、节假日延期处理、客户投诉处理时效、客服响应时效、配件单独购买渠道、整机与配件保修区分、保修期内维修费用承担、保修期外维修费用标准、二次维修条件、跨年度保修期延续、保修起算时间判定、签收时间判定方式、发票补开时效要求、发票类型说明、电子发票与纸质发票区分、发票抬头变更流程、保修延保服务说明、增值服务购买方式、礼品订单保修规则、跨境订单保修说明、团购订单保修说明、批量定制订单保修说明、企业客户保修规则，便于演示按结构切时一节超长触发按字数切兜底。";
      const longSentence = sentence.slice(0, -1).repeat(8) + "；";
      return [title, longSentence, longSentence, longSentence].join("\n");
    })();

    // 默认 FAQ 文档
    const DEFAULT_FAQ = [
      "## 如何退货？",
      "在签收后 7 天内联系客服，提供订单号即可办理退货。",
      "",
      "## 如何换货？",
      "商品出现质量问题时，可在 15 天内申请换货，寄回运费由我方承担。",
      "",
      "## 发票如何补开？",
      "订单完成后 90 天内可申请补开发票，需提供订单号与抬头信息。",
    ].join("\n");

    // step-3 · B 件：DOC_TYPES 在 public/utils/doc-types.js（拆出避免 index.html 超 400 行）。

    function App() {
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");
      const [busy, setBusy] = useState(false);

      const [text, setText] = useState(DEFAULT_DOC);
      // 参数 A = 左栏滑块的 size / overlap（同名复用）
      const [sizeA, setSizeA] = useState(300);
      const [overlapA, setOverlapA] = useState(30);
      const [estimateMode, setEstimateMode] = useState("mixed");
      const [topK, setTopK] = useState(5);
      const [budget, setBudget] = useState(2000);

      const [docType, setDocType] = useState("handbook");

      // 参数 B = 第 2 段右侧输入框（默认 size=100 与 sizeA=300 形成「粗 vs 细」对照，更易看出差异）
      const [sizeB, setSizeB] = useState(100);
      const [overlapB, setOverlapB] = useState(10);
      const [compareResult, setCompareResult] = useState(null);
      const [compareErr, setCompareErr] = useState(null);

      const [fixed, setFixed] = useState(null);
      const [structure, setStructure] = useState(null);
      const [faq, setFaq] = useState(null);

      const [fixedErr, setFixedErr] = useState(null);
      const [structureErr, setStructureErr] = useState(null);
      const [faqErr, setFaqErr] = useState(null);

      const [err, setErr] = useState(null);

      useEffect(function () {
        window.DemoUtils.getJson("/health").then(setEnv).catch(function () {
          setEnv(null);
        });
      }, []);

      async function callApi(url, body) {
        const data = await window.DemoUtils.postJson(url, body);
        return data;
      }

      function applyDocType(key) {
        const t = DOC_TYPES[key];
        if (!t) return;
        setText(t.text);
        setSizeA(t.size);
        setOverlapA(t.overlap);
        setDocType(key);
      }

      async function runFixed() {
        setBusy(true);
        setStatus("loading");
        setFixedErr(null);
        try {
          const data = await ChunkingAPI.runFixed({ text: text, size: sizeA, overlap: overlapA });
          setFixed(data.result);
          setStatus("ok");
        } catch (error) {
          setStatus("err");
          setFixedErr({ error: error.message || "失败", hint: error.hint || "", status: error.status });
        } finally {
          setBusy(false);
        }
      }

      async function runStructure() {
        setBusy(true);
        setStatus("loading");
        setStructureErr(null);
        try {
          const data = await ChunkingAPI.runStructure({ text: text });
          setStructure(data.result);
          setStatus("ok");
        } catch (error) {
          setStatus("err");
          setStructureErr({ error: error.message || "失败", hint: error.hint || "", status: error.status });
        } finally {
          setBusy(false);
        }
      }

      async function runFaq() {
        setBusy(true);
        setStatus("loading");
        setFaqErr(null);
        try {
          const data = await ChunkingAPI.runFaq({ text: DEFAULT_FAQ });
          setFaq(data.result);
          setStatus("ok");
        } catch (error) {
          setStatus("err");
          setFaqErr({ error: error.message || "失败", hint: error.hint || "", status: error.status });
        } finally {
          setBusy(false);
        }
      }

      async function runCompareQuality() {
        setBusy(true);
        setStatus("loading");
        setCompareErr(null);
        try {
          const data = await ChunkingAPI.runCompareQuality({
            text: text, sizeA: sizeA, overlapA: overlapA, sizeB: sizeB, overlapB: overlapB, topK: topK,
          });
          setCompareResult(data.result);
          setStatus("ok");
        } catch (error) {
          setStatus("err");
          setCompareErr({ error: error.message || "失败", hint: error.hint || "", status: error.status });
        } finally {
          setBusy(false);
        }
      }

      async function runError() {
        setBusy(true);
        setStatus("loading");
        setErr(null);
        try {
          await ChunkingAPI.runDemoError();
        } catch (error) {
          setStatus("err");
          setErr({ error: error.message || "失败", hint: error.hint || "", status: error.status });
        } finally {
          setBusy(false);
        }
      }

      async function runEmpty() {
        setBusy(true);
        setStatus("loading");
        setErr(null);
        try {
          await ChunkingAPI.runFixed({ text: "", size: sizeA, overlap: overlapA });
          setStatus("ok");
        } catch (error) {
          setStatus("err");
          setErr({ error: error.message || "失败", hint: error.hint || "", status: error.status });
        } finally {
          setBusy(false);
        }
      }

      function loadLongDoc() {
        setText(LONG_DOC);
        setDocType("handbook");
      }

      function loadDefaultDoc() {
        setText(DEFAULT_DOC);
        setDocType("handbook");
      }

      const currentDocType = DOC_TYPES[docType];

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              切块（Chunking） · 第三步（step-3） · 怎么判断 + 文档类型选策略
            </h1>
            <StatusPill status={status} />
          </header>
          <main id="page-main" className="max-w-[1600px] mx-auto p-4 space-y-4">
            <PageIntro />

            <section id="controls" className="bg-white shadow rounded p-4 space-y-4">

              <ChunkingControlPanel
                docType={docType}
                applyDocType={applyDocType}
                currentLabel={currentDocType ? currentDocType.label : ""}
                text={text}
                setText={setText}
                busy={busy}
                loadLongDoc={loadLongDoc}
                loadDefaultDoc={loadDefaultDoc}
              />

              <JudgePanel
                running={busy}
                error={compareErr}
                onRun={runCompareQuality}
                sizeA={sizeA}
                setSizeA={setSizeA}
                overlapA={overlapA}
                setOverlapA={setOverlapA}
                sizeB={sizeB}
                setSizeB={setSizeB}
                overlapB={overlapB}
                setOverlapB={setOverlapB}
              />

              <div className="border-l-4 border-green-400 bg-green-50 px-3 py-2 space-y-3 rounded">
                <div className="text-sm font-semibold text-gray-900">第 3 段 · 撞预算（看 size × Top-K 占预算的 %）</div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <label className="text-xs text-gray-700 space-y-1 block">
                    <span>材料词元预算（Token Budget）</span>
                    <input
                      type="number"
                      min="100"
                      max="20000"
                      step="100"
                      value={budget}
                      onChange={function (e) { setBudget(Number(e.target.value) || 2000); }}
                      className="w-full border border-gray-300 rounded p-1"
                    />
                  </label>
                  <label className="text-xs text-gray-700 space-y-1 block">
                    <span>Top-K（一次喂模型几条材料）</span>
                    <input
                      type="number"
                      min="1"
                      max="50"
                      step="1"
                      value={topK}
                      onChange={function (e) { setTopK(Number(e.target.value) || 5); }}
                      className="w-full border border-gray-300 rounded p-1"
                    />
                  </label>
                </div>
                <BudgetBar
                  size={sizeA}
                  topK={topK}
                  budget={budget}
                  avgTokensPerChunk={fixed && fixed.stats && fixed.stats.total > 0 ? fixed.stats.avgTokensPerChunk || 0 : 0}
                />
              </div>

              <div className="border border-gray-200 rounded p-2 bg-gray-50 space-y-2">
                <div className="text-xs font-semibold text-gray-600">错误演示（两类）</div>
                <div className="flex flex-wrap gap-2 items-center">
                  <button
                    type="button"
                    disabled={busy}
                    onClick={runEmpty}
                    className="border border-gray-300 px-3 py-1.5 rounded text-xs disabled:opacity-50"
                  >
                    演示空输入（4xx · 第一类错误）
                  </button>
                  <button
                    type="button"
                    disabled={busy}
                    onClick={runError}
                    className="border border-gray-300 px-3 py-1.5 rounded text-xs disabled:opacity-50"
                  >
                    演示后端 5xx（第二类错误 · /api/demo-error）
                  </button>
                </div>
                {err ? (
                  <div className="border border-red-300 bg-red-50 text-red-700 text-xs rounded p-2 space-y-1">
                    <div>错误：{err.error}</div>
                    {err.hint ? <div>提示：{err.hint}</div> : null}
                    {err.status ? <div>状态：HTTP {err.status}</div> : null}
                  </div>
                ) : null}
              </div>
            </section>

            <section id="output" className="space-y-4">
              {compareResult ? (
                <QualityCard
                  reportA={compareResult.reportA}
                  reportB={compareResult.reportB}
                  topK={topK}
                />
              ) : null}

              <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 items-start">
                <LeftPanel
                  running={busy}
                  result={fixed}
                  error={fixedErr}
                  onRun={runFixed}
                  sizeVal={sizeA}
                  setSizeVal={setSizeA}
                  overlap={overlapA}
                  setOverlap={setOverlapA}
                  estimateMode={estimateMode}
                  setEstimateMode={setEstimateMode}
                />
                <Panel
                  title="中：按结构切（structure）"
                  hint={"按 Markdown ## / 段落 / 句号递归切；当前文档：" + currentDocType.algorithm}
                  buttonText="跑按结构切"
                  buttonHint="点这一栏的按钮会调 POST /api/chunk/structure；与 size / overlap 滑块无关"
                  running={busy}
                  result={structure}
                  error={structureErr}
                  onRun={runStructure}
                  estimateMode={estimateMode}
                />
                <RightPanel
                  running={busy}
                  result={faq}
                  error={faqErr}
                  onRun={runFaq}
                />
              </div>
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
