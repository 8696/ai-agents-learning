<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG vs Fine-tuning · 幻觉 / 库里没有则弃权 · 第三步</title>

  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入（禁止换 CDN / 版本 / integrity） -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <!-- §5.3.4 强制：React 18.3.1 UMD CDN（普通 script，不用 module 也不用 importmap） -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- §5.3.4 强制：Babel Standalone 锁定 7.26.4 -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <!-- 共享 JSX 组件（挂 window.DemoUI） -->
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/no-rag-card.js"></script>
  <script type="text/babel" src="/components/rag-card.js"></script>
  <script type="text/babel" src="/components/compare-summary.js"></script>

  <!-- 本页内联 JSX 块（最后） -->
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { EnvFooter, NoRagCard, RagCard, CompareSummary } = window.DemoUI;

    function App() {
      // ── 输入与左/右栏状态 ──
      const [question, setQuestion] = useState("我们公司有没有内部折扣码？");
      const [leftData, setLeftData] = useState(null);
      const [rightData, setRightData] = useState(null);

      // ── 各按钮的 loading / error ──
      const [leftLoading, setLeftLoading] = useState(false);
      const [rightLoading, setRightLoading] = useState(false);
      const [bothLoading, setBothLoading] = useState(false);
      const [forceErrorLoading, setForceErrorLoading] = useState(false);
      const [leftError, setLeftError] = useState(null);
      const [rightError, setRightError] = useState(null);
      const [bothError, setBothError] = useState(null);

      // §5.3.4 强制 id 命名约定：page-header / page-title / status-pill
      const [statusPill, setStatusPill] = useState("⏸ 待连接");

      async function runNoRag(forceError) {
        setLeftLoading(true); setLeftError(null);
        try {
          const res = await fetch("/api/no-rag", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, forceError: !!forceError }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(`HTTP ${res.status}${body.error ? " · " + body.error : ""}`);
          }
          setLeftData(await res.json());
        } catch (err) {
          setLeftError(err.message);
        } finally {
          setLeftLoading(false);
        }
      }

      async function runForceError() {
        setForceErrorLoading(true); setLeftError(null);
        try {
          const res = await fetch("/api/no-rag", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, forceError: true }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(`HTTP ${res.status}${body.error ? " · " + body.error : ""}`);
          }
        } catch (err) {
          setLeftError(err.message);
        } finally {
          setForceErrorLoading(false);
        }
      }

      async function runRag() {
        setRightLoading(true); setRightError(null);
        try {
          const res = await fetch("/api/rag", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, topK: 3 }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(`HTTP ${res.status}${body.error ? " · " + body.error : ""}`);
          }
          setRightData(await res.json());
        } catch (err) {
          setRightError(err.message);
        } finally {
          setRightLoading(false);
        }
      }

      async function runBoth() {
        setBothLoading(true); setBothError(null);
        try {
          const [resL, resR] = await Promise.all([
            fetch("/api/no-rag", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ question }),
            }),
            fetch("/api/rag", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ question, topK: 3 }),
            }),
          ]);
          if (!resL.ok) throw new Error(`左栏 HTTP ${resL.status}`);
          if (!resR.ok) throw new Error(`右栏 HTTP ${resR.status}`);
          setLeftData(await resL.json());
          setRightData(await resR.json());
        } catch (err) {
          setBothError(err.message);
        } finally {
          setBothLoading(false);
        }
      }

      // §5.3.4 #status-pill 四态：⏸待连接 / 🔄请求中 / ✅完成 / ❌错误
      useEffect(() => {
        const anyLoading = leftLoading || rightLoading || bothLoading || forceErrorLoading;
        if (anyLoading) setStatusPill("🔄请求中");
        else if (leftError || rightError || bothError) setStatusPill("❌错误");
        else if (leftData || rightData) setStatusPill("✅完成");
        else setStatusPill("⏸待连接");
      }, [leftLoading, rightLoading, bothLoading, forceErrorLoading, leftError, rightError, bothError, leftData, rightData]);

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header
            id="page-header"
            className="border-b p-4 flex items-center justify-between bg-white"
          >
            <h1 id="page-title" className="text-xl font-semibold">
              RAG vs 微调 · 幻觉 / 库里没有则弃权 · 第三步（step-3） · 检索能弃权 · 不检索仍可能编
            </h1>
            <span
              id="status-pill"
              className="text-xs px-2 py-1 rounded bg-gray-200"
            >
              {statusPill}
            </span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section
              id="page-intro"
              className="bg-white shadow rounded p-4 space-y-2"
            >
              <p className="text-sm text-gray-700">
                <b>本页只演示：</b>同一道库里<span className="text-red-700 font-semibold">没有</span>的题、两条独立请求对照 —— 左栏「不接 RAG（model only · 无材料 · 无出处）」vs 右栏「检索增强生成」。
                <br />
                默认问题「我们公司有没有内部折扣码？」库里（refund-v2-001~004）只讲退货 / 运费 / 退款 / 客服腔 —— 折扣码 = 库里没有。看两侧怎么反应。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>输入框里改一道「库里没有」的题，或用默认「我们公司有没有内部折扣码？」</li>
                <li>点「跑『不接 RAG』」→ POST /api/no-rag → 模型用训练时的常识 / 印象 → 可能答「VIP8 折」这种编出来的折扣码</li>
                <li>点「跑『检索增强生成』」→ POST /api/rag → 检索 0 条相关切块 + system 指令「找不到就说『库里没有』」 → 答「库里没有这条信息，我不能编」</li>
                <li>点「同时跑两栏」→ 浏览器并发 Promise.all（不是 /api/compare 打包）</li>
                <li>对照两栏 —— 这是「幻觉 vs 弃权」的本体：左栏编一个，右栏按指令不答</li>
              </ol>

              <div
                id="core-takeaway"
                className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2"
              >
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  <b>幻觉（Hallucination）= 模型自己编一个听起来很官方的答案。</b>
                  「训练截止后的旧事实」是模型不知道新事；「幻觉」是本来就没有，模型凭空说出来。step-1 那道「七天改三天」属于前者（说过期的）；本页这道「内部折扣码」属于后者（凭空编的）。
                </div>
                <div className="text-xs text-gray-800">
                  <b>检索增强生成的真正兜底：找不到时按指令弃权。</b>
                  右栏 system 写了「找不到就说『库里没有这条信息，我不能编』」 —— 模型照办；左栏没这条指令 → 模型按「我是客服」的角色硬编一个。这就是「检索能弃权，不检索仍可能编」的本体。
                </div>
                <div className="text-xs text-gray-600">
                  怎么观察：左栏编一个具体的折扣 / 数字 / 政策；右栏直接说「库里没有」。
                </div>
                <div className="text-xs text-red-700 mt-2">
                  本页没有训练任务 —— 微调（Fine-tuning）本步不真训。本步演示的是「找不到怎么说」的能力边界，不是「库里有的话怎么说」（那是 step-1）。
                </div>
              </div>
            </section>

            <section
              id="controls"
              className="bg-white shadow rounded p-4 space-y-3"
            >
              <div>
                <label className="text-xs text-gray-600" htmlFor="question-input">
                  问题（question · 默认「我们公司有没有内部折扣码？」—— 库里没有这道题）
                </label>
                <input
                  id="question-input"
                  type="text"
                  value={question}
                  onChange={(e) => setQuestion(e.target.value)}
                  className="w-full border border-gray-300 rounded px-2 py-1 mt-1 text-sm"
                  placeholder="改一道「库里没有」的题，或用默认"
                />
              </div>
              <CompareSummary
                question={question}
                bothLoading={bothLoading}
                bothError={bothError}
                onRunBoth={runBoth}
              />
            </section>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <NoRagCard
                question={question}
                data={leftData}
                loading={leftLoading}
                error={leftError}
                forceErrorLoading={forceErrorLoading}
                onRunNoRag={runNoRag}
                onRunForceError={runForceError}
              />
              <RagCard
                question={question}
                data={rightData}
                loading={rightLoading}
                error={rightError}
                onRunRag={runRag}
              />
            </div>

            <section
              id="output"
              className="bg-white shadow rounded p-4 min-h-[40px] text-xs text-gray-500"
            >
              {leftData || rightData
                ? "对照看上面两栏：左栏可能编了一个具体折扣 / 数字；右栏按指令说「库里没有这条信息，我不能编」。"
                : "还没跑过 —— 在上面输入框改一道「库里没有」的题，点「不接 RAG（model only · 无材料 · 无出线）」或「检索增强生成」或「同时跑两栏」。"}
            </section>
          </main>

          <footer
            id="page-footer"
            className="border-t p-2 text-xs text-gray-500 text-center"
          >
            <EnvFooter />
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
