<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>切块（Chunking） · 第四步 · PDF 按页切</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="/utils/api.js"></script>
  <script src="/utils/doc-types.js"></script>
  <script src="/utils/chunking-api.js"></script>
  <script src="/utils/run-actions.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/chunk-panels.js"></script>
  <script type="text/babel" src="/components/budget-bar.js"></script>
  <script type="text/babel" src="/components/right-panel.js"></script>
  <script type="text/babel" src="/components/quality-card.js"></script>
  <script type="text/babel" src="/components/doc-type-selector.js"></script>
  <script type="text/babel" src="/components/compare-params-panel.js"></script>
  <script type="text/babel" src="/components/control-panels.js"></script>
  <script type="text/babel" src="/components/judge-panel.js"></script>
  <script type="text/babel" src="/components/pdf-chunk-panel.js"></script>
  <script type="text/babel" src="/components/pdf-control-panel.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, PageIntro, EnvFooter, Panel, LeftPanel, RightPanel, BudgetBar, QualityCard, DocTypeSelector, CompareParamsPanel, ChunkingControlPanel, JudgePanel, PdfChunkPanel, PdfControlPanel } = window.DemoUI;
    const { DOC_TYPES, ChunkingAPI, readFileAsBase64, RunActions } = window.DemoUtils;

    // 默认售后 Markdown（同 step-2）
    const DEFAULT_DOC = [
      "## 破损处理",
      "运输过程中造成的破损，可在签收后 48 小时内申请补发或退货。",
      "请保留完整包装与商品外观照片，作为售后凭证。",
      "客户回寄运费由我方承担。",
      "",
      "## 保修政策",
      "本公司所有电器类商品保修期为两年。",
      "该期限自签收之日起算，不含运输时间。",
      "易耗品（如灯泡、滤芯）不在保修范围内。",
      "",
      "## 偏远地区运费",
      "新疆、西藏、内蒙古偏远地区需另付运费 20 元。",
      "其余地区满 99 元包邮。",
      "港澳台暂不直邮。",
    ].join("\n");

    // 超长一节文档（演示兜底再切）
    const LONG_DOC = (function () {
      const title = "## 保修政策（含完整细则）";
      const sentence =
        "本节说明保修细则，包括退换货流程、保修期计算、易耗品范围、损坏责任划分、运输破损赔付标准、发票补开规则、跨平台账号绑定、地区差异说明、海外邮寄限制、节假日延期处理、客户投诉处理时效、客服响应时效、配件单独购买渠道、整机与配件保修区分、保修期内维修费用承担、保修期外维修费用标准、二次维修条件、跨年度保修期延续、保修起算时间判定、签收时间判定方式、发票补开时效要求、发票类型说明、电子发票与纸质发票区分、发票抬头变更流程、保修延保服务说明、增值服务购买方式、礼品订单保修规则、跨境订单保修说明、团购订单保修说明、批量定制订单保修说明、企业客户保修规则，便于演示按结构切时一节超长触发兜底再切。";
      const longSentence = sentence.slice(0, -1).repeat(8) + "；";
      return [title, longSentence, longSentence, longSentence].join("\n");
    })();

    // 默认 FAQ 文档
    const DEFAULT_FAQ = [
      "## 如何退货？",
      "在签收后 7 天内联系客服，提供订单号即可办理退货。",
      "",
      "## 如何换货？",
      "商品出现质量问题时，可在 15 天内申请换货，寄回运费由我方承担。",
      "",
      "## 发票如何补开？",
      "订单完成后 90 天内可申请补开发票，需提供订单号与抬头信息。",
    ].join("\n");

    // step-3 · B 件：DOC_TYPES 在 public/utils/doc-types.js（拆出避免 index.html 超 400 行）。

    function App() {
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");
      const [busy, setBusy] = useState(false);

      const [text, setText] = useState(DEFAULT_DOC);
      // 参数 A = 左栏滑块的 size / overlap（同名复用）
      const [sizeA, setSizeA] = useState(300);
      const [overlapA, setOverlapA] = useState(30);
      const [estimateMode, setEstimateMode] = useState("mixed");
      const [topK, setTopK] = useState(5);
      const [budget, setBudget] = useState(2000);

      const [docType, setDocType] = useState("handbook");

      // 参数 B = 第 2 段右侧输入框（默认 size=100 与 sizeA=300 形成「粗 vs 细」对照，更易看出差异）
      const [sizeB, setSizeB] = useState(100);
      const [overlapB, setOverlapB] = useState(10);
      const [compareResult, setCompareResult] = useState(null);
      const [compareErr, setCompareErr] = useState(null);

      // step-4 · F 件 · PDF 上传 state
      const [pdfFile, setPdfFile] = useState(null);
      const [pdfResult, setPdfResult] = useState(null);
      const [pdfErr, setPdfErr] = useState(null);

      const [fixed, setFixed] = useState(null);
      const [structure, setStructure] = useState(null);
      const [faq, setFaq] = useState(null);

      const [fixedErr, setFixedErr] = useState(null);
      const [structureErr, setStructureErr] = useState(null);
      const [faqErr, setFaqErr] = useState(null);

      const [err, setErr] = useState(null);

      useEffect(function () {
        window.DemoUtils.getJson("/health").then(setEnv).catch(function () {
          setEnv(null);
        });
      }, []);

      async function callApi(url, body) {
        const data = await window.DemoUtils.postJson(url, body);
        return data;
      }

      function applyDocType(key) {
        const t = DOC_TYPES[key];
        if (!t) return;
        setText(t.text);
        setSizeA(t.size);
        setOverlapA(t.overlap);
        setDocType(key);
      }

      // 7 个 run* 动作封装到 utils（避免 index.html 超 400 行）
      const actions = RunActions.makeActions({
        setBusy: setBusy, setStatus: setStatus, setErr: setErr,
        setFixedErr: setFixedErr, setStructureErr: setStructureErr, setFaqErr: setFaqErr,
        setCompareErr: setCompareErr, setPdfErr: setPdfErr,
        setFixed: setFixed, setStructure: setStructure, setFaq: setFaq,
        setCompareResult: setCompareResult, setPdfResult: setPdfResult,
      });

      async function runPdfChunk() {
        if (!pdfFile) {
          setPdfErr({ error: "请先选 PDF 文件", hint: "点下方按钮或拖入 PDF。", status: null });
          return;
        }
        try {
          const pdfBase64 = await readFileAsBase64(pdfFile);
          await actions.runPdfChunk({ pdfBase64: pdfBase64 });
        } catch (e) {
          setPdfErr({ error: e.message || "读取 PDF 失败", hint: "", status: null });
        }
      }

      function selectPdf() {
        const input = document.getElementById("pdf-input");
        if (input) input.click();
      }

      async function onPdfChange(e) {
        const file = e.target.files && e.target.files[0];
        if (file) {
          setPdfFile(file);
          setPdfResult(null);
          setPdfErr(null);
        }
      }

      function loadLongDoc() {
        setText(LONG_DOC);
        setDocType("handbook");
      }

      function loadDefaultDoc() {
        setText(DEFAULT_DOC);
        setDocType("handbook");
      }

      const currentDocType = DOC_TYPES[docType];

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              切块（Chunking） · 第四步（step-4） · PDF 按页切
            </h1>
            <StatusPill status={status} />
          </header>
          <main id="page-main" className="max-w-[1600px] mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示 <b>PDF 按页切</b>：选一个 PDF → 服务端用 <code>pdf-parse</code> 按 <code>\f</code> 分页 → 每页 = 1 个 Chunk → 每页独立卡片 + 跨页段落腰斩橙色徽标。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>点「选 PDF 文件」→ 选一份含跨页段落的 PDF（如政策手册）</li>
                <li>点「跑按页切」→ POST /api/chunk/pdf → 服务端 pdf-parse v2 → chunkByPdf</li>
                <li>下面卡片：每页独立卡 + 跨页段落腰斩处显示橙色徽标 + 顶部「跨页腰斩 N」统计</li>
                <li>本页只演示 PDF 这一种切法。其他切法 / 对比 / 预算在 step-1 ~ step-3 demo 看</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-2 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <ul className="text-xs text-gray-800 list-disc pl-5 space-y-1">
                  <li>
                    <b>按页切 = 为页码元数据付的代价</b>：每页 1 块 → 命中卡片能点名「第 3 页」；代价是<b>跨页段落一定被腰斩</b>（条款从第 2 页末尾到第 3 页开头，两块都不完整）。
                  </li>
                  <li>
                    <b>改进方向</b>：按页切之后，在页内再按结构切，同时保留页码元数据——这样页码和语义边界可以兼得。
                  </li>
                  <li>
                    <b>PDFParse v2 API</b>：<code>new PDFParse(&#123; data: buffer &#125;)</code> + <code>parser.getText()</code> 拿全文（含 \f 分页）+ <code>parser.pages</code> 拿每页数组 → 优先用 pages（更准确），fallback 到 \f 切。
                  </li>
                </ul>
                <div className="text-xs text-gray-600">
                  观察：选一份真 PDF（跨页段落多的）跑一下，看橙色「跨页段落腰斩」徽标数量。如果一篇文档里这种徽标很多，说明按页切满足不了「块内自洽」需求。
                </div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-4">
              <PdfControlPanel
                running={busy}
                pdfFile={pdfFile}
                onPickPdf={selectPdf}
                onFileChange={onPdfChange}
                onRunPdf={runPdfChunk}
                error={pdfErr}
              />
            </section>

            <section id="output" className="space-y-4">
              {pdfResult ? (
                <PdfChunkPanel
                  running={busy}
                  result={pdfResult}
                  error={pdfErr}
                  onRun={runPdfChunk}
                  fileName={pdfFile ? pdfFile.name : ""}
                />
              ) : null}
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
