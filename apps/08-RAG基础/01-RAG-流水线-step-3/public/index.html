<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG 流水线 · step-3 · 检索做成工具（Agent 最小循环）</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="/utils/api.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/output-cards.js"></script>
  <script type="text/babel" src="/components/store-panel.js"></script>
  <script type="text/babel" src="/components/agent-panel.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, PageIntro, EnvFooter, ErrorCard, AgentPanel, StorePanel } = window.DemoUI;

    function App() {
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");
      const [busy, setBusy] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [sources, setSources] = useState(null);
      const [question, setQuestion] = useState("昨天买的杯子裂了，怎么退？");
      const [ingest, setIngest] = useState(null);
      const [agent, setAgent] = useState(null);
      const [store, setStore] = useState(null);
      const [storeSources, setStoreSources] = useState(null);
      const [err, setErr] = useState(null);

      useEffect(function () {
        window.DemoUtils.getJson("/health").then(setEnv).catch(function () {
          setEnv(null);
        });
      }, []);

      async function refreshSources() {
        const data = await window.DemoUtils.getJson("/api/store-sources");
        setSources(data.result);
      }

      async function triggerFileInput() {
        const input = document.getElementById("file-upload-input");
        if (input) input.click();
      }

      async function doUpload() {
        const input = document.getElementById("file-upload-input");
        const file = input && input.files && input.files[0];
        if (!file) return;
        setUploading(true);
        setBusy(true);
        setStatus("loading");
        setErr(null);
        try {
          const formData = new FormData();
          formData.append("file", file);
          const response = await fetch("/api/ingest-upload", {
            method: "POST",
            body: formData,
          });
          const data = await response.json().catch(function () {
            return { ok: false, error: "响应不是 JSON" };
          });
          if (!response.ok) {
            const err2 = new Error(data.error || "上传入库失败");
            err2.status = response.status;
            err2.hint = data.hint || "";
            throw err2;
          }
          setIngest(data.result);
          setAgent(null);
          const dumped = await window.DemoUtils.getJson("/api/store");
          setStore(dumped.result);
          await refreshSources();
          setStatus("ok");
        } catch (error) {
          setStatus("err");
          setErr({
            error: error.message || "失败",
            hint: error.hint || "",
            status: error.status,
          });
        } finally {
          setBusy(false);
          setUploading(false);
          const input2 = document.getElementById("file-upload-input");
          if (input2) input2.value = "";
        }
      }

      async function run(kind) {
        setBusy(true);
        setStatus("loading");
        setErr(null);
        try {
          if (kind === "ingest") {
            const data = await window.DemoUtils.postJson("/api/ingest", {});
            setIngest(data.result);
            setAgent(null);
            const dumped = await window.DemoUtils.getJson("/api/store");
            setStore(dumped.result);
            await refreshSources();
          } else if (kind === "store") {
            const dumped = await window.DemoUtils.getJson("/api/store");
            setStore(dumped.result);
            setStoreSources(null);
          } else if (kind === "store-sources") {
            const data = await window.DemoUtils.getJson("/api/store-sources");
            setStoreSources(data.result);
            setStore(null);
          } else {
            await window.DemoUtils.getJson("/api/demo-error");
          }
          setStatus("ok");
        } catch (error) {
          setStatus("err");
          setErr({
            error: error.message || "失败",
            hint: error.hint || "",
            status: error.status,
          });
        } finally {
          setBusy(false);
        }
      }

      async function runAgent() {
        setBusy(true);
        setStatus("loading");
        setErr(null);
        try {
          const data = await window.DemoUtils.postJson("/api/agent-run", { question: question });
          setAgent(data.result);
          setStatus("ok");
        } catch (error) {
          setStatus("err");
          setErr({
            error: error.message || "失败",
            hint: error.hint || "",
            status: error.status,
          });
        } finally {
          setBusy(false);
        }
      }

      function loadPreset(kind) {
        if (kind === "chitchat") {
          setQuestion("你好，今天天气怎么样？");
        } else if (kind === "policy") {
          setQuestion("7 天无理由退货怎么操作？");
        }
      }

      const noKey = env && env.hasKey === false;

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              检索增强生成流水线（RAG Pipeline） · step-3 · 检索做成工具（Agent 最小循环）
            </h1>
            <StatusPill status={status} />
          </header>
          <main id="page-main" className="max-w-[1600px] mx-auto p-4 space-y-4">
            <PageIntro />
            <input
              id="file-upload-input"
              type="file"
              accept=".md .pdf"
              className="hidden"
              onChange={doUpload}
            />
            <section id="controls" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-500">售后助手 · 默认 refund.md，或自己上传 Markdown / PDF 文件入库 · 下面左右分栏：左边看库，右边跑 agent</p>
              <div className="flex flex-wrap gap-2 items-center">
                <button
                  type="button"
                  disabled={busy}
                  onClick={function () { run("error"); }}
                  className="border border-gray-300 px-3 py-2 rounded disabled:opacity-50"
                >
                  演示后端 5xx（5xx · 第二类错误 · /api/demo-error）
                </button>
                {noKey ? <p className="text-xs text-red-700">缺 密钥，建库 / 提问已禁用。请填 apps/.env。</p> : null}
              </div>
              <ErrorCard err={err} />
            </section>
            <section id="output" className="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">
              <StorePanel
                busy={busy}
                noKey={noKey}
                uploading={uploading}
                sources={sources}
                storeSources={storeSources}
                ingest={ingest}
                store={store}
                onIngest={function () { run("ingest"); }}
                onStoreRaw={function () { run("store"); }}
                onStoreSources={function () { run("store-sources"); }}
                onUpload={triggerFileInput}
              />
              <AgentPanel
                question={question}
                onQuestionChange={setQuestion}
                busy={busy}
                noKey={noKey}
                result={agent}
                onRun={runAgent}
                onPreset={loadPreset}
              />
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
