<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>余弦相似度 · ⑤ 距离排序对照（contrast）</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="/utils/api.js"></script>
  <script type="text/babel" src="/components/page-nav.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/source-texts.js"></script>
  <script type="text/babel" src="/components/vector-table.js"></script>
  <script type="text/babel" src="/components/score-column.js"></script>
  <script type="text/babel" src="/components/output-cards.js"></script>
  <script type="text/babel">
    const { useEffect, useState } = React;
    const { StatusPill, PageIntroContrast, EnvFooter, PageNav } = window.DemoUI;
    const { SourceTexts, VectorTable, ScoreColumn, OutputCards } = window.DemoUI;

    const TOTAL_CARDS = 6;
    const DEFAULT_K = 4;
    const DEFAULT_THRESHOLD = 0.5;
    const SCALE_PRESETS = [
      { key: "default", label: "×1（默认）", value: 1.0 },
      { key: "half",    label: "×0.5",      value: 0.5 },
    ];

    const SORT_MODES = [
      { key: "cosineDesc",        label: "① 余弦相似度（cosine）降序 · 正确",                higherIsNearer: true,  metric: "cosine" },
      { key: "cosineDistanceAsc", label: "② 余弦距离（1 - cosine）升序 · 正确（反向等价）", higherIsNearer: false, metric: "cosine" },
      { key: "dotDesc",           label: "③ 点积降序 · 正确（长同向赢）",                      higherIsNearer: true,  metric: "dot" },
      { key: "euclideanAsc",      label: "④ 欧氏升序 · 正确（短同向赢）",                      higherIsNearer: false, metric: "euclidean" },
      { key: "cosineAsc",         label: "❌ 余弦升序 · 错（拿到最不像的）",                  higherIsNearer: false, metric: "cosine" },
      { key: "cosineDistanceDesc",label: "❌ 余弦距离降序 · 错（拿到最不像的）",              higherIsNearer: true,  metric: "cosine" },
    ];

    function clampK(raw) { const n = Number(raw); if (!Number.isFinite(n)) return DEFAULT_K; return Math.min(TOTAL_CARDS, Math.max(1, Math.floor(n))); }
    function clampThreshold(raw) { const n = Number(raw); if (!Number.isFinite(n)) return DEFAULT_THRESHOLD; return n; }

    function App() {
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");
      const [busy, setBusy] = useState(false);
      const [k, setK] = useState(DEFAULT_K);
      const [threshold, setThreshold] = useState(DEFAULT_THRESHOLD);
      const [scaleKey, setScaleKey] = useState("default");
      const [sortKey, setSortKey] = useState("cosineDesc");
      // 三个尺子的原始响应
      const [cosineResp, setCosineResp] = useState(null);
      const [dotResp, setDotResp] = useState(null);
      const [euclidResp, setEuclidResp] = useState(null);
      const [last, setLast] = useState(null);

      useEffect(function () {
        window.DemoUtils.fetchHealth().then(setEnv).catch(function () { setEnv(null); });
      }, []);

      const scaleFactor = (SCALE_PRESETS.find(function (p) { return p.key === scaleKey; }) || SCALE_PRESETS[0]).value;
      const sortMode = SORT_MODES.find(function (s) { return s.key === sortKey; }) || SORT_MODES[0];

      // 拿全部 3 个 metric + 自算 cosineDistance
      // 用 Promise.all 并发 3 次（前端并发，不是塞进一个 endpoint）
      async function runAll() {
        setBusy(true);
        setStatus("loading");
        const body = { k: k, threshold: threshold, scaleFactor: scaleFactor };
        const tasks = [
          { url: "/api/score-cross-model", metric: "cosine",    setter: setCosineResp },
          { url: "/api/score-cross-model", metric: "dot",       setter: setDotResp },
          { url: "/api/score-cross-model", metric: "euclidean", setter: setEuclidResp },
        ];
        try {
          const responses = await Promise.all(tasks.map(function (t) {
            return window.DemoUtils.postJson(t.url, Object.assign({}, body, { metric: t.metric }));
          }));
          // 任一失败 → 任一用 { ok: false, error }
          let lastInfo = null;
          responses.forEach(function (res, i) {
            const payload = res.ok ? res.data : { ok: false, error: (res.data && res.data.error) || "请求失败" };
            tasks[i].setter(payload);
            if (i === 0) {
              lastInfo = { url: tasks[i].url, body: Object.assign({}, body, { metric: tasks[i].metric }), status: res.status, ok: res.ok, data: res.data };
            }
          });
          setLast(lastInfo);
          setStatus(responses.every(function (r) { return r.ok; }) ? "done" : "error");
        } catch (error) {
          const message = error && error.message ? error.message : String(error);
          tasks.forEach(function (t) { t.setter({ ok: false, error: message }); });
          setLast({ url: "/api/score-cross-model", body: body, status: 0, ok: false, data: { error: message } });
          setStatus("error");
        } finally {
          setBusy(false);
        }
      }

      // 算 cosineDistance 表（1 - cosine）—— 跟 cosine 同集合 + 排第几名按 sortMode
      const cosineDistanceList = (cosineResp && cosineResp.cards) ? cosineResp.cards.map(function (c) {
        return { id: c.id, label: c.label, text: c.text, score: 1 - c.score };
      }) : null;

      // 当前排序模式对应的「展示用」数组（不重新请求，只在已有分数上切排序方向）
      const sourceArr = sortMode.metric === "cosine" && sortMode.key.startsWith("cosineDistance")
        ? cosineDistanceList
        : (sortMode.metric === "cosine" ? (cosineResp ? cosineResp.cards : null)
          : sortMode.metric === "dot" ? (dotResp ? dotResp.cards : null)
          : (euclidResp ? euclidResp.cards : null));
      const sortedBySortMode = sourceArr ? [...sourceArr].sort(function (a, b) {
        return sortMode.higherIsNearer ? b.score - a.score : a.score - b.score;
      }).map(function (c, idx) { return Object.assign({}, c, { rank: idx + 1 }); }) : null;

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              余弦相似度（Cosine Similarity）· ⑤ 距离排序对照（contrast）· cosine vs cosineDistance 排序反了会翻车
            </h1>
            <StatusPill status={status} />
          </header>
          <PageNav current="contrast" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntroContrast />
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <SourceTexts />
              <div className="text-sm text-gray-700">对应的教学坐标（手写，不是从原文算出来的）——已加 synonym（近义）+ conflict（冲突）两张卡，共 6 张</div>
              <VectorTable />
              <div className="flex flex-wrap gap-2 items-center">
                <span className="text-xs text-gray-700">scaleFactor：</span>
                {SCALE_PRESETS.map(function (preset) {
                  const active = preset.key === scaleKey;
                  return (
                    <button
                      key={preset.key}
                      type="button"
                      className={active
                        ? "bg-blue-600 text-white text-xs px-3 py-1.5 rounded disabled:opacity-50"
                        : "border border-gray-300 text-xs px-3 py-1.5 rounded disabled:opacity-50 hover:bg-gray-50"}
                      disabled={busy}
                      onClick={function () { setScaleKey(preset.key); }}
                    >
                      {preset.label}
                    </button>
                  );
                })}
                <span className="text-xs text-gray-700 ml-4">K：</span>
                <input
                  type="number" min={1} max={TOTAL_CARDS} value={k}
                  disabled={busy}
                  onChange={function (e) { setK(clampK(e.target.value)); }}
                  className="border border-gray-300 rounded px-1 py-0.5 w-12 text-xs"
                />
                <span className="text-xs text-gray-700 ml-4">阈值：</span>
                <input
                  type="number" step="0.05" value={threshold}
                  disabled={busy}
                  onChange={function (e) { setThreshold(clampThreshold(e.target.value)); }}
                  className="border border-gray-300 rounded px-1 py-0.5 w-16 text-xs"
                />
              </div>
              <div className="flex flex-wrap gap-2">
                <button
                  type="button"
                  className="bg-blue-600 text-white text-xs px-3 py-1.5 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={runAll}
                >
                  跑三尺 + 算 cosineDistance
                </button>
                <span className="text-xs text-gray-600 self-center">
                  当前排序模式：{sortMode.label}
                </span>
              </div>
              <div className="flex flex-wrap gap-2">
                {SORT_MODES.map(function (s) {
                  const active = s.key === sortKey;
                  const isWrong = s.key === "cosineAsc" || s.key === "cosineDistanceDesc";
                  return (
                    <button
                      key={s.key}
                      type="button"
                      className={
                        isWrong
                          ? (active
                            ? "bg-red-600 text-white text-xs px-3 py-1.5 rounded"
                            : "border border-red-300 text-red-700 text-xs px-3 py-1.5 rounded hover:bg-red-50")
                          : (active
                            ? "bg-blue-600 text-white text-xs px-3 py-1.5 rounded"
                            : "border border-gray-300 text-xs px-3 py-1.5 rounded hover:bg-gray-50")
                      }
                      onClick={function () { setSortKey(s.key); }}
                    >
                      {s.label}
                    </button>
                  );
                })}
              </div>
            </section>
            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {sortedBySortMode ? (
                <div className="space-y-4">
                  <div className="bg-gray-50 text-gray-700 rounded p-3 text-xs">
                    <div className="font-medium">当前排序：{sortMode.label}</div>
                    <div>展示的「score 列」是 {sortMode.metric === "cosine" && sortMode.key.startsWith("cosineDistance") ? "1 - cosine（前端的余弦距离列）" : sortMode.metric === "cosine" ? "cosine（余弦相似度）" : sortMode.metric === "dot" ? "点积" : "欧氏距离"}</div>
                  </div>
                  <ol className="text-xs space-y-1">
                    {sortedBySortMode.map(function (card) {
                      return (
                        <li key={card.id} className="border-t pt-1">
                          <div>第 {card.rank} 名 · 分数 {card.score.toFixed(4)}</div>
                          <div className="text-gray-800">{card.text || card.label}</div>
                        </li>
                      );
                    })}
                  </ol>
                  <div className="bg-gray-50 border border-gray-300 rounded p-2 text-xs">
                    <div className="font-medium text-gray-700">三尺原始分数（同一组向量）</div>
                    <div>cosine（取自 cosineResp.cards）：{(cosineResp && cosineResp.cards) ? cosineResp.cards.map(function (c) { return c.id + ":" + c.score.toFixed(4); }).join("  ") : "—"}</div>
                    <div>1 - cosine（前端算）：{cosineDistanceList ? cosineDistanceList.map(function (c) { return c.id + ":" + c.score.toFixed(4); }).join("  ") : "—"}</div>
                    <div>dot（取自 dotResp.cards）：{(dotResp && dotResp.cards) ? dotResp.cards.map(function (c) { return c.id + ":" + c.score.toFixed(4); }).join("  ") : "—"}</div>
                    <div>euclidean（取自 euclidResp.cards）：{(euclidResp && euclidResp.cards) ? euclidResp.cards.map(function (c) { return c.id + ":" + c.score.toFixed(4); }).join("  ") : "—"}</div>
                  </div>
                </div>
              ) : (
                <p className="text-sm text-gray-500">还没跑——点「跑三尺 + 算 cosineDistance」开始。</p>
              )}
              <OutputCards last={last} />
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
