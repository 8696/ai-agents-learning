<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>决策模式 3 · 模型自己决定（agent loop）· step-6</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/page-nav.js"></script>

  <script type="text/babel">
    const { useState } = React;
    const { EnvFooter, PageNav } = window.DemoUI;

;

    const PRESETS = [
      "你好",
      "在吗",
      "今天天气不错",
      "现在还能七天无理由退货吗？",
      "运费谁出",
      "保修多久",
      "我想开会员",
      "聊聊吧",
    ];

    function App() {
      const [question, setQuestion] = useState("现在还能七天无理由退货吗？");
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [statusPill, setStatusPill] = useState("⏸ 待连接");

      async function runChat() {
        const setL = (l) => setLoading(l);
        setL(true); setError(null);
        try {
          const res = await fetch("/api/chat-agent", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, topK: 3 }),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(`HTTP ${res.status}${body.error ? " · " + body.error : ""}`);
          }
          setData(await res.json());
        } catch (err) { setError(err.message); }
        finally { setL(false); }
      }

      React.useEffect(() => {
        if (loading) setStatusPill("🔄请求中");
        else if (error) setStatusPill("❌错误");
        else if (data) setStatusPill("✅完成");
        else setStatusPill("⏸待连接");
      }, [loading, error, data]);

      const branchColor = data?.branch === "retrieval" ? "bg-green-50 border-green-300" : "bg-gray-50 border-gray-300";

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              决策模式 3 · 模型自己决定（agent loop）
            </h1>
            <span id="status-pill" className="text-xs px-2 py-1 rounded bg-gray-200">{statusPill}</span>
          </header>

          <PageNav current="agent-decide" />

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                <b>本页只演示：</b>先调一次模型问「该问题是否需要检索？请只回答 yes/no」→ 模型判断 → 答 yes 走检索、no 直接答。
                这就是 agent loop（agent 循环）风格的判断方式。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>输入框里改问题，或用 / 默认 / 预设</li>
                <li>点「发问」→ POST /api/chat-agent → 服务端先问模型「yes/no」</li>
                <li>看 modelSaid（模型答的 yes/no） + branch + answer</li>
                <li>反复试 —— 注意闲聊题模型大概率答 no；业务题答 yes</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  <b>模型自己决定 —— 最灵活、最贴近语义。</b>模型看到「你好」→ 自己判断「不需要检索」→ 答寒暄；看到「退货几天」→ 自己判断「需要检索」→ 调 search()。
                </div>
                <div className="text-xs text-gray-800">
                  代价：<b>每次提问都额外调一次模型</b>（先问 yes/no）—— 速度变慢 + Token 翻倍。
                </div>
                <div className="text-xs text-gray-600">怎么观察：看 modelSaid 字段 —— 模型怎么判断「该不该检索」。</div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div>
                <label className="text-xs text-gray-600" htmlFor="question-input">用户问句</label>
                <input id="question-input" type="text" value={question}
                  onChange={(e) => setQuestion(e.target.value)}
                  className="w-full border border-gray-300 rounded px-2 py-1 mt-1 text-sm" />
                <div className="mt-1 flex flex-wrap gap-1">
                  {PRESETS.map((p) => (
                    <button key={p}
                      onClick={() => setQuestion(p)}
                      className="text-xs border border-gray-300 rounded px-2 py-0.5 hover:bg-gray-100">
                      {p}
                    </button>
                  ))}
                </div>
              </div>
              <button id="btn-chat" onClick={runChat}
                disabled={loading || !question.trim()}
                className="bg-blue-600 text-white px-3 py-1 rounded disabled:opacity-50">
                {loading ? "请求中…" : "发问（agent loop 判断）"}
              </button>
              {error && <div className="text-red-600 text-sm">失败：{error}</div>}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 min-h-[160px] space-y-2">
              {data ? (
                <>
                  <div className={`text-xs font-mono px-2 py-1 rounded border inline-block ${branchColor}`}>
                    branch = <b>{data.branch}</b> · modelSaid = <b>{data.modelSaid}</b>
                    · {data.branch === "retrieval" ? "模型判 yes → 检索" : "模型判 no → 直接答"}
                  </div>
                  <div className="text-xs text-gray-500 font-mono">reason: {data.reason}</div>
                  <div className={`text-sm whitespace-pre-wrap p-3 rounded border ${branchColor}`}>
                    {data.answer || "（空）"}
                  </div>
                </>
              ) : (
                <div className="text-xs text-gray-500">还没发问 —— 点上面「发问」按钮。</div>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <EnvFooter />
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
