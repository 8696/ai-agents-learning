<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG vs Fine-tuning · 能力边界：检索不教新流程 · 需求 12 · 决策卡</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/page-nav.js"></script>

  <script type="text/babel">
    const { EnvFooter, PageNav } = window.DemoUI;

    function App() {
      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              需求 12 · 能力边界：检索不教新流程 · 决策卡
            </h1>
            <span id="status-pill" className="text-xs px-2 py-1 rounded bg-gray-200">📖 决策卡</span>
          </header>

          <PageNav current="capability-boundary" />

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                <b>本页只演示：</b>RAG 不是万能——「行为 / 流程问题」（多步对话、跳转、问顺序）不是检索能解决的。
                模型本来不会按你们司流程图一步一步追问，喂 PDF 也救不回来。
              </p>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  <b>行为 / 流程问题 → 微调 或 工作流（后续模块）</b>；事实 / 政策问题 → RAG。
                </div>
                <div className="text-xs text-gray-800">
                  反过来：<b>微调不灌会过期的事实</b>——模型不是不会解释退货，是不知道你们现在几天，所以事实问题仍走 RAG。
                </div>
                <div className="text-xs text-gray-600">怎么观察：下面行为 / 流程 vs 事实 / 政策 对照。</div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4">
              <h2 className="text-sm font-semibold text-gray-700 mb-3">行为 / 流程 vs 事实 / 政策</h2>
              <table className="w-full text-sm">
                <thead className="bg-gray-100 text-xs">
                  <tr>
                    <th className="text-left p-2">需求类型</th>
                    <th className="text-left p-2">例子</th>
                    <th className="text-left p-2">该用什么</th>
                  </tr>
                </thead>
                <tbody className="text-xs">
                  <tr className="border-t">
                    <td className="p-2">行为 / 流程问题</td>
                    <td className="p-2">「按公司审批流程问哪几个问题」</td>
                    <td className="p-2 font-semibold text-blue-700">微调 或 工作流（agent 编排）</td>
                  </tr>
                  <tr className="border-t bg-gray-50">
                    <td className="p-2">行为 / 流程问题</td>
                    <td className="p-2">「先查订单再查库存再决定退 / 换 / 修」</td>
                    <td className="p-2 font-semibold text-blue-700">工作流（agent loop）</td>
                  </tr>
                  <tr className="border-t">
                    <td className="p-2">行为 / 流程问题</td>
                    <td className="p-2">「收到投诉后按客服流程依次回复」</td>
                    <td className="p-2 font-semibold text-blue-700">微调（学客服话术）</td>
                  </tr>
                  <tr className="border-t bg-gray-50">
                    <td className="p-2 font-semibold">事实 / 政策问题</td>
                    <td className="p-2 font-semibold">「退货几天」/「运费谁出」/「保修多久」</td>
                    <td className="p-2 font-semibold text-green-700">RAG（喂手册 / FAQ）</td>
                  </tr>
                  <tr className="border-t">
                    <td className="p-2 font-semibold">事实 / 政策问题</td>
                    <td className="p-2 font-semibold">「XX 条款原文是怎么写的」</td>
                    <td className="p-2 font-semibold text-green-700">RAG + 出处</td>
                  </tr>
                  <tr className="border-t bg-gray-50">
                    <td className="p-2 font-semibold">深度专业反应</td>
                    <td className="p-2 font-semibold">「按医学指南给出问诊方向」</td>
                    <td className="p-2 font-semibold text-red-700">微调（深度）+ RAG（最新指南）</td>
                  </tr>
                </tbody>
              </table>

              <div className="bg-red-50 border border-red-300 rounded p-3 mt-3 text-xs">
                <div className="font-semibold text-red-900 mb-1">常见失败模式</div>
                <div className="text-gray-800">
                  把公司「内部审批流程 PDF」切块塞进 RAG 库——<br />
                  用户：「我请假需要哪些步骤？」→ 模型按 PDF 答了一份流程图清单——但接下来的追问、追问顺序、状态判断、跨部门跳转，<b>RAG 一条都做不了</b>。
                </div>
                <div className="text-gray-800 mt-2">
                  这是「行为 / 流程问题」，需要工作流（agent loop）或微调，<b>不是 RAG 能收口</b>的。
                </div>
              </div>
            </section>

            <section id="output" className="bg-white shadow rounded p-4 min-h-[80px] text-xs text-gray-500">
              <b className="text-gray-700">一句话：</b>RAG 给材料给知识，给不了流程；要让模型按流程走 → 工作流 或 微调。
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <EnvFooter />
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
