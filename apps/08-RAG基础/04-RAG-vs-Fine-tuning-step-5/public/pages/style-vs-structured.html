<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG vs Fine-tuning · 风格稳 → 才考虑微调 · 需求 3 · 决策卡</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/page-nav.js"></script>

  <script type="text/babel">
    const { EnvFooter, PageNav } = window.DemoUI;

    function App() {
      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              需求 3 · 风格稳 → 才考虑微调 · 决策卡
            </h1>
            <span id="status-pill" className="text-xs px-2 py-1 rounded bg-gray-200">📖 决策卡</span>
          </header>

          <PageNav current="style-vs-structured" />

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                <b>本页只演示：</b>JSON 字段稳、口吻稳 ≠ 一定要微调——结构化输出（Structured Output）能解决 90% 的字段问题。
                微调是「真稳不住 + 量大 + 长期不变」的最后才用。
              </p>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  <b>JSON 字段稳 → 先走结构化输出（模块 04）——不要直接调。</b>
                  结构化输出是协议层约束，OpenAI strict mode / Anthropic tool_use 都吃—— Zod 写 schema，模型按 schema 返回；不是改权重。
                </div>
                <div className="text-xs text-gray-600">怎么观察：下面的「JSON 字段稳」对照表。</div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4">
              <h2 className="text-sm font-semibold text-gray-700 mb-3">决策卡：JSON 字段稳怎么解决</h2>
              <table className="w-full text-sm">
                <thead className="bg-gray-100 text-xs">
                  <tr>
                    <th className="text-left p-2">问题</th>
                    <th className="text-left p-2">推荐方案</th>
                    <th className="text-left p-2">为什么不是微调</th>
                  </tr>
                </thead>
                <tbody className="text-xs">
                  <tr className="border-t">
                    <td className="p-2">JSON 字段稳（`status: "ok"` / `error: (code, msg)`）</td>
                    <td className="p-2 font-semibold text-blue-700">结构化输出 + strict schema</td>
                    <td className="p-2">协议层约束，零成本，零数据</td>
                  </tr>
                  <tr className="border-t bg-gray-50">
                    <td className="p-2">日期格式统一（"YYYY-MM-DD"）</td>
                    <td className="p-2 font-semibold text-blue-700">JSON Schema 加 format + system 提示</td>
                    <td className="p-2">协议层约束</td>
                  </tr>
                  <tr className="border-t">
                    <td className="p-2">枚举字段限定（priority ∈ "low" / "medium" / "high"）</td>
                    <td className="p-2 font-semibold text-blue-700">JSON Schema enum</td>
                    <td className="p-2">协议层约束</td>
                  </tr>
                  <tr className="border-t bg-gray-50">
                    <td className="p-2">回复必须有「先道歉再结论」</td>
                    <td className="p-2 font-semibold text-blue-700">system 提示 + few-shot（见 step-2）</td>
                    <td className="p-2">改输入，权重不动</td>
                  </tr>
                  <tr className="border-t">
                    <td className="p-2">某领域专业术语不能错（医学 / 法律）</td>
                    <td className="p-2 font-semibold text-blue-700">RAG 喂术语表 + system 提示</td>
                    <td className="p-2">检索比微调更可更新</td>
                  </tr>
                  <tr className="border-t bg-red-50">
                    <td className="p-2 font-semibold">领域反应深度（医学诊断风格）</td>
                    <td className="p-2 font-semibold text-red-700">⚠️ 微调（几千 ~ 几万条问答对）</td>
                    <td className="p-2">结构化输出 + system + 检索都做不到</td>
                  </tr>
                </tbody>
              </table>
            </section>

            <section id="output" className="bg-white shadow rounded p-4 min-h-[80px] text-xs text-gray-500">
              <b className="text-gray-700">一句话：</b>先看结构化输出能不能收口；不能 → system + 检索；都不能 → 真稳不住才微调。
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <EnvFooter />
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
