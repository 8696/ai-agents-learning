<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG vs Fine-tuning · 隐私：进权重当删不掉 · 需求 11 · 决策卡</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/page-nav.js"></script>

  <script type="text/babel">
    const { EnvFooter, PageNav } = window.DemoUI;

    function App() {
      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              需求 11 · 隐私：进权重当删不掉 · 决策卡
            </h1>
            <span id="status-pill" className="text-xs px-2 py-1 rounded bg-gray-200">📖 决策卡</span>
          </header>

          <PageNav current="privacy-irreversible" />

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                <b>本页只演示：</b>有些素材进了权重就拿不出来。检索增强生成「从库里删」能拿到，微调「从权重撤」拿不到——这种素材绝不进训练集。
              </p>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  <b>禁入训练集的素材：</b>内部薪资表、密钥、未发布的人事纪要、客户未公开合同、医疗病历、未成年人数据。
                </div>
                <div className="text-xs text-gray-800">
                  <b>对比：</b>检索增强生成 = 借阅室的书，下架即不可借；微调权重 = 你脑子里的记忆，灌进去就拔不出。
                </div>
                <div className="text-xs text-gray-600">怎么观察：下面两张对照表 + 禁入清单。</div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4">
              <h2 className="text-sm font-semibold text-gray-700 mb-3">禁入训练集的素材</h2>
              <table className="w-full text-sm">
                <thead className="bg-gray-100 text-xs">
                  <tr>
                    <th className="text-left p-2">类型</th>
                    <th className="text-left p-2">例子</th>
                    <th className="text-left p-2">为什么不能进</th>
                  </tr>
                </thead>
                <tbody className="text-xs">
                  <tr className="border-t">
                    <td className="p-2 font-mono">密钥</td>
                    <td className="p-2">API Key、数据库密码</td>
                    <td className="p-2 text-red-700">权重里统计痕迹提取可得</td>
                  </tr>
                  <tr className="border-t bg-gray-50">
                    <td className="p-2 font-mono">薪酬</td>
                    <td className="p-2">薪资表、奖金、股权</td>
                    <td className="p-2 text-red-700">隐私 + 反歧视法</td>
                  </tr>
                  <tr className="border-t">
                    <td className="p-2 font-mono">未公开信息</td>
                    <td className="p-2">未发布的人事纪要、未公布的产品价格</td>
                    <td className="p-2 text-red-700">竞争 / 法规</td>
                  </tr>
                  <tr className="border-t bg-gray-50">
                    <td className="p-2 font-mono">个人敏感信息</td>
                    <td className="p-2">医疗病历、未成年人数据</td>
                    <td className="p-2 text-red-700">GDPR / 个人信息保护法</td>
                  </tr>
                  <tr className="border-t">
                    <td className="p-2 font-mono">客户合同</td>
                    <td className="p-2">未公开的合同条款、定价</td>
                    <td className="p-2 text-red-700">商业机密</td>
                  </tr>
                </tbody>
              </table>

              <h2 className="text-sm font-semibold text-gray-700 mt-4 mb-3">删文档 vs 撤回权重</h2>
              <table className="w-full text-sm">
                <thead className="bg-gray-100 text-xs">
                  <tr>
                    <th className="text-left p-2">动作</th>
                    <th className="text-left p-2">检索增强生成</th>
                    <th className="text-left p-2">微调</th>
                  </tr>
                </thead>
                <tbody className="text-xs">
                  <tr className="border-t">
                    <td className="p-2">能不能「撤回」</td>
                    <td className="p-2 font-semibold text-blue-700">✅ 一行删 / 改文件即可</td>
                    <td className="p-2 text-red-700 font-semibold">❌ 几乎做不到</td>
                  </tr>
                  <tr className="border-t bg-gray-50">
                    <td className="p-2">删后还留不留统计</td>
                    <td className="p-2 font-semibold text-blue-700">✅ 不留（删除即消失）</td>
                    <td className="p-2 text-red-700">⚠️ 留（权重里统计痕迹删不掉）</td>
                  </tr>
                  <tr className="border-t">
                    <td className="p-2">撤回成本</td>
                    <td className="p-2 font-semibold text-blue-700">分钟级</td>
                    <td className="p-2 text-red-700">重新训一次（小时 ~ 天）</td>
                  </tr>
                </tbody>
              </table>
            </section>

            <section id="output" className="bg-white shadow rounded p-4 min-h-[80px] text-xs text-gray-500">
              <b className="text-gray-700">一句话：</b>选微调前必过一道「这份数据放进去就当撤不回」审查——拿不准的素材先走 RAG（可改可删）。
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <EnvFooter />
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
