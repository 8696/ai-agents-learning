<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAG vs Fine-tuning · 检索范例当少样本 ≠ 已微调 · 需求 13 · 决策卡</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/page-nav.js"></script>

  <script type="text/babel">
    const { EnvFooter, PageNav } = window.DemoUI;

    function App() {
      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              需求 13 · 检索范例当少样本 ≠ 已微调 · 决策卡
            </h1>
            <span id="status-pill" className="text-xs px-2 py-1 rounded bg-gray-200">📖 决策卡</span>
          </header>

          <PageNav current="fewshot-vs-finetune" />

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                <b>本页只演示：</b>「从历史好评里抽 3 条塞 system」叫<b>少样本（few-shot）</b>，权重没改。
                不是微调。但很多人汇报失真——以为「我们微调过了」。
              </p>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  「检索 3 条好评 → 塞 system」 = 改这一次输入；「微调」 = 改模型权重（永久）。
                  <b>两者不是一回事</b>。
                </div>
                <div className="text-xs text-gray-600">怎么观察：下面对比表。</div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4">
              <h2 className="text-sm font-semibold text-gray-700 mb-3">检索范例当少样本 vs 微调</h2>
              <table className="w-full text-sm">
                <thead className="bg-gray-100 text-xs">
                  <tr>
                    <th className="text-left p-2">维度</th>
                    <th className="text-left p-2">检索范例当少样本</th>
                    <th className="text-left p-2">微调</th>
                  </tr>
                </thead>
                <tbody className="text-xs">
                  <tr className="border-t">
                    <td className="p-2">改什么</td>
                    <td className="p-2 font-semibold text-blue-700">这一次输入的 system</td>
                    <td className="p-2 font-semibold text-red-700">模型权重（几亿 ~ 浮点数）</td>
                  </tr>
                  <tr className="border-t bg-gray-50">
                    <td className="p-2">持久性</td>
                    <td className="p-2 font-semibold text-blue-700">调用结束就没了</td>
                    <td className="p-2 font-semibold text-red-700">永久</td>
                  </tr>
                  <tr className="border-t">
                    <td className="p-2">改的口吻</td>
                    <td className="p-2 font-semibold text-blue-700">这次会话</td>
                    <td className="p-2 font-semibold text-red-700">这次 + 以后所有调用</td>
                  </tr>
                  <tr className="border-t bg-gray-50">
                    <td className="p-2">数据需求</td>
                    <td className="p-2 font-semibold text-blue-700">3 条好评够</td>
                    <td className="p-2 font-semibold text-red-700">几千 ~ 几万条问答对</td>
                  </tr>
                  <tr className="border-t">
                    <td className="p-2">更新成本</td>
                    <td className="p-2 font-semibold text-blue-700">改 system 字符串</td>
                    <td className="p-2 font-semibold text-red-700">重训（小时 ~ 天）</td>
                  </tr>
                  <tr className="border-t bg-gray-50">
                    <td className="p-2">回头看历史</td>
                    <td className="p-2 font-semibold text-blue-700">看 prompt 历史即可</td>
                    <td className="p-2 font-semibold text-red-700">需要看「模型版本」+ 「数据版本」</td>
                  </tr>
                </tbody>
              </table>

              <div className="bg-red-50 border border-red-300 rounded p-3 mt-3 text-xs">
                <div className="font-semibold text-red-900 mb-1">常见失败模式（汇报失真）</div>
                <div className="text-gray-800">
                  「我们抽了 3 条好评塞 system」 → 「所以我们微调过了」→ 范例一旧、口吻跟着旧，<br />
                  你还以为「模型版本」坏了——其实从来没微调过，是范例内容过时了。
                </div>
                <div className="text-gray-800 mt-2">
                  修正：汇报时要分清「少样本（改输入）」与「微调（改权重）」——两个不是一回事。
                </div>
              </div>
            </section>

            <section id="output" className="bg-white shadow rounded p-4 min-h-[80px] text-xs text-gray-500">
              <b className="text-gray-700">一句话：</b>检索范例当少样本 ≠ 微调；汇报时分清。
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <EnvFooter />
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
