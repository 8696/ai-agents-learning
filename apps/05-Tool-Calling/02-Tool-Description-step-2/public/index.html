<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模块 05 · 02 · Tool Description · step-2 字段 description 单次对照</title>

  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入（禁止换 CDN / 版本 / integrity） -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <!-- §5.3.4 强制：React 18.3.1 UMD CDN -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <!-- §5.3.4 强制：Babel Standalone 锁定 7.26.4 -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const COLOR = {
      baselineCard: "border-red-300 bg-red-50",
      improvedCard: "border-green-300 bg-green-50",
      neutralCard: "border-gray-300 bg-white",
      diffSame: "bg-gray-100 text-gray-600",
      diffDiff: "bg-yellow-100 text-yellow-900",
      diffBad: "bg-red-100 text-red-800",
      diffGood: "bg-green-100 text-green-800",
      verdict: "bg-yellow-50 border-yellow-300",
    };

    const CITY_KEYWORDS = ["北京", "上海", "深圳", "杭州", "广州", "南京", "苏州", "成都", "beijing", "shanghai", "shenzhen", "hangzhou", "guangzhou", "BJ", "SH", "SZ", "HZ", "GZ", "NJ", "京", "沪", "粤", "浙"];

    function isBadCity(args) {
      if (!args || typeof args !== "object") return false;
      const oid = args.order_id;
      if (typeof oid !== "string") return false;
      const s = oid.toLowerCase();
      return CITY_KEYWORDS.some((k) => s.includes(k.toLowerCase()));
    }

    function fmt(v, fallback) {
      if (v === null || v === undefined) return fallback ?? "—";
      if (typeof v === "object") return JSON.stringify(v);
      return String(v);
    }

    function fmtContentPreview(content) {
      if (!content) return "(空)";
      const s = String(content);
      return s.length > 60 ? s.slice(0, 60) + "…" : s;
    }

    function ToolsList({ tools, title }) {
      return (
        <div className="text-xs space-y-2">
          <div className="font-medium text-gray-700">{title}</div>
          {tools.map((t, i) => (
            <div key={i} className="border border-gray-300 rounded p-2 bg-white">
              <div className="font-mono text-blue-700">{t.function.name}</div>
              <div className="text-gray-700 mt-1 whitespace-pre-wrap">{t.function.description}</div>
              <div className="mt-1 text-gray-500">
                参数：
                {Object.entries(t.function.parameters.properties).map(([k, v]) => (
                  <div key={k} className="ml-2 mt-1">
                    <span className="font-mono">{k}</span> ({v.type})
                    {t.function.parameters.required.includes(k) && <span className="text-red-600"> *</span>}
                    {v.description ? (
                      <span className="text-gray-700"> · <b>description</b>：{v.description}</span>
                    ) : (
                      <span className="text-red-600"> · <b>无 description</b></span>
                    )}
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function OneCallCard({ result, expectedName, isBad, cardColor, expectedToolName }) {
      if (!result) {
        return (
          <section className={`border-2 border-dashed rounded p-3 bg-gray-50 min-h-[200px] flex items-center justify-center`}>
            <span className="text-sm text-gray-500">未跑（点上方按钮调一次）</span>
          </section>
        );
      }
      if (!result.ok) {
        return (
          <section className={`border-2 ${cardColor} rounded p-3`}>
            <div className="text-sm text-red-700">LLM 调用失败（catch 路径）</div>
            <pre className="text-xs mt-1 whitespace-pre-wrap">{JSON.stringify(result.response, null, 2)}</pre>
          </section>
        );
      }
      const picked = result.pickedToolName;
      const args = result.pickedToolArgs;
      const argOid = args && typeof args === "object" && "order_id" in args ? args.order_id : null;
      const finishReason = result.response?.choices?.[0]?.finish_reason ?? "?";
      const content = result.response?.choices?.[0]?.message?.content ?? null;
      const usage = result.response?.usage ?? {};
      const toolCorrect = expectedToolName ? picked === expectedToolName : true;

      return (
        <section className={`border-2 rounded p-3 space-y-2 ${cardColor}`}>
          <div className="flex items-center justify-between">
            <h3 className="font-semibold">{expectedName}</h3>
            <span className={`text-xs px-2 py-0.5 rounded ${isBad ? COLOR.diffBad : COLOR.diffGood}`}>
              {isBad ? "❌ 参数瞎填" : "✅ 没瞎填"}
            </span>
          </div>
          <ToolsList tools={result.tools} title="本次发给模型的 Tool" />

          <div className="grid grid-cols-2 gap-2 text-xs">
            <div><span className="text-gray-500">pickedToolName = </span><span className="font-mono">{fmt(picked, "(没调)")}</span></div>
            <div><span className="text-gray-500">finish_reason = </span><span className="font-mono">{finishReason}</span></div>
            <div><span className="text-gray-500">order_id = </span><span className="font-mono">{fmt(argOid, "(无)")}</span></div>
            <div><span className="text-gray-500">content = </span><span className="font-mono">{fmtContentPreview(content)}</span></div>
            <div><span className="text-gray-500">prompt_tokens = </span><span className="font-mono">{fmt(usage.prompt_tokens)}</span></div>
            <div><span className="text-gray-500">completion_tokens = </span><span className="font-mono">{fmt(usage.completion_tokens)}</span></div>
            <div><span className="text-gray-500">total_tokens = </span><span className="font-mono">{fmt(usage.total_tokens)}</span></div>
            <div><span className="text-gray-500">耗时 ms = </span><span className="font-mono">{fmt(result.elapsedMs)}</span></div>
          </div>
        </section>
      );
    }

    function DiffTable({ baseline, improved }) {
      if (!baseline || !improved || !baseline.ok || !improved.ok) return null;

      const bPicked = baseline.pickedToolName;
      const iPicked = improved.pickedToolName;
      const bOid = baseline.pickedToolArgs?.order_id;
      const iOid = improved.pickedToolArgs?.order_id;
      const bBad = isBadCity(baseline.pickedToolArgs);
      const iBad = isBadCity(improved.pickedToolArgs);
      const bFr = baseline.response?.choices?.[0]?.finish_reason;
      const iFr = improved.response?.choices?.[0]?.finish_reason;
      const bPrompt = baseline.response?.usage?.prompt_tokens;
      const iPrompt = improved.response?.usage?.prompt_tokens;
      const bComplete = baseline.response?.usage?.completion_tokens;
      const iComplete = improved.response?.usage?.completion_tokens;
      const bElapsed = baseline.elapsedMs;
      const iElapsed = improved.elapsedMs;
      const bContent = baseline.response?.choices?.[0]?.message?.content ?? null;
      const iContent = improved.response?.choices?.[0]?.message?.content ?? null;

      const rows = [
        { label: "pickedToolName", b: fmt(bPicked, "(没调)"), i: fmt(iPicked, "(没调)"), diff: bPicked === iPicked ? "same" : "diff" },
        { label: "finish_reason", b: fmt(bFr), i: fmt(iFr), diff: bFr === iFr ? "same" : "diff" },
        { label: "order_id", b: fmt(bOid, "(无)"), i: fmt(iOid, "(无)"), diff: bOid === iOid ? "same" : "diff" },
        { label: "是否瞎填城市名", b: bBad ? "❌ 瞎填" : "✅ 没瞎填", i: iBad ? "❌ 瞎填" : "✅ 没瞎填", diff: bBad === iBad ? (bBad ? "same-bad" : "same-good") : (bBad && !iBad ? "fixed" : (!bBad && iBad ? "broken" : "diff")) },
        { label: "response.content", b: fmtContentPreview(bContent), i: fmtContentPreview(iContent), diff: bContent === iContent ? "same" : "diff" },
        { label: "prompt_tokens", b: fmt(bPrompt), i: fmt(iPrompt), diff: "info", hint: bPrompt !== undefined && iPrompt !== undefined ? `Δ ${iPrompt - bPrompt}` : "" },
        { label: "completion_tokens", b: fmt(bComplete), i: fmt(iComplete), diff: "info", hint: bComplete !== undefined && iComplete !== undefined ? `Δ ${iComplete - bComplete}` : "" },
        { label: "耗时 ms", b: fmt(bElapsed), i: fmt(iElapsed), diff: "info", hint: `Δ ${iElapsed - bElapsed}` },
      ];

      function cellStyle(diff) {
        if (diff === "same") return COLOR.diffSame;
        if (diff === "diff") return COLOR.diffDiff;
        if (diff === "fixed") return COLOR.diffGood; // A 瞎填 B 没瞎填 = fixed（好）
        if (diff === "broken") return COLOR.diffBad;  // A 没瞎填 B 瞎填 = broken（坏）
        if (diff === "same-bad") return COLOR.diffBad;
        if (diff === "same-good") return COLOR.diffGood;
        return COLOR.diffSame;
      }

      function diffLabel(diff) {
        if (diff === "same") return "相同";
        if (diff === "diff") return "不同";
        if (diff === "fixed") return "✅ B 修好了";
        if (diff === "broken") return "❌ B 反而坏了";
        if (diff === "same-bad") return "同样瞎填";
        if (diff === "same-good") return "都没瞎填";
        return "";
      }

      return (
        <section className={`border-2 rounded p-3 ${COLOR.verdict}`}>
          <h3 className="font-semibold text-sm mb-2">📊 完整差异点（A 组 vs B 组）</h3>
          <table className="w-full text-xs">
            <thead>
              <tr className="border-b">
                <th className="text-left p-1">字段</th>
                <th className="text-left p-1">A 组（差 · 字段无 description）</th>
                <th className="text-left p-1">B 组（好 · 字段有 description）</th>
                <th className="text-left p-1">差异</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => (
                <tr key={i} className="border-b border-gray-200">
                  <td className="p-1 font-medium">{r.label}</td>
                  <td className={`p-1 font-mono break-all ${cellStyle(r.diff)}`}>{r.b}</td>
                  <td className={`p-1 font-mono break-all ${cellStyle(r.diff)}`}>{r.i}</td>
                  <td className="p-1">{diffLabel(r.diff)}{r.hint && <span className="text-gray-500 ml-1">{r.hint}</span>}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </section>
      );
    }

    function App() {
      const [query, setQuery] = useState("我那个订单是在北京下的，能帮我查下物流吗？");
      const [baselineResult, setBaselineResult] = useState(null);
      const [improvedResult, setImprovedResult] = useState(null);
      const [busySide, setBusySide] = useState(null); // "baseline" | "improved" | null
      const [errorText, setErrorText] = useState("");
      const inputRef = useRef(null);

      useEffect(() => {
        fetch("/health").then(r => r.json()).then(h => {
          const envSpan = document.getElementById("env-info");
          if (envSpan) {
            envSpan.textContent = `端口 ${h.port} · 协议 A · provider ${h.provider ?? "?"} · model ${h.model ?? "?"} · Key ${h.hasKey ? "✅" : "❌"}`;
          }
          if (!h.hasKey && inputRef.current) inputRef.current.disabled = true;
        }).catch(() => {
          const envSpan = document.getElementById("env-info");
          if (envSpan) envSpan.textContent = "端口 50026 · 协议 A · /health 未连上";
        });
      }, []);

      async function runOne(side) {
        if (!query.trim()) {
          setErrorText("query 不能为空");
          return;
        }
        setBusySide(side);
        setErrorText("");
        try {
          const r = await fetch(`/api/compare-${side}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query }),
          });
          const data = await r.json();
          if (!r.ok) {
            setErrorText(`${side} 调用失败：${data.error || "HTTP " + r.status}`);
            return;
          }
          if (side === "baseline") setBaselineResult(data);
          else setImprovedResult(data);
        } catch (err) {
          setErrorText(`fetch 异常：${String(err)}`);
        } finally {
          setBusySide(null);
        }
      }

      const expectedToolName = "query_logistics"; // 单 Tool 列表，两侧都应调

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">模块 05 · 02 · Tool Description · step-2 字段 description 单次对照</h1>
            <span id="status-pill" className="text-xs px-2 py-1 rounded bg-gray-200">
              {busySide ? `🔄调${busySide === "baseline" ? "A 组" : "B 组"}中` : "⏸待连接"}
            </span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示：<b>同一个 user query 调两次独立的 LLM（一次 A 组 · 字段无 description，一次 B 组 · 字段有 description「不接受城市名等非订单号输入」）</b>，
                下方「完整差异点」表把两次调用的 pickedToolName / finish_reason / order_id / 是否瞎填城市名 / response.content / token 使用 / 耗时全列出来对比。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>在下方输入框写 user query（默认是「我那个订单是在北京下的，能帮我查下物流吗？」—— user 没明确给订单号，故意引诱模型瞎填）</li>
                <li>点「调一次 A 组（字段无 description）」 → 一次 LLM 调用，结果存到左卡片</li>
                <li>点「调一次 B 组（字段有 description）」 → 又一次 LLM 调用，结果存到右卡片</li>
                <li>两份结果都出来后，下方「完整差异点」表自动列出两边的所有可观察差异（变体 2「参数语义」实证）</li>
              </ol>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div>
                <label className="text-sm text-gray-700 block mb-1">User query（用户原话）</label>
                <textarea
                  ref={inputRef}
                  className="w-full border border-gray-300 rounded p-2 text-sm"
                  rows={2}
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                />
                <p className="text-xs text-gray-500 mt-1">点了「调一次 A 组」会发生什么：服务端用「字段无 description」的 Tool 调一次模型，把 pickedToolName / order_id / finish_reason / token / 耗时 / response.content 全部存到左卡片。</p>
              </div>
              <div className="flex gap-2 flex-wrap">
                <button
                  id="btn-baseline"
                  className="bg-red-600 text-white px-3 py-1.5 rounded text-sm disabled:opacity-50"
                  onClick={() => runOne("baseline")}
                  disabled={busySide !== null}
                >
                  {busySide === "baseline" ? "调 A 组中..." : "调一次 A 组（字段无 description）"}
                </button>
                <button
                  id="btn-improved"
                  className="bg-green-600 text-white px-3 py-1.5 rounded text-sm disabled:opacity-50"
                  onClick={() => runOne("improved")}
                  disabled={busySide !== null}
                >
                  {busySide === "improved" ? "调 B 组中..." : "调一次 B 组（字段有 description）"}
                </button>
                <button
                  className="border border-gray-300 px-3 py-1.5 rounded text-sm disabled:opacity-50"
                  onClick={() => setQuery("我那个订单是在北京下的，能帮我查下物流吗？")}
                  disabled={busySide !== null}
                >
                  改回示例 X（城市名当订单号）
                </button>
                <button
                  className="border border-gray-300 px-3 py-1.5 rounded text-sm disabled:opacity-50"
                  onClick={() => setQuery("收货地址是杭州，能帮我查下这个订单的物流吗？")}
                  disabled={busySide !== null}
                >
                  改示例 Y（另一个城市）
                </button>
                <button
                  className="border border-gray-300 px-3 py-1.5 rounded text-sm disabled:opacity-50"
                  onClick={() => setQuery("订单号 ord/2026/0007，能帮我查下吗？")}
                  disabled={busySide !== null}
                >
                  改示例 Z（不规范订单号）
                </button>
              </div>
            </section>

            <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] space-y-4">
              {errorText && (
                <div className="border border-red-300 bg-red-50 rounded p-3 text-sm text-red-700">错误：{errorText}</div>
              )}
              {!baselineResult && !improvedResult && !errorText && (
                <p className="text-sm text-gray-500">还没调任何一侧 —— 点「调一次 A 组」或「调一次 B 组」开始（两边可以独立调，先后无所谓）。</p>
              )}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <OneCallCard
                  result={baselineResult}
                  expectedName="A 组（差 · 字段无 description）"
                  isBad={baselineResult?.ok ? isBadCity(baselineResult.pickedToolArgs) : false}
                  cardColor={COLOR.baselineCard}
                  expectedToolName={expectedToolName}
                />
                <OneCallCard
                  result={improvedResult}
                  expectedName="B 组（好 · 字段有 description）"
                  isBad={improvedResult?.ok ? isBadCity(improvedResult.pickedToolArgs) : false}
                  cardColor={COLOR.improvedCard}
                  expectedToolName={expectedToolName}
                />
              </div>
              <DiffTable baseline={baselineResult} improved={improvedResult} />
            </section>

            <section className="bg-white shadow rounded p-4 text-xs text-gray-600 space-y-2">
              <p><b>怎么看日志：</b>每次单端点调用会写一条独立日志到 <code>apps/05-Tool-Calling/02-Tool-Description-step-2/logs/{`{YYYY-MM-DD}.log`}</code>（按 BJT 日切）：compare.baseline.received → ... → compare.baseline.sent；compare.improved.received → ... → compare.improved.sent。</p>
              <p><b>本次实验教学点对应：</b>变体 2「参数语义」（字段 description 写明「字段是什么 / 不接受什么」决定模型填参数的稳定性）。其他变体（反例 / few-shot / enum 约束 / 跨 Provider 等）见 <code>docs/学习模块/05-Tool-Calling/02-Tool-Description.md</code> 需求清单。</p>
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">端口 50026 · 协议 A · 待 /health</span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
