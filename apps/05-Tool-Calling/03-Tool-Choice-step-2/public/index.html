<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tool Choice · step-2 · 指定 Tool vs required</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    // 本页：required 任选 vs 钉死 query_logistics / get_weather；三槽常驻对照。
    const { useState, useEffect } = React;
    const { StatusPill, PageIntro, EnvFooter } = window.DemoUI;

    const SLOTS = [
      { key: "required", label: "required（任选）", choiceKind: "required", forcedName: null },
      { key: "force:query_logistics", label: "钉死 query_logistics", choiceKind: "force", forcedName: "query_logistics" },
      { key: "force:get_weather", label: "钉死 get_weather", choiceKind: "force", forcedName: "get_weather" },
    ];
    const DEFAULT_QUERY = "今天深圳天气怎么样？顺便我快递 67890 到哪了？";

    function SlotCard({ slot, data }) {
      if (!data) {
        return (
          <div className="border border-dashed border-gray-300 rounded p-3 bg-gray-50 min-h-[180px]">
            <div className="text-xs font-semibold text-gray-500 mb-2">{slot.label}</div>
            <p className="text-xs text-gray-400">尚未跑过。选中后点「跑这一档」。</p>
          </div>
        );
      }
      if (data.ok === false) {
        const teaching = data.teaching;
        const isThinking = teaching && teaching.code === "thinking_x_forced_choice";
        const errText =
          (data.error || "失败") + (data.detail ? " · " + data.detail : "");
        return (
          <div className="border border-amber-400 bg-amber-50 rounded p-3 min-h-[180px] space-y-2">
            <div className="text-xs font-semibold text-amber-900">
              {slot.label} · {isThinking ? "边界冲突（可学）" : "失败"}
            </div>
            {teaching && (
              <div className="border border-amber-500 bg-amber-100 rounded p-2 text-xs text-amber-950">
                <div className="font-semibold">{teaching.protocolLabel}</div>
                <p className="mt-1">{teaching.protocolDetail}</p>
              </div>
            )}
            <pre className="text-xs whitespace-pre-wrap max-h-32 overflow-auto text-amber-900">{errText}</pre>
          </div>
        );
      }
      const resp = data.response || {};
      const req = data.request || {};
      const t = data.teaching || {};
      const cardBorder = t.protocolOk === false ? "border-red-400 bg-red-50" : "border-gray-300 bg-white";
      return (
        <div className={"border rounded p-3 min-h-[180px] space-y-2 " + cardBorder}>
          <div className="flex justify-between text-xs">
            <span className="font-semibold text-gray-800">{slot.label}</span>
            <span className="text-gray-500">{data.elapsedMs}ms</span>
          </div>
          <div
            className={
              "rounded p-2 text-xs " +
              (t.protocolOk === false
                ? "border border-red-400 bg-red-100 text-red-900"
                : "border border-green-300 bg-green-50 text-green-900")
            }
          >
            <div className="font-semibold">协议判定 · {t.protocolLabel}</div>
            <p className="mt-1">{t.protocolDetail}</p>
          </div>
          <div className="bg-gray-50 rounded p-2 text-xs text-gray-700 space-y-1">
            <div>请求 · choiceKind: <code>{req.choiceKind}</code></div>
            <div>forcedName: <code>{req.forcedName == null ? "(无)" : req.forcedName}</code></div>
            <div className="truncate" title={JSON.stringify(req.tool_choice)}>
              tool_choice: <code>{JSON.stringify(req.tool_choice)}</code>
            </div>
          </div>
          <div className="border border-gray-200 bg-white rounded p-2 text-xs space-y-1">
            <div>
              firstToolName:{" "}
              <span className="font-semibold">{resp.firstToolName || "（无）"}</span>
            </div>
            <div>finish_reason: <code>{resp.finish_reason || "(null)"}</code></div>
            <div>hasToolCalls: {String(resp.hasToolCalls)}</div>
          </div>
          <div className="border border-green-300 bg-green-50 rounded p-2 text-xs">
            <div className="font-medium text-green-900 mb-1">content</div>
            <pre className="whitespace-pre-wrap max-h-20 overflow-auto text-green-900">
              {resp.content || "（无）"}
            </pre>
          </div>
          {resp.tool_calls && resp.tool_calls.length > 0 && (
            <pre className="text-xs border rounded p-2 max-h-24 overflow-auto whitespace-pre-wrap bg-white">
              {JSON.stringify(resp.tool_calls, null, 2)}
            </pre>
          )}
        </div>
      );
    }

    function DiffSummary({ slots }) {
      const filled = SLOTS.filter((s) => slots[s.key] && slots[s.key].ok);
      if (filled.length < 2) {
        return (
          <p className="text-xs text-gray-500">至少跑完两档后，这里汇总 firstToolName 是否被钉死。</p>
        );
      }
      return (
        <div className="border rounded p-3 bg-white space-y-2">
          <div className="text-sm font-medium">三档差异摘要</div>
          <table className="w-full text-xs text-left">
            <thead>
              <tr className="text-gray-500 border-b">
                <th className="py-1 pr-2">档位</th>
                <th className="py-1 pr-2">firstToolName</th>
                <th className="py-1">协议判定</th>
              </tr>
            </thead>
            <tbody>
              {SLOTS.map((s) => {
                const d = slots[s.key];
                if (!d || !d.ok) {
                  return (
                    <tr key={s.key} className="text-gray-400 border-b">
                      <td className="py-1">{s.label}</td>
                      <td colSpan={2}>未跑 / 失败</td>
                    </tr>
                  );
                }
                const name = (d.response && d.response.firstToolName) || "（无）";
                const label = (d.teaching && d.teaching.protocolLabel) || "";
                const bad = d.teaching && d.teaching.protocolOk === false;
                return (
                  <tr key={s.key} className={"border-b " + (bad ? "bg-red-50" : "")}>
                    <td className="py-1 pr-2 font-medium">{s.label}</td>
                    <td className="py-1 pr-2">{name}</td>
                    <td className={"py-1 " + (bad ? "text-red-800 font-semibold" : "text-green-800")}>
                      {label}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <p className="text-xs text-gray-600">
            读法：钉死档的 firstToolName 必须等于指定名；required 只需有 call。若天气句下 required 调了天气、钉死物流仍出物流——说明「指定」压过了语义匹配。
          </p>
        </div>
      );
    }

    function App() {
      const [status, setStatus] = useState("idle");
      const [hasKey, setHasKey] = useState(null);
      const [query, setQuery] = useState(DEFAULT_QUERY);
      const [selectedKey, setSelectedKey] = useState("required");
      const [slots, setSlots] = useState({
        required: null,
        "force:query_logistics": null,
        "force:get_weather": null,
      });
      const [pageError, setPageError] = useState(null);

      useEffect(() => {
        fetch("/health")
          .then((r) => r.json())
          .then((j) => setHasKey(Boolean(j.hasKey)))
          .catch(() => setHasKey(false));
      }, []);

      const selected = SLOTS.find((s) => s.key === selectedKey) || SLOTS[0];

      async function runOne() {
        setPageError(null);
        setStatus("loading");
        const mode = selected;
        try {
          const res = await fetch("/api/force", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              query,
              choiceKind: mode.choiceKind,
              forcedName: mode.forcedName,
            }),
          });
          const json = await res.json();
          if (!res.ok || !json.ok) {
            const detailStr =
              typeof json.detail === "string"
                ? json.detail
                : json.detail
                  ? JSON.stringify(json.detail)
                  : "";
            const msg =
              (json.error ? json.error + (detailStr ? " · " + detailStr : "") : null) ||
              "HTTP " + res.status;
            setSlots((prev) => ({
              ...prev,
              [mode.key]: {
                ok: false,
                error: json.error || msg,
                detail: detailStr,
                teaching: json.teaching || null,
                request: json.request || null,
              },
            }));
            setPageError(msg);
            setStatus("error");
            return;
          }
          setSlots((prev) => ({ ...prev, [mode.key]: json }));
          setStatus("ok");
        } catch (e) {
          const msg = String(e);
          setSlots((prev) => ({ ...prev, [mode.key]: { ok: false, error: msg } }));
          setPageError(msg);
          setStatus("error");
        }
      }

      function clearSlots() {
        setSlots({
          required: null,
          "force:query_logistics": null,
          "force:get_weather": null,
        });
        setPageError(null);
        setStatus("idle");
      }

      const busy = status === "loading";
      const canRun = hasKey !== false && !busy && query.trim().length > 0;

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans flex flex-col">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              Tool Choice · step-2 · 指定 Tool vs required
            </h1>
            <StatusPill status={status} />
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4 flex-1">
            <PageIntro />

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="space-y-1">
                <label className="text-sm text-gray-700 block">user query（三档共用）</label>
                <input
                  className="w-full border border-gray-300 rounded px-3 py-2 text-sm"
                  value={query}
                  disabled={busy}
                  onChange={(e) => setQuery(e.target.value)}
                />
                <p className="text-xs text-gray-500">
                  默认句故意又提天气又提快递，方便看 required 任选 vs 钉死某一个。
                </p>
              </div>

              <div className="space-y-1">
                <div className="text-sm text-gray-700">选择档位</div>
                <div className="flex flex-wrap gap-2">
                  {SLOTS.map((s) => (
                    <button
                      key={s.key}
                      type="button"
                      disabled={busy}
                      onClick={() => setSelectedKey(s.key)}
                      className={
                        "px-3 py-1.5 rounded text-sm border disabled:opacity-50 " +
                        (selectedKey === s.key
                          ? "bg-blue-600 text-white border-blue-600"
                          : "bg-white border-gray-300")
                      }
                    >
                      {s.label}
                      {slots[s.key] ? " · 已有" : ""}
                    </button>
                  ))}
                </div>
              </div>

              <div className="flex flex-wrap gap-2 items-center">
                <button
                  type="button"
                  disabled={!canRun}
                  onClick={runOne}
                  className="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50"
                >
                  跑这一档（{selected.label}）
                </button>
                <button
                  type="button"
                  disabled={busy}
                  onClick={clearSlots}
                  className="border border-gray-300 px-4 py-2 rounded text-sm disabled:opacity-50"
                >
                  清空三档对照
                </button>
                {hasKey === false && (
                  <span className="text-xs text-red-600">Key ❌ · 主按钮已禁用</span>
                )}
              </div>
              {pageError && (
                <div className="border border-red-300 bg-red-50 text-red-800 text-sm rounded p-2">
                  {pageError}
                </div>
              )}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              <div className="text-sm font-medium text-gray-800">输出区 · 三档常驻对照</div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                {SLOTS.map((s) => (
                  <SlotCard key={s.key} slot={s} data={slots[s.key]} />
                ))}
              </div>
              <DiffSummary slots={slots} />
            </section>
          </main>

          <EnvFooter />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
