<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Function Calling 协议 · step-5 · 模型自编排（自纠）</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/gantt.js"></script>

  <script type="text/babel">
    /**
     * 模型自编排（自纠）页：填 query → POST /api/self-correct → 看每轮决策轨迹 + 自纠触发 + final reply。
     *
     * 关键实验：
     *   - query "AI"（2 字符，< 3）→ Round 1 search_doc 空 hits → Round 2 扩 query 重试 → Round 3 summarize → final
     *   - query "Function Calling"（长，>= 3）→ Round 1 拿到 hits → Round 2 summarize → final（2 轮收敛，无自纠）
     */
    const { useState } = React;
    const { useEnvInfo, PageNav, StatusPill, PageIntro, EnvFooter, ResultCard } = window.DemoUI;

    function App() {
      const { env } = useEnvInfo();
      const [query, setQuery] = useState("AI");
      const [status, setStatus] = useState("idle");
      const [error, setError] = useState(null);
      const [result, setResult] = useState(null);

      function run() {
        setStatus("running");
        setError(null);
        setResult(null);
        fetch("/api/self-correct", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: query }),
        })
          .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
          .then(function (res) {
            if (res.status >= 400) {
              setError("HTTP " + res.status + " · " + (res.body.error || JSON.stringify(res.body)));
              setStatus("error");
              return;
            }
            setResult(res.body);
            setStatus("ok");
          })
          .catch(function (e) {
            setError(String(e));
            setStatus("error");
          });
      }

      // 每轮决策的徽标颜色
      function roundLabel(trace, idx) {
        const t = trace[idx];
        const dec = t.decision;
        if (dec.kind === "final") {
          return { label: "FINAL", cls: "bg-purple-200 text-purple-800" };
        }
        // tool_call：检查是不是自纠（Round 2+ 且上一轮 search_doc 返空）
        const prev = idx > 0 ? trace[idx - 1] : null;
        const isRetry =
          idx > 0 &&
          prev &&
          prev.decision.kind === "tool_call" &&
          prev.decision.tool === "search_doc" &&
          prev.result.ok &&
          Array.isArray(prev.result.result?.hits) &&
          prev.result.result.hits.length === 0;
        if (isRetry) {
          return { label: `Round ${t.round} · 自纠 retry`, cls: "bg-orange-200 text-orange-800" };
        }
        return { label: `Round ${t.round}`, cls: "bg-blue-200 text-blue-800" };
      }

      // 自纠标记
      function selfCorrectNote(trace, idx) {
        if (idx === 0) return null;
        const prev = trace[idx - 1];
        if (
          prev.decision.kind === "tool_call" &&
          prev.decision.tool === "search_doc" &&
          prev.result.ok &&
          Array.isArray(prev.result.result?.hits) &&
          prev.result.result.hits.length === 0
        ) {
          return (
            <div className="text-xs text-orange-700 bg-orange-50 border-l-2 border-orange-300 px-2 py-1 rounded mt-2">
              <strong>🔄 自纠触发</strong>：上一轮 tool_result.hits=[] → 模型决定扩 query 重试（{prev.decision.arguments.query} → {trace[idx].decision.arguments.query}）
            </div>
          );
        }
        return null;
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              05 · 01 · step-5 · 模型自编排（自纠）
            </h1>
            <StatusPill status={status} />
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageNav />
            <PageIntro
              summary="模型自编排：POST /api/self-correct → while 循环 + decideNextAction（mock LLM 看 tool_result 决定下一步）→ 自纠触发 + MAX_ROUNDS 边界。"
              steps={[
                "填 query → POST /api/self-correct { query }",
                "服务端：while (rounds < MAX_ROUNDS=4) 循环",
                "每轮：decideNextAction(round, query, lastResult) → 决定 tool_call 或 final",
                "执行 tool_call → 拿 result → 推进 lastResult → 下一轮模型看到",
                "观察：query='AI'(2 字符)→ Round1 空 hits → Round2 扩 query 重试 → Round3 summarize → final",
                "观察：query='Function Calling'(长)→ Round1 拿到 hits → Round2 summarize → final（2 轮收敛，无自纠）",
                "边界：query='ab'（极端短）→ MAX_ROUNDS 触发 → 业务降级",
              ]}
            />

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <h2 className="text-sm font-semibold">🔁 while 循环输入</h2>
              <label className="block text-sm text-gray-700">
                query（传给 search_doc；&lt; 3 字符触发自纠）：
                <input
                  type="text"
                  value={query}
                  onChange={function (e) { setQuery(e.target.value); }}
                  className="mt-1 block w-full border border-gray-300 rounded px-2 py-1 text-sm"
                  placeholder="例如：AI（短，触发自纠）/ Function Calling（长，无自纠）"
                />
              </label>
              <div>
                <button
                  onClick={run}
                  disabled={status === "running"}
                  className="bg-blue-600 text-white text-sm px-3 py-1 rounded disabled:opacity-50"
                >
                  {status === "running" ? "🔄 while 跑中…" : "跑 while（看模型自纠）"}
                </button>
              </div>
              <p className="text-xs text-gray-500">
                实验建议：① query="AI"（2 字符）→ 应触发 Round2 自纠；② query="Function Calling"（长）→ 2 轮收敛无自纠；③ query="❌"（含 ❌ 标记）→ MAX_ROUNDS 触发。
              </p>
            </section>

            <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] space-y-4">
              <h2 className="text-sm font-semibold">📊 while 循环结果</h2>
              {error && <p className="text-red-700 text-sm">{error}</p>}
              {!result && !error && (
                <p className="text-sm text-gray-500">
                  还没跑。填 query → 点「跑 while」。
                </p>
              )}
              {result && (
                <>
                  <div className="bg-yellow-50 border border-yellow-300 rounded p-3 text-sm space-y-1">
                    <div>总轮数 = <span className="font-mono text-purple-700">{result.rounds}</span> · 总耗时 = <span className="font-mono text-blue-700">{result.totalMs} ms</span></div>
                    {result.maxRoundsTriggered && (
                      <div className="text-red-700">⚠️ MAX_ROUNDS 触发 —— 模型未收敛，业务降级</div>
                    )}
                  </div>

                  <h3 className="text-xs font-semibold">每轮决策轨迹</h3>
                  {(result.trace || []).map(function (t, idx) {
                    const label = roundLabel(result.trace, idx);
                    const dec = t.decision;
                    const args = dec.kind === "tool_call" ? dec.arguments : null;
                    return (
                      <div key={t.round} className="bg-white border border-gray-300 rounded p-3 text-sm space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="font-semibold text-xs">{label.label}</span>
                          <span className={"text-xs px-2 py-0.5 rounded " + label.cls}>
                            {dec.kind === "final" ? "final" : ("tool_call · " + dec.tool)}
                          </span>
                        </div>
                        <div className="text-xs text-gray-600 space-y-1">
                          <div>耗时: <span className="font-mono">{t.startMs}ms → {t.endMs}ms</span> ({t.durationMs}ms)</div>
                          {args && (
                            <div>arguments: <code className="bg-gray-100 px-1 rounded">{JSON.stringify(args)}</code></div>
                          )}
                          {dec.kind === "final" && (
                            <div>final content: <span className="text-purple-700">{dec.content.slice(0, 100)}{dec.content.length > 100 ? "..." : ""}</span></div>
                          )}
                        </div>
                        {selfCorrectNote(result.trace, idx)}
                        {dec.kind === "tool_call" && (
                          <div className="mt-2">
                            <ResultCard
                              r={{
                                ok: t.result.ok,
                                tool: t.result.tool,
                                tool_call_id: t.result.tool_call_id,
                                result: t.result.ok ? t.result.result : undefined,
                                error: t.result.ok ? undefined : t.result.error,
                              }}
                              idx={idx}
                            />
                          </div>
                        )}
                      </div>
                    );
                  })}

                  {result.finalReply && (
                    <div className="bg-green-50 border border-green-300 rounded p-3 text-sm space-y-1">
                      <div className="flex items-center justify-between">
                        <span className="font-semibold text-xs">final_reply（while 终态）</span>
                        <span className="text-xs px-2 py-0.5 rounded bg-green-300 text-green-900">final</span>
                      </div>
                      <pre className="whitespace-pre-wrap text-xs bg-white p-2 rounded border border-green-200">
                        {result.finalReply}
                      </pre>
                    </div>
                  )}
                </>
              )}
            </section>
          </main>

          <EnvFooter env={env} />
        </div>
      );
    }

    window.DemoUtils.waitDemoUI(["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo", "ResultCard"], function () {
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    });
  </script>
</body>
</html>
