<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Function Calling 协议 · step-3 · 单跑</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/gantt.js"></script>

  <script type="text/babel">
    /**
     * 单跑页：选 mode（parallel | serial）→ POST /api/plan → 渲 gantt 时序图 + tool_results。
     *
     * 教学锚点：
     *   - mode=parallel：3 个 bar 几乎同时起步，totalMs ≈ max(单 handler sleep) ≈ 80ms
     *   - mode=serial  ：3 个 bar 顺序堆叠，totalMs ≈ sum ≈ 165ms
     */
    const { useState } = React;
    const { useEnvInfo, PageNav, StatusPill, PageIntro, EnvFooter, GanttChart, ResultCard } = window.DemoUI;

    function App() {
      const { env } = window.DemoUI.useEnvInfo();
      const [mode, setMode] = useState("parallel");
      const [status, setStatus] = useState("idle");
      const [error, setError] = useState(null);
      const [result, setResult] = useState(null);

      function run() {
        setStatus("running");
        setError(null);
        setResult(null);
        fetch("/api/plan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ scenario: "tokyo-may-7days", mode: mode }),
        })
          .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); })
          .then(function (res) {
            if (res.status >= 400) {
              setError("HTTP " + res.status + " · " + (res.body.error || JSON.stringify(res.body)));
              setStatus("error");
              return;
            }
            setResult(res.body);
            setStatus("ok");
          })
          .catch(function (e) {
            setError(String(e));
            setStatus("error");
          });
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              05 · 01 · step-3 · 单跑
            </h1>
            <StatusPill status={status} />
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageNav />
            <PageIntro
              summary="单跑：选 mode → POST /api/plan → 看 gantt 时序图与 3 条 tool_result。"
              steps={[
                "点「跑一次」→ POST /api/plan { scenario: tokyo-may-7days, mode: 选中的 }",
                "服务端：planToolCalls 决定 3 个 tool_call；按 mode 选 Promise.all 或 for await",
                "每条 tool_call 自己记 startMs / endMs / durationMs → 返 timeline",
                "浏览器渲 gantt：3 个色条的横向位置 + 长度 = 物理执行时序",
                "观察点：parallel = 3 色条 left ≈ 0、长度 = 各 handler sleep；serial = 顺序堆叠、left 累加",
              ]}
            />

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <h2 className="text-sm font-semibold">🎬 单跑配置</h2>
              <div className="flex items-center gap-4 text-sm">
                <label className="flex items-center gap-2">
                  <input type="radio" name="mode" value="parallel" checked={mode === "parallel"} onChange={function () { setMode("parallel"); }} />
                  parallel（Promise.all）
                </label>
                <label className="flex items-center gap-2">
                  <input type="radio" name="mode" value="serial" checked={mode === "serial"} onChange={function () { setMode("serial"); }} />
                  serial（for await）
                </label>
              </div>
              <div>
                <button
                  onClick={run}
                  disabled={status === "running"}
                  className="bg-blue-600 text-white text-sm px-3 py-1 rounded disabled:opacity-50"
                >
                  {status === "running" ? "🔄 请求中…" : "跑一次"}
                </button>
              </div>
              <p className="text-xs text-gray-500">
                点「跑一次」会发到 <code>/api/plan</code>。Tool handler sleep 时长不同：flight 80ms / weather 50ms / packing 30ms —— 这是时序图视觉差异的来源。
              </p>
            </section>

            <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] space-y-4">
              <h2 className="text-sm font-semibold">📊 结果</h2>
              {error && <p className="text-red-700 text-sm">{error}</p>}
              {!result && !error && (
                <p className="text-sm text-gray-500">
                  还没跑。选 mode（parallel 试一次 + serial 试一次对比）→ 点「跑一次」。
                </p>
              )}
              {result && (
                <>
                  <GanttChart
                    title={"① 时序图 · " + (result.mode === "parallel" ? "Promise.all 并发" : "for await 串行")}
                    timeline={result.timeline}
                    totalMs={result.totalMs}
                    mode={result.mode}
                  />
                  <h3 className="text-xs font-semibold">② tool_results（3 条）</h3>
                  {(result.results || []).map(function (r, i) {
                    return <ResultCard key={i} r={r} idx={i} />;
                  })}
                </>
              )}
            </section>
          </main>

          <EnvFooter env={env} />
        </div>
      );
    }

    window.DemoUtils.waitDemoUI(["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo", "GanttChart", "ResultCard"], function () {
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    });
  </script>
</body>
</html>
