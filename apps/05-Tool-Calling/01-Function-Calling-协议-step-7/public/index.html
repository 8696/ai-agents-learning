<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Function Calling 协议 · step-7 混合编排（路由层 hard-code） · 总览</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/gantt.js"></script>

  <script type="text/babel">
    /**
     * 总览页：本 step 有什么、混合编排场景长什么样；不直接演示业务（业务在 pages/hybrid.html）。
     *
     * 全局数据流：
     *   浏览器 /pages/hybrid.html
     *     → POST /api/hybrid { query }
     *       → routes/hybrid.ts
     *         → path = classifyQuery(query)  ← 教学路径分类（前端徽标显示）
     *         → while (rounds < MAX_ROUNDS) {
     *             ① decideHybridAction(round, query, path, lastResult, weatherCalled, suggestItemsCalled)
     *             ② 路由层 hard-code 约束 1（拒绝越权）：suggest_items 必须在 get_weather 之后调
     *             ③ 路由层 hard-code 约束 2（路径 B 硬接）：用户问"带不带伞" → weather → final → 路由层自动跑 suggest_items
     *             ④ executeTool() → 推进 state → lastResult
     *           }
     *       → 返 { path, trace, finalReply, totalMs, rounds }
     *     → 浏览器渲每轮决策 + 路由层拒绝/硬接徽标 + final reply
     *
     * 与 step-5 的区别：step-5 是 while + 模型完全自决；step-7 加两条路由层硬约束（混合编排）。
     *
     * 日志：服务端每处可打点都写文件（apps/05-Tool-Calling/01-Function-Calling-协议-step-7/logs/）。
     */
    const { useState, useEffect } = React;
    const { useEnvInfo, StatusPill, PageIntro, EnvFooter } = window.DemoUI;

    function App() {
      const { env, envError } = useEnvInfo();
      const [tools, setTools] = useState([]);
      const [error, setError] = useState(null);

      useEffect(function () {
        fetch("/api/tools")
          .then(function (r) { return r.json(); })
          .then(function (j) { setTools(j.tools || []); })
          .catch(function (e) { setError("GET /api/tools 失败：" + String(e)); });
      }, []);

      const pageIntroSteps = [
        "页面加载 → GET /health 填页脚；GET /api/tools 拉 Registry 元信息",
        "点「混合编排」进 hybrid 页 → 那里才有业务按钮 + 路径选择",
        "hybrid 页：填 query → POST /api/hybrid → 服务端 classifyQuery 判定路径（A/B/C）",
        "路径 A（仅天气）：模型调 get_weather → final（路由层不硬接 suggest）",
        "路径 B（带伞）：模型调 get_weather → final → 路由层硬接 suggest_items → final",
        "路径 C（直接打包）：模型直接调 suggest_items → 路由层拒绝 → 强制模型先 get_weather → suggest → final",
        "MAX_ROUNDS 边界：超 8 轮未收敛 → final 报 MAX_REACHED，业务降级",
        "前端：每轮决策 + 路由层拒绝 / 硬接徽标 + final reply 全展开",
      ];

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              05 · 01 · Function Calling 协议 · step-7（混合编排 · 路由层 hard-code · 总览）
            </h1>
            <StatusPill status={envError ? "error" : (env.port ? "ok" : "idle")} />
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro
              summary="step-7 演示「混合编排」：路由层 hard-code 两条约束（拒绝越权 + 路径 B 硬接），同时模型决定要不要进两步链。三条路径（A 仅 weather / B weather+硬接 suggest / C 直接打包被拒→退回）对应 MD 易混点「三种编排方式对比」里的「混合」行。"
              steps={pageIntroSteps}
              takeaway={{
                point: "「混合编排」= 路由层 hard-code 约束(确定性) + 模型自编排(灵活性)的组合——约束 1 拒绝越权(suggest_items 必须在 weather 之后调,违反 → ok:false 回灌 → 模型退回),约束 2 路径 B 硬接(用户问带伞 → weather → 模型 final → 路由层自动跑 suggest_items)。MAX_ROUNDS=8 是兜底。",
                observe: "总览页本身不跑业务;点 hybrid 页用 3 个预设 query 跑:① 路径 A 「北京天气」→ 1 轮 final;② 路径 B 「北京带伞」→ weather → final → 路由层硬接 suggest_items;③ 路径 C 「直接打包」→ suggest_items 越权被路由层拒 → 模型退回 weather。看 trace 里「拒绝 / 硬接」徽标和 final reply。",
              }}
              extra={
                <pre className="text-[10px] text-gray-500 bg-gray-50 border-l-2 border-gray-300 px-2 py-1 rounded whitespace-pre-wrap">
{`POST /api/hybrid { query }
  → path = classifyQuery(query)  ← A 仅天气 / B 带伞 / C 直接打包
  → while (rounds < MAX_ROUNDS=8) {
      ① decideHybridAction(round, query, path, lastResult, state)
      ② 路由层 hard-code 约束 1：suggest_items 必须在 get_weather 之后调
         （违反 → ok:false 回灌 → 模型下一轮决定先 weather）
      ③ if kind === "final" && path === "umbrella" && weatherCalled && !suggestItemsCalled
         → 路由层自动跑 suggest_items（用 weather.rain_prob 派生参数）
      ④ else → executeTool() → 推进 state → lastResult
    }
  → 返 { path, trace, finalReply, totalMs, rounds, maxRoundsTriggered }`}
                </pre>
              }
            />

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <h2 className="text-sm font-semibold">📍 场景导航（点进去才有业务按钮）</h2>
              <div className="grid grid-cols-1 gap-3">
                <a href="/pages/hybrid.html" className="block border border-gray-200 rounded p-4 hover:border-blue-500">
                  <div className="text-sm font-semibold">① 混合编排（路由层 hard-code + 模型自决要不要进）</div>
                  <p className="text-xs text-gray-600 mt-1">
                    填 query（试 3 条预设：路径 A/B/C）→ POST /api/hybrid → 服务端 classifyQuery + while 循环 + 路由层硬约束。
                    <br />
                    <strong>关键实验</strong>：路径 A（"5 月东京平均气温"）→ 仅 get_weather；路径 B（"5 月东京带不带伞"）→ get_weather + 路由层硬接 suggest_items；路径 C（"我要打包"）→ mock LLM 跳 weather 直接 suggest → 路由层拒绝 → 退回 weather → suggest。
                  </p>
                </a>
              </div>
            </section>

            <section id="output" className="bg-white shadow rounded p-4 min-h-[120px] space-y-3">
              <h2 className="text-sm font-semibold">🧩 本页只导览、不演示业务（业务在 hybrid 页）</h2>
              <p className="text-sm text-gray-700">
                总览页的"输出区"——这里给出 step-7 关键观察点的一句话总结，详细每轮决策 / 路由层拒绝 / 硬接 / final reply 都在 hybrid 页里。
              </p>
              <ul className="text-xs text-gray-600 list-disc pl-5 space-y-1">
                <li>路径 A：用户问"5 月东京平均气温" → 模型调 get_weather → final（不调 suggest）</li>
                <li>路径 B：用户问"5 月东京带不带伞" → 模型调 get_weather → final → <strong>路由层硬接 suggest_items</strong> → final</li>
                <li>路径 C：用户问"打包清单" → mock LLM 直接调 suggest_items → <strong>路由层拒绝（ok:false）</strong> → 模型退回 weather → suggest → final</li>
                <li>两条路由层 hard-code 约束：checkChainConstraint + shouldHardcodeSuggestItems（routes/hybrid.ts）</li>
                <li>关键代码：<code>routes/hybrid.ts</code> while 循环 + 硬约束 + <code>lib/tools/registry.ts</code> classifyQuery + decideHybridAction</li>
                <li>本页 vs step-5：step-5 模型完全自决；step-7 加两条路由层硬约束（混合编排的"硬"那一面）</li>
              </ul>
            </section>

            <section className="bg-white shadow rounded p-4 space-y-3">
              <div className="flex items-center justify-between">
                <h2 className="text-sm font-semibold">Tool Registry（2 Tool · 路由层 hard-code 链顺序约束：get_weather → suggest_items）</h2>
                <span className="text-xs text-gray-500">GET /api/tools</span>
              </div>
              {error && <p className="text-red-700 text-sm">{error}</p>}
              <div className="space-y-2">
                {tools.map(function (t) {
                  return (
                    <div key={t.name} className="border border-gray-200 rounded p-2 flex items-start justify-between gap-2">
                      <div className="flex-1">
                        <div className="font-mono text-sm font-semibold">{t.name}</div>
                        <div className="text-xs text-gray-600">{t.description}</div>
                      </div>
                      <span className="text-xs px-2 py-0.5 rounded bg-green-200 text-green-800">safe · async</span>
                    </div>
                  );
                })}
                {tools.length === 0 && !error && <p className="text-xs text-gray-500">（Registry 还没加载）</p>}
              </div>
            </section>
          </main>

          <EnvFooter env={env} />
        </div>
      );
    }

    window.DemoUtils.waitDemoUI(["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo"], function () {
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    });
  </script>
</body>
</html>
