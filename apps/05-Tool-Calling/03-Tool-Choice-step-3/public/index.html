<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tool Choice · step-3 · 用户开关映射</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, PageIntro, EnvFooter } = window.DemoUI;

    const SWITCHES = [
      { id: "chat_only", label: "只聊天", mapsTo: 'tool_choice = "none"', hint: "禁止调 Tool" },
      { id: "allow_tools", label: "允许工具", mapsTo: 'tool_choice = "auto"', hint: "模型自选" },
      { id: "force_lookup", label: "强制查库", mapsTo: 'tool_choice = "required"', hint: "必须 ≥1 call" },
    ];
    const DEFAULT_QUERY = "我的快递单号 67890 到哪了？";

    function SlotCard({ sw, data }) {
      if (!data) {
        return (
          <div className="border border-dashed border-gray-300 rounded p-3 bg-gray-50 min-h-[180px]">
            <div className="text-xs font-semibold text-gray-500">{sw.label}</div>
            <p className="text-xs text-gray-400 mt-2">尚未跑过</p>
          </div>
        );
      }
      if (data.ok === false) {
        const t = data.teaching || {};
        return (
          <div className="border border-amber-400 bg-amber-50 rounded p-3 space-y-2 min-h-[180px]">
            <div className="text-xs font-semibold text-amber-900">{sw.label} · 失败/边界</div>
            {t.protocolLabel && (
              <div className="text-xs border border-amber-500 bg-amber-100 rounded p-2">
                <div className="font-semibold">{t.protocolLabel}</div>
                <p className="mt-1">{t.protocolDetail}</p>
              </div>
            )}
            <pre className="text-xs whitespace-pre-wrap max-h-28 overflow-auto">
              {(data.error || "") + (data.detail ? " · " + data.detail : "")}
            </pre>
          </div>
        );
      }
      const req = data.request || {};
      const resp = data.response || {};
      const t = data.teaching || {};
      const bad = t.protocolOk === false;
      return (
        <div className={"border rounded p-3 space-y-2 min-h-[180px] " + (bad ? "border-red-400 bg-red-50" : "border-gray-300 bg-white")}>
          <div className="flex justify-between text-xs">
            <span className="font-semibold">{sw.label}</span>
            <span className="text-gray-500">{data.elapsedMs}ms</span>
          </div>
          <div className="bg-blue-50 border border-blue-200 rounded p-2 text-xs text-blue-900">
            <div className="font-medium">映射（请求参数）</div>
            <div className="mt-1">{req.mappingNote || sw.mapsTo}</div>
            <div className="mt-1">
              实际发出 tool_choice: <code>{JSON.stringify(req.tool_choice)}</code>
            </div>
          </div>
          <div className={"rounded p-2 text-xs " + (bad ? "bg-red-100 text-red-900" : "bg-green-50 text-green-900 border border-green-300")}>
            <div className="font-semibold">{t.protocolLabel}</div>
            <p className="mt-1">{t.protocolDetail}</p>
          </div>
          <div className="border rounded p-2 text-xs bg-white space-y-1">
            <div>hasToolCalls: <strong>{String(resp.hasToolCalls)}</strong></div>
            <div>finish_reason: <code>{resp.finish_reason || "(null)"}</code></div>
            <div>
              tools:{" "}
              {(resp.tool_calls || []).map((c) => c.name).join(", ") || "（无）"}
            </div>
          </div>
          <div className="border border-green-300 bg-green-50 rounded p-2 text-xs">
            <pre className="whitespace-pre-wrap max-h-20 overflow-auto">{resp.content || "（无 content）"}</pre>
          </div>
        </div>
      );
    }

    function MappingTable() {
      return (
        <div className="border rounded p-3 bg-white text-xs space-y-2">
          <div className="text-sm font-medium text-gray-800">产品开关 ↔ tool_choice（常驻对照表）</div>
          <table className="w-full text-left">
            <thead>
              <tr className="text-gray-500 border-b">
                <th className="py-1 pr-2">用户看见</th>
                <th className="py-1 pr-2">后端写入</th>
                <th className="py-1">期望行为</th>
              </tr>
            </thead>
            <tbody>
              {SWITCHES.map((s) => (
                <tr key={s.id} className="border-b border-gray-100">
                  <td className="py-1 pr-2 font-medium">{s.label}</td>
                  <td className="py-1 pr-2"><code>{s.mapsTo}</code></td>
                  <td className="py-1 text-gray-600">{s.hint}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <p className="text-gray-500">
            口头「帮我查一下」只在 messages 里，不会自动变成 required；只有点「强制查库」才会改字段。
          </p>
        </div>
      );
    }

    function App() {
      const [status, setStatus] = useState("idle");
      const [hasKey, setHasKey] = useState(null);
      const [query, setQuery] = useState(DEFAULT_QUERY);
      const [selectedId, setSelectedId] = useState("allow_tools");
      const [slots, setSlots] = useState({
        chat_only: null,
        allow_tools: null,
        force_lookup: null,
      });
      const [pageError, setPageError] = useState(null);

      useEffect(() => {
        fetch("/health")
          .then((r) => r.json())
          .then((j) => setHasKey(Boolean(j.hasKey)))
          .catch(() => setHasKey(false));
      }, []);

      const selected = SWITCHES.find((s) => s.id === selectedId) || SWITCHES[1];

      async function runOne() {
        setPageError(null);
        setStatus("loading");
        const id = selected.id;
        try {
          const res = await fetch("/api/switch", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query, switchId: id }),
          });
          const json = await res.json();
          if (!res.ok || !json.ok) {
            const detailStr =
              typeof json.detail === "string"
                ? json.detail
                : json.detail
                  ? JSON.stringify(json.detail)
                  : "";
            const msg =
              (json.error ? json.error + (detailStr ? " · " + detailStr : "") : null) ||
              "HTTP " + res.status;
            setSlots((prev) => ({
              ...prev,
              [id]: {
                ok: false,
                error: json.error || msg,
                detail: detailStr,
                teaching: json.teaching || null,
              },
            }));
            setPageError(msg);
            setStatus("error");
            return;
          }
          setSlots((prev) => ({ ...prev, [id]: json }));
          setStatus("ok");
        } catch (e) {
          const msg = String(e);
          setSlots((prev) => ({ ...prev, [id]: { ok: false, error: msg } }));
          setPageError(msg);
          setStatus("error");
        }
      }

      function clearSlots() {
        setSlots({ chat_only: null, allow_tools: null, force_lookup: null });
        setPageError(null);
        setStatus("idle");
      }

      const busy = status === "loading";
      const canRun = hasKey !== false && !busy && query.trim().length > 0;

      return (
        <div className="min-h-screen bg-gray-50 flex flex-col">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              Tool Choice · step-3 · 用户开关映射
            </h1>
            <StatusPill status={status} />
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4 flex-1">
            <PageIntro />

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <MappingTable />

              <div className="space-y-1">
                <label className="text-sm block">user query（三档共用）</label>
                <input
                  className="w-full border rounded px-3 py-2 text-sm"
                  value={query}
                  disabled={busy}
                  onChange={(e) => setQuery(e.target.value)}
                />
              </div>

              <div className="space-y-1">
                <div className="text-sm">设置页开关（点了会发生什么见旁注）</div>
                <div className="flex flex-wrap gap-2">
                  {SWITCHES.map((s) => (
                    <button
                      key={s.id}
                      type="button"
                      disabled={busy}
                      onClick={() => setSelectedId(s.id)}
                      className={
                        "px-3 py-1.5 rounded text-sm border disabled:opacity-50 " +
                        (selectedId === s.id
                          ? "bg-blue-600 text-white border-blue-600"
                          : "bg-white border-gray-300")
                      }
                      title={s.hint}
                    >
                      {s.label}
                      {slots[s.id] ? " · 已有" : ""}
                    </button>
                  ))}
                </div>
                <p className="text-xs text-gray-500">
                  当前选中「{selected.label}」→ 将写入 <code>{selected.mapsTo}</code> · {selected.hint}
                </p>
              </div>

              <div className="flex flex-wrap gap-2 items-center">
                <button
                  type="button"
                  disabled={!canRun}
                  onClick={runOne}
                  className="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50"
                >
                  跑这一档（{selected.label}）
                </button>
                <button
                  type="button"
                  disabled={busy}
                  onClick={clearSlots}
                  className="border px-4 py-2 rounded text-sm disabled:opacity-50"
                >
                  清空三档
                </button>
                {hasKey === false && (
                  <span className="text-xs text-red-600">Key ❌</span>
                )}
              </div>
              {pageError && (
                <div className="border border-red-300 bg-red-50 text-red-800 text-sm rounded p-2">
                  {pageError}
                </div>
              )}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              <div className="text-sm font-medium">输出区 · 三开关常驻对照</div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                {SWITCHES.map((s) => (
                  <SlotCard key={s.id} sw={s} data={slots[s.id]} />
                ))}
              </div>
            </section>
          </main>

          <EnvFooter />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
