<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width-width=device-width, initial-scale=1">
  <title>差旅助手 · Function Calling</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/api-client.js"></script>
  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/rounds.js"></script>

  <script type="text/babel">
    /**
      * 本页教学点：一个 4-5 轮的真实业务流（差旅助手），
      *   并行 + 串行 自然混合——决定权在模型，不由代码固定。
      *
      * 演示什么：
      *   - 模型自己把「查天气+换算+列景点」拆成 Round 1 并行 3 个 tool_call
      *   - Round 2 / 3 算预算 / 订机酒——必须等 R1 结果，所以是串行
      *   - Round N：finish_reason=stop，给最终行程单
      *
      * 接口：POST /api/run-realistic（maxRounds=5）
      *   与 /api/run 共用 lib/flow/run-tool-loop.ts，唯一区别是 system prompt
      *   引导模型「只调 trip_* 这 5 个工具」。
      */
    const { useState } = React;

    // ── 这一页用到的 5 个 tool（trip_* 系列），与 server 端同名 ──
    const FLOW_DIAGRAM = `预期流程（实际轮数由模型决定）
  Round 1（并行）：trip_weather(东京) + trip_exchange(CNY,JPY) + trip_attractions(东京)
     └─ 这 3 件事互相不依赖 → 一轮里并行，省 2 次往返
  Round 2（串行）：trip_hotels(东京, 5, 预算换算后)
     └─ 要等 R1 的汇率换算预算，否则不知道 per_night 给多少 → 必须串行
  Round 3（并行 / 串行 看模型）：trip_flights(北京, 东京, ...)
     └─ 看模型决定是否同时查酒店
  Round N（终态）：finish_reason=stop → final content = 行程单`;

    const INTRO_STEPS = [
      "点按钮 → POST /api/run-realistic { prompt: 差旅请求 }",
      "Round 1：模型把无关的事拆成同轮并行 → RoundCard 上看「· N 个 tool_call」徽标",
      "Round 2 / 3：要等上一轮结果才能算 → 串行，Round 数变多",
      "Round N：finish_reason=stop（绿徽标）→ 循环退出，final content = 行程单",
      "数 totalRounds = 串行依赖的次数；数每轮的 tool_call 数 = 这一轮并行几件事",
      "为什么跑这么多轮？—— 因为「先查后算」是真实业务的常态，不是模型慢",
    ];

    const PRESETS = [
      {
        key: "tokyo",
        title: "① 东京 5 天 / 预算 1.5 万",
        prompt: "我下周去东京 5 天，预算 1.5 万人民币，帮我出份行程单",
        expect:
          "期望：R1 并行查天气+汇率+景点；R2 算酒店预算；R3 查机票；R4 出行程单",
      },
      {
        key: "osaka",
        title: "② 大阪 3 天 / 预算 8000",
        prompt: "周末去大阪 3 天，预算 8000 元，列 3 个景点和 1 家酒店就行",
        expect: "期望：R1 并行（汇率+景点+酒店）；R2 出短行程单",
      },
    ];

    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo", "CaseResult"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo, CaseResult } = window.DemoUI;
        const { callEndpoint } = window.DemoUtils;

        function App() {
          const { env, envError } = useEnvInfo();
          const [status, setStatus] = useState("idle");
          const [busy, setBusy] = useState(false);
          const [error, setError] = useState("");
          const [prompt, setPrompt] = useState(PRESETS[0].prompt);
          const [cases, setCases] = useState([]);

          // 没配 Key → 锁按钮，比等 503 更早告诉人
          const blocked = busy || !env.hasKey;

          /**
           * 跑一次差旅请求：POST /api/run-realistic。
           * 两类失败分开处理（§5.3.2 第 2 项）：
           *   1) HTTP 非 200 → entry.error，卡片红框
           *   2) fetch reject → 页面级 error 块
           */
          const runOne = async function (title, p, expect, key) {
            if (blocked) return;
            setBusy(true);
            setStatus("loading");
            setError("");
            try {
              const res = await callEndpoint("/api/run-realistic", { prompt: p });
              const entry =
                res.status === 200
                  ? { title: title, prompt: p, expect: expect, status: 200, data: res.data }
                  : {
                      title: title,
                      prompt: p,
                      expect: expect,
                      status: res.status,
                      error: (res.data && res.data.error) || ("HTTP " + res.status),
                      data: null,
                    };
              setCases(function (prev) {
                return [{ key: key, ...entry }].concat(prev);
              });
              setStatus(res.status === 200 ? "ok" : "error");
            } catch (e) {
              setError("请求发不出去：" + e.message);
              setStatus("error");
            } finally {
              setBusy(false);
            }
          };

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">⑥ 差旅助手 · 4-5 轮混合业务流</h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                {/* §5.3.11 说明区：先把「为什么这么多轮」讲清 */}
                <PageIntro
                  summary="一个真实业务流：模型自己决定哪些轮并行（无依赖）、哪些轮串行（要等结果）。"
                  steps={INTRO_STEPS}
                  extra={
                    <pre className="whitespace-pre-wrap bg-gray-50 p-3 rounded text-xs text-gray-700">
                      {FLOW_DIAGRAM}
                    </pre>
                  }
                />

                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  {!env.hasKey && (
                    <p className="text-xs text-red-600">
                      未检测到 Key，按钮已禁用。先在 apps/.env 配置 LLM_PROVIDER 对应的 Key。
                    </p>
                  )}

                  <div className="space-y-1">
                    <div className="flex gap-2 items-start">
                      <textarea
                        className="flex-1 border rounded p-2 text-sm"
                        rows={2}
                        placeholder="换个差旅请求试试——把预算、目的地、天数改一下，看模型怎么拆"
                        value={prompt}
                        onChange={function (e) {
                          setPrompt(e.target.value);
                        }}
                      />
                      <button
                        className="bg-blue-600 text-white px-3 py-2 rounded text-sm disabled:opacity-50"
                        disabled={blocked || !prompt.trim()}
                        onClick={function () {
                          runOne("自定义差旅", prompt.trim(), "(自由 prompt：看模型自己怎么拆)", "free-" + Date.now());
                        }}
                      >
                        跑自定义
                      </button>
                    </div>
                    <p className="text-xs text-gray-500">
                      点「跑自定义」→ POST /api/run-realistic，最多 5 轮；先看 Round 数（串行几轮），再看每轮 tool_call 数（并行几件事）。
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                    {PRESETS.map(function (p) {
                      return (
                        <div key={p.key} className="space-y-1">
                          <button
                            className="w-full border border-gray-300 hover:border-blue-500 rounded p-2 text-left text-sm disabled:opacity-50"
                            disabled={blocked}
                            onClick={function () {
                              runOne(p.title, p.prompt, p.expect, p.key);
                            }}
                          >
                            <div className="font-semibold">{p.title}</div>
                            <div className="text-xs text-gray-500">prompt: {p.prompt}</div>
                          </button>
                          <p className="text-xs text-gray-500">{p.expect}</p>
                        </div>
                      );
                    })}
                  </div>
                </section>

                {(error || envError) && (
                  <div className="bg-red-50 border border-red-300 rounded p-3 text-sm text-red-700">
                    {error || envError}
                  </div>
                )}

                {/* §5.3.10 输出区：每条 case 渲染 RoundCard + final content */}
                <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
                  <div className="text-sm text-gray-500">
                    {cases.length === 0
                      ? "还没有结果。点上面任一按钮；下面按轮次展开：模型指令（tool_calls）→ 执行结果（tool_result）→ 终态行程单。"
                      : "共 " + cases.length + " 条（最新在顶）。对照每个 case 的 totalRounds 和每轮 tool_call 数。"}
                  </div>
                  {cases.map(function (c) {
                    return <CaseResult key={c.key} entry={c} />;
                  })}
                </section>
              </main>

              <EnvFooter env={env} protocol="A" />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
