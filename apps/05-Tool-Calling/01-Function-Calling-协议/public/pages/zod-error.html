<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zod repair · Function Calling</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/api-client.js"></script>
  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/rounds.js"></script>

  <script type="text/babel">
    /**
     * 本页教学点：参数非法时不要抛异常终止，而是把 Zod issues 当 tool_result 回灌，让模型自己改对。
     * 为了稳定复现，服务端主动篡改模型给出的合法参数（真实场景是模型自己填错）。
     */
    const { useState } = React;

    const PRESET = {
      title: "④ Zod 校验失败 + repair",
      prompt: "算一下 5 加 3 等于多少（prompt 写死在服务端）",
      expect: "期望：Round 1 标记「服务端篡改」+ Zod ✗ → Round 2 模型改对 → Round 3 执行 ✓ → Round 4 stop",
    };

    const INTRO_STEPS = [
      "点按钮 → POST /api/simulate-zod-error（无需 body）",
      "Round 1：模型正常返回 add(5, 3)；服务端把 a 改成字符串 \"not_a_number\"，模拟「参数不合法」",
      "执行前 Zod safeParse 拦下 → handler 一次都没被调用（非法参数不打到真实服务，这是重点）",
      "issues 写成人话塞进 tool_result 回灌：「参数错误: a: Expected number…」",
      "Round 2：模型读到错误，重新发一个合法 add → Round 3 真正执行 → Round 4 给终态回答",
    ];

    // waitDemoUI：等 components/*.js 被 Babel 转译并挂到 window.DemoUI 之后再渲染
    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo", "CaseResult"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo, CaseResult } = window.DemoUI;
        const { callEndpoint } = window.DemoUtils;

        function App() {
          const { env, envError } = useEnvInfo(); // 页脚环境 + Key 闸门
          const [status, setStatus] = useState("idle"); // #status-pill 四态
          const [busy, setBusy] = useState(false); // 防重复提交
          const [error, setError] = useState(""); // fetch 层失败
          const [cases, setCases] = useState([]); // 历史结果，最新在顶

          const blocked = busy || !env.hasKey;

          /**
           * POST /api/simulate-zod-error（无 body：prompt 写死在服务端，保证可复现）。
           *
           * 这个端点有三种结局，页面都要能表达：
           *   1) 200 且有 rounds  → 正常演示，看 Round1 红 → Round3 绿
           *   2) 200 但带 error   → 模型这次没调工具，演示不成立（业务失败，不是 HTTP 失败）
           *   3) 非 200           → 没 Key / 上游报错
           */
          const run = async function () {
            if (blocked) return;
            setBusy(true);
            setStatus("loading");
            setError("");
            try {
              const res = await callEndpoint("/api/simulate-zod-error", {});
              // 这个端点有一种「业务失败但 HTTP 200」：模型没调工具，演示不成立
              const ok = res.status === 200 && res.data && !res.data.error;
              const entry = ok
                ? { title: PRESET.title, prompt: PRESET.prompt, expect: PRESET.expect, status: 200, data: res.data }
                : {
                    title: PRESET.title,
                    prompt: PRESET.prompt,
                    expect: PRESET.expect,
                    status: res.status,
                    error: (res.data && res.data.error) || ("HTTP " + res.status),
                    data: null,
                  };
              setCases(function (prev) {
                return [{ key: "z-" + Date.now(), ...entry }].concat(prev);
              });
              setStatus(ok ? "ok" : "error");
            } catch (e) {
              // fetch reject（服务没起 / 网络断）→ 页面级红块
              setError("请求发不出去：" + e.message);
              setStatus("error");
            } finally {
              setBusy(false);
            }
          };

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">④ Zod 校验 + repair</h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                {/* §5.3.11 说明区：这一页的对照点写在 extra 里 */}
                <PageIntro
                  summary="参数非法时的正确姿势：Zod 拦在 handler 之前，错误回灌给模型，让它自己修。"
                  steps={INTRO_STEPS}
                  extra={
                    <p className="text-xs text-gray-600">
                      对照：若把 issues 直接 throw 成 500，模型永远看不到错误，也就永远没机会改对 —— 这是新手最容易写错的一刀。
                    </p>
                  }
                />

                {/* §5.3.10 功能区：只有一个按钮，但仍要写清点了会发生什么 */}
                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  {!env.hasKey && (
                    <p className="text-xs text-red-600">
                      未检测到 Key，按钮已禁用。先在 apps/.env 配置 LLM_PROVIDER 对应的 Key。
                    </p>
                  )}
                  <div className="space-y-1">
                    <button
                      className="bg-blue-600 text-white px-3 py-2 rounded text-sm disabled:opacity-50"
                      disabled={blocked}
                      onClick={run}
                    >
                      跑 Zod repair
                    </button>
                    <p className="text-xs text-gray-500">
                      点它 → 服务端跑 4 轮闭环；重点看 Round 1 的红色「Zod ✗」和「⚠ 服务端篡改 arguments」徽标。
                    </p>
                    <p className="text-xs text-gray-500">
                      模型有时会拒绝重试或直接口算答案，此时轮数会少于 4 —— 也是真实现象，多跑一次即可。
                    </p>
                  </div>
                </section>

                {/* 页面级错误：连不上服务 / 拉不到 /health */}
                {(error || envError) && (
                  <div className="bg-red-50 border border-red-300 rounded p-3 text-sm text-red-700">
                    {error || envError}
                  </div>
                )}

                {/* §5.3.10 输出区：对比 Round 1（Zod ✗）与 Round 3（执行 ✓）的 arguments */}
                <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
                  <div className="text-sm text-gray-500">
                    {cases.length === 0
                      ? "还没有结果。跑一次后对比 Round 1 与 Round 3 的 arguments：同一个工具，参数从错到对。"
                      : "共 " + cases.length + " 条（最新在顶）"}
                  </div>
                  {cases.map(function (c) {
                    return <CaseResult key={c.key} entry={c} />;
                  })}
                </section>
              </main>

              <EnvFooter env={env} protocol="A" />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
