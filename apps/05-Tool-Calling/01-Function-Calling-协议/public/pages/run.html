<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单 tool / 并行 · Function Calling</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/api-client.js"></script>
  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/rounds.js"></script>

  <script type="text/babel">
    /**
     * 本页教学点：同一个 POST /api/run，对照「一个 tool_call」与「一次多个并行」。
     * 决定权在模型：prompt 里有几件互不依赖的事，它就可能一次发几个 call。
     */
    const { useState } = React;

    const PRESETS = [
      {
        key: "case1",
        title: "① 单 tool 调用",
        prompt: "北京今天天气怎么样？",
        expect: "期望：Round 1 出现 1 个 tool_call(get_weather) → Round 2 finish_reason=stop",
        hint: "只有一件事要做，模型没有并行的理由。",
      },
      {
        key: "case2",
        title: "② 并行 tool 调用",
        prompt: "北京今天天气怎么样？另外 100 加 200 等于多少？",
        expect: "期望：Round 1 一次返回 2 个 tool_call（get_weather + add），服务端 Promise.all 同时执行",
        hint: "两件事互不依赖 → 一轮里并行，比串行少一次往返。",
      },
    ];

    const INTRO_STEPS = [
      "点按钮 → POST /api/run { prompt }",
      "服务端 runToolLoop：把 messages + tools 发给模型，拿回 tool_calls",
      "一轮里的多个 tool_call 走 Promise.all（这就是「并行」的全部含义：同一轮、无依赖）",
      "每个结果拼成 role:tool 消息追加进 messages，再发一次 → 模型给终态回答",
      "看下面卡片：Round 1 的 tool_call 个数，就是模型这一轮决定并行几件事",
    ];

    // waitDemoUI：components/*.js 是 Babel 异步转译的，等它们挂上 window.DemoUI 再挂载页面
    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo", "CaseResult"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo, CaseResult } = window.DemoUI;
        const { callEndpoint } = window.DemoUtils;

        function App() {
          // env：GET /health 拿到的 provider / model / hasKey，喂给页脚 #env-info
          const { env, envError } = useEnvInfo();
          // status：#status-pill 四态（idle / loading / ok / error）
          const [status, setStatus] = useState("idle");
          // busy：请求中，用来禁用所有按钮，防重复提交
          const [busy, setBusy] = useState(false);
          // error：fetch 层面的失败（服务没起、网络断），与 HTTP 4xx/5xx 分开显示
          const [error, setError] = useState("");
          // prompt：自定义输入框
          const [prompt, setPrompt] = useState("");
          // cases：历史运行结果，最新在顶（#output 单会话输出区）
          const [cases, setCases] = useState([]);

          // 没配 Key 就别让人点了等 503 —— 页脚已经显示 Key ❌，这里直接锁按钮
          const blocked = busy || !env.hasKey;

          /**
           * 跑一个用例：POST /api/run。
           * 两类失败分开处理，对应 §5.3.2 第 2 项「错误处理 ≥2 类」：
           *   1) HTTP 非 200（参数错 400 / 没 Key 503 / 上游 5xx）→ 进 entry.error，卡片红框
           *   2) fetch 直接 reject（服务没起）→ 进页面级 error 块
           */
          const runOne = async function (title, p, expect, key) {
            if (blocked) return;
            setBusy(true);
            setStatus("loading");
            setError("");
            try {
              const res = await callEndpoint("/api/run", { prompt: p });
              const entry =
                res.status === 200
                  ? { title: title, prompt: p, expect: expect, status: 200, data: res.data }
                  : {
                      title: title,
                      prompt: p,
                      expect: expect,
                      status: res.status,
                      error: (res.data && res.data.error) || ("HTTP " + res.status),
                      data: null,
                    };
              // 追加而不是覆盖：单 tool 与并行要放在一起对比才看得出差别
              setCases(function (prev) {
                return [{ key: key, ...entry }].concat(prev);
              });
              setStatus(res.status === 200 ? "ok" : "error");
            } catch (e) {
              // fetch 本身 reject：网络断了 / 服务没起
              setError("请求发不出去：" + e.message);
              setStatus("error");
            } finally {
              // 无论成败都要解锁按钮，否则页面永远卡在 disabled
              setBusy(false);
            }
          };

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">① / ② 单 tool 与并行</h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                {/* §5.3.11 说明区：先讲清这一页在演示什么，再让人动手 */}
                <PageIntro
                  summary="同一个接口下，模型一轮里发 1 个还是多个 tool_call —— 以及「并行」到底并行在哪一步。"
                  steps={INTRO_STEPS}
                />

                {/* §5.3.10 功能区：导航 + 输入 + 预设按钮，每个控件下面都有一句「点了会怎样」 */}
                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  {!env.hasKey && (
                    <p className="text-xs text-red-600">
                      未检测到 Key，按钮已禁用。先在 apps/.env 配置 LLM_PROVIDER 对应的 Key。
                    </p>
                  )}

                  <div className="space-y-1">
                    <div className="flex gap-2 items-start">
                      <textarea
                        className="flex-1 border rounded p-2 text-sm"
                        rows={2}
                        placeholder="换个 prompt 试试模型会不会并行，例如「上海天气 + 3 加 5」"
                        value={prompt}
                        onChange={function (e) {
                          setPrompt(e.target.value);
                        }}
                      />
                      <button
                        className="bg-blue-600 text-white px-3 py-2 rounded text-sm disabled:opacity-50"
                        disabled={blocked || !prompt.trim()}
                        onClick={function () {
                          runOne("自定义 prompt", prompt.trim(), "(自由 prompt：看模型自己怎么拆)", "free-" + Date.now());
                        }}
                      >
                        跑自定义
                      </button>
                    </div>
                    <p className="text-xs text-gray-500">
                      点「跑自定义」→ 发 POST /api/run，最多 4 轮；观察 Round 1 里 tool_call 的个数。
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                    {PRESETS.map(function (p) {
                      return (
                        <div key={p.key} className="space-y-1">
                          <button
                            className="w-full border border-gray-300 hover:border-blue-500 rounded p-2 text-left text-sm disabled:opacity-50"
                            disabled={blocked}
                            onClick={function () {
                              runOne(p.title, p.prompt, p.expect, p.key);
                            }}
                          >
                            <div className="font-semibold">{p.title}</div>
                            <div className="text-xs text-gray-500">prompt: {p.prompt}</div>
                          </button>
                          <p className="text-xs text-gray-500">{p.hint}</p>
                        </div>
                      );
                    })}
                  </div>
                </section>

                {/* 页面级错误：连不上服务 / 拉不到 /health，与单次运行失败区分开 */}
                {(error || envError) && (
                  <div className="bg-red-50 border border-red-300 rounded p-3 text-sm text-red-700">
                    {error || envError}
                  </div>
                )}

                {/* §5.3.10 输出区：空态也要有文案，不能白板一片 */}
                <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
                  <div className="text-sm text-gray-500">
                    {cases.length === 0
                      ? "还没有结果。跑上面任一用例；下方按轮次展开：模型指令（tool_calls）→ 执行结果（tool_result）→ 终态回答。"
                      : "共 " + cases.length + " 条（最新在顶）"}
                  </div>
                  {cases.map(function (c) {
                    return <CaseResult key={c.key} entry={c} />;
                  })}
                </section>
              </main>

              <EnvFooter env={env} protocol="A" />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
