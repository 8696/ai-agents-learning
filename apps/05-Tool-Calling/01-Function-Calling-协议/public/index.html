<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Function Calling 协议 · Demo</title>

  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入（禁止换 CDN / 版本 / integrity） -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <!-- §5.3.4 强制：React 18.3.1 UMD CDN -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- §5.3.4 强制：Babel Standalone 锁定 7.26.4 -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── §5.3.4 状态 pill 四态 ──
    const STATUS_MAP = {
      idle:    { emoji: "⏸", text: "待连接", cls: "bg-gray-200" },
      loading: { emoji: "🔄", text: "请求中", cls: "bg-blue-100" },
      ok:      { emoji: "✅", text: "完成",   cls: "bg-green-100" },
      error:   { emoji: "❌", text: "错误",   cls: "bg-red-100" },
    };

    function StatusPill({ status }) {
      const s = STATUS_MAP[status] || STATUS_MAP.idle;
      return (
        <span id="status-pill" className={`text-xs px-2 py-1 rounded ${s.cls}`}>
          {s.emoji} {s.text}
        </span>
      );
    }

    // ── 5 个预设用例（单/并行/串行/Zod 错误/工具错误）──
    // 演示「同一组 Tool，5 种 prompt 走向会触发什么」
    const PRESETS = [
      {
        key: "case1",
        title: "① 单 tool 调用",
        prompt: "北京今天天气怎么样？",
        expect: "期望：1 个 tool_call(get_weather) → Round 2 直接给 stop",
        endpoint: "/api/run",
      },
      {
        key: "case2",
        title: "② 并行 tool 调用（Promise.all）",
        prompt: "北京今天天气怎么样？另外 100 加 200 等于多少？",
        expect: "期望：2 个 tool_call 一次返回，并行执行（get_weather + add）",
        endpoint: "/api/run",
      },
      {
        key: "case3",
        title: "③ 串行数据依赖（多轮）",
        prompt: "查 u001 的用户，把他的 level 加 7，结果告诉我",
        expect: "期望：Round 1 lookup_user → Round 2 add(level, 7) → Round 3 stop",
        endpoint: "/api/run-serial",
      },
      {
        key: "case4",
        title: "④ Zod 校验失败 + repair（独立按钮）",
        prompt: "算 5 加 3",
        expect: "期望：服务端篡改 arguments → Zod ✗ → 错误回灌 → 模型修对 → Zod ✓",
        endpoint: "/api/simulate-zod-error",
      },
      {
        key: "case5",
        title: "⑤ 工具执行失败（独立按钮）",
        prompt: "查 u999 的用户信息",
        expect: "期望：handler 抛错 → 错误信息进 tool_result → 模型收到错误并自然回复",
        endpoint: "/api/run",
      },
    ];

    // ── 跑单个端点（不抛错，便于 React state 接管） ──
    async function callEndpoint(url, body) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      const text = await res.text();
      let data = null;
      try {
        data = text ? JSON.parse(text) : null;
      } catch {
        data = { error: `响应不是合法 JSON：${text.slice(0, 200)}` };
      }
      return { status: res.status, data };
    }

    // ── 工具描述标记（绿色：✓ 合法；红色：✗）──
    function ResultTag({ ok, label }) {
      const cls = ok
        ? "bg-green-100 text-green-800"
        : "bg-red-100 text-red-800";
      return (
        <span className={`text-xs px-2 py-0.5 rounded ${cls}`}>{label}</span>
      );
    }

    // ── 单个 tool_call 卡片 ──
    function ToolCallCard({ tc }) {
      let parsedArgs = null;
      let argsOk = true;
      try {
        parsedArgs = JSON.parse(tc.function.arguments);
      } catch {
        argsOk = false;
      }
      return (
        <div className="border border-gray-300 rounded p-2 text-xs space-y-1 bg-white">
          <div className="flex items-center gap-2">
            <span className="font-mono font-semibold">{tc.function.name}</span>
            <span className="text-gray-500">id={tc.id}</span>
            {!argsOk && <ResultTag ok={false} label="JSON.parse ✗" />}
            {argsOk && <ResultTag ok={true} label="JSON.parse ✓" />}
          </div>
          <div className="text-gray-500">arguments：</div>
          <pre className="whitespace-pre-wrap bg-gray-50 p-1 rounded max-h-32 overflow-auto">
{parsedArgs ? JSON.stringify(parsedArgs, null, 2) : tc.function.arguments}
          </pre>
        </div>
      );
    }

    // ── 单个 tool_result 卡片 ──
    function ToolResultCard({ r }) {
      return (
        <div className={`border rounded p-2 text-xs space-y-1 ${
          r.executeOk ? "border-green-300 bg-green-50" : "border-red-300 bg-red-50"
        }`}>
          <div className="flex items-center gap-2 flex-wrap">
            <span className="font-mono font-semibold">{r.toolName}</span>
            <span className="text-gray-500">id={r.tool_call_id}</span>
            <ResultTag ok={r.parseOk} label={r.parseOk ? "Zod ✓" : "Zod ✗"} />
            {r.parseOk && (
              <ResultTag ok={r.executeOk} label={r.executeOk ? "执行 ✓" : "执行 ✗"} />
            )}
            <span className="text-gray-500">{r.durationMs}ms</span>
          </div>
          <div className="text-gray-500">content（喂回模型的 tool_result）：</div>
          <pre className="whitespace-pre-wrap bg-white p-1 rounded max-h-32 overflow-auto">
{r.content}
          </pre>
        </div>
      );
    }

    // ── 单个 round 卡片（Round 1 / 2 / 3 / ...）──
    function RoundCard({ round }) {
      const fr = round.finish_reason;
      const frBadge = {
          tool_calls: "bg-blue-100 text-blue-800",
          stop: "bg-green-100 text-green-800",
          length: "bg-yellow-100 text-yellow-800",
          content_filter: "bg-orange-100 text-orange-800",
        }[fr] || "bg-gray-100 text-gray-800";
      return (
        <div className="border border-gray-400 rounded p-3 bg-gray-50 space-y-2">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="font-semibold">Round {round.round}</span>
            <span className={`text-xs px-2 py-0.5 rounded ${frBadge}`}>
              finish_reason={fr}
            </span>
            {round.tampered && (
              <ResultTag ok={false} label="⚠ 服务端篡改 arguments" />
            )}
            {round.tool_calls.length > 0 && (
              <span className="text-xs text-gray-500">
                · {round.tool_calls.length} 个 tool_call
              </span>
            )}
            {round.toolResults.length > 0 && (
              <span className="text-xs text-gray-500">
                · {round.toolResults.length} 个 tool_result
              </span>
            )}
          </div>
          {round.content && (
            <div>
              <div className="text-xs text-gray-500 mb-1">model content：</div>
              <pre className="whitespace-pre-wrap bg-white p-2 rounded text-xs border max-h-32 overflow-auto">
{round.content}
              </pre>
            </div>
          )}
          {round.tool_calls.length > 0 && (
            <div>
              <div className="text-xs text-gray-500 mb-1">tool_calls（模型发出的指令）：</div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                {round.tool_calls.map((tc, i) => (
                  <ToolCallCard key={i} tc={tc} />
                ))}
              </div>
            </div>
          )}
          {round.toolResults.length > 0 && (
            <div>
              <div className="text-xs text-gray-500 mb-1">
                tool_result（执行结果 → 回灌模型）：
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                {round.toolResults.map((r, i) => (
                  <ToolResultCard key={i} r={r} />
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── 单个用例结果 ──
    function CaseResult({ entry }) {
      const d = entry.data;
      if (!d) {
        return (
          <div className="border border-red-300 bg-red-50 rounded p-3 text-sm">
            <div className="font-semibold text-red-700">{entry.title} · HTTP {entry.status}</div>
            <pre className="whitespace-pre-wrap text-xs text-red-600 mt-1">
{String(entry.error || "(无响应)")}
            </pre>
          </div>
        );
      }
      return (
        <div className="border border-gray-400 rounded p-3 bg-white space-y-3">
          <div className="flex items-center justify-between flex-wrap gap-2">
            <div>
              <div className="font-semibold">{entry.title}</div>
              <div className="text-xs text-gray-500">prompt: {entry.prompt}</div>
              <div className="text-xs italic text-gray-500">{entry.expect}</div>
            </div>
            <div className="text-xs text-gray-500">
              {d.totalRounds} 轮 · {d.elapsedMs}ms · mode={d.mode}
            </div>
          </div>
          {d.error && (
            <div className="text-xs text-red-600 bg-red-50 p-2 rounded">
              {d.error}{d.upstreamStatus ? ` · upstreamStatus=${d.upstreamStatus}` : ""}
            </div>
          )}
          <div className="space-y-2">
            {d.rounds && d.rounds.map((round, i) => (
              <RoundCard key={i} round={round} />
            ))}
          </div>
          {d.finalContent && (
            <div>
              <div className="text-xs text-gray-500 mb-1">🎯 final content（给用户看的终态）：</div>
              <pre className="whitespace-pre-wrap bg-green-50 p-3 rounded text-sm border border-green-300 max-h-48 overflow-auto">
{d.finalContent}
              </pre>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [status, setStatus] = useState("idle");
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState("");
      const [prompt, setPrompt] = useState("");
      const [cases, setCases] = useState([]);
      const [modelInfo, setModelInfo] = useState({ model: "(待连接)", provider: "(?)", hasKey: false });
      const [tools, setTools] = useState([]);

      // ── 启动时打 /health + /tools ──
      useEffect(() => {
        Promise.all([
          fetch("/health").then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))),
          fetch("/tools").then((r) => (r.ok ? r.json() : [])),
        ])
          .then(([h, t]) => {
            setModelInfo({
              model: h.model || "(未指定)",
              provider: h.provider || "(?)",
              hasKey: Boolean(h.hasKey),
            });
            setTools(t);
            setStatus("idle");
          })
          .catch((e) => {
            setError(e.message);
            setStatus("error");
          });
      }, []);

      const runPreset = async (preset) => {
        if (busy) return;
        setBusy(true);
        setStatus("loading");
        setError("");
        try {
          const res = await callEndpoint(preset.endpoint, { prompt: preset.prompt });
          const entry = res.status === 200
            ? { title: preset.title, prompt: preset.prompt, expect: preset.expect, status: 200, data: res.data }
            : { title: preset.title, prompt: preset.prompt, expect: preset.expect, status: res.status, error: res.data?.error ?? `HTTP ${res.status}`, data: null };
          setCases((prev) => [{ key: preset.key, ...entry }, ...prev]);
          setStatus(res.status === 200 ? "ok" : "error");
        } catch (e) {
          setError(e.message);
          setStatus("error");
        } finally {
          setBusy(false);
        }
      };

      const runFree = async () => {
        const p = prompt.trim();
        if (!p) return;
        if (busy) return;
        setBusy(true);
        setStatus("loading");
        setError("");
        try {
          const res = await callEndpoint("/api/run", { prompt: p });
          const entry = res.status === 200
            ? { title: `自定义：${p.slice(0, 18)}`, prompt: p, expect: "(自由 prompt)", status: 200, data: res.data }
            : { title: `自定义：${p.slice(0, 18)}`, prompt: p, expect: "(自由 prompt)", status: res.status, error: res.data?.error ?? `HTTP ${res.status}`, data: null };
          setCases((prev) => [{ key: "free-" + Date.now(), ...entry }, ...prev]);
          setStatus(res.status === 200 ? "ok" : "error");
        } catch (e) {
          setError(e.message);
          setStatus("error");
        } finally {
          setBusy(false);
        }
      };

      const runAll = async () => {
        if (busy) return;
        setBusy(true);
        setStatus("loading");
        setError("");
        try {
          const results = [];
          for (const preset of PRESETS) {
            const res = await callEndpoint(preset.endpoint, { prompt: preset.prompt });
            const entry = res.status === 200
              ? { title: preset.title, prompt: preset.prompt, expect: preset.expect, status: 200, data: res.data }
              : { title: preset.title, prompt: preset.prompt, expect: preset.expect, status: res.status, error: res.data?.error ?? `HTTP ${res.status}`, data: null };
            results.push({ key: preset.key, ...entry });
          }
          setCases((prev) => [...results, ...prev]);
          setStatus("ok");
        } catch (e) {
          setError(e.message);
          setStatus("error");
        } finally {
          setBusy(false);
        }
      };

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              05 · 01 · Function Calling 协议
            </h1>
            <StatusPill status={status} />
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            {/* ── §5.3.4 强制：controls + output ── */}
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="text-sm">
                模型：<span className="font-mono">{modelInfo.model}</span>
                {" · "} provider：<span className="font-mono">{modelInfo.provider}</span>
                {" · "} Key：{modelInfo.hasKey ? "✅" : "❌（需在 apps/.env 填对应 Key）"}
              </div>

              {/* Registry 展示 */}
              <div className="text-sm border-t pt-3">
                <div className="font-semibold mb-1">Tool Registry（共 {tools.length} 个）</div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                  {tools.map((t) => (
                    <div key={t.name} className="border border-gray-200 rounded p-2 text-xs space-y-1">
                      <div className="font-mono font-semibold">{t.name}</div>
                      <div className="text-gray-600">{t.description}</div>
                      <details>
                        <summary className="cursor-pointer text-gray-500">JSON Schema（Zod 派生）</summary>
                        <pre className="whitespace-pre-wrap bg-gray-50 p-1 rounded mt-1 max-h-32 overflow-auto">
{JSON.stringify(t.jsonSchema, null, 2)}
                        </pre>
                      </details>
                    </div>
                  ))}
                </div>
              </div>

              {/* 自由 prompt */}
              <div className="flex gap-2 items-start border-t pt-3">
                <textarea
                  className="flex-1 border rounded p-2 text-sm"
                  rows={2}
                  placeholder="输入任意 prompt，跑 /api/run（也可用下方 5 个预设）"
                  value={prompt}
                  onChange={(e) => setPrompt(e.target.value)}
                />
                <button
                  className="bg-blue-600 text-white px-3 py-2 rounded text-sm disabled:opacity-50"
                  disabled={busy || !prompt.trim()}
                  onClick={runFree}
                >
                  跑自定义
                </button>
                <button
                  className="bg-gray-800 text-white px-3 py-2 rounded text-sm disabled:opacity-50"
                  disabled={busy}
                  onClick={runAll}
                >
                  一键跑 5 用例
                </button>
              </div>

              {/* 预设 */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                {PRESETS.map((p) => (
                  <button
                    key={p.key}
                    className="border border-gray-300 hover:border-blue-500 rounded p-2 text-left text-sm disabled:opacity-50"
                    disabled={busy}
                    onClick={() => runPreset(p)}
                  >
                    <div className="font-semibold">{p.title}</div>
                    <div className="text-xs text-gray-500">prompt: {p.prompt}</div>
                    <div className="text-xs text-gray-400">endpoint: {p.endpoint}</div>
                  </button>
                ))}
              </div>
            </section>

            {error && (
              <div className="bg-red-50 border border-red-300 rounded p-3 text-sm text-red-700">
                {error}
              </div>
            )}

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              <div className="text-sm text-gray-500">
                {cases.length === 0
                  ? "尚无结果。运行上方任一用例，新结果追加在上方。"
                  : `共 ${cases.length} 个用例（最新在顶）`}
              </div>
              {cases.map((c) => (
                <CaseResult key={c.key} entry={c} />
              ))}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            端口 50501 · 协议 A · 模型随 LLM_PROVIDER · 详情见 docs/学习模块/05-Tool-Calling/01-Function-Calling-协议.md
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
