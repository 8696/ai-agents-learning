<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Function Calling 协议 · 总览</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <!-- §5.3.8 加载顺序：utils（无 JSX）→ components（JSX）→ 本页内联 -->
  <script src="/utils/api-client.js"></script>
  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/tools-panel.js"></script>

  <script type="text/babel">
    /**
     * 本页教学点：先认识「模型能调什么」——Registry 里 4 个 Tool 的 name / description / JSON Schema。
     * 本页不跑闭环，跑闭环在 /pages/*。
     */
    const { useState, useEffect } = React;

    // ── 四个场景各自的一句话教学点；与 components/layout.js 的导航一一对应 ──
    const SCENES = [
      {
        href: "/pages/run.html",
        title: "① / ② 单 tool 与并行",
        desc: "同一个 /api/run：问一件事 → 1 个 tool_call；问两件无关的事 → 一次返回 2 个，服务端 Promise.all。",
      },
      {
        href: "/pages/serial.html",
        title: "③ 串行数据依赖",
        desc: "/api/run-serial：第二轮的入参来自第一轮的结果，只能一轮一轮来，看得见「循环」而不是「并行」。",
      },
      {
        href: "/pages/zod-error.html",
        title: "④ Zod 校验 + repair",
        desc: "服务端故意把参数改错 → Zod 拦下 → 错误当 tool_result 回灌 → 模型自己改对再发一次。",
      },
      {
        href: "/pages/tool-error.html",
        title: "⑤ 工具执行失败",
        desc: "handler 抛异常时，错误变成 tool_result 而不是 500，模型据此说人话，循环不中断。",
      },
    ];

    const INTRO_STEPS = [
      "页面加载 → GET /health（环境）+ GET /tools（Registry 全貌）",
      "服务端把每个 Tool 的 Zod schema 转成 JSON Schema —— 这份 schema 就是等下发给模型的 tools 字段",
      "模型看到的只有 name / description / JSON Schema 三样，它靠这三样决定「要不要调、怎么填参数」",
      "所以 description 写得含糊 = 模型乱调；schema 不严 = 参数乱填（下一条小节会专门讲）",
    ];

    // waitDemoUI：等 components/*.js 被 Babel 转译并挂到 window.DemoUI 之后再渲染
    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo", "ToolsPanel"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo, ToolsPanel } = window.DemoUI;

        function App() {
          const { env, envError } = useEnvInfo(); // GET /health → 页脚 #env-info
          const [tools, setTools] = useState([]); // GET /tools → Registry 卡片
          const [error, setError] = useState("");
          const [status, setStatus] = useState("idle");

          // 本页的 happy path = Registry 拉取成功（本页不调模型，所以没有 busy 状态）
          useEffect(function () {
            setStatus("loading");
            fetch("/tools")
              .then(function (r) {
                if (!r.ok) throw new Error("GET /tools HTTP " + r.status);
                return r.json();
              })
              .then(function (list) {
                setTools(list);
                setStatus("ok");
              })
              .catch(function (e) {
                setError(e.message);
                setStatus("error");
              });
          }, []);

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">05 · 01 · Function Calling 协议</h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                <PageIntro
                  summary="模型「能调什么」是怎么被告知的：Registry → JSON Schema → 请求里的 tools 字段。"
                  steps={INTRO_STEPS}
                  extra={
                    <pre className="whitespace-pre-wrap bg-gray-50 p-2 rounded text-xs text-gray-700">
{`全局数据流（四个场景页共用这一圈）
  ① 浏览器 POST /api/run…    { prompt }
  ② 服务端把 Registry 转成 tools 字段，连同 messages 发给模型
  ③ 模型回 tool_calls（要调哪个工具、参数是什么）—— 它只是"请求"，还没执行
  ④ 服务端 JSON.parse → Zod 校验 → handler 执行（失败也写成 tool_result）
  ⑤ tool_result 追加进 messages 再发一次 → 模型给出 finish_reason=stop 的终态回答`}
                    </pre>
                  }
                />

                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  <p className="text-sm text-gray-600">
                    总览页不发起模型请求。选一个场景进去跑，每页只演示一个教学点。
                  </p>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                    {SCENES.map(function (s) {
                      return (
                        <a
                          key={s.href}
                          href={s.href}
                          className="border border-gray-300 hover:border-blue-500 rounded p-3 text-left"
                        >
                          <div className="font-semibold text-sm">{s.title}</div>
                          <div className="text-xs text-gray-500 mt-1">{s.desc}</div>
                        </a>
                      );
                    })}
                  </div>
                </section>

                {(error || envError) && (
                  <div className="bg-red-50 border border-red-300 rounded p-3 text-sm text-red-700">
                    {error || envError}
                  </div>
                )}

                <section id="output" className="bg-white shadow rounded p-4 space-y-3 min-h-[200px]">
                  <div className="text-sm text-gray-500">
                    {tools.length === 0
                      ? "正在读取 Registry…（若长时间空白，看页脚 Key 是否配置）"
                      : "下面就是模型这一轮「看得见的全部工具」，展开可见 Zod 派生出的 JSON Schema。"}
                  </div>
                  <ToolsPanel tools={tools} />
                </section>
              </main>

              <EnvFooter env={env} protocol="A" />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
