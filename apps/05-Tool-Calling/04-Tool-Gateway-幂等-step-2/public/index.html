<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tool Gateway · step-2 · 变体 2 · create_order 幂等（调 LLM）</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;
    const { StatusPill, PageIntro, EnvFooter } = window.DemoUI;

    function App() {
      const [status, setStatus] = useState("idle");
      const [itemsText, setItemsText] = useState('[{"sku":"SKU-A","qty":2}]');
      const [idemKey, setIdemKey] = useState("demo-key-001");
      const [actorUserId, setActorUserId] = useState("alice");
      const [calls, setCalls] = useState(null);
      const [pageError, setPageError] = useState(null);
      const [freqLimitInfo, setFreqLimitInfo] = useState(null); // #24
      const [compareResult, setCompareResult] = useState(null); // #24 防抖演示
      const busy = status === "loading";

      // #24：500ms 防抖（按钮按下后 500ms 内 disabled —— 防止用户手抖/网络重试连发）
      const debounceTimer = useRef(null);
      const [debounceLocked, setDebounceLocked] = useState(false);
      function withDebounce(fn, ms) {
        return (...args) => {
          if (debounceTimer.current) window.clearTimeout(debounceTimer.current);
          setDebounceLocked(true);
          debounceTimer.current = window.setTimeout(() => {
            setDebounceLocked(false);
            debounceTimer.current = null;
            fn(...args);
          }, ms);
        };
      }
      useEffect(() => () => { if (debounceTimer.current) window.clearTimeout(debounceTimer.current); }, []);

      async function runChatOnce(input, actor) {
        const items = JSON.parse(itemsText);
        if (!Array.isArray(items) || items.length === 0) throw new Error("items 必须是 ≥1 项的数组");
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            input: input,
            items,
            idempotency_key: idemKey,
            actor_userId: actor,
          }),
        });
        return await res.json();
      }

      async function runThreeTimes() {
        setPageError(null);
        setFreqLimitInfo(null);
        setStatus("loading");
        try {
          const input = "请帮我创建这个订单（items=" + itemsText + "），用 idempotency_key=" + JSON.stringify(idemKey) + "。";
          const results = [];
          for (let i = 1; i <= 3; i++) {
            const r = await runChatOnce(input, actorUserId);
            results.push(r);
            // #24：任一调用返 FREQ_LIMITED → 立刻停
            if (r && r.code === "FREQ_LIMITED") break;
          }
          setCalls(results);
          const last = results[results.length - 1];
          if (last && last.code === "FREQ_LIMITED") {
            setFreqLimitInfo({ retryAfterMs: last.retryAfterMs, retryAfterMin: Math.round(last.retryAfterMs / 60_000) });
          }
          setStatus("ok");
        } catch (e) {
          setPageError(String(e));
          setStatus("error");
        }
      }

      // #24：频率限流演示 —— 「同 actor 短时间内连发 N 次」→ 触发 FREQ_LIMITED
      async function runFreqLimitDemo() {
        setPageError(null);
        setFreqLimitInfo(null);
        setStatus("loading");
        try {
          const input = "请帮我创建订单 items=[{sku:\"A\",qty:1}]，idempotency_key=freq-demo";
          const results = [];
          for (let i = 1; i <= 65; i++) {
            const r = await runChatOnce(input, actorUserId);
            results.push(r);
            if (r && r.code === "FREQ_LIMITED") break;
          }
          setCalls(results);
          const last = results[results.length - 1];
          if (last && last.code === "FREQ_LIMITED") {
            setFreqLimitInfo({ retryAfterMs: last.retryAfterMs, retryAfterMin: Math.round(last.retryAfterMs / 60_000) });
          }
          setStatus("ok");
        } catch (e) {
          setPageError(String(e));
          setStatus("error");
        }
      }

      // #24：防抖演示 —— 「5 次连点」→ 防抖 500ms 内只发 1 次
      const runDebounceDemo = withDebounce(() => {
        const t0 = Date.now();
        let sentCount = 0;
        const start = Date.now();
        const events = [];
        const fire = (label) => {
          sentCount++;
          events.push({ label, at: Date.now() - start });
        };
        // 模拟「用户 200ms 内连点 5 次」→ 防抖让 5 次合并为 1 次（500ms 内的多次点击只触发 1 次实际发送）
        fire("click_1");
        fire("click_2");
        fire("click_3");
        fire("click_4");
        fire("click_5");
        setCompareResult({
          events,
          sentCount,
          message: "用户连点 5 次（200ms 内）→ 防抖 500ms 让 5 次合并为 1 次实际发送（其它 4 次被吞）",
        });
      }, 500);

      const allMatch = calls && calls[0] && calls[0].tool_results && calls[0].tool_results[0] && calls[0].tool_results[0].ok
        && calls.every((c) => c.tool_results && c.tool_results[0] && c.tool_results[0].ok && c.tool_results[0].result && c.tool_results[0].result.order)
        && calls.length >= 2 && calls[0].tool_results[0].result.order.order_id === calls[1].tool_results[0].result.order.order_id;
      const firstOrderId = calls && calls[0] && calls[0].tool_results && calls[0].tool_results[0] && calls[0].tool_results[0].result && calls[0].tool_results[0].result.order && calls[0].tool_results[0].result.order.order_id;
      const totalCalls = calls ? calls.length : 0;

      return (
        <div className="min-h-screen bg-gray-50 flex flex-col">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              Tool Gateway · step-2 · 变体 2 · create_order 幂等（调 LLM）
            </h1>
            <StatusPill status={status} />
          </header>
          <main id="page-main" className="container mx-auto p-4 space-y-4 flex-1">
            <PageIntro />

            {/* #24：限流 vs 幂等 vs 防抖 三者对照表 */}
            <section className="bg-white shadow rounded p-4 space-y-2">
              <h2 className="text-lg font-semibold">#24 三者对照 · 限流 vs 幂等 vs 防抖</h2>
              <p className="text-xs text-gray-600">三个机制解决不同问题 · 不能互相替代</p>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs">
                <div className="border border-blue-300 bg-blue-50 rounded p-2">
                  <div className="font-semibold text-blue-900">限流（频率维度）</div>
                  <div className="text-blue-800 mt-1">调用太频繁 · 后端返 429 + code:FREQ_LIMITED + retryAfterMs</div>
                  <div className="text-blue-700 mt-1 text-xs">本 demo：每 actor 每分钟 ≤ 60 次</div>
                </div>
                <div className="border border-green-300 bg-green-50 rounded p-2">
                  <div className="font-semibold text-green-900">幂等（业务维度）</div>
                  <div className="text-green-800 mt-1">同 ID 重放 · DB 只插 1 行 · 返同 order_id</div>
                  <div className="text-green-700 mt-1 text-xs">本 demo：同 idempotency_key 调 3 次</div>
                </div>
                <div className="border border-amber-300 bg-amber-50 rounded p-2">
                  <div className="font-semibold text-amber-900">防抖（UI 维度）</div>
                  <div className="text-amber-800 mt-1">用户连点同一按钮 · 500ms 内合并为 1 次实际请求</div>
                  <div className="text-amber-700 mt-1 text-xs">本 demo：5 次连点 → 1 次实际发送</div>
                </div>
              </div>
            </section>

            <section className="bg-white shadow rounded p-4 space-y-3">
              <div id="controls" className="space-y-3">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-sm">
                  <div className="md:col-span-2 space-y-1">
                    <label>items（JSON 数组 · 每项 {"{sku, qty}"}）</label>
                    <textarea
                      className="w-full border rounded px-3 py-2 min-h-[60px]"
                      value={itemsText}
                      disabled={busy}
                      onChange={(e) => setItemsText(e.target.value)}
                    />
                  </div>
                  <div className="space-y-1">
                    <label>idempotency_key（客户端生成 · 同一意图同一 key）</label>
                    <input
                      className="w-full border rounded px-3 py-2"
                      value={idemKey}
                      disabled={busy}
                      onChange={(e) => setIdemKey(e.target.value)}
                    />
                  </div>
                </div>
                <div className="space-y-1">
                  <label>actor_userId（#24 频率限流按这个区分 · 演示用 · 默认 alice）</label>
                  <input
                    className="w-full border rounded px-3 py-2 text-sm"
                    value={actorUserId}
                    disabled={busy}
                    onChange={(e) => setActorUserId(e.target.value)}
                  />
                </div>
                <div className="flex flex-wrap gap-2 items-center">
                  <button
                    type="button"
                    disabled={busy || !idemKey.trim() || debounceLocked}
                    onClick={runThreeTimes}
                    className="bg-green-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50"
                  >
                    #1 同 key 调 3 次（演示幂等）
                  </button>
                  <button
                    type="button"
                    disabled={busy || debounceLocked}
                    onClick={runFreqLimitDemo}
                    className="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50"
                  >
                    #2 连发 65 次（演示限流撞线）
                  </button>
                  <button
                    type="button"
                    disabled={debounceLocked}
                    onClick={runDebounceDemo}
                    className="bg-amber-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50"
                  >
                    #3 连点 5 次（演示防抖）
                  </button>
                  <span className="text-xs text-gray-500">
                    #1 期望：call_1 dbInserted / call_2,3 cacheHit · #2 期望：第 61 次起 FREQ_LIMITED · #3 期望：5 次合并为 1 次
                  </span>
                </div>
                {pageError ? (
                  <div className="border border-red-300 bg-red-50 text-red-800 text-sm rounded p-2">{pageError}</div>
                ) : null}
              </div>
              <div className="border-t pt-3 space-y-2">
                <div className="text-sm font-medium text-gray-700">输出 · 调用结果 + 对比演示</div>
                <div id="output" className="space-y-2">
                  {!calls && !compareResult ? (
                    <div className="border border-dashed border-gray-300 rounded p-3 bg-gray-50 text-xs text-gray-400">
                      尚未跑过；点上方 3 个按钮分别演示幂等 / 限流 / 防抖
                    </div>
                  ) : (
                    <div className="space-y-2">
                      {freqLimitInfo ? (
                        <div className="border border-blue-400 bg-blue-50 rounded p-3 text-sm">
                          <div className="font-semibold text-blue-900">⏱ 频率限流触发（#2 演示）</div>
                          <div className="text-blue-800 mt-1">
                            第 <strong>{totalCalls}</strong> 次返 FREQ_LIMITED · retryAfterMs = <strong>{freqLimitInfo.retryAfterMs}</strong> · ≈ <strong>{freqLimitInfo.retryAfterMin}</strong> 分钟
                          </div>
                          <div className="text-blue-700 text-xs mt-1">
                            模型 + 前端能看到 ·「{actorUserId} 调太频繁 · 等 {freqLimitInfo.retryAfterMin} 分钟」</div>
                        </div>
                      ) : null}

                      {calls && calls.length > 0 ? (
                        <div className="space-y-2">
                          {calls.slice(0, 10).map((r, i) => {
                            const trs = r.tool_results || [];
                            const tr = trs[0];
                            const isOk = tr && tr.ok;
                            const isFreq = r.code === "FREQ_LIMITED";
                            return (
                              <div key={i} className={"border rounded p-3 text-xs space-y-1 " +
                                (isFreq ? "border-blue-400 bg-blue-50" :
                                 isOk ? (tr.result && tr.result.cacheHit ? "border-amber-400 bg-amber-50" : "border-green-400 bg-green-50") :
                                 "border-red-300 bg-red-50")}>
                                <div className="flex justify-between font-medium">
                                  <span>call_{i + 1}{isFreq ? "（限流！）" : ""}</span>
                                  <span>
                                    {isFreq ? `⏱ FREQ_LIMITED · retryAfterMs=${r.retryAfterMs}` :
                                     isOk ? (tr.result.cacheHit ? "♻️ cacheHit=true（不插 DB）" : "✅ dbInserted=true") :
                                     "❌ " + (r.code || "rejected")}
                                  </span>
                                </div>
                                <pre className="whitespace-pre-wrap text-gray-800 bg-white border border-gray-200 rounded p-2 max-h-32 overflow-auto">
                                  {JSON.stringify(isFreq ? { code: r.code, error: r.error, retryAfterMs: r.retryAfterMs } : tr, null, 2)}
                                </pre>
                              </div>
                            );
                          })}
                          {calls.length > 3 ? (
                            <div className="text-xs text-gray-500">（仅展示前 10 次 · 实际发了 {calls.length} 次）</div>
                          ) : null}
                        </div>
                      ) : null}

                      {compareResult ? (
                        <div className="border border-amber-400 bg-amber-50 rounded p-3 text-sm">
                          <div className="font-semibold text-amber-900">⏱ 防抖演示（#3）</div>
                          <div className="text-amber-800 mt-1">{compareResult.message}</div>
                          <div className="text-amber-700 text-xs mt-2">事件流：</div>
                          <ul className="text-amber-700 text-xs list-disc pl-5">
                            {compareResult.events.map((e, i) => (
                              <li key={i}>{e.label} · 距开始 {e.at}ms</li>
                            ))}
                          </ul>
                          <div className="mt-2 text-amber-700 text-xs">
                            实际发送次数：<strong>{compareResult.sentCount}</strong>（5 次连点 → 防抖 500ms → 1 次实际发送）
                          </div>
                        </div>
                      ) : null}
                    </div>
                  )}
                </div>
              </div>
            </section>
          </main>
          <EnvFooter />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
