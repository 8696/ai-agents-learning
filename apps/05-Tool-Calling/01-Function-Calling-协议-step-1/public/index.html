<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Function Calling 协议 · step-1 sketch（多工具 + Registry + Gateway）</title>

  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入（禁止换 CDN / 版本 / integrity） -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <!-- §5.3.4 强制：React 18.3.1 UMD -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- §5.3.4 强制：Babel Standalone 7.26.4（8.x 默认 automatic runtime 与本规则"完全 ESM 禁用"冲突） -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    /**
     * 本页教学点：
     *   1. Function Calling 完整一圈（model → tool_call → execute → tool_result → model）
     *   2. 多 Tool + Registry（新增 Tool 不改核心代码）
     *   3. **Gateway**：模型"决定调" ≠ "允许执行"；dangerous 工具被拦下回灌错误
     *
     * step-1 是 sketch（§5.3.14）："模型决定"还是 mock；锁定后才接真 LLM。
     */
    const { useState, useEffect } = React;

    // ── #status-pill 四态（§5.3.4） ──
    function StatusPill({ status }) {
      const label = {
        idle: "⏸ 待连接",
        running: "🔄 请求中",
        ok: "✅ 完成",
        error: "❌ 错误",
      }[status] || "⏸ 待连接";
      const cls = {
        idle: "bg-gray-200",
        running: "bg-yellow-200",
        ok: "bg-green-200",
        error: "bg-red-200",
      }[status] || "bg-gray-200";
      return (
        <span id="status-pill" className={"text-xs px-2 py-1 rounded " + cls}>
          {label}
        </span>
      );
    }

    // ── 页脚：环境元信息（§5.3.9） ──
    function EnvFooter({ env }) {
      const port = env?.port || 50501;
      const provider = env?.provider || "(待连接)";
      const model = env?.model || "(待连接)";
      const key = env?.hasKey ? "✅" : "❌";
      const callsModel = env?.callsModel ? "调 LLM" : "本地 mock";
      return (
        <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
          <span id="env-info">
            端口 {port} · {callsModel} · provider {provider} · model {model} · Key {key}
          </span>
        </footer>
      );
    }

    // ── #page-intro：本页只演示什么 + 数据流步骤（§5.3.11） ──
    function PageIntro() {
      const steps = [
        "页面加载 → GET /health 填页脚；GET /api/tools 填 Tool Registry 面板",
        "用户在输入框打字 → 点 3 个按钮之一（单 / 多 / 试危险）",
        "浏览器 POST /api/chat-mock { input, mode } → 服务端按 mode mock 决定 → 调 Registry.executeTool",
        "Registry：gatewayCheck → Zod safeParse → handler；dangerous 工具被网关拦下回灌 tool_result { ok:false, error }",
        "#output 5 块卡片：用户输入 → model 决定 → execute（含 gateway 拦/放） → tool_result → model 终态",
      ];
      return (
        <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
          <p className="text-sm text-gray-700">
            本页只演示：Function Calling 协议完整一圈 + 多 Tool Registry + Gateway 校验（模型决定 ≠ 已执行）。
            step-1 sketch 不调 LLM；mock 数据 + mock Gateway。
          </p>
          <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
            {steps.map(function (s, i) { return <li key={i}>{s}</li>; })}
          </ol>
        </section>
      );
    }

    // ── Tool Registry 面板：让"模型能调什么"在页面上看得见 ──
    function ToolRegistryPanel({ tools }) {
      if (!tools || tools.length === 0) {
        return (
          <div className="text-xs text-gray-500">（Registry 还没加载）</div>
        );
      }
      return (
        <div className="space-y-2">
          {tools.map(function (t) {
            const dangerBadge = t.dangerous
              ? <span className="text-xs px-2 py-0.5 rounded bg-red-200 text-red-800">dangerous · gateway 拦</span>
              : <span className="text-xs px-2 py-0.5 rounded bg-green-200 text-green-800">safe</span>;
            return (
              <div key={t.name} className="border border-gray-200 rounded p-2 flex items-start justify-between gap-2">
                <div className="flex-1">
                  <div className="font-mono text-sm font-semibold">{t.name}</div>
                  <div className="text-xs text-gray-600">{t.description}</div>
                </div>
                {dangerBadge}
              </div>
            );
          })}
        </div>
      );
    }

    // ── 输出卡片：三种内容区分颜色语义（§5.3.10） ──
    //   kind: request | event | final | reject（gateway 拒绝用红边）
    function TraceCard({ title, badge, badgeClass, content, kind }) {
      const bg = {
        request: "bg-gray-50 text-gray-700",
        event: "bg-white border border-gray-300",
        final: "bg-green-50 border border-green-300",
        reject: "bg-red-50 border border-red-300",
      }[kind] || "bg-white";
      return (
        <div className={"rounded p-3 text-sm " + bg}>
          <div className="flex items-center justify-between mb-1">
            <span className="font-semibold text-xs">{title}</span>
            <span className={"text-xs px-2 py-0.5 rounded " + badgeClass}>{badge}</span>
          </div>
          <pre className="whitespace-pre-wrap text-xs max-h-48 overflow-auto">{content}</pre>
        </div>
      );
    }

    // 把单条 tool_result 渲染成对应颜色的卡片
    function ResultCard({ r, idx }) {
      if (r.ok) {
        return (
          <TraceCard
            title={"④-" + (idx + 1) + " · tool_result · " + r.tool + " ✅"}
            badge="tool_result"
            badgeClass="bg-yellow-200 text-yellow-800"
            content={JSON.stringify({ tool_call_id: r.tool_call_id, result: r.result }, null, 2)}
            kind="event"
          />
        );
      }
      return (
        <TraceCard
          title={"④-" + (idx + 1) + " · tool_result · " + r.tool + " ❌ Gateway 拒绝"}
          badge="rejected"
          badgeClass="bg-red-200 text-red-800"
          content={JSON.stringify({ tool_call_id: r.tool_call_id, error: r.error }, null, 2)}
          kind="reject"
        />
      );
    }

    function App() {
      const [env, setEnv] = useState(null);
      const [tools, setTools] = useState([]);
      const [input, setInput] = useState("北京今天多少度");
      const [status, setStatus] = useState("idle");
      const [round, setRound] = useState(null);
      const [error, setError] = useState(null);

      // 加载时拉 /health + /api/tools 填页脚 + Registry 面板
      useEffect(function () {
        fetch("/health").then(function (r) { return r.json(); }).then(setEnv).catch(function (e) { setError("GET /health 失败：" + String(e)); });
        fetch("/api/tools").then(function (r) { return r.json(); }).then(function (j) { setTools(j.tools || []); }).catch(function () { /* Registry 拉不到不致命 */ });
      }, []);

      function runDemo(mode) {
        setStatus("running");
        setError(null);
        setRound(null);
        fetch("/api/chat-mock", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ input: input, mode: mode }),
        })
          .then(function (r) {
            return r.json().then(function (j) { return { status: r.status, body: j }; });
          })
          .then(function (res) {
            if (res.status >= 400) {
              setError("HTTP " + res.status + " · " + (res.body.error || JSON.stringify(res.body)));
              setStatus("error");
              return;
            }
            setRound(res.body);
            setStatus("ok");
          })
          .catch(function (e) {
            setError(String(e));
            setStatus("error");
          });
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              05 · 01 · Function Calling 协议 · step-1 sketch（多工具 + Registry + Gateway）
            </h1>
            <StatusPill status={status} />
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro />

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <label className="block text-sm text-gray-700">
                用户输入（mock）：
                <input
                  type="text"
                  value={input}
                  onChange={function (e) { setInput(e.target.value); }}
                  className="mt-1 block w-full border border-gray-300 rounded px-2 py-1 text-sm"
                  placeholder="例如：北京今天多少度 / 北京天气 + AI 是什么"
                />
              </label>
              <div className="flex flex-wrap gap-2">
                <button
                  onClick={function () { runDemo("single"); }}
                  disabled={status === "running"}
                  className="bg-blue-600 text-white text-sm px-3 py-1 rounded disabled:opacity-50"
                >
                  演示单工具（get_weather）
                </button>
                <button
                  onClick={function () { runDemo("multi"); }}
                  disabled={status === "running"}
                  className="bg-blue-600 text-white text-sm px-3 py-1 rounded disabled:opacity-50"
                >
                  演示 Registry 多工具（并行 get_weather + search）
                </button>
                <button
                  onClick={function () { runDemo("danger"); }}
                  disabled={status === "running"}
                  className="bg-red-600 text-white text-sm px-3 py-1 rounded disabled:opacity-50"
                >
                  试危险工具 calc（gateway 必拦）
                </button>
              </div>
              <p className="text-xs text-gray-500">
                三个按钮分别对应 single / multi / danger mode；「试危险」按钮明知 calc 被标 dangerous，演示"模型决定 ≠ 已执行"。
              </p>
            </section>

            <section className="bg-white shadow rounded p-4 space-y-3">
              <div className="flex items-center justify-between">
                <h2 className="text-sm font-semibold">Tool Registry（当前 server 注册了哪些 Tool）</h2>
                <span className="text-xs text-gray-500">GET /api/tools</span>
              </div>
              <ToolRegistryPanel tools={tools} />
            </section>

            <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] space-y-4">
              {error && <p className="text-red-700 text-sm">{error}</p>}
              {!round && !error && (
                <p className="text-sm text-gray-500">
                  还没跑。点上方按钮跑一圈，会在这里看到完整 5 块（用户输入 → model 决定 → execute → tool_result(s) → model 终态）。
                </p>
              )}
              {round && (
                <>
                  <TraceCard
                    title={"① 用户输入 · mode=" + round.mode}
                    badge="request"
                    badgeClass="bg-gray-200 text-gray-700"
                    content={JSON.stringify({ input: round.user_input }, null, 2)}
                    kind="request"
                  />
                  <TraceCard
                    title={"② model 返回 tool_call(s) · " + round.model_tool_calls.length + " 个"}
                    badge="model decision"
                    badgeClass="bg-blue-200 text-blue-800"
                    content={JSON.stringify(round.model_tool_calls, null, 2)}
                    kind="event"
                  />
                  <TraceCard
                    title={"③ execute · 外部代码通过 Registry.executeTool() 统一执行（Promise.all 并发；每个都过 gatewayCheck + Zod）"}
                    badge="execute"
                    badgeClass="bg-purple-200 text-purple-800"
                    content={round.model_tool_calls.map(function (c, i) {
                      return "call_" + (i + 1) + ": " + c.name + "(" + JSON.stringify(c.arguments) + ")";
                    }).join("\n")}
                    kind="event"
                  />
                  {round.tool_results.map(function (r, i) {
                    return <ResultCard key={i} r={r} idx={i} />;
                  })}
                  <TraceCard
                    title="⑤ model 基于 tool_result(s) 生成的最终回复"
                    badge="final reply"
                    badgeClass={"bg-green-300 text-green-900"}
                    content={round.model_final_reply}
                    kind="final"
                  />
                </>
              )}
            </section>
          </main>

          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
