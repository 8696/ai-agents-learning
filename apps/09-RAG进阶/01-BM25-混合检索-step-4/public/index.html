<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BM25 / 混合检索 · 第四步</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="text/babel" src="components/tokenize-compare.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const EXAMPLES = [
      { id: "a", label: "例子 A（带货号）", q: "SKU-8821 保修几年？", expect: "sku-8821" },
      { id: "b", label: "例子 B（日常说法）", q: "杯子裂了怎么退？", expect: "shipping-damage" },
    ];

    function App() {
      const [env, setEnv] = useState({ port: 50090, provider: "—", model: "—", embeddingModel: "—", hasKey: false, callsModel: true });
      const [exampleId, setExampleId] = useState("a");
      const [question, setQuestion] = useState(EXAMPLES[0].q);
      const [expect, setExpect] = useState(EXAMPLES[0].expect);
      const [status, setStatus] = useState("⏸ 待跑");

      useEffect(() => {
        fetch("/health").then((r) => r.json()).then((d) => {
          setEnv({
            port: d.port,
            provider: d.provider ?? "—",
            model: d.model ?? "—",
            embeddingModel: d.embeddingModel ?? "—",
            hasKey: Boolean(d.hasKey),
            callsModel: Boolean(d.callsModel),
          });
        }).catch(() => {});
      }, []);

      function pickExample(ex) {
        setExampleId(ex.id);
        setQuestion(ex.q);
        setExpect(ex.expect);
        setStatus("⏸ 待跑");
      }

      return (
        <div className="min-h-screen bg-gray-50">
          <header id="page-header" className="border-b p-4 bg-white flex justify-between items-center">
            <h1 id="page-title" className="text-lg font-semibold">
              BM25 / 混合检索 · 第四步（step-4）· 切词对照
            </h1>
            <span id="status-pill" className="text-xs px-2 py-1 rounded bg-gray-200">{status}</span>
          </header>

          <main id="page-main" className="max-w-5xl mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                BM25 看见的是<strong>切出来的词</strong>。货号若被撕成单字，稀有词就没了，排名会变差。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>选例子（或改问题）</li>
                <li>点「跑切词对照」：同一问题两种切法并排</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 text-xs space-y-1">
                <div className="font-semibold text-yellow-900">本页核心</div>
                <div>切词错了，BM25 等于没开。先看切出的词，再看排名。</div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="flex flex-wrap gap-2">
                {EXAMPLES.map((ex) => (
                  <button
                    key={ex.id}
                    className={"text-xs px-2 py-1 rounded border " + (exampleId === ex.id ? "bg-blue-600 text-white border-blue-600" : "bg-white")}
                    onClick={() => pickExample(ex)}
                  >
                    {ex.label}
                  </button>
                ))}
              </div>
              <input
                className="w-full border rounded px-2 py-1 text-sm"
                value={question}
                onChange={(e) => setQuestion(e.target.value)}
              />
              <div className="text-xs text-gray-500">下面组件自带「跑切词对照」按钮；跑完后状态会变 ✅。</div>
            </section>

            <section id="output">
              <DemoUI.TokenizeCompare
                title="保留连字符 vs 撕成单字"
                question={question}
                expectedCardId={expect}
              />
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 {env.port} · {env.provider} · {env.model} · 嵌入 {env.embeddingModel} · 密钥 {env.hasKey ? "✅" : "❌"} · 调模型 {env.callsModel ? "✅" : "❌"}
            </span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
