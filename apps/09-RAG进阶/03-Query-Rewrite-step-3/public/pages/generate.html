<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生成侧 · 完整 RAG 链路 · 第三步</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="../utils/api.js"></script>
  <script type="text/babel" src="../components/layout.js"></script>
  <script type="text/babel" src="../components/corpus-panel.js"></script>
  <script type="text/babel" src="../components/request-card.js"></script>
  <script type="text/babel" src="../components/page-nav.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, PageHeader, EnvFooter, CorpusPanel, PageNav, RequestCard, FlowCard, ErrorCard } = window.DemoUI;
    const fetchJson = window.DemoUtils.fetchJson;

    function App() {
      const [query, setQuery] = useState("盒子没拆，都八天了，还能退吗？");
      const [retrievalMode, setRetrievalMode] = useState("rewritten");
      const [chunks, setChunks] = useState([]);
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");
      const [error, setError] = useState("");
      const [lastRequest, setLastRequest] = useState(null);
      const [flowSteps, setFlowSteps] = useState([]);
      const [result, setResult] = useState(null);

      useEffect(function () {
        let cancelled = false;
        (async function () {
          const health = await fetchJson("/health");
          if (cancelled) return;
          setEnv(health.json || {});
          const corpus = await fetchJson("/api/corpus");
          if (cancelled) return;
          if (corpus.json && corpus.json.ok) setChunks(corpus.json.chunks || []);
          setStatus("ok");
        })().catch(function (err) {
          if (cancelled) return;
          setStatus("error");
          setError("打开页面失败：" + (err && err.message ? err.message : String(err)));
        });
        return function () { cancelled = true; };
      }, []);

      async function run() {
        setError("");
        setStatus("loading");
        try {
          const body = { query: query, retrievalMode: retrievalMode };
          setLastRequest({ method: "POST", url: "/api/generate", body: body });
          setFlowSteps([
            "服务端按 retrievalMode 选检索（" + (retrievalMode === "rewritten" ? "改写后" : "原句") + "检索）",
            "拼 prompt：user 字段 = 原句（展示给用户），retrieval 字段 = " + (retrievalMode === "rewritten" ? "改写句" : "原句") + "（内部探针），top-5 切块带 id + score",
            "调 LLM 答；模型用 [id=xxx] 引用切块",
            "返回完整 prompt + 模型答 + 检索名单",
          ]);
          const res = await fetchJson("/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!res.json || !res.json.ok) {
            setStatus("error");
            setError("跑生成失败（" + (res.httpStatus >= 500 ? "5xx" : "4xx") + "）HTTP " + res.httpStatus + "：" + ((res.json && res.json.error) || "未知错误"));
            return;
          }
          setResult(res.json);
          setStatus("ok");
        } catch (err) {
          setStatus("error");
          setError("请求被拒绝：" + (err && err.message ? err.message : String(err)));
        }
      }

      async function runEmpty() {
        setError("");
        setStatus("loading");
        try {
          const res = await fetchJson("/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: "" }),
          });
          setStatus("error");
          setError("空问句演示（4xx）HTTP " + res.httpStatus + "：" + ((res.json && res.json.error) || "未知错误"));
        } catch (err) {
          setStatus("error");
          setError("请求被拒绝：" + (err && err.message ? err.message : String(err)));
        }
      }

      const busy = status === "loading";
      const hasKey = env && env.hasKey;

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              生成侧 · 完整 RAG 链路 · 第三步
            </h1>
            <StatusPill status={status} />
          </header>
          <PageNav current="generate" base="../" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            {/* 1. 本页面解决什么 */}
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-3">
              <h2 className="text-base font-semibold text-gray-800">本页面解决什么</h2>
              <p className="text-sm text-gray-700">
                完整 RAG 链路演示：拿用户原句 → 检索 → 拼 prompt → 调模型 → 拿到带 <code>[id=xxx]</code> 引用的答。
              </p>

              <h3 className="text-sm font-medium text-gray-800 pt-2">在对比什么</h3>
              <ul className="text-sm text-gray-700 list-disc pl-5 space-y-1">
                <li><b>user 字段 = 用户原句</b>（展示给用户的那部分）</li>
                <li><b>retrieval 字段 = 改写后的检索词</b>（内部探针，不展示给用户）</li>
                <li><b>模型答里 <code>[id=xxx]</code></b> 引用检索到的具体切块，方便用户回溯</li>
              </ul>

              <h3 className="text-sm font-medium text-gray-800 pt-2">切块列表是什么</h3>
              <p className="text-sm text-gray-700">
                右侧常驻 8 个切块 = 拼 prompt 时喂给模型的来源。模型答里 <code>[id=xxx]</code> 引用对应这里的某个切块。
              </p>

              <h3 className="text-sm font-medium text-gray-800 pt-2">你跑了什么改写</h3>
              <p className="text-sm text-gray-700">
                用户原句先交给改写模型 → 模型返回 4~8 个库用语 → 这些词拿去检索 → 拼进 prompt 的 retrieval 段。
                retrievalMode = "改写检索" 时跑改写；retrievalMode = "原句检索" 时跳过改写，直接用原句检索（对照）。
              </p>
            </section>

            {/* 2. 输入 */}
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <h2 className="text-base font-semibold text-gray-800">输入</h2>
              <label className="block text-sm text-gray-700">
                用户原话（query）
                <textarea
                  className="mt-1 w-full border rounded p-2 text-sm"
                  rows={2}
                  value={query}
                  disabled={busy}
                  onChange={function (event) { setQuery(event.target.value); }}
                />
              </label>
              <div className="text-sm text-gray-700">
                retrievalMode（检索模式）
                <div className="mt-1 flex gap-2 text-sm">
                  <label className="border border-gray-300 rounded px-3 py-2 cursor-pointer hover:bg-gray-50">
                    <input
                      type="radio"
                      name="retrievalMode"
                      value="original"
                      checked={retrievalMode === "original"}
                      onChange={function () { setRetrievalMode("original"); }}
                    /> {" "}原句检索（跳过改写）
                  </label>
                  <label className="border border-gray-300 rounded px-3 py-2 cursor-pointer hover:bg-gray-50">
                    <input
                      type="radio"
                      name="retrievalMode"
                      value="rewritten"
                      checked={retrievalMode === "rewritten"}
                      onChange={function () { setRetrievalMode("rewritten"); }}
                    /> {" "}改写检索（推荐）
                  </label>
                </div>
              </div>
              <div className="flex flex-wrap gap-2">
                <button
                  className="bg-blue-600 text-white text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy || !hasKey}
                  onClick={run}
                >
                  跑生成
                </button>
                <button
                  className="border border-gray-300 text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={runEmpty}
                >
                  演示空问句 4xx
                </button>
              </div>
              <p className="text-xs text-gray-600">缺密钥时按钮禁用。空问句走 4xx。</p>
              <ErrorCard error={error} />
              <RequestCard request={lastRequest} />
              <FlowCard steps={flowSteps} />
            </section>

            {/* 3. 切块列表（常驻对照基准） */}
            <section id="corpus-section" className="bg-white shadow rounded p-4 space-y-3">
              <h2 className="text-base font-semibold text-gray-800">切块列表（8 个）—— 检索的来源 + 模型答引用 [id=xxx] 的对照基准</h2>
              <p className="text-sm text-gray-700">
                模型答里出现的 <code>[id=xxx]</code> 都在这里挑 —— 点 id 跳到对应切块卡片（demo 不做点击跳转，按 id 在列表里查）。
              </p>
              <CorpusPanel chunks={chunks} />
            </section>

            {/* 4. 结果：5 阶段流水线 */}
            <section id="output" className="bg-white shadow rounded p-4 space-y-4">
              <h2 className="text-base font-semibold text-gray-800">结果：5 阶段流水线（按顺序读）</h2>
              <p className="text-sm text-gray-700">
                点击「跑生成」后服务端按 5 步走完一整条 RAG 链路；下面按顺序展示每一步的「输入 / 输出」。
              </p>

              {/* 阶段 1：调改写模型 */}
              <div id="stage-1" className="border-l-4 border-yellow-400 border border-gray-200 rounded p-3 space-y-2 bg-yellow-50/30">
                <h3 className="text-sm font-medium text-gray-800">阶段 1 · 调改写模型</h3>
                <p className="text-xs text-gray-600">这一步：用户原句 → 改写模型 → 输出「改写后检索词」（<b>仅 retrievalMode = 改写检索</b> 时执行；原句检索跳过这一步）。</p>
                {result && result.retrievalMode === "rewritten" && result.rewriterCall ? (
                  <div className="space-y-2">
                    <div>
                      <div className="text-xs font-medium text-gray-700">输入：发给改写模型的 prompt</div>
                      <div className="text-xs text-gray-500 mt-0.5">
                        model = {result.rewriterCall.request.model} · temperature = {result.rewriterCall.request.temperature}
                      </div>
                      {result.rewriterCall.request.messages.map(function (msg, i) {
                        return (
                          <div key={i} className="mt-1">
                            <div className="text-xs text-gray-600">· {msg.role}</div>
                            <pre className="whitespace-pre-wrap text-xs text-gray-800 bg-white rounded p-2 mt-0.5 max-h-40 overflow-auto">{msg.content}</pre>
                          </div>
                        );
                      })}
                    </div>
                    <div>
                      <div className="text-xs font-medium text-gray-700">输出：改写模型返回的字符串</div>
                      <pre className="whitespace-pre-wrap text-xs text-gray-800 bg-white rounded p-2 mt-1 max-h-32 overflow-auto">{JSON.stringify(result.rewriterCall.response)}</pre>
                    </div>
                  </div>
                ) : (
                  <p className="text-xs text-gray-500">本查询走原句检索，跳过改写模型这一步。</p>
                )}
              </div>

              {/* 阶段 2：检索切块 */}
              <div id="stage-2" className="border-l-4 border-blue-400 border border-gray-200 rounded p-3 space-y-2">
                <h3 className="text-sm font-medium text-gray-800">阶段 2 · 检索切块</h3>
                <p className="text-xs text-gray-600">这一步：拿「改写后检索词」（或原句）做<b>词重叠检索</b>，对 8 个切块逐个打分（命中的词数），取 score 降序的前 5 名。</p>
                {result ? (
                  <div className="space-y-2">
                    <div>
                      <div className="text-xs font-medium text-gray-700">输入：检索词</div>
                      <pre className="whitespace-pre-wrap text-xs text-gray-800 bg-white rounded p-2 mt-1 font-mono">{result.retrievalQueryUsed}</pre>
                    </div>
                    <div>
                      <div className="text-xs font-medium text-gray-700">输出：top-{result.retrieve.ranked.length} 命中（按 score 降序）</div>
                      <div className="space-y-1 mt-1">
                        {result.retrieve.ranked.map(function (row) {
                          return (
                            <div key={row.id} className={"border rounded p-2 text-xs " + (row.isTarget ? "border-yellow-400 bg-yellow-50" : "border-gray-200 bg-white")}>
                              <div className="flex items-center justify-between">
                                <span className="font-mono">第 {row.rank} 名 · id={row.id} · {row.title}</span>
                                <span className="text-gray-500">score={row.score} {row.isTarget ? "· 目标切块" : ""}</span>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="text-sm text-gray-500">还没跑。</div>
                )}
              </div>

              {/* 阶段 3：拼 prompt */}
              <div id="stage-3" className="border-l-4 border-purple-400 border border-gray-200 rounded p-3 space-y-2">
                <h3 className="text-sm font-medium text-gray-800">阶段 3 · 拼 prompt</h3>
                <p className="text-xs text-gray-600">这一步：把「原话 + 改写后 + top-5 切块」按三段拼成大模型能吃的 input。<b>user 段第 1 块 = 原句（展示给用户）</b>、<b>第 2 块 = 改写后（不展示）</b>、<b>第 3 块 = top-5 切块带 id</b>。</p>
                {result && result.prompt ? (
                  <div className="space-y-3">
                    <div>
                      <div className="text-xs font-medium text-gray-700">system 段（角色设定）</div>
                      <pre className="whitespace-pre-wrap text-xs text-gray-800 bg-white rounded p-2 mt-1 max-h-40 overflow-auto">{result.prompt.system}</pre>
                    </div>
                    <div>
                      <div className="text-xs font-medium text-gray-700">user 段（第 1 块 = 原句 · 展示给用户）</div>
                      <pre className="whitespace-pre-wrap text-xs text-gray-800 bg-white rounded p-2 mt-1 max-h-24 overflow-auto">{result.prompt.user.split("内部检索词")[0]}</pre>
                    </div>
                    <div>
                      <div className="text-xs font-medium text-gray-700">user 段（第 2 块 = 内部检索词 · 不展示）</div>
                      <pre className="whitespace-pre-wrap text-xs text-gray-800 bg-white rounded p-2 mt-1 max-h-24 overflow-auto">{result.prompt.user.match(/内部检索词[\s\S]*?检索到的切块/)?.[0] || "(未匹配到)"}</pre>
                    </div>
                    <div>
                      <div className="text-xs font-medium text-gray-700">user 段（第 3 块 = top-5 切块）</div>
                      <pre className="whitespace-pre-wrap text-xs text-gray-800 bg-white rounded p-2 mt-1 max-h-64 overflow-auto">{result.prompt.user.match(/检索到的切块[\s\S]*/)?.[0] || "(未匹配到)"}</pre>
                    </div>
                  </div>
                ) : (
                  <div className="text-sm text-gray-500">还没跑。</div>
                )}
              </div>

              {/* 阶段 4：调生成模型 */}
              <div id="stage-4" className="border-l-4 border-green-400 border border-gray-200 rounded p-3 space-y-2">
                <h3 className="text-sm font-medium text-gray-800">阶段 4 · 调生成模型</h3>
                <p className="text-xs text-gray-600">这一步：把阶段 3 拼出的 prompt 发给生成模型，模型按 system 设定答问题，答末尾用 <code>[id=xxx]</code> 引用切块。</p>
                {result && result.generatorCall ? (
                  <div className="space-y-2">
                    <div>
                      <div className="text-xs font-medium text-gray-700">输入：发给生成模型的完整 prompt</div>
                      <div className="text-xs text-gray-500 mt-0.5">
                        model = {result.generatorCall.request.model} · temperature = {result.generatorCall.request.temperature}
                      </div>
                      {result.generatorCall.request.messages.map(function (msg, i) {
                        return (
                          <div key={i} className="mt-1">
                            <div className="text-xs text-gray-600">· {msg.role}</div>
                            <pre className="whitespace-pre-wrap text-xs text-gray-800 bg-white rounded p-2 mt-0.5 max-h-40 overflow-auto">{msg.content}</pre>
                          </div>
                        );
                      })}
                    </div>
                    <div>
                      <div className="text-xs font-medium text-gray-700">输出：生成模型返回的字符串</div>
                      <pre className="whitespace-pre-wrap text-xs text-gray-800 bg-white rounded p-2 mt-1 max-h-48 overflow-auto">{result.generatorCall.response.answer}</pre>
                    </div>
                  </div>
                ) : (
                  <div className="text-sm text-gray-500">还没跑。</div>
                )}
              </div>

              {/* 阶段 5：返回给用户 */}
              <div id="stage-5" className="border-l-4 border-blue-600 border border-gray-200 rounded p-3 space-y-2 bg-blue-50">
                <h3 className="text-sm font-medium text-blue-900">阶段 5 · 返回给用户</h3>
                <p className="text-xs text-blue-800">
                  这就是用户在客服窗口看到的最终内容：<b>原句 + 模型答</b>。答末尾的 <code>[id=xxx]</code> 引用对应「② 切块列表」里的某个切块 —— 用户拿 id 在切块列表里查，就能验证答的依据。
                </p>
                {result ? (
                  <div className="space-y-1">
                    <div className="text-sm">原句：<span className="font-mono bg-white px-2 py-0.5 rounded">{result.query}</span></div>
                    <div className="text-sm">模型答：<pre className="whitespace-pre-wrap text-sm text-gray-800 bg-white rounded p-3 mt-1 max-h-96 overflow-auto">{result.answer}</pre></div>
                  </div>
                ) : (
                  <div className="text-sm text-gray-500">还没跑。</div>
                )}
              </div>
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
