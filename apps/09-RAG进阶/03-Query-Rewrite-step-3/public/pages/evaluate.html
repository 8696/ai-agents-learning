<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>评测集 · 命中率对照 · 第三步</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="../utils/api.js"></script>
  <script type="text/babel" src="../components/layout.js"></script>
  <script type="text/babel" src="../components/corpus-panel.js"></script>
  <script type="text/babel" src="../components/eval-set-panel.js"></script>
  <script type="text/babel" src="../components/evaluate-result.js"></script>
  <script type="text/babel" src="../components/request-card.js"></script>
  <script type="text/babel" src="../components/page-nav.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, PageHeader, EnvFooter, CorpusPanel, EvalSetPanel, PageNav, EvalResultCard, RequestCard, FlowCard, ErrorCard } = window.DemoUI;
    const fetchJson = window.DemoUtils.fetchJson;

    function App() {
      const [chunks, setChunks] = useState([]);
      const [evalSet, setEvalSet] = useState(null);
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");
      const [error, setError] = useState("");
      const [lastRequest, setLastRequest] = useState(null);
      const [flowSteps, setFlowSteps] = useState([]);
      const [evalResult, setEvalResult] = useState(null);

      useEffect(function () {
        let cancelled = false;
        (async function () {
          const health = await fetchJson("/health");
          if (cancelled) return;
          setEnv(health.json || {});
          const corpus = await fetchJson("/api/corpus");
          if (cancelled) return;
          if (corpus.json && corpus.json.ok) setChunks(corpus.json.chunks || []);
          const evalSetResp = await fetchJson("/api/eval-set");
          if (cancelled) return;
          if (evalSetResp.json && evalSetResp.json.ok) setEvalSet(evalSetResp.json);
          setStatus("ok");
        })().catch(function (err) {
          if (cancelled) return;
          setStatus("error");
          setError("打开页面失败：" + (err && err.message ? err.message : String(err)));
        });
        return function () { cancelled = true; };
      }, []);

      async function runEvaluate() {
        setError("");
        setStatus("loading");
        try {
          const body = { modes: ["original", "rewritten"] };
          setLastRequest({ method: "POST", url: "/api/evaluate", body: body });
          setFlowSteps([
            "服务端对 EVAL_SET 的 30 题按两种 mode 各跑一遍：原句检索 / 改写检索",
            "每题取 top-5 命中的 chunk id，对照 targetIds 判命中",
            "返回命中率对照 + 每题 top-5 命中详情",
          ]);
          const res = await fetchJson("/api/evaluate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!res.json || !res.json.ok) {
            setStatus("error");
            setError("跑评测失败（" + (res.httpStatus >= 500 ? "5xx" : "4xx") + "）HTTP " + res.httpStatus + "：" + ((res.json && res.json.error) || "未知错误"));
            return;
          }
          setEvalResult(res.json);
          setStatus("ok");
        } catch (err) {
          setStatus("error");
          setError("请求被拒绝：" + (err && err.message ? err.message : String(err)));
        }
      }

      const busy = status === "loading";

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              评测集 · 命中率对照 · 第三步
            </h1>
            <StatusPill status={status} />
          </header>
          <PageNav current="evaluate" base="../" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            {/* 1. 本页面解决什么 */}
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-3">
              <h2 className="text-base font-semibold text-gray-800">本页面解决什么</h2>
              <p className="text-sm text-gray-700">
                批量验证「改写到底有没有用」—— 用 30 道人工标注的题，分别按「原句检索」和「改写检索」跑一遍，对照命中率。
              </p>

              <h3 className="text-sm font-medium text-gray-800 pt-2">在对比什么</h3>
              <ul className="text-sm text-gray-700 list-disc pl-5 space-y-1">
                <li><b>原句检索</b>：拿用户原句直接做词重叠检索（基线 = 不改写）</li>
                <li><b>改写检索</b>：原句先交给改写模型 → 改写成库用语 → 用改写后检索（对照 = 开改写）</li>
              </ul>

              <h3 className="text-sm font-medium text-gray-800 pt-2">切块列表是什么</h3>
              <p className="text-sm text-gray-700">
                右侧常驻 8 个切块 = 知识库的内容。30 道评测题的「期望命中」都从这 8 个切块的 id 中选（参见下方「切块列表」）。
              </p>

              <h3 className="text-sm font-medium text-gray-800 pt-2">你跑了什么改写</h3>
              <p className="text-sm text-gray-700">
                每道题的原句先送给改写模型，模型返回 4~8 个库用语（如「未拆封 超过七日 特例审核」），用这些词去检索。
                改写模型本身在服务端（<code>POST /api/hyde-and-search</code> 看到的是同一个改写模型；区别是改写检索用改写后的词做词重叠）。
              </p>

              <h3 className="text-sm font-medium text-gray-800 pt-2">判定规则</h3>
              <ul className="text-sm text-gray-700 list-disc pl-5 space-y-1">
                <li>top-5（含切块 id 列表）含「期望命中」任一 → 算命中</li>
                <li>targetIds 多个时，任一命中即算命中</li>
                <li>改写模型挂了（如返回空） → 回退原句检索 + 标 rewriterFailed</li>
              </ul>
            </section>

            {/* 2. 切块列表 */}
            <section id="corpus-section" className="bg-white shadow rounded p-4 space-y-3">
              <h2 className="text-base font-semibold text-gray-800">切块列表（8 个）—— 评测集和检索的对照基准</h2>
              <p className="text-sm text-gray-700">
                黄边那条 <code>id=unopened-exception</code> = 「未拆封超过七日的特例审核」，是大多数日常说法问句的期望命中。
              </p>
              <CorpusPanel chunks={chunks} />
            </section>

            {/* 3. 当前评测集 */}
            <section id="eval-set-section" className="bg-white shadow rounded p-4 space-y-3">
              <h2 className="text-base font-semibold text-gray-800">当前评测集（{evalSet ? evalSet.size : "—"} 题）</h2>
              <p className="text-sm text-gray-700">
                每题写了：用户原句 + 期望命中（从上面 8 个切块 id 中选 1~2 个）+ 分类。
                预览只展示前 10 题，全部列表在服务端（不泄答案）。
              </p>
              <EvalSetPanel set={evalSet} />
            </section>

            {/* 4. 控制区 */}
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <h2 className="text-base font-semibold text-gray-800">跑评测</h2>
              <div className="flex flex-wrap gap-2">
                <button
                  className="bg-blue-600 text-white text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={runEvaluate}
                >
                  跑评测（开改写 + 关改写 对照）
                </button>
              </div>
              <p className="text-xs text-gray-600">
                评测跑一次约 100~120 秒（30 题 × 2 mode；改写模式每题调一次模型）。
              </p>
              <ErrorCard error={error} />
              <RequestCard request={lastRequest} />
              <FlowCard steps={flowSteps} />
            </section>

            {/* 5. 结果 */}
            <section id="output" className="bg-white shadow rounded p-4 space-y-3">
              <h2 className="text-base font-semibold text-gray-800">结果：命中率对照 + 每题详情</h2>
              <p className="text-sm text-gray-700">
                跑了之后这里显示：① 命中率对照表（原句 vs 改写）② 每题详情（原句、改写后是什么、期望命中、top-5 命中、是否命中）。
              </p>
              <EvalResultCard result={evalResult} />
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
