<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>接口形状 vs 对话模型 · 第二步 · 重排序</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="../utils/api-client.js"></script>
  <script type="text/babel" src="../components/layout.js"></script>
  <script type="text/babel" src="../components/corpus-panel.js"></script>
  <script type="text/babel" src="../components/page-nav.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    // 本页教学点：同问句同名单，左栏走专用接口形状，右栏走对话模型 Listwise；
    // 对照请求形状、响应形状、调用次数。
    const { useState, useEffect } = React;
    const { StatusPill, EnvFooter, PageNav } = window.DemoUI;
    const { CorpusPanel } = window.DemoUI;
    const { fetchJson } = window.DemoUtils;

    function formatError(error) {
      const status = error.status ? error.status + " " : "";
      const hint = error.hint ? " · " + error.hint : "";
      return status + error.message + hint;
    }

    function ShapeRow(props) {
      const item = props.item;
      return (
        <article className="border border-gray-300 rounded p-3 bg-white space-y-1">
          <div className="flex items-baseline justify-between gap-3">
            <span className="text-sm font-semibold">第 {props.rank + 1} 名 · {item.id}</span>
            <span className="text-xs text-gray-500">score {item.score}</span>
          </div>
          <div className="text-xs text-gray-700">{props.title}</div>
        </article>
      );
    }

    function App() {
      const [env, setEnv] = useState(null);
      const [chunks, setChunks] = useState([]);
      const [corpusLoading, setCorpusLoading] = useState(true);
      const [corpusError, setCorpusError] = useState("");
      const [query, setQuery] = useState("超过 7 天了，盒子没拆，还能退吗？");
      const [status, setStatus] = useState("idle");
      const [error, setError] = useState("");
      const [request, setRequest] = useState(null);
      const [shapeResult, setShapeResult] = useState(null);
      const [llmResult, setLlmResult] = useState(null);

      useEffect(function () {
        fetchJson("/health")
          .then(function (body) { setEnv(body); setStatus("idle"); })
          .catch(function () { setEnv(null); });
        fetchJson("/api/corpus")
          .then(function (body) {
            setChunks(body.chunks || []);
            if (body.defaultQuery) setQuery(body.defaultQuery);
            setCorpusLoading(false);
          })
          .catch(function (err) {
            setCorpusError(formatError(err));
            setCorpusLoading(false);
          });
      }, []);

      function onQueryChange(next) {
        setQuery(next);
        setShapeResult(null);
        setLlmResult(null);
      }

      async function onRunShape() {
        setStatus("loading");
        setError("");
        const documents = chunks.map(function (chunk) {
          return { id: chunk.id, title: chunk.title, text: chunk.text };
        });
        const payload = { query: query, documents: documents };
        setRequest({ path: "POST /api/listwise-shape", body: payload });
        try {
          const body = await fetchJson("/api/listwise-shape", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          setShapeResult(body);
          setStatus("done");
        } catch (err) {
          setShapeResult(null);
          setError(formatError(err));
          setStatus("error");
        }
      }

      async function onRunLlm() {
        setStatus("loading");
        setError("");
        const ids = chunks.map(function (chunk) { return chunk.id; });
        const payload = { query: query, candidateIds: ids };
        setRequest({ path: "POST /api/listwise-llm", body: payload });
        try {
          const body = await fetchJson("/api/listwise-llm", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          setLlmResult(body);
          setStatus("done");
        } catch (err) {
          setLlmResult(null);
          setError(formatError(err));
          setStatus("error");
        }
      }

      const titleById = {};
      chunks.forEach(function (chunk) { titleById[chunk.id] = chunk.title; });

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              重排序（Rerank） · 第二步（step-2） · ② 接口形状 vs 对话模型
            </h1>
            <StatusPill status={status} />
          </header>

          <main id="page-main" className="max-w-7xl mx-auto p-4 space-y-4">
            <PageNav current="shape-vs-llm" base="../" />

            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示：<b>同问句同名单，左栏走「专用接口形状」、右栏走「对话模型 Listwise」</b>。
                两边都是第二阶段，但请求 / 响应形状、调用次数、字段意义都不同 —— 对照看差异。
              </p>
              <div className="border border-amber-300 bg-amber-50 rounded p-3 text-xs text-amber-900 space-y-1">
                <div className="font-semibold">⚠ 左栏是什么 / 不是什么</div>
                <div>
                  左栏「专用接口形状」是 <b>mock</b>：本仓库不接真 Cohere / Jina 密钥，
                  服务端 <code>lib/flow/listwise-shape.ts</code> 用一个简化的打分函数（数政策热词 + 约束词加权）
                  代替真交叉编码器。**请求 / 响应形状与业界协议完全一致** —— 真接 Cohere 时只要把 mock 换成真请求，业务代码不用改。
                </div>
                <div>
                  右栏「对话模型 Listwise」是真调：发一次对话补全，校验 <code>orderedIds</code> ⊆ 候选。
                </div>
              </div>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>改问句。</li>
                <li>点左栏按钮（专用接口形状 mock）：1 次请求，返回 <code>{`{results: [{id, score}]}`}</code>。</li>
                <li>点右栏按钮（对话模型 Listwise）：1 次请求，返回 <code>{`{orderedIds: [...]}`}</code>，并触发 id 校验。</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <p className="text-sm font-semibold text-gray-900">
                  两种实现都是第二阶段，**不是**两种检索。专用接口通常一次请求给回 <code>results</code>（带 score）；对话模型 Listwise 出 <code>orderedIds</code>，必须自己校验。
                </p>
              </div>
            </section>

            <CorpusPanel chunks={chunks} loading={corpusLoading} error={corpusError} />

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <label className="block space-y-1">
                <span className="text-sm text-gray-800">问句（query）</span>
                <textarea
                  className="w-full border border-gray-300 rounded p-2 text-sm"
                  rows={2}
                  value={query}
                  disabled={status === "loading"}
                  onChange={function (event) { onQueryChange(event.target.value); }}
                />
              </label>
              <div className="flex flex-wrap gap-2">
                <button
                  type="button"
                  className="bg-blue-600 text-white text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={status === "loading"}
                  onClick={onRunShape}
                >
                  走专用接口形状（mock · POST /api/listwise-shape）
                </button>
                <button
                  type="button"
                  className="bg-blue-600 text-white text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={status === "loading" || (env && env.hasKey === false)}
                  onClick={onRunLlm}
                >
                  走对话模型 Listwise（POST /api/listwise-llm）
                </button>
              </div>
              <p className="text-xs text-gray-500">
                两边只发 1 次网络请求；专用接口的 mock 不调模型，无密钥也能跑。
              </p>
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {request ? (
                <div className="bg-gray-50 text-gray-700 rounded p-3 text-xs space-y-1">
                  <div>请求参数</div>
                  <pre className="whitespace-pre-wrap max-h-32 overflow-auto">{JSON.stringify(request, null, 2)}</pre>
                </div>
              ) : null}

              {error ? (
                <div className="border border-red-300 bg-red-50 text-red-800 rounded p-3 text-sm">
                  {error}
                </div>
              ) : null}

              {!shapeResult && !llmResult && !error ? (
                <p className="text-sm text-gray-500">还没跑。先点上面其中一个按钮（两边可独立跑）。</p>
              ) : null}

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                <div className="space-y-3 min-w-0">
                  <h3 className="text-sm font-semibold">
                    左栏 · 专用接口形状
                    <span className="ml-2 text-xs font-normal text-amber-700 bg-amber-100 px-2 py-0.5 rounded">
                      mock · 形状同 Cohere / Jina
                    </span>
                  </h3>
                  {shapeResult ? (
                    <div className="space-y-3">
                      <div className="text-xs text-gray-500">
                        调用次数：1。响应形状：
                        <pre className="whitespace-pre-wrap bg-gray-50 border border-gray-200 rounded p-2 mt-1">{`{ results: [{ id, score }, ...] }`}</pre>
                      </div>
                      <div className="space-y-2">
                        {shapeResult.results.map(function (item, idx) {
                          return <ShapeRow key={item.id} item={item} title={titleById[item.id] || item.id} rank={idx} />;
                        })}
                      </div>
                    </div>
                  ) : (
                    <p className="text-sm text-gray-500">点「走专用接口形状」看结果。</p>
                  )}
                </div>

                <div className="space-y-3 min-w-0 md:border-l md:pl-6 border-gray-200">
                  <h3 className="text-sm font-semibold">右栏 · 对话模型 Listwise</h3>
                  {llmResult ? (
                    <div className="space-y-3">
                      <div className={
                        "border rounded p-2 text-xs " +
                        (llmResult.validation.ok
                          ? "border-green-300 bg-green-50 text-green-900"
                          : "border-red-300 bg-red-50 text-red-900")
                      }>
                        校验：
                        {llmResult.validation.ok
                          ? "✓ 通过（orderedIds ⊆ 候选）"
                          : "✗ 失败（" + (llmResult.validation.missingInModel.join("、") || "无") + " 漏 / " + (llmResult.validation.extraInModel.join("、") || "无") + " 多）"}
                      </div>
                      <div className="text-xs text-gray-500">
                        调用次数：1。响应形状：
                        <pre className="whitespace-pre-wrap bg-gray-50 border border-gray-200 rounded p-2 mt-1">{`{ orderedIds: ["id1","id2", ...] }`}</pre>
                      </div>
                      {llmResult.validation.ok ? (
                        <ol className="bg-white border border-gray-200 rounded p-3 space-y-1 text-sm">
                          {llmResult.rows.map(function (row) {
                            return (
                              <li key={row.chunk.id}>
                                <span className="font-semibold text-gray-900">第 {row.newRank} 名</span> · {row.chunk.title}
                                <span className="text-xs text-gray-500 ml-2">（{row.chunk.id}）</span>
                              </li>
                            );
                          })}
                        </ol>
                      ) : null}
                    </div>
                  ) : (
                    <p className="text-sm text-gray-500">点「走对话模型 Listwise」看结果。</p>
                  )}
                </div>
              </div>
            </section>
          </main>

          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
