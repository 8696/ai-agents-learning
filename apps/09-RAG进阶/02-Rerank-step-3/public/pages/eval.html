<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>评测集 + 命中率 · 第三步 · 重排序</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="../utils/api-client.js"></script>
  <script type="text/babel" src="../components/layout.js"></script>
  <script type="text/babel" src="../components/page-nav.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    // 本页教学点：评测集 + 命中率。同一份 20 条问句跑三种 pipeline，看平均命中率对照。
    const { useState, useEffect } = React;
    const { StatusPill, EnvFooter, PageNav } = window.DemoUI;
    const { fetchJson } = window.DemoUtils;

    function formatError(error) {
      const status = error.status ? error.status + " " : "";
      const hint = error.hint ? " · " + error.hint : "";
      return status + error.message + hint;
    }

    function difficultyLabel(d) {
      if (d === "simple") return { text: "简单", cls: "bg-green-100 text-green-800" };
      if (d === "medium") return { text: "中等", cls: "bg-yellow-100 text-yellow-800" };
      return { text: "难", cls: "bg-red-100 text-red-800" };
    }

    function missReasonLabel(r) {
      if (r === "out-of-window") return { text: "✗ 窗外", cls: "bg-red-100 text-red-800" };
      if (r === "rerank-miss") return { text: "✗ 精排仍错", cls: "bg-orange-100 text-orange-800" };
      return { text: "✓ 命中", cls: "bg-green-100 text-green-800" };
    }

    function App() {
      const [env, setEnv] = useState(null);
      const [evalSet, setEvalSet] = useState(null);
      const [evalSetLoading, setEvalSetLoading] = useState(true);
      const [pipeline, setPipeline] = useState("recall");
      const [k, setK] = useState(3);
      const [status, setStatus] = useState("idle");
      const [error, setError] = useState("");
      const [request, setRequest] = useState(null);
      const [result, setResult] = useState(null);

      useEffect(function () {
        fetchJson("/health")
          .then(function (body) { setEnv(body); setStatus("idle"); })
          .catch(function () { setEnv(null); });
        fetchJson("/api/eval-set")
          .then(function (body) {
            setEvalSet(body);
            setEvalSetLoading(false);
          })
          .catch(function () { setEvalSetLoading(false); });
      }, []);

      async function onRun() {
        setStatus("loading");
        setError("");
        const payload = { pipeline: pipeline, k: k };
        setRequest({ path: "POST /api/eval-run", body: payload });
        try {
          const body = await fetchJson("/api/eval-run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          setResult(body);
          setStatus("done");
        } catch (err) {
          setResult(null);
          setError(formatError(err));
          setStatus("error");
        }
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              重排序（Rerank） · 第三步（step-3） · 评测集 + 命中率
            </h1>
            <StatusPill status={status} />
          </header>

          <main id="page-main" className="max-w-7xl mx-auto p-4 space-y-4">
            <PageNav current="eval" base="../" />

            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示：<b>同一份 20 条问句跑三种 pipeline，看平均命中率对照</b>。
                单问句演示讲「这一个问句答得好不好」，评测集讲「<b>这一批问句平均答得好不好</b>」——产品决策靠均值，不靠单点。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>选 pipeline：召回 only / 召回 + Pointwise / 召回 + Listwise。</li>
                <li>选 K（Top-K：1 / 3 / 5）：期望 id 进最终前 K 条算命中。</li>
                <li>点「跑评测」：服务端跑 20 条 → 算 hit 数 → 返命中率 + 每条详情。</li>
              </ol>
              <div className="border border-amber-300 bg-amber-50 rounded p-3 text-xs text-amber-900 space-y-1">
                <div className="font-semibold">⚠ 精排是 mock</div>
                <div>
                  本步教学点是「评测框架 + 命中率对照」，不是「精排模型」。mock 故意偏向特例 <code>unopened-exception</code>（直接 0.95），保证召回 vs 精排有清晰对照；<b>不调真对话模型</b> 避免 20 条 × N 次调用 token / 时间吃紧。
                </div>
              </div>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <p className="text-sm font-semibold text-gray-900">
                  命中率 = 被引用切块是否进了 Top-K。同一份评测集，三种 pipeline 命中率不同 —— 这才是产品决策的依据。
                </p>
                <p className="text-xs text-gray-700">
                  三档难度对照：简单（召回能命中）/ 中等（召回上桌但需精排抬上来）/ 难（召回窗里没有——精排也救不回）。
                </p>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="text-sm font-semibold">阶段 1 · 选 pipeline + K</div>
              <div className="flex flex-wrap gap-3 items-center">
                <label className="space-x-2 text-sm">
                  <span className="text-gray-800">pipeline：</span>
                  <select
                    className="border border-gray-300 rounded p-1 text-sm"
                    value={pipeline}
                    disabled={status === "loading"}
                    onChange={function (event) { setPipeline(event.target.value); setResult(null); }}
                  >
                    <option value="recall">召回 only</option>
                    <option value="recall+pointwise">召回 + Pointwise（mock）</option>
                    <option value="recall+listwise">召回 + Listwise（mock）</option>
                  </select>
                </label>
                <label className="space-x-2 text-sm">
                  <span className="text-gray-800">K：</span>
                  <select
                    className="border border-gray-300 rounded p-1 text-sm"
                    value={k}
                    disabled={status === "loading"}
                    onChange={function (event) { setK(Number(event.target.value)); setResult(null); }}
                  >
                    <option value={1}>1</option>
                    <option value={3}>3</option>
                    <option value={5}>5</option>
                  </select>
                </label>
                <button
                  type="button"
                  className="bg-blue-600 text-white text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={status === "loading"}
                  onClick={onRun}
                >
                  跑评测（20 条）
                </button>
              </div>
              <p className="text-xs text-gray-500">
                这一步 <code>POST /api/eval-run</code>，body = pipeline + k。无密钥也能跑（mock 不调对话模型）。
              </p>
            </section>

            <section id="output" className="space-y-4">
              {request ? (
                <div className="bg-white shadow rounded p-4 space-y-2">
                  <div className="text-sm font-semibold">请求参数</div>
                  <pre className="whitespace-pre-wrap bg-gray-50 border border-gray-200 rounded p-3 text-xs">{JSON.stringify(request, null, 2)}</pre>
                </div>
              ) : null}

              {error ? (
                <div className="bg-white shadow rounded p-4">
                  <div className="border border-red-300 bg-red-50 text-red-800 rounded p-3 text-sm">
                    {error}
                  </div>
                </div>
              ) : null}

              {result ? (
                <div className="space-y-4">
                  <div className="bg-white shadow rounded p-4 space-y-3">
                    <div className="text-sm font-semibold">阶段 3 · 命中率汇总</div>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                      <div className="bg-green-50 border border-green-300 rounded p-4 text-center">
                        <div className="text-3xl font-bold text-green-900">
                          {(result.summary.hitRate * 100).toFixed(0)}%
                        </div>
                        <div className="text-xs text-gray-700 mt-1">
                          {result.summary.hits} / {result.summary.total}
                        </div>
                        <div className="text-xs text-gray-500 mt-1">总命中率</div>
                      </div>
                      <DifficultyBox bucket={result.summary.byDifficulty.simple} text="简单" />
                      <DifficultyBox bucket={result.summary.byDifficulty.medium} text="中等" />
                      <DifficultyBox bucket={result.summary.byDifficulty.hard} text="难" />
                    </div>
                    <p className="text-xs text-gray-500">
                      pipeline = {result.pipeline} · K = {result.k}
                    </p>
                  </div>

                  <div className="bg-white shadow rounded p-4 space-y-3">
                    <div className="text-sm font-semibold">阶段 4 · 20 条详情</div>
                    <ol className="space-y-2 text-sm">
                      {result.rows.map(function (row) {
                        const diff = difficultyLabel(row.difficulty);
                        const miss = missReasonLabel(row.missReason);
                        return (
                          <li key={row.id} className="border border-gray-200 rounded p-3 space-y-1">
                            <div className="flex items-baseline justify-between gap-2">
                              <div className="flex items-center gap-2 flex-wrap">
                                <span className="text-xs text-gray-500">#{row.id}</span>
                                <span className={"text-xs px-2 py-0.5 rounded " + diff.cls}>{diff.text}</span>
                                <span className={"text-xs px-2 py-0.5 rounded " + miss.cls}>{miss.text}</span>
                              </div>
                              <span className="text-xs text-gray-500">
                                召回第 {row.recallRank || "—"} 名 → 最终第 {row.finalRank || "—"} 名
                              </span>
                            </div>
                            <div className="text-sm text-gray-900">{row.query}</div>
                            <div className="text-xs text-gray-500">
                              期望：{row.expectedTitle}（id={row.expectedId}）
                            </div>
                          </li>
                        );
                      })}
                    </ol>
                  </div>
                </div>
              ) : (
                <div className="bg-white shadow rounded p-4 min-h-[200px]">
                  <p className="text-sm text-gray-500">还没跑。先选 pipeline + K，点「跑评测」。</p>
                </div>
              )}

              <details className="bg-white shadow rounded p-4">
                <summary className="text-sm font-semibold cursor-pointer">评测集（20 条）· 来自 GET /api/eval-set</summary>
                {evalSetLoading ? (
                  <p className="text-xs text-gray-500 mt-2">加载中…</p>
                ) : (
                  <ol className="mt-2 space-y-1 text-xs">
                    {evalSet && evalSet.items.map(function (item) {
                      return (
                        <li key={item.id} className="text-gray-700">
                          #{item.id} · {item.difficulty} · {item.query} → 期望 id={item.expectedId}
                        </li>
                      );
                    })}
                  </ol>
                )}
              </details>
            </section>
          </main>

          <EnvFooter env={env} />
        </div>
      );
    }

    function DifficultyBox(props) {
      const b = props.bucket;
      const color = props.text === "简单" ? "bg-green-50 border-green-300 text-green-900"
        : props.text === "中等" ? "bg-yellow-50 border-yellow-300 text-yellow-900"
        : "bg-red-50 border-red-300 text-red-900";
      return (
        <div className={"border rounded p-4 text-center " + color}>
          <div className="text-2xl font-bold">
            {(b.hitRate * 100).toFixed(0)}%
          </div>
          <div className="text-xs mt-1">
            {b.hits} / {b.total}
          </div>
          <div className="text-xs opacity-75 mt-1">{props.text}</div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
