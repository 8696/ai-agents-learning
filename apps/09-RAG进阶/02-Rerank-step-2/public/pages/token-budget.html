<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token 量级 · 第一步 · 重排序</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="../utils/api-client.js"></script>
  <script type="text/babel" src="../components/layout.js"></script>
  <script type="text/babel" src="../components/corpus-panel.js"></script>
  <script type="text/babel" src="../components/page-nav.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    // 本页教学点：④ 少塞 vs 多塞。同问句对照：召回全量塞 vs 精排后塞前 K。
    // 本步不调 LLM —— 本地粗估 text.length / 1.5 当 token 数。
    const { useState, useEffect } = React;
    const { StatusPill, EnvFooter, PageNav } = window.DemoUI;
    const { CorpusPanel } = window.DemoUI;
    const { fetchJson } = window.DemoUtils;

    function formatError(error) {
      const status = error.status ? error.status + " " : "";
      const hint = error.hint ? " · " + error.hint : "";
      return status + error.message + hint;
    }

    function CompactRow(props) {
      const row = props.row;
      return (
        <li className="text-xs text-gray-700 flex justify-between gap-3 border-b border-gray-100 py-1">
          <span className="truncate">{row.title}（{row.id}）</span>
          <span className="text-gray-500 whitespace-nowrap">≈ {row.tokens} 个 token</span>
        </li>
      );
    }

    function App() {
      const [env, setEnv] = useState(null);
      const [chunks, setChunks] = useState([]);
      const [corpusLoading, setCorpusLoading] = useState(true);
      const [corpusError, setCorpusError] = useState("");
      const [query, setQuery] = useState("超过 7 天了，盒子没拆，还能退吗？");
      const [status, setStatus] = useState("idle");
      const [error, setError] = useState("");
      const [request, setRequest] = useState(null);
      const [estimate, setEstimate] = useState(null);

      useEffect(function () {
        fetchJson("/health")
          .then(function (body) { setEnv(body); setStatus("idle"); })
          .catch(function () { setEnv(null); });
        fetchJson("/api/corpus")
          .then(function (body) {
            setChunks(body.chunks || []);
            if (body.defaultQuery) setQuery(body.defaultQuery);
            setCorpusLoading(false);
          })
          .catch(function (err) {
            setCorpusError(formatError(err));
            setCorpusLoading(false);
          });
      }, []);

      async function onEstimate() {
        setStatus("loading");
        setError("");
        // 演示用：召回整库 8 条 vs 精排后前 3 条
        const allIds = chunks.map(function (chunk) { return chunk.id; });
        const rerankTopIds = allIds.slice(0, 3);
        const payload = { query: query, candidateIds: allIds, rerankTopIds: rerankTopIds };
        setRequest({ path: "POST /api/token-estimate", body: payload });
        try {
          const body = await fetchJson("/api/token-estimate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          setEstimate(body);
          setStatus("done");
        } catch (err) {
          setEstimate(null);
          setError(formatError(err));
          setStatus("error");
        }
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              重排序（Rerank） · 第一步（step-1） · ④ Token 量级
            </h1>
            <StatusPill status={status} />
          </header>

          <main id="page-main" className="max-w-7xl mx-auto p-4 space-y-4">
            <PageNav current="token-budget" base="../" />

            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示：<b>同问句下，把召回全量塞进提示词 vs 精排后只塞前 K</b> 的 token 量级对照。
                本步不调模型，本地按 <code>text.length / 1.5</code> 粗估 token（粗估，只对照量级，不是精确计费）。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>点「算账」：服务端粗估两类材料的 token 总和。</li>
                <li>左栏「召回全量 8 条 ≈ N」：模型只看到噪音，提示词暴涨。</li>
                <li>右栏「精排后前 3 条 ≈ M」：精排换来更少、更干净的上下文（Context）。</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <p className="text-sm font-semibold text-gray-900">
                  精排的产品意义：用一次较贵的打分，换生成阶段更少、更干净的上下文。
                </p>
                <p className="text-xs text-gray-700">
                  多塞不是免费 —— Token 预算被 20 段政策占满，延迟和钱一起涨，模型仍可能抱着通用政策不放。
                </p>
              </div>
            </section>

            <CorpusPanel chunks={chunks} loading={corpusLoading} error={corpusError} />

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <label className="block space-y-1">
                <span className="text-sm text-gray-800">问句（query）</span>
                <textarea
                  className="w-full border border-gray-300 rounded p-2 text-sm"
                  rows={2}
                  value={query}
                  disabled={status === "loading"}
                  onChange={function (event) { setQuery(event.target.value); }}
                />
              </label>
              <div className="flex flex-wrap gap-2">
                <button
                  type="button"
                  className="bg-blue-600 text-white text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={status === "loading"}
                  onClick={onEstimate}
                >
                  算账（粗估 token 量级）
                </button>
              </div>
              <p className="text-xs text-gray-500">
                这一步 <code>POST /api/token-estimate</code> 不调 LLM。本地按字符长度粗估，只对照量级。
              </p>
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {request ? (
                <div className="bg-gray-50 text-gray-700 rounded p-3 text-xs space-y-1">
                  <div>请求参数</div>
                  <pre className="whitespace-pre-wrap max-h-32 overflow-auto">{JSON.stringify(request, null, 2)}</pre>
                </div>
              ) : null}

              {error ? (
                <div className="border border-red-300 bg-red-50 text-red-800 rounded p-3 text-sm">
                  {error}
                </div>
              ) : null}

              {!estimate && !error ? (
                <p className="text-sm text-gray-500">还没算账。先点上面按钮。</p>
              ) : null}

              {estimate ? (
                <div className="space-y-4">
                  <div className="text-sm text-gray-700">
                    问句本身 ≈ <b>{estimate.queryTokens}</b> 个 token。
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                    <div className="space-y-2">
                      <h3 className="text-sm font-semibold text-red-900">
                        方案 A：召回全量塞进提示词（{estimate.allCount} 条）
                      </h3>
                      <div className="bg-red-50 border border-red-300 rounded p-3 text-sm text-red-900">
                        ≈ <b>{estimate.allTokens}</b> 个 token
                      </div>
                      <ul className="bg-white border border-gray-200 rounded p-3 space-y-1">
                        {estimate.allRows.map(function (row) {
                          return <CompactRow key={row.id} row={row} />;
                        })}
                      </ul>
                      <p className="text-xs text-gray-500">
                        多塞不免费 —— Token 预算被通用政策占满，模型仍可能抱着「七天无理由」不放。
                      </p>
                    </div>

                    <div className="space-y-2">
                      <h3 className="text-sm font-semibold text-green-900">
                        方案 B：精排后只塞前 K（{estimate.rerankCount} 条）
                      </h3>
                      <div className="bg-green-50 border border-green-300 rounded p-3 text-sm text-green-900">
                        ≈ <b>{estimate.rerankTokens}</b> 个 token
                      </div>
                      <ul className="bg-white border border-gray-200 rounded p-3 space-y-1">
                        {estimate.rerankRows.map(function (row) {
                          return <CompactRow key={row.id} row={row} />;
                        })}
                      </ul>
                      <p className="text-xs text-gray-500">
                        多一次较贵的打分，换生成阶段更少、更干净的上下文。
                      </p>
                    </div>
                  </div>

                  <div className="bg-yellow-50 border border-yellow-300 rounded p-3 text-sm space-y-1">
                    <div className="font-semibold text-yellow-900">差值</div>
                    <div className="text-xs text-gray-700">
                      少塞 {estimate.delta.count} 条 / 约省 <b>{estimate.delta.tokens}</b> 个 token。
                      「少塞 vs 多塞」是精排省下来的真正成本，**不是**精排模型自己那一次调用的钱。
                    </div>
                  </div>
                </div>
              ) : null}
            </section>
          </main>

          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
