<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>失败兜底（Fallback） · 改写挂了用原句继续搜 · 第一步</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="/utils/api.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/page-nav.js"></script>
  <script type="text/babel" src="/components/rank-list.js"></script>
  <script type="text/babel" src="/components/request-card.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, PageHeader, PageNav, EnvFooter, RankList, RequestCard, ErrorCard } = window.DemoUI;
    const fetchJson = window.DemoUtils.fetchJson;

    function App() {
      const [query, setQuery] = useState("盒子没拆，都八天了，还能退吗？");
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");
      const [error, setError] = useState("");
      const [lastRequest, setLastRequest] = useState(null);
      const [result, setResult] = useState(null);

      useEffect(function () {
        let cancelled = false;
        (async function () {
          const health = await fetchJson("/health");
          if (cancelled) return;
          setEnv(health.json || {});
          setStatus("ok");
        })().catch(function (err) {
          if (cancelled) return;
          setStatus("error");
          setError("打开页面时请求失败：" + (err && err.message ? err.message : String(err)));
        });
        return function () { cancelled = true; };
      }, []);

      async function run(forceError) {
        setError("");
        setStatus("loading");
        try {
          const body = { query: query, forceError: forceError };
          setLastRequest({ method: "POST", url: "/api/fallback-and-search", body: body });
          const res = await fetchJson("/api/fallback-and-search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!res.json || !res.json.ok) {
            setStatus("error");
            setError("兜底检索失败 HTTP " + res.httpStatus + "：" + ((res.json && res.json.error) || "未知错误"));
            return;
          }
          setResult(res.json);
          setStatus("ok");
        } catch (err) {
          setStatus("error");
          setError("请求被拒绝：" + (err && err.message ? err.message : String(err)));
        }
      }

      const busy = status === "loading";
      const mode = result ? result.mode : null;
      const isFallback = mode === "fallback";

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              失败兜底（Fallback） · 改写挂了用原句继续搜
            </h1>
            <StatusPill status={status} />
          </header>
          <PageNav current="fallback" base="../" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示：<b>改写挂了（模型超时 / 吐空 / 解析炸掉）→ 用原句兜底继续检索，页面标明「本次未改写」</b>。
                改写挂了就整页 502 = 客服链路挂死；正确做法是 catch 住、回退原句检索、标 reason。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>点「跑改写（正常）」：改写成功，mode=rewritten。</li>
                <li>点「跑改写（强制失败）」：模拟改写模型炸掉，catch 接住、回退原句检索，mode=fallback，标 reason。</li>
                <li>看两条路径的对照：正常路径 → 改写句名单；失败路径 → 原句名单（词汇鸿沟仍存在）。</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  改写挂了不能整页 502。catch 后用原句检索继续走，页面标明「本次未改写」+ reason。比一次 5xx 卡死整页好太多。
                </div>
                <div className="text-xs text-gray-600">
                  怎么观察：mode=fallback 时红底卡显示 reason；原句名单仍展示（词汇鸿沟会重新出现）；同问句第二次跑正常路径会改写后检索，对照能看见「改写能命中、原句不行」。
                </div>
              </div>
            </section>
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <label className="block text-sm text-gray-700">
                用户原话（query）
                <textarea
                  className="mt-1 w-full border rounded p-2 text-sm"
                  rows={2}
                  value={query}
                  disabled={busy}
                  onChange={function (event) { setQuery(event.target.value); }}
                />
              </label>
              <p className="text-xs text-gray-500">改这个框再点按钮，会按新原句走。期望：正常路径改写后 target 进检索名单；强制失败路径 → 回退原句，target 不进检索名单（词汇鸿沟）。</p>
              <div className="flex flex-wrap gap-2">
                <button
                  className="bg-blue-600 text-white text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={function () { run(false); }}
                >
                  跑改写（正常）
                </button>
                <button
                  className="border border-gray-300 text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={function () { run(true); }}
                >
                  跑改写（强制失败）
                </button>
              </div>
              <p className="text-xs text-gray-600">强制失败按钮 = body.forceError=true；服务端模拟改写挂掉，catch 后用原句检索。生产里改写模型真挂了就是这条路径。</p>
            </section>
            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              <ErrorCard error={error} />
              <RequestCard request={lastRequest} />
              {result ? (
                <div className={"rounded p-3 text-sm space-y-1 " + (isFallback ? "bg-yellow-50 border border-yellow-300 text-yellow-900" : "bg-green-50 border border-green-300 text-green-900")}>
                  <div className="font-medium">兜底结果</div>
                  <div>走的模式（mode）：{mode === "rewritten" ? "rewritten（改写成功）" : "fallback（改写失败，用原句兜底）"}</div>
                  <div>实际检索的问句（queryUsed）：{result.queryUsed}</div>
                  {isFallback ? <div>失败原因（reason）：{result.reason || "（无）"}</div> : null}
                  {result.rewritten ? <div>改写句（rewrittenQuery）：{result.rewritten.rewrittenQuery}</div> : null}
                </div>
              ) : (
                <div className="text-sm text-gray-500">还没跑。点按钮后这里出现走的模式 + 失败原因（如有）。</div>
              )}
              <RankList
                side={mode || "fallback"}
                retrieve={result ? result.retrieve : null}
                emptyHint="还没跑。点了之后这里出现原句 / 改写句的检索名单。"
              />
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
