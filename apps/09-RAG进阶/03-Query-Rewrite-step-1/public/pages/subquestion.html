<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一句拆成子问题（Sub-question Splitting） · 第一步</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="/utils/api.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/page-nav.js"></script>
  <script type="text/babel" src="/components/rank-list.js"></script>
  <script type="text/babel" src="/components/request-card.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, PageHeader, PageNav, EnvFooter, RankList, RequestCard, ErrorCard } = window.DemoUI;
    const fetchJson = window.DemoUtils.fetchJson;

    function App() {
      const [query, setQuery] = useState("退货几天、保修几年？");
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");
      const [error, setError] = useState("");
      const [lastRequest, setLastRequest] = useState(null);
      const [result, setResult] = useState(null);

      useEffect(function () {
        let cancelled = false;
        (async function () {
          const health = await fetchJson("/health");
          if (cancelled) return;
          setEnv(health.json || {});
          setStatus("ok");
        })().catch(function (err) {
          if (cancelled) return;
          setStatus("error");
          setError("打开页面时请求失败：" + (err && err.message ? err.message : String(err)));
        });
        return function () { cancelled = true; };
      }, []);

      async function run() {
        setError("");
        setStatus("loading");
        try {
          const body = { query: query };
          setLastRequest({ method: "POST", url: "/api/subquestion-and-search", body: body });
          const res = await fetchJson("/api/subquestion-and-search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!res.json || !res.json.ok) {
            setStatus("error");
            setError("拆子问题失败 HTTP " + res.httpStatus + "：" + ((res.json && res.json.error) || "未知错误"));
            return;
          }
          setResult(res.json);
          setStatus("ok");
        } catch (err) {
          setStatus("error");
          setError("请求被拒绝：" + (err && err.message ? err.message : String(err)));
        }
      }

      const busy = status === "loading";
      const perSub = result ? result.perSub : [];

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              一句拆成子问题（Sub-question Splitting） · 一问多句 + 各自检索 + 合并
            </h1>
            <StatusPill status={status} />
          </header>
          <PageNav current="subquestion" base="../" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示：<b>一句多问（退货几天、保修几年）必须拆成可独立检索的子问题，分别检索再合并</b>。
                BM25 只对一次打分，混在一起会把两个意图的命中词搅乱。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>填一句多问的问句（默认「退货几天、保修几年？」）。</li>
                <li>点「跑拆子问题」：服务端调模型拆成子问题数组，对每个子问题各检索一次，再合并名单（累加 score）。</li>
                <li>看每个子问题自己的检索 + 合并后的总名单。</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  一句多问必须拆开再分别检索。本步只演示「拆 + 各自检索 + 合并名单」（累加 score）；完整 Multi-query 的去重 / 重排算法是下一节的事。
                </div>
                <div className="text-xs text-gray-600">
                  怎么观察：拆出的子问题数组；每个子问题自己的检索名单（独立 RankList）；合并后的总名单（各 chunk 的 score 是它在各子问题里的累加）。
                </div>
              </div>
            </section>
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <label className="block text-sm text-gray-700">
                一句多问（query）
                <textarea
                  className="mt-1 w-full border rounded p-2 text-sm"
                  rows={2}
                  value={query}
                  disabled={busy}
                  onChange={function (event) { setQuery(event.target.value); }}
                />
              </label>
              <p className="text-xs text-gray-500">改这个框再点按钮，会按新问句走。期望：拆成 ["退货几天", "保修几年"]，分别命中七天无理由 / 保修须知切块。</p>
              <div className="flex flex-wrap gap-2">
                <button
                  className="bg-blue-600 text-white text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={run}
                >
                  跑拆子问题
                </button>
              </div>
              <p className="text-xs text-gray-600">拆子问题走 LLM。合并 = 各子问题检索里每个 chunk 的 score 求和，onTable = 合并后 score > 0。</p>
            </section>
            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              <ErrorCard error={error} />
              <RequestCard request={lastRequest} />
              {result ? (
                <div className="rounded p-3 text-sm space-y-1 bg-blue-50 border border-blue-300 text-blue-900">
                  <div className="font-medium">拆子问题结果</div>
                  <div>原句：{result.query}</div>
                  <div>拆出的子问题数：{result.subquestions.length}</div>
                  <div>子问题列表：{result.subquestions.map(function (sq, i) { return i + 1 + ". " + sq; }).join("  /  ")}</div>
                </div>
              ) : (
                <div className="text-sm text-gray-500">还没跑。点按钮后这里出现原句 + 拆出的子问题列表。</div>
              )}
              {perSub.length > 0 ? (
                <div className="space-y-3">
                  <div className="text-sm font-medium">每个子问题自己的检索</div>
                  {perSub.map(function (ret, i) {
                    return (
                      <div key={i} className="border rounded p-3 space-y-2">
                        <div className="text-xs font-medium text-gray-700">子问题 {i + 1}：{result.subquestions[i]}</div>
                        <RankList side={"sub" + i} retrieve={ret} emptyHint="（无）" />
                      </div>
                    );
                  })}
                </div>
              ) : null}
              {result ? (
                <div className="border-2 border-blue-300 rounded p-3 space-y-2">
                  <div className="text-sm font-medium">合并后的总名单</div>
                  <p className="text-xs text-gray-600">每个 chunk 的 score 是它在各子问题里的累加；onTable = 合并后 score > 0。</p>
                  <RankList side="merged" retrieve={result.merged} emptyHint="（无）" />
                </div>
              ) : null}
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
