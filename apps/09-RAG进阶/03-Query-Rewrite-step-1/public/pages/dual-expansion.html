<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>规则 vs 模型分列 · 第一步</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="/utils/api.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/page-nav.js"></script>
  <script type="text/babel" src="/components/rank-list.js"></script>
  <script type="text/babel" src="/components/request-card.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, PageHeader, PageNav, EnvFooter, RankList, RequestCard, ErrorCard } = window.DemoUI;
    const fetchJson = window.DemoUtils.fetchJson;

    function App() {
      const [query, setQuery] = useState("盒子没拆，都八天了，还能退吗？");
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");
      const [error, setError] = useState("");
      const [lastRequest, setLastRequest] = useState(null);
      const [result, setResult] = useState(null);

      useEffect(function () {
        let cancelled = false;
        (async function () {
          const health = await fetchJson("/health");
          if (cancelled) return;
          setEnv(health.json || {});
          setStatus("ok");
        })().catch(function (err) {
          if (cancelled) return;
          setStatus("error");
          setError("打开页面时请求失败：" + (err && err.message ? err.message : String(err)));
        });
        return function () { cancelled = true; };
      }, []);

      async function run() {
        setError("");
        setStatus("loading");
        try {
          const body = { query: query };
          setLastRequest({ method: "POST", url: "/api/dual-expansion-and-search", body: body });
          const res = await fetchJson("/api/dual-expansion-and-search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!res.json || !res.json.ok) {
            setStatus("error");
            setError("规则 vs 模型失败 HTTP " + res.httpStatus + "：" + ((res.json && res.json.error) || "未知错误"));
            return;
          }
          setResult(res.json);
          setStatus("ok");
        } catch (err) {
          setStatus("error");
          setError("请求被拒绝：" + (err && err.message ? err.message : String(err)));
        }
      }

      const busy = status === "loading";

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              规则 vs 模型分列 · 两种补词器不是黑盒
            </h1>
            <StatusPill status={status} />
          </header>
          <PageNav current="dual-expansion" base="../" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示：<b>同一条问句，规则补词（本地同义词表）vs 模型补词（调 LLM）两种补词器并列产出</b>。
                两种补词方式各自产出会不一样，命中切块也不一样。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>填用户原话（默认「盒子没拆，都八天了，还能退吗？」）。</li>
                <li>点「跑规则 vs 模型」：服务端并行做规则补词 + 模型补词，各自用扩展句检索一次。</li>
                <li>看两侧的 addedTerms / 扩展句 / 名单 对照；同一条问句、两种补词器，命中切块可能完全不同。</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  两种补词器不是一个黑盒。规则便宜、可解释、货号不会丢；模型能处理没见过的口语，但会改偏。生产里常见「先规则后模型」—— 能抽到货号就钉住货号，剩下的口语再交给模型。
                </div>
                <div className="text-xs text-gray-600">
                  怎么观察：左栏「规则补词」addedTerms 来自本地同义词表（可解释）；右栏「模型补词」addedTerms 来自 LLM 输出（可能更丰富也可能改偏）；两份名单对照看。
                </div>
              </div>
            </section>
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <label className="block text-sm text-gray-700">
                用户原话（query）
                <textarea
                  className="mt-1 w-full border rounded p-2 text-sm"
                  rows={2}
                  value={query}
                  disabled={busy}
                  onChange={function (event) { setQuery(event.target.value); }}
                />
              </label>
              <p className="text-xs text-gray-500">改这个框再点按钮，会按新问句走。期望：规则补词命中「退 / 退货」→ 补「七天无理由 / 未拆封」；模型补词可能补出别的库用语。</p>
              <div className="flex flex-wrap gap-2">
                <button
                  className="bg-blue-600 text-white text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={run}
                >
                  跑规则 vs 模型
                </button>
              </div>
              <p className="text-xs text-gray-600">规则补词走本地 RULE_TERMS（不调模型）；模型补词走 LLM（getLlm）。两条请求并行。</p>
            </section>
            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              <ErrorCard error={error} />
              <RequestCard request={lastRequest} />
              {result ? (
                <div className="rounded p-3 text-sm bg-blue-50 border border-blue-300 text-blue-900">
                  <div className="font-medium">原句：{result.query}</div>
                </div>
              ) : (
                <div className="text-sm text-gray-500">还没跑。点按钮后这里出现原句 + 两侧对照。</div>
              )}
              {result ? (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="border rounded p-3 space-y-2">
                    <div className="text-sm font-medium">左栏 · 规则补词</div>
                    <div className="text-xs text-gray-600">本地同义词表（不调模型）。</div>
                    <div className="text-xs">addedTerms：{result.rule.addedTerms.length ? result.rule.addedTerms.join("、") : <span className="text-red-700">（空：规则表全 miss）</span>}</div>
                    <div className="text-xs">扩展句：<span className="font-medium">{result.rule.expandedQuery}</span></div>
                    <RankList side="rule" retrieve={result.rule.retrieve} emptyHint="（无）" />
                  </div>
                  <div className="border rounded p-3 space-y-2">
                    <div className="text-sm font-medium">右栏 · 模型补词</div>
                    <div className="text-xs text-gray-600">调 LLM 生成 addedTerms。</div>
                    <div className="text-xs">addedTerms：{result.model.addedTerms.length ? result.model.addedTerms.join("、") : <span className="text-red-700">（空：模型没补）</span>}</div>
                    <div className="text-xs">扩展句：<span className="font-medium">{result.model.expandedQuery}</span></div>
                    <RankList side="model" retrieve={result.model.retrieve} emptyHint="（无）" />
                  </div>
                </div>
              ) : null}
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
