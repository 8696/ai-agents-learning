<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>锚点问句不改写（Anchor Skip） · 第一步</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="/utils/api.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/page-nav.js"></script>
  <script type="text/babel" src="/components/rank-list.js"></script>
  <script type="text/babel" src="/components/request-card.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, PageHeader, PageNav, EnvFooter, RankList, RequestCard, ErrorCard } = window.DemoUI;
    const fetchJson = window.DemoUtils.fetchJson;

    function App() {
      const [query, setQuery] = useState("SKU-88 未拆封超过七天能不能退？");
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");
      const [error, setError] = useState("");
      const [lastRequest, setLastRequest] = useState(null);
      const [result, setResult] = useState(null);

      useEffect(function () {
        let cancelled = false;
        (async function () {
          const health = await fetchJson("/health");
          if (cancelled) return;
          setEnv(health.json || {});
          setStatus("ok");
        })().catch(function (err) {
          if (cancelled) return;
          setStatus("error");
          setError("打开页面时请求失败：" + (err && err.message ? err.message : String(err)));
        });
        return function () { cancelled = true; };
      }, []);

      async function run() {
        setError("");
        setStatus("loading");
        try {
          const body = { query: query };
          setLastRequest({ method: "POST", url: "/api/anchor-and-search", body: body });
          const res = await fetchJson("/api/anchor-and-search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!res.json || !res.json.ok) {
            setStatus("error");
            setError("锚点检索失败 HTTP " + res.httpStatus + "：" + ((res.json && res.json.error) || "未知错误"));
            return;
          }
          setResult(res.json);
          setStatus("ok");
        } catch (err) {
          setStatus("error");
          setError("请求被拒绝：" + (err && err.message ? err.message : String(err)));
        }
      }

      const busy = status === "loading";
      const isAnchor = result ? result.anchor.isAnchor : false;
      const mode = result ? result.mode : null;

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              锚点问句不改写（Anchor Skip） · 货号 / 条款 / Section 命中就跳过改写
            </h1>
            <StatusPill status={status} />
          </header>
          <PageNav current="anchor" base="../" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示：<b>锚点问句（SKU 编号 / 条款编号 / Section 编号）跳过改写、原句直搜</b>。
                改写模型看到「SKU-88」可能扩成「电子产品退货政策」—— 主键被改成模糊主题，BM25 优势没了。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>填问句：默认「SKU-88 未拆封超过七天能不能退？」—— 这是锚点 + 口语混合。</li>
                <li>点「跑锚点检测」：服务端按 SKU / 条款 / Section 三条正则扫。</li>
                <li>看是否进检索名单：命中锚点 → mode=skipped，原句直搜；未命中 → mode=rewritten，调改写模型。</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  改写是开关，不是信仰。货号 / 条款编号是「主键」，交给改写模型会被改成模糊主题，BM25 优势没了。命中锚点 → 原句直搜；未命中 → 走改写。
                </div>
                <div className="text-xs text-gray-600">
                  怎么观察：anchor.isAnchor=true + mode=skipped → 页面要看见「跳过改写」+「为什么」+「原句名单」；未命中 → mode=rewritten + 右栏展示改写句和名单。
                </div>
              </div>
            </section>
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <label className="block text-sm text-gray-700">
                用户原话（query）
                <textarea
                  className="mt-1 w-full border rounded p-2 text-sm"
                  rows={2}
                  value={query}
                  disabled={busy}
                  onChange={function (event) { setQuery(event.target.value); }}
                />
              </label>
              <p className="text-xs text-gray-500">改这个框再点按钮，会按新原句走。期望：默认问句「SKU-88 未拆封超过七天能不能退？」命中 SKU → 跳过改写、原句直搜。</p>
              <div className="flex flex-wrap gap-2">
                <button
                  className="bg-blue-600 text-white text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={run}
                >
                  跑锚点检测
                </button>
              </div>
              <p className="text-xs text-gray-600">锚点检测只走本地正则，不调模型。未命中 + 有密钥才调改写；未命中 + 没密钥 → 退化为原句直搜（页面会标明原因）。</p>
            </section>
            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              <ErrorCard error={error} />
              <RequestCard request={lastRequest} />
              {result ? (
                <div className={"rounded p-3 text-sm space-y-1 " + (isAnchor ? "bg-blue-50 border border-blue-300 text-blue-900" : "bg-yellow-50 border border-yellow-300 text-yellow-900")}>
                  <div className="font-medium">锚点检测结果</div>
                  <div>命中锚点（isAnchor）：{String(isAnchor)}</div>
                  <div>理由（reason）：{result.anchor.reason}</div>
                  {result.anchor.matchedText ? <div>命中的文本（matchedText）：{result.anchor.matchedText}</div> : null}
                  <div>走的模式（mode）：{mode === "skipped" ? "skipped（跳过改写，原句直搜）" : "rewritten（调改写模型）"}</div>
                </div>
              ) : (
                <div className="text-sm text-gray-500">还没跑。点按钮后这里出现锚点检测结果 + 走的模式。</div>
              )}
              <RankList
                side={mode || "anchor"}
                retrieve={result ? result.retrieve : null}
                emptyHint="还没跑锚点检测。点了之后这里出现原句 / 改写句的检索名单。"
              />
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
