<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BM25 / 混合检索 · 第五步</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="text/babel" src="components/side-rank-table.js"></script>
  <script type="text/babel" src="components/judge-case-card.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [env, setEnv] = useState({ port: 50091, library: "—", callsModel: false });
      const [cases, setCases] = useState([]);
      const [busy, setBusy] = useState(false);
      const [status, setStatus] = useState("⏸ 待跑");
      const [judgeById, setJudgeById] = useState({});
      const [summary, setSummary] = useState(null);
      const [customQ, setCustomQ] = useState("API-KEY-7741 怎么轮换");
      const [customCompare, setCustomCompare] = useState(null);
      const [errorText, setErrorText] = useState("");

      useEffect(() => {
        fetch("/health").then((r) => r.json()).then((d) => {
          setEnv({ port: d.port, library: d.library || "wink-bm25-text-search", callsModel: Boolean(d.callsModel) });
        }).catch(() => {});
        fetch("/api/judge-cases").then((r) => r.json()).then((d) => {
          if (d.ok) setCases(d.result.cases);
        }).catch(() => {});
      }, []);

      async function runOne(caseId) {
        setBusy(true);
        setStatus("🔄 请求中");
        setErrorText("");
        try {
          const response = await fetch("/api/judge-run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mode: "one", caseId, topK: 5 }),
          });
          const json = await response.json();
          if (!json.ok) {
            setStatus("❌ 错误");
            setErrorText(json.error || "未知错误");
            return;
          }
          setJudgeById((prev) => ({ ...prev, [caseId]: json.result }));
          setStatus("✅ 完成");
        } catch (error) {
          setStatus("❌ 错误");
          setErrorText(String(error));
        } finally {
          setBusy(false);
        }
      }

      async function runAll() {
        setBusy(true);
        setStatus("🔄 请求中");
        setErrorText("");
        try {
          const response = await fetch("/api/judge-run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mode: "all", topK: 5 }),
          });
          const json = await response.json();
          if (!json.ok) {
            setStatus("❌ 错误");
            setErrorText(json.error || "未知错误");
            return;
          }
          const map = {};
          json.result.results.forEach((r) => { map[r.case.id] = r; });
          setJudgeById(map);
          setSummary(json.result.summary);
          setStatus("✅ 完成");
        } catch (error) {
          setStatus("❌ 错误");
          setErrorText(String(error));
        } finally {
          setBusy(false);
        }
      }

      async function runCustom() {
        if (!customQ.trim()) {
          setStatus("❌ 错误");
          setErrorText("问句不能为空");
          return;
        }
        setBusy(true);
        setStatus("🔄 请求中");
        setErrorText("");
        try {
          const response = await fetch("/api/compare-bm25", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: customQ, topK: 5 }),
          });
          const json = await response.json();
          if (!json.ok) {
            setStatus("❌ 错误");
            setErrorText(json.error || "未知错误");
            return;
          }
          setCustomCompare(json.result);
          setStatus("✅ 完成");
        } catch (error) {
          setStatus("❌ 错误");
          setErrorText(String(error));
        } finally {
          setBusy(false);
        }
      }

      return (
        <div className="min-h-screen bg-gray-50">
          <header id="page-header" className="border-b p-4 bg-white flex justify-between items-center">
            <h1 id="page-title" className="text-lg font-semibold">
              BM25 / 混合检索 · 第五步（step-5）· 手写 vs 成熟库
            </h1>
            <span id="status-pill" className={"text-xs px-2 py-1 rounded " + (status.startsWith("❌") ? "bg-red-100 text-red-800" : "bg-gray-200")}>
              {status}
            </span>
          </header>

          <main id="page-main" className="max-w-5xl mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                同一库、同一切词：左边是本仓库手写 BM25，右边是 wink-bm25-text-search。比的是 <strong>Top-1 结论</strong>，分数可以不同。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>点「跑全部判定」看内置例子过不过</li>
                <li>或自己输入问题点「跑对照」</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 text-xs space-y-1">
                <div className="font-semibold text-yellow-900">本页核心</div>
                <div>教学可以自己写公式；上线用成熟库。思想相同，换的是谁帮你建索引。</div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="flex flex-wrap items-center gap-2">
                <button className="text-sm px-3 py-1 bg-blue-600 text-white rounded disabled:opacity-50" disabled={busy} onClick={runAll}>
                  跑全部判定
                </button>
                {summary ? (
                  <span className="text-xs text-gray-600">
                    两边都过 {summary.bothPassed}/{summary.total}
                  </span>
                ) : null}
              </div>
              {errorText ? <div className="text-xs text-red-700">{errorText}</div> : null}
              <div className="space-y-2">
                {cases.map((c) => (
                  <DemoUI.JudgeCaseCard
                    key={c.id}
                    caseItem={c}
                    result={judgeById[c.id]}
                    busy={busy}
                    onRun={() => runOne(c.id)}
                  />
                ))}
              </div>
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-3">
              <div className="text-sm font-semibold">自定义对照</div>
              <div className="flex flex-wrap gap-2">
                <input
                  className="flex-1 min-w-[180px] border rounded px-2 py-1 text-sm"
                  value={customQ}
                  onChange={(e) => setCustomQ(e.target.value)}
                />
                <button className="text-sm px-3 py-1 border rounded bg-white disabled:opacity-50" disabled={busy} onClick={runCustom}>
                  跑对照
                </button>
              </div>
              {customCompare ? (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <DemoUI.SideRankTable title={customCompare.handwritten.displayName} side={customCompare.handwritten} />
                  <DemoUI.SideRankTable title={customCompare.wink.displayName} side={customCompare.wink} />
                </div>
              ) : (
                <div className="text-xs text-gray-400">还没跑自定义对照。</div>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 {env.port} · 本地计算 · 成熟库 {env.library} · 调模型 {env.callsModel ? "✅" : "❌"}
            </span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
