<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重排序 · 第一步 · 总览</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="utils/api-client.js"></script>
  <script type="text/babel" src="components/layout.js"></script>
  <script type="text/babel" src="components/page-nav.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    // 本页教学点：step-1 总览。四个 mode 共享同一份 lib/flow/ 核心。
    const { useState, useEffect } = React;
    const { StatusPill, PageIntro, EnvFooter } = window.DemoUI;
    const { fetchJson } = window.DemoUtils;

    const MODES = [
      {
        key: "normal",
        title: "① 正常对照",
        href: "pages/normal.html",
        desc: "召回 6 条 → 精排改顺序。特例「未拆封超期」从召回第 6 被抬到精排第 1。",
        variant: "变体 1 / 变体 2 / 变体 8",
      },
      {
        key: "window-of-shame",
        title: "② 候选窗外",
        href: "pages/window-of-shame.html",
        desc: "召回窗缩到 3，特例被截到窗外。精排怎么打都救不回 —— 看见「候选窗」这条边界。",
        variant: "变体 3 / 变体 5（窗外失败）",
      },
      {
        key: "rerank-off",
        title: "③ 关闭精排",
        href: "pages/rerank-off.html",
        desc: "K 选 3 / 5 / 8。关闭精排 → 不调模型，分数沿用粗召回分，名次不变。",
        variant: "变体 11",
      },
      {
        key: "token-budget",
        title: "④ Token 量级",
        href: "pages/token-budget.html",
        desc: "同问句对照：召回全量 8 条 vs 精排后 3 条。本地粗估 token，省多少一眼看见。",
        variant: "变体 6 / 变体 7",
      },
    ];

    function App() {
      const [env, setEnv] = useState(null);
      useEffect(function () {
        fetchJson("/health").then(setEnv).catch(function () { setEnv(null); });
      }, []);

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              重排序（Rerank） · 第一步（step-1） · 总览
            </h1>
            <StatusPill status={env ? "idle" : "loading"} />
          </header>

          <main id="page-main" className="max-w-7xl mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示：<b>四个 mode 共享同一份 lib/flow/ 核心 + 一个可选入参</b>。
                按目录可单独进：① 正常对照、② 候选窗外、③ 关闭精排、④ Token 量级。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>打开页面：服务端把 8 个切块准备好。</li>
                <li>选一个 mode 进：每个 mode 演示一个精排变体的边界。</li>
                <li>同一个问句下，对照「两阶段对照 / 窗外救不回 / 关闭精排 / 少塞 vs 多塞」四件事。</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <p className="text-sm font-semibold text-gray-900">
                  粗召回决定谁上桌；精排决定谁坐主位。候选窗外救不回、关掉精排就退化、少塞换来更干净上下文。
                </p>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <h2 className="text-sm font-semibold">选一个 mode 进</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                {MODES.map(function (mode) {
                  return (
                    <a
                      key={mode.key}
                      href={mode.href}
                      className="block border border-gray-300 rounded p-4 bg-gray-50 hover:bg-blue-50 hover:border-blue-400"
                    >
                      <div className="text-sm font-semibold text-gray-900">{mode.title}</div>
                      <div className="text-xs text-gray-600 mt-1">{mode.desc}</div>
                      <div className="text-xs text-gray-400 mt-2">{mode.variant}</div>
                    </a>
                  );
                })}
              </div>
            </section>

            {/* §5.3.4 / §5.3.10：导航总览也要有 #output（这里放「数据流」一览） */}
            <section id="output" className="bg-white shadow rounded p-4 space-y-2">
              <h2 className="text-sm font-semibold">数据流（四个 mode 共享）</h2>
              <pre className="text-xs text-gray-700 whitespace-pre-wrap bg-gray-50 border border-gray-200 rounded p-3">
{`打开页面
  → GET /health          取环境（provider / model / 密钥）
  → GET /api/corpus      取服务端 8 个切块
  → 选 mode 进：
      ① normal           POST /api/recall（limit=6）→ POST /api/rerank（调模型）
      ② window-of-shame  POST /api/recall（limit=3）→ POST /api/rerank（看窗外）
      ③ rerank-off       POST /api/recall（limit=K）→ POST /api/rerank（mode=off，不调模型）
      ④ token-budget     POST /api/token-estimate（本地粗估，不调模型）`}
              </pre>
              <p className="text-xs text-gray-500">
                每个 mode 走的是同一份 <code>lib/flow/recall.ts</code> + <code>lib/flow/rerank.ts</code>，
                只是入参（limit / mode）和后续页面渲染不同。
              </p>
            </section>
          </main>

          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
