<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第四步 · 粗召回分 vs 精排分 · 两种分数哪里不一样</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="text/babel" src="../components/rrf-vs-rerank-table.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [env, setEnv] = useState({ port: 50092, provider: "—", model: "—", hasKey: false });
      const [busy, setBusy] = useState(false);
      const [status, setStatus] = useState("⏸ 待跑");
      const [errorText, setErrorText] = useState("");
      const [recall, setRecall] = useState(null);
      const [rerank, setRerank] = useState(null);

      const QUERY = "杯子在路上碎了能退吗";
      const N = 8; // 固定 N=8（粗召回前 8 条；对的那一条在第 8 名刚好进候选，看它大幅升名最清楚）

      useEffect(() => {
        fetch("/health").then((r) => r.json()).then((d) => {
          setEnv({
            port: d.port,
            provider: d.provider || "—",
            model: d.model || "—",
            hasKey: Boolean(d.hasKey),
          });
        }).catch(() => {});
      }, []);

      async function runRecall() {
        setBusy(true);
        setStatus("🔄 粗召回中（第一次发请求 · 准备捞 " + N + " 张）");
        setErrorText("");
        setRerank(null);
        try {
          const response = await fetch("/api/search-recall", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: QUERY, n: N }),
          });
          const json = await response.json();
          if (!json.ok) {
            setStatus("❌ 错误");
            setErrorText(json.error || "未知错误");
            return;
          }
          setRecall(json.result);
          setStatus("✅ 粗召回完成 · 下一步：跑精排");
        } catch (error) {
          setStatus("❌ 错误");
          setErrorText(String(error));
        } finally {
          setBusy(false);
        }
      }

      async function runRerank() {
        if (!recall) {
          setStatus("❌ 错误");
          setErrorText("先点「① 跑粗召回」拿到候选");
          return;
        }
        setBusy(true);
        setStatus("🔄 精排中（第二次发请求 · 让大模型逐对打分重排）");
        setErrorText("");
        try {
          const candidates = recall.rows.slice(0, N);
          const response = await fetch("/api/rerank", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: QUERY, candidates, rerankOn: true }),
          });
          const json = await response.json();
          if (!json.ok) {
            setStatus("❌ 错误");
            setErrorText(json.error || "未知错误");
            return;
          }
          setRerank(json.result);
          setStatus("✅ 精排完成 · 看每一条粗召回给的分数 vs 精排给的分数");
        } catch (error) {
          setStatus("❌ 错误");
          setErrorText(String(error));
        } finally {
          setBusy(false);
        }
      }

      function reset() {
        setRecall(null);
        setRerank(null);
        setStatus("⏸ 待跑");
        setErrorText("");
      }

      return (
        <div className="min-h-screen bg-gray-50">
          <header id="page-header" className="border-b p-4 bg-white flex justify-between items-center">
            <h1 id="page-title" className="text-lg font-semibold">
              第四步 · 粗召回分 vs 精排分 · 看两种分数哪里不一样
            </h1>
            <span id="status-pill" className={"text-xs px-2 py-1 rounded " + (status.startsWith("❌") ? "bg-red-100 text-red-800" : status.startsWith("🔄") ? "bg-blue-100 text-blue-800" : status.startsWith("✅") ? "bg-green-100 text-green-800" : "bg-gray-200")}>
              {status}
            </span>
          </header>

          <nav id="page-nav" className="border-b bg-white px-4 py-2 text-xs flex gap-3 flex-wrap">
            <a href="/" className="px-2 py-1 rounded text-gray-700 hover:bg-gray-100">① 第一步：粗召回 + 精排 · 看名次怎么变</a>
            <a href="/pages/recall-by-n.html" className="px-2 py-1 rounded text-gray-700 hover:bg-gray-100">② 第二步：粗召回捞几条？· 看对的那一条能不能进来</a>
            <a href="/pages/rerank-on-off.html" className="px-2 py-1 rounded text-gray-700 hover:bg-gray-100">③ 第三步：精排要不要做？· 看关掉精排会损失什么</a>
            <a href="/pages/rrf-vs-rerank.html" className="px-2 py-1 rounded bg-blue-100 text-blue-800 font-semibold">④ 第四步：粗召回分 vs 精排分 · 看两种分数哪里不一样</a>
          </nav>

          <main id="page-main" className="max-w-6xl mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                这一页只演示一件事：<b>同一条条目，粗召回给的分数和大模型给的分数各是多少？两条榜单上它的名次会不会变？</b>
                固定问句「杯子在路上碎了能退吗」，固定粗召回前 8 条。
              </p>

              <div className="bg-gray-50 border border-gray-300 rounded p-3 text-xs font-mono space-y-1">
                <div className="text-gray-700 mb-1">两条通道对照：</div>
                <div>┌─ <span className="text-blue-700 font-semibold">粗召回分</span>：按名次投票合成粗名单，不同通道对每一条的名次相加 — 看的<b>是名次</b></div>
                <div>└─ <span className="text-purple-700 font-semibold">精排分</span>：大模型读了「问句 + 条目正文」之后独立打的相关分 — 看的<b>是相关性</b></div>
                <div className="text-gray-700 mt-1">两把尺子，量纲不一样。两条榜同名次不一样 = 两条通道看的是不同的事。</div>
              </div>

              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>点「① 跑粗召回」→ 拿到前 8 条（按粗召回分排好）</li>
                <li>点「② 跑精排」→ 让大模型按「问句 + 条目正文」逐对打分重新排</li>
                <li>看对照表：每一条同时显示粗召回分（蓝）+ 精排分（紫）+ 名次变化</li>
                <li>黄框条目 = 名次变了；下方判断提示列出具体哪些条目名次变了</li>
              </ol>

              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 text-xs space-y-1">
                <div className="font-semibold text-yellow-900">关上文件还能讲出来的一句话</div>
                <div><b>粗召回是按名次投票合成粗名单，精排是读了正文再打分——两条通道看的是不同的事，所以名次会动。</b></div>
                <div>本页不是要演「名次会变」就完了，而是要让你看出「为什么不一样」：粗召回看的是<b>名次</b>，精排看的是<b>相关性</b>。尺子不同 → 量出来的数就不同 → 排出来的顺序就不同。</div>
                <div>把两种分数硬加（"0.5 × 粗召回分 + 0.5 × 精排分"）也是错的：两把尺子的量纲没拉齐，加出来的数没有意义。</div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="flex flex-wrap items-center gap-3">
                <label className="text-sm text-gray-700 flex-1 min-w-[300px]">
                  <span className="block text-xs text-gray-500 mb-1">固定问句</span>
                  <input
                    className="w-full border rounded px-2 py-1 text-sm bg-gray-100"
                    value={QUERY}
                    readOnly
                  />
                </label>
                <div className="text-sm text-gray-700">
                  <span className="block text-xs text-gray-500 mb-1">固定候选 N</span>
                  <span className="font-mono px-3 py-1 bg-gray-100 rounded">N = {N}</span>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                <button
                  className="text-sm px-3 py-1 bg-blue-600 text-white rounded disabled:opacity-50"
                  disabled={busy || !env.hasKey}
                  onClick={runRecall}
                  title="第一次发请求：从知识库里捞前 8 条条目"
                >
                  ① 跑粗召回
                </button>
                <button
                  className="text-sm px-3 py-1 bg-blue-600 text-white rounded disabled:opacity-50"
                  disabled={busy || !recall || !env.hasKey}
                  onClick={runRerank}
                  title="第二次发请求：让大模型对每一条逐对打分重新排"
                >
                  ② 跑精排
                </button>
                <button
                  className="text-sm px-3 py-1 border border-gray-300 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={reset}
                >
                  重置
                </button>

                {!env.hasKey ? (
                  <span className="text-xs text-red-700">
                    当前没配密钥（apps/.env 没填）—— 主按钮 disabled
                  </span>
                ) : null}
              </div>

              {errorText ? (
                <div className="text-xs text-red-700 bg-red-50 border border-red-300 rounded p-2">
                  {errorText}
                </div>
              ) : null}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-3 min-h-[200px]">
              {!recall ? (
                <div className="text-xs text-gray-400">
                  还没跑。先点「① 跑粗召回」拿到前 {N} 张；再点「② 跑精排」看对照表。
                </div>
              ) : !rerank ? (
                <div className="text-xs text-gray-400">
                  粗召回完成（{recall.rows.length} 张条目 · N={N}）。点「② 跑精排」看对照。
                </div>
              ) : (
                <DemoUI.RrfVsRerankTable recall={recall} rerank={rerank} />
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 {env.port} · 协议 A · 模型服务商 {env.provider} · 模型 {env.model} · 密钥 {env.hasKey ? "✅" : "❌"}
            </span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
