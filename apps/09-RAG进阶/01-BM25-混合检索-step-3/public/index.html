<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BM25 / 混合检索 · 第三步</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="text/babel" src="components/hybrid-card.js"></script>
  <script type="text/babel" src="components/rrf-card.js"></script>
  <script type="text/babel" src="components/bias-card.js"></script>
  <script type="text/babel" src="components/rank-compare.js"></script>
  <script type="text/babel" src="components/hybrid-params.js"></script>
  <script type="text/babel" src="components/bias-panel.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const PRESETS = {
      numbered: "SKU-8821 保修几年？",
      spoken: "杯子裂了怎么退？",
    };
    const EXPECTED = {
      numbered: "sku-8821",
      spoken: "shipping-damage",
    };

    function App() {
      const [env, setEnv] = useState({ port: 50089, provider: "—", model: "—", embeddingModel: "—", hasKey: false, callsModel: true });
      const [alpha, setAlpha] = useState(0.5);
      const [normalize, setNormalize] = useState(true);
      const [status] = useState("就绪");

      useEffect(() => {
        fetch("/health").then((r) => r.json()).then((d) => {
          setEnv({
            port: d.port,
            provider: d.provider ?? "—",
            model: d.model ?? "—",
            embeddingModel: d.embeddingModel ?? "—",
            hasKey: Boolean(d.hasKey),
            callsModel: Boolean(d.callsModel),
          });
        }).catch(() => {});
      }, []);

      return (
        <div className="min-h-screen bg-gray-50">
          <header id="page-header" className="border-b p-4 bg-white flex justify-between items-center">
            <h1 id="page-title" className="text-lg font-semibold">
              BM25 / 混合检索 · 第三步（step-3）· RRF + 按问题调 α
            </h1>
            <span id="status-pill" className="text-xs px-2 py-1 rounded bg-gray-200">{status}</span>
          </header>

          <main id="page-main" className="max-w-5xl mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                不想对齐分数时，可以用 <strong>RRF（只看名次）</strong>。带货号的问题可以把 α 调低（更信 BM25）。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>先跑「偏置检测」→ 采用建议 α</li>
                <li>再看「加权 vs RRF」对照</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 text-xs space-y-1">
                <div className="font-semibold text-yellow-900">本页核心</div>
                <div>RRF = 名次投票，不比 0.81 和 12.4。α 可按问题类型自动偏一下。</div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <DemoUI.HybridParams alpha={alpha} setAlpha={setAlpha} normalize={normalize} setNormalize={setNormalize} />
              <DemoUI.BiasPanel
                alpha={alpha}
                onApplyAlpha={setAlpha}
                normalize={normalize}
                presets={PRESETS}
                expected={EXPECTED}
              />
            </section>

            <section id="output" className="space-y-3">
              <DemoUI.RankCompare
                title={`加权 vs RRF · 例子 A（当前 α=${alpha.toFixed(2)}）`}
                question={PRESETS.numbered}
                alpha={alpha}
                normalize={normalize}
                expectedCardId={EXPECTED.numbered}
              />
              <DemoUI.RankCompare
                title={`加权 vs RRF · 例子 B（当前 α=${alpha.toFixed(2)}）`}
                question={PRESETS.spoken}
                alpha={alpha}
                normalize={normalize}
                expectedCardId={EXPECTED.spoken}
              />
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 {env.port} · {env.provider} · {env.model} · 嵌入 {env.embeddingModel} · 密钥 {env.hasKey ? "✅" : "❌"} · 调模型 {env.callsModel ? "✅" : "❌"}
            </span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
