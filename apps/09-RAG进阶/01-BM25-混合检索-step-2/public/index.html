<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BM25 / 混合检索 · 第二步</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="text/babel" src="components/hybrid-card.js"></script>
  <script type="text/babel" src="components/compare-normalize.js"></script>
  <script type="text/babel" src="components/hybrid-params.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const EXAMPLES = [
      { id: "a", label: "例子 A（带货号）", q: "SKU-8821 保修几年？", expect: "sku-8821" },
      { id: "b", label: "例子 B（日常说法）", q: "杯子裂了怎么退？", expect: "shipping-damage" },
    ];

    function App() {
      const [env, setEnv] = useState({ port: 50088, provider: "—", model: "—", embeddingModel: "—", hasKey: false, callsModel: true });
      const [exampleId, setExampleId] = useState("a");
      const [question, setQuestion] = useState(EXAMPLES[0].q);
      const [expect, setExpect] = useState(EXAMPLES[0].expect);
      const [alpha, setAlpha] = useState(0.5);
      const [normalize, setNormalize] = useState(true);
      const [busy, setBusy] = useState(false);
      const [status, setStatus] = useState("⏸ 待跑");
      const [errorText, setErrorText] = useState("");
      const [hybrid, setHybrid] = useState(null);

      useEffect(() => {
        fetch("/health").then((r) => r.json()).then((d) => {
          setEnv({
            port: d.port,
            provider: d.provider ?? "—",
            model: d.model ?? "—",
            embeddingModel: d.embeddingModel ?? "—",
            hasKey: Boolean(d.hasKey),
            callsModel: Boolean(d.callsModel),
          });
        }).catch(() => {});
      }, []);

      function pickExample(ex) {
        setExampleId(ex.id);
        setQuestion(ex.q);
        setExpect(ex.expect);
        setHybrid(null);
        setErrorText("");
        setStatus("⏸ 待跑");
      }

      async function runHybrid() {
        if (!question.trim()) {
          setStatus("❌ 错误");
          setErrorText("问句不能为空");
          return;
        }
        setBusy(true);
        setStatus("🔄 请求中");
        setErrorText("");
        try {
          const response = await fetch("/api/search-hybrid", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, alpha, normalize, topK: 3 }),
          });
          const json = await response.json();
          if (!json.ok) {
            setStatus("❌ 错误");
            setErrorText(json.error || "请求失败");
            return;
          }
          setHybrid(json.result);
          setStatus("✅ 完成");
        } catch (e) {
          setStatus("❌ 错误");
          setErrorText(String(e));
        } finally {
          setBusy(false);
        }
      }

      return (
        <div className="min-h-screen bg-gray-50">
          <header id="page-header" className="border-b p-4 bg-white flex justify-between items-center">
            <h1 id="page-title" className="text-lg font-semibold">
              BM25 / 混合检索 · 第二步（step-2）· 两边召回再加权
            </h1>
            <span id="status-pill" className={"text-xs px-2 py-1 rounded " + (status.startsWith("❌") ? "bg-red-100 text-red-800" : "bg-gray-200")}>
              {status}
            </span>
          </header>

          <main id="page-main" className="max-w-5xl mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                向量和 BM25 <strong>各出一份榜</strong>，再合成一份。分数刻度不同，必须先拉齐，α 才有意义。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>调 α / 是否拉齐 → 点「跑混合」</li>
                <li>看来源徽标（只向量 / 只 BM25 / 两侧都有）</li>
                <li>再点下方「未拉齐 vs 拉齐」对照，看硬加会翻车</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 text-xs space-y-1">
                <div className="font-semibold text-yellow-900">本页核心</div>
                <div>混合 = 两边各自召回再融合，不是先过滤。余弦分和 BM25 分不能直接加。</div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <DemoUI.HybridParams alpha={alpha} setAlpha={setAlpha} normalize={normalize} setNormalize={setNormalize} />
              <div className="flex flex-wrap gap-2">
                {EXAMPLES.map((ex) => (
                  <button
                    key={ex.id}
                    className={"text-xs px-2 py-1 rounded border " + (exampleId === ex.id ? "bg-blue-600 text-white border-blue-600" : "bg-white")}
                    onClick={() => pickExample(ex)}
                  >
                    {ex.label}
                  </button>
                ))}
              </div>
              <input
                className="w-full border rounded px-2 py-1 text-sm"
                value={question}
                onChange={(e) => setQuestion(e.target.value)}
              />
              <button className="text-sm px-3 py-1 bg-green-600 text-white rounded disabled:opacity-50" disabled={busy} onClick={runHybrid}>
                跑混合（/api/search-hybrid）
              </button>
              {errorText ? <div className="text-xs text-red-700">{errorText}</div> : null}
            </section>

            <section id="output" className="space-y-3">
              <DemoUI.HybridCard title="混合结果" status={hybrid ? "✅" : "⏸"} result={hybrid} expectedCardId={expect} />
              <DemoUI.NormalizeCompare
                title="对照：未拉齐 vs 拉齐后（同一问题、同一 α）"
                question={question}
                alpha={alpha}
                expectedCardId={expect}
              />
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 {env.port} · {env.provider} · {env.model} · 嵌入 {env.embeddingModel} · 密钥 {env.hasKey ? "✅" : "❌"} · 调模型 {env.callsModel ? "✅" : "❌"}
            </span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
