<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BM25 / 混合检索 · 第一步</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="text/babel" src="components/corpus-list.js"></script>
  <script type="text/babel" src="components/result-row.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const EXAMPLES = [
      { id: "a", label: "例子 A（带货号）", q: "SKU-8821 保修几年？", expect: "sku-8821", tip: "向量容易漏；BM25 容易中" },
      { id: "b", label: "例子 B（日常说法）", q: "杯子裂了怎么退？", expect: "shipping-damage", tip: "向量容易中；BM25 容易漏" },
    ];

    function Side({ title, scoreLabel, status, result, expect, side }) {
      return (
        <div className="bg-white border border-gray-300 rounded p-3 space-y-2">
          <div className="text-sm font-semibold">{title}</div>
          <div className="text-xs text-gray-500">{status}</div>
          {!result ? (
            <div className="text-xs text-gray-400">（还没跑）</div>
          ) : (
            <ol className="list-none space-y-0">
              {result.rows.map((row) => (
                <DemoUI.ResultRow
                  key={row.cardId}
                  row={row}
                  scoreLabel={scoreLabel}
                  side={side}
                  isHit={row.cardId === expect}
                  queryTokens={result.tokens || []}
                />
              ))}
            </ol>
          )}
        </div>
      );
    }

    function App() {
      const [env, setEnv] = useState({ port: 50087, provider: "—", model: "—", embeddingModel: "—", hasKey: false, callsModel: true });
      const [corpus, setCorpus] = useState(null);
      const [exampleId, setExampleId] = useState("a");
      const [question, setQuestion] = useState(EXAMPLES[0].q);
      const [expect, setExpect] = useState(EXAMPLES[0].expect);
      const [busy, setBusy] = useState(false);
      const [status, setStatus] = useState("⏸ 待跑");
      const [errorText, setErrorText] = useState("");
      const [vector, setVector] = useState(null);
      const [bm25, setBm25] = useState(null);

      useEffect(() => {
        fetch("/health").then((r) => r.json()).then((d) => {
          setEnv({
            port: d.port,
            provider: d.provider ?? "—",
            model: d.model ?? "—",
            embeddingModel: d.embeddingModel ?? "—",
            hasKey: Boolean(d.hasKey),
            callsModel: Boolean(d.callsModel),
          });
        }).catch(() => {});
        fetch("/api/corpus").then((r) => r.json()).then((d) => {
          if (d.ok) setCorpus(d.result);
        }).catch(() => {});
      }, []);

      function pickExample(ex) {
        setExampleId(ex.id);
        setQuestion(ex.q);
        setExpect(ex.expect);
        setVector(null);
        setBm25(null);
        setErrorText("");
        setStatus("⏸ 待跑");
      }

      async function run(which) {
        if (!question.trim()) {
          setStatus("❌ 错误");
          setErrorText("问句不能为空");
          return;
        }
        setBusy(true);
        setStatus("🔄 请求中");
        setErrorText("");
        const url = which === "vector" ? "/api/search-vector" : "/api/search-bm25";
        try {
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });
          const json = await response.json();
          if (!json.ok) {
            setStatus("❌ 错误");
            setErrorText(json.error || "请求失败");
            return;
          }
          if (which === "vector") setVector(json.result);
          else setBm25(json.result);
          setStatus("✅ 完成");
        } catch (e) {
          setStatus("❌ 错误");
          setErrorText(String(e));
        } finally {
          setBusy(false);
        }
      }

      const tip = EXAMPLES.find((e) => e.id === exampleId)?.tip || "";

      return (
        <div className="min-h-screen bg-gray-50">
          <header id="page-header" className="border-b p-4 bg-white flex justify-between items-center">
            <h1 id="page-title" className="text-lg font-semibold">
              BM25 / 混合检索 · 第一步（step-1）· 向量 vs BM25
            </h1>
            <span id="status-pill" className={"text-xs px-2 py-1 rounded " + (status.startsWith("❌") ? "bg-red-100 text-red-800" : "bg-gray-200")}>
              {status}
            </span>
          </header>

          <main id="page-main" className="max-w-5xl mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                同一库、同一问题，分别走<strong>向量</strong>和 <strong>BM25</strong>，看谁能捞到该中的卡。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>选一个例子（或自己改问题）</li>
                <li>分别点「跑向量」「跑 BM25」（两次独立请求）</li>
                <li>看两边 Top-K：绿标「该中的卡」进没进名单</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 text-xs space-y-1">
                <div className="font-semibold text-yellow-900">本页核心</div>
                <div>货号必须对上字 → 向量常漏、BM25 常中。日常说法字面不同 → 反过来。</div>
              </div>
            </section>

            <section className="bg-white shadow rounded p-4 space-y-2">
              <div className="text-sm font-semibold">知识库（6 张卡）</div>
              <DemoUI.CorpusList corpus={corpus} />
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="flex flex-wrap gap-2">
                {EXAMPLES.map((ex) => (
                  <button
                    key={ex.id}
                    className={"text-xs px-2 py-1 rounded border " + (exampleId === ex.id ? "bg-blue-600 text-white border-blue-600" : "bg-white")}
                    onClick={() => pickExample(ex)}
                  >
                    {ex.label}
                  </button>
                ))}
              </div>
              <div className="text-xs text-gray-500">当前例子预期：{tip}</div>
              <input
                className="w-full border rounded px-2 py-1 text-sm"
                value={question}
                onChange={(e) => setQuestion(e.target.value)}
                placeholder="输入要搜的问题"
              />
              <div className="flex flex-wrap gap-2">
                <button className="text-sm px-3 py-1 bg-blue-600 text-white rounded disabled:opacity-50" disabled={busy} onClick={() => run("vector")}>
                  跑向量（/api/search-vector）
                </button>
                <button className="text-sm px-3 py-1 bg-blue-600 text-white rounded disabled:opacity-50" disabled={busy} onClick={() => run("bm25")}>
                  跑 BM25（/api/search-bm25）
                </button>
              </div>
              {errorText ? <div className="text-xs text-red-700">{errorText}</div> : null}
            </section>

            <section id="output" className="grid grid-cols-1 md:grid-cols-2 gap-3">
              <Side title="向量侧" scoreLabel="余弦=" status={vector ? "✅" : "⏸"} result={vector} expect={expect} side="vector" />
              <Side title="BM25 侧" scoreLabel="BM25=" status={bm25 ? "✅" : "⏸"} result={bm25} expect={expect} side="bm25" />
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 {env.port} · {env.provider} · {env.model} · 嵌入 {env.embeddingModel} · 密钥 {env.hasKey ? "✅" : "❌"} · 调模型 {env.callsModel ? "✅" : "❌"}
            </span>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
