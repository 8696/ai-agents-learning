<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>先规划再执行 vs 一步步走 · 第四步（短任务对照）</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="/utils/compare-metrics.js"></script>
  <script type="text/babel" src="/components/round-card.js"></script>
  <script type="text/babel" src="/components/plan-panel.js"></script>
  <script type="text/babel" src="/components/metrics-strip.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { RoundCard, PlanPanel, MetricsStrip } = window.DemoUI;
    const FALLBACK_PORT = 50056;

    function App() {
      const [env, setEnv] = useState({ port: FALLBACK_PORT, provider: null, model: null, hasKey: false, callsModel: true });
      const [shortA, setShortA] = useState(null);
      const [shortB, setShortB] = useState(null);
      const [longA, setLongA] = useState(null);
      const [longB, setLongB] = useState(null);
      const [busy, setBusy] = useState(false);
      const [errMsg, setErrMsg] = useState("");

      const noKey = env.callsModel && !env.hasKey;
      const any = shortA || shortB || longA || longB;
      const pillStatus = busy ? "loading" : (errMsg ? "err" : (any ? "ok" : "idle"));

      useEffect(() => {
        fetch("/health").then((r) => r.json()).then((j) => {
          setEnv({ port: j.port, provider: j.provider, model: j.model, hasKey: j.hasKey, callsModel: j.callsModel });
        }).catch(() => {});
      }, []);

      async function fetchJson(url) {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }

      async function runShort() {
        setBusy(true); setErrMsg("");
        try {
          const [a, b] = await Promise.all([
            fetchJson("/api/step-by-step?task=short"),
            fetchJson("/api/plan-and-execute?task=short"),
          ]);
          setShortA(a); setShortB(b);
        } catch (e) {
          setErrMsg(String(e && e.message ? e.message : e));
        } finally { setBusy(false); }
      }

      async function runLong() {
        setBusy(true); setErrMsg("");
        try {
          const [a, b] = await Promise.all([
            fetchJson("/api/step-by-step?task=long"),
            fetchJson("/api/plan-and-execute?task=long"),
          ]);
          setLongA(a); setLongB(b);
        } catch (e) {
          setErrMsg(String(e && e.message ? e.message : e));
        } finally { setBusy(false); }
      }

      async function runAll() {
        setBusy(true); setErrMsg("");
        try {
          const [sa, sb, la, lb] = await Promise.all([
            fetchJson("/api/step-by-step?task=short"),
            fetchJson("/api/plan-and-execute?task=short"),
            fetchJson("/api/step-by-step?task=long"),
            fetchJson("/api/plan-and-execute?task=long"),
          ]);
          setShortA(sa); setShortB(sb); setLongA(la); setLongB(lb);
        } catch (e) {
          setErrMsg(String(e && e.message ? e.message : e));
        } finally { setBusy(false); }
      }

      const comparison = window.DemoUtils.buildComparison(shortA, shortB, longA, longB);

      function colA(title, data) {
        return (
          <div className="border border-gray-200 rounded p-3 space-y-3">
            <div className="text-sm font-semibold text-gray-800">{title}</div>
            {!data ? <div className="text-xs text-gray-400">还没跑这一组</div> : (
              <div className="space-y-2">
                <div className="text-xs text-gray-500">{data.trajectory.length} 圈 · 模型 {data.summary.modelCalls} 次</div>
                {data.trajectory.map((round) => <RoundCard key={round.index} round={round} />)}
                <div className="text-xs text-green-900 bg-green-50 border border-green-300 rounded p-2">最终答案：{data.finalAnswer}</div>
              </div>
            )}
          </div>
        );
      }

      function colB(title, data) {
        return (
          <div className="border border-gray-200 rounded p-3 space-y-3">
            <div className="text-sm font-semibold text-gray-800">{title}</div>
            {!data ? <div className="text-xs text-gray-400">还没跑这一组</div> : (
              <div className="space-y-2">
                <div className="text-xs text-gray-500">{data.plannerIterations} 个 plan · {data.executeTrace.length} 步</div>
                <PlanPanel data={data} />
                <div className="text-xs text-green-900 bg-green-50 border border-green-300 rounded p-2">最终答案：{data.finalAnswer}</div>
              </div>
            )}
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              先规划再执行 vs 一步步走 · 第四步（step-4） · 短任务 vs 长任务对照
            </h1>
            <span id="status-pill" className={
              "text-xs px-2 py-1 rounded " +
              (pillStatus === "loading" ? "bg-blue-100 text-blue-800" :
               pillStatus === "ok" ? "bg-green-100 text-green-800" :
               pillStatus === "err" ? "bg-red-100 text-red-800" : "bg-gray-200 text-gray-700")
            }>
              {pillStatus === "loading" ? "🔄 请求中" : pillStatus === "ok" ? "✅ 完成" : pillStatus === "err" ? "❌ 错误" : "⏸ 待连接"}
            </span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="problem-card" className="bg-orange-50 border-2 border-orange-400 rounded p-4 space-y-2">
              <div className="text-sm font-bold text-orange-900">❓ 实际场景 + 核心问题（先看这个）</div>
              <div className="text-xs text-gray-700">短任务：下班路上「把 todo-001 标完成」—— 30 秒能点一下。</div>
              <div className="text-xs text-gray-700">长任务：春季上新要拉库存、写文案、通知运营 —— 错了得到处补。</div>
              <div className="text-sm text-orange-900 mt-2 font-semibold">→ 核心问题：什么时候值得先规划，什么时候直接干？</div>
            </section>

            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示：短任务「把 todo-001 标完成」vs 长任务「春季上新」。四组各自请求，对照数字在浏览器算。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>点「跑短对照」→ GET /api/step-by-step?task=short 和 GET /api/plan-and-execute?task=short（两次 fetch）</li>
                <li>点「跑长对照」→ 同上，task=long（两次 fetch）</li>
                <li>点「四组一起」→ 浏览器并发四次 fetch，不是服务端一个接口打包</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  <b>什么时候不值得先规划</b>：任务只要 1-2 步、用户急着看第一个动作 → 一步步走更值。先规划多付一次规划调用，第一次行动还更晚。
                </div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="text-sm text-gray-500">四组各自请求 · 可以只跑短、只跑长，或四组一起</div>
              <div className="flex flex-wrap items-center gap-3">
                <button id="run-short" onClick={runShort} disabled={busy || noKey} className="bg-gray-700 text-white px-4 py-2 rounded text-sm disabled:opacity-50">跑短对照（两次 fetch）</button>
                <button id="run-long" onClick={runLong} disabled={busy || noKey} className="bg-blue-700 text-white px-4 py-2 rounded text-sm disabled:opacity-50">跑长对照（两次 fetch）</button>
                <button id="run-all" onClick={runAll} disabled={busy || noKey} className="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50">四组一起（四次 fetch）</button>
              </div>
              {errMsg ? <div className="text-sm text-red-700 bg-red-50 border border-red-300 rounded p-2">错误：{errMsg}</div> : null}
            </section>

            <MetricsStrip comparison={comparison} />

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!any ? (
                <div className="text-sm text-gray-500">空态：还没点按钮。会出现 2x2：短 A / 短 B / 长 A / 长 B。</div>
              ) : (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  <div id="col-short-a">{colA("短任务 · A 一步步走", shortA)}</div>
                  <div id="col-short-b">{colB("短任务 · B 先规划", shortB)}</div>
                  <div id="col-long-a">{colA("长任务 · A 一步步走", longA)}</div>
                  <div id="col-long-b">{colB("长任务 · B 先规划", longB)}</div>
                </div>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 {env.port} · 协议 A · 模型服务商 {env.provider ?? "—"} · 模型 {env.model ?? "—"} · 密钥 {env.hasKey ? "✅" : "❌（未配 Key → 主按钮 disabled）"}
            </span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
