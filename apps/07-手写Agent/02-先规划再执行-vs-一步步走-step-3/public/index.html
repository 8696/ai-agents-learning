<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>先规划再执行 vs 一步步走 · 第三步（重规划）</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="/utils/compare-metrics.js"></script>
  <script type="text/babel" src="/components/round-card.js"></script>
  <script type="text/babel" src="/components/plan-panel.js"></script>
  <script type="text/babel" src="/components/metrics-strip.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { RoundCard, PlanPanel, MetricsStrip } = window.DemoUI;
    const FALLBACK_PORT = 50055;

    function App() {
      const [leftStatus, setLeftStatus] = useState("idle");
      const [rightStatus, setRightStatus] = useState("idle");
      const [env, setEnv] = useState({ port: FALLBACK_PORT, provider: null, model: null, hasKey: false, callsModel: true });
      const [left, setLeft] = useState(null);
      const [right, setRight] = useState(null);
      const [errMsg, setErrMsg] = useState("");

      const busy = leftStatus === "loading" || rightStatus === "loading";
      const noKey = env.callsModel && !env.hasKey;
      const pillStatus = busy ? "loading" : (errMsg ? "err" : ((left || right) ? "ok" : "idle"));

      useEffect(() => {
        fetch("/health").then((r) => r.json()).then((j) => {
          setEnv({ port: j.port, provider: j.provider, model: j.model, hasKey: j.hasKey, callsModel: j.callsModel });
        }).catch(() => {});
      }, []);

      async function runLeft() {
        setLeftStatus("loading");
        setErrMsg("");
        try {
          const res = await fetch("/api/step-by-step");
          if (!res.ok) throw new Error("HTTP " + res.status);
          setLeft(await res.json());
          setLeftStatus("ok");
        } catch (e) {
          setErrMsg(String(e && e.message ? e.message : e));
          setLeftStatus("err");
        }
      }

      async function runRight() {
        setRightStatus("loading");
        setErrMsg("");
        try {
          const res = await fetch("/api/plan-and-execute");
          if (!res.ok) throw new Error("HTTP " + res.status);
          setRight(await res.json());
          setRightStatus("ok");
        } catch (e) {
          setErrMsg(String(e && e.message ? e.message : e));
          setRightStatus("err");
        }
      }

      async function runBoth() {
        setErrMsg("");
        await Promise.all([runLeft(), runRight()]);
      }

      const comparison = window.DemoUtils.buildComparison(left, right);

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              先规划再执行 vs 一步步走（Plan-and-Execute vs ReAct） · 第三步（step-3） · 重规划增量
            </h1>
            <span id="status-pill" className={
              "text-xs px-2 py-1 rounded " +
              (pillStatus === "loading" ? "bg-blue-100 text-blue-800" :
               pillStatus === "ok" ? "bg-green-100 text-green-800" :
               pillStatus === "err" ? "bg-red-100 text-red-800" : "bg-gray-200 text-gray-700")
            }>
              {pillStatus === "loading" ? "🔄 请求中" : pillStatus === "ok" ? "✅ 完成" : pillStatus === "err" ? "❌ 错误" : "⏸ 待连接"}
            </span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="problem-card" className="bg-orange-50 border-2 border-orange-400 rounded p-4 space-y-2">
              <div className="text-sm font-bold text-orange-900">❓ 实际场景 + 核心问题（先看这个）</div>
              <div className="text-xs text-gray-700">CI 写死 lint → test → build → deploy。test 挂了还按旧清单 deploy，还是停下来重规划？</div>
              <div className="text-xs text-gray-700">春季上新查到 SKU-90 库存 0 —— 按旧清单写不存在商品的文案，还是换成「标记缺货 + 通知采购」？</div>
              <div className="text-sm text-orange-900 mt-2 font-semibold">→ 核心问题：世界变了怎么办？什么时候值得重规划？</div>
            </section>

            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示：B 路径执行每步后检测关键变化（库存 0）→ 再调规划器吐新清单 → 右栏能看见计划 v1 灰卡 → v2 绿卡。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>点「跑左栏」→ GET /api/step-by-step</li>
                <li>点「跑右栏」→ GET /api/plan-and-execute（含 shouldReplan，最多 3 版）</li>
                <li>点「同时对照」→ 浏览器并发两个请求</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  看变化就盯一个动作：<b>执行阶段如果观察推翻了原计划，能不能换 plan</b>。能 → 重规划；不能 → 计划过期仍执行（错的）。右栏 v1 灰卡 / v2 绿卡 + 每步 planVersion。
                </div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="text-sm text-gray-500">每侧自己的请求 · 可以只跑一栏，也可以同时对照</div>
              <div className="flex flex-wrap items-center gap-3">
                <button id="run-left" onClick={runLeft} disabled={busy || noKey} className="bg-gray-700 text-white px-4 py-2 rounded text-sm disabled:opacity-50">跑左栏（一步步走）</button>
                <button id="run-right" onClick={runRight} disabled={busy || noKey} className="bg-blue-700 text-white px-4 py-2 rounded text-sm disabled:opacity-50">跑右栏（先规划 + 重规划）</button>
                <button id="run-compare" onClick={runBoth} disabled={busy || noKey} className="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50">同时对照（浏览器发两次请求）</button>
              </div>
              {errMsg ? <div className="text-sm text-red-700 bg-red-50 border border-red-300 rounded p-2">错误：{errMsg}</div> : null}
            </section>

            <MetricsStrip comparison={comparison} />

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!left && !right ? (
                <div className="text-sm text-gray-500">空态：还没点按钮。右栏触发库存 0 时会出现计划 v1 灰卡 → v2 绿卡。</div>
              ) : (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  <div id="col-step-by-step" className="border border-gray-200 rounded p-3 space-y-3">
                    <div className="text-sm font-semibold text-gray-800">左栏 · 一步步走（ReAct）</div>
                    {!left ? <div className="text-xs text-gray-400">还没跑左栏</div> : (
                      <div className="space-y-3">
                        <div className="text-xs text-gray-500">{left.trajectory.length} 圈 · 模型调用 {left.summary.modelCalls} 次</div>
                        {left.trajectory.map((round) => <RoundCard key={round.index} round={round} />)}
                        <div className="text-xs text-green-900 bg-green-50 border border-green-300 rounded p-2">最终答案：{left.finalAnswer}</div>
                      </div>
                    )}
                  </div>
                  <div id="col-plan-and-execute" className="border border-gray-200 rounded p-3 space-y-3">
                    <div className="text-sm font-semibold text-gray-800">右栏 · 先规划再执行（含重规划）</div>
                    {!right ? <div className="text-xs text-gray-400">还没跑右栏</div> : (
                      <div className="space-y-3">
                        <div className="text-xs text-gray-500">
                          规划 {right.plannerIterations} 次{right.plannerIterations > 1 ? "（v1 → v" + right.plannerIterations + " 重规划）" : ""} + 执行 {right.executeTrace.length} 步
                        </div>
                        <PlanPanel data={right} />
                        <div className="text-xs text-green-900 bg-green-50 border border-green-300 rounded p-2">最终答案：{right.finalAnswer}</div>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 {env.port} · 协议 A · 模型服务商 {env.provider ?? "—"} · 模型 {env.model ?? "—"} · 密钥 {env.hasKey ? "✅" : "❌（未配 Key → 主按钮 disabled）"}
            </span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
