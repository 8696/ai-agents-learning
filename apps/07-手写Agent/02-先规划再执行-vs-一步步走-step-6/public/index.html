<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>先规划再执行 vs 一步步走 · 第六步（计划给人看）</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="/utils/compare-metrics.js"></script>
  <script type="text/babel" src="/components/round-card.js"></script>
  <script type="text/babel" src="/components/plan-panel.js"></script>
  <script type="text/babel" src="/components/metrics-strip.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { RoundCard, PlanPanel, MetricsStrip } = window.DemoUI;
    const FALLBACK_PORT = 50058;

    function App() {
      const [env, setEnv] = useState({ port: FALLBACK_PORT, provider: null, model: null, hasKey: false, callsModel: true });
      const [left, setLeft] = useState(null);
      const [leftStatus, setLeftStatus] = useState("idle");
      const [right, setRight] = useState(null);
      const [planStage, setPlanStage] = useState("idle");
      const [sessionId, setSessionId] = useState(null);
      const [rightBusy, setRightBusy] = useState(false);
      const [errMsg, setErrMsg] = useState("");

      const noKey = env.callsModel && !env.hasKey;
      const leftBusy = leftStatus === "loading";
      const pillStatus = (leftBusy || rightBusy) ? "loading" : (errMsg ? "err" : ((left || right) ? "ok" : "idle"));

      useEffect(() => {
        fetch("/health").then((r) => r.json()).then((j) => {
          setEnv({ port: j.port, provider: j.provider, model: j.model, hasKey: j.hasKey, callsModel: j.callsModel });
        }).catch(() => {});
      }, []);

      async function runLeft() {
        setLeftStatus("loading"); setErrMsg("");
        try {
          const res = await fetch("/api/step-by-step");
          if (!res.ok) throw new Error("HTTP " + res.status);
          setLeft(await res.json()); setLeftStatus("ok");
        } catch (e) {
          setErrMsg(String(e && e.message ? e.message : e)); setLeftStatus("err");
        }
      }

      async function startPlan() {
        setRightBusy(true); setErrMsg("");
        try {
          const res = await fetch("/api/plan");
          if (!res.ok) throw new Error("HTTP " + res.status);
          const j = await res.json();
          setRight(j); setSessionId(j.sessionId); setPlanStage("planned");
        } catch (e) {
          setErrMsg(String(e && e.message ? e.message : e));
        } finally { setRightBusy(false); }
      }

      async function confirmPlan() {
        if (!sessionId) return;
        setRightBusy(true); setErrMsg("");
        try {
          const res = await fetch("/api/confirm-plan", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId: sessionId }),
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const j = await res.json();
          setRight(j); setPlanStage("executed");
        } catch (e) {
          setErrMsg(String(e && e.message ? e.message : e));
        } finally { setRightBusy(false); }
      }

      const comparison = window.DemoUtils.buildComparison(left, right);

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              先规划再执行 vs 一步步走 · 第六步（step-6） · 变体 F 计划给人看
            </h1>
            <span id="status-pill" className={
              "text-xs px-2 py-1 rounded " +
              (pillStatus === "loading" ? "bg-blue-100 text-blue-800" :
               pillStatus === "ok" ? "bg-green-100 text-green-800" :
               pillStatus === "err" ? "bg-red-100 text-red-800" : "bg-gray-200 text-gray-700")
            }>
              {pillStatus === "loading" ? "🔄 请求中" : pillStatus === "ok" ? "✅ 完成" : pillStatus === "err" ? "❌ 错误" : "⏸ 待连接"}
            </span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="problem-card" className="bg-orange-50 border-2 border-orange-400 rounded p-4 space-y-2">
              <div className="text-sm font-bold text-orange-900">❓ 实际场景 + 核心问题（先看这个）</div>
              <div className="text-xs text-gray-700">打款 / 上线 / 删数据之前，清单要先给人看一眼。没点头就不许动手。</div>
              <div className="text-sm text-orange-900 mt-2 font-semibold">→ 核心问题：计划列出来后，人点头了吗？确认前有没有副作用？</div>
            </section>

            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示：右栏先只要计划（GET /api/plan，status=pending），人点确认才执行（POST /api/confirm-plan）。左栏一步步走是独立按钮，互不绑定。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>左栏「跑一步步走」→ GET /api/step-by-step（和右栏无关）</li>
                <li>右栏「开始规划」→ GET /api/plan → 只返回 sessionId + plans，不 invokeTool</li>
                <li>右栏「确认执行」→ POST /api/confirm-plan {"{ sessionId }"} → 只执行已保存的计划，不再跑左栏</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  变体 F 的核心 = <b>确认前无副作用</b>。没点确认 = 规划器吐的清单不会跑；点了才 invokeTool。左栏和右栏确认互不绑定。
                </div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="text-sm text-gray-500">左栏独立 · 右栏两阶段（idle → planned → executed）</div>
              <div className="flex flex-wrap items-center gap-3">
                <button id="run-left" onClick={runLeft} disabled={leftBusy || noKey} className="bg-gray-700 text-white px-4 py-2 rounded text-sm disabled:opacity-50">跑左栏（一步步走）</button>
                <button id="start-plan" onClick={startPlan} disabled={rightBusy || noKey} className="bg-blue-700 text-white px-4 py-2 rounded text-sm disabled:opacity-50">
                  {planStage === "idle" ? "开始规划（只 plan 不执行）" : "重新规划"}
                </button>
                {planStage === "planned" ? (
                  <button id="confirm-plan" onClick={confirmPlan} disabled={rightBusy} className="bg-orange-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50">确认执行（只跑已保存的计划）</button>
                ) : null}
              </div>
              {errMsg ? <div className="text-sm text-red-700 bg-red-50 border border-red-300 rounded p-2">错误：{errMsg}</div> : null}
            </section>

            <MetricsStrip comparison={comparison} />

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!left && !right ? (
                <div className="text-sm text-gray-500">空态：左栏和右栏互不绑定。右栏确认前看不到执行卡。</div>
              ) : (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  <div id="col-step-by-step" className="border border-gray-200 rounded p-3 space-y-3">
                    <div className="text-sm font-semibold text-gray-800">左栏 · 一步步走（独立）</div>
                    {!left ? <div className="text-xs text-gray-400">还没跑左栏 · 点「跑左栏」</div> : (
                      <div className="space-y-3">
                        {left.trajectory.map((round) => <RoundCard key={round.index} round={round} />)}
                        <div className="text-xs text-green-900 bg-green-50 border border-green-300 rounded p-2">最终答案：{left.finalAnswer}</div>
                      </div>
                    )}
                  </div>
                  <div id="col-plan-and-execute" className="border border-gray-200 rounded p-3 space-y-3">
                    <div className="flex items-baseline justify-between">
                      <div className="text-sm font-semibold text-gray-800">右栏 · 先规划（两阶段）</div>
                      <div className={"text-xs px-2 py-0.5 rounded " + (
                        planStage === "planned" ? "bg-orange-100 text-orange-900" :
                        planStage === "executed" ? "bg-green-100 text-green-900" : "bg-gray-100 text-gray-600"
                      )}>
                        {planStage === "planned" ? "⏸ 待确认" : planStage === "executed" ? "✅ 已执行" : "—"}
                      </div>
                    </div>
                    {!right ? <div className="text-xs text-gray-400">还没规划 · 点「开始规划」</div> : (
                      <div className="space-y-3">
                        <PlanPanel data={right} planStage={planStage} />
                        {planStage === "executed" && right.finalAnswer ? (
                          <div className="text-xs text-green-900 bg-green-50 border border-green-300 rounded p-2">最终答案：{right.finalAnswer}</div>
                        ) : null}
                      </div>
                    )}
                  </div>
                </div>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 {env.port} · 协议 A · 模型服务商 {env.provider ?? "—"} · 模型 {env.model ?? "—"} · 密钥 {env.hasKey ? "✅" : "❌（未配 Key → 主按钮 disabled）"}
            </span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
