<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>死循环防护 · 第五步</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const FALLBACK_PORT = 50063;

    function App() {
      const [flakyRate, setFlakyRate] = useState(0.5);
      const [toolMaxRetries, setToolMaxRetries] = useState(3);
      const [query, setQuery] = useState("查 SKU-001 / SKU-002 / SKU-003 的库存，完成后输出 final_answer");
      const [env, setEnv] = useState({ port: FALLBACK_PORT, provider: null, model: null, hasKey: false, callsModel: true });
      const [flakyResult, setFlakyResult] = useState(null);
      const [alwaysFailResult, setAlwaysFailResult] = useState(null);
      const [status, setStatus] = useState("idle");
      const [errMsg, setErrMsg] = useState("");

      useEffect(() => {
        fetch("/health").then((r) => r.json()).then((j) => {
          setEnv({ port: j.port, provider: j.provider, model: j.model, hasKey: j.hasKey, callsModel: j.callsModel });
        }).catch(() => {});
      }, []);

      const busy = status === "loading";
      const pillText =
        status === "loading" ? "🔄 请求中" :
        status === "ok"      ? "✅ 完成" :
        status === "err"     ? "❌ 错误" : "⏸ 待连接";
      const pillClass =
        status === "loading" ? "bg-blue-100 text-blue-800" :
        status === "ok"      ? "bg-green-100 text-green-800" :
        status === "err"     ? "bg-red-100 text-red-800" : "bg-gray-200 text-gray-700";

      async function callApi(path, setResult) {
        setStatus("loading");
        setErrMsg("");
        try {
          const res = await fetch(path, { method: "POST" });
          if (res.status === 400) {
            const body = await res.json().catch(() => ({}));
            setErrMsg(`${body.error || "参数不合法"}（HTTP 400 · 第二类错误）`);
            setStatus("err");
            return;
          }
          if (res.status >= 500) {
            const body = await res.json().catch(() => ({}));
            setErrMsg(`服务错误：HTTP ${res.status}（${body.error || "请看 logs/"}）`);
            setStatus("err");
            return;
          }
          if (!res.ok) throw new Error("HTTP " + res.status);
          setResult(await res.json());
          setStatus("ok");
        } catch (e) {
          setErrMsg(`请求失败：${String((e && e.message) || e)}（网络 / fetch reject · 第一类错误）`);
          setStatus("err");
        }
      }

      function MetricsCard({ title, result, accent }) {
        if (!result) {
          return (
            <div className="border border-gray-200 rounded p-3 space-y-2">
              <div className="text-sm font-semibold text-gray-800">{title}</div>
              <div className="text-xs text-gray-400">还没跑 · 点对应按钮</div>
            </div>
          );
        }
        const tone =
          result.stoppedReason === "tool_retry_cap" ? "border-red-300 bg-red-50" :
          result.stoppedReason === "model_says_stop" ? "border-green-300 bg-green-50" :
          "border-gray-300 bg-white";
        const retries = result.trajectory?.flatMap(s => {
          const lines = [];
          const t = s.toolResult;
          if (t && t.failedAttempts > 0) {
            lines.push(`step${s.stepIndex}：${t.attempt - t.failedAttempts}→${t.attempt}（失败 ${t.failedAttempts} 次 ${t.ok ? "后成功" : "仍失败"}）`);
          }
          return lines;
        }) ?? [];
        return (
          <div className={`border-2 rounded p-3 space-y-2 ${tone}`}>
            <div className="text-sm font-semibold text-gray-800">{title}</div>
            <div className="grid grid-cols-2 gap-2 text-xs">
              <div><span className="text-gray-500">已跑轮数（stepCount）：</span><b>{result.stepCount}</b></div>
              <div><span className="text-gray-500">工具调用次数（toolCallCount）：</span><b>{result.toolCallCount}</b></div>
              <div><span className="text-gray-500">工具失败次数（toolFailureCount）：</span><b>{result.toolFailureCount}</b></div>
              <div><span className="text-gray-500">重试成功次数（toolRetrySuccessCount）：</span><b>{result.toolRetrySuccessCount}</b></div>
              <div><span className="text-gray-500">实际耗时（elapsedMs）：</span><b>{result.summary.elapsedMs} ms</b></div>
              <div><span className="text-gray-500">停下来的原因（stoppedReason）：</span><b>{result.stoppedReason}</b></div>
              <div className="col-span-2"><span className="text-gray-500">闸门提示（gateTriggered）：</span><b className="break-all">{result.gateTriggered ?? "—"}</b></div>
              {result.summary.toolUnavailable ? (
                <div className="col-span-2 bg-orange-50 border border-orange-300 rounded p-2">
                  <span className="text-gray-500">工具状态（toolUnavailable）：</span><b className="text-orange-900">✅ 已降级 · 告诉用户这条工具不可用</b>
                </div>
              ) : null}
            </div>
            {retries.length > 0 ? (
              <div className="text-xs bg-blue-50 border border-blue-200 rounded p-2">
                <span className="text-gray-500">重试轨迹：</span>
                {retries.map((l, i) => <div key={i} className="font-mono">{l}</div>)}
              </div>
            ) : null}
            <div className="text-xs text-gray-600">{accent}</div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              死循环防护（Loop Guard） · 第五步（step-5） · 工具重试上限 闸（变体 5 · 偶发失败 vs 100% 失败）
            </h1>
            <span id="status-pill" className={`text-xs px-2 py-2 rounded ${pillClass}`}>
              {pillText}
            </span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">本页只演示：<b>工具重试上限 闸（变体 5）</b>。单次工具调用失败时，按指数退避重试 N 次；都失败就降级告诉用户「这条工具不可用」，不让 Agent 整个死。</p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>点「跑 偶发失败」→ POST /api/agent/with-retry → flakyRate 概率失败；3 次重试；通常第 2-3 次成功</li>
                <li>点「跑 100% 失败」→ POST /api/agent/always-fail → 3 次重试全失败；stoppedReason=tool_retry_cap + 工具状态=已降级</li>
                <li>数字面板看 toolCallCount / toolFailureCount / toolRetrySuccessCount —— 一眼看出重试闸的吸收能力</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  <b>工具重试 = 在「工具层」加的闸门</b>，跟 while 条件的 max iterations / timeout / user_cancel 不同层。闸门 5 生效时，**单次网络抖动**会被吸收（重试 2/3 成功），**真正不可用**会被降级（tool_unavailable）。Agent 不会因为一次 500 / 网络断就死。
                </div>
                <div className="text-xs text-gray-600">
                  看结果盯四个数 + 一段话：<b>工具调用次数（toolCallCount）</b> · <b>工具失败次数（toolFailureCount）</b> · <b>重试成功次数（toolRetrySuccessCount）</b> · <b>停下来的原因（stoppedReason · 取值 max_steps / timeout / model_says_stop / user_cancel / tool_retry_cap）</b> · <b>工具状态（toolUnavailable）</b>。
                </div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="text-sm text-gray-500">两个按钮各发一条请求 · 数字面板并排对照</div>
              <div className="flex flex-wrap items-center gap-3">
                <label className="text-xs text-gray-700 flex items-center gap-2">
                  偶发失败概率（flakyRate · 0~1）：
                  <input id="input-flaky-rate" type="number" min="0" max="1" step="0.1" value={flakyRate} onChange={(e) => setFlakyRate(Math.min(1, Math.max(0, Number(e.target.value) || 0)))} className="border border-gray-300 rounded px-2 py-1 text-xs w-16" />
                </label>
                <label className="text-xs text-gray-700 flex items-center gap-2">
                  工具重试上限（toolMaxRetries · 次）：
                  <input id="input-tool-max-retries" type="number" min="0" max="10" value={toolMaxRetries} onChange={(e) => setToolMaxRetries(Math.max(0, Number(e.target.value) || 0))} className="border border-gray-300 rounded px-2 py-1 text-xs w-16" />
                </label>
              </div>
              <div className="flex flex-col gap-1">
                <label className="text-xs text-gray-700">模型任务（query · 真模型用）：</label>
                <textarea id="input-query" value={query} onChange={(e) => setQuery(e.target.value)} rows={2} className="border border-gray-300 rounded px-2 py-1 text-xs" />
              </div>
              <div className="flex flex-wrap items-center gap-3">
                <button id="run-with-retry" onClick={() => callApi(`/api/agent/with-retry?flakyRate=${flakyRate}&toolMaxRetries=${toolMaxRetries}&query=${encodeURIComponent(query)}`, setFlakyResult)} disabled={busy} className="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50">
                  跑 偶发失败（flakyRate={flakyRate} · 重试上限={toolMaxRetries}）
                </button>
                <button id="run-always-fail" onClick={() => callApi(`/api/agent/always-fail?toolMaxRetries=${toolMaxRetries}&query=${encodeURIComponent(query)}`, setAlwaysFailResult)} disabled={busy} className="bg-red-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50">
                  跑 100% 失败（重试上限={toolMaxRetries} · 必降级）
                </button>
              </div>
              {errMsg ? <div className="text-sm text-red-700 bg-red-50 border border-red-300 rounded p-2">{errMsg}</div> : null}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!flakyResult && !alwaysFailResult ? (
                <div className="text-sm text-gray-500">空态：点「跑 偶发失败」看重试成功路径；点「跑 100% 失败」看重试全失败后降级路径。</div>
              ) : (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  <MetricsCard
                    title={`① 偶发失败（flakyRate=${flakyRate} · 重试上限=${toolMaxRetries}）`}
                    result={flakyResult}
                    accent="单次失败重试就够；Agent 继续 while 循环。验：toolCallCount 增加，但 stoppedReason 不应是 tool_retry_cap。"
                  />
                  <MetricsCard
                    title={`② 100% 失败（重试上限=${toolMaxRetries} · 必降级）`}
                    result={alwaysFailResult}
                    accent="3 次重试全失败 → 闸门 5 触发；stoppedReason=tool_retry_cap + 工具状态=已降级。验：不应继续 while 循环。"
                  />
                </div>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 {env.port} · 会调真模型 · 模型服务商 {env.provider ?? "—"} · 模型 {env.model ?? "—"} · 密钥 {env.hasKey ? "✅" : "❌"}
            </span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
