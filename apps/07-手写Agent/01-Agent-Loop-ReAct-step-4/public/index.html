<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Loop / ReAct · step-4 · 用户取消（变体 M）</title>

  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入（禁止换 CDN / 版本 / integrity） -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <!-- §5.3.4 强制：React 18.3.1 UMD CDN（普通 script，不用 module 也不用 importmap） -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- §5.3.4 强制：Babel Standalone 锁定 7.26.4 -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- §5.3.4 强制：JSX 块内不允许 TypeScript 语法 -->
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function fmtDue(due) {
      const today = new Date().toISOString().slice(0, 10);
      if (due === today) return "今天";
      const t = new Date(today).getTime();
      const d = new Date(due).getTime();
      const diff = Math.round((d - t) / (1000 * 60 * 60 * 24));
      if (diff === -1) return "昨天";
      if (diff === 1) return "明天";
      if (diff < 0) return `${-diff} 天前`;
      if (diff > 0) return `${diff} 天后`;
      return due;
    }

    function TodoRow({ todo, dueClass, showDone }) {
      return (
        <li className={
          "border rounded p-2 text-sm flex items-center justify-between gap-2 " +
          (todo.done
            ? (showDone ? "bg-green-50 border-green-300" : "bg-white border-gray-200")
            : (dueClass || "bg-white border-gray-300"))
        }>
          <div className="flex-1">
            <div className="flex items-center gap-2 text-xs text-gray-500">
              <span className="font-mono text-gray-400">{todo.id}</span>
              <span className="px-1.5 py-0.5 rounded bg-gray-100">{todo.tag}</span>
              <span>{fmtDue(todo.dueDate)} · {todo.dueDate}</span>
            </div>
            <div className={"mt-1 whitespace-pre-wrap " + (todo.done ? "line-through text-gray-400" : "")}>
              {todo.title}
            </div>
          </div>
          <span className={
            "text-xs px-2 py-0.5 rounded " +
            (todo.done
              ? "bg-green-200 text-green-800"
              : (dueClass === "bg-yellow-50 border-yellow-300" ? "bg-yellow-200 text-yellow-800" : "bg-gray-200 text-gray-700"))
          }>
            {todo.done ? "已完成" : "未完成"}
          </span>
        </li>
      );
    }

    function App() {
      const [query, setQuery] = useState("把逾期购物待办标完成（一次性）");
      // status 文案与色块（§5.3.10 三类区域）
      const [status, setStatus] = useState({ key: "idle", text: "⏸ 待连接" });
      const [health, setHealth] = useState(null);
      const [errorMsg, setErrorMsg] = useState("");
      const [errorKind, setErrorKind] = useState(null); // null | "4xx" | "5xx"
      const [todos, setTodos] = useState(null);
      // 当前正在跑的 runId（cancel 按钮用它发 /api/cancel/:runId）
      const [runId, setRunId] = useState(null);
      // 跑完后的完整 result（从 GET 拿）
      const [result, setResult] = useState(null);
      // 当前轮询的状态（中间进度显示「已跑 X 圈 / 已用 Y 秒」）
      const [progress, setProgress] = useState({ rounds: 0, elapsedMs: 0 });
      const inFlightRef = useRef(false);
      const pollTimerRef = useRef(null);

      // ── 页脚 /health 加载 + 初始数据加载 ──
      useEffect(() => {
        fetch("/health").then(r => r.json()).then(setHealth).catch(() => setHealth(null));
        fetch("/api/todos").then(r => r.json()).then(d => setTodos(d.todos)).catch(() => setTodos([]));
      }, []);

      // ── 卸载时清理轮询 ──
      useEffect(() => {
        return () => {
          if (pollTimerRef.current) {
            clearInterval(pollTimerRef.current);
            pollTimerRef.current = null;
          }
        };
      }, []);

      /** 启动轮询：每 800ms GET /api/agent-run/:runId，直到 status 非 running */
      function startPolling(runId) {
        // 清掉旧 timer
        if (pollTimerRef.current) clearInterval(pollTimerRef.current);
        const tick = async () => {
          try {
            const resp = await fetch(`/api/agent-run/${runId}`);
            if (resp.status === 202) {
              // 仍在跑；更新进度
              const data = await resp.json();
              setProgress({ rounds: data.elapsedMs ? Math.floor(data.elapsedMs / 2000) : progress.rounds, elapsedMs: data.elapsedMs });
              return;
            }
            if (resp.status === 200) {
              const data = await resp.json();
              clearInterval(pollTimerRef.current);
              pollTimerRef.current = null;
              inFlightRef.current = false;
              setResult(data);
              if (data.todosAfter) setTodos(data.todosAfter);
              const statusKey = data.status === "cancelled" ? "cancelled" : "done";
              const statusText = data.status === "cancelled"
                ? "🚫 已取消 · " + (data.stoppedReason === "cancelled" ? "用户取消（变体 M）" : "其他")
                : "✅ Loop 已停 · " + (data.stoppedReason === "final_answer" ? "最终答案" : data.stoppedReason === "max_rounds" ? "达到最大轮次（兜底）" : "其他");
              setStatus({ key: statusKey, text: statusText });
              return;
            }
            if (resp.status === 502) {
              const data = await resp.json().catch(() => ({}));
              clearInterval(pollTimerRef.current);
              pollTimerRef.current = null;
              inFlightRef.current = false;
              setErrorKind("5xx");
              setErrorMsg(`${502} · ${data.error || ""} ${data.message || ""}`.trim());
              setStatus({ key: "error", text: "❌ 错误" });
              return;
            }
            if (resp.status === 404) {
              clearInterval(pollTimerRef.current);
              pollTimerRef.current = null;
              inFlightRef.current = false;
              setErrorKind("5xx");
              setErrorMsg("runId 不存在（可能服务端重启过）");
              setStatus({ key: "error", text: "❌ 错误" });
              return;
            }
          } catch (err) {
            clearInterval(pollTimerRef.current);
            pollTimerRef.current = null;
            inFlightRef.current = false;
            setErrorKind("5xx");
            setErrorMsg(`网络错误：${(err && err.message) || err}`);
            setStatus({ key: "error", text: "❌ 错误" });
          }
        };
        // 立即 tick 一次（不等 800ms）
        tick();
        pollTimerRef.current = setInterval(tick, 800);
      }

      async function runAgent() {
        if (inFlightRef.current) return;
        if (health && !health.hasKey) {
          setErrorMsg("apps/.env 没配当前 LLM_PROVIDER 的 Key（看页脚 密钥 ❌）");
          setErrorKind("5xx");
          return;
        }
        setErrorMsg("");
        setErrorKind(null);
        setResult(null);
        setProgress({ rounds: 0, elapsedMs: 0 });
        inFlightRef.current = true;
        setStatus({ key: "running", text: "🔄 Loop 跑中" });

        try {
          const resp = await fetch("/api/agent-run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query }),
          });
          if (resp.status === 202) {
            // 立刻返 202 + runId → 进入轮询
            const data = await resp.json();
            setRunId(data.runId);
            startPolling(data.runId);
            return;
          }
          // 4xx / 5xx（参数错 / 无Key）
          const data = await resp.json().catch(() => ({}));
          const kind = resp.status >= 500 ? "5xx" : "4xx";
          setErrorKind(kind);
          const detail = data.issues
            ? ` · ${data.issues.map(i => i.message || JSON.stringify(i)).join("；")}`
            : "";
          setErrorMsg(`${resp.status} · ${data.error || ""} ${data.message || ""}${detail}`.trim());
          setStatus({ key: "error", text: "❌ 错误" });
          inFlightRef.current = false;
        } catch (err) {
          setErrorKind("5xx");
          setErrorMsg(`网络错误：${(err && err.message) || err}`);
          setStatus({ key: "error", text: "❌ 错误" });
          inFlightRef.current = false;
        }
      }

      async function cancelRun() {
        if (!runId) return;
        setStatus({ key: "cancelling", text: "🚫 取消中 · 等 Loop 退出" });
        try {
          await fetch(`/api/cancel/${runId}`, { method: "POST" });
          // 轮询会继续直到 status=cancelled；不需要在这里 clearInterval
        } catch (err) {
          // 取消失败的话，轮询自然到 done 也会停
          setErrorMsg(`取消请求失败：${(err && err.message) || err}`);
        }
      }

      async function simulateUpstreamError() {
        if (inFlightRef.current) return;
        setErrorMsg("");
        setErrorKind(null);
        setResult(null);
        inFlightRef.current = true;
        setStatus({ key: "running", text: "🔄 请求中" });
        try {
          const resp = await fetch("/api/agent-force-error", { method: "POST" });
          const data = await resp.json();
          setErrorKind("5xx");
          setErrorMsg(`${resp.status} · ${data.error || ""} ${data.message || ""}`.trim());
          setStatus({ key: "error", text: "❌ 错误" });
        } catch (err) {
          setErrorKind("5xx");
          setErrorMsg(`网络错误：${(err && err.message) || err}`);
          setStatus({ key: "error", text: "❌ 错误" });
        } finally {
          inFlightRef.current = false;
        }
      }

      const runDisabled = inFlightRef.current || (health && !health.hasKey);
      const cancelDisabled = !runId || !["running"].includes(status.key);

      function dueClass(todo) {
        const today = new Date().toISOString().slice(0, 10);
        if (todo.dueDate < today && !todo.done) return "bg-yellow-50 border-yellow-300";
        return "";
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              Agent Loop / ReAct（手写 Agent 循环） · 第四步（step-4） · 用户取消（变体 M）
            </h1>
            <span id="status-pill" className={
              "text-xs px-2 py-1 rounded " +
              (status.key === "running" || status.key === "cancelling" ? "bg-yellow-200" :
               status.key === "done"                    ? "bg-green-200" :
               status.key === "cancelled"               ? "bg-purple-200" :
               status.key === "error"                   ? "bg-red-200" :
                                                          "bg-gray-200")
            }>{status.text}</span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">本页只演示：<b>用户中途点取消，Loop 立刻收到 AbortSignal，下一次 LLM 调用中断；trajectory 完整保留，能看清「跑到第几圈被取消」</b>。</p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>输入框写一句自然语言任务（默认「一次性把逾期购物待办标完成」会触发 ≥2 圈 Act 阶段，足够你按取消），点「跑 Agent」</li>
                <li>前端发 POST /api/agent-run → 后端立刻返 202 + runId（**不阻塞**），loop 异步在后台跑</li>
                <li>前端**轮询 GET /api/agent-run/:runId**（每 800ms 一次）拿进度</li>
                <li>「🚫 取消」按钮：发 POST /api/cancel/:runId → 后端 AbortController.abort() → 下一次 LLM 调用立刻抛 AbortError → loop break + stoppedReason="cancelled"</li>
                <li>轨迹区按圈展示每圈的 assistant 摘要 / tool_calls / tool_results / 耗时；最后一圈额外「🚫 已取消」紫卡</li>
                <li><b>状态徽标三态</b>：✅ 最终答案（绿） / ⚠ 兜底（黄） / 🚫 取消（紫）—— 错误两类分开看</li>
                <li><b>数据前后对照</b>：跑完 Agent 后下方「数据前后对照」三栏（before / after / diff） —— 取消时若 Act 已执行则看「已发出去没回滚」的条数；未执行则 diff 为空</li>
              </ol>
              {/* 核心教学点卡片（§5.3.11.b 强制） */}
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  Agent Loop 的第四种停法 = <b>用户取消（变体 M）</b>：<code className="bg-white px-1 rounded">AbortController.abort()</code> → 下一次 LLM 调用立刻抛 <code className="bg-white px-1 rounded">AbortError</code> → while 检测 <code className="bg-white px-1 rounded">signal.aborted</code> 退出 → <code className="bg-white px-1 rounded">stoppedReason = "cancelled"</code>。
                  关键设计：POST 立刻返 202 + runId（不阻塞 HTTP），前端轮询拿结果，「取消」是**独立**的一笔请求，不是断开主连接。
                  关键边界：<b>已发出的 tool handler 不被取消</b>（变体 M 的妥协）—— 让那一圈 Act 跑完，trajectory 仍完整保留能看见「跑到哪圈被取消」。
                </div>
                <div className="text-xs text-gray-600">
                  怎么观察：跑一次 → 在「圈 2 Promise.all 同圈并行 4 个 complete_todo」的中间点取消 → 期望 stoppedReason=cancelled · trajectory 保留圈 1 完整 + 圈 2 的 tool_result + 最后轨迹标「🚫 取消」 · 状态徽标变紫。
                  然后看「数据前后对照」三栏：被取消时若 Act 已完成部分 → diff 列出「已发出没回滚的」条数；若在圈 1 取消 → diff 为空。
                  想看其它停止条件（K 最大轮次 / L 超时）→ 后续 step（**不在本 step 范围**）。
                </div>
              </div>
            </section>

            {/* ── 初始数据区 ── */}
            <section id="todos-initial" className="bg-white shadow rounded p-4 space-y-2">
              <div className="flex items-center justify-between">
                <div className="text-sm text-gray-700">
                  <b>当前 todo 列表（内存里的事实 · Loop 改的就是它）</b> · 共 {todos ? todos.length : "?"} 条
                </div>
                <button
                  id="btn-refresh-todos"
                  className="border border-gray-300 px-2 py-1 rounded text-xs"
                  onClick={() => fetch("/api/todos").then(r => r.json()).then(d => setTodos(d.todos)).catch(() => {})}
                >刷新</button>
              </div>
              {!todos ? (
                <div className="text-xs text-gray-400">（加载中 · 等 /api/todos 返回）</div>
              ) : (
                <ul className="space-y-2">
                  {todos.map(t => (
                    <TodoRow key={t.id} todo={t} dueClass={dueClass(t)} showDone={true} />
                  ))}
                </ul>
              )}
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="text-sm text-gray-500">给模型一句话任务（默认会跑 ≥2 圈，足够你点取消）：</div>
              <textarea
                id="user-input"
                className="w-full border border-gray-300 rounded p-2 text-sm"
                rows="2"
                placeholder="比如：一次性把逾期购物待办都标完成"
                value={query}
                onChange={e => setQuery(e.target.value)}
              />
              <div className="flex flex-wrap gap-2">
                <button
                  id="btn-run-agent"
                  className="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50"
                  onClick={runAgent}
                  disabled={runDisabled}
                >跑 Agent（点了真调 LLM 跑一整轮 Loop）</button>
                <button
                  id="btn-cancel"
                  className="bg-purple-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50"
                  onClick={cancelRun}
                  disabled={cancelDisabled}
                  title={cancelDisabled ? "没在跑不能取消" : "点这里中断 loop · 下一次 LLM 调用立刻抛 AbortError"}
                >🚫 取消（变体 M · AbortController.abort()）</button>
                <button
                  id="btn-simulate-error"
                  className="border border-orange-300 text-orange-700 px-4 py-2 rounded text-sm"
                  onClick={simulateUpstreamError}
                >演示上游失败（5xx · 类 B 错误）</button>
              </div>
              {/* 进度条：只在 running / cancelling 显示 */}
              {(status.key === "running" || status.key === "cancelling") && runId && (
                <div className="text-xs text-gray-500 bg-gray-50 border border-gray-200 rounded p-2">
                  <div>runId：<code className="bg-white px-1 rounded">{runId}</code></div>
                  <div className="mt-1">状态：{status.text} · 已用时 ≈ {Math.round(progress.elapsedMs / 1000)} 秒</div>
                </div>
              )}
              {errorMsg ? (
                <div
                  id="error-box"
                  className={
                    "text-xs px-3 py-2 rounded border " +
                    (errorKind === "5xx"
                      ? "border-red-300 bg-red-50 text-red-700"
                      : "border-yellow-300 bg-yellow-50 text-yellow-800")
                  }
                >
                  <div className="font-semibold">
                    {errorKind === "5xx" ? "上游失败（5xx）" : "入参校验失败（4xx）"}
                  </div>
                  <div className="mt-1">{errorMsg}</div>
                </div>
              ) : null}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!result ? (
                <div className="text-xs text-gray-400">
                  {status.key === "running" || status.key === "cancelling"
                    ? "（跑中 · 每 800ms 轮询拿一次结果 · 点「🚫 取消」可中断）"
                    : "（还没跑 · 点「跑 Agent」会真发请求到模型，按圈展开 trajectory）"}
                </div>
              ) : (
                <div className="space-y-3">
                  <div className="flex items-center justify-between text-sm">
                    <div className="text-gray-700">
                      <b>轨迹（trajectory · Loop 一圈一张卡）</b> · 共 <b>{result.rounds}</b> 圈 · 停止原因：
                      <span className={
                        "ml-1 px-2 py-0.5 rounded text-xs " +
                        (result.stoppedReason === "final_answer" ? "bg-green-50 border border-green-300 text-green-800" :
                         result.stoppedReason === "cancelled"   ? "bg-purple-50 border border-purple-300 text-purple-800" :
                                                                "bg-yellow-50 border border-yellow-300 text-yellow-800")
                      }>
                        {result.stoppedReason === "final_answer" ? "最终答案（变体 J）" :
                         result.stoppedReason === "cancelled"   ? "用户取消（变体 M）" :
                                                                "达到最大轮次（兜底 · 不指望触发）"}
                      </span>
                    </div>
                    <div className="text-xs text-gray-500">任务：<b>{result.query}</b></div>
                  </div>

                  {result.trajectory.map((step, idx) => {
                    // step-4 教学点：被取消时 trajectory 最后一圈标红（仅在 status===cancelled 且这是最后一圈）
                    const isCancelledFinalRound = result.status === "cancelled" && idx === result.trajectory.length - 1;
                    return (
                      <div
                        key={idx}
                        className={
                          "border rounded p-3 space-y-2 bg-white " +
                          (isCancelledFinalRound ? "border-purple-400 bg-purple-50" : "border-gray-300")
                        }
                      >
                        <div className="flex items-center justify-between text-sm">
                          <div className="font-semibold text-gray-800">
                            第 <b>{step.round}</b> 圈 {isCancelledFinalRound && <span className="ml-2 text-purple-700 text-xs">🚫 用户取消（变体 M · 这一圈跑完才检测到 signal.aborted）</span>}
                          </div>
                          <div className="text-xs text-gray-500">≈ {step.elapsedMs} ms</div>
                        </div>

                        {/* Reason 阶段 */}
                        <div className="bg-gray-50 border border-gray-300 rounded p-2 text-xs">
                          <div className="font-semibold text-gray-700 mb-1">Reason（调模型）</div>
                          {step.assistant.content ? (
                            <div className="whitespace-pre-wrap mb-1">{step.assistant.content}</div>
                          ) : (
                            <div className="text-gray-400 italic mb-1">（assistant.content 为空 · 模型本圈纯调工具）</div>
                          )}
                          {step.assistant.tc.length === 0 ? (
                            <div className="text-green-700">
                              → <b>tool_calls 为空 · 最终答案</b>（变体 J · Loop 在本圈 break）
                            </div>
                          ) : (
                            <div className="space-y-1">
                              <div className="text-gray-600">→ 要调 {step.assistant.tc.length} 个工具：</div>
                              {step.assistant.tc.map((tc, i) => (
                                <div key={tc.id} className="bg-white border border-gray-200 rounded p-1 text-gray-700">
                                  <span className="text-gray-500">#{i + 1}</span>{" "}
                                  <b>{tc.function.name}</b>(
                                  <span className="font-mono text-gray-600">{tc.function.arguments}</span>
                                  ) · id={tc.id}
                                </div>
                              ))}
                            </div>
                          )}
                        </div>

                        {/* Act + Observe 阶段 */}
                        {step.toolResults.length > 0 && (
                          <div className="border border-green-300 bg-green-50 rounded p-2 text-xs">
                            <div className="font-semibold text-green-800 mb-1">
                              Act + Observe（执行工具 → tool_result 塞回 messages）
                            </div>
                            <div className="space-y-2">
                              {step.toolResults.map((tr, i) => {
                                let parsed = null;
                                try { parsed = JSON.parse(tr.content); } catch {}
                                const isErr = parsed && parsed.ok === false;
                                return (
                                  <div
                                    key={tr.tool_call_id}
                                    className={
                                      "rounded p-2 border " +
                                      (isErr
                                        ? "bg-red-50 border-red-300 text-red-800"
                                        : "bg-white border-green-300 text-gray-800")
                                    }
                                  >
                                    <div className="flex items-center justify-between mb-1">
                                      <div>
                                        <span className="text-gray-500">#{i + 1}</span>{" "}
                                        <b>{tr.name}</b>(
                                        <span className="font-mono">{JSON.stringify(tr.arguments)}</span>)
                                      </div>
                                      <span className={"text-xs px-2 py-0.5 rounded " + (isErr ? "bg-red-200" : "bg-green-200")}>
                                        {isErr ? "失败" : "成功"}
                                      </span>
                                    </div>
                                    <pre className="whitespace-pre-wrap text-gray-700 max-h-32 overflow-auto bg-gray-50 rounded p-1">
                                      {parsed ? JSON.stringify(parsed, null, 2) : tr.content}
                                    </pre>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}

                  {/* 最终答案：绿卡（仅当 stoppedReason === "final_answer"） */}
                  {result.stoppedReason === "final_answer" && (
                    <div className="border border-green-300 bg-green-50 rounded p-3 space-y-1">
                      <div className="text-sm font-semibold text-green-900">
                        最终答案（变体 J · assistant 正文即答案 · 下一圈不会再来）
                      </div>
                      <div className="whitespace-pre-wrap text-sm text-green-900">
                        {result.finalAnswer || "（模型本圈无正文 · 罕见）"}
                      </div>
                    </div>
                  )}

                  {/* step-4 主教学卡片：取消时显示 */}
                  {result.status === "cancelled" && (
                    <div className="border border-purple-300 bg-purple-50 rounded p-3 space-y-2">
                      <div className="text-sm font-semibold text-purple-900">
                        🚫 用户取消（变体 M · Loop 收到 AbortSignal 后主动退出）
                      </div>
                      <div className="text-xs text-gray-700">
                        跑到第 <b>{result.rounds}</b> 圈后用户点了「取消」按钮 →
                        后端 <code className="bg-white px-1 rounded">AbortController.abort()</code> →
                        下一次 LLM 调用抛 <code className="bg-white px-1 rounded">AbortError</code> →
                        while 检测 <code className="bg-white px-1 rounded">signal.aborted</code> → break →
                        <code className="bg-white px-1 rounded">stoppedReason = "cancelled"</code>。
                      </div>
                      <div className="text-xs text-gray-700">
                        <b>关键边界</b>：<b>已发出的 tool handler 不被取消</b>（变体 M 的妥协）—— 让那一圈 Act 跑完，
                        trajectory 仍完整保留能看见「跑到哪圈被取消」。对照 MD 例子 5「知识库已发出则在轨迹写『用户取消』」。
                      </div>
                      <div className="text-xs text-green-700">
                        验证「变体 M」= status === <code className="bg-white px-1 rounded">cancelled</code>（不是 error）+ stoppedReason === <code className="bg-white px-1 rounded">cancelled</code>（不是 max_rounds）+ trajectory 保留到取消前的最后一圈 + diff 显示「已发出没回滚」的条数。
                      </div>
                    </div>
                  )}

                  {/* ── 数据前后对照：before / after / diff 三栏 ── */}
                  <div className="border border-gray-300 rounded p-3 space-y-2 bg-white">
                    <div className="flex items-center justify-between text-sm">
                      <div className="font-semibold text-gray-800">
                        数据前后对照（Loop 在内存里真改了什么）
                      </div>
                      <div className="text-xs text-gray-500">
                        diff 改了 <b>{result.diff.changed.length}</b> 条 ·{" "}
                        其中 <b className="text-green-700">{result.diff.summary.completedCount}</b> 条 done false → true
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                      <div className="bg-gray-50 border border-gray-300 rounded p-2">
                        <div className="text-xs font-semibold text-gray-700 mb-1">
                          Before（跑 Agent 之前 · {result.todosBefore.length} 条）
                        </div>
                        <ul className="space-y-1">
                          {result.todosBefore.map(t => (
                            <TodoRow key={t.id} todo={t} dueClass={dueClass(t)} showDone={false} />
                          ))}
                        </ul>
                      </div>
                      <div className="bg-green-50 border border-green-300 rounded p-2">
                        <div className="text-xs font-semibold text-green-800 mb-1">
                          After（跑完 / 取消时 · {result.todosAfter.length} 条）
                        </div>
                        <ul className="space-y-1">
                          {result.todosAfter.map(t => (
                            <TodoRow key={t.id} todo={t} dueClass={""} showDone={true} />
                          ))}
                        </ul>
                      </div>
                      <div className="bg-yellow-50 border border-yellow-300 rounded p-2">
                        <div className="text-xs font-semibold text-yellow-900 mb-1">
                          Diff（只列被改的行 · {result.diff.changed.length} 条）
                          {result.status === "cancelled" && (
                            <span className="ml-2 text-purple-700 text-xs">· 取消时若 Act 已完成部分 → 这里列出「已发出没回滚」</span>
                          )}
                        </div>
                        {result.diff.changed.length === 0 ? (
                          <div className="text-xs text-gray-500">（无改动 · Loop 没动数据 / 取消时还没到 Act 阶段）</div>
                        ) : (
                          <ul className="space-y-1">
                            {result.diff.changed.map(c => (
                              <li key={c.id} className="border border-yellow-300 bg-white rounded p-2 text-xs">
                                <div className="flex items-center justify-between mb-1">
                                  <div>
                                    <span className="font-mono text-gray-400">{c.id}</span>{" "}
                                    <span className="px-1.5 py-0.5 rounded bg-gray-100">{c.tag}</span>
                                  </div>
                                  <span className="text-green-700 text-xs font-semibold">
                                    {c.from.done ? "未改动字段但 JSON 变了（罕见）" : "done: false → true"}
                                  </span>
                                </div>
                                <div className="text-gray-700">{c.title}</div>
                                <div className="mt-1 text-gray-500 text-xs">
                                  {fmtDue(c.from.dueDate)} ({c.from.dueDate}) → {fmtDue(c.to.dueDate)} ({c.to.dueDate})
                                </div>
                              </li>
                            ))}
                          </ul>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* 跑完 messages 形状 */}
                  <details className="border border-gray-300 rounded p-3 bg-gray-50">
                    <summary className="text-sm font-semibold text-gray-700 cursor-pointer">
                      跑完后完整 messages（点击展开 · 看 Loop 一圈一圈往里追加了什么）
                    </summary>
                    <pre className="mt-2 text-xs whitespace-pre-wrap max-h-96 overflow-auto bg-white border border-gray-200 rounded p-2">
                      {JSON.stringify(result.finalMessages, null, 2)}
                    </pre>
                  </details>
                </div>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 50052 · 协议 A（openai Chat Completions） · 模型服务商 {health?.provider ?? "(待连接)"} · 模型 {health?.model ?? "(待连接)"} · 密钥 {health?.hasKey ? "✅" : "❌"}
            </span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
