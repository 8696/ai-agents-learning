<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>死循环防护 · 第六步</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const FALLBACK_PORT = 50064;

    function App() {
      const [maxSteps, setMaxSteps] = useState(20);
      const [loopDetectionWindow, setLoopDetectionWindow] = useState(3);
      const [env, setEnv] = useState({ port: FALLBACK_PORT, provider: null, model: null, hasKey: false, callsModel: false });
      const [result, setResult] = useState(null);
      const [status, setStatus] = useState("idle");
      const [errMsg, setErrMsg] = useState("");

      useEffect(() => {
        fetch("/health").then((r) => r.json()).then((j) => {
          setEnv({ port: j.port, provider: j.provider, model: j.model, hasKey: j.hasKey, callsModel: j.callsModel });
        }).catch(() => {});
      }, []);

      const busy = status === "loading";
      const pillText =
        status === "loading" ? "🔄 请求中" :
        status === "ok"      ? "✅ 完成" :
        status === "err"     ? "❌ 错误" : "⏸ 待连接";
      const pillClass =
        status === "loading" ? "bg-blue-100 text-blue-800" :
        status === "ok"      ? "bg-green-100 text-green-800" :
        status === "err"     ? "bg-red-100 text-red-800" : "bg-gray-200 text-gray-700";

      async function callApi() {
        setStatus("loading");
        setErrMsg("");
        try {
          const res = await fetch(`/api/agent/loop-detection?maxSteps=${maxSteps}&loopDetectionWindow=${loopDetectionWindow}`, { method: "POST" });
          if (res.status === 400) {
            const body = await res.json().catch(() => ({}));
            setErrMsg(`${body.error || "参数不合法"}（HTTP 400 · 第二类错误）`);
            setStatus("err");
            return;
          }
          if (res.status >= 500) {
            setErrMsg(`服务错误：HTTP ${res.status}（请看 logs/）`);
            setStatus("err");
            return;
          }
          if (!res.ok) throw new Error("HTTP " + res.status);
          setResult(await res.json());
          setStatus("ok");
        } catch (e) {
          setErrMsg(`请求失败：${String((e && e.message) || e)}（网络 / fetch reject · 第一类错误）`);
          setStatus("err");
        }
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              死循环防护（Loop Guard） · 第六步（step-6） · 同工具循环检测 闸（变体 6）
            </h1>
            <span id="status-pill" className={`text-xs px-2 py-2 rounded ${pillClass}`}>
              {pillText}
            </span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">本页只演示：<b>同工具循环检测 闸（变体 6）</b>。mock 模型永远调 queryStock("SKU-LOOP")，连续 N 次同工具同参数 → 闸门 6 触发。</p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>点「跑 同工具循环检测」→ POST /api/agent/loop-detection → mock 模型每轮都问 SKU-LOOP 的库存</li>
                <li>闸门 6 看最近 N-1 步的工具调用是不是同工具同参数；是则 stoppedReason=tool_call_loop + loopDetected=true</li>
                <li>summary.recentToolCalls 列出最近 N 次调用的工具名 + 参数，看一眼就知道为什么被拦</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  <b>同工具循环检测 = 工具调用模式层面的死循环信号</b>。模型可能"思路死循环"——查同一个库存问三遍不出结果。闸门 6 看到了：最近 N 步全调同一个 tool 用同一组 args → 拦住，告诉模型「你卡住了，换思路」。它跟 max iterations 互补：max 看的是总轮数，loop detection 看的是模式。
                </div>
                <div className="text-xs text-gray-600">
                  看结果盯四个数 + 一段话：<b>已跑轮数（stepCount）</b> · <b>最近 N 步工具调用（recentToolCalls）</b> · <b>停下来的原因（stoppedReason · 取值 tool_call_loop）</b> · <b>循环标记（loopDetected）</b>。
                </div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="text-sm text-gray-500">单按钮演示 · 闸门 6 触发后 break</div>
              <div className="flex flex-wrap items-center gap-3">
                <label className="text-xs text-gray-700 flex items-center gap-2">
                  最大步数上限（maxSteps · 步）：
                  <input id="input-max-steps" type="number" min="1" max="1000" value={maxSteps} onChange={(e) => setMaxSteps(Math.max(1, Number(e.target.value) || 1))} className="border border-gray-300 rounded px-2 py-1 text-xs w-16" />
                </label>
                <label className="text-xs text-gray-700 flex items-center gap-2">
                  循环检测窗口（loopDetectionWindow · 连续次数）：
                  <input id="input-window" type="number" min="1" max="10" value={loopDetectionWindow} onChange={(e) => setLoopDetectionWindow(Math.max(1, Number(e.target.value) || 1))} className="border border-gray-300 rounded px-2 py-1 text-xs w-16" />
                </label>
                <button id="run-loop-detection" onClick={callApi} disabled={busy} className="bg-orange-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50">
                  跑 同工具循环检测（mock · SKU-LOOP 永远调）
                </button>
              </div>
              {errMsg ? <div className="text-sm text-red-700 bg-red-50 border border-red-300 rounded p-2">{errMsg}</div> : null}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!result ? (
                <div className="text-sm text-gray-500">空态：点「跑 同工具循环检测」看 mock 模型被闸门 6 拦在哪一步。</div>
              ) : (
                <div className="space-y-3">
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div><span className="text-gray-500">已跑轮数（stepCount）：</span><b>{result.stepCount}</b></div>
                    <div><span className="text-gray-500">实际耗时（elapsedMs）：</span><b>{result.summary.elapsedMs} ms</b></div>
                    <div><span className="text-gray-500">停下来的原因（stoppedReason）：</span><b>{result.stoppedReason}</b></div>
                    <div><span className="text-gray-500">循环标记（loopDetected）：</span><b>{String(result.summary.loopDetected)}</b></div>
                    <div className="col-span-2"><span className="text-gray-500">闸门提示（gateTriggered）：</span><b className="break-all">{result.gateTriggered ?? "—"}</b></div>
                  </div>
                  <div className="text-xs bg-blue-50 border border-blue-200 rounded p-2">
                    <div className="font-semibold text-blue-900 mb-1">最近 N 步工具调用（recentToolCalls）：</div>
                    {(result.summary.recentToolCalls ?? []).map((c, i) => (
                      <div key={i} className="font-mono">step {i + 1}：{c.name}({JSON.stringify(c.args)})</div>
                    ))}
                  </div>
                  <div className="text-xs text-gray-600">
                    教学：{result.stoppedReason === "tool_call_loop"
                      ? "✓ 闸门 6 生效（stoppedReason=tool_call_loop）—— 同一 queryStock(SKU-LOOP) 连调 N 次，模型思路死循环被拦。改 queryStock 查不同 sku 就能继续。验：recentToolCalls 全是同一组 args。"
                      : "—"}
                  </div>
                </div>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 {env.port} · 本地计算 · 不调 LLM · 模型服务商 {env.provider ?? "—"} · 模型 {env.model ?? "—"} · 密钥 {env.hasKey ? "✅" : "—"}
            </span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
