<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>先规划再执行 vs 一步步走 · 第一步</title>

  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入（禁止换 CDN / 版本 / integrity） -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <!-- §5.3.4 强制：React 18.3.1 UMD CDN（普通 script，不用 module 也不用 importmap） -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- §5.3.4 强制：Babel Standalone 锁定 7.26.4 -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── 与服务端约定的端口（§5.3.3 端口三处一致：runtime-ctx / package.json / 页脚 fallback）──
    const FALLBACK_PORT = 50053;

    function App() {
      const [status, setStatus] = useState("idle"); // idle | loading | ok | err
      const [env, setEnv] = useState({ port: FALLBACK_PORT, provider: null, model: null, hasKey: false, callsModel: false });
      const [data, setData] = useState(null);   // /api/compare 返回
      const [errMsg, setErrMsg] = useState("");

      // ── 加载时打一次 /health 填 #env-info ──
      useEffect(() => {
        fetch("/health").then(r => r.json()).then(j => {
          setEnv({ port: j.port, provider: j.provider, model: j.model, hasKey: j.hasKey, callsModel: j.callsModel });
        }).catch(() => { /* 静默；fallback 仍可用 */ });
      }, []);

      async function runCompare() {
        setStatus("loading");
        setErrMsg("");
        try {
          const res = await fetch("/api/compare");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const j = await res.json();
          setData(j);
          setStatus("ok");
        } catch (e) {
          setErrMsg(String(e?.message ?? e));
          setStatus("err");
        }
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              先规划再执行 vs 一步步走（Plan-and-Execute vs ReAct） · 第一步（step-1） · 双栏对照看差异
            </h1>
            <span id="status-pill" className={
              "text-xs px-2 py-1 rounded " +
              (status === "loading" ? "bg-blue-100 text-blue-800" :
               status === "ok"      ? "bg-green-100 text-green-800" :
               status === "err"     ? "bg-red-100 text-red-800" :
                                      "bg-gray-200 text-gray-700")
            }>
              {status === "loading" ? "🔄 请求中" :
               status === "ok"      ? "✅ 完成" :
               status === "err"     ? "❌ 错误" :
                                      "⏸ 待连接"}
            </span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">

            {/* ── #problem-card：先把实际场景 + 核心问题抛出来（让学习者带着问题看 demo）── */}
            <section id="problem-card" className="bg-orange-50 border-2 border-orange-400 rounded p-4 space-y-2">
              <div className="flex items-baseline justify-between">
                <div className="text-sm font-bold text-orange-900">❓ 实际场景 + 核心问题（先看这个）</div>
                <span className="text-xs text-orange-700">点完「跑对照」看 demo 自己回答</span>
              </div>
              <div className="space-y-1">
                <div className="text-xs text-gray-700">
                  <b className="text-orange-900">实际场景 1（去超市）：</b>出门前写清单「牛奶、鸡蛋、米」进门按清单拿 vs 走到冷柜看有没有再决定。
                </div>
                <div className="text-xs text-gray-700">
                  <b className="text-orange-900">实际场景 2（写 CI YAML）：</b>发布流水线 <i>lint → test → build → deploy</i> 写死一气呵成 vs 失败时跳过 test 继续 deploy。
                </div>
                <div className="text-xs text-gray-700">
                  <b className="text-orange-900">实际场景 3（客服查异常）：</b>用户问「为什么 3 次下单失败」→ 先查日志看是不是支付超时再决定下一步 vs 一上来就写退款流程。
                </div>
                <div className="text-sm text-orange-900 mt-2 font-semibold">
                  → 核心问题：<b>「先规划还是走一步看一步？什么时候选哪个？」</b> 哪种策略花钱更少、等得最短、还能办成事？
                </div>
              </div>
            </section>

            {/* ── #page-intro ── */}
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示：同一句任务「春季上新：拉库存、写有货 SKU 文案、通知运营」，分别用<b>一步步走（ReAct）</b>和<b>先规划再执行（Plan-and-Execute）</b>两条路径跑一次，<b>页面左右对照看节奏差异</b>。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>点「跑对照」按钮 → GET /api/compare → 后端并行跑两条轨迹（mock 模型 + mock 工具，不调真 LLM）</li>
                <li>左栏「一步步走」每圈 Reason 决定此刻调啥；右栏「先规划」先有计划这份对象再按清单执行</li>
                <li>对照卡用三个数字讲清差异：模型调用次数、第一次 Act 前等待、计划作为对象在第一次 Act 前是否存在</li>
              </ol>

              {/* §5.3.11.b 核心教学点卡片 */}
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  看差异就盯一个动作：<b>「计划作为对象在第一次 Act 之前是否已存在」</b>。
                  一步步走：没有；先规划再执行：有，且一次性给完整清单。
                </div>
                <div className="text-xs text-gray-600">
                  怎么观察：对照卡第三行（计划对象 A ❌ / B ✅）+ 右栏头部那张蓝绿色「计划 v1」卡（在执行卡之前），左栏对应位置直接是「执行圈 1」。
                </div>
              </div>
            </section>

            {/* ── #controls ── */}
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="text-sm text-gray-500">Demo 控制（1 个按钮 · 1 个任务输入框）</div>
              <div className="flex flex-wrap items-center gap-3">
                <button
                  id="run-compare"
                  onClick={runCompare}
                  disabled={status === "loading"}
                  className="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50"
                >
                  跑对照（mock 模型 + mock 工具 · 不调真 LLM）
                </button>
                <span className="text-xs text-gray-500">
                  点按钮：浏览器 fetch GET /api/compare → 后端并行跑两条轨迹 → 返回双栏 + 对照数字
                </span>
              </div>
              {status === "err" && (
                <div className="text-sm text-red-700 bg-red-50 border border-red-300 rounded p-2">
                  错误：{errMsg}
                </div>
              )}
            </section>

            {/* ── 对照卡（横跨顶部 · 三个关键数字）── */}
            {data && (
              <section id="comparison-strip" className="bg-white shadow rounded p-4 space-y-2">
                <div className="text-sm font-semibold text-gray-800">关键对照（看差异就看这三行）</div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div className="bg-gray-50 border border-gray-300 rounded p-3">
                    <div className="text-xs text-gray-600">模型调用次数（model calls）</div>
                    <div className="mt-1 text-sm">
                      <span className="text-gray-700">一步步走 A：</span>
                      <b className="text-red-700">{data.comparison.modelCallsA}</b>
                      <span className="text-gray-400">（每圈 Reason 都调）</span>
                    </div>
                    <div className="text-sm">
                      <span className="text-gray-700">先规划 B：</span>
                      <b className="text-green-700">{data.comparison.modelCallsB}</b>
                      <span className="text-gray-400">（只规划器 1 次 + 执行 0 次）</span>
                    </div>
                  </div>
                  <div className="bg-gray-50 border border-gray-300 rounded p-3">
                    <div className="text-xs text-gray-600">第一次 Act 前等待（pre-Act steps）</div>
                    <div className="mt-1 text-sm">
                      <span className="text-gray-700">一步步走 A：</span>
                      <b className="text-red-700">{data.comparison.preActStepsA}</b>
                      <span className="text-gray-400"> 步</span>
                    </div>
                    <div className="text-sm">
                      <span className="text-gray-700">先规划 B：</span>
                      <b className="text-blue-700">{data.comparison.preActStepsB}</b>
                      <span className="text-gray-400"> 步（先规划）</span>
                    </div>
                  </div>
                  <div className="bg-gray-50 border border-gray-300 rounded p-3">
                    <div className="text-xs text-gray-600">计划作为对象在第一次 Act 前（plan object）</div>
                    <div className="mt-1 text-sm">
                      <span className="text-gray-700">一步步走 A：</span>
                      <b className="text-red-700">不存在</b>
                    </div>
                    <div className="text-sm">
                      <span className="text-gray-700">先规划 B：</span>
                      <b className="text-green-700">存在</b>
                      <span className="text-gray-400">（一次性清单）</span>
                    </div>
                  </div>
                </div>
              </section>
            )}

            {/* ── #output：双栏对照 ── */}
            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!data && (
                <div className="text-sm text-gray-500">
                  空态：还没点「跑对照」。点了之后这里会出现左右两栏 —— 左栏一步步走 7 圈 Reason / Act / Observe 轨迹，右栏先规划 1 张计划卡 + 6 张执行卡 + 最终答案。
                </div>
              )}

              {data && (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  {/* ── 左栏：一步步走（变体 A · ReAct）── */}
                  <div id="col-step-by-step" className="border border-gray-200 rounded p-3 space-y-3">
                    <div className="flex items-baseline justify-between">
                      <div className="text-sm font-semibold text-gray-800">
                        左栏 · 一步步走（ReAct）
                      </div>
                      <div className="text-xs text-gray-500">
                        {data.stepByStep.trajectory.length} 圈 · 模型调用 {data.stepByStep.summary.modelCalls} 次
                      </div>
                    </div>
                    <div className="text-xs text-gray-500">
                      每圈 Reason 后才决定此刻调啥；下一个动作不能预先写死。
                    </div>

                    {data.stepByStep.trajectory.map((round) => (
                      <div key={round.index} className="border border-gray-300 bg-white rounded p-3 space-y-2">
                        <div className="flex items-baseline justify-between">
                          <div className="text-xs font-semibold text-gray-700">第 {round.index} 圈 · Reason</div>
                          <div className="text-xs text-gray-500">耗时 {round.costMs} ms</div>
                        </div>
                        <div className="text-xs text-gray-700 bg-gray-50 rounded p-2">
                          <span className="text-gray-500">想法：</span>{round.reason.thought}
                        </div>
                        {round.reason.tool_calls.length > 0 ? (
                          <div className="space-y-1">
                            <div className="text-xs text-gray-500">tool_calls（这一步调啥）</div>
                            {round.act.map((a, i) => (
                              <div key={i} className={
                                "text-xs rounded p-2 border " +
                                (a.ok ? "border-green-300 bg-green-50" : "border-red-300 bg-red-50")
                              }>
                                <div className="font-mono">{a.tool}({JSON.stringify(a.args)})</div>
                                <div className="text-gray-600 mt-1">
                                  tool_result：<span className="font-mono">{JSON.stringify(a.result)}</span>
                                </div>
                              </div>
                            ))}
                          </div>
                        ) : (
                          <div className="text-xs text-green-700 bg-green-50 border border-green-300 rounded p-2">
                            tool_calls 为空 → 最终答案
                          </div>
                        )}
                      </div>
                    ))}

                    <div className="text-xs text-green-900 bg-green-50 border border-green-300 rounded p-2">
                      最终答案（绿卡 · 模型输出）：{data.stepByStep.finalAnswer}
                    </div>
                  </div>

                  {/* ── 右栏：先规划再执行（变体 B）── */}
                  <div id="col-plan-and-execute" className="border border-gray-200 rounded p-3 space-y-3">
                    <div className="flex items-baseline justify-between">
                      <div className="text-sm font-semibold text-gray-800">
                        右栏 · 先规划再执行（Plan-and-Execute）
                      </div>
                      <div className="text-xs text-gray-500">
                        规划 1 次 + 执行 {data.planAndExecute.executeTrace.length} 步 · 模型调用 {data.planAndExecute.summary.planCalls} 次
                      </div>
                    </div>
                    <div className="text-xs text-gray-500">
                      第一次 Act 之前先有「计划」这份对象；执行阶段按清单调，不再问模型。
                    </div>

                    {/* 计划作为对象卡（位置：在「执行卡」之前 —— 就是「第一次 Act 之前」） */}
                    <div id="plan-card" className="border-2 border-blue-400 bg-blue-50 rounded p-3 space-y-2">
                      <div className="flex items-baseline justify-between">
                        <div className="text-xs font-semibold text-blue-900">计划 v1（plan · 第一次 Act 之前就存在）</div>
                        <div className="text-xs text-blue-700">模型调用 1 次</div>
                      </div>
                      <ol className="text-xs space-y-1">
                        {data.planAndExecute.plan.map((s) => (
                          <li key={s.index} className="font-mono text-blue-900">
                            {s.index}. {s.tool}({JSON.stringify(s.args)})
                            <span className="text-blue-700 font-sans"> · {s.reason}</span>
                          </li>
                        ))}
                      </ol>
                    </div>

                    {/* 执行卡（每步一张白卡） */}
                    <div className="text-xs text-gray-500">↓ 下面是「第一次 Act 之后」的执行阶段 ↓</div>
                    {data.planAndExecute.executeTrace.map((step) => (
                      <div key={step.index} className="border border-gray-300 bg-white rounded p-3 space-y-2">
                        <div className="flex items-baseline justify-between">
                          <div className="text-xs font-semibold text-gray-700">执行第 {step.index} 步</div>
                          <div className="text-xs text-gray-500">耗时 {step.costMs} ms</div>
                        </div>
                        <div className="text-xs text-gray-700 bg-gray-50 rounded p-2 font-mono">
                          {step.step.tool}({JSON.stringify(step.step.args)})
                        </div>
                        <div className={
                          "text-xs rounded p-2 border " +
                          (step.result.ok ? "border-green-300 bg-green-50" : "border-red-300 bg-red-50")
                        }>
                          <span className="text-gray-500">tool_result：</span>
                          <span className="font-mono">{JSON.stringify(step.result.result)}</span>
                        </div>
                      </div>
                    ))}

                    <div className="text-xs text-green-900 bg-green-50 border border-green-300 rounded p-2">
                      最终答案（绿卡 · 拼好的）：{data.planAndExecute.finalAnswer}
                    </div>
                  </div>
                </div>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 {env.port} · 本地计算 · 不调 LLM · 模型服务商 {env.provider ?? "—"} · 模型 {env.model ?? "—"} · 密钥 {env.hasKey ? "✅" : "—"}
            </span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
