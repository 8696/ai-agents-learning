<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>先规划再执行 vs 一步步走 · 第二步（全真模型）</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="/utils/compare-metrics.js"></script>
  <script type="text/babel" src="/components/round-card.js"></script>
  <script type="text/babel" src="/components/plan-panel.js"></script>
  <script type="text/babel" src="/components/metrics-strip.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { RoundCard, PlanPanel, MetricsStrip } = window.DemoUI;
    const FALLBACK_PORT = 50054;

    function App() {
      // leftStatus / rightStatus：两侧请求互不影响，可以只跑一栏
      const [leftStatus, setLeftStatus] = useState("idle");
      const [rightStatus, setRightStatus] = useState("idle");
      const [env, setEnv] = useState({ port: FALLBACK_PORT, provider: null, model: null, hasKey: false, callsModel: true });
      const [left, setLeft] = useState(null);
      const [right, setRight] = useState(null);
      const [errMsg, setErrMsg] = useState("");

      const busy = leftStatus === "loading" || rightStatus === "loading";
      const noKey = env.callsModel && !env.hasKey;
      const pillStatus = busy ? "loading" : (errMsg ? "err" : ((left || right) ? "ok" : "idle"));

      useEffect(() => {
        fetch("/health").then((r) => r.json()).then((j) => {
          setEnv({ port: j.port, provider: j.provider, model: j.model, hasKey: j.hasKey, callsModel: j.callsModel });
        }).catch(() => {});
      }, []);

      async function runLeft() {
        setLeftStatus("loading");
        setErrMsg("");
        try {
          const res = await fetch("/api/step-by-step");
          if (!res.ok) throw new Error("HTTP " + res.status);
          setLeft(await res.json());
          setLeftStatus("ok");
        } catch (e) {
          setErrMsg(String(e && e.message ? e.message : e));
          setLeftStatus("err");
        }
      }

      async function runRight() {
        setRightStatus("loading");
        setErrMsg("");
        try {
          const res = await fetch("/api/plan-and-execute");
          if (!res.ok) throw new Error("HTTP " + res.status);
          setRight(await res.json());
          setRightStatus("ok");
        } catch (e) {
          setErrMsg(String(e && e.message ? e.message : e));
          setRightStatus("err");
        }
      }

      async function runBoth() {
        setErrMsg("");
        await Promise.all([runLeft(), runRight()]);
      }

      const comparison = window.DemoUtils.buildComparison(left, right);

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              先规划再执行 vs 一步步走（Plan-and-Execute vs ReAct） · 第二步（step-2） · 全真模型双路径对照
            </h1>
            <span id="status-pill" className={
              "text-xs px-2 py-1 rounded " +
              (pillStatus === "loading" ? "bg-blue-100 text-blue-800" :
               pillStatus === "ok" ? "bg-green-100 text-green-800" :
               pillStatus === "err" ? "bg-red-100 text-red-800" : "bg-gray-200 text-gray-700")
            }>
              {pillStatus === "loading" ? "🔄 请求中" : pillStatus === "ok" ? "✅ 完成" : pillStatus === "err" ? "❌ 错误" : "⏸ 待连接"}
            </span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="problem-card" className="bg-orange-50 border-2 border-orange-400 rounded p-4 space-y-2">
              <div className="text-sm font-bold text-orange-900">❓ 实际场景 + 核心问题（先看这个）</div>
              <div className="text-xs text-gray-700">step-1 用 mock 写死 7 圈 / 6 步 —— 形状差是真的，但模型自己会怎么决策你看不出来。</div>
              <div className="text-xs text-gray-700">两条路径用同一档真模型，节奏差异才是节奏差异，不是模型能力差。</div>
              <div className="text-sm text-orange-900 mt-2 font-semibold">→ 核心问题：两条路径都用真模型，行为差异才公平。</div>
            </section>

            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示：同一句任务「春季上新」，<b>左栏真模型一步步走、右栏真规划器</b>，各发各的请求，页面并排对照。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>点「跑左栏」→ GET /api/step-by-step（每圈真调模型，最多 8 圈）</li>
                <li>点「跑右栏」→ GET /api/plan-and-execute（真规划器 1 次 + 按清单执行）</li>
                <li>点「同时对照」→ 浏览器并发两个请求，不是服务端一个接口打包</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  step-2 重点：<b>「先规划」的价值在真模型吐的那份清单</b>。看差异仍盯「计划作为对象在第一次 Act 之前是否已存在」—— 这次 plan 是真模型吐的，每次点按钮可能不一样。
                </div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="text-sm text-gray-500">每侧自己的请求 · 可以只跑一栏，也可以同时对照</div>
              <div className="flex flex-wrap items-center gap-3">
                <button id="run-left" onClick={runLeft} disabled={busy || noKey} className="bg-gray-700 text-white px-4 py-2 rounded text-sm disabled:opacity-50">
                  跑左栏（一步步走）
                </button>
                <button id="run-right" onClick={runRight} disabled={busy || noKey} className="bg-blue-700 text-white px-4 py-2 rounded text-sm disabled:opacity-50">
                  跑右栏（先规划）
                </button>
                <button id="run-compare" onClick={runBoth} disabled={busy || noKey} className="bg-blue-600 text-white px-4 py-2 rounded text-sm disabled:opacity-50">
                  同时对照（浏览器发两次请求）
                </button>
              </div>
              {errMsg ? <div className="text-sm text-red-700 bg-red-50 border border-red-300 rounded p-2">错误：{errMsg}</div> : null}
            </section>

            <MetricsStrip comparison={comparison} />

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!left && !right ? (
                <div className="text-sm text-gray-500">空态：还没点按钮。左栏是真模型 N 圈轨迹，右栏是真规划器清单 + 执行卡。</div>
              ) : (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                  <div id="col-step-by-step" className="border border-gray-200 rounded p-3 space-y-3">
                    <div className="text-sm font-semibold text-gray-800">左栏 · 一步步走（ReAct · 真模型）</div>
                    {!left ? <div className="text-xs text-gray-400">还没跑左栏 · 点「跑左栏」或「同时对照」</div> : (
                      <div className="space-y-3">
                        <div className="text-xs text-gray-500">{left.trajectory.length} 圈 · 模型调用 {left.summary.modelCalls} 次 · {left.stoppedReason}</div>
                        {left.trajectory.map((round) => <RoundCard key={round.index} round={round} />)}
                        <div className="text-xs text-green-900 bg-green-50 border border-green-300 rounded p-2">
                          最终答案：{left.finalAnswer}
                        </div>
                      </div>
                    )}
                  </div>
                  <div id="col-plan-and-execute" className="border border-gray-200 rounded p-3 space-y-3">
                    <div className="text-sm font-semibold text-gray-800">右栏 · 先规划再执行（真规划器）</div>
                    {!right ? <div className="text-xs text-gray-400">还没跑右栏 · 点「跑右栏」或「同时对照」</div> : (
                      <div className="space-y-3">
                        <div className="text-xs text-gray-500">
                          规划 1 次（{right.plannerFallback ? "⚠ 兜底 mock" : "✅ 真模型"}） + 执行 {right.executeTrace.length} 步
                        </div>
                        <PlanPanel data={right} />
                        <div className="text-xs text-green-900 bg-green-50 border border-green-300 rounded p-2">
                          最终答案：{right.finalAnswer}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">
              端口 {env.port} · 协议 A · 模型服务商 {env.provider ?? "—"} · 模型 {env.model ?? "—"} · 密钥 {env.hasKey ? "✅" : "❌（未配 Key → 主按钮 disabled）"}
            </span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
