<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON Schema · 总览</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>

  <script type="text/babel">
    /**
     * 本页教学点：同一份 Zod 契约可以写成 JSON Schema。本页不 parse。
     */
    const { useState } = React;

    const SCENES = [
      {
        href: "/pages/parse.html",
        title: "parse / safeParse",
        desc: "合法对象返回 typed 值；非法对象 success=false，没有 data 字段。",
      },
      {
        href: "/pages/repair.html",
        title: "issues → repair",
        desc: "path / code / message 拼成一段可以喂回模型的文本。本条不真的调模型。",
      },
      {
        href: "/pages/transform.html",
        title: "transform",
        desc: "校验之后改结构：default 补 action，再加 repaired / when。",
      },
    ];

    const INTRO_STEPS = [
      "GET /health 带回 JSON Schema literal 和三份样例，页面不写死契约",
      "parse 页：POST /api/parse { raw }，同时看成功值和 safeParse 形状",
      "repair 页：POST /api/repair { raw }，把 issues 拼成 repair prompt",
      "transform 页：POST /api/transform { raw }，看输出类型怎么变",
    ];

    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo } = window.DemoUI;

        function App() {
          const { env, envError } = useEnvInfo();
          const [status, setStatus] = useState("idle");

          React.useEffect(function () {
            if (envError) setStatus("error");
            else if (env.port) setStatus("ok");
          }, [env, envError]);

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">JSON Schema</h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                <PageIntro
                  summary="Zod 这一端的返回值长什么样。真正把 schema 喂给模型看 02 那条。"
                  steps={INTRO_STEPS}
                  extra={
                    <pre className="whitespace-pre-wrap bg-gray-50 p-2 rounded text-xs text-gray-700">
{`Intent (Zod)
  → JSON Schema literal（喂给 SDK 的样子）
  → parse / safeParse / issues → repair / transform
qty 不在 required 里 → JSON Schema 默认可选。`}
                    </pre>
                  }
                />

                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                    {SCENES.map(function (s) {
                      return (
                        <a key={s.href} href={s.href} className="border border-gray-300 hover:border-blue-500 rounded p-3">
                          <div className="font-semibold text-sm">{s.title}</div>
                          <div className="text-xs text-gray-500 mt-1">{s.desc}</div>
                        </a>
                      );
                    })}
                  </div>
                </section>

                <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] text-sm text-gray-600">
                  {envError && <p className="text-red-700">{envError}</p>}
                  {!env.schema && <p>本页不 parse。schema 从 GET /health 来，加载后会出现在下面。</p>}
                  {env.schema && (
                    <pre className="whitespace-pre-wrap bg-gray-50 p-2 rounded text-xs max-h-64 overflow-auto">
                      {JSON.stringify(env.schema, null, 2)}
                    </pre>
                  )}
                </section>
              </main>

              <EnvFooter env={env} />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
