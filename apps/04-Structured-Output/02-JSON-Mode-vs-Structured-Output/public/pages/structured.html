<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Structured Output（语义闸）</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/api-client.js"></script>
  <script src="/utils/wait-demo-ui.js"></script>
  <script src="/utils/presets.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/mode-cards.js"></script>

  <script type="text/babel">
    /**
     * 本页教学点：json_schema + strict:true 是 token-level mask。schema 外的字段 / enum 外的值写不出来。
     * 对照法：把 JSON Mode 页刚跑过的那条 prompt 原样再跑一遍。
     */
    const { useState } = React;

    const INTRO_STEPS = [
      "点按钮 → POST /api/structured-output { prompt }",
      "服务端带 json_schema（Intent）+ strict: true 调协议 A",
      "真 token-mask 时，action 只能是 search|order|cancel，多出来的 key 写不进 content",
      "服务端仍然 Zod：软约束网关 silent accept 时，这里会 Zod ✗",
      "同一条 prompt 去 JSON Mode 页对照 extraKeys —— 差的就是两道闸的位置",
    ];

    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo", "CaseResult", "ErrorBanner"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo, CaseResult, ErrorBanner } =
          window.DemoUI;
        const { callEndpoint, describeFailure, PRESETS } = window.DemoUtils;

        function App() {
          const { env, envError } = useEnvInfo();
          const [status, setStatus] = useState("idle");
          const [busy, setBusy] = useState(false);
          const [error, setError] = useState(null);
          const [prompt, setPrompt] = useState("");
          const [cases, setCases] = useState([]);

          const blocked = busy || !env.hasKey;

          const runOne = async function (title, p, expect, key) {
            if (blocked) return;
            setBusy(true);
            setStatus("loading");
            setError(null);
            try {
              const res = await callEndpoint("/api/structured-output", { prompt: p });
              const payload =
                res.status === 200
                  ? { ok: true, body: res.data }
                  : {
                      ok: false,
                      status: res.status,
                      error: describeFailure(res.status, res.data),
                    };
              setCases(function (prev) {
                return [
                  { key: key, title: title, prompt: p, expect: expect, payload: payload },
                ].concat(prev);
              });
              setStatus(res.status === 200 ? "ok" : "error");
            } catch (e) {
              setError({
                title: "网络错误（fetch 没发出去）",
                detail: e.message,
                httpStatus: null,
              });
              setStatus("error");
            } finally {
              setBusy(false);
            }
          };

          const runAll = async function () {
            if (blocked) return;
            setBusy(true);
            setStatus("loading");
            setError(null);
            try {
              const results = [];
              for (var i = 0; i < PRESETS.length; i++) {
                var p = PRESETS[i];
                var res = await callEndpoint("/api/structured-output", { prompt: p.prompt });
                var payload =
                  res.status === 200
                    ? { ok: true, body: res.data }
                    : {
                        ok: false,
                        status: res.status,
                        error: describeFailure(res.status, res.data),
                      };
                results.push({
                  key: p.key + "-" + Date.now(),
                  title: p.title,
                  prompt: p.prompt,
                  expect: p.expect,
                  payload: payload,
                });
              }
              setCases(function (prev) {
                return results.concat(prev);
              });
              setStatus("ok");
            } catch (e) {
              setError({
                title: "网络错误（fetch 没发出去）",
                detail: e.message,
                httpStatus: null,
              });
              setStatus("error");
            } finally {
              setBusy(false);
            }
          };

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">Structured Output（语义闸）</h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                <PageIntro
                  summary="json_schema + strict: true 在 token 层挡住不合规输出。schema 写法本身不对时，见「坏 schema」页。"
                  steps={INTRO_STEPS}
                />

                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  {!env.hasKey && (
                    <p className="text-xs text-red-600">
                      未检测到 Key，按钮已禁用。先在 apps/.env 配置 LLM_PROVIDER 对应的 Key。
                    </p>
                  )}

                  <div className="space-y-1">
                    <div className="flex gap-2 items-start">
                      <textarea
                        className="flex-1 border rounded p-2 text-sm"
                        rows={2}
                        placeholder="把 JSON Mode 页用过的 prompt 原样贴过来对照"
                        value={prompt}
                        onChange={function (e) {
                          setPrompt(e.target.value);
                        }}
                      />
                      <button
                        className="bg-blue-600 text-white px-3 py-2 rounded text-sm disabled:opacity-50"
                        disabled={blocked || !prompt.trim()}
                        onClick={function () {
                          runOne(
                            "自定义：" + prompt.trim().slice(0, 18),
                            prompt.trim(),
                            "(自由 prompt)",
                            "free-" + Date.now(),
                          );
                        }}
                      >
                        跑自定义
                      </button>
                      <button
                        className="border border-gray-300 px-3 py-2 rounded text-sm disabled:opacity-50"
                        disabled={blocked}
                        onClick={runAll}
                      >
                        一键跑 5 用例
                      </button>
                    </div>
                    <p className="text-xs text-gray-500">
                      点「跑自定义」→ 只发 strict schema 这一道闸。system 里显式含「JSON」，兼容部分网关的 prompt-must-contain-json 规则。
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                    {PRESETS.map(function (p) {
                      return (
                        <div key={p.key} className="space-y-1">
                          <button
                            className="w-full border border-gray-300 hover:border-blue-500 rounded p-2 text-left text-sm disabled:opacity-50"
                            disabled={blocked}
                            onClick={function () {
                              runOne(p.title, p.prompt, p.expect, p.key + "-" + Date.now());
                            }}
                          >
                            <div className="font-semibold">{p.title}</div>
                            <div className="text-xs text-gray-500">prompt: {p.prompt}</div>
                          </button>
                          <p className="text-xs text-gray-500">{p.hint}</p>
                        </div>
                      );
                    })}
                  </div>
                </section>

                {(error || envError) && (
                  error ? (
                    <ErrorBanner title={error.title} detail={error.detail} httpStatus={error.httpStatus} />
                  ) : (
                    <ErrorBanner title="拉 /health 失败" detail={envError} httpStatus={null} />
                  )
                )}

                <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
                  <div className="text-sm text-gray-500">
                    {cases.length === 0
                      ? "还没有结果。跑上面任一用例；真 strict 时 extraKeys 应为空，action 进不了 unknown。"
                      : "共 " + cases.length + " 条（最新在顶）"}
                  </div>
                  {cases.map(function (c) {
                    return (
                      <CaseResult
                        key={c.key}
                        entry={c}
                        label="Structured Output（语义闸 · json_schema strict）"
                      />
                    );
                  })}
                </section>
              </main>

              <EnvFooter env={env} protocol="A" />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
