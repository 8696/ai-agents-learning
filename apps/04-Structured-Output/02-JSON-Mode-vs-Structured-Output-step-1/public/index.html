<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON Mode vs Structured Output · 总览</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>

  <script type="text/babel">
    /**
     * 本页教学点：协议 A 的两道闸差在哪、对照法怎么走。本页不调模型。
     */
    const { useState } = React;

    const SCENES = [
      {
        href: "/pages/json-mode.html",
        title: "JSON Mode（语法闸）",
        desc: "response_format: { type: \"json_object\" }。只保 JSON.parse，不保字段名 / enum。同一组 5 个诱导用例。",
      },
      {
        href: "/pages/structured.html",
        title: "Structured Output（语义闸）",
        desc: "json_schema + strict: true。token-level mask，schema 不合规写不出来。同一组 5 个诱导用例。",
      },
      {
        href: "/pages/strict-rejected.html",
        title: "坏 schema → API 400",
        desc: "故意缺 additionalProperties:false + 含 anyOf。真 token-mask 会 400；软约束网关可能 silent accept。",
      },
    ];

    const INTRO_STEPS = [
      "页面加载 → GET /health（provider / model / hasKey）。模型名只出现在页脚，不写死。",
      "JSON Mode 页：POST /api/json-mode，盯 extraKeys / 夹 fence / Zod ✗",
      "Structured 页：同一条 prompt 再 POST /api/structured-output，对照 keysSeen 是否被钉死",
      "坏 schema 页：POST /api/strict-rejected，看是 API 入口 400 还是 unexpectedSuccess",
    ];

    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo } = window.DemoUI;

        function App() {
          const { env, envError } = useEnvInfo();
          const [status, setStatus] = useState("idle");

          React.useEffect(function () {
            if (envError) setStatus("error");
            else if (env.port) setStatus("ok");
          }, [env, envError]);

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">
                  04 · 02 · JSON Mode vs Structured Output
                </h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                <PageIntro
                  summary="协议 A 的结构化输出有两道闸：json_object 只保语法，json_schema+strict 才保语义。两边都还要服务端 Zod 兜底。"
                  steps={INTRO_STEPS}
                  extra={
                    <pre className="whitespace-pre-wrap bg-gray-50 p-2 rounded text-xs text-gray-700">
{`全局数据流
  ① 浏览器 POST /api/json-mode | /api/structured-output   { prompt }
  ② 服务端带上 response_format 调协议 A（openai.chat.completions）
  ③ 模型把 JSON 写在 choices[0].message.content（字符串，要 JSON.parse）
  ④ 服务端剥 <think> / fence → JSON.parse → Zod → analysis（keysSeen / extraKeys）
  ⑤ 卡片上：灰底 prompt · 绿底 raw · 徽标是协议事件（Zod / fence / 缺字段）

对照法：同一条 prompt 先在 JSON Mode 页跑，再去 Structured 页跑。
协议 B 镜像在隔壁端口 50412（tool_use，不在本进程）。`}
                    </pre>
                  }
                />

                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  <p className="text-sm text-gray-600">
                    总览页不发起模型请求。选一个场景进去跑，每页只演示一道闸。
                  </p>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                    {SCENES.map(function (s) {
                      return (
                        <a
                          key={s.href}
                          href={s.href}
                          className="border border-gray-300 hover:border-blue-500 rounded p-3 text-left"
                        >
                          <div className="font-semibold text-sm">{s.title}</div>
                          <div className="text-xs text-gray-500 mt-1">{s.desc}</div>
                        </a>
                      );
                    })}
                  </div>
                </section>

                <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] text-sm text-gray-600 space-y-2">
                  {envError && <p className="text-red-700">{envError}</p>}
                  <p>
                    Intent 契约：action ∈ search|order|cancel，query 非空，qty 可选正整数。
                    JSON Mode 把这份契约写在 system prompt 里（软）；Structured 写进 json_schema（硬）。
                  </p>
                  <p className="text-xs text-gray-500">
                    5 个诱导用例（简单命令 / enum 词 / 故意 unknown / 自由字段名 / 带 qty）两页共用同一组 prompt。
                    第六刀「坏 schema」测的是网关，不是模型。
                  </p>
                </section>
              </main>

              <EnvFooter env={env} protocol="A" />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
