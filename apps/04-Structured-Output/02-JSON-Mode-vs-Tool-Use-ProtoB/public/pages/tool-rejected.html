<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>诱导守约 · 协议 B</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/api-client.js"></script>
  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/mode-cards.js"></script>

  <script type="text/babel">
    /**
     * 本页教学点：协议 B 不在 API 入口拒 schema。prompt 要 unknown，看模型守不守 enum。
     * 和协议 A 的「坏 schema → 400」测的不是一回事。
     */
    const { useState } = React;

    const INTRO_STEPS = [
      "点「运行」→ POST /api/tool-rejected（无自定义 prompt）",
      "服务端用固定诱导文案：把 action 填成 unknown，同时 tool_choice 仍强制调 Intent",
      "Anthropic 不会因此 400——没有「坏 schema 入口闸」",
      "回来看 Zod：✓ 说明模型守住了 enum；✗ 说明 prompt 压过了 input_schema",
      "关键断言：协议 B 的结构化保证是 input_schema + tool_choice + 后置 Zod 三层，不是 token-mask",
    ];

    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo", "ModeCard", "ErrorBanner"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo, ModeCard, ErrorBanner } =
          window.DemoUI;
        const { callEndpoint, describeFailure } = window.DemoUtils;

        function App() {
          const { env, envError } = useEnvInfo();
          const [status, setStatus] = useState("idle");
          const [busy, setBusy] = useState(false);
          const [error, setError] = useState(null);
          const [payload, setPayload] = useState(null);

          const blocked = busy || !env.hasKey;

          const run = async function () {
            if (blocked) return;
            setBusy(true);
            setStatus("loading");
            setError(null);
            setPayload(null);
            try {
              const res = await callEndpoint("/api/tool-rejected", {});
              if (res.status === 200) {
                setPayload({ ok: true, body: res.data });
                setStatus("ok");
              } else {
                setPayload({
                  ok: false,
                  status: res.status,
                  error: describeFailure(res.status, res.data),
                });
                setStatus("error");
              }
            } catch (e) {
              setError({
                title: "网络错误（fetch 没发出去）",
                detail: e.message,
                httpStatus: null,
              });
              setStatus("error");
            } finally {
              setBusy(false);
            }
          };

          var violated = payload && payload.ok && payload.body && payload.body.violated;

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">⑥ prompt 诱导 · 看守约</h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                <PageIntro
                  summary="故意让 prompt 说「action 填 unknown」（不在 enum 里），tool_choice 仍强制调 Intent。测的是模型守约，不是 API 400。"
                  steps={INTRO_STEPS}
                />

                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  {!env.hasKey && (
                    <p className="text-xs text-red-600">
                      未检测到 Key，按钮已禁用。先在 apps/.env 配置 LLM_PROVIDER 对应的 Key。
                    </p>
                  )}
                  <p className="text-xs text-gray-500">
                    点「运行」会发出固定诱导文案。协议 A 那侧测的是坏 schema 入口拒收；<b>两边都重要，但测的不是一回事。</b>
                  </p>
                  <button
                    className="bg-blue-600 text-white px-3 py-2 rounded text-sm disabled:opacity-50"
                    disabled={blocked}
                    onClick={run}
                  >
                    {busy ? "调用中…" : "运行诱导"}
                  </button>
                </section>

                {(error || envError) && (
                  error ? (
                    <ErrorBanner title={error.title} detail={error.detail} httpStatus={error.httpStatus} />
                  ) : (
                    <ErrorBanner title="拉 /health 失败" detail={envError} httpStatus={null} />
                  )
                )}

                <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
                  {!payload && !error && (
                    <p className="text-sm text-gray-500">
                      还没有结果。点「运行诱导」。看 Zod ✓ 还是 ✗——✓ 表示模型没听 prompt 去写 unknown。
                    </p>
                  )}
                  {payload && payload.ok && (
                    <div
                      className={
                        violated
                          ? "text-xs px-2 py-1 rounded bg-orange-100 text-orange-800 inline-block"
                          : "text-xs px-2 py-1 rounded bg-green-100 text-green-800 inline-block"
                      }
                    >
                      {violated
                        ? "violated：模型没守 enum / 缺字段（prompt 压过了 input_schema）"
                        : "守约：Zod 过了，模型没写出 unknown"}
                    </div>
                  )}
                  {payload && (
                    <ModeCard label="tool_choice 强制 + 诱导 prompt" payload={payload} />
                  )}
                </section>
              </main>

              <EnvFooter env={env} />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
