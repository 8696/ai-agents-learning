<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON Mode vs Tool-Use · 协议 B · 总览</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>

  <script type="text/babel">
    /**
     * 本页教学点：协议 B 没有 response_format。结构化闸在 tools + tool_choice。本页不调模型。
     */
    const { useState } = React;

    const SCENES = [
      {
        href: "/pages/text.html",
        title: "无 tools（类 JSON Mode）",
        desc: "纯 messages.create，prompt 强写「只返回 JSON」。没有 API 字段保 JSON.parse。同一组 5 个诱导用例。",
      },
      {
        href: "/pages/tool-use.html",
        title: "tool-use（类 Structured Output）",
        desc: "tools + tool_choice 强制调 Intent。input 已是对象，无须 JSON.parse。同一组 5 个诱导用例。",
      },
      {
        href: "/pages/tool-rejected.html",
        title: "诱导守约",
        desc: "prompt 要 action=unknown。协议 B 不会在 API 入口 400——测的是模型守不守 input_schema。",
      },
    ];

    const INTRO_STEPS = [
      "页面加载 → GET /health（provider / modelB / hasKey）。页脚写协议 B，模型名不写死。",
      "无 tools 页：POST /api/text，盯 fence / extraKeys / Zod ✗",
      "tool-use 页：同一条 prompt 再 POST /api/tool-use，看 input 是不是已经是对象",
      "诱导页：POST /api/tool-rejected，看 Zod 过不过——过了说明模型守住了 enum",
    ];

    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo } = window.DemoUI;

        function App() {
          const { env, envError } = useEnvInfo();
          const [status, setStatus] = useState("idle");

          React.useEffect(function () {
            if (envError) setStatus("error");
            else if (env.port) setStatus("ok");
          }, [env, envError]);

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">
                  04 · 02 · 协议 B · JSON Mode vs Tool-Use
                </h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                <PageIntro
                  summary="协议 B 没有 response_format。无 tools ≈ 语法闸弱对应；tool_choice 强制调工具 ≈ 语义闸软对应。两边都要 Zod 兜底。"
                  steps={INTRO_STEPS}
                  extra={
                    <pre className="whitespace-pre-wrap bg-gray-50 p-2 rounded text-xs text-gray-700">
{`全局数据流
  ① 浏览器 POST /api/text | /api/tool-use | /api/tool-rejected
  ② 服务端调协议 B（anthropic.messages.create）
  ③ text 路径：content[type=text] 是字符串，要剥壳 + JSON.parse
  ④ tool-use 路径：content[type=tool_use].input 已是对象，直接 Zod
  ⑤ 卡片上：灰底 prompt · 绿底 raw · 徽标是协议事件（Zod / fence / tool_use 名）

对照法：同一条 prompt 先在无 tools 页跑，再去 tool-use 页跑。
协议 A 镜像在隔壁端口 50402（response_format，不在本进程）。`}
                    </pre>
                  }
                />

                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  <p className="text-sm text-gray-600">
                    总览页不发起模型请求。选一个场景进去跑，每页只演示一条路径。
                  </p>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                    {SCENES.map(function (s) {
                      return (
                        <a
                          key={s.href}
                          href={s.href}
                          className="border border-gray-300 hover:border-blue-500 rounded p-3 text-left"
                        >
                          <div className="font-semibold text-sm">{s.title}</div>
                          <div className="text-xs text-gray-500 mt-1">{s.desc}</div>
                        </a>
                      );
                    })}
                  </div>
                </section>

                <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] text-sm text-gray-600 space-y-2">
                  {envError && <p className="text-red-700">{envError}</p>}
                  <p>
                    协议 B 与 A 的最大区别：没有 response_format，结构化闸在 tool_choice；
                    模型不再把 JSON 写在 content 文本流里，而是直接返回 tool_use block。
                  </p>
                  <p className="text-xs text-gray-500">
                    Intent 契约与协议 A 镜像：action ∈ search|order|cancel，query 非空，qty 可选。
                    input_schema 额外带 description（Anthropic 推荐，OpenAI strict 侧没有这层）。
                  </p>
                </section>
              </main>

              <EnvFooter env={env} />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
