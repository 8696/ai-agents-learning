<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCP 架构 · 拓扑 + 解耦（多服务端 · 换宿主）</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="../utils/api-client.js"></script>
  <script type="text/babel" src="../components/layout.js"></script>
  <script type="text/babel" src="../components/protocol-card.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, EnvFooter, ProtocolCard } = window.DemoUI;
    const { postJson } = window.DemoUtils;

    const HOST_PRESETS = [
      { value: "agent-coffee", label: "自建值班台（agent-coffee）", clientInfo: { name: "agent-coffee", version: "0.1.0", title: "自建值班台" } },
      { value: "agent-cursor", label: "Cursor（agent-cursor）", clientInfo: { name: "agent-cursor", version: "1.0.0", title: "Cursor" } },
    ];

    // 扩展 postJson：允许传 headers（X-MCP-Host-Id）
    async function postJsonWithHost(url, body, hostId) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-MCP-Host-Id": hostId },
        body: JSON.stringify(body),
      });
      let json = null;
      try { json = await res.json(); } catch (_err) { json = { ok: false, error: "响应不是 JSON" }; }
      return { httpOk: res.ok, httpStatus: res.status, json: json };
    }

    function App() {
      const [env, setEnv] = useState(null);
      const [hostPreset, setHostPreset] = useState(HOST_PRESETS[0].value);
      const [orderId, setOrderId] = useState("A-1001");
      const [reason, setReason] = useState("七天无理由");
      const [busyInit, setBusyInit] = useState(false);
      const [busyLeft, setBusyLeft] = useState(false);
      const [busyRight, setBusyRight] = useState(false);
      const [httpError, setHttpError] = useState({ init: "", left: "", right: "" });
      const [leftCard, setLeftCard] = useState(null);
      const [rightCard, setRightCard] = useState(null);
      const [rightToolCard, setRightToolCard] = useState(null);
      const [status, setStatus] = useState("idle");

      const host = HOST_PRESETS.find(function (h) { return h.value === hostPreset; });

      useEffect(function () {
        fetch("/health").then(function (r) { return r.json(); }).then(function (j) { setEnv(j); }).catch(function () { /* ignore */ });
      }, []);

      async function runInit() {
        setBusyInit(true);
        setHttpError(function (prev) { return Object.assign({}, prev, { init: "" }); });
        setStatus("loading");
        try {
          // 两次 initialize：分别给 client-1 / client-2（不同专线）。clientInfo 同 host 切换。
          const r1 = await postJsonWithHost("/api/mcp/ticket/initialize", { clientInfo: host.clientInfo }, hostPreset);
          const r2 = await postJsonWithHost("/api/mcp/kb/initialize", { clientInfo: host.clientInfo }, hostPreset);
          const r = { httpOk: r1.httpOk && r2.httpOk, httpStatus: r1.httpStatus, json: { ticket: r1.json, kb: r2.json } };
          if (!r.httpOk) {
            setStatus("err");
            setHttpError(function (prev) { return Object.assign({}, prev, { init: "HTTP " + r.httpStatus + "（任一专线不通）" }); });
            return;
          }
          setLeftCard({ protocolOk: r.json.ticket.protocolOk, jsonrpcRequest: r.json.ticket.jsonrpcRequest, jsonrpcResponse: r.json.ticket.jsonrpcResponse, agentDid: r.json.ticket.agentDid, serverDid: r.json.ticket.serverDid });
          setRightCard({ protocolOk: r.json.kb.protocolOk, jsonrpcRequest: r.json.kb.jsonrpcRequest, jsonrpcResponse: r.json.kb.jsonrpcResponse, agentDid: r.json.kb.agentDid, serverDid: r.json.kb.serverDid });
          setStatus("ok");
        } catch (err) {
          setStatus("err");
          setHttpError(function (prev) { return Object.assign({}, prev, { init: String(err && err.message ? err.message : err) }); });
        } finally {
          setBusyInit(false);
        }
      }

      async function runLeft(url, body) {
        setBusyLeft(true);
        setHttpError(function (prev) { return Object.assign({}, prev, { left: "" }); });
        setStatus("loading");
        try {
          const r = await postJsonWithHost(url, body || {}, hostPreset);
          if (!r.httpOk) {
            setStatus("err");
            setHttpError(function (prev) { return Object.assign({}, prev, { left: "HTTP " + r.httpStatus + "：" + ((r.json && r.json.error) || "请求失败") }); });
            return;
          }
          setLeftCard(r.json);
          setStatus(r.json.protocolOk ? "ok" : "err");
        } catch (err) {
          setStatus("err");
          setHttpError(function (prev) { return Object.assign({}, prev, { left: String(err && err.message ? err.message : err) }); });
        } finally {
          setBusyLeft(false);
        }
      }

      async function runRight(url, body) {
        setBusyRight(true);
        setHttpError(function (prev) { return Object.assign({}, prev, { right: "" }); });
        setStatus("loading");
        try {
          const r = await postJsonWithHost(url, body || {}, hostPreset);
          if (!r.httpOk) {
            setStatus("err");
            setHttpError(function (prev) { return Object.assign({}, prev, { right: "HTTP " + r.httpStatus + "：" + ((r.json && r.json.error) || "请求失败") }); });
            return;
          }
          setRightCard(r.json);
          setStatus(r.json.protocolOk ? "ok" : "err");
        } catch (err) {
          setStatus("err");
          setHttpError(function (prev) { return Object.assign({}, prev, { right: String(err && err.message ? err.message : err) }); });
        } finally {
          setBusyRight(false);
        }
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              MCP 架构（Model Context Protocol） · 第三步（step-3） · 拓扑（多服务端一对一专线） + 解耦（换宿主不必重写工具）
            </h1>
            <StatusPill status={status} />
          </header>
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页演示两件事：<b>拓扑</b>（1 宿主 · 2 客户端 · 2 服务端，client-1 ↔ server A · client-2 ↔ server B，<b>一对一专线</b>）+ <b>解耦</b>（同一服务端对两个不同宿主接入——自建值班台 / Cursor，工具定义只在服务端源码里）。
              </p>
              <pre className="bg-gray-50 rounded p-3 text-xs whitespace-pre overflow-auto">
{`  宿主 Host：${hostPreset}
   │
   ├── client-1 ── 一对一专线 ──→ 服务端 A (ticket，tools)
   │
   └── client-2 ── 一对一专线 ──→ 服务端 B (kb，resources + prompts)

  URL 路径区分 serverId（/api/mcp/ticket/* · /api/mcp/kb/*）—— 客户端不可能跨线调。
  请求 header X-MCP-Host-Id 区分宿主——服务端日志区分两条接入；tools/list 响应只来自服务端 catalog。`}
              </pre>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  拓扑：URL 路径 = 一对一专线——不可能让 client-1 调到 kb，也不可能让 client-2 调到 ticket。解耦：切换宿主只影响 X-MCP-Host-Id 头；tools 响应内容完全相同（因为工具定义只来自服务端 catalog，不来自 host 源码）。
                </div>
                <div className="text-xs text-gray-600">
                  怎么观察：左栏请求 path 含 `/ticket/`，右栏请求 path 含 `/kb/`；两边请求头都有 `X-MCP-Host-Id: {hostPreset}`。切换宿主后重新点 ① 初始化 + ②，发现左栏的能力请求响应一样，只是服务端的 left catalog 还是同一份。换完跑一次，同样：能力表（tools 列表）来自服务端，不来自宿主——这就是"工具定义在服务端"。
                </div>
              </div>
            </section>
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="grid md:grid-cols-2 gap-2">
                <label className="block text-xs text-gray-700">
                  宿主标识（host · 影响 X-MCP-Host-Id 头）
                  <select
                    className="mt-1 border rounded px-2 py-1 text-sm w-full"
                    value={hostPreset}
                    onChange={function (event) { setHostPreset(event.target.value); }}
                  >
                    {HOST_PRESETS.map(function (item) {
                      return <option key={item.value} value={item.value}>{item.label}</option>;
                    })}
                  </select>
                </label>
                <div className="grid grid-cols-2 gap-2">
                  <label className="block text-xs text-gray-700">
                    订单号（orderId）
                    <input className="mt-1 border rounded px-2 py-1 text-sm w-full" value={orderId} onChange={function (e) { setOrderId(e.target.value); }} />
                  </label>
                  <label className="block text-xs text-gray-700">
                    退款原因（reason）
                    <input className="mt-1 border rounded px-2 py-1 text-sm w-full" value={reason} onChange={function (e) { setReason(e.target.value); }} />
                  </label>
                </div>
              </div>
              {httpError.init ? (
                <div className="border border-red-300 bg-red-50 rounded p-2 text-xs text-red-800">{httpError.init}</div>
              ) : null}
            </section>

            <section id="output" className="space-y-3">
              <div className="grid md:grid-cols-2 gap-3">
                {/* 左栏：客户端 1 → 服务端 A (ticket) */}
                <article className="bg-white shadow rounded p-3 space-y-2 border border-red-200">
                  <header className="flex items-center justify-between">
                    <h2 className="text-sm font-semibold text-red-800">客户端 1 → 服务端 A (ticket)</h2>
                    <span className="text-xs px-2 py-0.5 rounded bg-red-100 text-red-800">tools 一对一专线</span>
                  </header>
                  <div className="flex flex-wrap gap-2">
                    <button type="button" className="bg-blue-600 text-white text-sm px-3 py-1.5 rounded disabled:opacity-50" disabled={busyInit} onClick={runInit}>
                      ① 初始化（左栏 ticket / 右栏 kb 各跑一次）
                    </button>
                    <button type="button" className="border border-red-400 text-red-800 text-sm px-3 py-1 rounded disabled:opacity-50" disabled={busyLeft} onClick={function () { runLeft("/api/mcp/ticket/tools-list", {}); }}>
                      ② 工具发现 tools/list
                    </button>
                    <button type="button" className="border border-red-400 text-red-800 text-sm px-3 py-1 rounded disabled:opacity-50" disabled={busyLeft} onClick={function () {
                      runLeft("/api/mcp/ticket/tools-call", { name: "create_ticket", arguments: { orderId: orderId, reason: reason } });
                    }}>
                      ③ 建工单 create_ticket
                    </button>
                    <button type="button" className="border border-gray-400 text-gray-700 text-sm px-3 py-1 rounded disabled:opacity-50" disabled={busyLeft} onClick={function () { runLeft("/api/mcp/ticket/resources-list", {}); }}>
                      ⑥ 跨线测试 ticket → resources/list（应 -32601）
                    </button>
                  </div>
                  {httpError.left ? <div className="border border-red-300 bg-red-50 rounded p-2 text-xs text-red-800">{httpError.left}</div> : null}
                  {leftCard ? <ProtocolCard card={leftCard} /> : <p className="text-xs text-gray-500">左栏还没跑过请求。点上方任一按钮。</p>}
                </article>

                {/* 右栏：客户端 2 → 服务端 B (kb) */}
                <article className="bg-white shadow rounded p-3 space-y-2 border border-amber-200">
                  <header className="flex items-center justify-between">
                    <h2 className="text-sm font-semibold text-amber-800">客户端 2 → 服务端 B (kb)</h2>
                    <span className="text-xs px-2 py-0.5 rounded bg-amber-100 text-amber-800">resources + prompts 一对一专线</span>
                  </header>
                  <div className="flex flex-wrap gap-2">
                    <button type="button" className="border border-amber-400 text-amber-800 text-sm px-3 py-1 rounded disabled:opacity-50" disabled={busyRight} onClick={function () { runRight("/api/mcp/kb/resources-list", {}); }}>
                      ② 资源发现 resources/list
                    </button>
                    <button type="button" className="border border-amber-400 text-amber-800 text-sm px-3 py-1 rounded disabled:opacity-50" disabled={busyRight} onClick={function () { runRight("/api/mcp/kb/resources-read", { uri: "policy://return-2026" }); }}>
                      ③ 读政策 resources/read
                    </button>
                    <button type="button" className="border border-amber-400 text-amber-800 text-sm px-3 py-1 rounded disabled:opacity-50" disabled={busyRight} onClick={function () { runRight("/api/mcp/kb/prompts-list", {}); }}>
                      ④ 模板发现 prompts/list
                    </button>
                    <button type="button" className="border border-amber-400 text-amber-800 text-sm px-3 py-1 rounded disabled:opacity-50" disabled={busyRight} onClick={function () {
                      runRight("/api/mcp/kb/prompts-get", { name: "refund-script", arguments: { orderId: orderId, reason: reason } });
                    }}>
                      ⑤ 取话术 prompts/get
                    </button>
                    <button type="button" className="border border-gray-400 text-gray-700 text-sm px-3 py-1 rounded disabled:opacity-50" disabled={busyRight} onClick={function () { runRight("/api/mcp/kb/tools-call", { name: "make_latte", arguments: { cupSize: "中杯" } }); }}>
                      ⑥ 跨线测试 kb → tools/call（应 -32601）
                    </button>
                  </div>
                  {httpError.right ? <div className="border border-red-300 bg-red-50 rounded p-2 text-xs text-red-800">{httpError.right}</div> : null}
                  {rightCard ? <ProtocolCard card={rightCard} /> : <p className="text-xs text-gray-500">右栏还没跑过请求。点上方任一按钮。</p>}
                </article>
              </div>

              <section className="bg-white shadow rounded p-4">
                <h3 className="text-sm font-semibold mb-2">需求 6 · 解耦对照</h3>
                <p className="text-xs text-gray-700 mb-2">
                  切换顶部的 host → 重新点 ① 初始化 → 服务端日志会区分两条接入（host=A 自建值班台 / host=B Cursor），但 tools/list 响应只来自服务端 catalog。工具定义不在宿主源码里——这就是"换宿主不必重写工具"。
                </p>
                <table className="w-full text-xs border-collapse">
                  <thead>
                    <tr className="bg-gray-100">
                      <th className="border p-2 text-left">当前 host</th>
                      <th className="border p-2 text-left">X-MCP-Host-Id 头</th>
                      <th className="border p-2 text-left">clientInfo.name（initialize 时）</th>
                      <th className="border p-2 text-left">serverInfo.name（响应）</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td className="border p-2">{HOST_PRESETS[0].label}</td>
                      <td className="border p-2 font-mono">{HOST_PRESETS[0].value}</td>
                      <td className="border p-2 font-mono">{HOST_PRESETS[0].clientInfo.name}</td>
                      <td className="border p-2 font-mono">ticket-mcp-server / kb-mcp-server（两台各自的服务端标识）</td>
                    </tr>
                    <tr>
                      <td className="border p-2">{HOST_PRESETS[1].label}</td>
                      <td className="border p-2 font-mono">{HOST_PRESETS[1].value}</td>
                      <td className="border p-2 font-mono">{HOST_PRESETS[1].clientInfo.name}</td>
                      <td className="border p-2 font-mono">同上——serverInfo 是服务端自己声明，不随 host 改</td>
                    </tr>
                  </tbody>
                </table>
              </section>
            </section>
          </main>
          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <EnvFooter env={env} />
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
