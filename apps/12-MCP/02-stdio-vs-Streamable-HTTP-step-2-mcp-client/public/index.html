<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streamable HTTP MCP Client · 第二步（step-2）· 一条连接走到底，每请求带身份</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- utils（普通 script）+ components（babel src）-->
  <script src="/utils/api-handlers.js"></script>
  <script type="text/babel" src="/components/prompts.js"></script>
  <script type="text/babel" src="/components/oauth-section.js"></script>
  <script type="text/babel" src="/components/test-auth-section.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { PromptsSection, OauthSection, TestAuthSection } = window.DemoUI || {};
    const { callJson } = window.DemoUtils || {};

    // ── 用户身份表 ──
    // 与服务端 lib/flow/auth.ts 的 TOKEN_TO_USER 对得上
    const USERS = [
      { key: "alice", label: "alice（普通用户）", token: "alice-secret" },
      { key: "bob", label: "bob（普通用户）", token: "bob-secret" },
      { key: "god", label: "god（上帝令牌 · 反例）", token: "god-mode-token" },
    ];

    function App() {
      const [status, setStatus] = useState("⏸ 待连接");
      const [busy, setBusy] = useState(false);
      const [errMsg, setErrMsg] = useState("");
      const [connectionStatus, setConnectionStatus] = useState("🔌 连接中...");
      const [currentUserKey, setCurrentUserKey] = useState(null);

      // MCP 三个模块各自的响应状态
      const [tools, setTools] = useState(null);
      const [toolCallResult, setToolCallResult] = useState(null);
      const [myTickets, setMyTickets] = useState(null);
      const [resources, setResources] = useState(null);
      const [resourceRead, setResourceRead] = useState(null);
      const [prompts, setPrompts] = useState(null);
      const [promptGet, setPromptGet] = useState(null);
      const [oauthResult, setOauthResult] = useState(null);
      const [testAuthResult, setTestAuthResult] = useState(null);
      const [customerName, setCustomerName] = useState("张三");
      const [cupSize, setCupSize] = useState("中杯");

      // 当前用户的 token（每个 fetch 都从这里取，跟着请求走）
      const currentToken = currentUserKey
        ? USERS.find(u => u.key === currentUserKey)?.token
        : null;

      // ── 页内 fetch 工具：每次都带当前 token —— Client demo 端不存任何用户信息 ──
      async function callApi(url, body, onOk) {
        return callJson(url, body, currentToken, { setBusy, setStatus, setErrMsg }, (data, ms) => {
          onOk(data, ms);
        });
      }

      // ── 页面 mount：自动连（默认登录 alice）──
      useEffect(() => {
        (async () => {
          // 1. 默认登录 alice
          setCurrentUserKey("alice");
          // 2. 自动 connect（这次 initialize 带 alice 的 Authorization 头 → 200）
          try {
            await callJson(
              "/api/http/connect",
              {},
              "alice-secret",
              { setBusy, setStatus, setErrMsg },
              (data, ms) => {
                if (!data.ok) {
                  setConnectionStatus("❌ 连接失败：" + (data.error || ""));
                  return;
                }
                setConnectionStatus("✅ 连接已建立");
              },
            );
          } catch (e) {
            setConnectionStatus("❌ 连接失败");
            return;
          }
          // 3. 健康信息填到页脚
          fetch("/health").then(r => r.json()).then(d => {
            const el = document.getElementById("env-info");
            if (!el) return;
            el.textContent =
              `端口 ${d.port} · 协议 Transport · ${d.transport} · 模型服务商 ${d.provider ?? "—"} · 模型 ${d.model ?? "—"} · 密钥 ${d.hasKey ? "✅" : "❌"} · 本地计算 · 不调大模型`;
          }).catch(() => {});
        })();
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      // ── 切登录身份：只动 React state（token 跟着每个 fetch 走，不重建连接）──
      function switchUser(userKey) {
        setCurrentUserKey(userKey);
      }

      // ── MCP 三个模块的 handler ──
      function onListToolsClick() {
        callApi("/api/http/list-tools", {}, (data, ms) => {
          setTools({ tools: data.tools, elapsedMs: ms });
        });
      }
      function onCallToolClick() {
        callApi("/api/http/call-tool", { name: "make_latte", arguments: { cupSize } }, (data, ms) => {
          setToolCallResult({ result: data.result, elapsedMs: ms });
        });
      }
      function onListMyTicketsClick() {
        callApi("/api/http/call-tool", { name: "list_my_tickets", arguments: {} }, (data, ms) => {
          const sc = (data.result && data.result.structuredContent) || {};
          setMyTickets({
            tickets: sc.tickets || [],
            viewerUserId: sc.viewerUserId || currentUserKey,
            isGod: Boolean(sc.isGod),
            elapsedMs: ms,
          });
        });
      }
      function onListResourcesClick() {
        callApi("/api/http/list-resources", {}, (data, ms) => {
          setResources({ resources: data.resources, elapsedMs: ms });
        });
      }
      function onReadResourceClick() {
        callApi("/api/http/read-resource", { uri: "menu://today" }, (data, ms) => {
          setResourceRead({ result: data.result, elapsedMs: ms });
        });
      }
      function onListPromptsClick() {
        callApi("/api/http/list-prompts", {}, (data, ms) => {
          setPrompts({ prompts: data.prompts, elapsedMs: ms });
        });
      }
      function onGetGreetingClick() {
        callApi("/api/http/get-prompt", { name: "customer_service_greeting", arguments: { customerName } }, (data, ms) => {
          setPromptGet({ result: data.result, error: data.error, elapsedMs: ms, label: "客服开场白" });
        });
      }
      function onGetRefundClick() {
        callApi("/api/http/get-prompt", { name: "refund_response", arguments: { orderId: "ORD-2026-001", reason: "商品与描述不符" } }, (data, ms) => {
          setPromptGet({ result: data.result, error: data.error, elapsedMs: ms, label: "退款话术" });
        });
      }

      // OAuth 2.1 audience 不匹配演示：调 /api/http/test-audience 路由
      // 路由内部用原生 fetch POST 远端 /mcp，token 硬编码为 token-for-other-server
      async function onTestAudience() {
        setBusy(true);
        setErrMsg("");
        setStatus("🔄 请求中");
        const t0 = Date.now();
        try {
          const res = await fetch("/api/http/test-audience", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
          const data = await res.json();
          setOauthResult({ ...data, elapsedMs: Date.now() - t0 });
          setStatus(data.httpStatus === 401 ? "✅ 完成（演示预期：401）" : "❌ 异常");
        } catch (e) {
          const message = e instanceof Error ? e.message : String(e);
          setOauthResult({ ok: false, error: message, elapsedMs: Date.now() - t0 });
          setErrMsg(message);
          setStatus("❌ 错误");
        } finally {
          setBusy(false);
        }
      }

      // A5：浏览器侧「无 token 401」+「错 token 401」演示 —— 调专门 /api/http/test-401 路由做 raw fetch
      async function testAuthCall(scenario) {
        setBusy(true);
        setErrMsg("");
        setStatus("🔄 请求中");
        const t0 = Date.now();
        try {
          const res = await fetch("/api/http/test-401", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ scenario }),
          });
          const data = await res.json();
          setTestAuthResult({ ...data, elapsedMs: Date.now() - t0 });
          setStatus(data.httpStatus === 401 ? "✅ 完成（401）" : "❌ 异常");
        } catch (e) {
          const message = e instanceof Error ? e.message : String(e);
          setErrMsg(message);
          setStatus("❌ 错误");
        } finally {
          setBusy(false);
        }
      }
      function onTestNoToken() {
        return testAuthCall("missing");  // 服务端 reason="missing"
      }
      function onTestWrongToken() {
        return testAuthCall("wrong");  // 服务端 reason="wrong"
      }

      const currentUserLabel = USERS.find(u => u.key === currentUserKey)?.label ?? "未选择";

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              Streamable HTTP MCP Client · 第二步（step-2）· 一条连接走到底，每请求带身份
            </h1>
            <span id="status-pill" className="text-xs px-2 py-1 rounded bg-gray-200">{status}</span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">

            {/* 教学点说明 */}
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">本页只演示：<b>浏览器每次 fetch 都带 Authorization 头；Client demo 不存任何用户信息，token 跟着请求走</b>。</p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>页面 mount 时默认登录 alice，自动 connect（一次 initialize 握手）</li>
                <li>顶部「当前登录身份」三按钮：点哪个就把 token 存到 React state（不是 Client demo 端）</li>
                <li>每个按钮触发的 fetch 都在 header 里带 <code>Authorization: Bearer &lt;token&gt;</code></li>
                <li>Client demo 的 route handler 从请求头解 token → 通过 AsyncLocalStorage 注入到 dynamicAuthFetch</li>
                <li>三个 MCP 模块（Tools / Resources / Prompts）所有请求都按当前身份调用；响应里都回 <code>[调用方] &lt;userId&gt;</code></li>
                <li>Tools 里的 <code>list_my_tickets</code> 按 userId 过滤工单；切到 god 看全部（反例对照）</li>
                <li>底部「OAuth 2.1」演示：用「发给别的 MCP server 的 token」试一次 → 远端返 401 + WWW-Authenticate（OAuth 2.1 标准形状）</li>
                <li>底部「401 触发演示」两个按钮：点「无 token」/「错 token」→ 看到 401 + reason + body 中文 error_description + header 英文</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  HTTP Authorization 头是<b>请求级</b>的——每个 HTTP 请求独立带身份，连接本身不绑死身份。
                  Client demo 端持久 transport 不重建，但 token 跟着每个浏览器请求走（Node AsyncLocalStorage 在请求作用域里传），
                  跟 HTTP Authorization 真正语义一致。Client demo 端**不存任何用户信息**：token 从浏览器来、跟着请求出去。
                </div>
                <div className="text-xs text-gray-600">
                  怎么在结果里观察这个核心点：底部 Output 区每张响应卡都标「调用方 &lt;userId&gt;」——和顶部「当前登录身份」一致；
                  切换身份后下一次请求的 Authorization 头立刻换成新 token（不需要重连、Client demo 也不需要知道身份）。
                </div>
              </div>

              {/* OAuth 2.1 概念卡 */}
              <div id="core-takeaway-oauth" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">OAuth 2.1 核心教学点</div>
                <div className="text-xs text-gray-800">
                  <b>OAuth 2.1 = 委托授权</b>。access token 不是「一把钥匙」，是「一张写着『我是谁、我能干什么、这令牌是发给哪个资源服务器的』的有效期证书」。四角色：用户 / 授权服务器 / MCP Client（持 token 转请求）/ MCP Server（Resource Server，验 audience）。
                </div>
                <div className="text-xs text-gray-800 mt-1">
                  <b>Audience（受众）校验</b>：token 上写的 <code>aud</code> 必须等于 MCP Server（Resource Server）的 <code>realm</code>。一把发给 "other-mcp" 的令牌，拿到我们的 "mcp" 端点来用 → <b>HTTP 401</b> + <code>WWW-Authenticate: Bearer realm="mcp", error="invalid_token", error_description="audience mismatch: this token was issued for 'other-mcp', not 'mcp'"</code>。这是 OAuth 2.1 防「confused deputy」的核心机制——token 不能跨资源服务器乱用。
                </div>
                <div className="text-xs text-gray-600">
                  怎么在结果里观察这个核心点：底部「OAuth 2.1」区点「用「发给别的 MCP server 的 token」试一次」按钮 → 看到远端返 HTTP 401 + body 里的中文 error_description + header 里的英文 error_description，对照 OAuth 2.1 §5.2 标准形状。
                </div>
              </div>
            </section>

            {/* 顶部「当前登录身份」选择器 */}
            <section id="user-banner" className="bg-blue-50 border border-blue-300 rounded p-4 space-y-2">
              <div className="text-sm font-semibold text-blue-900">
                当前登录身份：<code className="bg-white px-1 mx-1">{currentUserLabel}</code>
              </div>
              <div className="text-xs text-gray-700">
                连接状态：<code className="bg-white px-1 mx-1">{connectionStatus}</code> · 后续每个请求都从浏览器带 <code>Authorization: Bearer &lt;token&gt;</code>
              </div>
              <div className="flex flex-wrap gap-2">
                {USERS.map(function (u) {
                  const isActive = currentUserKey === u.key;
                  const isGod = u.key === "god";
                  return (
                    <button
                      key={u.key}
                      id={"btn-user-" + u.key}
                      disabled={busy}
                      onClick={function () { switchUser(u.key); }}
                      title={"切换登录身份为 " + u.label + "（只动浏览器 React state；Client demo 端不存 token）"}
                      className={
                        "px-3 py-1 rounded text-sm disabled:opacity-50 " +
                        (isActive
                          ? "bg-blue-600 text-white"
                          : isGod
                            ? "border border-red-400 bg-white text-red-800"
                            : "border border-blue-400 bg-white text-blue-800")
                      }
                    >
                      切换为 {u.label}
                    </button>
                  );
                })}
              </div>
            </section>

            {/* 控制按钮区：三个 MCP 模块 + list_my_tickets */}
            <section id="controls" className="bg-white shadow rounded p-4 space-y-4">
              <div>
                <div className="text-sm font-semibold text-gray-700 mb-2">工具（Tools）</div>
                <div className="flex flex-wrap gap-2 items-center">
                  <button id="btn-list-tools" onClick={onListToolsClick} disabled={busy} className="border border-gray-300 px-3 py-1 rounded text-sm disabled:opacity-50" title="HTTP POST tools/list">
                    列远端工具（tools/list）
                  </button>
                  <button id="btn-call-tool" onClick={onCallToolClick} disabled={busy || !tools} className="bg-blue-600 text-white px-3 py-1 rounded text-sm disabled:opacity-50" title="HTTP POST tools/call(make_latte)">
                    做一杯拿铁（tools/call · make_latte）
                  </button>
                  <button id="btn-list-my-tickets" onClick={onListMyTicketsClick} disabled={busy} className="border border-gray-300 px-3 py-1 rounded text-sm disabled:opacity-50" title="HTTP POST tools/call(list_my_tickets) — 当前身份过滤；god 模式看全部">
                    看我自己的工单（list_my_tickets · 按身份过滤）
                  </button>
                </div>
                <div className="flex items-center gap-2 text-sm mt-2">
                  <label htmlFor="cupSize">杯型（cupSize）：</label>
                  <select id="cupSize" value={cupSize} onChange={(e) => setCupSize(e.target.value)} className="border border-gray-300 px-2 py-1 rounded text-sm">
                    <option value="小杯">小杯</option>
                    <option value="中杯">中杯</option>
                    <option value="大杯">大杯</option>
                  </select>
                </div>
              </div>

              <div>
                <div className="text-sm font-semibold text-gray-700 mb-2">资源（Resources）</div>
                <div className="flex flex-wrap gap-2 items-center">
                  <button id="btn-list-resources" onClick={onListResourcesClick} disabled={busy} className="border border-gray-300 px-3 py-1 rounded text-sm disabled:opacity-50" title="HTTP POST resources/list">
                    列远端资源（resources/list）
                  </button>
                  <button id="btn-read-resource" onClick={onReadResourceClick} disabled={busy || !resources} className="bg-blue-600 text-white px-3 py-1 rounded text-sm disabled:opacity-50" title="HTTP POST resources/read(menu://today)">
                    读今日菜单（resources/read）
                  </button>
                </div>
              </div>

              <div>
                <div className="text-sm font-semibold text-gray-700 mb-2">提示词模板（Prompts）</div>
                <PromptsSection
                  prompts={prompts}
                  promptGet={promptGet}
                  customerName={customerName}
                  busy={busy}
                  currentUserKey={currentUserKey}
                  onListPromptsClick={onListPromptsClick}
                  onGetGreetingClick={onGetGreetingClick}
                  onGetRefundClick={onGetRefundClick}
                  onCustomerNameChange={setCustomerName}
                />
              </div>

              <TestAuthSection
                busy={busy}
                lastResult={testAuthResult}
                onTestNoToken={onTestNoToken}
                onTestWrongToken={onTestWrongToken}
              />

              <OauthSection
                busy={busy}
                lastResult={oauthResult}
                onTestAudience={onTestAudience}
              />

              {errMsg && (
                <div className="bg-red-50 border border-red-300 text-red-800 text-sm rounded p-2">
                  {errMsg}
                </div>
              )}
            </section>

            {/* 输出区：每张卡显示「调用方」 = 服务端实际看到的身份 */}
            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!tools && !toolCallResult && !myTickets && !resources && !resourceRead && !prompts && !promptGet && (
                <p className="text-xs text-gray-500">还没有运行结果。先点上方任意按钮。</p>
              )}

              {tools && (
                <div className="bg-green-50 border border-green-300 rounded p-3 space-y-1">
                  <div className="text-xs font-semibold text-green-900">
                    远端 MCP 响应 · tools/list · 调用方 <code>{currentUserKey ?? "未识别"}</code> · 耗时 {tools.elapsedMs} ms
                  </div>
                  <pre className="text-xs whitespace-pre-wrap max-h-48 overflow-auto">
                    {JSON.stringify(tools.tools, null, 2)}
                  </pre>
                </div>
              )}

              {toolCallResult && (
                <div className="bg-green-50 border border-green-300 rounded p-3 space-y-1">
                  <div className="text-xs font-semibold text-green-900">
                    远端 MCP 响应 · tools/call(make_latte) · 调用方 <code>{currentUserKey ?? "未识别"}</code> · 耗时 {toolCallResult.elapsedMs} ms
                  </div>
                  <pre className="text-xs whitespace-pre-wrap max-h-48 overflow-auto">
                    {JSON.stringify(toolCallResult.result, null, 2)}
                  </pre>
                </div>
              )}

              {myTickets && (
                <div className={
                  "rounded p-3 space-y-1 border " +
                  (myTickets.isGod ? "bg-red-50 border-red-400" : "bg-green-50 border-green-300")
                }>
                  <div className="text-xs font-semibold text-gray-900">
                    {myTickets.isGod ? "⚠" : "✅"} tools/call(list_my_tickets) ·{" "}
                    服务端 viewerUserId=<code>{myTickets.viewerUserId}</code> ·{" "}
                    看到 <code>{myTickets.tickets.length}</code> 张工单 · 耗时 {myTickets.elapsedMs} ms
                  </div>
                  {myTickets.isGod ? (
                    <div className="text-xs text-red-800 font-semibold">
                      ⚠ 反例：上帝令牌绕过 userId 过滤，能看到所有用户的工单。
                    </div>
                  ) : null}
                  <pre className="text-xs whitespace-pre-wrap max-h-48 overflow-auto bg-white border border-gray-200 rounded p-2">
                    {JSON.stringify(myTickets.tickets, null, 2)}
                  </pre>
                </div>
              )}

              {resources && (
                <div className="bg-green-50 border border-green-300 rounded p-3 space-y-1">
                  <div className="text-xs font-semibold text-green-900">
                    远端 MCP 响应 · resources/list · 调用方 <code>{currentUserKey ?? "未识别"}</code> · 耗时 {resources.elapsedMs} ms
                  </div>
                  <pre className="text-xs whitespace-pre-wrap max-h-48 overflow-auto">
                    {JSON.stringify(resources.resources, null, 2)}
                  </pre>
                </div>
              )}

              {resourceRead && (
                <div className="bg-green-50 border border-green-300 rounded p-3 space-y-1">
                  <div className="text-xs font-semibold text-green-900">
                    远端 MCP 响应 · resources/read(menu://today) · 调用方 <code>{currentUserKey ?? "未识别"}</code> · 耗时 {resourceRead.elapsedMs} ms
                  </div>
                  <pre className="text-xs whitespace-pre-wrap max-h-48 overflow-auto">
                    {JSON.stringify(resourceRead.result, null, 2)}
                  </pre>
                </div>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">端口 50135 · 协议 Transport · streamable-http-client · …（加载中）</span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
