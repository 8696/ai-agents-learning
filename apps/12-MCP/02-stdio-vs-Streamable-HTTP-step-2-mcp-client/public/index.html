<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streamable HTTP MCP Client · 第二步（step-2）· Client 连远端 HTTP MCP endpoint</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- 共享 JSX 组件（按 §5.3.8：内联脚本只装配；超过 400 行的部分拆到 components/） -->
  <script type="text/babel" src="/components/prompts.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    // 共享组件：PromptsSection 在 public/components/prompts.js 里挂 window.DemoUI.PromptsSection
    const { PromptsSection } = window.DemoUI || {};

    function App() {
      const [status, setStatus] = useState("⏸ 待连接");
      const [busy, setBusy] = useState(false);
      const [clientInfo, setClientInfo] = useState(null);
      const [tools, setTools] = useState(null);
      const [toolCallResult, setToolCallResult] = useState(null);
      const [resources, setResources] = useState(null);
      const [resourceRead, setResourceRead] = useState(null);
      const [prompts, setPrompts] = useState(null);
      const [promptGet, setPromptGet] = useState(null);
      const [customerName, setCustomerName] = useState("张三");
      const [cupSize, setCupSize] = useState("中杯");
      const [errMsg, setErrMsg] = useState("");

      useEffect(() => {
        fetch("/health").then(r => r.json()).then(d => {
          const el = document.getElementById("env-info");
          if (!el) return;
          el.textContent =
            `端口 ${d.port} · 协议 Transport · ${d.transport} · 模型服务商 ${d.provider ?? "—"} · 模型 ${d.model ?? "—"} · 密钥 ${d.hasKey ? "✅" : "❌"} · 本地计算 · 不调大模型`;
        }).catch(() => {});
      }, []);

      async function call(url, body, onOk) {
        setBusy(true);
        setErrMsg("");
        setStatus("🔄 请求中");
        const t0 = Date.now();
        try {
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body ?? {}),
          });
          const data = await res.json();
          const elapsed = Date.now() - t0;
          if (!res.ok || !data.ok) {
            setErrMsg(data.error || `HTTP ${res.status}`);
            setStatus("❌ 错误");
            return;
          }
          onOk(data, elapsed);
          setStatus("✅ 完成");
        } catch (e) {
          setErrMsg(e instanceof Error ? e.message : String(e));
          setStatus("❌ 错误");
        } finally {
          setBusy(false);
        }
      }

      function onConnectClick() {
        call("/api/http/connect", {}, (data, ms) => {
          setClientInfo({ ...data.status, elapsedMs: ms });
        });
      }

      function onListToolsClick() {
        call("/api/http/list-tools", {}, (data, ms) => {
          setTools({ tools: data.tools, elapsedMs: ms });
        });
      }

      function onCallToolClick() {
        call("/api/http/call-tool", { cupSize }, (data, ms) => {
          setToolCallResult({ result: data.result, elapsedMs: ms });
        });
      }

      function onListResourcesClick() {
        call("/api/http/list-resources", {}, (data, ms) => {
          setResources({ resources: data.resources, elapsedMs: ms });
        });
      }

      function onReadResourceClick() {
        call("/api/http/read-resource", { uri: "menu://today" }, (data, ms) => {
          setResourceRead({ result: data.result, elapsedMs: ms });
        });
      }

      function onListPromptsClick() {
        call("/api/http/list-prompts", {}, (data, ms) => {
          setPrompts({ prompts: data.prompts, elapsedMs: ms });
        });
      }

      function onGetGreetingClick() {
        call(
          "/api/http/get-prompt",
          { name: "customer_service_greeting", arguments: { customerName } },
          (data, ms) => {
            setPromptGet({ result: data.result, error: data.error, elapsedMs: ms, label: "客服开场白" });
          },
        );
      }

      function onGetRefundClick() {
        call(
          "/api/http/get-prompt",
          { name: "refund_response", arguments: { orderId: "ORD-2026-001", reason: "商品与描述不符" } },
          (data, ms) => {
            setPromptGet({ result: data.result, error: data.error, elapsedMs: ms, label: "退款话术" });
          },
        );
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              Streamable HTTP MCP Client · 第二步（step-2）· Client 连远端 HTTP MCP endpoint
            </h1>
            <span id="status-pill" className="text-xs px-2 py-1 rounded bg-gray-200">{status}</span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">本页只演示：<b>Streamable HTTP 形态的 MCP Client —— 我是浏览器面前的这个进程，但 MCP 请求走 HTTP POST 飞到另一个进程（Server demo · 端口 50134）的 MCP endpoint</b>。</p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>点「连远端吧台」：服务端去 <code>http://127.0.0.1:50134/mcp</code> 走 HTTP 握手（不是 spawn），返 sessionId</li>
                <li>点「看吧台菜单 / 列工具」：HTTP POST tools/list → 远端 Server 真在另一个进程里处理 → HTTP 响应回</li>
                <li>点「做一杯」：HTTP POST tools/call(make_latte) → 远端做拿铁 → 响应回</li>
                <li>点「看资源 / 读资源」：HTTP POST resources/list + resources/read</li>
                <li>对比 step-1 的 stdio：现在没有真子进程（本进程），MCP endpoint 是另一台机器/进程的事</li>
              </ol>

              {/* 核心教学点卡片 */}
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  Streamable HTTP 形态的 Client 没有"拥有"Server。Client 进程死了，Server 不受影响；Server 进程死了，Client 这边会拿到错误。这跟 step-1 的 stdio（Client 死了 Server 跟着死）正好反过来 —— HTTP Transport 把"父子绑定"换成了"远端调用"。
                </div>
                <div className="text-xs text-gray-600">
                  怎么在结果里观察这个核心点：点完「连远端吧台」后看下方 clientInfo.sessionId —— 这是 HTTP 协议层的 session 标识（不是父子进程的 pid）；它来自 Server demo 那边，跟 Client 这边的进程完全解耦。试想：杀掉 Server demo 进程，再点「调工具」会立刻拿错误。
                </div>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="flex flex-wrap gap-2 items-center">
                <button
                  id="btn-connect"
                  onClick={onConnectClick}
                  disabled={busy}
                  className="bg-blue-600 text-white px-3 py-1 rounded text-sm disabled:opacity-50"
                  title="连远端 MCP Server（HTTP POST 握手）"
                >
                  连远端吧台（HTTP POST 握手 · 首次才真连）
                </button>
                <button
                  id="btn-list-tools"
                  onClick={onListToolsClick}
                  disabled={busy}
                  className="border border-gray-300 px-3 py-1 rounded text-sm disabled:opacity-50"
                  title="HTTP POST tools/list，让远端 Server 告诉我们它有哪些工具"
                >
                  看吧台菜单（HTTP tools/list）
                </button>
                <button
                  id="btn-call-tool"
                  onClick={onCallToolClick}
                  disabled={busy || !tools}
                  className="bg-blue-600 text-white px-3 py-1 rounded text-sm disabled:opacity-50"
                  title="HTTP POST tools/call(make_latte)"
                >
                  做一杯拿铁（HTTP tools/call）
                </button>
                <button
                  id="btn-list-resources"
                  onClick={onListResourcesClick}
                  disabled={busy}
                  className="border border-gray-300 px-3 py-1 rounded text-sm disabled:opacity-50"
                  title="HTTP POST resources/list"
                >
                  看今日菜单（HTTP resources/list）
                </button>
                <button
                  id="btn-read-resource"
                  onClick={onReadResourceClick}
                  disabled={busy || !resources}
                  className="border border-gray-300 px-3 py-1 rounded text-sm disabled:opacity-50"
                  title="HTTP POST resources/read(menu://today)"
                >
                  读今日菜单（HTTP resources/read）
                </button>
                {/* Prompts 块：4 个控件 + 2 张输出卡 拆到 public/components/prompts.js，文件超过 400 行硬约束 */}
                <PromptsSection
                  prompts={prompts}
                  promptGet={promptGet}
                  customerName={customerName}
                  busy={busy}
                  onListPromptsClick={onListPromptsClick}
                  onGetGreetingClick={onGetGreetingClick}
                  onGetRefundClick={onGetRefundClick}
                  onCustomerNameChange={setCustomerName}
                />
              </div>

              <div className="flex items-center gap-2 text-sm">
                <label htmlFor="cupSize">杯型（cupSize）：</label>
                <select
                  id="cupSize"
                  value={cupSize}
                  onChange={(e) => setCupSize(e.target.value)}
                  className="border border-gray-300 px-2 py-1 rounded text-sm"
                >
                  <option value="小杯">小杯</option>
                  <option value="中杯">中杯</option>
                  <option value="大杯">大杯</option>
                </select>
              </div>

              {errMsg && (
                <div className="bg-red-50 border border-red-300 text-red-800 text-sm rounded p-2">
                  {errMsg}
                </div>
              )}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {!clientInfo && !tools && !toolCallResult && !resources && !resourceRead && !prompts && !promptGet && (
                <p className="text-xs text-gray-500">还没有运行结果。先点「连远端吧台」。</p>
              )}

              {clientInfo && (
                <div className="bg-gray-50 border border-gray-300 rounded p-3 space-y-1">
                  <div className="text-xs font-semibold text-gray-700">
                    客户端状态（HTTP Transport · 跨进程）
                  </div>
                  <div className="text-xs text-gray-600">远端 endpoint：<code>{clientInfo.endpoint}</code></div>
                  <div className="text-xs text-gray-600">HTTP session ID：<code>{clientInfo.sessionId ?? "(尚未生成)"}</code>（由 Server 端生成）</div>
                  <div className="text-xs text-gray-600">连接时刻：<code>{new Date(clientInfo.startedAt).toLocaleTimeString()}</code></div>
                  <div className="text-xs text-gray-600">本次握手耗时：<code>{clientInfo.elapsedMs} ms</code></div>
                </div>
              )}

              {tools && (
                <div className="bg-green-50 border border-green-300 rounded p-3 space-y-1">
                  <div className="text-xs font-semibold text-green-900">
                    远端 MCP 响应 · tools/list · 耗时 {tools.elapsedMs} ms
                  </div>
                  <pre className="text-xs whitespace-pre-wrap max-h-48 overflow-auto">
                    {JSON.stringify(tools.tools, null, 2)}
                  </pre>
                </div>
              )}

              {toolCallResult && (
                <div className="bg-green-50 border border-green-300 rounded p-3 space-y-1">
                  <div className="text-xs font-semibold text-green-900">
                    远端 MCP 响应 · tools/call(make_latte) · 耗时 {toolCallResult.elapsedMs} ms
                  </div>
                  <pre className="text-xs whitespace-pre-wrap max-h-48 overflow-auto">
                    {JSON.stringify(toolCallResult.result, null, 2)}
                  </pre>
                </div>
              )}

              {resources && (
                <div className="bg-green-50 border border-green-300 rounded p-3 space-y-1">
                  <div className="text-xs font-semibold text-green-900">
                    远端 MCP 响应 · resources/list · 耗时 {resources.elapsedMs} ms
                  </div>
                  <pre className="text-xs whitespace-pre-wrap max-h-48 overflow-auto">
                    {JSON.stringify(resources.resources, null, 2)}
                  </pre>
                </div>
              )}

              {resourceRead && (
                <div className="bg-green-50 border border-green-300 rounded p-3 space-y-1">
                  <div className="text-xs font-semibold text-green-900">
                    远端 MCP 响应 · resources/read(menu://today) · 耗时 {resourceRead.elapsedMs} ms
                  </div>
                  <pre className="text-xs whitespace-pre-wrap max-h-48 overflow-auto">
                    {JSON.stringify(resourceRead.result, null, 2)}
                  </pre>
                </div>
              )}

              {/* Prompts 输出卡已拆到 public/components/prompts.js（PromptsSection 内部） */}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <span id="env-info">端口 50135 · 协议 Transport · streamable-http-client · …（加载中）</span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
