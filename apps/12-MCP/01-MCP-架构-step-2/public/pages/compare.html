<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCP 架构 · 三原语对照（同一轮退款）</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="../utils/api-client.js"></script>
  <script type="text/babel" src="../components/layout.js"></script>
  <script type="text/babel" src="../components/protocol-card.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, EnvFooter, ProtocolCard } = window.DemoUI;
    const { postJson, getJson } = window.DemoUtils;

    function App() {
      const [env, setEnv] = useState(null);
      const [orderId, setOrderId] = useState("A-1001");
      const [reason, setReason] = useState("七天无理由");
      const [initOk, setInitOk] = useState(false);
      const [resourceCard, setResourceCard] = useState(null);
      const [promptCard, setPromptCard] = useState(null);
      const [toolCard, setToolCard] = useState(null);
      const [busyInit, setBusyInit] = useState(false);
      const [busyCol, setBusyCol] = useState({ resource: false, prompt: false, tool: false });
      const [httpError, setHttpError] = useState({ resource: "", prompt: "", tool: "", init: "" });
      const [status, setStatus] = useState("idle");

      useEffect(function () {
        getJson("/health").then(function (r) {
          if (r.httpOk) setEnv(r.json);
        });
      }, []);

      async function runInit() {
        setBusyInit(true);
        setHttpError(function (prev) { return Object.assign({}, prev, { init: "" }); });
        setStatus("loading");
        try {
          const r = await postJson("/api/mcp/initialize", {});
          if (!r.httpOk) {
            setStatus("err");
            setHttpError(function (prev) { return Object.assign({}, prev, { init: "HTTP " + r.httpStatus + "：" + ((r.json && r.json.error) || "请求失败") }); });
            return;
          }
          if (r.json.protocolOk) setInitOk(true);
          setStatus(r.json.protocolOk ? "ok" : "err");
        } catch (err) {
          setStatus("err");
          setHttpError(function (prev) { return Object.assign({}, prev, { init: String(err && err.message ? err.message : err) }); });
        } finally {
          setBusyInit(false);
        }
      }

      async function runColumn(kind, url, body) {
        const setter = kind === "resource" ? setResourceCard : kind === "prompt" ? setPromptCard : setToolCard;
        const busySetter = function (v) {
          setBusyCol(function (prev) { return Object.assign({}, prev, { [kind]: v }); });
        };
        const errorSetter = function (v) {
          setHttpError(function (prev) { return Object.assign({}, prev, { [kind]: v }); });
        };
        busySetter(true);
        errorSetter("");
        setStatus("loading");
        try {
          const r = await postJson(url, body || {});
          if (!r.httpOk) {
            setStatus("err");
            errorSetter("HTTP " + r.httpStatus + "：" + ((r.json && r.json.error) || "请求失败"));
            return;
          }
          setter(r.json);
          setStatus(r.json.protocolOk ? "ok" : "err");
        } catch (err) {
          setStatus("err");
          errorSetter(String(err && err.message ? err.message : err));
        } finally {
          busySetter(false);
        }
      }

      function runAll() {
        // 前端 Promise.all 并行触发三条独立请求。后端不打包跑，是浏览器并发。
        Promise.all([
          runColumn("resource", "/api/mcp/resources-read", { uri: "policy://return-2026" }),
          runColumn("prompt", "/api/mcp/prompts-get", {
            name: "refund-script",
            arguments: { orderId: orderId, reason: reason },
          }),
          runColumn("tool", "/api/mcp/tools-call", {
            name: "create_ticket",
            arguments: { orderId: orderId, reason: reason },
          }),
        ]);
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              MCP 架构（Model Context Protocol） · 第二步（step-2） · 三原语对照（同一轮退款 · 三栏独立请求）
            </h1>
            <StatusPill status={status} />
          </header>
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">
                本页只演示：<b>同一轮「退款」里三种原语同时出现。</b>
                政策走 resources/read（应用拉）、话术走 prompts/get（用户点）、建单走 tools/call（模型调）。三栏独立请求，前端 Promise.all 并行触发，后端不打包跑一条轨迹。也不调大模型。
              </p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>填「订单号（orderId）」和「退款原因（reason）」。</li>
                <li>点「① 初始化（initialize）」：发出 initialize。三扇门全开（tools / resources / prompts）。</li>
                <li>点「② 政策 / 话术 / 建单 三栏对照」：前端发三个独立请求——resources/read {`{ uri: "policy://return-2026" }`}、prompts/get {`{ name: "refund-script", arguments }`}、tools/call {`{ name: "create_ticket", arguments }`}。三栏结果并排渲染。</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <div className="text-xs text-gray-800">
                  同一场景里三种原语 = 三种控制权：政策由应用拉、话术由用户点、建单由模型调。三栏各自独立请求，前端 Promise.all 并行触发——服务端禁止用一个 /api/compare 打包跑多条轨迹。
                </div>
                <div className="text-xs text-gray-600">
                  怎么观察：三栏请求的 method 各是 resources/read / prompts/get / tools/call；响应里左栏 result.contents[0].text 是政策正文（无副作用）、中栏 result.messages 是话术数组（无副作用）、右栏 result.content 是工单确认（有副作用、真的建了一张工单 T-XXXX）。走错对照：把「读政策」做成工具 → 模型每次都调；把「建工单」做成资源 → 应用误把副作用当数据塞上下文。
                </div>
              </div>
            </section>
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="grid md:grid-cols-2 gap-2">
                <label className="block text-xs text-gray-700">
                  订单号（orderId）
                  <input
                    className="mt-1 border rounded px-2 py-1 text-sm w-full"
                    value={orderId}
                    onChange={function (event) { setOrderId(event.target.value); }}
                  />
                </label>
                <label className="block text-xs text-gray-700">
                  退款原因（reason）
                  <input
                    className="mt-1 border rounded px-2 py-1 text-sm w-full"
                    value={reason}
                    onChange={function (event) { setReason(event.target.value); }}
                  />
                </label>
              </div>
              <div className="flex flex-wrap gap-2">
                <button
                  type="button"
                  className="bg-blue-600 text-white text-sm px-3 py-1.5 rounded disabled:opacity-50"
                  disabled={busyInit}
                  onClick={runInit}
                >
                  ① 初始化（initialize · 三扇门全开）
                </button>
                <button
                  type="button"
                  className="bg-blue-600 text-white text-sm px-3 py-1.5 rounded disabled:opacity-50"
                  disabled={!initOk || busyInit || busyCol.resource || busyCol.prompt || busyCol.tool}
                  onClick={runAll}
                >
                  ② 政策 / 话术 / 建单 三栏对照（前端 Promise.all 并行触发 · 三个独立请求）
                </button>
              </div>
              <p className="text-xs text-gray-600">点了会发三个独立请求——resources/read + prompts/get + tools/call。期望三栏都成功；后端不打包跑，前端 Promise.all 触发。</p>
              {httpError.init ? (
                <div className="border border-red-300 bg-red-50 rounded p-2 text-xs text-red-800">{httpError.init}</div>
              ) : null}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-3 min-h-[200px]">
              <section id="compare-grid" className="grid md:grid-cols-3 gap-3">
                {/* 左栏：政策（resource） */}
                <article className="bg-white shadow rounded p-3 space-y-2 border border-purple-200">
                  <header className="flex items-center justify-between">
                    <h2 className="text-sm font-semibold text-purple-800">政策 · resource</h2>
                    <span className="text-xs px-2 py-0.5 rounded bg-purple-100 text-purple-800">应用控制 · 无副作用</span>
                  </header>
                  <p className="text-xs text-gray-600">应用 / 宿主主动拉 URI，宿主把正文塞上下文。</p>
                  <p className="text-xs text-gray-500">请求：resources/read {`{ uri: "policy://return-2026" }`}</p>
                  <button
                    type="button"
                    className="border border-purple-400 text-purple-800 text-sm px-3 py-1 rounded disabled:opacity-50"
                    disabled={!initOk || busyCol.resource}
                    onClick={function () { runColumn("resource", "/api/mcp/resources-read", { uri: "policy://return-2026" }); }}
                  >
                    单跑：读政策
                  </button>
                  {httpError.resource ? (
                    <div className="border border-red-300 bg-red-50 rounded p-2 text-xs text-red-800">{httpError.resource}</div>
                  ) : null}
                  {resourceCard ? <ProtocolCard card={resourceCard} /> : (
                    <p className="text-xs text-gray-500">还没读政策。</p>
                  )}
                </article>

                {/* 中栏：话术（prompt） */}
                <article className="bg-white shadow rounded p-3 space-y-2 border border-amber-200">
                  <header className="flex items-center justify-between">
                    <h2 className="text-sm font-semibold text-amber-800">话术 · prompt</h2>
                    <span className="text-xs px-2 py-0.5 rounded bg-amber-100 text-amber-800">用户控制 · 无副作用</span>
                  </header>
                  <p className="text-xs text-gray-600">用户点菜单，宿主 prompts/get 拿消息数组再塞对话。</p>
                  <p className="text-xs text-gray-500">请求：prompts/get {`{ name: "refund-script", arguments }`}</p>
                  <button
                    type="button"
                    className="border border-amber-400 text-amber-800 text-sm px-3 py-1 rounded disabled:opacity-50"
                    disabled={!initOk || busyCol.prompt}
                    onClick={function () {
                      runColumn("prompt", "/api/mcp/prompts-get", {
                        name: "refund-script",
                        arguments: { orderId: orderId, reason: reason },
                      });
                    }}
                  >
                    单跑：取话术
                  </button>
                  {httpError.prompt ? (
                    <div className="border border-red-300 bg-red-50 rounded p-2 text-xs text-red-800">{httpError.prompt}</div>
                  ) : null}
                  {promptCard ? <ProtocolCard card={promptCard} /> : (
                    <p className="text-xs text-gray-500">还没取话术。</p>
                  )}
                </article>

                {/* 右栏：建单（tool） */}
                <article className="bg-white shadow rounded p-3 space-y-2 border border-red-200">
                  <header className="flex items-center justify-between">
                    <h2 className="text-sm font-semibold text-red-800">建单 · tool</h2>
                    <span className="text-xs px-2 py-0.5 rounded bg-red-100 text-red-800">模型控制 · 有副作用</span>
                  </header>
                  <p className="text-xs text-gray-600">模型选工具，调用真留下一张工单。</p>
                  <p className="text-xs text-gray-500">请求：tools/call {`{ name: "create_ticket", arguments }`}</p>
                  <button
                    type="button"
                    className="border border-red-400 text-red-800 text-sm px-3 py-1 rounded disabled:opacity-50"
                    disabled={!initOk || busyCol.tool}
                    onClick={function () {
                      runColumn("tool", "/api/mcp/tools-call", {
                        name: "create_ticket",
                        arguments: { orderId: orderId, reason: reason },
                      });
                    }}
                  >
                    单跑：建工单
                  </button>
                  {httpError.tool ? (
                    <div className="border border-red-300 bg-red-50 rounded p-2 text-xs text-red-800">{httpError.tool}</div>
                  ) : null}
                  {toolCard ? <ProtocolCard card={toolCard} /> : (
                    <p className="text-xs text-gray-500">还没建工单。</p>
                  )}
                </article>
              </section>

              <section id="compare-table" className="bg-white shadow rounded p-4">
                <h2 className="text-sm font-semibold mb-2">控制权对照（同一轮退款里的三种原语）</h2>
                <table className="w-full text-xs border-collapse">
                  <thead>
                    <tr className="bg-gray-100">
                      <th className="border p-2 text-left">原语</th>
                      <th className="border p-2 text-left">谁决定用</th>
                      <th className="border p-2 text-left">方法</th>
                      <th className="border p-2 text-left">副作用</th>
                      <th className="border p-2 text-left">这一栏的典型用途</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td className="border p-2 font-mono">tool</td>
                      <td className="border p-2">模型</td>
                      <td className="border p-2 font-mono">tools/call</td>
                      <td className="border p-2">有（真建工单）</td>
                      <td className="border p-2">真做一件事</td>
                    </tr>
                    <tr>
                      <td className="border p-2 font-mono">resource</td>
                      <td className="border p-2">应用 / 宿主</td>
                      <td className="border p-2 font-mono">resources/read</td>
                      <td className="border p-2">无</td>
                      <td className="border p-2">塞上下文（政策正文）</td>
                    </tr>
                    <tr>
                      <td className="border p-2 font-mono">prompt</td>
                      <td className="border p-2">用户</td>
                      <td className="border p-2 font-mono">prompts/get</td>
                      <td className="border p-2">无</td>
                      <td className="border p-2">选话术塞对话</td>
                    </tr>
                  </tbody>
                </table>
                <p className="text-xs text-gray-500 mt-2">
                  走错对照：把「读政策」做成工具 → 模型可能每次都调；把「建工单」做成资源 → 应用误把副作用当数据塞上下文。
                </p>
              </section>
            </section>
          </main>
          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <EnvFooter env={env} />
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
