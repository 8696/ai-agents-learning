<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System / User / Assistant 优先级 · 总览</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel">
    /**
     * 本页教学点：三条 case 怎么连在一起。本页不调模型。
     * 对照例外：同一份 prompt 并排看协议 A（messages[].system）和协议 B（顶层 system）。
     */
    const { useState } = React;
    const INTRO_STEPS = [
      "角色优先级是训练事实：System 压 User，User 压 Assistant，不是厂商开关",
      "协议 A 把 system 放进 messages[]；协议 B 放顶层 system —— 语义一样，字段位置不同",
      "Case 1 看 System JSON-only 能不能压过 User 的长文段",
      "Case 2 / 3 对照：assistant 历史塞回去才叫多轮；漏塞 = 失忆或瞎编",
    ];
    const SCENES = [
      {
        href: "/pages/priority.html",
        title: "Case 1 · 优先级",
        desc: "System 要 JSON-only，User 要 ≥80 字散文。期望 SYSTEM_WIN；妥协则 PARTIAL / USER_WIN。",
      },
      {
        href: "/pages/with-history.html",
        title: "Case 2 · 有 assistant 历史",
        desc: "三轮 user / assistant / user。期望提到「北京」→ REMEMBERED。",
      },
      {
        href: "/pages/no-history.html",
        title: "Case 3 · 漏塞 assistant",
        desc: "两轮 user/user。期望 FORGOT 或 PARTIAL。协议 B 常会自信地编，是幻觉样本。",
      },
    ];
    window.DemoUtils.waitDemoUI(["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo"], function () {
      const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo } = window.DemoUI;
      function App() {
        const { env, envError } = useEnvInfo();
        const [status, setStatus] = useState("idle"); // #status-pill：总览只跟 /health 走
        React.useEffect(function () {
          if (envError) setStatus("error");
          else if (env.port) setStatus("ok");
        }, [env, envError]);
        return (
          <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
            <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
              <h1 id="page-title" className="text-xl font-semibold">System / User / Assistant 优先级</h1>
              <StatusPill status={status} />
            </header>
            <main id="page-main" className="container mx-auto p-4 space-y-4">
              <PageIntro
                summary="同一份 prompt 并排打协议 A 和协议 B，看 System 优先级和 assistant 历史塞不塞回去。"
                steps={INTRO_STEPS}
                extra={
                  <pre className="whitespace-pre-wrap bg-gray-50 p-2 rounded text-xs text-gray-700">
{`浏览器 POST /api/caseN
  → route 分叉：sendViaA（openai）|| sendViaB（Anthropic）
  → 共用 judge（SYSTEM_WIN / USER_WIN / REMEMBERED / FORGOT）
  → JSON { a, b } 并排回到页面

协议 A：system ∈ messages[]     usage = prompt/completion_tokens
协议 B：system 顶层字段         usage = input/output_tokens`}
                  </pre>
                }
              />
              <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                <PageNav />
                <p className="text-sm text-gray-600">
                  总览页不发起模型请求。选一个 Case 进去跑，每页只演示一个教学点。
                </p>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                  {SCENES.map(function (s) {
                    return (
                      <a key={s.href} href={s.href} className="border border-gray-300 hover:border-blue-500 rounded p-3">
                        <div className="font-semibold text-sm">{s.title}</div>
                        <div className="text-xs text-gray-500 mt-1">{s.desc}</div>
                      </a>
                    );
                  })}
                </div>
              </section>
              <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] text-sm text-gray-600 space-y-2">
                {envError && <p className="text-red-700">{envError}</p>}
                {!env.hasKey && env.port && (
                  <p className="text-red-600 text-xs">页脚 Key ❌：场景页主按钮会禁用，先配 apps/.env。</p>
                )}
                <p>进场景页后，左侧协议 A、右侧协议 B；判定 pill 来自服务端，页面不自己猜。</p>
              </section>
            </main>
            <EnvFooter env={env} />
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    });
  </script>
</body>
</html>
