<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>豆谷客服中台</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
    integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
    crossorigin="anonymous"></script>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INBOX_SAMPLES = [
      "订单 80012345 已经发货，收件人 李雷，金额 288.00 元。盒子压扁了，但真空袋是好的，我想问现在到哪了？",
      "你们这破店把我拉黑了，我要投诉！洒了一地，客服已读不回。",
      "今天深圳的天气真不错啊。对了这款还有 XXL 吗？",
    ];
    const MINUTES_SAMPLE = "李雷本周五前出需求文档；王芳下周一提交测试用例；没人认领的法务环节需要有人顶上。";
    const FAQ_SAMPLE = "试用期有年终奖吗？";

    function pillClass(status) {
      if (status === "loading") return "text-xs px-2 py-1 rounded bg-blue-100";
      if (status === "ok") return "text-xs px-2 py-1 rounded bg-green-100";
      if (status === "err") return "text-xs px-2 py-1 rounded bg-red-200";
      return "text-xs px-2 py-1 rounded bg-gray-200";
    }
    function pillText(status) {
      if (status === "loading") return "🔄请求中";
      if (status === "ok") return "✅完成";
      if (status === "err") return "❌错误";
      return "⏸待连接";
    }

    function Used({ used }) {
      if (!used || !used.length) return null;
      return (
        <p className="text-xs text-gray-400 pt-3 border-t">
          本单 Prompt {used.map((u) => u.id + " v" + u.version).join(" · ")}
        </p>
      );
    }

    function App() {
      const [desk, setDesk] = useState("inbox");
      const [status, setStatus] = useState("idle");
      const [message, setMessage] = useState(INBOX_SAMPLES[0]);
      const [minutes, setMinutes] = useState(MINUTES_SAMPLE);
      const [question, setQuestion] = useState(FAQ_SAMPLE);
      const [result, setResult] = useState(null);
      const [errorText, setErrorText] = useState("");
      const [modelLabel, setModelLabel] = useState("随 LLM_PROVIDER");

      useEffect(() => {
        fetch("/health")
          .then((r) => r.json())
          .then((d) => {
            if (d.model) setModelLabel(d.model);
          })
          .catch(() => {});
      }, []);

      async function post(path, body) {
        setStatus("loading");
        setErrorText("");
        setResult(null);
        try {
          const res = await fetch(path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (!res.ok) {
            setStatus("err");
            setErrorText((data && data.error) || ("HTTP " + res.status));
            return;
          }
          setStatus("ok");
          setResult({ path, data });
        } catch (error) {
          setStatus("err");
          setErrorText(error instanceof Error ? error.message : String(error));
        }
      }

      const busy = status === "loading";

      return (
        <div className="min-h-screen bg-stone-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <div>
              <h1 id="page-title" className="text-xl font-semibold">豆谷客服中台</h1>
              <p className="text-xs text-gray-500">处理来信、纪要和制度问答 · 不是 Demo 开关盘</p>
            </div>
            <span id="status-pill" className={pillClass(status)}>{pillText(status)}</span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4 max-w-3xl">
            <nav className="flex gap-1 text-sm bg-white rounded shadow p-1">
              {[
                ["inbox", "客户来信"],
                ["minutes", "会议待办"],
                ["faq", "制度问答"],
              ].map(([id, label]) => (
                <button
                  key={id}
                  className={"flex-1 py-2 rounded " + (desk === id ? "bg-stone-800 text-white" : "text-gray-600")}
                  disabled={busy}
                  onClick={() => { setDesk(id); setResult(null); setErrorText(""); setStatus("idle"); }}
                >{label}</button>
              ))}
            </nav>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              {desk === "inbox" && (
                <>
                  <p className="text-sm text-gray-600">把客户原话贴进来，生成一张工单：去向、订单字段、评价、情感、书面转述和摘要。</p>
                  <div className="flex flex-wrap gap-2">
                    {INBOX_SAMPLES.map((s, i) => (
                      <button key={i} className="text-xs px-2 py-1 rounded bg-stone-100" disabled={busy} onClick={() => setMessage(s)}>示例 {i + 1}</button>
                    ))}
                  </div>
                  <textarea className="w-full border rounded p-2 h-28 text-sm" value={message} disabled={busy} onChange={(e) => setMessage(e.target.value)} />
                  <button className="px-4 py-2 rounded bg-stone-800 text-white disabled:opacity-40" disabled={busy} onClick={() => post("/api/inbox", { message })}>处理来信</button>
                </>
              )}
              {desk === "minutes" && (
                <>
                  <p className="text-sm text-gray-600">把纪要转成带负责人的待办。写不出姓名会标 unknown。</p>
                  <textarea className="w-full border rounded p-2 h-28 text-sm" value={minutes} disabled={busy} onChange={(e) => setMinutes(e.target.value)} />
                  <button className="px-4 py-2 rounded bg-stone-800 text-white disabled:opacity-40" disabled={busy} onClick={() => post("/api/minutes", { minutes })}>生成待办</button>
                </>
              )}
              {desk === "faq" && (
                <>
                  <p className="text-sm text-gray-600">只根据公司制度段落回答。制度里没有的会说不知道，不编。</p>
                  <input className="w-full border rounded px-2 py-2 text-sm" value={question} disabled={busy} onChange={(e) => setQuestion(e.target.value)} />
                  <button className="px-4 py-2 rounded bg-stone-800 text-white disabled:opacity-40" disabled={busy} onClick={() => post("/api/faq", { question })}>查询制度</button>
                </>
              )}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 min-h-[220px] space-y-3">
              {errorText && <p className="text-sm text-red-700">{errorText}</p>}
              {!result && !errorText && <p className="text-sm text-gray-400">处理结果会出现在这里。</p>}
              {result && result.path === "/api/inbox" && (
                <div className="space-y-3 text-sm">
                  <div>
                    <div className="text-xs text-gray-400">工单去向</div>
                    <pre className="whitespace-pre-wrap">{result.data.route}</pre>
                  </div>
                  <div>
                    <div className="text-xs text-gray-400">订单字段</div>
                    <pre className="whitespace-pre-wrap">{result.data.order}</pre>
                  </div>
                  <div>
                    <div className="text-xs text-gray-400">评价（Few-shot + 包装灰区定义）</div>
                    <pre className="whitespace-pre-wrap">{result.data.review}</pre>
                  </div>
                  <div>
                    <div className="text-xs text-gray-400">情感</div>
                    <pre className="whitespace-pre-wrap">{result.data.sentiment}</pre>
                  </div>
                  <div>
                    <div className="text-xs text-gray-400">书面转述（给内部看）</div>
                    <pre className="whitespace-pre-wrap">{result.data.restated}</pre>
                  </div>
                  <div>
                    <div className="text-xs text-gray-400">来信摘要</div>
                    <pre className="whitespace-pre-wrap">{result.data.summary}</pre>
                  </div>
                  <Used used={result.data.used} />
                </div>
              )}
              {result && result.path === "/api/minutes" && (
                <div className="text-sm space-y-3">
                  <div>
                    <div className="text-xs text-gray-400">待办</div>
                    <pre className="whitespace-pre-wrap">{result.data.actions}</pre>
                  </div>
                  <Used used={result.data.used} />
                </div>
              )}
              {result && result.path === "/api/faq" && (
                <div className="text-sm space-y-3">
                  <div>
                    <div className="text-xs text-gray-400">答复</div>
                    <pre className="whitespace-pre-wrap">{result.data.answer}</pre>
                  </div>
                  <Used used={result.data.used} />
                </div>
              )}
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            端口 50305 · 协议 A · 模型 {modelLabel}
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
