<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Few-shot / Zero-shot · 总览</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>

  <script type="text/babel">
    /**
     * 本页教学点：Zero 与 Few 差的是 messages 里有没有 4 对假对话。本页不调模型。
     */
    const { useState } = React;

    const INTRO_STEPS = [
      "GET /health 带回教案条数和样本，页面不写死 k=4",
      "对照页发 POST /api/classify { text, modes }",
      "Zero：messages = system + 当前 user",
      "Few：messages = system + 4 对假 user/assistant + 当前 user",
      "服务端先剥思考块，再用 Zod 判 {label, reason}",
    ];

    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo } = window.DemoUI;

        function App() {
          const { env, envError } = useEnvInfo();
          const [status, setStatus] = useState("idle");

          React.useEffect(function () {
            if (envError) setStatus("error");
            else if (env.port) setStatus("ok");
          }, [env, envError]);

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">Few-shot / Zero-shot</h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                <PageIntro
                  summary="同一 System、同一句评价，对比 Zero-shot（无样例）和 Few-shot（四个教案：三出口+灰区）。稳 = 下游 Zod 能否吃进去。"
                  steps={INTRO_STEPS}
                  extra={
                    <pre className="whitespace-pre-wrap bg-gray-50 p-2 rounded text-xs text-gray-700">
{`Zero  k=0   system + 当前 user
Few   k=4   system + 4 对假对话 + 当前 user
网关剥 think 标记后再 parse；hadThinking=true 说明嘴边仍不是纯 JSON`}
                    </pre>
                  }
                />

                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  <p className="text-xs text-gray-500">
                    产品：豆谷评价分类
                    {env.fewShotTurns ? " · Few-shot 教案 " + env.fewShotTurns + " 对" : ""}
                  </p>
                  <a
                    href="/pages/compare.html"
                    className="inline-block border border-gray-300 hover:border-blue-500 rounded p-3"
                  >
                    <div className="font-semibold text-sm">并排对照</div>
                    <div className="text-xs text-gray-500 mt-1">
                      选一条评价（或自己改）→ 点并排。期望灰区走中评；捣乱句看谁还能吐出 JSON 壳。
                    </div>
                  </a>
                </section>

                <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] text-sm text-gray-600">
                  {envError && <p className="text-red-700">{envError}</p>}
                  <p>本页不调模型。对照发生在「并排对照」页；空输入会走 HTTP 400。</p>
                </section>
              </main>

              <EnvFooter env={env} />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
