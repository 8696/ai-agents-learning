<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streaming / SSE · 总览</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>

  <script type="text/babel">
    /**
     * 本页教学点：三条接口分别演示什么、数据怎么走。本页不调模型。
     */
    const { useState } = React;

    const INTRO_STEPS = [
      "页面加载 → GET /health：读出当前 provider / model / 有没有 Key（不调模型、不花钱）",
      "模拟 SSE → GET /api/stream，按空行切帧，累加 delta.content，直到 [DONE]",
      "一次性对照 → GET /api/blocking 等同样总耗时才给字；和流式比的是 TTFT，不是总耗时",
      "真实模型 → GET 或 POST /api/real，服务端把上游 chunk 原样写成 SSE；Key ❌ 时按钮会锁住",
    ];

    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo } = window.DemoUI;

        function App() {
          const { env, envError } = useEnvInfo();
          const [status, setStatus] = useState("idle");

          React.useEffect(function () {
            if (envError) setStatus("error");
            else if (env.port) setStatus("ok");
          }, [env, envError]);

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">Streaming / SSE</h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                <PageIntro
                  summary="SSE 一帧长什么样、流式和一次性在 TTFT 上差在哪、真实模型每帧不一定是 1 个 token。"
                  steps={INTRO_STEPS}
                  extra={
                    <pre className="whitespace-pre-wrap bg-gray-50 p-2 rounded text-xs text-gray-700">
{`三条接口（一个进程、一个端口 50201）
  GET  /api/stream     本地模拟 · 每 200ms 一帧 · 结束 [DONE] · 不需要 Key
  GET  /api/blocking   本地模拟 · 攒齐 2.2s 再 text/plain · 不需要 Key
  GET  /api/real       真实模型 · 默认那句自我介绍
  POST /api/real       真实模型 · body.prompt · 空 prompt → 400 · 没 Key → 503

浏览器怎么读流
  fetch → getReader → 按 \\n\\n 切帧
    → 去掉 "data: " 前缀
    → 先判断是不是字符串 [DONE]（它不是 JSON）
    → 再 JSON.parse → choices[0].delta.content 累加

token / frame / content 三层不要混
  模拟版：每帧 1 个字符（教学简化）
  真实版：每帧可能含 1～多个 token 解码后的字符串（厂商 batching）
  token 数唯一信源：最后一帧的 usage.completion_tokens`}
                    </pre>
                  }
                />

                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  <p className="text-sm text-gray-600">
                    总览页不发起模型请求，也不打模拟流。选一个场景进去跑。页脚的 Key 状态来自 GET /health。
                  </p>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                    <a href="/pages/simulated.html" className="border border-gray-300 hover:border-blue-500 rounded p-3 text-left">
                      <div className="font-semibold text-sm">模拟 SSE</div>
                      <div className="text-xs text-gray-500 mt-1">GET /api/stream：本地 TOKENS 每 200ms 一帧。不需要 Key。</div>
                    </a>
                    <a href="/pages/blocking.html" className="border border-gray-300 hover:border-blue-500 rounded p-3 text-left">
                      <div className="font-semibold text-sm">一次性对照</div>
                      <div className="text-xs text-gray-500 mt-1">同时打流式和一次性，只比较 TTFT。</div>
                    </a>
                    <a href="/pages/real.html" className="border border-gray-300 hover:border-blue-500 rounded p-3 text-left">
                      <div className="font-semibold text-sm">真实模型</div>
                      <div className="text-xs text-gray-500 mt-1">原样转发 OpenAI chunk。Key ❌ 时主按钮会锁。</div>
                    </a>
                  </div>
                </section>

                <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] space-y-2 text-sm text-gray-600">
                  {envError && <p className="text-red-700">{envError}</p>}
                  <p>环境自检（不调模型）：</p>
                  <ul className="list-disc pl-5 text-xs space-y-1">
                    <li>provider / model 必须跟 apps/.env 的 LLM_PROVIDER 对上，不能写死在页面里</li>
                    <li>模拟 SSE 和一次性对照不需要 Key；真实模型页在 Key ❌ 时主按钮 disabled</li>
                    <li>后端控制台会同步打印每一帧 SSE 原文，建议两个窗口对照看</li>
                  </ul>
                </section>
              </main>

              <EnvFooter env={env} />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
