<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>流式协议 B · 协议 A vs B</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="/utils/api-client.js"></script>
  <script src="/utils/sse-client.js"></script>
  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/stream-cards.js"></script>
  <script type="text/babel">
    /**
     * 本页教学点：协议 B 思考是独立 thinking block，不是嵌在 answer 里。
     * 有 thinking → /api/b-thinking-stream；无 thinking → /api/b-stream-raw。
     */
    const { useState, useRef } = React;
    const DEFAULT_MSG = "23 × 47 等于多少？先一步步想，再回答。";
    const INTRO_STEPS = [
      "开思考：POST /api/b-thinking-stream { message, thinking_budget }，事件应是 message_start → content_block_start(thinking) → …",
      "关思考：POST /api/b-stream-raw，不应出现 thinking block",
      "thinking 与 text 是两个独立 block；signature_delta 也是事件，不是正文",
      "curl 对照可用 POST /api/b（一次性，不是流）",
    ];
    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo", "StreamColumns", "PromptCard", "eventClass"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo, StreamColumns, PromptCard, eventClass } = window.DemoUI;
        const { consumeSse, triggerNetworkError } = window.DemoUtils;
        function App() {
          const { env, envError } = useEnvInfo();
          const [status, setStatus] = useState("idle");
          const [busy, setBusy] = useState(false);
          const [msg, setMsg] = useState(DEFAULT_MSG);
          const [budget, setBudget] = useState("500");
          const [withThinking, setWithThinking] = useState(true);
          const [lines, setLines] = useState([]);
          const [thinking, setThinking] = useState("");
          const [answer, setAnswer] = useState("");
          const [meta, setMeta] = useState("");
          const [elapsed, setElapsed] = useState("0.00");
          const [error, setError] = useState(null);
          const thinkingRef = useRef("");
          const answerRef = useRef("");
          const usageRef = useRef(null);
          const stopRef = useRef("");
          const t0 = useRef(0);
          const blocked = busy || !env.hasKey;

          function unwrap(obj) {
            return obj.type === "anthropic_event" ? obj.event : obj;
          }

          async function run() {
            setBusy(true);
            setStatus("loading");
            setError(null);
            setLines([]);
            setThinking("");
            setAnswer("");
            setMeta("");
            setElapsed("0.00");
            thinkingRef.current = "";
            answerRef.current = "";
            usageRef.current = null;
            stopRef.current = "";
            t0.current = performance.now();
            var url = withThinking ? "/api/b-thinking-stream" : "/api/b-stream-raw";
            var body = withThinking
              ? { message: msg.trim(), thinking_budget: parseInt(budget, 10) || 500 }
              : { message: msg.trim() };
            try {
              var result = await consumeSse(url, body, function (obj, idx) {
                var evt = unwrap(obj) || {};
                var t = evt.type || obj.type || "?";
                var evIdx = obj.eventIdx || idx;
                var eventCls = "";
                var summary = "";
                var d = evt.delta || {};
                if (t === "content_block_delta" && d.thinking) {
                  eventCls = "thinking-event";
                  thinkingRef.current += d.thinking;
                  summary = "Δthinking \"" + String(d.thinking).slice(0, 40) + "\"";
                } else if (t === "content_block_delta" && d.text) {
                  eventCls = "text-event";
                  answerRef.current += d.text;
                  summary = "Δtext \"" + String(d.text).slice(0, 40) + "\"";
                } else if (t === "content_block_delta" && d.signature) {
                  eventCls = "thinking-event";
                  summary = "signature_delta（思考签名，不是正文）";
                } else if (t === "content_block_start") {
                  var btype = evt.content_block && evt.content_block.type;
                  eventCls = btype === "thinking" ? "thinking-event" : "text-event";
                  summary = "block type=" + (btype || "?");
                } else if (t === "message_delta") {
                  eventCls = "message-delta";
                  if (evt.usage) usageRef.current = Object.assign({}, usageRef.current || {}, evt.usage);
                  if (d.stop_reason) stopRef.current = d.stop_reason;
                  summary = "stop_reason=" + (d.stop_reason || "?");
                } else if (t === "message_stop") {
                  eventCls = "message-stop";
                  summary = "（流结束）";
                } else if (t === "message_start") {
                  summary = "model=" + ((evt.message && evt.message.model) || "?");
                } else {
                  summary = JSON.stringify(evt).slice(0, 80);
                }
                var now = ((performance.now() - t0.current) / 1000).toFixed(2);
                setElapsed(now);
                setThinking(thinkingRef.current);
                setAnswer(answerRef.current);
                setLines(function (prev) {
                  return prev.concat([{
                    idx: evIdx,
                    label: t,
                    summary: summary,
                    tone: eventClass(eventCls),
                  }]);
                });
              });
              if (!result.ok) {
                setError({ title: "HTTP 失败", detail: result.error, httpStatus: result.httpStatus });
                setStatus("error");
                return;
              }
              if (result.streamError) {
                setError({ title: "流中错误", detail: result.streamError, httpStatus: 200 });
                setStatus("error");
                return;
              }
              var total = ((performance.now() - t0.current) / 1000).toFixed(2);
              var metaText = result.frameCount + " events · " + total + "s · stop_reason=" + (stopRef.current || "?");
              if (usageRef.current) metaText += " · output_tokens=" + (usageRef.current.output_tokens ?? "?");
              setMeta(metaText);
              setStatus("ok");
            } catch (e) {
              setError({ title: "网络错误", detail: e.message, httpStatus: null });
              setStatus("error");
            } finally {
              setBusy(false);
            }
          }

          async function pingNet() {
            setStatus("loading");
            try {
              await triggerNetworkError();
            } catch (e) {
              setError({ title: "网络错误（故意）", detail: e.message, httpStatus: null });
              setStatus("error");
            }
          }

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">流式协议 B</h1>
                <StatusPill status={status} />
              </header>
              <main id="page-main" className="container mx-auto p-4 space-y-4">
                <PageIntro
                  summary="有 thinking：独立 thinking block + text block。无 thinking：不应出现 thinking 事件。"
                  steps={INTRO_STEPS}
                />
                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  {!env.hasKey && <p className="text-xs text-red-600">Key ❌，主按钮已禁用。</p>}
                  <label className="block text-sm">
                    消息
                    <span className="block text-xs text-gray-500">开思考走 /api/b-thinking-stream；关掉走 /api/b-stream-raw。</span>
                    <input className="mt-1 w-full border rounded p-2 text-sm" value={msg} disabled={busy} onChange={function (e) { setMsg(e.target.value); }} />
                  </label>
                  <label className="text-sm flex items-center gap-1">
                    <input type="checkbox" checked={withThinking} disabled={busy} onChange={function (e) { setWithThinking(e.target.checked); }} />
                    启用 thinking（独立 block，不是嵌在 answer 里）
                  </label>
                  {withThinking && (
                    <label className="text-sm">
                      budget
                      <select className="ml-2 border rounded p-1" value={budget} disabled={busy} onChange={function (e) { setBudget(e.target.value); }}>
                        <option value="100">100</option>
                        <option value="500">500</option>
                        <option value="1000">1000</option>
                      </select>
                    </label>
                  )}
                  <div className="flex flex-wrap gap-2">
                    <button className="bg-blue-600 text-white px-3 py-1.5 rounded text-sm disabled:opacity-50" disabled={blocked} onClick={run}>
                      发流式请求
                    </button>
                    <button className="border border-gray-300 px-3 py-1.5 rounded text-sm disabled:opacity-50" disabled={busy} onClick={function () { setMsg(""); run(); }}>
                      空输入（看 400）
                    </button>
                    <button className="border border-gray-300 px-3 py-1.5 rounded text-sm disabled:opacity-50" disabled={busy} onClick={pingNet}>
                      故意网络错误
                    </button>
                  </div>
                  {envError && <p className="text-sm text-red-700">{envError}</p>}
                </section>
                <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
                  {!lines.length && !error && (
                    <p className="text-sm text-gray-500">还没跑过。开思考时中间栏应收 thinking；关思考时中间栏应保持空。</p>
                  )}
                  {error && (
                    <div className="rounded border border-red-300 bg-red-50 p-3 text-sm text-red-700">
                      <div className="font-semibold">{error.title} {error.httpStatus ? "HTTP " + error.httpStatus : "请求未送达"}</div>
                      <div className="text-xs">{error.detail}</div>
                    </div>
                  )}
                  <PromptCard text={msg} />
                  <StreamColumns
                    lines={lines}
                    thinking={thinking}
                    answer={answer}
                    meta={meta}
                    elapsed={elapsed}
                    thinkingEmpty="（未触发 thinking block）"
                    answerEmpty="（等待 text_delta…）"
                    thinkingTitle="thinking 累加（独立 block）"
                    answerTitle="answer 累加（text block）"
                    countLabel="events"
                  />
                </section>
              </main>
              <EnvFooter env={env} />
            </div>
          );
        }
        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
