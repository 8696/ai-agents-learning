<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>思考方言 · 总览</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
    integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
    crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/sse-client.js"></script>
  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/dialect-table.js"></script>

  <script type="text/babel">
    /**
     * 本页教学点：先看官方方言表（怎么开、怎么关、思考回哪个字段），再去流式页实测。
     * 本页不调模型。表来自 GET /health 的 providers[].dialect。
     */
    const { useState, useEffect } = React;

    const INTRO_STEPS = [
      "页面加载 → GET /health（四家是否就绪 + 官方方言卡片，不调模型）",
      "表里每一格是文档口径：开哪个字段、关哪个字段、思考应出现在独立字段还是正文",
      "国内站实测可能和文档不一致（例如 MiniMax 协议 A 仍可能把思考嵌进 content）——以流式页「这次实测」为准",
      "点「流式对照」：勾选提供商 + 协议 A/B + 开/关思考，才会真正打模型",
    ];

    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo", "DialectMatrix"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo, DialectMatrix } = window.DemoUI;

        function App() {
          // env：GET /health 的 provider/model/hasKey/providers，喂给页脚和方言表
          const { env, envError } = useEnvInfo();
          // status：#status-pill 四态。本页 happy path = /health 拉成功
          const [status, setStatus] = useState("idle");
          // error：/health 失败（服务没起）时的页面级红字
          const [error, setError] = useState("");

          useEffect(function () {
            if (envError) {
              setStatus("error");
              setError(envError);
              return;
            }
            if (env.providers && env.providers.length) {
              setStatus("ok");
              setError("");
            }
          }, [env, envError]);

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">02 · 05 · 思考方言 · 总览</h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                <PageIntro
                  summary="四家提供商 × 协议 A/B 的官方思考方言：怎么开、怎么关、思考回哪个字段。本页不调模型。"
                  steps={INTRO_STEPS}
                  extra={
                    <pre className="whitespace-pre-wrap bg-gray-50 p-2 rounded text-xs text-gray-700">
{`全局数据流
  ① GET /health → 官方方言表（本页）
  ② 流式页勾选提供商 + 协议 A/B + 开/关思考
  ③ POST /api/stream { provider, protocol, thinking_on, messages }
  ④ route 按 protocol 分叉：A → openai 流 / B → anthropic 流
  ⑤ SSE：meta（这次开关字段）+ thinking/content 增量 + 实测 sources
  ⑥ 页面按轮、按模型、按协议把思考区和正文拆开`}
                    </pre>
                  }
                />

                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  <p className="text-sm text-gray-600">
                    总览页不发起模型请求。方言表是文档口径；要看这一轮 HTTP 到底把思考放哪，去流式对照页。
                  </p>
                  <p className="text-xs text-gray-500">
                    点「流式对照」会发生什么：进入勾选页，按所选同时打协议 A 和/或 B。顶层 LLM_PROVIDER 不用改，各家用自己分组里的模型 id。
                  </p>
                  <a
                    href="/pages/stream.html"
                    className="inline-block px-4 py-2 rounded bg-blue-600 text-white text-sm"
                  >
                    去流式对照（会调模型）
                  </a>
                </section>

                {(error || envError) && (
                  <div className="bg-red-50 border border-red-300 rounded p-3 text-sm text-red-700">
                    {error || envError}
                  </div>
                )}

                <section id="output" className="bg-white shadow rounded p-4 space-y-3 min-h-[200px]">
                  <p className="text-sm text-gray-500">
                    {env.providers && env.providers.length
                      ? "下面是四家官方怎么开、怎么关、思考回哪个字段。灰色行 = 这台机器没配该家 Key，表仍能看，流式页跑不了这一列。"
                      : "正在读取 /health…（若长时间空白，看服务是否已启动）"}
                  </p>
                  <DialectMatrix providers={env.providers || []} />
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs text-gray-600">
                    {(env.providers || []).map(function (p) {
                      return (
                        <div
                          key={p.id}
                          className={
                            "border rounded p-2 " +
                            (p.ready ? "border-green-300 bg-green-50" : "border-gray-300 bg-white")
                          }
                        >
                          <span className="font-semibold">{p.label}</span>
                          {" · "}
                          {p.ready ? "Key ✅ 可跑" : "Key ❌ 只能看表"}
                          <div className="text-gray-500 mt-1">
                            A {p.modelA || "未配置"} / B {p.modelB || "未配置"}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </section>
              </main>

              <EnvFooter env={env} />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
