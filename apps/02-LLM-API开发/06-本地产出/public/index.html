<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>豆谷值班台</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
    integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
    crossorigin="anonymous"></script>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const SAMPLES = [
      "订单 80012345 到哪了？盒子有点扁。",
      "你们还有无因挂耳吗？今晚能到深圳吗？",
    ];

    function pillClass(status) {
      if (status === "loading") return "text-xs px-2 py-1 rounded bg-blue-100";
      if (status === "ok") return "text-xs px-2 py-1 rounded bg-green-100";
      if (status === "err") return "text-xs px-2 py-1 rounded bg-red-200";
      return "text-xs px-2 py-1 rounded bg-gray-200";
    }
    function pillText(status) {
      if (status === "loading") return "🔄请求中";
      if (status === "ok") return "✅完成";
      if (status === "err") return "❌错误";
      return "⏸待连接";
    }

    function UsageLine({ usage }) {
      if (!usage) return null;
      return (
        <p className="text-xs text-gray-500">
          Token 输入 {usage.prompt} / 输出 {usage.completion} / 合计 {usage.total}
          {" · "}估算 ¥ {Number(usage.yuan).toFixed(6)}
        </p>
      );
    }

    function App() {
      const [status, setStatus] = useState("idle");
      const [question, setQuestion] = useState(SAMPLES[0]);
      const [draft, setDraft] = useState("");
      const [review, setReview] = useState("");
      const [draftUsage, setDraftUsage] = useState(null);
      const [reviewUsage, setReviewUsage] = useState(null);
      const [errorBox, setErrorBox] = useState("");
      const [modelLabel, setModelLabel] = useState("随 LLM_PROVIDER");
      const abortRef = useRef(null);

      useEffect(() => {
        fetch("/health")
          .then((r) => r.json())
          .then((d) => {
            if (d.modelA) setModelLabel(d.modelA);
          })
          .catch(() => {});
      }, []);

      async function startDraft() {
        setDraft("");
        setReview("");
        setDraftUsage(null);
        setReviewUsage(null);
        setErrorBox("");
        setStatus("loading");
        const ac = new AbortController();
        abortRef.current = ac;
        try {
          const res = await fetch("/api/draft", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
            signal: ac.signal,
          });
          if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            setStatus("err");
            setErrorBox("HTTP " + res.status + " " + (data.error || ""));
            return;
          }
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buf = "";
          let acc = "";
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const parts = buf.split("\n\n");
            buf = parts.pop() || "";
            for (const part of parts) {
              const line = part.split("\n").find((l) => l.startsWith("data: "));
              if (!line) continue;
              const payload = JSON.parse(line.slice(6));
              if (payload.error) {
                setStatus("err");
                setErrorBox(payload.error);
                return;
              }
              if (payload.delta) {
                acc += payload.delta;
                setDraft(acc);
              }
              if (payload.done) {
                setDraftUsage(payload.usage || null);
              }
            }
          }
          setStatus("ok");
        } catch (error) {
          if (error && error.name === "AbortError") {
            setStatus("ok");
            setErrorBox("已停止刷新（客户端停写；服务端可能仍在生成）");
            return;
          }
          setStatus("err");
          setErrorBox(error instanceof Error ? error.message : String(error));
        }
      }

      async function startReview() {
        setErrorBox("");
        setReview("");
        setReviewUsage(null);
        setStatus("loading");
        try {
          const res = await fetch("/api/review", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question, draft }),
          });
          const data = await res.json();
          if (!res.ok) {
            setStatus("err");
            setErrorBox((data && data.error) || ("HTTP " + res.status));
            return;
          }
          setReview(data.text || "");
          setReviewUsage(data.usage || null);
          setStatus("ok");
        } catch (error) {
          setStatus("err");
          setErrorBox(error instanceof Error ? error.message : String(error));
        }
      }

      const busy = status === "loading";

      return (
        <div className="min-h-screen bg-stone-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <div>
              <h1 id="page-title" className="text-xl font-semibold">豆谷值班台</h1>
              <p className="text-xs text-gray-500">先出流式草稿，再终审一版 · 不是协议开关盘</p>
            </div>
            <span id="status-pill" className={pillClass(status)}>{pillText(status)}</span>
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4 max-w-3xl">
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <p className="text-sm text-gray-600">把客户原话贴进来。值班先看字往外蹦的草稿；满意再点终审，终审一次返回完整稿。</p>
              <div className="flex flex-wrap gap-2">
                {SAMPLES.map((s, i) => (
                  <button key={i} className="text-xs px-2 py-1 rounded bg-stone-100" disabled={busy} onClick={() => setQuestion(s)}>示例 {i + 1}</button>
                ))}
              </div>
              <textarea className="w-full border rounded p-2 h-24 text-sm" value={question} disabled={busy} onChange={(e) => setQuestion(e.target.value)} />
              <div className="flex flex-wrap gap-2">
                <button className="px-4 py-2 rounded bg-stone-800 text-white disabled:opacity-40" disabled={busy} onClick={startDraft}>出草稿</button>
                <button className="px-4 py-2 rounded border disabled:opacity-40" disabled={!busy} onClick={() => abortRef.current && abortRef.current.abort()}>停止刷新</button>
                <button className="px-4 py-2 rounded border disabled:opacity-40" disabled={busy || !draft} onClick={startReview}>提交终审</button>
              </div>
            </section>

            <section id="output" className="bg-white shadow rounded p-4 min-h-[220px] space-y-4">
              {errorBox && <p className="text-sm text-red-700">{errorBox}</p>}
              <div>
                <div className="text-xs text-gray-400">对外草稿（流式）</div>
                <pre className="whitespace-pre-wrap text-sm min-h-[80px]">{draft || "草稿会出现在这里。"}</pre>
                <UsageLine usage={draftUsage} />
              </div>
              <div>
                <div className="text-xs text-gray-400">终审稿（一次性）</div>
                <pre className="whitespace-pre-wrap text-sm min-h-[80px]">{review || "终审后会出现在这里。"}</pre>
                <UsageLine usage={reviewUsage} />
              </div>
            </section>
          </main>

          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            端口 50206 · 草稿协议 A · 终审协议 B · 模型 {modelLabel}
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
