<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AbortController · 总览</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel">
    const { useState } = React;
    window.DemoUtils.waitDemoUI(["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo"], function () {
      const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo } = window.DemoUI;
      function App() {
        const { env, envError } = useEnvInfo();
        const [status, setStatus] = useState("idle");
        React.useEffect(function () {
          if (envError) setStatus("error");
          else if (env.port) setStatus("ok");
        }, [env, envError]);
        return (
          <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
            <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
              <h1 id="page-title" className="text-xl font-semibold">AbortController</h1>
              <StatusPill status={status} />
            </header>
            <main id="page-main" className="container mx-auto p-4 space-y-4">
              <PageIntro summary="客户端停 ≠ 服务端停。abort 是关 socket，已生成的 token 仍计费。本页不调模型。"
                steps={["流到底：不传 signal，看完整 usage", "收 N 帧停：SDK 必须带 signal，否则 abort 是空操作", "忘传 signal：页面掐了，服务端仍跑完"]}
                extra={<pre className="whitespace-pre-wrap bg-gray-50 p-2 rounded text-xs text-gray-700">{`POST /api/full
POST /api/cancel-after-frames  { message, abortAfterFrames }
POST /api/no-signal-abort`}</pre>} />
              <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                <PageNav />
                <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                  <a href="/pages/full.html" className="border border-gray-300 hover:border-blue-500 rounded p-3">
                    <div className="font-semibold text-sm">流到底</div>
                    <div className="text-xs text-gray-500 mt-1">基线：跑完才有 usage。</div>
                  </a>
                  <a href="/pages/cancel.html" className="border border-gray-300 hover:border-blue-500 rounded p-3">
                    <div className="font-semibold text-sm">收 N 帧停</div>
                    <div className="text-xs text-gray-500 mt-1">带 signal。也可点立即取消。</div>
                  </a>
                  <a href="/pages/no-signal.html" className="border border-gray-300 hover:border-blue-500 rounded p-3">
                    <div className="font-semibold text-sm">忘传 signal</div>
                    <div className="text-xs text-gray-500 mt-1">页面停了，SDK 还在烧钱。</div>
                  </a>
                </div>
              </section>
              <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] text-sm text-gray-600">
                {envError && <p className="text-red-700">{envError}</p>}
                <p>提前 abort 时流里常常没有 usage——钱以提供商账单为准，不要用页上的数字当账单。</p>
              </section>
            </main>
            <EnvFooter env={env} />
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    });
  </script>
</body>
</html>
