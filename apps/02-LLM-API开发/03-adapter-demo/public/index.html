<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adapter · 总览</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel">
    const { useState } = React;
    const INTRO_STEPS = [
      "业务只调 sendMessage({ protocol, message })，不 import openai / Anthropic SDK",
      "adapter 按 protocol 走进 lib/protocol-a 或 lib/protocol-b",
      "两边都翻成同一份 UnifiedResponse：content / thinking / inputTokens / outputTokens",
      "流式版 yield UnifiedDelta，业务 for await switch type，仍然不知道是哪家 SDK",
    ];
    window.DemoUtils.waitDemoUI(["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo"], function () {
      const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo } = window.DemoUI;
      function App() {
        const { env, envError } = useEnvInfo();
        const [status, setStatus] = useState("idle");
        React.useEffect(function () {
          if (envError) setStatus("error");
          else if (env.port) setStatus("ok");
        }, [env, envError]);
        return (
          <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
            <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
              <h1 id="page-title" className="text-xl font-semibold">Adapter 层</h1>
              <StatusPill status={status} />
            </header>
            <main id="page-main" className="container mx-auto p-4 space-y-4">
              <PageIntro
                summary="用一层 adapter 把协议 A/B 的字段差异挡在业务外面。本页不调模型。"
                steps={INTRO_STEPS}
                extra={
                  <pre className="whitespace-pre-wrap bg-gray-50 p-2 rounded text-xs text-gray-700">
{`业务 → sendMessage(opts)
         ├ protocol=A → openai Chat Completions → UnifiedResponse
         └ protocol=B → Anthropic Messages     → UnifiedResponse
system / max_tokens / usage 命名 / thinking 位置，全部在协议目录里翻译`}
                  </pre>
                }
              />
              <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                <PageNav />
                <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                  <a href="/pages/once.html" className="border border-gray-300 hover:border-blue-500 rounded p-3">
                    <div className="font-semibold text-sm">一次性</div>
                    <div className="text-xs text-gray-500 mt-1">POST /api/chat，看统一后的 thinking / content / usage。</div>
                  </a>
                  <a href="/pages/stream.html" className="border border-gray-300 hover:border-blue-500 rounded p-3">
                    <div className="font-semibold text-sm">流式</div>
                    <div className="text-xs text-gray-500 mt-1">POST /api/chat-stream，逐条 UnifiedDelta。</div>
                  </a>
                </div>
              </section>
              <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] text-sm text-gray-600">
                {envError && <p className="text-red-700">{envError}</p>}
                <p>切换协议下拉框时，页面字段名不变——这就是 adapter 存在的理由。</p>
              </section>
            </main>
            <EnvFooter env={env} />
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    });
  </script>
</body>
</html>
