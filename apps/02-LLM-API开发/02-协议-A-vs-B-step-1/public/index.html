<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>协议 A vs B · 总览</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script src="/utils/api-client.js"></script>
  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel">
    /**
     * 本页教学点：字段映射速查。本页不调模型，对照发生在 /pages/*。
     */
    const { useState } = React;
    const INTRO_STEPS = [
      "同一把 Key、同一 prompt，协议 A 走 openai Chat Completions，协议 B 走 Anthropic Messages",
      "差异全在字段：system 位置、content 形态、usage 命名、流式是字符串帧还是事件流",
      "一次性对照看完整 JSON；流式 A 看 kind；流式 B 看有/无 thinking block",
      "本页不调模型。Key ❌ 时场景页主按钮会 disabled",
    ];
    const SCENES = [
      {
        href: "/pages/once.html",
        title: "一次性对照",
        desc: "/api/compare 并排完整 JSON；/api/think-compare 四组 × 六个差异点（含 thinking 计费字段位置）。",
      },
      {
        href: "/pages/stream-a.html",
        title: "流式协议 A",
        desc: "/api/a-stream-raw：每帧带 kind（role / chunk / finish / usage）。curl 也可用 /api/a（无 kind 包装）。",
      },
      {
        href: "/pages/stream-b.html",
        title: "流式协议 B",
        desc: "有 thinking：/api/b-thinking-stream（双 block + signature_delta）；无 thinking：/api/b-stream-raw。",
      },
    ];
    window.DemoUtils.waitDemoUI(["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo"], function () {
      const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo } = window.DemoUI;
      function App() {
        const { env, envError } = useEnvInfo();
        const [status, setStatus] = useState("idle");
        const [netErr, setNetErr] = useState("");
        React.useEffect(function () {
          if (envError) setStatus("error");
          else if (env.port) setStatus("ok");
        }, [env, envError]);
        async function pingNetworkFail() {
          setNetErr("");
          setStatus("loading");
          try {
            await window.DemoUtils.triggerNetworkError();
          } catch (e) {
            setNetErr(e.message || String(e));
            setStatus("error");
          }
        }
        return (
          <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
            <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
              <h1 id="page-title" className="text-xl font-semibold">协议 A vs B · 总览</h1>
              <StatusPill status={status} />
            </header>
            <main id="page-main" className="container mx-auto p-4 space-y-4">
              <PageIntro
                summary="同一模型、两套 API 壳：字段怎么映射。本页只放速查表和导航。"
                steps={INTRO_STEPS}
                extra={
                  <pre className="whitespace-pre-wrap bg-gray-50 p-2 rounded text-xs text-gray-700">
{`请求
  system     A: messages[0].role=system          B: 顶层 system
  入口       A: chat.completions.create          B: messages.create / .stream
  max_tokens A: 可选                             B: 必填
  流式       A: stream:true                      B: 换 .stream() 方法
  thinking   A: extra_body.thinking              B: 顶层 thinking.budget_tokens

一次性响应
  正文       A: choices[0].message.content (string)   B: content[].text (block[])
  停         A: finish_reason                         B: stop_reason
  usage 入   A: prompt_tokens                         B: input_tokens
  usage 出   A: completion_tokens                     B: output_tokens
  思考计费   A: completion_tokens_details.reasoning_tokens
             B: output_tokens_details.thinking_tokens（扩展字段，不是顶层 reasoning_tokens）

流式
  单元       A: 1 帧 = 1 个 OpenAI chunk JSON    B: 1 事件 = 1 个 Anthropic event
  文本       A: delta.content                    B: delta.text（type=text_delta）
  思考位置   A: 嵌 content 的 <think> 或独立字段  B: 独立 type=thinking block
  结束       A: data: [DONE]                     B: message_stop + [DONE]`}
                  </pre>
                }
              />
              <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                <PageNav />
                <p className="text-sm text-gray-600">
                  总览页不发起模型请求。选一个场景进去跑。点「故意网络错误」只为对照 fetch reject 和 HTTP 4xx 长得不一样。
                </p>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                  {SCENES.map(function (s) {
                    return (
                      <a key={s.href} href={s.href} className="border border-gray-300 hover:border-blue-500 rounded p-3 text-left">
                        <div className="font-semibold text-sm">{s.title}</div>
                        <div className="text-xs text-gray-500 mt-1">{s.desc}</div>
                      </a>
                    );
                  })}
                </div>
                <button
                  className="border border-gray-300 px-3 py-1.5 rounded text-sm disabled:opacity-50"
                  disabled={status === "loading"}
                  onClick={pingNetworkFail}
                >
                  故意网络错误（期望 fetch reject）
                </button>
              </section>
              <section id="output" className="bg-white shadow rounded p-4 space-y-3 min-h-[200px]">
                {(envError || netErr) && (
                  <div className="bg-red-50 border border-red-300 rounded p-3 text-sm text-red-700">
                    {envError || netErr}
                    {netErr ? <span className="block text-xs text-gray-500 mt-1">请求未送达（不是 HTTP 状态码）</span> : null}
                  </div>
                )}
                <p className="text-sm text-gray-500">
                  {env.port
                    ? "环境已从 GET /health 填进页脚。上面 ASCII 就是写适配层时要对照的字段。"
                    : "正在读 GET /health…（若长时间空白，看页脚或上面错误）"}
                </p>
              </section>
            </main>
            <EnvFooter env={env} />
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    });
  </script>
</body>
</html>
