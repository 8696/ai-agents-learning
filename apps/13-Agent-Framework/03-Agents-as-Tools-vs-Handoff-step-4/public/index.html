<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agents as Tools vs Handoff · 第四步</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
    }
  }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="module" src="/utils/fetch-json.js"></script>
  <script type="module" src="/components/page-nav.js"></script>
  <script type="module" src="/components/layout.js"></script>
  <script type="module" src="/components/scenario-board.js"></script>
  <script type="module" src="/components/message-list.js"></script>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from "react";
    import { createRoot } from "react-dom/client";
    import { PageNav } from "/components/page-nav.js";
    import { PageIntro, StatusPill, EnvFooter } from "/components/layout.js";
    import { ScenarioBoard } from "/components/scenario-board.js";
    import { MessageList } from "/components/message-list.js";
    import { postJson, getJson, loadHealth } from "/utils/fetch-json.js";

    const INTRO_STEPS = [
      "读上半页固定场景（订单 A10086 + 用户原话）和两边各自的下一句判据 + 入口代码。",
      "左栏（mode: entry-routing）徽标初始 = 退款专员：第一句回复者就是专员，没有「总客服调用专员再自己说」。",
      "右栏（mode: handoff）徽标初始 = 总客服：第一句是总客服说「我把您转到退款专员」，第二句切到专员。",
    ];

    const ROLE_LABEL = { host: "总客服", refund: "退款专员", guide: "导购" };

    function Panel(props) {
      const accent = props.accent;
      const accentRing = accent === "entry-routing"
        ? "border-purple-300 bg-purple-50"
        : "border-blue-300 bg-blue-50";
      const accentBadge = accent === "entry-routing"
        ? "bg-purple-100 text-purple-800 border-purple-300"
        : "bg-blue-100 text-blue-800 border-blue-300";
      const btnClass = accent === "entry-routing"
        ? "bg-purple-600 text-white px-4 py-2 rounded disabled:opacity-50"
        : "bg-blue-600 text-white px-4 py-2 rounded disabled:opacity-50";

      return (
        <section className={"border-2 rounded p-4 space-y-3 " + accentRing}>
          <div className="flex items-center justify-between">
            <h2 className="text-sm font-semibold text-gray-900">{props.title}</h2>
            <span className={"text-xs px-2 py-1 rounded border font-semibold " + accentBadge}>
              当前 Agent：{ROLE_LABEL[props.currentAgent] || props.currentAgent}
            </span>
          </div>

          <div className="text-xs text-gray-700 bg-white border border-gray-200 rounded p-2">
            <span className="font-semibold">下一句判据：</span>
            {props.rationale || "（点「发送下一句」前没有判据）"}
          </div>

          <div>
            <div className="text-xs font-semibold text-gray-700 mb-1">消息列表</div>
            <MessageList messages={props.messages} />
          </div>

          <div className="flex flex-wrap gap-2">
            <button
              className={btnClass}
              disabled={props.busy}
              onClick={props.onSend}
            >
              发送下一句（POST /api/send-next · mode={accent}）
            </button>
            <button
              className="border border-gray-300 px-4 py-2 rounded disabled:opacity-50"
              disabled={props.busy}
              onClick={props.onReset}
            >
              清空这一栏
            </button>
          </div>

          {props.errorText ? (
            <div className="border border-red-300 bg-red-50 text-red-800 text-sm rounded p-2">
              {props.errorText}
            </div>
          ) : null}
        </section>
      );
    }

    function App() {
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");
      const [scenario, setScenario] = useState(null);
      const [scenarioError, setScenarioError] = useState("");

      // 左栏（entry-routing 模式 · 初始 currentAgent = refund）
      const [entryMessages, setEntryMessages] = useState([]);
      const [entryCurrentAgent, setEntryCurrentAgent] = useState("refund");
      const [entryUserTurnCount, setEntryUserTurnCount] = useState(0);
      const [entryRationale, setEntryRationale] = useState("");
      const [entryError, setEntryError] = useState("");

      // 右栏（handoff 模式 · 初始 currentAgent = host）
      const [handoffMessages, setHandoffMessages] = useState([]);
      const [handoffCurrentAgent, setHandoffCurrentAgent] = useState("host");
      const [handoffUserTurnCount, setHandoffUserTurnCount] = useState(0);
      const [handoffRationale, setHandoffRationale] = useState("");
      const [handoffError, setHandoffError] = useState("");

      useEffect(function () {
        loadHealth().then(setEnv).catch(function () {
          setEnv({ port: 50153, provider: null, model: null, hasKey: false, callsModel: false });
        });
        getJson("/api/scenario")
          .then(function (data) { setScenario(data.scenario); })
          .catch(function (err) {
            setScenarioError(err.message || "加载场景失败");
            setStatus("error");
          });
      }, []);

      async function sendNext(mode) {
        const userMsg = scenario && scenario.userMessage;
        if (!userMsg) return;

        setStatus("loading");
        if (mode === "entry-routing") {
          setEntryError("");
          setEntryMessages(function (prev) { return prev.concat([{ from: "user", text: userMsg }]); });
        } else {
          setHandoffError("");
          setHandoffMessages(function (prev) { return prev.concat([{ from: "user", text: userMsg }]); });
        }

        const body = mode === "entry-routing"
          ? { mode: "entry-routing", currentAgent: entryCurrentAgent, userTurnCount: entryUserTurnCount }
          : { mode: "handoff", currentAgent: handoffCurrentAgent, userTurnCount: handoffUserTurnCount };

        try {
          const data = await postJson("/api/send-next", body);
          if (mode === "entry-routing") {
            setEntryMessages(function (prev) { return prev.concat(data.appended || []); });
            setEntryCurrentAgent(data.nextCurrentAgent);
            setEntryRationale(data.rationale);
            setEntryUserTurnCount(function (n) { return n + 1; });
          } else {
            setHandoffMessages(function (prev) { return prev.concat(data.appended || []); });
            setHandoffCurrentAgent(data.nextCurrentAgent);
            setHandoffRationale(data.rationale);
            setHandoffUserTurnCount(function (n) { return n + 1; });
          }
          setStatus("ok");
        } catch (err) {
          const msg = (err && err.message) || "请求失败";
          if (mode === "entry-routing") setEntryError(msg); else setHandoffError(msg);
          setStatus("error");
        }
      }

      function resetPanel(mode) {
        if (mode === "entry-routing") {
          setEntryMessages([]); setEntryCurrentAgent("refund"); setEntryUserTurnCount(0); setEntryRationale(""); setEntryError("");
        } else {
          setHandoffMessages([]); setHandoffCurrentAgent("host"); setHandoffUserTurnCount(0); setHandoffRationale(""); setHandoffError("");
        }
      }

      async function demoServerError() {
        setStatus("loading");
        try {
          await getJson("/api/force-error");
          setStatus("ok");
        } catch (err) {
          setStatus("error");
          alert("后端 5xx 演示：" + ((err && err.message) || "请求失败"));
        }
      }

      const busy = status === "loading";

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              Agents as Tools vs Handoff · 进线分流 vs 中途分流：第一句回复者是谁
            </h1>
            <StatusPill status={status} />
          </header>

          <PageNav current="main" base="" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro
              lead="同一段用户原话，左栏走进线分流（从第一句起当前 Agent 就是退款专员）；右栏走中途分流（先总客服接、再移交）。两栏徽标初始值不同：第一句回复者不同。"
              steps={INTRO_STEPS}
              takeaway="进线分流 vs 中途分流，差别在「第一句回复者是谁」。判同一段用户原话。跑两次看第一句谁开口。"
              observe="左栏徽标初始 = 「退款专员」；右栏徽标初始 = 「总客服」。两边都点一次「发送下一句」后，左栏徽标仍是「退款专员」，右栏徽标切到「退款专员」。"
            />

            <ScenarioBoard scenario={scenario} />

            {scenarioError ? (
              <div className="border border-red-300 bg-red-50 text-red-800 text-sm rounded p-2">
                {scenarioError}
              </div>
            ) : null}

            <section id="controls" className="bg-white shadow rounded p-4">
              <div className="text-sm text-gray-500">本页教学点对照 · 同一段用户原话两种入口处理</div>
              <div className="flex flex-wrap gap-2 mt-2">
                <button
                  className="border border-gray-300 px-4 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={demoServerError}
                >
                  演示后端 5xx（第二类错误 · /api/force-error）
                </button>
              </div>
            </section>

            <section className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <Panel
                title="左栏 · 进线分流（mode: entry-routing · 初始 = 退款专员）"
                accent="entry-routing"
                messages={entryMessages}
                currentAgent={entryCurrentAgent}
                rationale={entryRationale}
                onSend={function () { sendNext("entry-routing"); }}
                onReset={function () { resetPanel("entry-routing"); }}
                busy={busy}
                errorText={entryError}
              />
              <Panel
                title="右栏 · 中途分流（mode: handoff · 初始 = 总客服）"
                accent="handoff"
                messages={handoffMessages}
                currentAgent={handoffCurrentAgent}
                rationale={handoffRationale}
                onSend={function () { sendNext("handoff"); }}
                onReset={function () { resetPanel("handoff"); }}
                busy={busy}
                errorText={handoffError}
              />
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-3 min-h-[120px]">
              <h2 className="text-sm font-semibold text-gray-900">输出区 · 模式 + 当前 Agent + 已发轮数</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-gray-700">
                <div>
                  <div className="font-semibold">左栏</div>
                  <div>模式 = entry-routing · 当前 Agent = {ROLE_LABEL[entryCurrentAgent]} · 已发轮数 = {entryUserTurnCount}</div>
                </div>
                <div>
                  <div className="font-semibold">右栏</div>
                  <div>模式 = handoff · 当前 Agent = {ROLE_LABEL[handoffCurrentAgent]} · 已发轮数 = {handoffUserTurnCount}</div>
                </div>
              </div>
              <div className="text-xs text-gray-500">
                关键对照：两边徽标初始值不同（左 refund / 右 host）。点击一次后左 refund 不变，右 host → refund。
              </div>
            </section>
          </main>

          <EnvFooter env={env} />
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
