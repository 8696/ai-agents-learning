<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dify 等编排产品 · 第五步 · 代码节点 + 输出变量</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
    }
  }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="module" src="/utils/fetch-json.js"></script>
  <script type="module" src="/components/page-nav.js"></script>
  <script type="module" src="/components/layout.js"></script>
  <script type="module" src="/components/code-node-with-output-panel.js"></script>
  <script type="module" src="/components/code-node-without-output-panel.js"></script>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from "react";
    import { createRoot } from "react-dom/client";
    import { PageNav } from "/components/page-nav.js";
    import { PageIntro, StatusPill, EnvFooter } from "/components/layout.js";
    import { CodeNodeWithOutputPanel } from "/components/code-node-with-output-panel.js";
    import { CodeNodeWithoutOutputPanel } from "/components/code-node-without-output-panel.js";
    import { postJson, loadHealth } from "/utils/fetch-json.js";

    const DEFAULT_CUPSIZE = "中杯";
    const DEFAULT_DRINKTYPE = "热饮";
    const INTRO_STEPS = [
      "页面加载：GET /health 填页脚（端口 50158 · 本地计算 · 不调大模型）。",
      "两栏共用同一组入参（cupSize + drinkType）；点「跑」会同时发出两次独立请求（左栏写出 outputVars.price / 右栏忘了写 outputVars.price）。",
      "对照看：左栏 outputVars.price = 36（下游能读到）；右栏 outputVars 里没 price 这个键（局部变量 priceInCode 算成了但下游读不到）。",
    ];

    function App() {
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");

      const [cupSize, setCupSize] = useState(DEFAULT_CUPSIZE);
      const [drinkType, setDrinkType] = useState(DEFAULT_DRINKTYPE);

      const [withResult, setWithResult] = useState(null);
      const [withError, setWithError] = useState("");
      const [withoutResult, setWithoutResult] = useState(null);
      const [withoutError, setWithoutError] = useState("");

      useEffect(function () {
        loadHealth().then(setEnv).catch(function () {
          setEnv({ port: 50158, provider: null, model: null, hasKey: false, callsModel: false });
        });
      }, []);

      async function runWith() {
        setStatus("loading");
        setWithError("");
        try {
          const data = await postJson("/api/code-node-with-output", { cupSize, drinkType });
          setWithResult(data);
          setStatus("ok");
        } catch (err) {
          const msg = (err && err.message) || "请求失败";
          setWithError(msg);
          setStatus("error");
        }
      }

      async function runWithout() {
        setStatus("loading");
        setWithoutError("");
        try {
          const data = await postJson("/api/code-node-without-output", { cupSize, drinkType });
          setWithoutResult(data);
          setStatus("ok");
        } catch (err) {
          const msg = (err && err.message) || "请求失败";
          setWithoutError(msg);
          setStatus("error");
        }
      }

      async function runBoth() {
        setStatus("loading");
        setWithError("");
        setWithoutError("");
        try {
          const [a, b] = await Promise.all([
            postJson("/api/code-node-with-output", { cupSize, drinkType }),
            postJson("/api/code-node-without-output", { cupSize, drinkType }),
          ]);
          setWithResult(a);
          setWithoutResult(b);
          setStatus("ok");
        } catch (err) {
          const msg = (err && err.message) || "请求失败";
          setWithError(msg);
          setWithoutError(msg);
          setStatus("error");
        }
      }

      function resetPanel(which) {
        if (which === "with") {
          setWithResult(null); setWithError("");
        } else {
          setWithoutResult(null); setWithoutError("");
        }
      }

      async function demoBadInput() {
        setStatus("loading");
        try {
          await postJson("/api/code-node-with-output", { cupSize: "超大杯", drinkType: "热饮" });
          setStatus("ok");
        } catch (err) {
          setStatus("error");
          alert("超界演示：" + ((err && err.message) || "请求失败") + "（第一类错误：4xx · 入参超界）");
        }
      }

      async function demoServerError() {
        setStatus("loading");
        try {
          await fetch("/api/force-error");
          setStatus("ok");
        } catch (err) {
          setStatus("error");
          alert("后端 5xx 演示：" + ((err && err.message) || "请求失败") + "（第二类错误：路由层 500）");
        }
      }

      const busy = status === "loading";

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              Dify 等编排产品 · 代码节点 + 输出变量（step-5）
            </h1>
            <StatusPill status={status} />
          </header>

          <PageNav current="main" base="" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro
              lead="同一段算价格（看 cupSize + drinkType），左栏写出 outputVars.price（下游能读到）；右栏忘了写 outputVars.price（局部变量算成了但下游读不到）。"
              steps={INTRO_STEPS}
              takeaway="代码节点里的 const price 函数返回就丢；下游能不能读到 = 看有没有写到 outputVars。写出来 = 下游能读到；忘写 = 上游吃掉了。"
              observation="命中「中杯 + 热饮」时，左栏 priceInCode = 34、outputVars.price = 34；右栏 priceInCode = 34、outputVars 里没 price 这个键。差别只在有没有写 outputVars。"
            />

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="text-sm text-gray-500">两栏共用同一组入参（杯型 + 冷热）</div>
              <div className="flex flex-wrap gap-2 items-center text-xs">
                <label className="text-gray-700">杯型（cupSize）：</label>
                <select className="border border-gray-300 px-2 py-1 rounded" value={cupSize} onChange={function (e) { setCupSize(e.target.value); }}>
                  <option value="大杯">大杯</option>
                  <option value="中杯">中杯</option>
                  <option value="小杯">小杯</option>
                </select>
                <label className="text-gray-700 ml-4">冷热（drinkType）：</label>
                <select className="border border-gray-300 px-2 py-1 rounded" value={drinkType} onChange={function (e) { setDrinkType(e.target.value); }}>
                  <option value="热饮">热饮</option>
                  <option value="冰饮">冰饮</option>
                </select>
              </div>
              <div className="text-xs text-gray-500">
                定价表：基础 ¥28 + 大杯 +8 / 中杯 +6 / 小杯 +4 + 冰饮 +2。
              </div>
              <div className="flex flex-wrap gap-2">
                <button className="bg-black text-white px-4 py-2 rounded disabled:opacity-50" disabled={busy} onClick={runBoth}>
                  同时跑两栏（浏览器侧并行）
                </button>
                <button className="border border-gray-300 px-4 py-2 rounded disabled:opacity-50" disabled={busy} onClick={demoBadInput}>
                  演示超界 4xx（第一类错误）
                </button>
                <button className="border border-gray-300 px-4 py-2 rounded disabled:opacity-50" disabled={busy} onClick={demoServerError}>
                  演示后端 5xx（第二类错误）
                </button>
              </div>
            </section>

            <section className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <CodeNodeWithOutputPanel
                result={withResult}
                onSubmit={runWith}
                onReset={function () { resetPanel("with"); }}
                busy={busy}
                errorText={withError}
              />
              <CodeNodeWithoutOutputPanel
                result={withoutResult}
                onSubmit={runWithout}
                onReset={function () { resetPanel("without"); }}
                busy={busy}
                errorText={withoutError}
              />
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-3 min-h-[120px]">
              <h2 className="text-sm font-semibold text-gray-900">输出区 · 两栏 outputVars 对照</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-gray-700">
                <div>
                  <div className="font-semibold">左栏 · 写出 outputVars</div>
                  <div>{withResult ? "priceInCode=¥ " + withResult.priceInCode + " · outputVars.price=¥ " + (typeof withResult.outputVars.price === "number" ? withResult.outputVars.price : "（未暴露）") : "（还没跑）"}</div>
                </div>
                <div>
                  <div className="font-semibold">右栏 · 忘了写 outputVars</div>
                  <div>{withoutResult ? "priceInCode=¥ " + withoutResult.priceInCode + " · outputVars.price=" + (typeof withoutResult.outputVars.price === "number" ? "¥ " + withoutResult.outputVars.price : "（未暴露 · 下游读不到）") : "（还没跑）"}</div>
                </div>
              </div>
              <div className="text-xs text-gray-500">
                priceInCode 一样（左 = 右），但 outputVars.price 不同 —— 差别只在「有没有写进 outputVars」。
              </div>
            </section>
          </main>

          <EnvFooter env={env} />
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
