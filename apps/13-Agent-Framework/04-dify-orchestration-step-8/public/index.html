<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dify 等编排产品 · 第八步 · 知识库节点 vs Agent 循环节点</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
    }
  }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="module" src="/utils/fetch-json.js"></script>
  <script type="module" src="/components/page-nav.js"></script>
  <script type="module" src="/components/layout.js"></script>
  <script type="module" src="/components/kb-panel.js"></script>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from "react";
    import { createRoot } from "react-dom/client";
    import { PageNav } from "/components/page-nav.js";
    import { PageIntro, StatusPill, EnvFooter } from "/components/layout.js";
    import { KBPanel } from "/components/kb-panel.js";
    import { postJson, loadHealth } from "/utils/fetch-json.js";

    const DEFAULT_QUERY = "热拿铁能做吗";
    const INTRO_STEPS = [
      "页面加载：GET /health 填页脚（端口 50161 · 本地计算 · 不调大模型）。",
      "两栏共用同一句 query（用户问题）；点「跑」会同时发出两次独立请求（左栏 POST /api/kb-node / 右栏 POST /api/agent-node-with-kb）。",
      "对照看：左栏 rounds=1 · hasLoop=false（调一次 KB 就停）；右栏 rounds=3 · hasLoop=true（KB + KB + LLM 汇总）。",
    ];

    function App() {
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");

      const [query, setQuery] = useState(DEFAULT_QUERY);

      const [kbResult, setKBResult] = useState(null);
      const [kbError, setKBError] = useState("");
      const [agentResult, setAgentResult] = useState(null);
      const [agentError, setAgentError] = useState("");

      useEffect(function () {
        loadHealth().then(setEnv).catch(function () {
          setEnv({ port: 50161, provider: null, model: null, hasKey: false, callsModel: false });
        });
      }, []);

      async function runKB() {
        setStatus("loading");
        setKBError("");
        try {
          const data = await postJson("/api/kb-node", { query });
          setKBResult(data);
          setStatus("ok");
        } catch (err) {
          const msg = (err && err.message) || "请求失败";
          setKBError(msg);
          setStatus("error");
        }
      }

      async function runAgent() {
        setStatus("loading");
        setAgentError("");
        try {
          const data = await postJson("/api/agent-node-with-kb", { query });
          setAgentResult(data);
          setStatus("ok");
        } catch (err) {
          const msg = (err && err.message) || "请求失败";
          setAgentError(msg);
          setStatus("error");
        }
      }

      async function runBoth() {
        setStatus("loading");
        setKBError("");
        setAgentError("");
        try {
          const [a, b] = await Promise.all([
            postJson("/api/kb-node", { query }),
            postJson("/api/agent-node-with-kb", { query }),
          ]);
          setKBResult(a);
          setAgentResult(b);
          setStatus("ok");
        } catch (err) {
          const msg = (err && err.message) || "请求失败";
          setKBError(msg);
          setAgentError(msg);
          setStatus("error");
        }
      }

      function resetPanel(which) {
        if (which === "kb") {
          setKBResult(null); setKBError("");
        } else {
          setAgentResult(null); setAgentError("");
        }
      }

      async function demoBadInput() {
        setStatus("loading");
        try {
          await postJson("/api/kb-node", { query: "" });
          setStatus("ok");
        } catch (err) {
          setStatus("error");
          alert("空入参演示：" + ((err && err.message) || "请求失败") + "（第一类错误：4xx · 入参不合法）");
        }
      }

      async function demoServerError() {
        setStatus("loading");
        try {
          await fetch("/api/force-error");
          setStatus("ok");
        } catch (err) {
          setStatus("error");
          alert("后端 5xx 演示：" + ((err && err.message) || "请求失败") + "（第二类错误：路由层 500）");
        }
      }

      const busy = status === "loading";

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              Dify 等编排产品 · 知识库节点 vs Agent 循环节点（step-8）
            </h1>
            <StatusPill status={status} />
          </header>

          <PageNav current="main" base="" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro
              lead="同一句 query，左栏走「知识库节点」（拖一个 KB 检索节点，调一次就停）；右栏走「Agent 循环节点」（while + KB + LLM 汇总）。"
              steps={INTRO_STEPS}
              takeaway="拖一个知识库节点 ≠ Agent 循环 —— 知识库节点 = 检索那一跳，调一次就停；Agent 循环节点 = 把 while + 调工具塞进一个方块。「它会自己循环查资料」是对「Agent 循环节点」的脑补，不是对「知识库节点」的脑补。"
              observe="命中 query 「热拿铁能做吗」：左栏 rounds=1 · hasLoop=false（调一次 KB → top-1）；右栏 rounds=3 · hasLoop=true（KB → KB → LLM 汇总）。差别就在 hasLoop 这一行 —— 拖一个 KB 节点不会自己循环。"
            />

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="text-sm text-gray-500">两栏共用同一句 query</div>
              <div className="flex flex-wrap gap-2 items-center text-xs">
                <label className="text-gray-700">query：</label>
                <input
                  className="border border-gray-300 px-3 py-2 rounded flex-1 min-w-[240px]"
                  value={query}
                  onChange={function (e) { setQuery(e.target.value); }}
                />
              </div>
              <div className="text-xs text-gray-500">
                mock KB 库有 5 条：热拿铁能做吗 / 冰拿铁能做吗 / 退款流程 / 营业时间 / 杯型大小。
              </div>
              <div className="flex flex-wrap gap-2">
                <button className="bg-black text-white px-4 py-2 rounded disabled:opacity-50" disabled={busy} onClick={runBoth}>
                  同时跑两栏（浏览器侧并行 · 不调大模型）
                </button>
                <button className="border border-gray-300 px-4 py-2 rounded disabled:opacity-50" disabled={busy} onClick={demoBadInput}>
                  演示空入参 4xx（第一类错误）
                </button>
                <button className="border border-gray-300 px-4 py-2 rounded disabled:opacity-50" disabled={busy} onClick={demoServerError}>
                  演示后端 5xx（第二类错误）
                </button>
              </div>
            </section>

            <section className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <KBPanel
                title="左栏 · 知识库节点（拖一个 KB 检索节点）"
                endpoint="/api/kb-node"
                flowFunc="runKBNode"
                result={kbResult}
                onSubmit={runKB}
                onReset={function () { resetPanel("kb"); }}
                busy={busy}
                errorText={kbError}
              />
              <KBPanel
                title="右栏 · Agent 循环节点（带 KB + LLM 汇总）"
                endpoint="/api/agent-node-with-kb"
                flowFunc="runAgentNodeWithKB"
                result={agentResult}
                onSubmit={runAgent}
                onReset={function () { resetPanel("agent"); }}
                busy={busy}
                errorText={agentError}
              />
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-3 min-h-[120px]">
              <h2 className="text-sm font-semibold text-gray-900">输出区 · rounds / hasLoop 对照</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-gray-700">
                <div>
                  <div className="font-semibold">左栏 · 知识库节点</div>
                  <div>{kbResult ? "rounds=" + kbResult.rounds + " · hasLoop=" + kbResult.hasLoop : "（还没跑）"}</div>
                </div>
                <div>
                  <div className="font-semibold">右栏 · Agent 循环节点</div>
                  <div>{agentResult ? "rounds=" + agentResult.rounds + " · hasLoop=" + agentResult.hasLoop : "（还没跑）"}</div>
                </div>
              </div>
              <div className="text-xs text-gray-500">
                rounds 左 = 1 / 右 = 3 · hasLoop 左 = false / 右 = true · 这一对照钉出「知识库节点 ≠ Agent 循环节点」。
              </div>
            </section>
          </main>

          <EnvFooter env={env} />
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
