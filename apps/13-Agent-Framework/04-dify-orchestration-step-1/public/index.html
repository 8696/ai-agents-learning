<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dify 等编排产品 · 第一步 · 三种走法对照</title>

  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入（禁止换 CDN / 版本 / integrity） -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <!-- §5.3.4.a 强制：Babel Standalone 锁定 7.26.4（仅作 JSX → React.createElement 转译） -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- §5.3.4.a 强制：导入映射（import map） -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
    }
  }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <!-- 公共模块必须在本页内联块之前 -->
  <script type="module" src="/utils/fetch-json.js"></script>
  <script type="module" src="/components/page-nav.js"></script>
  <script type="module" src="/components/layout.js"></script>
  <script type="module" src="/components/loop-panel.js"></script>
  <script type="module" src="/components/agent-app-panel.js"></script>
  <script type="module" src="/components/workflow-panel.js"></script>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from "react";
    import { createRoot } from "react-dom/client";
    import { PageNav } from "/components/page-nav.js";
    import { PageIntro, StatusPill, EnvFooter } from "/components/layout.js";
    import { LoopPanel } from "/components/loop-panel.js";
    import { AgentAppPanel } from "/components/agent-app-panel.js";
    import { WorkflowPanel } from "/components/workflow-panel.js";
    import { postJson, loadHealth } from "/utils/fetch-json.js";

    const DEFAULT_TEXT = "来一杯中杯热拿铁。";
    const INTRO_STEPS = [
      "页面加载：GET /health 填页脚（端口 / 模型服务商 / 模型 / 密钥）；页头默认文案说明三栏对照。",
      "三栏各自一个「跑」按钮：左 / 中各发一次 POST（真调大模型）；右栏发一次 POST（不调大模型）——三个独立请求。",
      "三栏结果并排：左栏 messages 数组完整可见；中栏 messages 数组被吃掉只露「产品内部转了几圈 + finalReply」；右栏节点图 + 变量面板 + 灰显「调度器 / 状态类型 / 边表核对」藏在产品里。",
    ];

    function App() {
      const [env, setEnv] = useState(null);
      const [text, setText] = useState(DEFAULT_TEXT);
      const [status, setStatus] = useState("idle");

      // 左栏（手写循环）
      const [loopResult, setLoopResult] = useState(null);
      const [loopError, setLoopError] = useState("");

      // 中栏（智能体应用）
      const [appResult, setAppResult] = useState(null);
      const [appError, setAppError] = useState("");

      // 右栏（工作流画布）
      const [workflowResult, setWorkflowResult] = useState(null);
      const [workflowError, setWorkflowError] = useState("");

      useEffect(function () {
        loadHealth().then(setEnv).catch(function () {
          setEnv({ port: 50154, provider: null, model: null, hasKey: false, callsModel: true });
        });
      }, []);

      async function runHandwrittenLoop() {
        setStatus("loading");
        setLoopError("");
        try {
          const data = await postJson("/api/handwritten-loop", { text, maxRounds: 4 });
          setLoopResult(data);
          setStatus("ok");
        } catch (err) {
          const msg = (err && err.message) || "请求失败";
          setLoopError(msg);
          setStatus("error");
        }
      }

      async function runAgentApp() {
        setStatus("loading");
        setAppError("");
        try {
          const data = await postJson("/api/agent-app", { text, maxRounds: 4 });
          setAppResult(data);
          setStatus("ok");
        } catch (err) {
          const msg = (err && err.message) || "请求失败";
          setAppError(msg);
          setStatus("error");
        }
      }

      async function runWorkflow() {
        setStatus("loading");
        setWorkflowError("");
        try {
          const data = await postJson("/api/workflow", { text });
          setWorkflowResult(data);
          setStatus("ok");
        } catch (err) {
          const msg = (err && err.message) || "请求失败";
          setWorkflowError(msg);
          setStatus("error");
        }
      }

      function resetPanel(which) {
        if (which === "loop") {
          setLoopResult(null); setLoopError("");
        } else if (which === "app") {
          setAppResult(null); setAppError("");
        } else {
          setWorkflowResult(null); setWorkflowError("");
        }
      }

      async function demoServerError() {
        setStatus("loading");
        try {
          await fetch("/api/force-error");
          setStatus("ok");
        } catch (err) {
          setStatus("error");
          alert("后端 5xx 演示：" + ((err && err.message) || "请求失败"));
        }
      }

      async function demoBadInput() {
        setStatus("loading");
        try {
          await postJson("/api/handwritten-loop", { text: "", maxRounds: 4 });
          setStatus("ok");
        } catch (err) {
          setStatus("error");
          alert("空入参演示：" + ((err && err.message) || "请求失败") + "（这是第一类错误：4xx · 入参不合法）");
        }
      }

      const busy = status === "loading";

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              Dify 等编排产品 · 同一句「来一杯中杯热拿铁」三种走法对照（step-1）
            </h1>
            <StatusPill status={status} />
          </header>

          <PageNav current="main" base="" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro
              lead="左栏跑手写循环（暴露 messages 数组）；中栏跑同一个 while 但 messages 不返；右栏画工作流画布（不调大模型）。三栏独立请求并排对照循环和状态藏在哪。"
              steps={INTRO_STEPS}
              takeaway="左栏的 messages 数组你拥有；中栏的 messages 数组归产品；右栏看得见节点和变量但调度器和状态类型不在仓库。循环和状态都还在，只是不在你的文件里。"
              observe="左栏点按钮后 messages 列表会增长；中栏点按钮后只跳出一行「finalReply」（前面的圈隐藏在 API 之外）；右栏点按钮后画布和变量面板出现，灰显区提示「这些东西不在仓库」。"
            />

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="text-sm text-gray-500">本页输入（一句用户原话，三栏共用）</div>
              <div className="flex flex-wrap gap-2 items-center">
                <input
                  className="border border-gray-300 px-3 py-2 rounded flex-1 min-w-[240px]"
                  value={text}
                  onChange={function (e) { setText(e.target.value); }}
                  placeholder="例如：来一杯中杯热拿铁。"
                />
              </div>
              <div className="text-xs text-gray-500">
                空字符串会触发 4xx（第一类错误：入参不合法）；可点「演示后端 5xx」看第二类错误（路由层 500）。
              </div>
              <div className="flex flex-wrap gap-2">
                <button
                  className="border border-gray-300 px-4 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={demoBadInput}
                >
                  演示空入参 4xx（第一类错误 · /api/handwritten-loop）
                </button>
                <button
                  className="border border-gray-300 px-4 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={demoServerError}
                >
                  演示后端 5xx（第二类错误 · /api/force-error）
                </button>
              </div>
            </section>

            <section className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <LoopPanel
                result={loopResult}
                onSubmit={runHandwrittenLoop}
                onReset={function () { resetPanel("loop"); }}
                busy={busy}
                errorText={loopError}
              />
              <AgentAppPanel
                result={appResult}
                onSubmit={runAgentApp}
                onReset={function () { resetPanel("app"); }}
                busy={busy}
                errorText={appError}
              />
              <WorkflowPanel
                result={workflowResult}
                onSubmit={runWorkflow}
                onReset={function () { resetPanel("workflow"); }}
                busy={busy}
                errorText={workflowError}
              />
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-3 min-h-[120px]">
              <h2 className="text-sm font-semibold text-gray-900">输出区 · 三栏结果对照</h2>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs text-gray-700">
                <div>
                  <div className="font-semibold">左栏 · 手写循环</div>
                  <div>${loopResult ? "跑了 " + loopResult.rounds + " 圈 · 终止 = " + loopResult.stoppedReason + " · messages " + (loopResult.messages ? loopResult.messages.length : 0) + " 条" : "（还没跑）"}</div>
                </div>
                <div>
                  <div className="font-semibold">中栏 · 智能体应用</div>
                  <div>${appResult ? "产品内部转了 " + appResult.roundsHidden + " 圈 · 终止 = " + appResult.stoppedReason + " · messages 不返" : "（还没跑）"}</div>
                </div>
                <div>
                  <div className="font-semibold">右栏 · 工作流画布</div>
                  <div>${workflowResult ? "节点 " + workflowResult.nodes.length + " 个 · 边 " + workflowResult.edges.length + " 条 · 不调大模型" : "（还没跑）"}</div>
                </div>
              </div>
              <div className="text-xs text-gray-500">
                三栏对照循环和状态藏在哪：左栏的 messages 数组 = 你拥有；中栏的 messages 数组 = 产品拥有；右栏的调度器 / 状态类型 / 边表核对 = 产品服务器拥有。
              </div>
            </section>
          </main>

          <EnvFooter env={env} />
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
