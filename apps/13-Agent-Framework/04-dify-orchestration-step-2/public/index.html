<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dify 等编排产品 · 第二步 · 会话变量 vs 你的 state</title>

  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入（禁止换 CDN / 版本 / integrity） -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <!-- §5.3.4.a 强制：Babel Standalone 锁定 7.26.4（仅作 JSX → React.createElement 转译） -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- §5.3.4.a 强制：导入映射（import map） -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
    }
  }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <!-- 公共模块必须在本页内联块之前 -->
  <script type="module" src="/utils/fetch-json.js"></script>
  <script type="module" src="/components/page-nav.js"></script>
  <script type="module" src="/components/layout.js"></script>
  <script type="module" src="/components/conversation-vars-panel.js"></script>
  <script type="module" src="/components/your-state-panel.js"></script>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from "react";
    import { createRoot } from "react-dom/client";
    import { PageNav } from "/components/page-nav.js";
    import { PageIntro, StatusPill, EnvFooter } from "/components/layout.js";
    import { ConversationVarsPanel } from "/components/conversation-vars-panel.js";
    import { YourStatePanel } from "/components/your-state-panel.js";
    import { postJson, loadHealth } from "/utils/fetch-json.js";

    const DEFAULT_TEXT1 = "大杯热拿铁。";
    const DEFAULT_TEXT2 = "还是大杯，换成冰的。";
    const INTRO_STEPS = [
      "页面加载：GET /health 填页脚（端口 50155 · 本地计算 · 不调大模型）。",
      "两栏共用同一对句（第一句 + 第二句）；点「跑两轮对话」会同时发出两次独立请求（左栏 POST /api/conversation-vars + 右栏 POST /api/your-state），返回各自的字段 + 对话记录。",
      "对照看：两栏第二轮都拿到 cupSize=大杯 —— 但左栏是产品里的 sessionVars.cupSize，右栏是你 OrderState.cupSize。归谁的不同，重启 / 仓库是否 commit 表现也不同。",
    ];

    function App() {
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");

      const [text1, setText1] = useState(DEFAULT_TEXT1);
      const [text2, setText2] = useState(DEFAULT_TEXT2);

      const [varsResult, setVarsResult] = useState(null);
      const [varsError, setVarsError] = useState("");

      const [stateResult, setStateResult] = useState(null);
      const [stateError, setStateError] = useState("");

      useEffect(function () {
        loadHealth().then(setEnv).catch(function () {
          setEnv({ port: 50155, provider: null, model: null, hasKey: false, callsModel: false });
        });
      }, []);

      async function runConversationVars() {
        setStatus("loading");
        setVarsError("");
        try {
          const data = await postJson("/api/conversation-vars", { text1, text2 });
          setVarsResult(data);
          setStatus("ok");
        } catch (err) {
          const msg = (err && err.message) || "请求失败";
          setVarsError(msg);
          setStatus("error");
        }
      }

      async function runYourState() {
        setStatus("loading");
        setStateError("");
        try {
          const data = await postJson("/api/your-state", { text1, text2 });
          setStateResult(data);
          setStatus("ok");
        } catch (err) {
          const msg = (err && err.message) || "请求失败";
          setStateError(msg);
          setStatus("error");
        }
      }

      async function runBoth() {
        // 并行发起两次独立请求（§5.3.8 对照拆请求 —— 不打成一个 /api/compare）
        setStatus("loading");
        setVarsError("");
        setStateError("");
        try {
          const [a, b] = await Promise.all([
            postJson("/api/conversation-vars", { text1, text2 }),
            postJson("/api/your-state", { text1, text2 }),
          ]);
          setVarsResult(a);
          setStateResult(b);
          setStatus("ok");
        } catch (err) {
          const msg = (err && err.message) || "请求失败";
          // 哪一个挂了就把错放哪一栏
          if (err && err.status) {
            setVarsError(msg);
            setStateError(msg);
          } else {
            setVarsError(msg);
            setStateError(msg);
          }
          setStatus("error");
        }
      }

      function resetPanel(which) {
        if (which === "vars") {
          setVarsResult(null); setVarsError("");
        } else {
          setStateResult(null); setStateError("");
        }
      }

      async function demoBadInput() {
        setStatus("loading");
        try {
          await postJson("/api/conversation-vars", { text1: "", text2: "x" });
          setStatus("ok");
        } catch (err) {
          setStatus("error");
          alert("空入参演示：" + ((err && err.message) || "请求失败") + "（这是第一类错误：4xx · 入参不合法）");
        }
      }

      async function demoServerError() {
        setStatus("loading");
        try {
          await fetch("/api/force-error");
          setStatus("ok");
        } catch (err) {
          setStatus("error");
          alert("后端 5xx 演示：" + ((err && err.message) || "请求失败") + "（这是第二类错误：路由层 500）");
        }
      }

      const busy = status === "loading";

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              Dify 等编排产品 · 会话变量 vs 你的 state（step-2）
            </h1>
            <StatusPill status={status} />
          </header>

          <PageNav current="main" base="" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro
              lead="两轮对话：第一句「大杯热拿铁」→ 第二句「还是大杯，换成冰的」。左栏产品里的会话变量（sessionVars.cupSize = 大杯），右栏你 TypeScript state（OrderState.cupSize = 大杯）。两栏都能让第二轮拿到第一轮的字段，但归谁不同。"
              steps={INTRO_STEPS}
              takeaway="会话变量 = 产品替你存的字段（重启产品可能丢）。你 state = 你 TypeScript 类型里 declared 的字段（commit 进仓库就在）。两者都不是模块 10 那套记忆（记忆是另一套检索 + 摘要，不是「还记得上一轮」的字段）。"
              observe="左栏 sessionVars.cupSize 第二轮还留着「大杯」（第一轮写入后这一轮没重写）；右栏 state.cupSize 同样留着「大杯」（合并而非覆盖）。两栏回复里「杯型还是 大杯」这一句，证明字段是跨轮活着的。"
            />

            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <div className="text-sm text-gray-500">两栏共用同一对句（第一句 + 第二句）</div>
              <div className="flex flex-wrap gap-2 items-center">
                <label className="text-xs text-gray-600 w-16">第一句：</label>
                <input
                  className="border border-gray-300 px-3 py-2 rounded flex-1 min-w-[240px]"
                  value={text1}
                  onChange={function (e) { setText1(e.target.value); }}
                />
              </div>
              <div className="flex flex-wrap gap-2 items-center">
                <label className="text-xs text-gray-600 w-16">第二句：</label>
                <input
                  className="border border-gray-300 px-3 py-2 rounded flex-1 min-w-[240px]"
                  value={text2}
                  onChange={function (e) { setText2(e.target.value); }}
                />
              </div>
              <div className="text-xs text-gray-500">
                空字符串会触发 4xx（第一类错误）；可点「演示后端 5xx」看第二类错误（路由层 500）。
              </div>
              <div className="flex flex-wrap gap-2">
                <button
                  className="bg-gray-800 text-white px-4 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={runBoth}
                >
                  同时跑两栏（POST /api/conversation-vars + POST /api/your-state · 浏览器侧并行）
                </button>
                <button
                  className="border border-gray-300 px-4 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={demoBadInput}
                >
                  演示空入参 4xx（第一类错误）
                </button>
                <button
                  className="border border-gray-300 px-4 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={demoServerError}
                >
                  演示后端 5xx（第二类错误）
                </button>
              </div>
            </section>

            <section className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <ConversationVarsPanel
                result={varsResult}
                onSubmit={runConversationVars}
                onReset={function () { resetPanel("vars"); }}
                busy={busy}
                errorText={varsError}
              />
              <YourStatePanel
                result={stateResult}
                onSubmit={runYourState}
                onReset={function () { resetPanel("state"); }}
                busy={busy}
                errorText={stateError}
              />
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-3 min-h-[120px]">
              <h2 className="text-sm font-semibold text-gray-900">输出区 · 两栏字段对照</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs text-gray-700">
                <div>
                  <div className="font-semibold">左栏 · 会话变量</div>
                  <div>${varsResult ? "cupSize=" + (varsResult.sessionVars.cupSize || "（未设）") + " · drinkType=" + (varsResult.sessionVars.drinkType || "（未设）") + " · lastUpdateRound=" + (varsResult.sessionVars.lastUpdateRound || "—") : "（还没跑）"}</div>
                </div>
                <div>
                  <div className="font-semibold">右栏 · 你的 state</div>
                  <div>${stateResult ? "cupSize=" + (stateResult.state.cupSize || "null") + " · drinkType=" + (stateResult.state.drinkType || "null") + " · currentNode=" + (stateResult.state.currentNode || "—") : "（还没跑）"}</div>
                </div>
              </div>
              <div className="text-xs text-gray-500">
                字段值看起来一样（左 = 大杯；右 = 大杯）—— 但归谁的不同：左是产品服务器，右是你 TypeScript 类型。重启 / 仓库是否 commit 表现也不同。
              </div>
            </section>
          </main>

          <EnvFooter env={env} />
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
