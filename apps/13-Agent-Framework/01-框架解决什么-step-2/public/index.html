<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>框架解决什么 · 第二步 · 基础聊天</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "ai": "https://esm.sh/ai@7.0.107?external=react,react-dom",
      "@ai-sdk/react": "https://esm.sh/@ai-sdk/react@4.0.108?external=react,react-dom,ai"
    }
  }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="module" src="/utils/fetch-json.js"></script>
  <script type="module" src="/components/page-nav.js"></script>
  <script type="module" src="/components/layout.js"></script>
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useCallback } from "react";
    import { createRoot } from "react-dom/client";
    import { useChat } from "@ai-sdk/react";
    import { DefaultChatTransport } from "ai";
    import { loadHealth } from "/utils/fetch-json.js";
    import { PageNav } from "/components/page-nav.js";
    import { PageIntro, StatusPill, EnvFooter } from "/components/layout.js";

    const DEFAULT_SYSTEM_PROMPT =
      "你是一个友善、简洁的中文助手。\n回答控制在 2-3 句，除非用户明确要求更详细。\n不调用任何工具，纯文字回复。";

    function partText(part) {
      if (part.type === "text") return part.text || "";
      if (String(part.type).indexOf("tool-") === 0) {
        return "工具（" + (part.toolName || part.type) + "）状态：" + (part.state || "（进行中）");
      }
      return "";
    }

    function ChatIsland(props) {
      const [systemPrompt, setSystemPrompt] = useState(DEFAULT_SYSTEM_PROMPT);
      const [input, setInput] = useState("");
      const [localError, setLocalError] = useState("");
      const transport = useMemo(function () {
        return new DefaultChatTransport({
          api: "/api/basic-chat",
          body: { system: systemPrompt },
        });
      }, [systemPrompt]);
      const chat = useChat({ transport: transport });
      const busy = chat.status === "submitted" || chat.status === "streaming";
      const lastIsUser = chat.messages.length > 0 && chat.messages[chat.messages.length - 1].role === "user";

      const pill = (function () {
        if (busy) return "loading";
        if (chat.status === "error" || localError) return "error";
        if (chat.messages.length > 0 && chat.status === "ready") return "ok";
        return "idle";
      })();

      useEffect(function () {
        props.onStatusChange(pill);
      }, [pill, props]);

      async function send() {
        const text = input.trim();
        if (!text) return;
        setLocalError("");
        setInput("");
        try {
          await chat.sendMessage({ text: text });
        } catch (err) {
          setLocalError((err && err.message) || String(err));
        }
      }

      function clearAll() {
        chat.setMessages([]);
        setLocalError("");
      }

      function stopNow() {
        try {
          chat.stop();
        } catch (err) {
          setLocalError((err && err.message) || String(err));
        }
      }

      function regenerate() {
        setLocalError("");
        try {
          chat.regenerate();
        } catch (err) {
          setLocalError((err && err.message) || String(err));
        }
      }

      function removeOne(id) {
        chat.setMessages(chat.messages.filter(function (m) { return m.id !== id; }));
      }

      function resetSystemPrompt() {
        setSystemPrompt(DEFAULT_SYSTEM_PROMPT);
      }

      function onKeyDown(e) {
        if (e.key === "Enter" && !e.shiftKey && !busy) {
          e.preventDefault();
          send();
        }
      }

      const messages = chat.messages;
      const hasAssistant = messages.some(function (m) { return m.role === "assistant"; });

      return (
        <div className="space-y-4">
          <div className="bg-gray-50 border border-gray-200 rounded p-3">
            <div className="text-xs font-semibold text-gray-700">请求参数（Request）</div>
            <pre id="request-summary" className="text-xs text-gray-700 whitespace-pre-wrap mt-1">
              {"POST /api/basic-chat\nuseChat + DefaultChatTransport\nbody.system（用户当前填的系统提示词）：\n" + systemPrompt + "\nbody.messages.length = " + chat.messages.length + "\n当前 status（状态）：" + chat.status}
            </pre>
          </div>
          <div className="border border-gray-300 bg-white rounded p-3 space-y-2">
            <div className="flex items-center justify-between">
              <div className="text-xs font-semibold text-gray-700">对话区 · 共 {messages.length + 1} 段（含系统提示词）</div>
              <span className="text-xs text-gray-500">系统提示词始终在最前（只读）</span>
            </div>
            <div className="bg-yellow-50 border border-yellow-300 rounded p-2 space-y-1">
              <div className="flex items-center justify-between">
                <span className="text-xs font-semibold text-yellow-900">角色：system · 始终在最前</span>
                <span className="text-xs text-gray-500">下次发送时随 body.system 送出</span>
              </div>
              <pre id="system-prompt-display" className="text-sm text-gray-800 whitespace-pre-wrap">
                {systemPrompt || "（空）"}
              </pre>
            </div>
            {messages.length === 0 ? (
              <p className="text-sm text-gray-500">还没发。改完系统提示词，在最下面的输入框写一句发给模型吧。下一条消息就会按新提示词走；之前的对话历史保留。</p>
            ) : messages.map(function (message) {
              const text = (message.parts || []).map(partText).filter(Boolean).join("\n");
              return (
                <div key={message.id} className="border border-gray-200 rounded p-2 space-y-1">
                  <div className="flex items-center justify-between">
                    <div className="text-xs text-gray-500">角色（role）：{message.role}</div>
                    <button
                      className="text-xs text-red-500 disabled:text-gray-300"
                      disabled={busy}
                      onClick={function () { removeOne(message.id); }}
                    >删除</button>
                  </div>
                  <pre className="text-xs text-gray-700 whitespace-pre-wrap">
                    {text || "（这条还没有正文）"}
                  </pre>
                </div>
              );
            })}
          </div>
          <div className="border border-gray-300 bg-white rounded p-3 space-y-2">
            <div className="flex items-center justify-between">
              <label htmlFor="system-prompt-input" className="text-xs font-semibold text-gray-700">系统提示词设置（system prompt 编辑器）</label>
              <button
                id="btn-reset-system"
                className="text-xs text-blue-600 disabled:text-gray-400"
                disabled={systemPrompt === DEFAULT_SYSTEM_PROMPT || busy}
                onClick={resetSystemPrompt}
              >恢复默认</button>
            </div>
            <textarea
              id="system-prompt-input"
              className="w-full border border-gray-300 rounded p-2 text-sm"
              rows={4}
              value={systemPrompt}
              disabled={busy}
              onChange={function (e) { setSystemPrompt(e.target.value); }}
            />
            <p className="text-xs text-gray-500">改完下一次发送时新值会通过 body.system 传给服务端；上方「对话区」里那段黄色的系统提示词显示会同步更新。</p>
          </div>
          {props.noKey ? <p id="hint-no-key" className="text-xs text-red-700">缺 密钥，主按钮已禁用。请配 apps/.env。</p> : null}
          {localError ? <p id="hint-local-error" className="text-sm text-red-700">{localError}</p> : null}
          {chat.error ? <p id="hint-chat-error" className="text-sm text-red-700">{String(chat.error.message || chat.error)}</p> : null}
          <div>
            <label htmlFor="user-input" className="block text-sm text-gray-700">客人口述（input）</label>
            <textarea
              id="user-input"
              className="mt-1 w-full border border-gray-300 rounded p-2 text-sm"
              rows={2}
              value={input}
              disabled={busy}
              onChange={function (e) { setInput(e.target.value); }}
              onKeyDown={onKeyDown}
              placeholder="Enter 发送；Shift+Enter 换行"
            />
          </div>
          <div className="flex flex-wrap gap-2">
            <button
              id="btn-send"
              className="bg-blue-600 text-white px-3 py-1.5 rounded text-sm disabled:opacity-50"
              disabled={busy || props.noKey || !input.trim()}
              onClick={send}
            >发送（useChat + DefaultChatTransport）</button>
            <button
              id="btn-stop"
              className="border border-orange-400 text-orange-700 px-3 py-1.5 rounded text-sm disabled:opacity-50"
              disabled={!busy}
              onClick={stopNow}
            >取消请求（stop）</button>
            <button
              id="btn-regenerate"
              className="border border-purple-400 text-purple-700 px-3 py-1.5 rounded text-sm disabled:opacity-50"
              disabled={busy || !hasAssistant}
              onClick={regenerate}
            >重新生成（regenerate）</button>
            <button
              id="btn-clear"
              className="border border-gray-400 text-gray-700 px-3 py-1.5 rounded text-sm disabled:opacity-50"
              disabled={busy || chat.messages.length === 0}
              onClick={clearAll}
            >清空对话</button>
          </div>
        </div>
      );
    }

    function App() {
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");

      useEffect(function () {
        loadHealth().then(setEnv).catch(function () {
          setEnv({ port: 50140, provider: null, model: null, hasKey: false });
        });
      }, []);

      const onStatusChange = useCallback(function (s) {
        setStatus(s);
      }, []);

      const noKey = env && env.hasKey === false;

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              框架解决什么（What Frameworks Solve） · 第二步（step-2） · 基础聊天 + 可改系统提示词
            </h1>
            <StatusPill status={status} />
          </header>
          <PageNav current="basic-chat" base="" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro
              lead="聊天记录在上、输入区在下；系统提示词的内容作为只读段放在聊天记录第一段，编辑器单独一块在聊天记录下方。"
              steps={[
                "对话区（在上）：第一段是系统提示词的内容（黄色块，只读）；往下依次是 user / assistant 消息。每次发送请求，对话区顶部的系统提示词段会随编辑器同步。",
                "系统提示词编辑器（在对话区下方）：可改，下一次发送时新值通过 body.system 送到服务端；改完不立刻重新生成，只在下一条新消息生效。",
                "发送走 POST /api/basic-chat；服务端把 body.system + body.messages 一起交给 streamText。无 make_latte，所以 stopWhen 不写。",
                "点「重新生成」会用最近一条 assistant 再请求一次（useChat.regenerate，有 assistant 才点亮）；「取消请求」立刻调 stop；「清空对话」只清 user/assistant；每条消息右侧的「删除」按钮从消息数组里剔一项。",
              ]}
              takeaway="@ai-sdk/react 的 useChat 把流式拆帧、状态机、abort、regenerate 收在一个 React hook 里。业务文件里只剩 system 字符串 + messages 数组。"
              observe="多轮：发一条 → 模型答一条 → 再发一条时，第二轮会自动带上第一轮的历史（useChat.messages 已经累计）。改系统提示词后历史不清空，下一条开始按新提示词走。"
            />
            <section id="controls" className="bg-white shadow rounded p-4">
              <ChatIsland onStatusChange={onStatusChange} noKey={noKey} />
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
