<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>框架解决什么 · 第一步 · 两杯能否并行</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
    }
  }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="module" src="../utils/fetch-json.js"></script>
  <script type="module" src="../components/page-nav.js"></script>
  <script type="module" src="../components/layout.js"></script>
  <script type="module" src="../components/run-result.js"></script>
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from "react";
    import { createRoot } from "react-dom/client";
    import { postJson, loadHealth } from "../utils/fetch-json.js";
    import { PageNav } from "../components/page-nav.js";
    import { PageIntro, StatusPill, EnvFooter } from "../components/layout.js";
    import { RunResult } from "../components/run-result.js";

    function App() {
      const [env, setEnv] = useState(null);
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState("");
      const [leftReq, setLeftReq] = useState(null);
      const [leftRes, setLeftRes] = useState(null);
      const [rightReq, setRightReq] = useState(null);
      const [rightRes, setRightRes] = useState(null);
      const noKey = env && env.hasKey === false;

      useEffect(function () {
        loadHealth().then(setEnv).catch(function () {
          setEnv({ port: 50139, provider: null, model: null, hasKey: false });
        });
      }, []);

      async function run(side, endpoint) {
        setBusy(true);
        setError("");
        const reqShape = { url: endpoint, method: "POST", body: {} };
        if (side === "left") {
          setLeftReq(reqShape);
          setLeftRes(null);
        } else {
          setRightReq(reqShape);
          setRightRes(null);
        }
        try {
          const data = await postJson(endpoint, {});
          if (side === "left") setLeftRes(data.result);
          else setRightRes(data.result);
        } catch (err) {
          setError((err && err.message) || String(err));
        } finally {
          setBusy(false);
        }
      }

      const bothDone = leftRes && rightRes;
      const leftElapsed = leftRes ? leftRes.elapsedMs : null;
      const rightElapsed = rightRes ? rightRes.elapsedMs : null;
      const leftExec = leftRes ? (leftRes.toolExecutedCount || 0) : null;
      const rightExec = rightRes ? (rightRes.toolExecutedCount || 0) : null;
      const leftRound0 = leftRes && leftRes.rounds && leftRes.rounds[0] ? leftRes.rounds[0] : null;
      const rightRound0 = rightRes && rightRes.rounds && rightRes.rounds[0] ? rightRes.rounds[0] : null;
      const rightRound1 = rightRes && rightRes.rounds && rightRes.rounds[1] ? rightRes.rounds[1] : null;

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              框架解决什么（What Frameworks Solve） · 第一步（step-1） · 两杯能否并行
            </h1>
            <StatusPill status={busy ? "loading" : (error ? "error" : (bothDone ? "ok" : "idle"))} />
          </header>
          <PageNav current="multi-drink" base="../" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro
              lead="同一句 query「热美式和冰拿铁各来一杯。」，两条路径 —— 左栏 SDK 默认并行（一次 generateText 拿 2 个 tool_calls 并行执行），右栏手动串行（分 2 次 generateText，每轮只做 1 杯）。"
              steps={[
                "左栏按钮「并行（POST /api/multi-drink-parallel）」→ 一次 generateText；模型一次返回 2 个 tool_calls；SDK 默认并行执行。",
                "右栏按钮「串行（POST /api/multi-drink-serial）」→ 分 2 次 generateText；第 1 轮 stopWhen: hasToolCall 拿 1 杯；第 2 轮把第 1 轮消息塞回去继续做第 2 杯。",
                "对照两栏耗时（elapsedMs）：并行 ≈ 1 杯；串行 ≈ 2 杯。两个独立请求（不是 /api/compare 打包）。",
              ]}
              takeaway="框架默认并行工具调用（变体 C）：注册两个工具 make_americano + make_latte，模型一次返回 2 个 tool_calls，库内部类似 Promise.all 同时执行。要让两杯串行：必须拆 query + 分批注册工具（每轮只注册一个，模型只能调那一个），分 2 次 generateText。"
              observe="对照两栏：左栏 rounds[0] 的 toolCallCount = 2（一轮同时调 make_americano + make_latte 并行执行）；右栏 rounds[0] toolCallCount = 1（只调 make_americano）+ rounds[1] toolCallCount = 1（只调 make_latte），两轮串行。耗时（elapsedMs）受网络抖动影响，不作为并行/串行对照的硬指标。"
            />
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <p className="text-xs text-gray-500">两栏按钮各发一次独立请求（不是接口打包）。query 固定为「热美式和冰拿铁各来一杯。」。重点对照耗时（elapsedMs）。</p>
              <div className="flex flex-wrap gap-2">
                <button
                  className="bg-blue-600 text-white px-3 py-1.5 rounded text-sm disabled:opacity-50"
                  disabled={busy || noKey}
                  onClick={function () { run("left", "/api/multi-drink-parallel"); }}
                >
                  并行（POST /api/multi-drink-parallel · SDK 默认）
                </button>
                <button
                  className="bg-orange-600 text-white px-3 py-1.5 rounded text-sm disabled:opacity-50"
                  disabled={busy || noKey}
                  onClick={function () { run("right", "/api/multi-drink-serial"); }}
                >
                  串行（POST /api/multi-drink-serial · 分 2 轮）
                </button>
              </div>
              {noKey ? <p className="text-xs text-red-700">缺 密钥，主按钮已禁用。请配 apps/.env。</p> : null}
              {error ? <p className="text-sm text-red-700">{error}</p> : null}
            </section>
            <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="space-y-2 border border-blue-300 bg-blue-50 rounded p-3">
                  <div className="text-xs font-semibold text-blue-900">左栏 · 并行（SDK 默认）</div>
                  <RunResult request={leftReq} result={leftRes} />
                </div>
                <div className="space-y-2 border border-orange-300 bg-orange-50 rounded p-3">
                  <div className="text-xs font-semibold text-orange-900">右栏 · 串行（分 2 轮 generateText）</div>
                  <RunResult request={rightReq} result={rightRes} />
                </div>
              </div>
              {bothDone ? (
                <div className="bg-white border border-gray-300 rounded p-3 space-y-1">
                  <div className="text-xs font-semibold text-gray-700">对照数字（同一 query · 两条路径 · 两个独立请求）</div>
                  <div className="text-xs text-gray-700">
                    左栏（并行 · 注册两个工具 · 模型一次返回 2 个 tool_calls） · rounds[0] toolCallCount：<b>{leftRound0 ? leftRound0.toolCallCount : 0}</b> · rounds[0] toolNames：<b>{leftRound0 && leftRound0.toolNames ? leftRound0.toolNames.join(" + ") : "—"}</b>
                  </div>
                  <div className="text-xs text-gray-700">
                    右栏（串行 · 每轮注册 1 个工具 · query 拆开） · rounds[0] toolCallCount：<b>{rightRound0 ? rightRound0.toolCallCount : 0}</b> · rounds[0] toolNames：<b>{rightRound0 && rightRound0.toolNames ? rightRound0.toolNames.join(" + ") : "—"}</b> · rounds[1] toolCallCount：<b>{rightRound1 ? rightRound1.toolCallCount : 0}</b> · rounds[1] toolNames：<b>{rightRound1 && rightRound1.toolNames ? rightRound1.toolNames.join(" + ") : "—"}</b>
                  </div>
                  <div className="text-xs text-gray-600">
                    结论：左栏一轮调了 2 个不同工具（make_americano + make_latte 并行执行）；右栏两轮各调 1 个工具（先 make_americano、再 make_latte 串行）。两栏最终都出 2 杯，但工具执行策略不同。耗时（elapsedMs）作为参考：左栏 {leftElapsed} 毫秒 · 右栏 {rightElapsed} 毫秒（受网络抖动影响，不作为对照硬指标）。
                  </div>
                </div>
              ) : null}
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
