<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>框架解决什么 · 第一步 · 过敏拦截 · 网关</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
    }
  }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="module" src="../utils/fetch-json.js"></script>
  <script type="module" src="../components/page-nav.js"></script>
  <script type="module" src="../components/layout.js"></script>
  <script type="module" src="../components/run-result.js"></script>
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from "react";
    import { createRoot } from "react-dom/client";
    import { postJson, loadHealth } from "../utils/fetch-json.js";
    import { PageNav } from "../components/page-nav.js";
    import { PageIntro, StatusPill, EnvFooter } from "../components/layout.js";
    import { RunResult } from "../components/run-result.js";
    const DEFAULT_UTTERANCE = "我牛奶过敏，来一杯中杯拿铁。";

    function App() {
      const [env, setEnv] = useState(null);
      const [utterance, setUtterance] = useState(DEFAULT_UTTERANCE);
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState("");
      const [request, setRequest] = useState(null);
      const [result, setResult] = useState(null);
      const noKey = env && env.hasKey === false;

      useEffect(function () {
        loadHealth().then(setEnv).catch(function () {
          setEnv({ port: 50139, provider: null, model: null, hasKey: false });
        });
      }, []);

      async function run(allergy) {
        setBusy(true);
        setError("");
        const body = { utterance: utterance, allergy: allergy };
        setRequest({ url: "/api/allergy-gate", method: "POST", body: body });
        setResult(null);
        try {
          const data = await postJson("/api/allergy-gate", body);
          setResult(data.result);
        } catch (err) {
          setError((err && err.message) || String(err));
        } finally {
          setBusy(false);
        }
      }

      const rejected = result ? result.rejected : null;
      const attempts = result ? (result.attempts || []) : [];
      const allergy = result ? result.allergy : null;

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              框架解决什么（What Frameworks Solve） · 第一步（step-1） · 过敏拦截 · 网关
            </h1>
            <StatusPill status={busy ? "loading" : (error ? "error" : (result ? "ok" : "idle"))} />
          </header>
          <PageNav current="allergy-gate" base="../" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro
              lead="客人「我牛奶过敏，来一杯中杯拿铁。」调 make_latte 工具，框架循环会跑、模型很爽快地调，但**真正出杯被你网关拦下**——拒绝原因回到页面，不被框架内部吞掉。"
              steps={[
                "点「客人过敏（allergy=true）」按钮 → POST /api/allergy-gate，body 里 allergy=true。",
                "服务端 make_latte 网关版：execute 检查 allergyFlag = true → return ok:false → 拒绝原因回到 messages。",
                "点「客人不过敏（allergy=false）」按钮 → 同接口、body 里 allergy=false → 网关放行 → 出杯成功。",
              ]}
              takeaway="变体 I「框架解决不了」：过敏 / 退款 / 鉴权这些业务规则留在你的网关层，框架不管。框架循环仍在跑（不是框架停了，是网关拒绝执行）；拒绝原因回到页面，不被框架内部吞掉——这才让产品判断闭环。"
              observe="看 attempts 列表：过敏时 rejected=true + reason「客人牛奶过敏，网关拒绝执行 make_latte。」；不过敏时 rejected=false + 出杯成功。两个独立请求，对照框架循环是否仍在跑、网关是否拦下。"
            />
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <label className="block text-sm text-gray-700">
                客人口述（utterance · 默认带「过敏」字样）
                <textarea
                  className="mt-1 w-full border border-gray-300 rounded p-2 text-sm"
                  rows="2"
                  value={utterance}
                  disabled={busy}
                  onChange={function (e) { setUtterance(e.target.value); }}
                />
              </label>
              <p className="text-xs text-gray-500">两个按钮各发一次独立请求（body 带 allergy 标记）。左栏 allergy=true（网关拦下）；右栏 allergy=false（网关放行）。</p>
              <div className="flex flex-wrap gap-2">
                <button
                  className="bg-red-600 text-white px-3 py-1.5 rounded text-sm disabled:opacity-50"
                  disabled={busy || noKey}
                  onClick={function () { run(true); }}
                >
                  客人过敏（POST /api/allergy-gate · allergy=true）
                </button>
                <button
                  className="bg-green-600 text-white px-3 py-1.5 rounded text-sm disabled:opacity-50"
                  disabled={busy || noKey}
                  onClick={function () { run(false); }}
                >
                  客人不过敏（POST /api/allergy-gate · allergy=false）
                </button>
              </div>
              {noKey ? <p className="text-xs text-red-700">缺 密钥，主按钮已禁用。请配 apps/.env。</p> : null}
              {error ? <p className="text-sm text-red-700">{error}</p> : null}
            </section>
            <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] space-y-4">
              {request ? (
                <div className="bg-gray-50 border border-gray-300 rounded p-2 text-xs text-gray-700">
                  请求参数 · <code className="font-mono">{request.method} {request.url}</code> · body: allergy = <b>{String(request.body.allergy)}</b> · utterance = "{request.body.utterance}"
                </div>
              ) : null}

              {result ? (
                <React.Fragment>
                  {rejected ? (
                    <div className="bg-red-50 border border-red-300 rounded p-3 space-y-1">
                      <div className="text-xs font-semibold text-red-900">⚠ 网关拦截（rejected=true）</div>
                      <div className="text-xs text-red-700">{result.reason}</div>
                      <div className="text-xs text-gray-600">框架循环仍在跑，但 execute 被网关拒绝——拒绝原因回到页面，没被框架吞掉。</div>
                    </div>
                  ) : (
                    <div className="bg-green-50 border border-green-300 rounded p-3 space-y-1">
                      <div className="text-xs font-semibold text-green-900">✓ 网关放行（rejected=false）</div>
                      <div className="text-xs text-green-700">{result.reason}</div>
                    </div>
                  )}

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div className="border border-gray-300 bg-white rounded p-3">
                      <div className="text-xs font-semibold text-gray-700">过敏标记（allergy）</div>
                      <div className={"text-2xl font-bold mt-1 " + (allergy ? "text-red-700" : "text-green-700")}>{allergy ? "true（过敏）" : "false（不过敏）"}</div>
                    </div>
                    <div className={"border rounded p-3 " + (rejected ? "border-red-300 bg-red-50" : "border-green-300 bg-green-50")}>
                      <div className="text-xs font-semibold text-gray-700">网关结果（rejected）</div>
                      <div className={"text-2xl font-bold mt-1 " + (rejected ? "text-red-700" : "text-green-700")}>{rejected ? "拦截" : "放行"}</div>
                    </div>
                    <div className="border border-gray-300 bg-white rounded p-3">
                      <div className="text-xs font-semibold text-gray-700">execute 调用次数</div>
                      <div className="text-2xl font-bold text-gray-900 mt-1">{attempts.length}</div>
                      <div className="text-xs text-gray-500 mt-1">框架循环仍在跑（不因拒绝而停）</div>
                    </div>
                  </div>

                  <div className="space-y-2">
                    <div className="text-xs font-semibold text-gray-700">attempts 列表（每次 execute 网关层判断）</div>
                    <div className="border border-gray-200 rounded">
                      <table className="w-full text-xs">
                        <thead className="bg-gray-100">
                          <tr>
                            <th className="px-2 py-1 text-left">attempt</th>
                            <th className="px-2 py-1 text-left">网关结果</th>
                            <th className="px-2 py-1 text-left">cupSize</th>
                            <th className="px-2 py-1 text-left">reason</th>
                          </tr>
                        </thead>
                        <tbody>
                          {attempts.map(function (a, i) {
                            const rowCls = a.rejected ? "bg-red-50" : "bg-green-50";
                            return (
                              <tr key={i} className={rowCls + " border-t border-gray-200"}>
                                <td className="px-2 py-1 font-mono">{a.attempt}</td>
                                <td className={"px-2 py-1 font-semibold " + (a.rejected ? "text-red-700" : "text-green-700")}>
                                  {a.rejected ? "拒绝" : "放行"}
                                </td>
                                <td className="px-2 py-1 font-mono">{a.cupSize || "—"}</td>
                                <td className="px-2 py-1">{a.reason}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {result.finalText ? (
                    <div className="bg-white border border-gray-200 rounded p-3">
                      <div className="text-xs font-semibold text-gray-700">模型最终回复（finalText · 应反映网关拒绝原因）</div>
                      <pre className="text-xs text-gray-700 whitespace-pre-wrap mt-1">{result.finalText}</pre>
                    </div>
                  ) : null}
                </React.Fragment>
              ) : null}

              {!result && !busy && !error ? (
                <p className="text-sm text-gray-500">还没调工具。点上面的按钮会请求 /api/allergy-gate。</p>
              ) : null}
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
