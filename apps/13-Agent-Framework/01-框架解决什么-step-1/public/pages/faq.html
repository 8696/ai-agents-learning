<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>框架解决什么 · 第一步 · FAQ 不该上出杯图</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
    }
  }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="module" src="../utils/fetch-json.js"></script>
  <script type="module" src="../components/page-nav.js"></script>
  <script type="module" src="../components/layout.js"></script>
  <script type="module" src="../components/run-result.js"></script>
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from "react";
    import { createRoot } from "react-dom/client";
    import { postJson, loadHealth } from "../utils/fetch-json.js";
    import { PageNav } from "../components/page-nav.js";
    import { PageIntro, StatusPill, EnvFooter } from "../components/layout.js";
    import { RunResult } from "../components/run-result.js";
    const DEFAULT_UTTERANCE = "吧台能做什么咖啡？拿铁的 cup size 怎么选？";

    function App() {
      const [env, setEnv] = useState(null);
      const [utterance, setUtterance] = useState(DEFAULT_UTTERANCE);
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState("");
      const [leftReq, setLeftReq] = useState(null);
      const [leftRes, setLeftRes] = useState(null);
      const [rightReq, setRightReq] = useState(null);
      const [rightRes, setRightRes] = useState(null);
      const noKey = env && env.hasKey === false;

      useEffect(function () {
        loadHealth().then(setEnv).catch(function () {
          setEnv({ port: 50139, provider: null, model: null, hasKey: false });
        });
      }, []);

      async function run(side, endpoint) {
        setBusy(true);
        setError("");
        const body = { utterance: utterance };
        const reqShape = { url: endpoint, method: "POST", body: body };
        if (side === "left") {
          setLeftReq(reqShape);
          setLeftRes(null);
        } else {
          setRightReq(reqShape);
          setRightRes(null);
        }
        try {
          const data = await postJson(endpoint, body);
          if (side === "left") setLeftRes(data.result);
          else setRightRes(data.result);
        } catch (err) {
          setError((err && err.message) || String(err));
        } finally {
          setBusy(false);
        }
      }

      const bothDone = leftRes && rightRes;
      const leftRounds = leftRes ? (leftRes.modelCallCount || 0) : null;
      const rightRounds = rightRes ? (rightRes.modelCallCount || 0) : null;
      const leftExec = leftRes ? (leftRes.toolExecutedCount || 0) : null;
      const rightExec = rightRes ? (rightRes.toolExecutedCount || 0) : null;
      const leftElapsed = leftRes ? leftRes.elapsedMs : null;
      const rightElapsed = rightRes ? rightRes.elapsedMs : null;

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              框架解决什么（What Frameworks Solve） · 第一步（step-1） · FAQ 不该上出杯图
            </h1>
            <StatusPill status={busy ? "loading" : (error ? "error" : (bothDone ? "ok" : "idle"))} />
          </header>
          <PageNav current="faq" base="../" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro
              lead="同一个 FAQ 问句「吧台能做什么咖啡？」，左栏直接调模型（不带 tools），右栏硬套框架 Agent（带 make_latte 工具）。对照「Agent 框架多走的步数」= 抽象的负担。"
              steps={[
                "左栏按钮「直接调（POST /api/faq-direct）」→ 不带 tools，1 轮就出答案。",
                "右栏按钮「套框架 Agent（POST /api/faq-agent）」→ 带 make_latte 工具 + stopWhen，agent 形式跑，可能多调一步工具。",
                "两个独立请求（不是 /api/compare 打包）。对照左/右两栏的 modelCallCount / toolExecutedCount。",
              ]}
              takeaway="FAQ 场景下硬套 Agent 框架 = 抽象的负担：右边多调了 1 步 make_latte 工具（即使 FAQ 问句不需要），多走了一圈 setup（tools + stopWhen 注册），日志更长。模块验收里的「为什么选这个框架」「框架在什么场景下不合适」就在这一页回答。"
              observe="看两栏对照数字：左栏模型调用轮次（modelCallCount）= 1、工具调用次数（toolExecutedCount）= 0；右栏模型调用轮次 ≥ 2、工具调用次数 ≥ 1。这就是「不该上出杯图」的可观察证据——agent 路径多走了 1 步，但 FAQ 场景下这 1 步没意义。"
            />
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <label className="block text-sm text-gray-700">
                客人口述（utterance · FAQ 场景）
                <textarea
                  className="mt-1 w-full border border-gray-300 rounded p-2 text-sm"
                  rows="2"
                  value={utterance}
                  disabled={busy}
                  onChange={function (e) { setUtterance(e.target.value); }}
                />
              </label>
              <p className="text-xs text-gray-500">两个按钮各发一次独立请求（不是接口打包）。左栏无 tools、右栏带 make_latte 工具。</p>
              <div className="flex flex-wrap gap-2">
                <button
                  className="bg-green-600 text-white px-3 py-1.5 rounded text-sm disabled:opacity-50"
                  disabled={busy || noKey}
                  onClick={function () { run("left", "/api/faq-direct"); }}
                >
                  直接调（POST /api/faq-direct · 无 tools）
                </button>
                <button
                  className="bg-blue-600 text-white px-3 py-1.5 rounded text-sm disabled:opacity-50"
                  disabled={busy || noKey}
                  onClick={function () { run("right", "/api/faq-agent"); }}
                >
                  套框架 Agent（POST /api/faq-agent · 带 make_latte）
                </button>
              </div>
              {noKey ? <p className="text-xs text-red-700">缺 密钥，主按钮已禁用。请配 apps/.env。</p> : null}
              {error ? <p className="text-sm text-red-700">{error}</p> : null}
            </section>
            <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] space-y-4">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="space-y-2 border border-green-300 bg-green-50 rounded p-3">
                  <div className="text-xs font-semibold text-green-900">左栏 · 直接调（无 tools）</div>
                  <RunResult request={leftReq} result={leftRes} />
                </div>
                <div className="space-y-2 border border-blue-300 bg-blue-50 rounded p-3">
                  <div className="text-xs font-semibold text-blue-900">右栏 · 套框架 Agent（带 make_latte）</div>
                  <RunResult request={rightReq} result={rightRes} />
                </div>
              </div>
              {bothDone ? (
                <div className="bg-white border border-gray-300 rounded p-3 space-y-1">
                  <div className="text-xs font-semibold text-gray-700">对照数字（同一 FAQ 问句 · 两条路径 · 两个独立请求）</div>
                  <div className="text-xs text-gray-700">
                    左栏（直接调 · 无 tools） · 模型调用轮次（modelCallCount）：<b>{leftRounds}</b> · 工具调用次数（toolExecutedCount）：<b>{leftExec}</b> · 耗时（elapsedMs）：<b>{leftElapsed}</b> 毫秒
                  </div>
                  <div className="text-xs text-gray-700">
                    右栏（套框架 Agent · 带 make_latte） · 模型调用轮次（modelCallCount）：<b>{rightRounds}</b> · 工具调用次数（toolExecutedCount）：<b>{rightExec}</b> · 耗时（elapsedMs）：<b>{rightElapsed}</b> 毫秒
                  </div>
                  <div className="text-xs text-gray-600">
                    结论：FAQ 场景下右栏 agent 路径多走了至少 1 步调工具（modelCallCount ≥ 2、toolExecutedCount ≥ 1），这就是「不该上出杯图」的可观察证据——抽象的负担 = 多走的步数 + 多打的日志 + 多注册的工具。
                  </div>
                </div>
              ) : null}
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
