<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>框架解决什么 · 第一步 · 试用 useChat</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "ai": "https://esm.sh/ai@7.0.107?external=react,react-dom",
      "@ai-sdk/react": "https://esm.sh/@ai-sdk/react@4.0.108?external=react,react-dom,ai"
    }
  }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="module" src="../utils/fetch-json.js"></script>
  <script type="module" src="../components/page-nav.js"></script>
  <script type="module" src="../components/layout.js"></script>
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo, useCallback } from "react";
    import { createRoot } from "react-dom/client";
    import { useChat } from "@ai-sdk/react";
    import { DefaultChatTransport } from "ai";
    import { loadHealth } from "../utils/fetch-json.js";
    import { PageNav } from "../components/page-nav.js";
    import { PageIntro, StatusPill, EnvFooter } from "../components/layout.js";
    const DEFAULT_UTTERANCE = "来一杯中杯热拿铁。";

    function partText(part) {
      if (part.type === "text") return part.text || "";
      if (String(part.type).indexOf("tool-") === 0) {
        return "工具（" + (part.toolName || part.type) + "）状态：" + (part.state || "（进行中）");
      }
      return "";
    }

    function ChatIsland(props) {
      const [utterance, setUtterance] = useState(DEFAULT_UTTERANCE);
      const [localError, setLocalError] = useState("");
      const [hasSent, setHasSent] = useState(false);
      const transport = useMemo(function () {
        return new DefaultChatTransport({ api: "/api/chat-stream" });
      }, []);
      const chat = useChat({ transport: transport });
      const busy = chat.status === "submitted" || chat.status === "streaming";

      const pill = (function () {
        if (busy) return "loading";
        if (chat.status === "error" || localError) return "error";
        if (hasSent && chat.status === "ready") return "ok";
        return "idle";
      })();

      useEffect(function () {
        props.onStatusChange(pill);
      }, [pill, props]);

      async function send() {
        setLocalError("");
        setHasSent(true);
        try {
          await chat.sendMessage({ text: utterance });
        } catch (err) {
          setLocalError((err && err.message) || String(err));
        }
      }

      async function demoHttp(body, label) {
        setLocalError("");
        try {
          const res = await fetch("/api/framework-chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (!res.ok) {
            setLocalError(label + "：HTTP " + res.status + " " + ((data && data.error) || ""));
          }
        } catch (err) {
          setLocalError((err && err.message) || String(err));
        }
      }

      return (
        <div className="space-y-4">
          <label className="block text-sm text-gray-700">
            客人口述（utterance）
            <textarea
              className="mt-1 w-full border border-gray-300 rounded p-2 text-sm"
              rows={2}
              value={utterance}
              disabled={busy}
              onChange={function (e) { setUtterance(e.target.value); }}
            />
          </label>
          <p className="text-xs text-gray-500">点发送会真调模型。拆流由 useChat 做；循环仍在服务端 streamText 里。</p>
          <div className="flex flex-wrap gap-2">
            <button
              className="bg-blue-600 text-white px-3 py-1.5 rounded text-sm disabled:opacity-50"
              disabled={busy || props.noKey}
              onClick={send}
            >
              用 useChat 发送（POST /api/chat-stream · streamText + make_latte）
            </button>
            <button
              className="border border-gray-300 px-3 py-1.5 rounded text-sm disabled:opacity-50"
              disabled={busy}
              onClick={function () {
                demoHttp({
                  messages: [{ id: "empty-user", role: "user", parts: [{ type: "text", text: "" }] }],
                }, "空输入");
              }}
            >
              演示空输入 4xx
            </button>
            <button
              className="border border-gray-300 px-3 py-1.5 rounded text-sm disabled:opacity-50"
              disabled={busy}
              onClick={function () { demoHttp({ messages: [], forceError: true }, "后端错误"); }}
            >
              演示后端 5xx
            </button>
          </div>
          {props.noKey ? <p className="text-xs text-red-700">缺 密钥，主按钮已禁用。请配 apps/.env。</p> : null}
          {localError ? <p className="text-sm text-red-700">{localError}</p> : null}
          {chat.error ? <p className="text-sm text-red-700">{String(chat.error.message || chat.error)}</p> : null}
          <div className="bg-gray-50 border border-gray-200 rounded p-3">
            <div className="text-xs font-semibold text-gray-700">请求参数（Request）</div>
            <pre className="text-xs text-gray-700 whitespace-pre-wrap mt-1">
              {"POST /api/chat-stream\nuseChat + DefaultChatTransport\n客人口述：" + utterance}
            </pre>
          </div>
          <div className="border border-gray-300 bg-white rounded p-3 space-y-2">
            <div className="text-xs font-semibold text-gray-700">调用流程（Trajectory）</div>
            <p className="text-xs text-gray-600">
              本页用官方 useChat 拆流。服务端没有你写的 while。消息条数：{chat.messages.length} · 状态（status）：{chat.status}
            </p>
            {chat.messages.length === 0 ? (
              <p className="text-sm text-gray-500">还没发。点发送后，助手正文会边到边出现。</p>
            ) : chat.messages.map(function (message) {
              const text = (message.parts || []).map(partText).filter(Boolean).join("\n");
              return (
                <div key={message.id} className="border border-gray-200 rounded p-2">
                  <div className="text-xs text-gray-500">角色（role）：{message.role}</div>
                  <pre className="text-xs text-gray-700 whitespace-pre-wrap mt-1">
                    {text || "（这一条还没有正文）"}
                  </pre>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function App() {
      const [env, setEnv] = useState(null);
      const [status, setStatus] = useState("idle");

      useEffect(function () {
        loadHealth().then(setEnv).catch(function () {
          setEnv({ port: 50139, provider: null, model: null, hasKey: false });
        });
      }, []);

      const onStatusChange = useCallback(function (s) {
        setStatus(s);
      }, []);

      const noKey = env && env.hasKey === false;

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              框架解决什么（What Frameworks Solve） · 第一步（step-1） · 试用 useChat
            </h1>
            <StatusPill status={status} />
          </header>
          <PageNav current="use-chat" base="../" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro
              lead="聊天框边生成边出现「正在做热拿铁…」。模块 02 你拆过的 SSE 帧 / 消息数组样板，useChat + DefaultChatTransport 一个 Hook 全收走。"
              steps={[
                "点「用 useChat 发送」会真调模型，发 POST /api/chat-stream。",
                "服务端 lib/flow/chat-stream.ts 顶部直接 import pipeFrameworkChat；文件里没有 while。",
                "库内部把工具调用 / 循环 / 拆帧收走：useChat 接住 chunk 合并进 messages，「正在做拿铁」这类状态由 SDK 自动插进列表。",
              ]}
              takeaway="流式 UI 样板被框架收走：你没写 EventSource 解析器，也没维护 messages 数组——useChat 接住 SDK 推送的 UIMessage 流。while 仍在服务端 streamText 里，你看不见。"
              observe="点发送：消息数组从 1 条 user 边到边涨；调用 make_latte 的 tool 状态自动插进消息列表，对应模块 02 你手写过的「正在做」半句话。"
            />
            <section id="controls" className="bg-white shadow rounded p-4">
              <ChatIsland onStatusChange={onStatusChange} noKey={noKey} />
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
