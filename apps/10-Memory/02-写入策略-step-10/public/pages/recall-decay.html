<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>过期 · 第十步 · 演示页面</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel" src="../components/layout.js"></script>
  <script type="text/babel" src="../components/page-nav.js"></script>
  <script type="text/babel" src="../components/timeline.js"></script>

  <script type="text/babel">
    const { useState } = React;
    const { StatusPill, EnvFooter, PageNav, Timeline } = window.DemoUI || {};

    function factValue(c) {
      if (c.value && typeof c.value === "object" && "value" in c.value) return c.value.value;
      return String(c.value);
    }
    function expireLabel(c) {
      if (!c.validUntil) return "没有到期日（不会过期）";
      const days = Math.round((new Date(c.validUntil).getTime() - Date.now()) / 86400_000);
      if (days < 0) return Math.abs(days) + " 天前就已经过期";
      if (days === 0) return "今天就会过期";
      return days + " 天后到期";
    }
    function variantLabel(c) {
      return c.validUntil ? "自己会过期" : "长期有效";
    }
    function variantCls(c) {
      return c.validUntil ? "bg-yellow-100 text-yellow-900" : "bg-green-100 text-green-900";
    }
    function importanceLabel(level) {
      if (level === "critical") return "重要到永不淘汰";
      if (level === "important") return "重要（衰减慢）";
      if (level === "casual") return "一般（衰减快一点）";
      if (level === "throwaway") return "用完就丢";
      return "还没评（默认按一般处理）";
    }
    function importanceCls(level) {
      if (level === "critical") return "bg-red-100 text-red-900";
      if (level === "important") return "bg-blue-100 text-blue-900";
      if (level === "casual") return "bg-yellow-100 text-yellow-900";
      if (level === "throwaway") return "bg-gray-200 text-gray-700";
      return "bg-white border text-gray-500";
    }
    function scoreLabel(weight) {
      if (weight >= 2) return "高";
      if (weight >= 1) return "中";
      return "低";
    }

    function CandidateCard(props) {
      const c = props.candidate;
      return (
        <div className="border border-gray-200 rounded p-3 space-y-1 bg-white">
          <div className="flex items-center justify-between">
            <span className={"text-xs px-2 py-0.5 rounded font-semibold " + variantCls(c)}>{variantLabel(c)}</span>
            <div className="flex items-center gap-1">
              <span className={"text-xs px-2 py-0.5 rounded font-semibold " + importanceCls(c.importance)}>{importanceLabel(c.importance)}</span>
              <span className="text-xs text-gray-500">重要性 {scoreLabel(c.decayWeight)}（{Number(c.decayWeight).toFixed(2)}）</span>
            </div>
          </div>
          <div className="text-sm text-gray-800">{factValue(c)}</div>
          {c.importanceReasoning ? (
            <div className="text-xs text-gray-600">模型给的评分理由：{c.importanceReasoning}</div>
          ) : null}
          <div className="text-xs text-gray-500">到期：{expireLabel(c)}</div>
          <div className="text-xs text-gray-500">用过 {c.useCount} 次 · 距上次使用 {c.daysSinceLastUsed} 天</div>
        </div>
      );
    }

    function App() {
      const [env, setEnv] = useState(null);
      const [recall, setRecall] = useState(null);
      const [archive, setArchive] = useState(null);
      const [skipped, setSkipped] = useState(null);
      const [skipDays, setSkipDays] = useState(30);
      const [seeded, setSeeded] = useState(null);
      const [scored, setScored] = useState(null);
      const [errorMsg, setErrorMsg] = useState("");

      function setPill(status) {
        const el = document.getElementById("status-pill");
        if (!el) return;
        const map = { idle: "⏸ 待连接", running: "🔄 请求中", done: "✅ 完成", error: "❌ 错误" };
        el.textContent = map[status] || map.idle;
      }

      async function callApi(path, options) {
        setErrorMsg("");
        setPill("running");
        try {
          const res = await fetch(path, options);
          const data = await res.json().catch(function () { return {}; });
          if (!res.ok) {
            setErrorMsg((data && data.explain) || ("HTTP " + res.status));
            setPill("error");
            return null;
          }
          setPill("done");
          return data;
        } catch (err) {
          setErrorMsg("请求失败：" + String(err));
          setPill("error");
          return null;
        }
      }

      async function step1Seed() {
        const data = await callApi("/api/seed", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({}) });
        if (data) setSeeded(data);
      }
      async function step2Score() {
        const data = await callApi("/api/score-importance", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({}) });
        if (data) setScored(data);
      }
      async function step3Recall() {
        const data = await callApi("/api/recall");
        if (data) setRecall(data);
      }
      async function step4TimeSkip() {
        const data = await callApi("/api/time/skip", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ days: skipDays }) });
        if (data) setSkipped(data);
      }
      async function step5Archive() {
        const data = await callApi("/api/archive");
        if (data) setArchive(data);
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              过期 — 让事实库里过期的、长期没用的事实不再参与回答
            </h1>
            <StatusPill status="idle" />
          </header>
          <PageNav current="decay" base="../" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-3">
              <p className="text-sm text-gray-700">
                这个页面演示：<b>事实库里的事实在什么情况下不再参与回答</b>。不是「删掉」——是「事实还在库里，但回答时不带它」。
              </p>
              <div className="text-xs text-gray-600">
                <div className="font-semibold text-gray-700 mb-2">按这个顺序点 5 个按钮跑一遍：</div>
                <ol className="list-decimal pl-5 space-y-1">
                  <li><b>点「灌入示例事实」</b>——把 6 条准备好的事实写进库（不含到期日 / 重要性 —— 让模型评）</li>
                  <li><b>点「让模型评估每条事实的重要性」</b>——让大模型给每条事实打分（永不变 / 重要 / 一般 / 用完就丢）+ 给个到期日。模型不是死规则，跟「我是不是色盲」这种事，模型能根据内容判断它是「永不变」的事实。</li>
                  <li><b>点「现在查回答时用的库」</b>——看库里事实按重要性排序</li>
                  <li><b>拖时间滑块 + 点「快进 N 天」</b>——模拟时间过去，把过了期的事实放进「已归档」</li>
                  <li><b>点「看归档里有什么」</b>——查看过期的事实（注意：过期 ≠ 删除，原始记录还在）</li>
                </ol>
              </div>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">这个页面在演示什么</div>
                <ul className="text-xs text-gray-800 list-disc pl-5 space-y-1">
                  <li><b>「模型评估」是这一关的关键</b>：代码只能算（哪些事过了期、哪些事多久没用），但「这条事实在用户语境里重要不重要」是业务判断，得让模型判</li>
                  <li>不同重要性的事实衰减速度不同：永不变(critical) → 半年(important) → 一月(casual) → 一周(throwaway)</li>
                  <li><b>过期 ≠ 删除</b>：过了期的事实不进回答，但库里还在（用户问起能查回）</li>
                </ul>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-4">
              <h2 className="text-sm font-semibold text-gray-800">按顺序点下面的按钮</h2>

              <div className="border-l-4 border-blue-400 pl-3 space-y-2">
                <div className="text-sm font-semibold text-gray-800">第 1 步：灌入示例事实</div>
                <div className="text-xs text-gray-600">把 6 条准备好的事实写进库（不含到期日 / 重要性 —— 让模型评）。</div>
                <button onClick={step1Seed} className="bg-blue-600 text-white text-sm px-3 py-1 rounded">灌入示例事实</button>
              </div>

              <div className="border-l-4 border-purple-400 pl-3 space-y-2">
                <div className="text-sm font-semibold text-gray-800">第 2 步：让模型评估每条事实的重要性</div>
                <div className="text-xs text-gray-600">调用大模型——给每条事实打分（永不变 / 重要 / 一般 / 用完就丢）+ 给个到期日。这一步是「谁判、代码判」分工里的「模型判」一端。</div>
                <button onClick={step2Score} disabled={!seeded} className="bg-purple-600 text-white text-sm px-3 py-1 rounded disabled:opacity-50">让模型评估每条事实的重要性</button>
                {!seeded ? <div className="text-xs text-gray-500">先点第 1 步灌入示例事实</div> : null}
              </div>

              <div className="border-l-4 border-green-400 pl-3 space-y-2">
                <div className="text-sm font-semibold text-gray-800">第 3 步：现在查回答时用的库</div>
                <div className="text-xs text-gray-600">看库里事实按重要性 + 用过几次排序。多点几次可以观察到「用过 1 次的事实」重要性会微升。</div>
                <button onClick={step3Recall} disabled={!scored} className="bg-green-600 text-white text-sm px-3 py-1 rounded disabled:opacity-50">现在查回答时用的库</button>
                {!scored ? <div className="text-xs text-gray-500">先点第 2 步让模型评估</div> : null}
              </div>

              <div className="border-l-4 border-orange-400 pl-3 space-y-2">
                <div className="text-sm font-semibold text-gray-800">第 4 步：快进 N 天（模拟时间过去）</div>
                <div className="text-xs text-gray-600">拖滑块决定快进几天（默认 30 天）。点按钮后，过了到期日的事实会被放进「已归档」。标了「永不变」的事实不会被归档。</div>
                <div className="flex items-center gap-2">
                  <input type="range" min="0" max="365" step="1" value={skipDays} onChange={function (e) { setSkipDays(Number(e.target.value)); }} className="flex-1" />
                  <span className="font-mono text-sm">快进 {skipDays} 天</span>
                </div>
                <button onClick={step4TimeSkip} className="bg-orange-600 text-white text-sm px-3 py-1 rounded">快进 {skipDays} 天</button>
              </div>

              <div className="border-l-4 border-red-400 pl-3 space-y-2">
                <div className="text-sm font-semibold text-gray-800">第 5 步：看归档里有什么</div>
                <div className="text-xs text-gray-600">点这个按钮后看被过期的事实。注意：过期 ≠ 删除——这些事实在库里还在，只是不再参与回答。</div>
                <button onClick={step5Archive} className="bg-red-600 text-white text-sm px-3 py-1 rounded">看归档里有什么</button>
              </div>

              {errorMsg ? <div className="text-xs text-red-700">{errorMsg}</div> : null}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              <h2 className="text-sm font-semibold text-gray-800">点完按钮后的结果</h2>

              {seeded ? (
                <div className="bg-blue-50 border border-blue-300 rounded p-3">
                  <div className="text-xs font-semibold text-blue-900 mb-1">第 1 步结果</div>
                  <div className="text-xs text-gray-700">已经往库里写了 {seeded.seeded.length} 条事实（不含到期日 / 重要性）。接下来点第 2 步让模型评估。</div>
                </div>
              ) : null}

              {scored ? (
                <div className="bg-purple-50 border border-purple-300 rounded p-3 space-y-2">
                  <div className="text-xs font-semibold text-purple-900 mb-1">第 2 步结果：模型评估了 {scored.scored} 条事实</div>
                  <ul className="text-xs text-gray-700 space-y-1">
                    {scored.results.map(function (r) {
                      return (
                        <li key={r.key}><b>{r.key}</b> → <span className={"px-1 rounded " + importanceCls(r.importance)}>{r.importance}</span>（{importanceLabel(r.importance)}）—— {r.reasoning}</li>
                      );
                    })}
                  </ul>
                </div>
              ) : null}

              {recall && recall.candidates.length > 0 ? (
                <div className="space-y-4">
                  <div className="text-sm font-semibold text-gray-800">第 3 步结果：库里现在有 {recall.count} 条事实，按重要性排：</div>

                  <div className="bg-white border rounded p-3 space-y-2">
                    <div className="text-xs font-semibold text-green-800">📌 长期有效的事实（没有到期日）</div>
                    <div className="space-y-2">
                      {recall.candidates.filter(function (c) { return !c.validUntil; }).map(function (c) {
                        return <CandidateCard key={c.key} candidate={c} />;
                      })}
                      {recall.candidates.filter(function (c) { return !c.validUntil; }).length === 0 ? (
                        <div className="text-xs text-gray-500 italic">库里没有长期有效的事实</div>
                      ) : null}
                    </div>
                  </div>

                  <div className="bg-white border rounded p-3 space-y-2">
                    <div className="text-xs font-semibold text-yellow-800">📌 自己会过期的事实（还没到期的）</div>
                    <div className="space-y-2">
                      {recall.candidates.filter(function (c) { return c.validUntil; }).map(function (c) {
                        return <CandidateCard key={c.key} candidate={c} />;
                      })}
                      {recall.candidates.filter(function (c) { return c.validUntil; }).length === 0 ? (
                        <div className="text-xs text-gray-500 italic">没有未过期的「自己会过期」事实</div>
                      ) : null}
                    </div>
                  </div>

                  {/* 时间线预览 —— 拖滑块实时显示「如果跳 X 天后这 6 条分别什么状态」 */}
                  <Timeline skipDays={skipDays} recall={recall} scored={scored} />
                </div>
              ) : recall && recall.candidates.length === 0 ? (
                <div className="text-xs text-gray-500 italic">库里现在没有候选事实。先点第 1 步灌入示例，再点第 2 步让模型评估，再点第 3 步查。</div>
              ) : null}

              {skipped ? (
                <div className="bg-orange-50 border border-orange-300 rounded p-3">
                  <div className="text-xs font-semibold text-orange-900 mb-1">第 4 步结果</div>
                  <ul className="text-xs text-gray-700 space-y-1">
                    <li>快进了 <b>{skipped.skippedDays}</b> 天（现在的「今天」 = {skipped.asOf}）</li>
                    <li>扫了 {skipped.scanned} 条事实，发现 <b>{skipped.archived}</b> 条过了期（标了「永不变」的事实在 WHERE 里被排除，不会被归档）</li>
                    {skipped.archivedKeys && skipped.archivedKeys.length > 0 ? (
                      <li>被归档的有：<b>{skipped.archivedKeys.join("、")}</b></li>
                    ) : null}
                  </ul>
                </div>
              ) : null}

              {archive && archive.archived.length > 0 ? (
                <div className="bg-red-50 border border-red-300 rounded p-3 space-y-2">
                  <div className="text-xs font-semibold text-red-900">第 5 步结果：归档里有 {archive.archived.length} 条事实</div>
                  <div className="text-xs text-gray-700">这些事实「过期 ≠ 删除」——原始记录还在库里，但回答时不带它们了。</div>
                  <ul className="text-xs space-y-2">
                    {archive.archived.map(function (a) {
                      return (
                        <li key={a.key} className="bg-white border rounded p-2 space-y-1">
                          <div className="text-gray-800">{factValue(a)}</div>
                          <div className="text-gray-500">原本应该在 <span className="font-mono">{a.validUntil}</span> 之前参与回答；现在 <span className="font-mono">{a.archivedAt}</span> 被归档。</div>
                        </li>
                      );
                    })}
                  </ul>
                </div>
              ) : archive && archive.archived.length === 0 ? (
                <div className="text-xs text-gray-500 italic">还没有归档的事实（先点第 4 步把过期的事实归档掉）。</div>
              ) : null}
            </section>
          </main>
          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <EnvFooter env={env} port={50113} />
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
