<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>过期 · 第十步 · 总览</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel" src="components/layout.js"></script>
  <script type="text/babel" src="components/page-nav.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, EnvFooter, PageNav } = window.DemoUI || {};

    function App() {
      const [env, setEnv] = useState(null);

      useEffect(function () {
        fetch("/health")
          .then(function (r) { return r.json(); })
          .then(function (data) { setEnv(data); })
          .catch(function () {});
      }, []);

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              过期（Expiration / TTL） · 第十步（step-10） · 总览
            </h1>
            <StatusPill status="idle" />
          </header>
          <PageNav current="overview" base="" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
              <p className="text-sm text-gray-700">本页是<b>第 6 关「过期」</b>总览。笔记 §6 写了<b>四种过期方式</b>：6-A 永不过期 / 6-B 自带有效期 / 6-C 不用就衰减 / 6-D 被新事实挤掉。本步 step-10 把前三种做齐——<b>时间快进</b> + <b>归档视图</b> + <b>衰减权重排序</b>。变体 6-D「被新事实挤掉」属于 step-11+ 的工作（需要给事实加关联键 expires_with）。</p>
              <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
                <li>点下方 sub-page 卡片 → 进入「6-C 衰减权重 + 时间快进」演示页。</li>
                <li>演示页里有 5 个控件：seed 灌数据 / 现在查 recall / 时间快进滑块 + 按钮 / 查已归档 / 演示后端 5xx。</li>
                <li>本页 &quot;已归档 / 视图"在 sub-page 的「已归档视图」卡片里展示——跟 recall 候选独立。</li>
              </ol>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <ol className="text-xs text-gray-800 list-decimal pl-5 space-y-1">
                  <li><span className="font-medium">过期 ≠ 删除</span>：过期的事实在 recall 候选里消失，但在「已归档」视图里仍在——这是第 6 关的关键区分。归档（写 archived_at）不是物理 DELETE。</li>
                  <li><span className="font-medium">三种过期方式</span>：6-A 永不过期（validUntil=null）/ 6-B 自带有效期（validUntil 时间到了就归档）/ 6-C 衰减权重（last_used_at + use_count + 衰减公式，半衰期 30 天）。</li>
                  <li><span className="font-medium">衰减公式</span>：weight = (1 + log(use_count + 1)) / (1 + daysSinceLastUsed / 30) ——用得多的比没用的权重高，越久没用的权重越低。</li>
                  <li><span className="font-medium">本步不调大模型</span>：演示用 seed 直接灌数据进库；recall/时间快进都是本地 SQL。第 6 关是「读 + 归档」，跟 step-9「写入 + 抽」不同。</li>
                </ol>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4">
              <h2 className="text-sm font-semibold text-gray-800 mb-3">本步 sub-page（点卡片进入）</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <a href="pages/recall-decay.html" className="block bg-white shadow rounded p-4 hover:bg-gray-50 border border-gray-200">
                  <div className="flex items-center gap-2 mb-2">
                    <span className="text-xs px-2 py-0.5 rounded font-semibold bg-orange-100 text-orange-900">mode-decay</span>
                    <span className="text-sm font-semibold text-gray-800">6-A 永不过期 + 6-B 自带有效期 + 6-C 衰减权重 + 时间快进 + 归档视图</span>
                  </div>
                  <p className="text-xs text-gray-600">seed 灌 6 条预设事实 → 现在查 recall（按 decayWeight 排序，每条带「变体 6-A / 6-B」+「6-C 衰减权重」两个徽标）→ 时间快进 N 天 → 三个变体分组演示区 + 归档视图。三个变体都在这一个 sub-page 里跑。</p>
                  <p className="text-xs text-gray-400 mt-2">入口：<span className="font-mono">pages/recall-decay.html</span> · 端口 50113</p>
                </a>
              </div>
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-3">
              <h2 className="text-sm font-semibold text-gray-800">笔记 §6 四种过期方式 · 本步覆盖范围</h2>
              <table className="w-full text-xs">
                <thead>
                  <tr className="text-left text-gray-500 border-b">
                    <th className="py-1 pr-2">变体</th>
                    <th className="py-1 pr-2">做法</th>
                    <th className="py-1 pr-2">本步</th>
                  </tr>
                </thead>
                <tbody className="divide-y">
                  <tr>
                    <td className="py-1 pr-2 font-mono">6-A 永不过期</td>
                    <td className="py-1 pr-2 text-gray-600">validUntil = null（除非用户明确改口，否则一直有效）</td>
                    <td className="py-1 pr-2"><span className="bg-green-100 text-green-900 text-xs px-2 py-0.5 rounded font-semibold">已做（recall 排除 archived，validUntil=null 不被归档）</span></td>
                  </tr>
                  <tr>
                    <td className="py-1 pr-2 font-mono">6-B 自带有效期</td>
                    <td className="py-1 pr-2 text-gray-600">提取阶段让模型判断 validUntil（已传当前日期，step-1 ✅）；时间到了写 archived_at 而不是物理删除</td>
                    <td className="py-1 pr-2"><span className="bg-green-100 text-green-900 text-xs px-2 py-0.5 rounded font-semibold">已做（scanForExpired + 归档视图）</span></td>
                  </tr>
                  <tr>
                    <td className="py-1 pr-2 font-mono">6-C 不用就衰减</td>
                    <td className="py-1 pr-2 text-gray-600">记 last_used_at + use_count，长期没被召回的降权（不删除）；公式 weight = (1 + log(use_count + 1)) / (1 + daysSince / 30)</td>
                    <td className="py-1 pr-2"><span className="bg-green-100 text-green-900 text-xs px-2 py-0.5 rounded font-semibold">已做（computeDecayWeight + recallWithDecay）</span></td>
                  </tr>
                  <tr>
                    <td className="py-1 pr-2 font-mono">6-D 被新事实挤掉</td>
                    <td className="py-1 pr-2 text-gray-600">「我毕业了」进来挤掉「在读学校」（不是同一 key，是关联 key）；需要事实加 expires_with 关联字段</td>
                    <td className="py-1 pr-2"><span className="bg-gray-100 text-gray-700 text-xs px-2 py-0.5 rounded font-semibold">不做（step-11+ 另开 step）</span></td>
                  </tr>
                </tbody>
              </table>
              <p className="text-xs text-gray-600">6-D 留给后续 step——这一关需要给事实加 expires_with 关联字段（指明某条事实在「另一条事实写入时自动过期」），属于 step-11+ 的范围。本步只覆盖 6-A / 6-B / 6-C 三种。</p>
            </section>
          </main>
          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <EnvFooter env={env} port={50113} />
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
