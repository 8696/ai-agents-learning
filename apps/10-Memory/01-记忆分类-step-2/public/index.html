<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>记忆分类 · 第二步</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, PageIntro, EnvFooter } = window.DemoUI || {};

    // 四个例句对照四种期望：
    //   ① 我们组用 Vue 3              → 语义 / 长期 → 写入
    //   ② 今天有点累先到这            → 多被模型判为情景 / 长期 → 写入（演示同 key 覆盖 / 长期命中）
    //   ③ 以后表单校验都用 zod        → 程序性 / 长期 → 不写（程序性记忆是全员规则）
    //   ④ 帮我写个表单                → 工作 / 短期   → 不写
    const EXAMPLES = [
      "我们组用 Vue 3",
      "今天有点累先到这",
      "以后表单校验都用 zod",
      "帮我写个表单",
    ];

    function App() {
      const [status, setStatus] = useState("idle");
      const [env, setEnv] = useState(null);
      const [sentence, setSentence] = useState(EXAMPLES[0]);
      const [errorText, setErrorText] = useState("");
      const [result, setResult] = useState(null);
      const [facts, setFacts] = useState([]);
      const [factsPath, setFactsPath] = useState("");

      // 启动时拉一次 /health + /api/facts，让列表是磁盘上的真实状态
      useEffect(function () {
        fetch("/health")
          .then(function (res) { return res.json(); })
          .then(function (data) { setEnv(data); })
          .catch(function () { setEnv(null); });
        refreshFacts();
      }, []);

      function refreshFacts() {
        fetch("/api/facts")
          .then(function (res) { return res.json(); })
          .then(function (data) {
            setFacts(Array.isArray(data.facts) ? data.facts : []);
            setFactsPath(data.filePath || "");
          })
          .catch(function (err) { console.error("读事实库失败", err); });
      }

      const hasKey = Boolean(env && env.hasKey);
      const busy = status === "loading";

      // 本步核心：调一次分类 + 让写入规则按选项 C 决定写不写盘
      function runClassifyAndPersist() {
        setStatus("loading");
        setErrorText("");
        fetch("/api/classify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sentence: sentence, persist: true }),
        })
          .then(function (res) {
            return res.json().then(function (body) {
              return { ok: res.ok, status: res.status, body: body };
            });
          })
          .then(function (pack) {
            if (!pack.ok) {
              setStatus("error");
              setErrorText((pack.body && pack.body.explain) || ("HTTP " + pack.status));
              return;
            }
            setResult(pack.body);
            setStatus("ok");
            refreshFacts();
          })
          .catch(function (err) {
            setStatus("error");
            setErrorText(String(err));
          });
      }

      // 演示用：清空事实库，让学习者能反复试「写入 → 重启 → 还在」
      function runClearFacts() {
        if (!confirm("清空事实库？演示用。")) return;
        setStatus("loading");
        setErrorText("");
        fetch("/api/facts", { method: "DELETE" })
          .then(function (res) {
            return res.json().then(function (body) {
              return { status: res.status, body: body };
            });
          })
          .then(function (pack) {
            setStatus("ok");
            refreshFacts();
          })
          .catch(function (err) {
            setStatus("error");
            setErrorText(String(err));
          });
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              记忆分类（Memory Types）· 第二步（step-2）· 分类 + 写入 + 重启验证
            </h1>
            <StatusPill status={status} />
          </header>
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro />
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <label className="block text-sm text-gray-700">
                一句用户原话（sentence）
                <textarea
                  className="mt-1 w-full border rounded p-2 text-sm"
                  rows={2}
                  value={sentence}
                  onChange={function (event) { setSentence(event.target.value); }}
                />
              </label>
              <div className="flex flex-wrap gap-2">
                {EXAMPLES.map(function (ex) {
                  return (
                    <button
                      key={ex}
                      type="button"
                      className="border border-gray-300 text-xs px-2 py-1 rounded hover:bg-gray-100"
                      onClick={function () { setSentence(ex); }}
                    >
                      例句：{ex}
                    </button>
                  );
                })}
              </div>
              <p className="text-xs text-gray-500">
                期望：「我们组用 Vue 3」写进事实库；「今天有点累」按选项 C 规则拦下（写盘侧尊重 term 字段）；
                「以后表单校验都用 zod」是程序性记忆，不进用户事实库；「帮我写个表单」是工作 / 短期，不写。
              </p>
              <div className="flex flex-wrap gap-2">
                <button
                  type="button"
                  className="bg-blue-600 text-white text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy || !hasKey || !sentence.trim()}
                  onClick={runClassifyAndPersist}
                >
                  分类并写入（调模型 + 写事实库 · /api/classify）
                </button>
                <button
                  type="button"
                  className="border border-red-300 text-red-700 text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={runClearFacts}
                >
                  清空事实库（演示用 · DELETE /api/facts）
                </button>
              </div>
              <p className="text-xs text-gray-500">
                「分类并写入」会调模型判类，再按选项 C 规则写入。「清空事实库」让学习者能反复试「写入 → 重启 → 还在」。
              </p>
            </section>
            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {errorText ? (
                <div className="border border-red-300 bg-red-50 rounded p-3 text-sm text-red-800">{errorText}</div>
              ) : null}
              {result ? (
                <div className="space-y-3">
                  <div className="bg-gray-50 text-gray-700 rounded p-3 text-xs space-y-1">
                    <p className="font-medium text-gray-800">请求参数</p>
                    <p>用户原话（sentence）：{sentence}</p>
                    <p>接口：POST /api/classify（持久化字段 persist: true）</p>
                  </div>
                  <div className="border border-gray-300 bg-white rounded p-3 text-xs space-y-2">
                    <p className="font-medium text-gray-800">调用流程</p>
                    <ol className="list-decimal pl-5 space-y-1 text-gray-700">
                      <li>服务端拼好四类记忆 + 短期 / 长期判定口径，调协议 A 对话补全（JSON Mode）</li>
                      <li>解析模型返回的 JSON，校验字段（memoryType / term / reason）</li>
                      <li>持久化开关开启 → 调 facts-store.recordIfLongTerm，按选项 C 规则写入</li>
                      <li>把分类结果 + 写入结果 + 完整模型请求 / 响应一起返回</li>
                    </ol>
                  </div>
                  <div className="bg-green-50 border border-green-300 rounded p-3 space-y-1">
                    <p className="text-sm font-semibold text-green-900">判类结果</p>
                    <p className="text-sm">
                      归入：<span className="font-semibold">{result.classification.memoryType}</span>
                      　·　存储期限：
                      <span className="font-semibold">{result.classification.term}</span>
                    </p>
                    <p className="text-xs text-gray-700">理由：{result.classification.reason}</p>
                  </div>
                  {result.persistence ? (
                    <div className={
                      "border rounded p-3 space-y-1 " +
                      (result.persistence.written
                        ? "border-blue-300 bg-blue-50"
                        : "border-amber-300 bg-amber-50")
                    }>
                      <p className="text-sm font-semibold">
                        写入结果：{result.persistence.written ? "✅ 已写进事实库" : "🚫 没写盘"}
                      </p>
                      <p className="text-xs text-gray-700">{result.persistence.reason}</p>
                      {result.persistence.written ? (
                        <p className="text-xs text-gray-700">
                          key（用户原话归一化）：<code className="bg-white px-1 rounded">{result.persistence.key}</code>
                        </p>
                      ) : null}
                    </div>
                  ) : null}
                </div>
              ) : (
                <p className="text-sm text-gray-500">
                  还没有判类结果。点「分类并写入」之后会看到分类结果 + 这条有没有真的写进事实库。
                </p>
              )}
              <div className="border-t pt-3">
                <p className="text-sm font-semibold text-gray-800 mb-2">
                  事实库当前内容（实时从 {factsPath || "data/facts.json"} 读 · {facts.length} 条）
                </p>
                {facts.length === 0 ? (
                  <p className="text-xs text-gray-500">事实库是空的。点「分类并写入」写第一条。</p>
                ) : (
                  <div className="space-y-2">
                    {facts.map(function (f) {
                      return (
                        <div key={f.key} className="border border-gray-200 bg-white rounded p-2 text-xs space-y-1">
                          <p>
                            <span className="font-semibold">{f.memoryType}</span>
                            　·　<span className="font-semibold">{f.term}</span>
                          </p>
                          <p>原话：{f.sentence}</p>
                          <p className="text-gray-600">理由：{f.reason}</p>
                          <p className="text-gray-500">
                            写入时刻：{new Date(f.recordedAt).toLocaleString("zh-CN")}
                            　·　key：<code className="bg-gray-100 px-1 rounded">{f.key}</code>
                          </p>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
              <div className="border-t pt-3 bg-gray-50 -mx-4 -mb-4 px-4 py-3 rounded-b">
                <p className="text-sm font-semibold text-gray-800 mb-1">怎么验证「重启后还在」</p>
                <ol className="text-xs text-gray-700 list-decimal pl-5 space-y-1">
                  <li>点几次「分类并写入」，让事实库里出现至少一条「语义 / 长期」或「情景 / 长期」的事实</li>
                  <li>记住当前事实库里到底有哪几条</li>
                  <li>在终端里 <code className="bg-white px-1 rounded">Ctrl+C</code> 关掉服务，再 <code className="bg-white px-1 rounded">cd apps && yarn app:10-01-memory-types-step-2</code> 重新启动</li>
                  <li>重新打开本页（或刷新）—— 事实库列表会从磁盘重新读一次，那条长期事实还在</li>
                </ol>
                <p className="text-xs text-gray-600 mt-2">
                  注意：之前那条「今天有点累」或「以后表单校验都用 zod」从一开始就被写入规则拦下了，重启后也不会出现。
                </p>
              </div>
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
