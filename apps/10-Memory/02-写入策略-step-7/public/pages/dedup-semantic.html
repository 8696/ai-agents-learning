<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>写入策略 · 第七步 · 变体 4-C 跨 key 嵌入相似度</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel" src="../components/page-nav.js"></script>
  <script type="text/babel" src="../components/layout.js"></script>
  <script type="text/babel" src="../components/fact-list.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { PageNav, StatusPill, EnvFooter, FactList, FactCountBadge } = window.DemoUI || {};

    const EXAMPLES = [
      "我住在深圳市",
      "我们公司技术栈是 Vue 三加 TypeScript",
      "今天天气不错",
      "我家在北京",
    ];

    function SemanticIntro() {
      return (
        <section id="page-intro" className="bg-white shadow rounded p-4 space-y-2">
          <p className="text-sm text-gray-700">
            本页只演示<b>变体 4-C 措辞不同但意思一样 → 嵌入相似度查重</b>。
            服务端调 <code>dedupByEmbedding</code>：把这段文本跟库里所有现有事实都算嵌入 + 余弦相似度，
            最高 ≥ threshold 判 <code>semantic_dup</code> 并指出库里最相似那条。
          </p>
          <ol className="text-xs text-gray-600 list-decimal pl-5 space-y-1">
            <li>填一段文本 + threshold（[0, 1]，默认 0.9），点「查重」（POST /api/dedup-by-embedding）。</li>
            <li>服务端调嵌入模型（真发网络请求；apps/.env 顶层 LLM_EMBEDDING_MODEL 决定嵌入模型 id）。</li>
            <li>一次 batch 嵌入：新候选文本 + 库里所有 fact 的 value。</li>
            <li>余弦相似度（纯本地算）找最高；最高 ≥ threshold → semantic_dup。</li>
          </ol>
          <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
            <p className="text-sm font-semibold text-yellow-900">本页核心教学点</p>
            <ol className="text-sm text-yellow-900 list-decimal pl-5 space-y-1">
              <li><span className="font-medium">4-C 跟 4-A 不一样的核心：跨 key 查</span>：4-A 按 key 查；4-C 按 value 文本相似度查，<b>不依赖 key</b>。能抓「city = 深圳」 vs 「location = 深圳市」——4-A 漏。</li>
              <li><span className="font-medium">threshold 是产品参数</span>：调高（0.95+）漏同义；调低（0.7-）误覆盖。没有「正确的」值，靠带标注的样本集跑评测校准。</li>
              <li><span className="font-medium">真发网络请求</span>：跟模块 08「余弦相似度」复用同一套嵌入 + 余弦几何。库里事实越多调用越慢——生产要做嵌入缓存。</li>
            </ol>
          </div>
        </section>
      );
    }

    function App() {
      const [status, setStatus] = useState("idle");
      const [env, setEnv] = useState(null);
      const [queryText, setQueryText] = useState(EXAMPLES[0]);
      const [threshold, setThreshold] = useState(0.9);
      const [mergeToBestMatch, setMergeToBestMatch] = useState(false);
      const [result, setResult] = useState(null);
      const [errorText, setErrorText] = useState("");
      const [factCount, setFactCount] = useState(0);
      const [factList, setFactList] = useState({});
      const [showFacts, setShowFacts] = useState(false);

      useEffect(function () {
        fetch("/health").then(function (r) { return r.json(); }).then(setEnv).catch(function () { setEnv(null); });
        refreshFacts();
      }, []);

      function refreshFacts() {
        fetch("/api/facts")
          .then(function (res) { return res.json(); })
          .then(function (data) { setFactCount(data.count || 0); setFactList(data.facts || {}); })
          .catch(function () { /* 静默 */ });
      }

      function runDedup() {
        setStatus("loading");
        setErrorText("");
        fetch("/api/dedup-by-embedding", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: queryText, threshold: threshold, mergeToBestMatch: mergeToBestMatch }),
        })
          .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; }); })
          .then(function (pack) {
            if (!pack.ok) { setStatus("error"); setErrorText((pack.body && pack.body.explain) || ("HTTP " + pack.status)); return; }
            setResult(pack.body);
            setStatus("ok");
          })
          .catch(function (err) { setStatus("error"); setErrorText(String(err)); });
      }

      const actionLabel = {
        new: { text: "🟢 库里没有同义的（new）", cls: "bg-green-200 text-green-900" },
        semantic_dup: { text: "🔵 措辞不同但意思一样 → semantic_dup", cls: "bg-blue-200 text-blue-900" },
      };

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              写入策略 · 第七步 · 变体 4-C 跨 key 嵌入相似度
            </h1>
            <StatusPill status={status} />
          </header>
          <PageNav current="semantic" base="../" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <SemanticIntro />
            <section id="fact-status" className="flex flex-wrap items-center gap-2">
              <FactCountBadge count={factCount} open={showFacts} onShow={function () { setShowFacts(function (v) { return !v; }); }} />
              <span className="text-xs text-gray-500">（库里事实数越多，一次 batch 嵌入越慢——生产做嵌入缓存）</span>
            </section>
            {showFacts ? (
              <section id="facts" className="bg-white shadow rounded p-4 space-y-2">
                <p className="text-sm font-semibold text-gray-800 mb-2">事实库清单（GET /api/facts）</p>
                <FactList facts={factList} count={factCount} />
              </section>
            ) : null}
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <label className="block text-sm text-gray-700">
                文本（要查重的候选，自由文本，不依赖 key）
                <textarea className="mt-1 w-full border rounded p-2 text-sm font-mono" rows={3}
                  value={queryText} onChange={function (e) { setQueryText(e.target.value); }} />
              </label>
              <label className="block text-sm text-gray-700">
                threshold（相似度阈值，0.0~1.0）
                <input type="number" step="0.05" min="0" max="1" className="mt-1 w-full border rounded p-2 text-sm font-mono"
                  value={threshold} onChange={function (e) { setThreshold(parseFloat(e.target.value) || 0); }} />
              </label>
              <div className="flex flex-wrap gap-2">
                {EXAMPLES.map(function (ex) {
                  return (
                    <button
                      key={ex}
                      type="button"
                      className="border border-gray-300 text-xs px-2 py-1 rounded hover:bg-gray-100"
                      onClick={function () { setQueryText(ex); }}
                    >
                      例：{ex}
                    </button>
                  );
                })}
              </div>
              <button type="button" className="bg-blue-600 text-white text-sm px-3 py-2 rounded disabled:opacity-50"
                disabled={!queryText.trim() || status === "loading"} onClick={runDedup}>
                查重（POST /api/dedup-by-embedding）
              </button>
              <label className="flex items-center gap-2 text-xs text-gray-700 mt-1">
                <input type="checkbox" checked={mergeToBestMatch}
                  onChange={function (e) { setMergeToBestMatch(e.target.checked); }} />
                勾上 = 真把库里那条改成你新填的文本（不勾 = 只告诉你像不像，不改库）
              </label>
            </section>
            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {errorText ? (
                <div className="border border-red-300 bg-red-50 rounded p-3 text-sm text-red-800">{errorText}</div>
              ) : null}
              {result ? (
                <div className="space-y-3">
                  <div className={"border rounded p-3 text-sm font-semibold " + (actionLabel[result.action] ? actionLabel[result.action].cls : "bg-gray-200")}>
                    {actionLabel[result.action] ? actionLabel[result.action].text : "未知动作"}
                  </div>
                  {result.action === "semantic_dup" && result.bestMatch ? (
                    <div className="border border-blue-300 bg-blue-50 rounded p-3 text-xs space-y-1">
                      <p className="font-semibold text-blue-900">库里最相似的事实</p>
                      <p>key：<code className="bg-white px-1 rounded">{result.bestMatch["key"]}</code></p>
                      <p>value（库里现在的内容）：</p>
                      <pre className="bg-white rounded p-2 overflow-auto max-h-32">{JSON.stringify(result.bestMatch.value, null, 2)}</pre>
                      <p>相似度：<b className="text-blue-900">{result.bestMatch.similarity.toFixed(4)}</b>（阈值 {result.threshold}）</p>
                      {result.merged ? (
                        <p className="text-green-800 font-semibold mt-2">✅ 已合并：库里 key=<code>{result.mergedKey}</code> 的内容已被改成你新填的这段文本。打开顶部「查看事实库」能看到新内容。</p>
                      ) : (
                        <p className="text-gray-600 mt-2">只判没改库 —— 想真改库请勾上「归并」checkbox 再点一次「查重」。</p>
                      )}
                    </div>
                  ) : null}
                  {result.action === "new" ? (
                    <div className="border border-green-300 bg-green-50 rounded p-3 text-xs text-gray-700">库里所有事实相似度都 &lt; {result.threshold}。</div>
                  ) : null}
                </div>
              ) : (
                <p className="text-sm text-gray-500">还没跑过语义查重。填文本 + threshold，点「查重。</p>
              )}
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
