<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>记忆分类 · 第四步</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/page-nav.js"></script>
  <script type="text/babel" src="/components/program-rules-panel.js"></script>
  <script type="text/babel" src="/components/pipeline-step.js"></script>
  <script type="text/babel" src="/components/fragments.js"></script>
  <script type="text/babel" src="/components/renderers.js"></script>
  <script type="text/babel" src="/components/memory-write-panel.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, PageIntro, EnvFooter, PageNav, ProgramRulesPanel, PipelineStep, ProgramRuleList, RecallSystemFragment, ModelCallOutput, HistoryOutput, MemoryWritePanel } = window.DemoUI || {};

    const EXAMPLES = [
      "你好",
      "我用什么框架？",
      "刚才那条记下了吗？",
      "我叫什么名字？",
      "123×456 等于多少",
      "我处理过哪些批量改价任务？",
    ];

    function App() {
      const [status, setStatus] = useState("idle");
      const [env, setEnv] = useState(null);
      const [errorText, setErrorText] = useState("");
      const [programRules, setProgramRules] = useState([]);
      const [messages, setMessages] = useState([]);           // 多轮历史累积
      const [currentInput, setCurrentInput] = useState("");
      const [lastResult, setLastResult] = useState(null);     // { query, recall, modelAnswer, finalMessages }
      const [skipRecall, setSkipRecall] = useState(false);
      const [facts, setFacts] = useState([]);                     // 用户事实库（语义/情景）
      const [lastWrite, setLastWrite] = useState(null);           // 最近一次写入结果

      useEffect(function () {
        fetch("/health").then(function (r) { return r.json(); }).then(setEnv).catch(function () { setEnv(null); });
        refreshRules();
        refreshFacts();
      }, []);

      function refreshRules() {
        fetch("/api/program-rules")
          .then(function (res) { return res.json(); })
          .then(function (d) { setProgramRules(Array.isArray(d.rules) ? d.rules : []); })
          .catch(function () { setProgramRules([]); });
      }

      function refreshFacts() {
        fetch("/api/facts")
          .then(function (res) { return res.json(); })
          .then(function (d) { setFacts(Array.isArray(d.facts) ? d.facts : []); })
          .catch(function () { setFacts([]); });
      }

      function classifyAndWrite(text) {
        if (!text || !text.trim()) return;
        setStatus("loading");
        setErrorText("");
        fetch("/api/classify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sentence: text.trim(), persist: true }),
        })
          .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; }); })
          .then(function (pack) {
            if (!pack.ok) {
              setErrorText((pack.body && pack.body.explain) || ("HTTP " + pack.status));
              setStatus("error");
              return;
            }
            setLastWrite(pack.body);
            refreshFacts();
            const input = document.getElementById("memory-write-input");
            if (input) input.value = "";
            setStatus("ok");
          })
          .catch(function (err) { setErrorText(String(err)); setStatus("error"); });
      }

      function deleteFact(key) {
        if (!confirm("删除这条事实？key = " + key)) return;
        setStatus("loading");
        fetch("/api/facts/" + encodeURIComponent(key), { method: "DELETE" })
          .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; }); })
          .then(function (pack) {
            if (!pack.ok) {
              setErrorText((pack.body && pack.body.explain) || ("HTTP " + pack.status));
              setStatus("error");
              return;
            }
            refreshFacts();
            setStatus("ok");
          })
          .catch(function (err) { setErrorText(String(err)); setStatus("error"); });
      }

      const hasKey = Boolean(env && env.hasKey);
      const busy = status === "loading";

      function addProgramRule(text) {
        if (!text || !text.trim()) return;
        setStatus("loading");
        fetch("/api/program-rules", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text.trim() }),
        })
          .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; }); })
          .then(function (pack) {
            if (!pack.ok) { setErrorText((pack.body && pack.body.explain) || ("HTTP " + pack.status)); setStatus("error"); return; }
            refreshRules();
            setStatus("ok");
          })
          .catch(function (err) { setErrorText(String(err)); setStatus("error"); });
      }

      function removeProgramRule(id) {
        setStatus("loading");
        fetch("/api/program-rules/" + id, { method: "DELETE" })
          .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; }); })
          .then(function (pack) {
            if (!pack.ok) { setErrorText((pack.body && pack.body.explain) || ("HTTP " + pack.status)); setStatus("error"); return; }
            refreshRules();
            setStatus("ok");
          })
          .catch(function (err) { setErrorText(String(err)); setStatus("error"); });
      }

      function clearUserMemory() {
        if (!confirm("清空用户事实库？程序性规则原封不动。")) return;
        setStatus("loading");
        fetch("/api/facts", { method: "DELETE" })
          .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; }); })
          .then(function (pack) {
            if (!pack.ok) { setErrorText((pack.body && pack.body.explain) || ("HTTP " + pack.status)); setStatus("error"); return; }
            setStatus("ok");
          })
          .catch(function (err) { setErrorText(String(err)); setStatus("error"); });
      }

      function clearHistory() {
        setMessages([]);
        setLastResult(null);
      }

      function runForceError() {
        setStatus("loading");
        setErrorText("");
        fetch("/api/force-error", { method: "POST" })
          .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; }); })
          .then(function (pack) {
            setErrorText((pack.body && pack.body.explain) || ("HTTP " + pack.status));
            setStatus("error");
          })
          .catch(function (err) { setErrorText(String(err)); setStatus("error"); });
      }

      function sendOne(query) {
        setStatus("loading");
        setErrorText("");
        const history = messages.concat([{ role: "user", content: query }]);
        fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history, currentQuery: query, toggles: { skipRecall: skipRecall } }),
        })
          .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, status: res.status, body: body }; }); })
          .then(function (pack) {
            if (!pack.ok) {
              setErrorText((pack.body && pack.body.explain) || ("HTTP " + pack.status));
              setStatus("error");
              return;
            }
            setMessages(history.concat([{ role: "assistant", content: pack.body.modelAnswer }]));
            setLastResult({
              query: query,
              recall: pack.body.recall,
              modelAnswer: pack.body.modelAnswer,
              finalMessages: pack.body.finalMessages.concat([{ role: "assistant", content: pack.body.modelAnswer }]),
              historySent: history,
              skipRecall: skipRecall,
            });
            setCurrentInput("");
            setStatus("ok");
          })
          .catch(function (err) { setErrorText(String(err)); setStatus("error"); });
      }

      function runSend() {
        const q = currentInput.trim();
        if (!q) return;
        sendOne(q);
      }

      function clickExample(ex) {
        setCurrentInput(ex);
      }

      // 4 步流水线渲染所需的输出段
      // 4 步流水线的输出渲染走 DemoUI 组件（fragments.js + renderers.js）

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              记忆分类（Memory Types）· 第四步（step-4）· 完整 4 步拼装
            </h1>
            <StatusPill status={status} />
          </header>
          <PageNav current="main" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro />
            <ProgramRulesPanel
              rules={programRules}
              onAddRule={addProgramRule}
              onRemoveRule={removeProgramRule}
              onClearUserMemory={clearUserMemory}
              busy={busy}
            />
            <MemoryWritePanel
              onSubmit={classifyAndWrite}
              onDeleteFact={deleteFact}
              lastResult={lastWrite}
              facts={facts}
              busy={busy}
            />
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <label className="block text-sm text-gray-700">
                当前 user 消息（输入框或点例句）
                <textarea
                  className="mt-1 w-full border rounded p-2 text-sm"
                  rows={2}
                  value={currentInput}
                  onChange={function (e) { setCurrentInput(e.target.value); }}
                  placeholder="输入一句话或点下方例句"
                />
              </label>
              <div className="flex flex-wrap gap-2">
                {EXAMPLES.map(function (ex) {
                  return (
                    <button key={ex} type="button"
                      className="border border-gray-300 text-xs px-2 py-1 rounded hover:bg-gray-100 disabled:opacity-50"
                      disabled={busy}
                      onClick={function () { clickExample(ex); }}>
                      例句：{ex}
                    </button>
                  );
                })}
              </div>
              <div className="border-t pt-3 flex flex-wrap gap-4 text-sm">
                <label className="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" checked={skipRecall}
                    onChange={function (e) { setSkipRecall(e.target.checked); }} className="w-4 h-4" />
                  <span>跳过整个召回（演示「不读记忆库」分支）</span>
                </label>
              </div>
              <div className="flex flex-wrap gap-2">
                <button type="button" className="bg-blue-600 text-white text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy || !currentInput.trim()} onClick={runSend}>
                  发一条（POST /api/chat）
                </button>
                <button type="button" className="border border-gray-400 text-gray-700 text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy || messages.length === 0} onClick={clearHistory}>
                  结束会话（清空 messages 历史）
                </button>
                <button type="button" className="border border-red-300 text-red-700 text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy} onClick={runForceError}>
                  演示后端 5xx
                </button>
              </div>
              <p className="text-xs text-gray-500">
                期望：例句 1 / 3 / 5 应该看到 ② 列显示「⏭ 跳过」；例句 2 / 4 / 6 应该跑嵌入余弦召回。
              </p>
            </section>
            <section id="output" className="bg-white shadow rounded p-4 space-y-3">
              <p className="text-sm font-semibold text-gray-800">
                流水线 4 步（自上而下 · 一次请求的完整拼装） ·{" "}
                {lastResult ? "基于最近一次发问「" + lastResult.query + "」" : "（还没发请求）"}
              </p>
              <p className="text-xs text-gray-600">
                数据从上往下流：当前 user → ①程序性 → ②召回 → ③工作记忆累积 → ④调模型 → 拿到回答。每一步展示「输入 / 做了什么 / 输出」。
              </p>
              <div className="space-y-3">
                <div className="border-2 border-gray-400 bg-white rounded p-3">
                  <p className="text-sm font-semibold text-gray-700 mb-2">0 · 当前 user 消息（流水线入口）</p>
                  {lastResult ? (
                    <p className="border border-blue-300 bg-blue-50 rounded p-2 text-sm whitespace-pre-wrap text-gray-800">「{lastResult.query}」</p>
                  ) : (
                    <p className="text-xs text-gray-500">（点上方例句按钮或「发一条」开始）</p>
                  )}
                </div>
                <PipelineStep
                  tone="border-yellow-300 bg-yellow-50"
                  icon="①"
                  title="程序性记忆（常驻不检索）"
                  inputText="（无 —— 直接从内存 Map 读）"
                  didText="listRules() → 读出全部程序性规则 → 拼成下面这段（固定部分，每次请求都带同样内容）"
                  output={<ProgramRuleList rules={programRules} />}
                />
                <PipelineStep
                  tone="border-blue-300 bg-blue-50"
                  icon="②"
                  title="语义 / 情景召回（嵌入 + 余弦 + Top-K）"
                  inputText={lastResult ? "当前 user「" + lastResult.query + "」 + facts.json（" + (lastResult.recall && lastResult.recall.pool ? lastResult.recall.pool.facts.length : "?") + " 条事实）" : "（还没发请求）"}
                  didText={lastResult && lastResult.recall && lastResult.recall.skipped ? "⏭ 跳过（前端勾了 skipRecall）—— 不调嵌入、不算余弦" : "embedBatch → cosine → pickTopK(3) → applyThreshold(0.10)"}
                  output={<RecallSystemFragment lastResult={lastResult} />}
                />
                <PipelineStep
                  tone="border-green-300 bg-green-50"
                  icon="③"
                  title="调对话模型（拼 messages → POST → 拿回答）"
                  inputText={lastResult ? "messages = ①+② 拼的 system 段 + ③ messages 历史" : "（还没发请求）"}
                  didText="llm.openai.chat.completions.create({ model, messages, temperature: 0 })"
                  output={<ModelCallOutput lastResult={lastResult} rules={programRules} />}
                />
                <PipelineStep
                  tone="border-purple-300 bg-purple-50"
                  icon="④"
                  title="工作记忆累积（messages 历史 + 当前 user）"
                  inputText={lastResult ? "累积的历史 messages + 当前 user「" + lastResult.query + "」" : "（还没发请求）"}
                  didText="messages 数组 = [system段（①+②+行为约定）, ...history, 当前 user]"
                  output={<HistoryOutput lastResult={lastResult} />}
                />
              </div>
              {errorText ? <p className="text-xs text-red-700">错误：{errorText}</p> : null}
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
