<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>写入策略 · 第四步</title>

  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入（禁止换 CDN / 版本 / integrity） -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <!-- §5.3.4 强制：React 18.3.1 UMD CDN -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- §5.3.4 强制：Babel Standalone 锁定 7.26.4（classic runtime） -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <!-- §5.3.4 加载顺序：components（babel src）→ 本页内联块 -->
  <script type="text/babel" src="/components/page-nav.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/filter-verdict.js"></script>
  <script type="text/babel" src="/components/model-trace.js"></script>
  <script type="text/babel" src="/components/output-renderers.js"></script>
  <script type="text/babel">
    // ── 解构 React 全局变量（UMD CDN 加载后 window.React / window.ReactDOM 存在） ──
    const { useState, useEffect } = React;
    const { PageNav, StatusPill, PageIntro, EnvFooter, DimsOutput, FilterOutput, ExtractOutput, HistoryList } = window.DemoUI || {};

    // 例句：寒暄 / 语义+情景各出 / 维度 A 全员规则 / 维度 B 本轮临时 / 维度 C 公开常识
    const EXAMPLES = [
      { label: "寒暄 · 期待 0 条候选", text: "你好" },
      {
        label: "语义 + 情景各出 · 期待多条候选",
        text: "我是深圳的，我们组用 Vue 3 加 TypeScript，我不喜欢太长的回答。今天下午我们还讨论了登录页要不要加验证码。",
      },
      {
        label: "维度 A · 全员规则（程序性记忆）",
        text: "以后我们组表单校验都用 zod。",
      },
      {
        label: "维度 B · 本轮临时状态",
        text: "今天有点累，先到这吧。",
      },
      {
        label: "维度 C · 公开常识（该走 RAG）",
        text: "北京是首都，Python 是 Guido 设计的。",
      },
    ];

    function App() {
      const [status, setStatus] = useState("idle");
      const [env, setEnv] = useState(null);
      const [text, setText] = useState(EXAMPLES[4].text);
      const [threshold, setThreshold] = useState(0.5);
      const [enableA, setEnableA] = useState(true);
      const [enableB, setEnableB] = useState(true);
      const [enableC, setEnableC] = useState(true);
      const [dimsResult, setDimsResult] = useState(null);
      const [filterResult, setFilterResult] = useState(null);
      const [extractResult, setExtractResult] = useState(null);
      const [errorText, setErrorText] = useState("");
      const [mode, setMode] = useState("dims");
      const [history, setHistory] = useState([]);

      useEffect(function () {
        fetch("/health")
          .then(function (res) { return res.json(); })
          .then(function (data) { setEnv(data); })
          .catch(function () { setEnv(null); });
      }, []);

      const hasKey = Boolean(env && env.hasKey);
      const busy = status === "loading";

      function runDimensions() {
        setStatus("loading");
        setErrorText("");
        setMode("dims");
        fetch("/api/filter-dimensions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text, threshold: threshold, enableA: enableA, enableB: enableB, enableC: enableC }),
        })
          .then(function (res) {
            return res.json().then(function (body) {
              return { ok: res.ok, status: res.status, body: body };
            });
          })
          .then(function (pack) {
            if (!pack.ok) {
              setStatus("error");
              setErrorText((pack.body && pack.body.explain) || ("HTTP " + pack.status));
              return;
            }
            setDimsResult(pack.body);
            setHistory(function (prev) { return [pack.body].concat(prev); });
            setStatus("ok");
          })
          .catch(function (err) {
            setStatus("error");
            setErrorText(String(err));
          });
      }

      function runFilterOnly() {
        setStatus("loading");
        setErrorText("");
        setMode("filter");
        fetch("/api/filter", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text, threshold: threshold }),
        })
          .then(function (res) {
            return res.json().then(function (body) {
              return { ok: res.ok, status: res.status, body: body };
            });
          })
          .then(function (pack) {
            if (!pack.ok) {
              setStatus("error");
              setErrorText((pack.body && pack.body.explain) || ("HTTP " + pack.status));
              return;
            }
            setFilterResult(pack.body);
            setStatus("ok");
          })
          .catch(function (err) {
            setStatus("error");
            setErrorText(String(err));
          });
      }

      function runExtractOnly() {
        setStatus("loading");
        setErrorText("");
        setMode("extract");
        fetch("/api/extract", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text }),
        })
          .then(function (res) {
            return res.json().then(function (body) {
              return { ok: res.ok, status: res.status, body: body };
            });
          })
          .then(function (pack) {
            if (!pack.ok) {
              setStatus("error");
              setErrorText((pack.body && pack.body.explain) || ("HTTP " + pack.status));
              return;
            }
            setExtractResult(pack.body);
            setStatus("ok");
          })
          .catch(function (err) {
            setStatus("error");
            setErrorText(String(err));
          });
      }

      function runForceError() {
        setStatus("loading");
        setErrorText("");
        fetch("/api/force-error", { method: "POST" })
          .then(function (res) {
            return res.json().then(function (body) { return { status: res.status, body: body }; });
          })
          .then(function (pack) {
            setStatus("error");
            setErrorText((pack.body && pack.body.explain) || ("HTTP " + pack.status));
          })
          .catch(function (err) {
            setStatus("error");
            setErrorText(String(err));
          });
      }

      function fmtThreshold(t) { return t.toFixed(2); }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              写入策略（Write Policy） · 第四步（step-4） · 把关（Filtering）：内容维度 C「值不值得占存储」一道闸门
            </h1>
            <StatusPill status={status} />
          </header>
          <PageNav current="main" base="" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro />
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <label className="block text-sm text-gray-700">
                一段对话原文（text）
                <textarea
                  className="mt-1 w-full border rounded p-2 text-sm"
                  rows={3}
                  value={text}
                  onChange={function (event) { setText(event.target.value); }}
                />
              </label>
              <div className="flex flex-wrap gap-2">
                {EXAMPLES.map(function (ex) {
                  return (
                    <button
                      key={ex.label}
                      type="button"
                      className="border border-gray-300 text-xs px-2 py-1 rounded hover:bg-gray-100"
                      onClick={function () { setText(ex.text); }}
                    >
                      例句：{ex.label}
                    </button>
                  );
                })}
              </div>
              <p className="text-xs text-gray-500">
                五个例句：第一个期待抽出 0 条候选（正常结果）；第二个期待同时抽出语义记忆和情景记忆；第三个专门给维度 A 用（zod 全员规则）；第四个专门给维度 B 用（今天累本轮临时）；第五个专门给维度 C 用（北京是首都公开常识）。
              </p>
              <div className="grid grid-cols-1 md:grid-cols-4 gap-3">
                <label className="block text-sm text-gray-700">
                  <span>
                    置信度阈值（threshold · 0.0~1.0，步长 0.05）：<b>{fmtThreshold(threshold)}</b>
                  </span>
                  <input
                    type="range"
                    min={0}
                    max={1}
                    step={0.05}
                    value={threshold}
                    onChange={function (event) { setThreshold(Number(event.target.value)); }}
                    className="mt-1 w-full"
                  />
                </label>
                <label className="flex items-center gap-2 text-sm text-gray-700">
                  <input
                    type="checkbox"
                    checked={enableA}
                    onChange={function (event) { setEnableA(event.target.checked); }}
                  />
                  <span>
                    维度 A 开关（是不是事实）
                    <br />
                    <span className="text-xs text-gray-500">关闭 → 维度 A 视为全过</span>
                  </span>
                </label>
                <label className="flex items-center gap-2 text-sm text-gray-700">
                  <input
                    type="checkbox"
                    checked={enableB}
                    onChange={function (event) { setEnableB(event.target.checked); }}
                  />
                  <span>
                    维度 B 开关（跨会话还有用吗）
                    <br />
                    <span className="text-xs text-gray-500">关闭 → 维度 B 视为全过</span>
                  </span>
                </label>
                <label className="flex items-center gap-2 text-sm text-gray-700">
                  <input
                    type="checkbox"
                    checked={enableC}
                    onChange={function (event) { setEnableC(event.target.checked); }}
                  />
                  <span>
                    维度 C 开关（值不值得占存储）
                    <br />
                    <span className="text-xs text-gray-500">关闭 → 维度 C 视为全过</span>
                  </span>
                </label>
              </div>
              <p className="text-xs text-gray-500">
                阈值滑块 + 三个维度开关：调任意一项，下面四道闸门的判定都会变化。把第五个例句（北京是首都）跑一遍，关闭维度 C 会看见它被放行；把第三个例句（zod）跑一遍，关闭维度 A 会看见它被放行；把第四个例句（累）跑一遍，关闭维度 B 会看见它被放行。
              </p>
              <div className="flex flex-wrap gap-2">
                <button
                  type="button"
                  className="bg-blue-600 text-white text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy || !hasKey || !text.trim()}
                  onClick={runDimensions}
                >
                  提取并把关（四道闸门 · /api/filter-dimensions）
                </button>
                <button
                  type="button"
                  className="border border-gray-300 text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy || !hasKey || !text.trim()}
                  onClick={runFilterOnly}
                >
                  只把关（置信度对照 · 跳过维度 · /api/filter）
                </button>
                <button
                  type="button"
                  className="border border-gray-300 text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy || !hasKey || !text.trim()}
                  onClick={runExtractOnly}
                >
                  只提取（对照 · 跳过所有把关 · /api/extract）
                </button>
                <button
                  type="button"
                  className="border border-gray-300 text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={runForceError}
                >
                  演示后端 5xx（另一条失败通道 · /api/force-error）
                </button>
              </div>
              <p className="text-xs text-gray-500">
                「提取并把关」走完整四道闸门；「只把关（置信度对照）」调 step-2 的 /api/filter，跳过维度判定；「只提取（对照）」调 step-1 的 /api/extract，跳过所有把关。三个按钮各自独立请求，对照能看见每多加一道闸门切掉了什么。
              </p>
            </section>
            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {errorText ? (
                <div className="border border-red-300 bg-red-50 rounded p-3 text-sm text-red-800">{errorText}</div>
              ) : null}
              <div className="bg-gray-50 text-gray-700 rounded p-3 text-xs space-y-1">
                <p className="font-medium">请求参数</p>
                <p>对话原文（text）：{text || "（空）"}</p>
                <p>阈值（threshold）：{fmtThreshold(threshold)}</p>
                <p>维度 A 开关：{enableA ? "开" : "关"}　·　维度 B 开关：{enableB ? "开" : "关"}　·　维度 C 开关：{enableC ? "开" : "关"}</p>
                <p>当前接口：{mode === "extract" ? "POST /api/extract（只提取）" : mode === "filter" ? "POST /api/filter（只把关置信度）" : "POST /api/filter-dimensions（四道闸门）"}</p>
              </div>
              <div className="border border-gray-300 bg-white rounded p-3 text-xs space-y-2">
                <p className="font-medium">调用流程</p>
                <ol className="list-decimal pl-5 space-y-1 text-gray-700">
                  <li>第一步 · 服务端拼 messages + 调协议 A 对话补全（JSON Mode）→ extractFacts 拿到 0~N 条候选</li>
                  <li>第二步 · filterByConfidence 按 confidence ≥ threshold 过滤，达不到的标 BELOW_THRESHOLD</li>
                  <li>第三步 · filterByContentDimensions 让模型给过置信度的候选判维度 A（isFact）+ B（isCrossSession）+ C（isStorageWorth），任一不过标 PROGRAMMATIC_RULE / SESSION_ONLY / PUBLIC_KNOWLEDGE</li>
                  <li>页面把每条候选按它被哪一道闸门拦下分五栏：绿 = 通过、黄 = 置信度拦下、橙 = 维度 A 拦下、红 = 维度 B 拦下、紫 = 维度 C 拦下</li>
                </ol>
              </div>

              {mode === "dims" && dimsResult ? <DimsOutput result={dimsResult} /> : null}
              {mode === "filter" && filterResult ? <FilterOutput result={filterResult} /> : null}
              {mode === "extract" && extractResult ? <ExtractOutput result={extractResult} /> : null}

              {!dimsResult && !filterResult && !extractResult && !errorText ? (
                <p className="text-sm text-gray-500">
                  还没有结果。点「提取并把关」按当前阈值 + 维度开关走四道闸门；调开关再点一次，看同一条候选被哪一道闸门拦下；点「只把关」/「只提取」作对照基线。
                </p>
              ) : null}

              <HistoryList items={history} />
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
