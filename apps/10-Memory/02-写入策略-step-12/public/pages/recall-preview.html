<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跨会话验证 + 记忆调取预览 · 第十二步 · 变体 7-E</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel" src="../components/layout.js"></script>
  <script type="text/babel" src="../components/page-nav.js"></script>
  <script type="text/babel" src="../components/compress-shared.js"></script>
  <script type="text/babel" src="../components/compress-capacity.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { StatusPill, EnvFooter, PageNav, LibraryPanel, RecallPreviewPanel } = window.DemoUI || {};

    function App() {
      const [env, setEnv] = useState(null);
      const [library, setLibrary] = useState([]);
      const [previewResult, setPreviewResult] = useState(null);
      const [busy, setBusy] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");

      function setPill(status) {
        const el = document.getElementById("status-pill");
        if (!el) return;
        const map = { idle: "⏸ 待连接", running: "🔄 请求中", done: "✅ 完成", error: "❌ 错误" };
        el.textContent = map[status] || map.idle;
      }

      async function callApi(path, options, label) {
        setBusy(true); setErrorMsg(""); setPill("running");
        try {
          const res = await fetch(path, options);
          const data = await res.json().catch(function () { return {}; });
          if (!res.ok) {
            setErrorMsg((data && data.explain) || ("HTTP " + res.status));
            setPill("error");
            return null;
          }
          setPill("done");
          return data;
        } catch (err) {
          setErrorMsg(label + " 失败：" + String(err));
          setPill("error");
          return null;
        } finally {
          setBusy(false);
        }
      }

      async function refreshLibrary() {
        const libRes = await fetch("/api/library?userId=default");
        const libData = await libRes.json().catch(function () { return []; });
        setLibrary(Array.isArray(libData) ? libData : []);
      }

      async function step1Seed() {
        await callApi("/api/seed", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({}) }, "seed");
        await refreshLibrary();
      }

      async function step2RecallPreview() {
        const r = await callApi("/api/recall-preview", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({}),
        }, "recall-preview");
        if (r) {
          setPreviewResult(r);
        }
      }

      useEffect(function () {
        fetch("/health").then(function (r) { return r.json(); }).then(function (data) { setEnv(data); }).catch(function () {});
        refreshLibrary();
      }, []);

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              跨会话验证 + 记忆调取预览 — 第 7 关变体 7-E
            </h1>
            <StatusPill status="idle" />
          </header>
          <PageNav current="recall-preview" base="../" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="page-intro" className="bg-white shadow rounded p-4 space-y-3">
              <p className="text-sm text-gray-700">
                这个页面演示：<b>笔记 §0 验收第 7 条「跨会话验证：新开会话时 Agent 记得我的偏好」</b>——满足笔记 §7 设计原则 + 演示 SQLite 持久化（库里的画像 + 对话原文 + 对话摘要真实存在，重启服务后仍在）。前面三个 sub-page（整段摘要 / 多条画像 / 自动合并）都是「写入侧」，本步演示<b>「召回侧」</b>——把库里已有的素材拼成 prompt，调大模型生成基于记忆的开场白。
              </p>
              <div className="text-xs text-gray-600">
                <div className="font-semibold text-gray-700 mb-2">按顺序点 2 个按钮跑一遍：</div>
                <ol className="list-decimal pl-5 space-y-1">
                  <li><b>点「灌入示例」</b>——库里写 5 条零碎事实 + 1 段对话原文（chat_session_v1）+ （若已跑过自动合并）user_profile_auto</li>
                  <li><b>点「调取预览」</b>——服务端（POST /api/recall-preview）拉库里的素材 → 拼成 messages → 调大模型 → 返完整素材 + modelRequest + modelResponse + 大模型生成的开场白</li>
                </ol>
                <p className="text-gray-500 mt-2">提示：本页只演示「召回 + 拼 prompt + 大模型说话」。素材不全时（warnings）会提示先到对应 sub-page 跑一次（如先在 compress-session 跑一次拿到 chat_session_v1.summary；先在 auto-merge 跑一次拿到 user_profile_auto）。</p>
              </div>
              <div id="core-takeaway" className="bg-yellow-50 border border-yellow-300 rounded p-3 space-y-1 mt-2">
                <div className="text-xs font-semibold text-yellow-900">本页核心教学点</div>
                <ul className="text-xs text-gray-800 list-disc pl-5 space-y-1">
                  <li><b>记忆召回链路可见</b>：页面亮出「实际拼进 prompt 的素材」是哪几层（综合层画像 / 对话原文 / 对话摘要）——学习者看一眼就知道 Agent 召回时拿到了什么。</li>
                  <li><b>SQLite 持久化</b>：库的素材写在 <code>apps/10-Memory/02-写入策略-step-12/data/facts.db</code>；服务关掉再起，user_profile_auto / chat_session_v1 还在——这就是「新开会话 Agent 记得我的偏好」的工程基础。</li>
                  <li><b>大模型基于记忆说话</b>：调大模型时只传从库里读到的素材（system + user）；大模型返一段开场白——证明「记忆真的进了 prompt + 大模型真的基于它说话」。</li>
                  <li><b>三种召回粒度</b>：综合层（画像，一次拿全）/ 对话原文（事实层细节）/ 对话摘要（事实层 + 压缩）——按场景选合适的层（笔记 §7 「事实 vs 综合」分工）。</li>
                </ul>
              </div>
            </section>

            <section id="controls" className="bg-white shadow rounded p-4 space-y-4">
              <h2 className="text-sm font-semibold text-gray-800">按顺序点下面的按钮</h2>

              <div className="border-l-4 border-blue-400 pl-3 space-y-2">
                <div className="text-sm font-semibold text-gray-800">第 1 步：灌入示例</div>
                <div className="text-xs text-gray-600">库里先写 5 条零碎事实 + 1 段对话原文（chat_session_v1）。如果之前跑过 auto-merge，user_profile_auto 仍在；跑过 compress-session，chat_session_v1.summary 仍在。</div>
                <button onClick={step1Seed} disabled={busy} className="bg-blue-600 text-white text-sm px-3 py-1 rounded disabled:opacity-50">灌入示例</button>
              </div>

              <div className="border-l-4 border-purple-400 pl-3 space-y-2">
                <div className="text-sm font-semibold text-gray-800">第 2 步：调取预览（POST /api/recall-preview）</div>
                <div className="text-xs text-gray-600">服务端拉 user_profile_auto 的 summary + chat_session_v1 的 value + summary，拼成 messages，调大模型生成「基于记忆跟你说话的第一句」。</div>
                <button onClick={step2RecallPreview} disabled={busy} className="bg-purple-600 text-white text-sm px-3 py-1 rounded disabled:opacity-50">调取预览</button>
              </div>

              {errorMsg ? <div className="text-xs text-red-700">{errorMsg}</div> : null}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              <h2 className="text-sm font-semibold text-gray-800">结果</h2>
              {previewResult ? <RecallPreviewPanel result={previewResult} /> : null}
              {library.length > 0 ? (
                <details className="text-xs">
                  <summary className="cursor-pointer text-sm font-semibold text-gray-800">📚 库里现在有什么（点展开看每条事实的完整字段 + summary 压缩）</summary>
                  <div className="mt-2 pl-3 border-l-2 border-gray-300">
                    <LibraryPanel library={library} />
                  </div>
                </details>
              ) : null}
            </section>
          </main>
          <footer id="page-footer" className="border-t p-2 text-xs text-gray-500 text-center">
            <EnvFooter env={env} port={50115} />
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
