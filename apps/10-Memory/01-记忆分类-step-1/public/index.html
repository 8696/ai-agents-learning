<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>记忆分类 · 第一步</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>
  <script type="text/babel" src="/components/page-nav.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/memory-boxes.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { PageNav, StatusPill, PageIntro, EnvFooter, MemoryBoxes, ClassifyHistory } = window.DemoUI || {};

    // 四个例句，各自应该落进不同的盒子（对应小节文档「需求 5」）
    const EXAMPLES = [
      "帮我写个表单",
      "我们组用 Vue 3",
      "今天有点累先到这",
      "以后表单校验都用 zod",
    ];

    function App() {
      const [status, setStatus] = useState("idle");
      const [env, setEnv] = useState(null);
      const [sentence, setSentence] = useState(EXAMPLES[1]);
      const [errorText, setErrorText] = useState("");
      const [result, setResult] = useState(null);
      const [history, setHistory] = useState([]);

      useEffect(function () {
        fetch("/health")
          .then(function (res) { return res.json(); })
          .then(function (data) { setEnv(data); })
          .catch(function () { setEnv(null); });
      }, []);

      const hasKey = Boolean(env && env.hasKey);
      const busy = status === "loading";

      function runClassify() {
        setStatus("loading");
        setErrorText("");
        fetch("/api/classify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sentence: sentence }),
        })
          .then(function (res) {
            return res.json().then(function (body) {
              return { ok: res.ok, status: res.status, body: body };
            });
          })
          .then(function (pack) {
            if (!pack.ok) {
              setStatus("error");
              setErrorText((pack.body && pack.body.explain) || ("HTTP " + pack.status));
              return;
            }
            setResult(pack.body);
            setHistory(function (prev) { return [pack.body].concat(prev); });
            setStatus("ok");
          })
          .catch(function (err) {
            setStatus("error");
            setErrorText(String(err));
          });
      }

      function runForceError() {
        setStatus("loading");
        setErrorText("");
        fetch("/api/force-error", { method: "POST" })
          .then(function (res) {
            return res.json().then(function (body) { return { status: res.status, body: body }; });
          })
          .then(function (pack) {
            setStatus("error");
            setErrorText((pack.body && pack.body.explain) || ("HTTP " + pack.status));
          })
          .catch(function (err) {
            setStatus("error");
            setErrorText(String(err));
          });
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">
              记忆分类（Memory Types） · 第一步（step-1） · 调模型判一句话落进四类记忆的哪一类、短期还是长期
            </h1>
            <StatusPill status={status} />
          </header>
          <PageNav current="main" base="" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro />
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <label className="block text-sm text-gray-700">
                一句用户原话（sentence）
                <textarea
                  className="mt-1 w-full border rounded p-2 text-sm"
                  rows={2}
                  value={sentence}
                  onChange={function (event) { setSentence(event.target.value); }}
                />
              </label>
              <div className="flex flex-wrap gap-2">
                {EXAMPLES.map(function (ex) {
                  return (
                    <button
                      key={ex}
                      type="button"
                      className="border border-gray-300 text-xs px-2 py-1 rounded hover:bg-gray-100"
                      onClick={function () { setSentence(ex); }}
                    >
                      例句：{ex}
                    </button>
                  );
                })}
              </div>
              <p className="text-xs text-gray-500">
                四个例句期望分别落进四个不同的盒子：工作记忆 / 语义记忆 / 短期一次性状态 / 程序性记忆。点一个例句再点「归类这句话」，对照下面命中的盒子对不对。
              </p>
              <div className="flex flex-wrap gap-2">
                <button
                  type="button"
                  className="bg-blue-600 text-white text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy || !hasKey || !sentence.trim()}
                  onClick={runClassify}
                >
                  归类这句话（调模型判类 · /api/classify）
                </button>
                <button
                  type="button"
                  className="border border-gray-300 text-sm px-3 py-2 rounded disabled:opacity-50"
                  disabled={busy}
                  onClick={runForceError}
                >
                  演示后端 5xx（另一条失败通道 · /api/force-error）
                </button>
              </div>
              <p className="text-xs text-gray-500">
                空句子会让按钮变灰（前端拦一层）；服务端还会再校验一次，返回 4xx。「演示后端 5xx」走的是完全不同的失败通道，跟句子内容无关。
              </p>
            </section>
            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              {errorText ? (
                <div className="border border-red-300 bg-red-50 rounded p-3 text-sm text-red-800">{errorText}</div>
              ) : null}
              <div className="bg-gray-50 text-gray-700 rounded p-3 text-xs space-y-1">
                <p className="font-medium">请求参数</p>
                <p>用户原话（sentence）：{sentence || "（空）"}</p>
                <p>接口：POST /api/classify</p>
              </div>
              <div className="border border-gray-300 bg-white rounded p-3 text-xs space-y-2">
                <p className="font-medium">调用流程</p>
                <ol className="list-decimal pl-5 space-y-1 text-gray-700">
                  <li>服务端把系统提示词（四类定义 + 短期/长期判定口径）和这句话拼成两条消息</li>
                  <li>用协议 A（OpenAI Chat Completions）+ JSON Mode 调一次对话补全，让模型只输出 JSON</li>
                  <li>解析 <code>choices[0].message.content</code>，校验字段（memoryType / term / reason）</li>
                  <li>把完整请求、完整响应和判类结果一起交回页面</li>
                </ol>
              </div>
              <p className="text-sm font-semibold text-gray-800">四类记忆 · 这句话掉进哪个盒子</p>
              <MemoryBoxes activeType={result ? result.classification.memoryType : null} />
              {result ? (
                <div className="space-y-3">
                  <div className="bg-green-50 border border-green-300 rounded p-3 space-y-1">
                    <p className="text-sm font-semibold">判类结果</p>
                    <p className="text-sm">
                      归入：<span className="font-semibold">{result.classification.memoryType}</span>
                      　·　存储期限：
                      <span className="font-semibold">{result.classification.term}</span>
                    </p>
                    <p className="text-xs text-gray-700">理由：{result.classification.reason}</p>
                    <p className="text-xs text-gray-500">这次调用耗时：{result.durationMs} ms</p>
                  </div>
                  <div className="border border-blue-300 bg-blue-50 rounded p-3 space-y-1">
                    <p className="text-sm font-semibold text-blue-900">调大模型 · 请求参数（原始 request）</p>
                    <pre className="text-xs whitespace-pre-wrap max-h-48 overflow-auto bg-white rounded p-2">
                      {JSON.stringify(result.modelRequest, null, 2)}
                    </pre>
                  </div>
                  <div className="border border-indigo-300 bg-indigo-50 rounded p-3 space-y-1">
                    <p className="text-sm font-semibold text-indigo-900">调大模型 · 响应结果（原始 response）</p>
                    <pre className="text-xs whitespace-pre-wrap max-h-48 overflow-auto bg-white rounded p-2">
                      {JSON.stringify(result.modelResponse, null, 2)}
                    </pre>
                  </div>
                </div>
              ) : (
                <p className="text-sm text-gray-500">还没有判类结果。点「归类这句话」之后，上面盒子会高亮命中的那一类，下面会贴出完整的请求和响应。</p>
              )}
              <div className="border-t pt-3">
                <p className="text-sm font-semibold text-gray-800 mb-2">历史判类结果</p>
                <ClassifyHistory items={history} />
              </div>
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
