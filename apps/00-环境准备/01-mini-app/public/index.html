<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>01 ChatGPT Mini · SSE Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function StatusPill({ status }) {
      const map = {
        idle: { emoji: "⏸", text: "待连接", cls: "bg-gray-200" },
        loading: { emoji: "🔄", text: "请求中", cls: "bg-blue-100" },
        ok: { emoji: "✅", text: "完成", cls: "bg-green-100" },
        error: { emoji: "❌", text: "错误", cls: "bg-red-100" },
      };
      const s = map[status] || map.idle;
      return (
        <span id="status-pill" className={`text-xs px-2 py-1 rounded ${s.cls}`}>
          {s.emoji} {s.text}
        </span>
      );
    }

    function App() {
      const [status, setStatus] = useState("idle");
      const [message, setMessage] = useState("用一句话介绍你自己。");
      const [output, setOutput] = useState("");
      const [meta, setMeta] = useState("");
      const [error, setError] = useState("");
      const [busy, setBusy] = useState(false);

      useEffect(() => {
        fetch("/health")
          .then((r) => {
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            return r.json();
          })
          .then(() => setStatus("idle"))
          .catch((e) => {
            setStatus("error");
            setError(e instanceof Error ? e.message : String(e));
          });
      }, []);

      const send = async () => {
        const text = message.trim();
        if (!text || busy) return;
        setBusy(true);
        setStatus("loading");
        setError("");
        setOutput("");
        setMeta("");

        let buffer = "";
        let content = "";
        let usage = null;
        let frameCount = 0;

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text }),
          });
          if (!res.ok || !res.body) {
            const t = await res.text();
            throw new Error(t || `HTTP ${res.status}`);
          }
          const reader = res.body.getReader();
          const decoder = new TextDecoder();

          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            let idx;
            while ((idx = buffer.indexOf("\n\n")) >= 0) {
              const frame = buffer.slice(0, idx);
              buffer = buffer.slice(idx + 2);
              const dataLine = frame.split("\n").find((l) => l.startsWith("data:"));
              if (!dataLine) continue;
              const payload = dataLine.slice(5).trim();
              if (payload === "[DONE]") continue;
              let obj;
              try {
                obj = JSON.parse(payload);
              } catch {
                continue;
              }
              if (obj.error) throw new Error(obj.error);
              frameCount += 1;
              const delta = obj.choices?.[0]?.delta?.content;
              if (delta) {
                content += delta;
                setOutput(content);
              }
              if (obj.usage) usage = obj.usage;
            }
          }

          if (usage) {
            setMeta(
              `token: prompt=${usage.prompt_tokens} completion=${usage.completion_tokens} total=${usage.total_tokens} · 帧数=${frameCount}`,
            );
          } else {
            setMeta(`帧数=${frameCount}（无 usage，去 MiniMax 控制台查）`);
          }
          setStatus("ok");
        } catch (e) {
          const msg = e instanceof Error ? e.message : String(e);
          setError(msg);
          setStatus("error");
        } finally {
          setBusy(false);
        }
      };

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header
            id="page-header"
            className="border-b p-4 flex items-center justify-between bg-white"
          >
            <h1 id="page-title" className="text-xl font-semibold">
              ChatGPT Mini · SSE Chat
            </h1>
            <StatusPill status={status} />
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <p className="text-sm text-gray-500">
                POST <code>/api/chat</code> · 协议 A 流式。取消 / 限流 / 协议对照在模块 02 对应小节，不塞进本入口。
              </p>
              <div className="flex gap-2">
                <input
                  value={message}
                  onChange={(e) => setMessage(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") send();
                  }}
                  className="flex-1 border rounded p-2 text-sm"
                  placeholder="输入消息，回车或点发送"
                />
                <button
                  onClick={send}
                  disabled={busy}
                  className="px-4 py-2 rounded bg-indigo-600 text-white text-sm disabled:opacity-50"
                >
                  {busy ? "发送中…" : "发送"}
                </button>
              </div>
              {error ? (
                <div className="text-sm text-red-600 bg-red-50 p-2 rounded">⚠️ {error}</div>
              ) : null}
            </section>

            <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] space-y-2">
              <pre className="whitespace-pre-wrap break-words text-sm min-h-[140px]">
                {output || "（回复会出现在这里）"}
              </pre>
              <div className="text-xs text-gray-500">{meta}</div>
            </section>
          </main>

          <footer
            id="page-footer"
            className="border-t p-2 text-xs text-gray-500 text-center"
          >
            端口 50000 · 协议 A · 模型 MiniMax-M3
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
