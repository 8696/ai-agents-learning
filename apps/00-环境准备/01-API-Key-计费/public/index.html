<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Key / 计费 · Demo</title>
  <!-- §5.0 强制：Tailwind 4 browser CDN 原样引入 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <!-- §5.3.4 强制：React 18.3.1 UMD CDN（普通 script，不用 module 也不用 importmap） -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone：在浏览器运行时转译 JSX（§5.3.4 强制）。
     注：必须锁定 7.x；8.x 默认 preset-react 是 automatic runtime（输出 import { jsx } from "react/jsx-runtime"），
     与本规则"完全 ESM 禁用"冲突。7.x 默认是 classic runtime（输出 React.createElement）。 -->
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <!-- type="text/babel"：告知 Babel Standalone 在运行时转译此脚本块，
       将 JSX 语法（如 <App />）转换为 React.createElement() 调用。
       注：Babel Standalone 默认 preset-react 用 classic runtime（输出 React.createElement），
       不用 data-presets / data-plugins 显式指定即可。 -->
  <script type="text/babel">
    // ── 解构 React / ReactDOM 全局变量（UMD CDN 加载后 window.React / window.ReactDOM 存在） ──
    const { useState, useEffect } = React;

    // ── StatusPill：渲染顶部状态徽章（四态） ──
    function StatusPill({ status, model }) {
      const map = {
        idle:    { emoji: "⏸", text: "待连接",       cls: "bg-gray-200" },
        loading: { emoji: "🔄", text: "请求中…",      cls: "bg-blue-100" },
        ok:      { emoji: "✅", text: "完成",          cls: "bg-green-100" },
        error:   { emoji: "❌", text: "错误",          cls: "bg-red-100" },
      };
      const s = map[status];
      const label = status === "idle" && model ? `待连接 · ${model}` : s.text;
      return (
        <span id="status-pill" className={`text-xs px-2 py-1 rounded ${s.cls}`}>
          {s.emoji} {label}
        </span>
      );
    }

    // ── Result：渲染 usage 三行 + 回复文本 ──
    function Result({ data }) {
      const u = data.usage;
      return (
        <div className="space-y-2">
          <div className="text-xs text-gray-500">
            {data.model} · 耗时 {data.durationMs} ms
          </div>
          <div className="space-y-1">
            <div>
              输入 <code className="text-blue-700 font-semibold">prompt_tokens</code> ={" "}
              <b>{u.prompt_tokens}</b>　<span className="text-xs text-gray-500">← 按输入单价计费</span>
            </div>
            <div>
              输出 <code className="text-amber-700 font-semibold">completion_tokens</code> ={" "}
              <b>{u.completion_tokens}</b>　<span className="text-xs text-gray-500">← 按输出单价计费（通常更贵）</span>
            </div>
            <div>
              合计 <code className="text-green-700 font-semibold">total_tokens</code> ={" "}
              <b>{u.total_tokens}</b>
            </div>
          </div>
          <div className="border-t pt-2">
            <div className="text-xs text-gray-500 mb-1">回复</div>
            <pre className="bg-gray-50 p-2 rounded whitespace-pre-wrap break-words text-sm">
              {data.reply || "(空)"}
            </pre>
          </div>
        </div>
      );
    }

    // ── 主组件 App ──
    function App() {
      const [status, setStatus] = useState("idle");
      const [model, setModel] = useState("MiniMax-M3");
      const [prompt, setPrompt] = useState("只回复一个字：好");
      const [result, setResult] = useState(null);
      const [errorMsg, setErrorMsg] = useState("");

      // 启动时 ping /health
      useEffect(() => {
        fetch("/health")
          .then((r) => r.json())
          .then((d) => {
            setModel(d.model);
            setStatus("idle");
          })
          .catch(() => {
            setStatus("error");
            setErrorMsg("连不上后端 /health");
          });
      }, []);

      const send = async () => {
        const p = prompt.trim();
        if (!p) {
          setStatus("error");
          setErrorMsg("请输入 prompt");
          return;
        }
        setStatus("loading");
        setErrorMsg("");
        try {
          const r = await fetch("/api/billing", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: p }),
          });
          const data = await r.json();
          if (!r.ok) {
            setStatus("error");
            setErrorMsg(data.error || `HTTP ${r.status}`);
            return;
          }
          setResult(data);
          setStatus("ok");
        } catch (e) {
          setStatus("error");
          setErrorMsg(String(e));
        }
      };

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header
            id="page-header"
            className="border-b p-4 flex items-center justify-between bg-white"
          >
            <h1 id="page-title" className="text-xl font-semibold">
              API Key / 计费 · Demo
            </h1>
            <StatusPill status={status} model={model} />
          </header>

          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <section
              id="controls"
              className="bg-white shadow rounded p-4 space-y-2"
            >
              <label htmlFor="prompt-input" className="block text-sm font-medium">
                Prompt
              </label>
              <textarea
                id="prompt-input"
                rows={2}
                value={prompt}
                onChange={(e) => setPrompt(e.target.value)}
                className="w-full border rounded p-2 text-sm font-mono"
                placeholder="输入要发给 LLM 的 prompt…"
              />
              <div className="flex items-center gap-3">
                <button
                  onClick={send}
                  disabled={status === "loading"}
                  className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded disabled:opacity-50"
                >
                  {status === "loading" ? "发送中…" : "发送并计费"}
                </button>
                <span className="text-xs text-gray-500">
                  每次发送会真调一次 MiniMax-M3，账单调 1 次
                </span>
              </div>
            </section>

            <section
              id="output"
              className="bg-white shadow rounded p-4 min-h-[200px]"
            >
              {errorMsg ? (
                <div className="text-red-600 text-sm">⚠️ {errorMsg}</div>
              ) : result ? (
                <Result data={result} />
              ) : (
                <div className="text-sm text-gray-500">
                  输入 prompt 后点「发送并计费」，这里会显示 usage 三行 + 回复文本。
                </div>
              )}
            </section>

            <section className="text-xs text-gray-500 space-y-1">
              <p><b>对照要点</b>：</p>
              <ul className="list-disc pl-5 space-y-1">
                <li><code className="text-blue-700">prompt_tokens</code> 按输入单价计费</li>
                <li><code className="text-amber-700">completion_tokens</code> 按输出单价计费（通常更贵，3~5 倍）</li>
                <li><code className="text-green-700">total_tokens</code> = 两者之和</li>
                <li>订阅网页能聊 ≠ 按量 API Key；账单仍去 MiniMax 控制台看</li>
              </ul>
            </section>
          </main>

          <footer
            id="page-footer"
            className="border-t p-2 text-xs text-gray-500 text-center"
          >
            端口 50001 · 协议 A · 模型 MiniMax-M3
          </footer>
        </div>
      );
    }

    // ── 入口：UMD 全局 ReactDOM ──
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
