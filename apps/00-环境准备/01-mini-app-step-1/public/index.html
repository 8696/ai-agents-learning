<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模块 00 · mini-app 总览</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>

  <script type="text/babel">
    /**
     * 本页教学点：模块 00 这一条 HTTP 流怎么走。
     * 本页不调模型；对话和原始帧在 /pages/*。
     */
    const { useState } = React;

    const SCENES = [
      {
        href: "/pages/chat.html",
        title: "流式对话",
        desc: "POST /api/chat → SSE 逐帧上屏。看的是「用户最终看到的那句话」怎么一点一点长出来。",
      },
      {
        href: "/pages/frames.html",
        title: "原始帧",
        desc: "同一条流，但每一帧一张卡片。看的是协议字段：delta / finish_reason / usage / [DONE]。",
      },
    ];

    const INTRO_STEPS = [
      "页面加载 → GET /health：读出当前 provider / model / 有没有 Key（不调模型、不花钱）",
      "点「流式对话」→ 浏览器 POST /api/chat，服务端把上游 chunk 原样转成 SSE 帧",
      "点「原始帧」→ 还是同一条接口，只是把每一帧摊开，而不是拼成一段文字",
    ];

    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo } = window.DemoUI;

        function App() {
          const { env, envError } = useEnvInfo();
          const [status, setStatus] = useState("idle");

          React.useEffect(function () {
            if (envError) setStatus("error");
            else if (env.port) setStatus("ok");
          }, [env, envError]);

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">模块 00 · mini-app</h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                <PageIntro
                  summary="模块 00 的代码落点：一个 HTTP 进程。只跑协议 A 的流式对话。"
                  steps={INTRO_STEPS}
                  extra={
                    <pre className="whitespace-pre-wrap bg-gray-50 p-2 rounded text-xs text-gray-700">
{`yarn app:00-01-mini-server     HTTP + SSE · 端口 50000 · 仅协议 A

HTTP 数据流
  浏览器 POST /api/chat { message }
    → 闸门（400 / 503 必须在开流之前）
    → 上游 stream:true
    → 每个 chunk 写成 SSE「data: {json}\\n\\n」
    → 最后一帧 data: [DONE]`}
                    </pre>
                  }
                />

                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  <p className="text-sm text-gray-600">
                    总览页不发起模型请求。选一个场景进去跑。页脚的 Key 状态来自 GET /health。
                  </p>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                    {SCENES.map(function (s) {
                      return (
                        <a
                          key={s.href}
                          href={s.href}
                          className="border border-gray-300 hover:border-blue-500 rounded p-3 text-left"
                        >
                          <div className="font-semibold text-sm">{s.title}</div>
                          <div className="text-xs text-gray-500 mt-1">{s.desc}</div>
                        </a>
                      );
                    })}
                  </div>
                </section>

                {envError && (
                  <div className="bg-red-50 border border-red-300 rounded p-3 text-sm text-red-700">
                    {envError}
                  </div>
                )}

                <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] space-y-2 text-sm text-gray-600">
                  <p>环境自检（不调模型）：</p>
                  <ul className="list-disc pl-5 text-xs space-y-1">
                    <li>provider / model 必须跟 apps/.env 的 LLM_PROVIDER 对上，不能写死在页面里</li>
                    <li>Key ❌ 时两个场景页的发送按钮都会 disabled，不用等 503</li>
                    <li>取消、限流、协议对照不在本入口——那些在模块 02 各小节</li>
                  </ul>
                </section>
              </main>

              <EnvFooter env={env} />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
