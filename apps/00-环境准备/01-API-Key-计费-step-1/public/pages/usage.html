<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>单次计费 · API Key</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/api-client.js"></script>
  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/billing-cards.js"></script>

  <script type="text/babel">
    /**
     * 本页教学点：一次调用里 usage 分成输入 / 输出两栏，输出更贵。
     */
    const { useState } = React;

    const INTRO_STEPS = [
      "点「发送并计费」→ POST /api/billing { prompt, maxTokens }",
      "服务端非流式调一次模型，从响应里读 usage 三字段",
      "按示例单价折成输入钱 / 输出钱 / 合计，回一张 BillingMeasurement",
      "盯 completion_tokens 那一栏：字数差不多时，输出侧更烧钱",
    ];

    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo", "BillingCard", "ErrorBanner"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo, BillingCard, ErrorBanner } = window.DemoUI;
        const { callEndpoint } = window.DemoUtils;

        function App() {
          const { env, envError } = useEnvInfo();
          const [status, setStatus] = useState("idle");
          const [busy, setBusy] = useState(false);
          const [prompt, setPrompt] = useState("只回复一个字：好");
          const [maxTokens, setMaxTokens] = useState(64);
          const [measurement, setMeasurement] = useState(null);
          const [error, setError] = useState(null);

          const blocked = busy || !env.hasKey;

          async function run(body) {
            setBusy(true);
            setStatus("loading");
            setError(null);
            try {
              const result = await callEndpoint("/api/billing", body);
              if (result.status >= 400) {
                var msg = (result.data && (result.data.error || result.data.detail)) || JSON.stringify(result.data);
                setError({ title: "服务端拒绝", detail: String(msg), httpStatus: result.status });
                setStatus("error");
                setMeasurement(null);
                return;
              }
              setMeasurement(result.data.measurement);
              setStatus("ok");
            } catch (e) {
              setError({ title: "网络错误（fetch 没发出去）", detail: e.message, httpStatus: null });
              setStatus("error");
              setMeasurement(null);
            } finally {
              setBusy(false);
            }
          }

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">单次计费</h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                <PageIntro
                  summary="一次真实调用，把 prompt_tokens 和 completion_tokens 分成两栏计费。"
                  steps={INTRO_STEPS}
                />

                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  <label className="block text-sm">
                    prompt
                    <span className="block text-xs text-gray-500">点发送会真调模型。默认「只回复一个字」是为了让输出 Token 很少、对照更清楚。</span>
                    <textarea
                      className="mt-1 w-full border rounded p-2 text-sm"
                      rows={3}
                      value={prompt}
                      disabled={busy}
                      onChange={function (e) { setPrompt(e.target.value); }}
                    />
                  </label>
                  <label className="block text-sm">
                    max_tokens（1~512）
                    <span className="block text-xs text-gray-500">输出上限。撞上它时 finish_reason=length，completion_tokens 会被截在这个数附近。</span>
                    <input
                      className="mt-1 border rounded p-2 text-sm w-28"
                      type="number"
                      min={1}
                      max={512}
                      value={maxTokens}
                      disabled={busy}
                      onChange={function (e) { setMaxTokens(Number(e.target.value)); }}
                    />
                  </label>
                  <div className="flex flex-wrap gap-2">
                    <button
                      className="bg-blue-600 text-white px-3 py-1.5 rounded text-sm disabled:opacity-50"
                      disabled={blocked}
                      onClick={function () { run({ prompt: prompt, maxTokens: maxTokens }); }}
                    >
                      发送并计费
                    </button>
                    <button
                      className="border border-gray-300 px-3 py-1.5 rounded text-sm disabled:opacity-50"
                      disabled={busy}
                      onClick={function () { run({ prompt: "", maxTokens: maxTokens }); }}
                    >
                      故意发空 prompt（期望 HTTP 400）
                    </button>
                  </div>
                  {envError && <p className="text-sm text-red-700">{envError}</p>}
                  {!env.hasKey && env.port && (
                    <p className="text-xs text-red-600">Key ❌：主按钮已禁用，不用等 503。</p>
                  )}
                </section>

                <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
                  {!measurement && !error && (
                    <p className="text-sm text-gray-500">还没跑过。点发送后这里会出现一张分项账单。</p>
                  )}
                  {error && <ErrorBanner title={error.title} detail={error.detail} httpStatus={error.httpStatus} />}
                  {measurement && <BillingCard measurement={measurement} />}
                </section>
              </main>

              <EnvFooter env={env} />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
