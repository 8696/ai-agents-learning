<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Key / 计费 · 总览</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/wait-demo-ui.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/billing-cards.js"></script>

  <script type="text/babel">
    /**
     * 本页教学点：账单为什么分两栏（输入便宜、输出贵）。本页不调模型。
     */
    const { useState } = React;

    const SCENES = [
      {
        href: "/pages/usage.html",
        title: "单次计费",
        desc: "调一次模型，盯 usage 三兄弟：prompt_tokens / completion_tokens / total_tokens。",
      },
      {
        href: "/pages/compare.html",
        title: "输入/输出对照",
        desc: "长输入短输出 vs 短输入长输出。Token 多的那次，未必是更贵的那次。",
      },
    ];

    const INTRO_STEPS = [
      "页面加载 → GET /health：provider / model / Key / 示例单价（不花钱）",
      "单次计费 → POST /api/billing { prompt, maxTokens } → 一张分项账单",
      "对照页 → POST /api/billing-compare（preset 写死在服务端）→ 两张账单 + 结论",
      "真实费用永远以提供商控制台为准；本页单价只用来演示「输出更贵」",
    ];

    window.DemoUtils.waitDemoUI(
      ["PageNav", "StatusPill", "PageIntro", "EnvFooter", "useEnvInfo", "PricingTable"],
      function () {
        const { PageNav, StatusPill, PageIntro, EnvFooter, useEnvInfo, PricingTable } = window.DemoUI;

        function App() {
          const { env, envError } = useEnvInfo();
          const [status, setStatus] = useState("idle");

          React.useEffect(function () {
            if (envError) setStatus("error");
            else if (env.port) setStatus("ok");
          }, [env, envError]);

          return (
            <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
              <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
                <h1 id="page-title" className="text-xl font-semibold">API Key / 计费</h1>
                <StatusPill status={status} />
              </header>

              <main id="page-main" className="container mx-auto p-4 space-y-4">
                <PageIntro
                  summary="一次请求的账单分输入 Token 和输出 Token 两栏，输出单价通常更高。"
                  steps={INTRO_STEPS}
                  extra={
                    <pre className="whitespace-pre-wrap bg-gray-50 p-2 rounded text-xs text-gray-700">
{`usage.prompt_tokens      × 输入单价 → 输入这一栏的钱
usage.completion_tokens  × 输出单价 → 输出这一栏的钱（通常 3~5 倍）
usage.total_tokens       = 两者相加，不能直接当账单看`}
                    </pre>
                  }
                />

                <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
                  <PageNav />
                  <PricingTable pricing={env.pricing} />
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                    {SCENES.map(function (s) {
                      return (
                        <a key={s.href} href={s.href} className="border border-gray-300 hover:border-blue-500 rounded p-3">
                          <div className="font-semibold text-sm">{s.title}</div>
                          <div className="text-xs text-gray-500 mt-1">{s.desc}</div>
                        </a>
                      );
                    })}
                  </div>
                </section>

                <section id="output" className="bg-white shadow rounded p-4 min-h-[200px] text-sm text-gray-600 space-y-2">
                  {envError && <p className="text-red-700">{envError}</p>}
                  <p>本页不调模型。订阅 Key ≠ 按量 Key 仍看笔记和控制台，Demo 不覆盖。</p>
                </section>
              </main>

              <EnvFooter env={env} />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      },
    );
  </script>
</body>
</html>
