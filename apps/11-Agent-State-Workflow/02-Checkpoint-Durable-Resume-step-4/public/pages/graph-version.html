<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>检查点 · 图版本失败可见</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"
      integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB"
      crossorigin="anonymous"></script>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script src="/utils/api.js"></script>
  <script type="text/babel" src="/components/layout.js"></script>
  <script type="text/babel" src="/components/page-intro.js"></script>
  <script type="text/babel" src="/components/controls-graph-version.js"></script>
  <script type="text/babel" src="/components/graph-version-board.js"></script>
  <script type="text/babel" src="../components/page-nav.js"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { PageNav, StatusPill, PageIntro, EnvFooter, GraphVersionControls, GraphVersionBoard } = window.DemoUI;
    const DemoUtils = window.DemoUtils;

    function App() {
      const [status, setStatus] = useState("idle");
      const [env, setEnv] = useState(null);
      const [drinkName, setDrinkName] = useState("热拿铁");
      const [version, setVersion] = useState("v2");
      const [runId, setRunId] = useState("");
      const [currentVersion, setCurrentVersion] = useState("v1");
      const [last, setLast] = useState(null);
      const [error, setError] = useState(null);
      const [busy, setBusy] = useState(false);

      useEffect(function () {
        DemoUtils.loadHealth()
          .then(function (body) { setEnv(body); setStatus("ok"); })
          .catch(function () { setEnv({ port: 50124, provider: null, model: null, hasKey: false }); setStatus("error"); });
      }, []);

      async function run(action) {
        setBusy(true); setStatus("loading"); setError(null);
        try {
          const body = await action();
          setStatus("ok");
          return body;
        } catch (err) {
          setError({ message: err.message, status: err.status, code: err.code, checkpointGraphVersion: err.body && err.body.error && err.body.error.checkpointGraphVersion, currentGraphVersion: err.body && err.body.error && err.body.error.currentGraphVersion });
          setStatus("error");
        } finally { setBusy(false); }
      }

      async function onStart() {
        const body = await run(function () { return DemoUtils.startRun(drinkName); });
        if (body && body.runId) setRunId(body.runId);
        setLast(body);
      }
      async function onStep() {
        const body = await run(function () { return DemoUtils.stepOnce(runId, { keepHistory: true }); });
        setLast(body);
      }
      async function onSetVersion() {
        const body = await run(function () { return DemoUtils.setGraphVersion(version); });
        if (body) {
          setCurrentVersion(body.graphVersion);
          setLast(body);
        }
      }
      async function onReadCheckpoint() {
        const body = await run(function () { return DemoUtils.readCheckpoint(runId); });
        setLast(body);
      }

      return (
        <div className="min-h-screen bg-gray-50 text-gray-900 font-sans">
          <header id="page-header" className="border-b p-4 flex items-center justify-between bg-white">
            <h1 id="page-title" className="text-xl font-semibold">检查点（Checkpoint） · 图版本失败可见</h1>
            <StatusPill status={status} />
          </header>
          <PageNav current="graph-version" base="../" />
          <main id="page-main" className="container mx-auto p-4 space-y-4">
            <PageIntro page="graph-version" />
            <section id="controls" className="bg-white shadow rounded p-4 space-y-3">
              <GraphVersionControls
                drinkName={drinkName}
                version={version}
                runId={runId}
                currentVersion={currentVersion}
                busy={busy}
                stopped={false}
                onDrinkNameChange={setDrinkName}
                onVersionChange={setVersion}
                onStart={onStart}
                onStep={onStep}
                onSetVersion={onSetVersion}
                onReadCheckpoint={onReadCheckpoint}
              />
            </section>
            <section id="output" className="bg-white shadow rounded p-4 space-y-4 min-h-[200px]">
              <GraphVersionBoard last={last} error={error} />
            </section>
          </main>
          <EnvFooter env={env} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
